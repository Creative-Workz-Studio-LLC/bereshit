<?xml version="1.0" encoding="UTF-8"?>
<!--
  Creative Workz Studio LLC - Logo

  Design Philosophy:
  - CWS Monogram: Full company initials integrated
  - Cornerstone C: Foundation/Genesis 1:1
  - Light emanating: Creation, "Let there be light"
  - Gateway opening: Publishing house as doorway for creatives

  Colors:
  - Background: Off-white/cream (#f8f6f1) - warmth, parchment/paper
  - Deep Blue (#1a365d): Trust, depth, heavens
  - Gold (#d4a84b): Kingdom, excellence, light

  Created: 2026-02-03
  Authors: Nova Dawn, Creative Workz Studio LLC
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Radial gradient for inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f5e6c4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#d4a84b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d4a84b" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear gradient for the main C shape -->
    <linearGradient id="blueGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#1a365d"/>
      <stop offset="100%" stop-color="#2d4a6f"/>
    </linearGradient>

    <!-- Background gradient - subtle warmth -->
    <radialGradient id="bgGradient" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdfcfa"/>
      <stop offset="100%" stop-color="#f0ebe3"/>
    </radialGradient>
  </defs>

  <!-- Background removed for transparent variant -->
  <!-- Border/frame removed for transparent variant -->

  <!-- Inner glow from the opening -->
  <ellipse cx="340" cy="245" rx="85" ry="95" fill="url(#innerGlow)"/>

  <!-- Light rays emanating from the opening -->
  <g opacity="0.7">
    <!-- Ray 1 - upper -->
    <polygon points="350,190 490,120 500,150 360,210" fill="#d4a84b" opacity="0.55"/>
    <!-- Ray 2 - middle upper -->
    <polygon points="360,215 530,180 535,215 365,245" fill="#d4a84b" opacity="0.65"/>
    <!-- Ray 3 - middle -->
    <polygon points="365,250 545,250 545,285 365,280" fill="#d4a84b" opacity="0.75"/>
    <!-- Ray 4 - middle lower -->
    <polygon points="360,290 530,325 525,360 355,315" fill="#d4a84b" opacity="0.6"/>
    <!-- Ray 5 - lower -->
    <polygon points="345,330 480,410 465,435 335,350" fill="#d4a84b" opacity="0.45"/>
  </g>

  <!-- The Cornerstone "C" shape -->
  <g>
    <!-- Shadow layer -->
    <path
      d="M 330 65
         C 165 65, 65 150, 65 265
         C 65 380, 165 465, 330 465
         L 330 385
         C 200 385, 145 340, 145 265
         C 145 190, 200 145, 330 145
         L 330 65 Z"
      fill="#0a1520"
      transform="translate(4, 4)"
      opacity="0.25"
    />

    <!-- Main C shape - dark blue cornerstone -->
    <path
      d="M 330 65
         C 165 65, 65 150, 65 265
         C 65 380, 165 465, 330 465
         L 330 385
         C 200 385, 145 340, 145 265
         C 145 190, 200 145, 330 145
         L 330 65 Z"
      fill="url(#blueGradient)"
    />

    <!-- Top edge highlight -->
    <path
      d="M 325 70
         C 170 70, 75 150, 70 260"
      fill="none"
      stroke="#4a6fa5"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.45"
    />

    <!-- Inner edge highlight -->
    <path
      d="M 325 150
         C 205 150, 150 195, 150 265
         C 150 335, 205 380, 325 380"
      fill="none"
      stroke="#3d5a80"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.35"
    />
  </g>

  <!-- "WS" text - integrated with design -->
  <g>
    <!-- W -->
    <text x="95" y="560"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="72"
          font-weight="600"
          fill="#1a365d"
          letter-spacing="2">W</text>

    <!-- S -->
    <text x="175" y="560"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="72"
          font-weight="600"
          fill="#1a365d"
          letter-spacing="2">S</text>
  </g>

  <!-- Gold accent line connecting C to WS -->
  <line x1="90" y1="480" x2="240" y2="480" stroke="#d4a84b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Craftsman's mark - small dot -->
  <circle cx="265" cy="545" r="4" fill="#d4a84b" opacity="0.7"/>

</svg>
