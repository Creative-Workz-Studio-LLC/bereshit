# =============================================================================
# CWS Company Identity Manual - Build Configuration
# =============================================================================
#
# This file defines ALL build behavior. The TypeScript code is just an executor.
# To change how the manual is built, edit THIS file - not the code.
#
# Biblical Foundation:
#   "For which of you, intending to build a tower, sitteth not down first,
#    and counteth the cost, whether he have sufficient to finish it?"
#   — Luke 14:28
#
# Configuration before execution. Planning before building.
#
# =============================================================================

# -----------------------------------------------------------------------------
# Document Identity
# -----------------------------------------------------------------------------
document:
  # Master AsciiDoc file to compile
  master: book.adoc

  # Output filename (without extension)
  output_name: CWS-Company-Identity-Manual

  # Output directory (relative to company-docs/)
  output_dir: output

# -----------------------------------------------------------------------------
# Company Attributes
# -----------------------------------------------------------------------------
# These are passed to Asciidoctor and available in documents as {attribute-name}
#
attributes:
  # Branding
  company-name: Creative Workz Studio LLC
  company-short: CWS
  tagline: Where Creative Vision Meets Kingdom Purpose

  # Document settings
  doctype: book
  icons: font
  icon-set: fa
  source-highlighter: rouge
  toc: auto
  toclevels: "3"
  sectnums: ""
  sectnumlevels: "3"
  chapter-label: Chapter
  appendix-caption: Appendix

  # Styling
  experimental: ""
  reproducible: ""

# -----------------------------------------------------------------------------
# Output Formats
# -----------------------------------------------------------------------------
# Each format defines:
#   - enabled: whether to build this format by default
#   - command: the CLI tool to invoke
#   - backend: Asciidoctor backend (if applicable)
#   - extension: output file extension
#   - install: how to install the required tool
#   - args: additional command-line arguments
#   - options: format-specific options
#
formats:
  html:
    enabled: true
    command: asciidoctor
    backend: html5
    extension: .html
    install: gem install asciidoctor
    options:
      standalone: true
      toc: true
      toc_position: left
      embed_images: true
    args:
      - "-a"
      - "data-uri"

  pdf:
    enabled: true
    command: asciidoctor-pdf
    backend: pdf
    extension: .pdf
    install: gem install asciidoctor-pdf
    options:
      paper_size: A4
      compress: true
    args: []

  epub:
    enabled: true
    command: asciidoctor-epub3
    backend: epub3
    extension: .epub
    install: gem install asciidoctor-epub3
    options:
      version: 3
    args: []

  docbook:
    enabled: false
    command: asciidoctor
    backend: docbook5
    extension: .xml
    install: gem install asciidoctor
    options: {}
    args: []

# -----------------------------------------------------------------------------
# Watch Configuration
# -----------------------------------------------------------------------------
watch:
  # File patterns to watch for changes
  patterns:
    - "**/*.adoc"
    - "**/*.asciidoc"

  # Patterns to ignore
  ignore:
    - "**/node_modules/**"
    - "**/output/**"
    - "**/builder/**"

  # Debounce delay in milliseconds (wait for edits to settle)
  debounce_ms: 500

  # Formats to build on change (keep minimal for speed)
  formats:
    - html

# -----------------------------------------------------------------------------
# CLI Display
# -----------------------------------------------------------------------------
display:
  # Show banner on startup
  banner: true

  # Use colors in output
  colors: true

  # Format icons for display
  icons:
    html: "🌐"
    pdf: "📄"
    epub: "📚"
    docbook: "📋"
    success: "✓"
    failure: "✗"
    start: "▶"
    watch: "👁"
    file_change: "📝"
    clean: "🧹"
    check: "🔍"

# -----------------------------------------------------------------------------
# Assets (Required Files)
# -----------------------------------------------------------------------------
# These files must exist in the assets/ directory for complete builds.
# Missing assets will cause warnings but won't stop the build.
#
assets:
  directory: assets
  required:
    - filename: cws-logo.png
      purpose: Company logo for cover and title pages
      specifications: 600x600px recommended, transparent background
      status: pending  # pending | placeholder | final

# -----------------------------------------------------------------------------
# Version
# -----------------------------------------------------------------------------
version: "1.0.0"
