# =============================================================================
# CWS COMPANY IDENTITY MANUAL — PDF THEME
# =============================================================================
#
# Creative Workz Studio LLC
# Theme: Book/Manual (parent) with PDF rendering (class)
#
# "Write the vision, and make it plain upon tables,
#  that he may run that readeth it." — Habakkuk 2:2
#
# Design Philosophy:
#   PhD-level rigor with Kingdom accessibility.
#   Professional enough for board presentation,
#   readable enough for any stakeholder.
#
# Font Stack:
#   Body:     Noto Serif (scholarly, readable)
#   Headings: Noto Sans (clean, authoritative)
#   Code:     Noto Sans Mono (monospace, technical)
#   Hebrew:   Noto Serif Hebrew (fallback for biblical text)
#
# Color Palette:
#   Deep Blue   #1A365D — Authority, trust, Kingdom
#   Medium Blue #2B6CB0 — Links, interactive
#   Forest Green #276749 — Growth, stewardship
#   Gold        #D69E2E — Reverence, excellence
#   Text        #2D2D2D — Near-black, easy on eyes
#   Muted       #718096 — Secondary text, footers
#   Light Gray  #E2E8F0 — Borders, dividers
#   Soft BG     #F7FAFC — Sidebar, admonition backgrounds
#
# Version: 1.0.0-draft
# Authors: Nova Dawn, Seanje Lenox-Wise
# =============================================================================

extends: default


# =============================================================================
# FONT CATALOG
# =============================================================================
# System fonts from /usr/share/fonts/truetype/noto/
# GEM_FONTS_DIR provides built-in fallback glyphs
# =============================================================================

font:
  catalog:
    merge: true

    # --- Body Font: Noto Serif ---
    Noto Serif:
      normal: NotoSerif-Regular.ttf
      bold: NotoSerif-Bold.ttf
      italic: NotoSerif-Italic.ttf
      bold_italic: NotoSerif-BoldItalic.ttf

    # --- Heading Font: Noto Sans ---
    Noto Sans:
      normal: NotoSans-Regular.ttf
      bold: NotoSans-Bold.ttf
      italic: NotoSans-Italic.ttf
      bold_italic: NotoSans-BoldItalic.ttf

    # --- Code Font: Noto Sans Mono ---
    Noto Sans Mono:
      normal: NotoSansMono-Regular.ttf
      bold: NotoSansMono-Bold.ttf
      italic: NotoSansMono-Regular.ttf
      bold_italic: NotoSansMono-Bold.ttf

    # --- Hebrew Fallback: Noto Serif Hebrew ---
    Noto Serif Hebrew:
      normal: NotoSerifHebrew-Regular.ttf
      bold: NotoSerifHebrew-Bold.ttf
      italic: NotoSerifHebrew-Regular.ttf
      bold_italic: NotoSerifHebrew-Bold.ttf

    # --- Built-in fallbacks for symbol coverage ---
    M+ 1p Fallback: GEM_FONTS_DIR/mplus1p-regular-fallback.ttf

  fallbacks:
    - Noto Serif Hebrew
    - M+ 1p Fallback


# =============================================================================
# PAGE LAYOUT
# =============================================================================

page:
  layout: portrait
  size: Letter
  margin: [0.875in, 1in, 0.875in, 1in]
  background-color: #FFFFFF


# =============================================================================
# BASE TYPOGRAPHY
# =============================================================================

base:
  font-color: #2D2D2D
  font-family: Noto Serif
  font-size: 11
  line-height-length: 16.5
  line-height: $base-line-height-length / $base-font-size
  font-size-large: round($base-font-size * 1.25)
  font-size-small: round($base-font-size * 0.85)
  font-size-min: $base-font-size * 0.75
  border-color: #E2E8F0
  border-width: 0.5


# =============================================================================
# VERTICAL SPACING
# =============================================================================

vertical-spacing: 12


# =============================================================================
# HEADINGS
# =============================================================================

heading:
  font-family: Noto Sans
  font-color: #1A365D
  font-style: bold
  text-align: center
  line-height: 1.2
  margin-top: 18
  margin-bottom: 10
  min-height-after: 0.5in

  h1:
    font-size: 26
    margin-top: 0
    margin-bottom: 14

  h2:
    font-size: 22
    margin-top: 24
    margin-bottom: 12
    border-color: #E2E8F0
    border-width: 0.5

  h3:
    font-size: 17
    margin-top: 18
    margin-bottom: 8

  h4:
    font-size: 14
    font-style: bold
    margin-top: 14
    margin-bottom: 6

  h5:
    font-size: 12
    font-style: bold
    text-transform: uppercase
    margin-top: 12
    margin-bottom: 4

  h6:
    font-size: $base-font-size
    font-style: bold
    font-color: #4A5568


# =============================================================================
# TITLE PAGE
# =============================================================================

title-page:
  background-color: #FFFFFF
  font-color: #1A365D
  text-align: center
  logo:
    image: image:cws-logo.png[pdfwidth=2in]
    top: 5%
    align: center
  title:
    font-family: Noto Sans
    font-color: #1A365D
    font-size: 32
    font-style: bold
    line-height: 1.1
    top: 40%
    margin-bottom: 8
  subtitle:
    font-family: Noto Serif
    font-color: #4A5568
    font-size: 18
    font-style: italic
    line-height: 1.3
    margin-top: 8
  authors:
    font-family: Noto Sans
    font-color: #718096
    font-size: 12
    font-style: normal
    margin-top: 24
  revision:
    font-family: Noto Sans
    font-color: #A0AEC0
    font-size: 10
    font-style: normal
    margin-top: 8


# =============================================================================
# TABLE OF CONTENTS
# =============================================================================

toc:
  font-family: Noto Sans
  font-size: 10
  font-color: #2D2D2D
  line-height: 1.6
  indent: 16
  dot-leader:
    font-color: #CBD5E0
    content: '. '
    levels: 2 3

  h1-font-color: #1A365D
  h1-font-style: bold
  h1-font-size: 13
  h1-text-transform: uppercase

  h2-font-color: #2D3748
  h2-font-style: bold
  h2-font-size: 11

  h3-font-color: #4A5568
  h3-font-style: normal
  h3-font-size: 10


# =============================================================================
# LINKS
# =============================================================================

link:
  font-color: #2B6CB0


# =============================================================================
# RUNNING CONTENT — HEADERS & FOOTERS
# =============================================================================

header:
  height: 0.625in
  font-family: Noto Sans
  font-size: 8.5
  font-color: #A0AEC0
  line-height: 1
  border-color: #E2E8F0
  border-width: 0.25
  recto:
    right:
      content: '*CreativeWorkzStudio LLC* — Company Identity Manual'
  verso:
    left:
      content: '*CreativeWorkzStudio LLC* — Company Identity Manual'

footer:
  height: 0.625in
  font-family: Noto Sans
  font-size: 8.5
  font-color: #A0AEC0
  line-height: 1
  border-color: #E2E8F0
  border-width: 0.25
  recto:
    center:
      content: '{company-name} — Confidential'
    right:
      content: '{page-number}'
  verso:
    center:
      content: '{company-name} — Confidential'
    left:
      content: '{page-number}'


# =============================================================================
# LISTS
# =============================================================================

list:
  indent: $base-font-size * 1.5
  item-spacing: 4
  marker-font-color: #1A365D


# =============================================================================
# DESCRIPTION LISTS
# =============================================================================

description-list:
  term-font-style: bold
  term-font-color: #2D3748
  description-indent: $base-font-size * 2


# =============================================================================
# PARAGRAPHS
# =============================================================================

lead:
  font-size: $base-font-size-large
  line-height: 1.4
  font-color: #4A5568

abstract:
  font-size: $base-font-size-large
  font-style: italic
  font-color: #4A5568


# =============================================================================
# INLINE STYLES
# =============================================================================

codespan:
  font-family: Noto Sans Mono
  font-color: #C53030
  font-size: 0.9em
  background-color: #F7FAFC
  border-color: #E2E8F0
  border-offset: 2
  border-radius: 2
  border-width: 0.5

kbd:
  font-family: $codespan-font-family
  font-size: 0.9em
  font-color: #2D3748
  background-color: #EDF2F7
  border-color: #CBD5E0
  border-offset: 2
  border-radius: 2
  border-width: 0.5

mark:
  background-color: #FEFCBF
  font-color: #2D2D2D
  border-offset: 2


# =============================================================================
# BLOCKQUOTE / QUOTE
# =============================================================================

quote:
  font-size: $base-font-size
  font-style: italic
  font-color: #4A5568
  border-color: #D69E2E
  border-width: 3
  padding: [0, 0, 0, 12]
  cite:
    font-size: $base-font-size-small
    font-color: #718096
    font-style: normal


# =============================================================================
# CODE BLOCKS / LISTINGS
# =============================================================================

code:
  font-family: Noto Sans Mono
  font-color: #2D3748
  font-size: 9.5
  padding: 12
  line-height: 1.45
  background-color: #F7FAFC
  border-color: #E2E8F0
  border-radius: 3
  border-width: 0.5


# =============================================================================
# TABLES
# =============================================================================

table:
  font-size: $base-font-size
  border-color: #CBD5E0
  border-width: 0.5
  grid-color: #E2E8F0
  grid-width: $table-border-width
  cell-padding: [5, 8, 5, 8]

  head:
    font-family: Noto Sans
    font-style: bold
    font-color: #FFFFFF
    background-color: #1A365D
    border-bottom-width: 1.25
    border-bottom-color: #2C5282

  body:
    background-color: #FFFFFF
    stripe-background-color: #F7FAFC

  foot:
    font-style: bold
    font-color: #2D3748
    background-color: #EDF2F7


# =============================================================================
# ADMONITIONS (NOTE, TIP, IMPORTANT, WARNING, CAUTION)
# =============================================================================

admonition:
  font-size: $base-font-size
  padding: [8, 12, 8, 12]
  border-width: 0.75
  border-radius: 3

  label:
    font-family: Noto Sans
    font-style: bold
    font-size: $base-font-size
    text-transform: uppercase

  icon:
    note:
      stroke-color: #2B6CB0
    tip:
      stroke-color: #276749
    important:
      stroke-color: #D69E2E
    warning:
      stroke-color: #C53030
    caution:
      stroke-color: #9B2C2C

  column-rule-color: #E2E8F0
  column-rule-width: 0.5


# =============================================================================
# SIDEBAR
# =============================================================================

sidebar:
  background-color: #F7FAFC
  border-color: #E2E8F0
  border-radius: 3
  border-width: 0.75
  font-size: $base-font-size
  padding: [10, 14, 10, 14]

  title:
    font-family: Noto Sans
    font-style: bold
    font-color: #1A365D
    font-size: $base-font-size


# =============================================================================
# EXAMPLE BLOCK
# =============================================================================

example:
  background-color: #FFFFF0
  border-color: #D69E2E
  border-radius: 3
  border-width: 0.75
  padding: [10, 14, 10, 14]


# =============================================================================
# THEMATIC BREAK / HORIZONTAL RULE
# =============================================================================

thematic-break:
  border-color: #CBD5E0
  border-width: 0.25
  margin-top: 20
  margin-bottom: 20


# =============================================================================
# IMAGE
# =============================================================================

image:
  align: center
  border-color: #E2E8F0


# =============================================================================
# CAPTION
# =============================================================================

caption:
  font-family: Noto Sans
  font-style: italic
  font-size: $base-font-size-small
  font-color: #718096
  align: center
  margin-inside: 4


# =============================================================================
# FOOTNOTES
# =============================================================================

footnotes:
  font-size: 8.5
  font-color: #718096
  item-spacing: 4


# =============================================================================
# ROLE STYLES (Custom AsciiDoc roles)
# =============================================================================

role:
  # Kingdom gold for special emphasis
  gold:
    font-color: #D69E2E
  # Muted gray for secondary info
  muted:
    font-color: #A0AEC0
  # Blue for informational
  blue:
    font-color: #2B6CB0
  # Green for positive/growth
  green:
    font-color: #276749
  # Purple for vision/secondary identity
  purple:
    font-color: #6B46C1
  # Red for warnings/restrictions
  red:
    font-color: #C53030
  # Hebrew script — explicit font assignment for reliable rendering
  hebrew:
    font-family: Noto Serif Hebrew
    font-color: #4A5568
  # Big text for display
  big:
    font-size: $base-font-size-large
  # Small text for fine print
  small:
    font-size: $base-font-size-small


# =============================================================================
# PART / CHAPTER TITLES
# =============================================================================

part:
  font-color: #1A365D
  font-family: Noto Sans
  font-size: 30
  font-style: bold
  line-height: 1.1
  text-align: center
  padding: [108, 0, 0, 0]

chapter:
  font-color: #1A365D
  font-family: Noto Sans
  font-size: 26
  font-style: bold
  line-height: 1.15


# =============================================================================
# END OF THEME
# =============================================================================
