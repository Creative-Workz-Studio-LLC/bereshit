# =============================================================================
# CWS COMPANY IDENTITY MANUAL — PDF THEME
# =============================================================================
#
# CreativeWorkzStudio LLC
# Document: CWS-MAN-001 (Company Identity Manual)
# Theme ID: cws-manual-theme
#
# "Write the vision, and make it plain upon tables,
#  that he may run that readeth it." — Habakkuk 2:2
#
# -----------------------------------------------------------------------------
# SPECIFICATION SOURCE
# -----------------------------------------------------------------------------
# Every setting in this theme traces to the Editorial Style Guide
# (CWS-GDE-001 editorial-style-guide.adoc). Section references are
# noted inline. When the guide changes, this theme updates to match.
#
# Guide §The Standard:
#   PhD-level rigor with Kingdom accessibility.
#   Professional enough for board presentation,
#   readable enough for any stakeholder.
#
# -----------------------------------------------------------------------------
# FONT STACK (Guide §Typography > Font Stack)
# -----------------------------------------------------------------------------
#   Body:     Noto Serif      — scholarly, readable (Regular/Bold/Italic/BoldItalic)
#   Headings: Noto Sans       — clean, authoritative (Regular/Bold/Italic/BoldItalic)
#   Code:     Noto Sans Mono  — monospace, technical (Regular/Bold)
#   Hebrew:   Noto Serif Hebrew — fallback for biblical text (full weight range)
#   Symbol:   M+ 1p Fallback  — glyph coverage from GEM_FONTS_DIR
#
# Font path: /usr/share/fonts/truetype/noto/ + GEM_FONTS_DIR
# Rationale: Noto primary for multilingual support (Hebrew/niqqud critical),
#            full weight ranges, Google-maintained. Serif body + sans headings
#            is the classic academic/governance convention.
#
# -----------------------------------------------------------------------------
# COLOR PALETTE (Guide §Typography > WCAG Color Compliance)
# -----------------------------------------------------------------------------
#   Deep Blue    #1A365D — Authority, trust, Kingdom       (12.1:1 — AAA)
#   Medium Blue  #2B6CB0 — Links, interactive
#   Forest Green #276749 — Growth, stewardship
#   Gold         #D69E2E — Borders/decorative ONLY         (3.2:1 — FAIL on text)
#   Text         #2D2D2D — Body text, near-black           (14.5:1 — AAA)
#   Lead/Quote   #4A5568 — Lead text, quotes               (7.4:1  — AAA)
#   Secondary    #718096 — Muted, footers, headers          (4.6:1  — AA)
#   Light Gray   #E2E8F0 — Borders, dividers
#   Soft BG      #F7FAFC — Sidebar, code, stripe backgrounds
#
# WCAG 2.1 AA requires 4.5:1 for normal text, 3:1 for large text.
# Gold (#D69E2E) MUST NOT be used as text color on white backgrounds.
# Header/footer darkened from #A0AEC0 to #718096 for AA compliance.
#
# -----------------------------------------------------------------------------
# VERSION
# -----------------------------------------------------------------------------
# Version: 2.0.0-draft
# Authors: Nova Dawn, Seanje Lenox-Wise
# Updated: 2026-02-06
# =============================================================================

extends: default


# =============================================================================
# 1. FONT CATALOG
# =============================================================================
# Guide §Typography > Font Stack
# Source: /usr/share/fonts/truetype/noto/ (system) + GEM_FONTS_DIR (gem)
# =============================================================================

font:
  catalog:
    merge: true

    # --- Body: Noto Serif (Guide: Body font, scholarly, readable) ---
    Noto Serif:
      normal: NotoSerif-Regular.ttf
      bold: NotoSerif-Bold.ttf
      italic: NotoSerif-Italic.ttf
      bold_italic: NotoSerif-BoldItalic.ttf

    # --- Headings: Noto Sans (Guide: Heading font, clean, authoritative) ---
    Noto Sans:
      normal: NotoSans-Regular.ttf
      bold: NotoSans-Bold.ttf
      italic: NotoSans-Italic.ttf
      bold_italic: NotoSans-BoldItalic.ttf

    # --- Code: Noto Sans Mono (Guide: Code font, 9.5pt) ---
    Noto Sans Mono:
      normal: NotoSansMono-Regular.ttf
      bold: NotoSansMono-Bold.ttf
      italic: NotoSansMono-Regular.ttf
      bold_italic: NotoSansMono-Bold.ttf

    # --- Hebrew: Noto Serif Hebrew (Guide: Hebrew fallback for biblical text) ---
    Noto Serif Hebrew:
      normal: NotoSerifHebrew-Regular.ttf
      bold: NotoSerifHebrew-Bold.ttf
      italic: NotoSerifHebrew-Regular.ttf
      bold_italic: NotoSerifHebrew-Bold.ttf

    # --- Symbol: Built-in fallback for glyph coverage ---
    M+ 1p Fallback: GEM_FONTS_DIR/mplus1p-regular-fallback.ttf

  fallbacks:
    - Noto Serif Hebrew
    - M+ 1p Fallback


# =============================================================================
# 2. PAGE LAYOUT
# =============================================================================
# Guide §Page Layout > Margins and Spacing
# =============================================================================

page:
  layout: portrait
  size: Letter                   # 8.5 × 11 in (US standard)
  margin: [0.875in, 1in, 0.875in, 1in]   # top, right, bottom, left
  background-color: #FFFFFF
  # Prepress: margin-inner 0.75in (binding), margin-outer 0.59in (edge)
  numbering:
    start-at: 108                # Roman numerals (i-cvii) for frontmatter pages
                                 # Arabic 1 starts at Part I: Identity (body page 108)
                                 # UPDATE this offset when frontmatter page count changes


# =============================================================================
# 3. BASE TYPOGRAPHY
# =============================================================================
# Guide §Typography > Type Scale
# Anchor: 11pt body (Noto Serif), Perfect Fourth ratio (1.333)
# Line height: 16.5pt (150% of body — Guide §Page Layout)
# Vertical spacing: 12pt between blocks (Guide §Page Layout)
# =============================================================================

base:
  font-family: Noto Serif
  font-color: #2D2D2D            # 14.5:1 contrast — AAA
  font-size: 11                  # Type scale anchor (step 0)
  line-height-length: 16.5       # 150% of body size
  line-height: $base-line-height-length / $base-font-size
  font-size-large: round($base-font-size * 1.25)   # ~14pt (lead, [.big])
  font-size-small: round($base-font-size * 0.85)   # ~9pt ([.small])
  font-size-min: $base-font-size * 0.75
  border-color: #E2E8F0
  border-width: 0.5

vertical-spacing: 12             # Standard paragraph separation


# =============================================================================
# 4. HEADINGS
# =============================================================================
# Guide §Typography > Type Scale + §Typography > Headings
# All headings: Noto Sans Bold, deep blue (#1A365D), centered
# Sizes from Perfect Fourth scale anchored at 11pt body
# =============================================================================

heading:
  font-family: Noto Sans
  font-color: #1A365D            # 12.1:1 contrast — AAA
  font-style: bold
  text-align: left               # Governance prose: left-aligned headings
  line-height: 1.2
  margin-top: 18
  margin-bottom: 10
  min-height-after: 0.5in        # Orphan prevention (Guide §Page Layout)

  # Article (h1) — Scale step +5, 26pt
  h1:
    font-size: 26
    margin-top: 0
    margin-bottom: 14

  # Section (h2) — Scale step +4, 22pt
  h2:
    font-size: 22
    margin-top: 24
    margin-bottom: 12

  # Subsection (h3) — Scale step +3, 17pt
  h3:
    font-size: 17
    margin-top: 18
    margin-bottom: 8

  # Sub-subsection (h4) — Scale step +2, 14pt
  h4:
    font-size: 14
    font-style: bold
    margin-top: 14
    margin-bottom: 6

  # Minor heading (h5) — Sub-section, 10pt UPPERCASE
  h5:
    font-size: 10
    font-style: bold
    text-transform: uppercase
    letter-spacing: 0.05em       # Guide: readability at small uppercase sizes
    margin-top: 12
    margin-bottom: 4

  # Lowest heading (h6) — Body size, muted
  h6:
    font-size: $base-font-size
    font-style: bold
    font-color: #4A5568


# =============================================================================
# 5. GOVERNANCE HIERARCHY — PART & CHAPTER TITLES
# =============================================================================
# Guide §Document Hierarchy (6-level legal structure)
# Part = top-level grouping (Part I–IV), centered, 30pt
# Chapter = Article-level (Art. 1–11), centered, 26pt
# =============================================================================

part:
  font-family: Noto Sans
  font-color: #1A365D
  font-size: 30                  # Scale step +6 (Part title)
  font-style: bold
  line-height: 1.1
  text-align: center
  padding: [108, 0, 0, 0]

chapter:
  font-family: Noto Sans
  font-color: #1A365D
  font-size: 26                  # Scale step +5 (Article title)
  font-style: bold
  line-height: 1.15
  text-align: center


# =============================================================================
# 6. TITLE PAGE
# =============================================================================
# Auto-generated from :title-page: attribute
# Logo, company name, subtitle, authors, revision
# =============================================================================

title-page:
  background-color: #FFFFFF
  font-color: #1A365D
  text-align: center
  logo:
    image: image:cws-logo.png[pdfwidth=2in]
    top: 5%
    align: center
  title:
    font-family: Noto Sans
    font-color: #1A365D
    font-size: 32
    font-style: bold
    line-height: 1.1
    top: 40%
    margin-bottom: 8
  subtitle:
    font-family: Noto Serif
    font-color: #4A5568
    font-size: 18
    font-style: italic
    line-height: 1.3
    margin-top: 8
  authors:
    font-family: Noto Sans
    font-color: #718096          # AA compliant
    font-size: 12
    font-style: normal
    margin-top: 24
  revision:
    font-family: Noto Sans
    font-color: #718096          # Darkened from #A0AEC0 for WCAG AA
    font-size: 10
    font-style: normal
    margin-top: 8


# =============================================================================
# 7. TABLE OF CONTENTS
# =============================================================================
# Guide §AsciiDoc Publishing Reference > Auto-Generated TOC
# Three levels: Parts (h1), Articles (h2), Sections (h3)
# =============================================================================

toc:
  font-family: Noto Sans
  font-size: 10
  font-color: #2D2D2D
  line-height: 1.6
  indent: 16
  dot-leader:
    font-color: #CBD5E0
    content: '. '
    levels: 2 3

  # Part entries — bold, deep blue, uppercase
  h1-font-color: #1A365D
  h1-font-style: bold
  h1-font-size: 13
  h1-text-transform: uppercase

  # Article entries — bold, dark
  h2-font-color: #2D3748
  h2-font-style: bold
  h2-font-size: 11

  # Section entries — normal, muted
  h3-font-color: #4A5568
  h3-font-style: normal
  h3-font-size: 10


# =============================================================================
# 8. RUNNING CONTENT — HEADERS & FOOTERS
# =============================================================================
# Guide §Page Layout > Margins and Spacing (0.625in header/footer height)
# Guide §Typography > WCAG: darkened from #A0AEC0 to #718096 for AA
# =============================================================================

running_content:
  start_at: 2                    # Suppress header/footer on page 1 (title page)

header:
  height: 0.625in
  font-family: Noto Sans
  font-size: 8.5
  font-color: #718096            # WCAG AA (4.6:1) — was #A0AEC0 (2.7:1 FAIL)
  line-height: 1
  border-color: #E2E8F0
  border-width: 0.25
  recto:
    right:
      content: '*CreativeWorkzStudio LLC* — Company Identity Manual'
  verso:
    left:
      content: '*CreativeWorkzStudio LLC* — Company Identity Manual'

footer:
  height: 0.625in
  font-family: Noto Sans
  font-size: 8.5
  font-color: #718096            # WCAG AA (4.6:1) — was #A0AEC0 (2.7:1 FAIL)
  line-height: 1
  border-color: #E2E8F0
  border-width: 0.25
  recto:
    center:
      content: '{company-name} — Confidential'
    right:
      content: '{page-number}'
  verso:
    center:
      content: '{company-name} — Confidential'
    left:
      content: '{page-number}'


# =============================================================================
# 9. CONTENT ELEMENTS — PARAGRAPHS & TEXT
# =============================================================================
# Guide §Typography > Font Styling ([.lead], [.small], abstract)
# =============================================================================

prose:
  text-indent: 0.375in               # First-line indent for governance paragraphs
  margin-bottom: $vertical-spacing

lead:
  font-size: $base-font-size-large   # ~14pt
  line-height: 1.4
  font-color: #4A5568            # 7.4:1 — AAA

abstract:
  font-size: $base-font-size-large
  font-style: italic
  font-color: #4A5568

link:
  font-color: #2B6CB0            # Medium blue — interactive


# =============================================================================
# 10. CONTENT ELEMENTS — BLOCKQUOTE & SCRIPTURE
# =============================================================================
# Guide §Structural Elements + scripture rendering
# Gold border (#D69E2E) is decorative — WCAG compliant for non-text
# =============================================================================

quote:
  font-size: $base-font-size
  font-style: italic
  font-color: #4A5568            # 7.4:1 — AAA
  border-color: #D69E2E          # Gold — decorative border (WCAG: non-text OK)
  border-width: 3
  padding: [0, 0, 0, 12]
  cite:
    font-size: $base-font-size-small
    font-color: #718096
    font-style: normal


# =============================================================================
# 11. CONTENT ELEMENTS — TABLES
# =============================================================================
# Guide §Tables, Lists, and Figures > Table Conventions
# Header: bold, deep blue bg, white text
# Stripes: #F7FAFC on alternating rows
# =============================================================================

table:
  font-size: $base-font-size
  border-color: #CBD5E0
  border-width: 0.5
  grid-color: #E2E8F0
  grid-width: $table-border-width
  cell-padding: [5, 8, 5, 8]

  head:
    font-family: Noto Sans
    font-style: bold
    font-color: #FFFFFF
    background-color: #1A365D    # Deep blue header
    border-bottom-width: 1.25
    border-bottom-color: #2C5282

  body:
    background-color: #FFFFFF
    stripe-background-color: #F7FAFC

  foot:
    font-style: bold
    font-color: #2D3748
    background-color: #EDF2F7


# =============================================================================
# 12. CONTENT ELEMENTS — LISTS
# =============================================================================
# Guide §Tables, Lists, and Figures > List Conventions
# Marker color matches heading blue for visual cohesion
# =============================================================================

list:
  indent: $base-font-size * 1.5
  item-spacing: 4
  marker-font-color: #1A365D

description-list:
  term-font-style: bold
  term-font-color: #2D3748
  description-indent: $base-font-size * 2


# =============================================================================
# 13. CONTENT ELEMENTS — CODE
# =============================================================================
# Guide §Typography > Type Scale (Code: 9.5pt, Noto Sans Mono)
# =============================================================================

code:
  font-family: Noto Sans Mono
  font-color: #2D3748
  font-size: 9.5                 # Scale step -1
  padding: 12
  line-height: 1.45
  background-color: #F7FAFC
  border-color: #E2E8F0
  border-radius: 3
  border-width: 0.5

codespan:
  font-family: Noto Sans Mono
  font-color: #C53030
  font-size: 0.9em
  background-color: #F7FAFC
  border-color: #E2E8F0
  border-offset: 2
  border-radius: 2
  border-width: 0.5

kbd:
  font-family: $codespan-font-family
  font-size: 0.9em
  font-color: #2D3748
  background-color: #EDF2F7
  border-color: #CBD5E0
  border-offset: 2
  border-radius: 2
  border-width: 0.5

mark:
  background-color: #FEFCBF
  font-color: #2D2D2D
  border-offset: 2


# =============================================================================
# 14. CONTENT ELEMENTS — ADMONITIONS
# =============================================================================
# Guide §Anti-Patterns notes admonitions avoided in frontmatter,
# but they remain available for article body content.
# Icon colors map to the CWS color palette.
# =============================================================================

admonition:
  font-size: $base-font-size
  padding: [8, 12, 8, 12]
  border-width: 0.75
  border-radius: 3

  label:
    font-family: Noto Sans
    font-style: bold
    font-size: $base-font-size
    text-transform: uppercase

  icon:
    note:
      stroke-color: #2B6CB0      # Medium blue
    tip:
      stroke-color: #276749      # Forest green
    important:
      stroke-color: #D69E2E      # Gold (icon stroke — non-text, WCAG OK)
    warning:
      stroke-color: #C53030      # Red
    caution:
      stroke-color: #9B2C2C      # Dark red

  column-rule-color: #E2E8F0
  column-rule-width: 0.5


# =============================================================================
# 15. STRUCTURAL ELEMENTS
# =============================================================================
# Guide §Structural Elements (thematic breaks, sidebars, examples)
# Guide §Page Layout > Thematic Break Margins (20pt top/bottom)
# Guide §Tables, Lists, and Figures > Figure Conventions (captions)
# Guide §Typography > Footnotes (8.5pt, Noto Sans, muted)
# =============================================================================

thematic-break:
  border-color: #CBD5E0
  border-width: 0.25
  margin-top: 20                 # Guide: 20pt top
  margin-bottom: 20              # Guide: 20pt bottom

sidebar:
  background-color: #F7FAFC
  border-color: #E2E8F0
  border-radius: 3
  border-width: 0.75
  font-size: $base-font-size
  padding: [10, 14, 10, 14]
  title:
    font-family: Noto Sans
    font-style: bold
    font-color: #1A365D
    font-size: $base-font-size

example:
  background-color: #FFFFF0
  border-color: #D69E2E          # Gold border — decorative (WCAG: non-text OK)
  border-radius: 3
  border-width: 0.75
  padding: [10, 14, 10, 14]

image:
  align: center
  border-color: #E2E8F0

caption:
  font-family: Noto Sans
  font-style: italic
  font-size: $base-font-size-small
  font-color: #718096            # AA compliant
  align: center
  margin-inside: 4

footnotes:
  font-family: Noto Sans         # Guide: Noto Sans (muted) for footnotes
  font-size: 8.5                 # Scale step -2
  font-color: #718096            # AA compliant
  item-spacing: 4


# =============================================================================
# 16. CUSTOM ROLES
# =============================================================================
# Guide §AsciiDoc Publishing Reference > Custom Roles
#
# WCAG NOTE: Gold (#D69E2E) role exists for border/decorative use.
# It MUST NOT be applied to text on white backgrounds (3.2:1 — FAIL).
# For text emphasis, use [.blue] or bold instead.
# =============================================================================

role:
  # Kingdom gold — BORDERS AND DECORATIVE ONLY (WCAG: 3.2:1 fails on text)
  gold:
    font-color: #D69E2E

  # Muted — secondary information
  muted:
    font-color: #718096          # AA compliant (darkened from #A0AEC0)

  # Blue — informational emphasis
  blue:
    font-color: #2B6CB0

  # Green — growth, positive, stewardship
  green:
    font-color: #276749

  # Purple — vision, secondary identity
  purple:
    font-color: #6B46C1

  # Red — warnings, restrictions
  red:
    font-color: #C53030

  # Hebrew — explicit font assignment for reliable biblical text rendering
  hebrew:
    font-family: Noto Serif Hebrew
    font-color: #4A5568

  # Big — display text ([.big] role)
  big:
    font-size: $base-font-size-large

  # Small — fine print, metadata ([.small] role)
  small:
    font-size: $base-font-size-small


  # Title heading — clean presentation without h2 border
  title-heading:
    border-width: 0


# =============================================================================
# END OF THEME
# =============================================================================
