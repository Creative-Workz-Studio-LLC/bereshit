<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CWS Manual Builder Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!-- In-App Menu Bar (web mode — hidden in Tauri) -->
  <div class="menu-bar">
    <span class="menu-bar-item" data-action="build-book">Build</span>
    <span class="menu-bar-item" data-action="validate-lint">Validate</span>
    <span class="menu-bar-item" data-action="toggle-output">Output</span>
    <span class="menu-bar-item" data-action="preferences">Config</span>
    <span class="menu-bar-item" data-action="help-about">About</span>
  </div>

  <!-- App Layout -->
  <div class="app-layout">

    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="icon-48.png" alt="CWS" class="sidebar-logo" width="36" height="36">
        <div>
          <h1>CWS Builder</h1>
          <div class="subtitle">Company Identity Manual</div>
        </div>
      </div>

      <div class="sidebar-nav">
        <!-- Commands -->
        <div class="nav-group">
          <div class="nav-group-label">Commands</div>
          <button class="nav-item active" data-route="#/build">Build</button>
          <button class="nav-item" data-route="#/inspect">Inspect</button>
          <button class="nav-item" data-route="#/validate">Validate</button>
          <button class="nav-item" data-route="#/analysis">Analysis</button>
          <button class="nav-item" data-route="#/utility">Utility</button>
        </div>

        <!-- Observation -->
        <div class="nav-group">
          <div class="nav-group-label">Observation</div>
          <button class="nav-item" data-route="#/witness">Witness</button>
        </div>

        <!-- Configuration -->
        <div class="nav-group">
          <div class="nav-group-label">Configuration</div>
          <button class="nav-item" data-route="#/config">Settings</button>
        </div>
      </div>
    </nav>

    <!-- Content Area (router injects views here) -->
    <main class="content-area">
      <!-- Populated by router -->
    </main>

    <!-- Output Panel -->
    <div class="output-panel collapsed">
      <div class="output-header">
        <span>Output</span>
        <span class="output-toggle">&#x25B2;</span>
      </div>
      <div class="output-body">
        <!-- Output lines appear here -->
      </div>
    </div>

  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
