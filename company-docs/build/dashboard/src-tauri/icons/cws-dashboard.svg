<?xml version="1.0" encoding="UTF-8"?>
<!--
  CWS Dashboard Application Icon
  Brand: Deep Blue #1A365D, Medium Blue #2C5282, Gold #D69E2E
  Design: Document/manual with builder gear — representing the Manual Builder Dashboard
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C5282"/>
      <stop offset="100%" stop-color="#1A365D"/>
    </linearGradient>
    <!-- Gold gradient for document -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECC94B"/>
      <stop offset="100%" stop-color="#D69E2E"/>
    </linearGradient>
    <!-- Gear gradient -->
    <linearGradient id="gear-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E"/>
      <stop offset="100%" stop-color="#D69E2E"/>
    </linearGradient>
    <!-- Subtle shadow (Inkscape-compatible) -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offset"/>
      <feFlood flood-color="#0a1628" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)"/>

  <!-- Document/manual icon (centered, slightly left to make room for gear) -->
  <g transform="translate(120, 80)" filter="url(#shadow)">
    <!-- Document body -->
    <rect x="0" y="0" width="200" height="260" rx="12" ry="12" fill="url(#gold)" opacity="0.95"/>
    <!-- Folded corner -->
    <path d="M 155 0 L 200 45 L 155 45 Z" fill="#B7791F" opacity="0.6"/>
    <!-- Text lines on document -->
    <rect x="28" y="50" width="140" height="8" rx="4" fill="#1A365D" opacity="0.35"/>
    <rect x="28" y="74" width="120" height="8" rx="4" fill="#1A365D" opacity="0.35"/>
    <rect x="28" y="98" width="130" height="8" rx="4" fill="#1A365D" opacity="0.35"/>
    <rect x="28" y="130" width="140" height="8" rx="4" fill="#1A365D" opacity="0.25"/>
    <rect x="28" y="154" width="100" height="8" rx="4" fill="#1A365D" opacity="0.25"/>
    <rect x="28" y="178" width="120" height="8" rx="4" fill="#1A365D" opacity="0.25"/>
    <rect x="28" y="210" width="80" height="8" rx="4" fill="#1A365D" opacity="0.2"/>
  </g>

  <!-- Gear icon (bottom-right, overlapping document) -->
  <g transform="translate(330, 290)">
    <!-- Gear body -->
    <circle cx="60" cy="60" r="44" fill="none" stroke="url(#gear-fill)" stroke-width="16"/>
    <!-- Gear teeth (8 teeth) -->
    <g fill="url(#gear-fill)">
      <rect x="52" y="-4" width="16" height="24" rx="3"/>
      <rect x="52" y="100" width="16" height="24" rx="3"/>
      <rect x="-4" y="52" width="24" height="16" rx="3"/>
      <rect x="100" y="52" width="24" height="16" rx="3"/>
      <!-- Diagonal teeth -->
      <rect x="12" y="8" width="16" height="24" rx="3" transform="rotate(-45, 20, 20)"/>
      <rect x="88" y="8" width="16" height="24" rx="3" transform="rotate(45, 96, 20)"/>
      <rect x="12" y="88" width="16" height="24" rx="3" transform="rotate(45, 20, 100)"/>
      <rect x="88" y="88" width="16" height="24" rx="3" transform="rotate(-45, 96, 100)"/>
    </g>
    <!-- Gear center hole -->
    <circle cx="60" cy="60" r="20" fill="#1A365D"/>
    <!-- Inner dot -->
    <circle cx="60" cy="60" r="8" fill="url(#gear-fill)" opacity="0.6"/>
  </g>

  <!-- "CWS" text at bottom -->
  <text x="256" y="445" text-anchor="middle" font-family="'Noto Sans', sans-serif"
        font-size="40" font-weight="700" fill="#FFFFFF" opacity="0.9" letter-spacing="8">CWS</text>
</svg>
