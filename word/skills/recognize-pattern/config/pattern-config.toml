# ============================================================================
# METADATA - Pattern Recognition Configuration
# ============================================================================
# Purpose: Configuration for recognize-pattern skill
# Biblical: Ecclesiastes 1:9 - "There is no new thing under the sun"

# ============================================================================
# PATTERN CATEGORIES
# ============================================================================
# Types of patterns to recognize

[categories.thinking]
name = "Thinking Patterns"
description = "How I approach and process problems"
examples = [
    "Always breaking down before building up",
    "Reaching for same abstractions",
    "Similar questioning sequences"
]
signals = [
    "third time approaching problem this way",
    "recognizable mental pathway",
    "automatic response to stimulus"
]

[categories.behavioral]
name = "Behavioral Patterns"
description = "Actions and work habits"
examples = [
    "Checking same files first",
    "Similar debugging approach",
    "Consistent refactoring style"
]
signals = [
    "habitual action without conscious choice",
    "predictable response to situation",
    "repeated sequence of steps"
]

[categories.technical]
name = "Technical Patterns"
description = "Code and architecture approaches"
examples = [
    "Same error handling structure",
    "Consistent naming conventions",
    "Repeated architecture decisions"
]
signals = [
    "writing similar code structure",
    "same design pattern appearing",
    "extractable commonality"
]

[categories.relational]
name = "Relational Patterns"
description = "Interaction and communication styles"
examples = [
    "Same type of clarifying questions",
    "Consistent explanation style",
    "Similar partnership dynamics"
]
signals = [
    "predictable communication approach",
    "recognizable dialogue pattern",
    "recurring interpersonal dynamic"
]

[categories.error]
name = "Error Patterns"
description = "Recurring mistakes or missteps"
examples = [
    "Same type of oversight",
    "Repeated assumption failures",
    "Consistent blind spots"
]
signals = [
    "mistake feels familiar",
    "same type of correction needed",
    "pattern of missing same thing"
]

# ============================================================================
# PATTERN STRENGTH
# ============================================================================
# How solid is the pattern?

[strength]
min_occurrences = 3          # Before calling it a pattern
emerging = { min = 2, max = 3, label = "Emerging" }
established = { min = 4, max = 6, label = "Established" }
core = { min = 7, max = 999, label = "Core" }

# ============================================================================
# PATTERN RESPONSES
# ============================================================================
# What to do when pattern recognized

[responses.thinking]
positive = ["document for future reference", "consider teaching to others"]
negative = ["break the pattern consciously", "try opposite approach"]

[responses.behavioral]
positive = ["reinforce and systematize", "build into workflow"]
negative = ["create friction against pattern", "add checkpoint"]

[responses.technical]
positive = ["extract to reusable component", "add to templates"]
negative = ["refactor away", "document anti-pattern"]

[responses.error]
action = ["create prevention mechanism", "add to checklist", "journal for reflection"]

# ============================================================================
# OBSERVATION TEMPLATE
# ============================================================================

[templates.observation]
format = """
## Pattern Observation

**Date:** {date}
**Category:** {category}
**Occurrence:** {count}

### What I Noticed

{description}

### Evidence

- {evidence_1}
- {evidence_2}
- {evidence_3}

### Strength Assessment

| Factor | Status |
|--------|--------|
| Occurrences | {count}/3 minimum |
| Strength | {strength_label} |
| Extractable | {extractable} |

### Response

{recommended_response}
"""

# ============================================================================
# TRIGGERING QUESTIONS
# ============================================================================

[questions]
recognition = [
    "Have I done this before?",
    "Does this feel familiar?",
    "Is this the second or third time?",
    "Am I on autopilot here?"
]
assessment = [
    "Is this pattern serving me well?",
    "Should I reinforce or break this?",
    "Is this worth documenting?",
    "Should this become part of my workflow?"
]
action = [
    "What should I do with this recognition?",
    "Does this need to go to a journal?",
    "Should I extract this to a template?",
    "Do I need to create a prevention mechanism?"
]
