# ═══════════════════════════════════════════════════════════════════════════
# OmniCode Pragma Type Definitions
# ═══════════════════════════════════════════════════════════════════════════
#
# Defines valid pragma types and their format flags.
# Pragma must appear on line 1 or 2: #!omni [type] --[format]
#
# Biblical: Proverbs 4:26 - "Ponder the path of thy feet"
#
# ═══════════════════════════════════════════════════════════════════════════

[types.template]
description = "Universal/seed templates"
block_count = 4
formats = []  # Pure OmniCode only

[types.code]
description = "Executable/library code"
block_count = 4
formats = ["go", "c", "rs", "sh"]

[types.documentation]
description = "Human-readable documents"
block_count = 5
formats = ["adoc", "md"]

[types.interface]
description = "Contracts and APIs"
block_count = 3
formats = []

[types.folder]
description = "Folder metadata (root.omni)"
block_count = 3
formats = []

[types.data]
description = "Data files"
block_count = 3  # minimum, can be 4 or 5
formats = ["json", "yaml", "toml", "jsonc"]

# Format flag descriptions
[formats]
go = "Go programming language"
c = "C programming language"
rs = "Rust programming language"
sh = "Shell/Bash scripts"
adoc = "AsciiDoc markup"
md = "Markdown markup"
json = "JSON data format"
yaml = "YAML data format"
toml = "TOML data format"
jsonc = "JSON with comments"
