<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4EC9B0"/>
      <stop offset="100%" style="stop-color:#3AA08A"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C586C0"/>
      <stop offset="100%" style="stop-color:#9A6097"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4A76A"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="16" ry="16" fill="url(#bg)" stroke="#333" stroke-width="1"/>

  <!-- Central hub circle (teal) -->
  <circle cx="64" cy="58" r="18" fill="none" stroke="url(#teal)" stroke-width="2.5"/>
  <text x="64" y="65" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="18" font-weight="700"
        fill="#4EC9B0" text-anchor="middle">OC</text>

  <!-- Injection rays extending outward to language nodes -->
  <!-- Top-left: Go -->
  <line x1="50" y1="44" x2="28" y2="24" stroke="#569CD6" stroke-width="1.5" opacity="0.7"/>
  <circle cx="25" cy="21" r="6" fill="#569CD6" opacity="0.8"/>
  <text x="25" y="24" font-family="monospace" font-size="7" fill="#1E1E2E" text-anchor="middle" font-weight="700">Go</text>

  <!-- Top-right: Rust -->
  <line x1="78" y1="44" x2="100" y2="24" stroke="#CE9178" stroke-width="1.5" opacity="0.7"/>
  <circle cx="103" cy="21" r="6" fill="#CE9178" opacity="0.8"/>
  <text x="103" y="24" font-family="monospace" font-size="6" fill="#1E1E2E" text-anchor="middle" font-weight="700">Rs</text>

  <!-- Left: C -->
  <line x1="46" y1="58" x2="22" y2="58" stroke="#9CDCFE" stroke-width="1.5" opacity="0.7"/>
  <circle cx="19" cy="58" r="6" fill="#9CDCFE" opacity="0.8"/>
  <text x="19" y="61" font-family="monospace" font-size="8" fill="#1E1E2E" text-anchor="middle" font-weight="700">C</text>

  <!-- Right: TS -->
  <line x1="82" y1="58" x2="106" y2="58" stroke="#DCDCAA" stroke-width="1.5" opacity="0.7"/>
  <circle cx="109" cy="58" r="6" fill="#DCDCAA" opacity="0.8"/>
  <text x="109" y="61" font-family="monospace" font-size="6" fill="#1E1E2E" text-anchor="middle" font-weight="700">TS</text>

  <!-- Bottom-left: Py -->
  <line x1="50" y1="72" x2="28" y2="90" stroke="#B5CEA8" stroke-width="1.5" opacity="0.7"/>
  <circle cx="25" cy="93" r="6" fill="#B5CEA8" opacity="0.8"/>
  <text x="25" y="96" font-family="monospace" font-size="6" fill="#1E1E2E" text-anchor="middle" font-weight="700">Py</text>

  <!-- Bottom-right: SH -->
  <line x1="78" y1="72" x2="100" y2="90" stroke="#6A9955" stroke-width="1.5" opacity="0.7"/>
  <circle cx="103" cy="93" r="6" fill="#6A9955" opacity="0.8"/>
  <text x="103" y="96" font-family="monospace" font-size="6" fill="#1E1E2E" text-anchor="middle" font-weight="700">sh</text>

  <!-- Gold anchor at top center -->
  <circle cx="64" cy="14" r="3" fill="url(#gold)"/>

  <!-- "ecosystem" label -->
  <rect x="30" y="106" width="68" height="14" rx="3" ry="3" fill="#C586C0" opacity="0.85"/>
  <text x="64" y="116" font-family="'Segoe UI', 'Noto Sans Mono', monospace" font-size="8" font-weight="600"
        fill="#1E1E2E" text-anchor="middle">ecosystem</text>
</svg>
