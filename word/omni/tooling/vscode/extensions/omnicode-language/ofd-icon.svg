<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4A76A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4EC9B0"/>
      <stop offset="100%" style="stop-color:#3AA08A"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="16" ry="16" fill="url(#bg)" stroke="#333" stroke-width="1"/>

  <!-- Block boundary top (green) -->
  <line x1="24" y1="28" x2="104" y2="28" stroke="#6A9955" stroke-width="3" stroke-linecap="round"/>

  <!-- Section boundary (subtle green) -->
  <line x1="32" y1="52" x2="96" y2="52" stroke="#4E7A46" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6,3"/>

  <!-- Central "F" letterform in gold (compiled/folded) -->
  <text x="64" y="88" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="52" font-weight="700"
        fill="url(#gold)" text-anchor="middle" dominant-baseline="auto"
        letter-spacing="-2">F</text>

  <!-- Teal anchor dot (complement of .omni's gold dot) -->
  <circle cx="64" cy="42" r="4" fill="url(#teal)"/>

  <!-- Block boundary bottom (green) -->
  <line x1="24" y1="100" x2="104" y2="100" stroke="#6A9955" stroke-width="3" stroke-linecap="round"/>

  <!-- ".ofd" badge in gold -->
  <rect x="66" y="93" width="32" height="14" rx="3" ry="3" fill="#D4A76A" opacity="0.9"/>
  <text x="82" y="103" font-family="'Segoe UI', 'Noto Sans Mono', monospace" font-size="9" font-weight="600"
        fill="#1E1E2E" text-anchor="middle">.ofd</text>
</svg>
