        sync-interval: 10s
        snapshot-interval: 1h

  - path: /home/seanje/cws/data/databases/growth.db
    replicas:
      - type: s3
        bucket: cws-backups
        path: litestream/growth
        endpoint: https://6ba03da44b4bce57dcaaa3d3dcccc7e1.r2.cloudflarestorage.com
        force-path-style: true
        sync-interval: 10s
        snapshot-interval: 1h

  - path: /home/seanje/cws/data/databases/temporal.db
    replicas:
