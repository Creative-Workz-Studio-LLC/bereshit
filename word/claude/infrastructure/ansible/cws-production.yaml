---
# CreativeWorkzStudio LLC — CWS Production Server Setup
# Ansible Playbook for provisioning and maintaining CWS production servers
#
# Usage:
#   ansible-playbook -i inventory.ini cws-production.yaml --limit cws-oracle
#   ansible-playbook -i inventory.ini cws-production.yaml --limit cws-dell
#   ansible-playbook -i inventory.ini cws-production.yaml --limit servers
#   ansible-playbook -i inventory.ini cws-production.yaml --limit cws-oracle --tags "node,cloudflared"
#
# Tested on: Ubuntu 24.04 LTS (Oracle Cloud ARM64), Ubuntu 24.04 LTS (Dell x86_64)
#
# "Except the LORD build the house, they labour in vain that build it:
#  except the LORD keep the city, the watchman waketh but in vain." — Psalm 127:1

- name: CWS Production Server
  hosts: servers
  become: true

  vars:
    # === Service Config ===
    cws_user: seanje
    cws_group: seanje
    cws_dir: /home/{{ cws_user }}/cws
    cws_port: 3847
    cws_bin: /usr/local/bin/cws-server

    # === Node.js ===
    node_major: "20"

    # === Cloudflare ===
    cloudflared_repo: "https://pkg.cloudflare.com/cloudflared"

    # === SSH Hardening ===
    ssh_allowed_users: "seanje ubuntu"
    ssh_max_auth_tries: 3

    # === UFW Ports ===
    ufw_allowed_ports:
      - { port: "22", proto: "tcp", comment: "SSH" }
      - { port: "80", proto: "tcp", comment: "HTTP" }
      - { port: "443", proto: "tcp", comment: "HTTPS" }

    # === System Tuning ===
    vm_swappiness: 10
    inotify_max_watches: 524288
    inotify_max_instances: 512

  tasks:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 1: System Packages
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [system, always]

    - name: Install core system packages
      apt:
        name:
          - curl
          - wget
          - git
          - jq
          - unzip
          - ca-certificates
          - gnupg
          - apt-transport-https
          - software-properties-common
          - htop
          - ncdu
          - tree
          - tmux
          - rsync
        state: present
      tags: [system]

    - name: Install build essentials (for native npm modules)
      apt:
        name:
          - build-essential
          - python3
        state: present
      tags: [system, node]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 2: SSH Hardening
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Deploy SSH hardening config
      copy:
        content: |
          # CWS Server SSH Hardening
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          MaxAuthTries {{ ssh_max_auth_tries }}
          X11Forwarding no
          AllowUsers {{ ssh_allowed_users }}
        dest: /etc/ssh/sshd_config.d/cws-hardening.conf
        mode: "0644"
      notify: restart sshd
      tags: [ssh, security]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 3: Firewall (UFW)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Install UFW
      apt:
        name: ufw
        state: present
      tags: [firewall, security]

    - name: Set UFW default deny incoming
      community.general.ufw:
        direction: incoming
        default: deny
      tags: [firewall, security]

    - name: Set UFW default allow outgoing
      community.general.ufw:
        direction: outgoing
        default: allow
      tags: [firewall, security]

    - name: Allow UFW ports
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop: "{{ ufw_allowed_ports }}"
      tags: [firewall, security]

    - name: Enable UFW
      community.general.ufw:
        state: enabled
      tags: [firewall, security]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 4: Node.js (for Builder CLI)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Add NodeSource repository (official setup)
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_major }}.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list
      tags: [node]

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: true
      tags: [node]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 5: Cloudflared
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Add Cloudflare GPG key
      shell: |
        mkdir -p --mode=0755 /usr/share/keyrings
        curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
          -o /usr/share/keyrings/cloudflare-main.gpg
      args:
        creates: /usr/share/keyrings/cloudflare-main.gpg
      tags: [cloudflared]

    - name: Add Cloudflare repository
      copy:
        content: |
          deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] {{ cloudflared_repo }} noble main
        dest: /etc/apt/sources.list.d/cloudflared.list
        mode: "0644"
      tags: [cloudflared]

    - name: Install cloudflared
      apt:
        name: cloudflared
        state: present
        update_cache: true
      tags: [cloudflared]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 6: CWS Directory Structure
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Create CWS directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ cws_user }}"
        group: "{{ cws_group }}"
        mode: "0755"
      loop:
        - "{{ cws_dir }}"
        - "{{ cws_dir }}/data"
        - "{{ cws_dir }}/logs"
        - "{{ cws_dir }}/scripts"
        - "{{ cws_dir }}/website"
        - "{{ cws_dir }}/build"
        - "{{ cws_dir }}/build/builder"
        - "{{ cws_dir }}/build/builder/dist"
        - "{{ cws_dir }}/build/dashboard"
        - "{{ cws_dir }}/build/dashboard/src-web"
        - "{{ cws_dir }}/build/themes"
      tags: [structure]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 7: Healthcheck Script
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Deploy healthcheck script
      copy:
        src: files/healthcheck.sh
        dest: "{{ cws_dir }}/scripts/healthcheck.sh"
        owner: "{{ cws_user }}"
        group: "{{ cws_group }}"
        mode: "0755"
      tags: [healthcheck, monitoring]

    - name: Configure healthcheck cron
      cron:
        name: "CWS server health check"
        minute: "*/5"
        user: "{{ cws_user }}"
        job: "{{ cws_dir }}/scripts/healthcheck.sh"
      tags: [healthcheck, monitoring]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 8: systemd Service
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Deploy CWS server systemd service
      copy:
        content: |
          [Unit]
          Description=CWS Server — CreativeWorkzStudio
          After=network.target
          StartLimitIntervalSec=60
          StartLimitBurst=3

          [Service]
          Type=simple
          User={{ cws_user }}
          Group={{ cws_group }}
          WorkingDirectory={{ cws_dir }}
          Environment=CLAUDE_GLOBAL_ROOT={{ cws_dir }}/data/claude-global
          ExecStart={{ cws_bin }} --port {{ cws_port }} --website-dir {{ cws_dir }}/website --data-dir {{ cws_dir }}/data --builder-dir {{ cws_dir }}
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=cws-server

          # Security hardening
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=read-only
          ReadWritePaths={{ cws_dir }}/data {{ cws_dir }}/logs /home/{{ cws_user }}/.local/share/claude
          PrivateTmp=yes

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/cws-server.service
        mode: "0644"
      notify:
        - reload systemd
        - restart cws-server
      tags: [service]

    - name: Enable CWS server service
      systemd:
        name: cws-server
        enabled: true
        daemon_reload: true
      tags: [service]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 9: System Tuning
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Configure sysctl tuning
      copy:
        content: |
          # CreativeWorkzStudio LLC — Production Server Tuning
          #
          # Reduce swap pressure (default 60)
          vm.swappiness = {{ vm_swappiness }}
          #
          # inotify: fsnotify (Go file watchers), Node.js HMR
          fs.inotify.max_user_watches = {{ inotify_max_watches }}
          fs.inotify.max_user_instances = {{ inotify_max_instances }}
          #
          # Network tuning for web server
          net.core.somaxconn = 1024
          net.ipv4.tcp_max_syn_backlog = 1024
          net.ipv4.tcp_tw_reuse = 1
        dest: /etc/sysctl.d/99-cws-production.conf
        mode: "0644"
      notify: reload sysctl
      tags: [tuning, system]

    - name: Set timezone to UTC
      timezone:
        name: UTC
      tags: [system]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 10: Automatic Updates
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Install unattended-upgrades
      apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
      tags: [security, updates]

    - name: Enable automatic security updates
      copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
      tags: [security, updates]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 11: Log Rotation
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - name: Configure CWS log rotation
      copy:
        content: |
          {{ cws_dir }}/logs/*.log {
              weekly
              rotate 4
              compress
              delaycompress
              missingok
              notifempty
              create 0644 {{ cws_user }} {{ cws_group }}
          }
        dest: /etc/logrotate.d/cws-server
        mode: "0644"
      tags: [logging]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PHASE 12: Monitoring Stack (Prometheus + Grafana)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    # ── System Users ──

    - name: Create prometheus system user
      user:
        name: prometheus
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      tags: [monitoring]

    - name: Create node_exporter system user
      user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      tags: [monitoring]

    # ── Prometheus Directories ──

    - name: Create Prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"
      loop:
        - /etc/prometheus
        - /etc/prometheus/consoles
        - /etc/prometheus/console_libraries
        - /var/lib/prometheus
        - /var/lib/prometheus/data
      tags: [monitoring]

    # ── Download Prometheus ──

    - name: Check if Prometheus is installed
      stat:
        path: /usr/local/bin/prometheus
      register: prometheus_binary
      tags: [monitoring]

    - name: Download Prometheus (ARM64)
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v3.9.1/prometheus-3.9.1.linux-arm64.tar.gz"
        dest: /tmp/prometheus.tar.gz
      when: not prometheus_binary.stat.exists and ansible_architecture == "aarch64"
      tags: [monitoring]

    - name: Download Prometheus (x86_64)
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v3.9.1/prometheus-3.9.1.linux-amd64.tar.gz"
        dest: /tmp/prometheus.tar.gz
      when: not prometheus_binary.stat.exists and ansible_architecture == "x86_64"
      tags: [monitoring]

    - name: Extract and install Prometheus
      shell: |
        cd /tmp
        tar xzf prometheus.tar.gz
        install -m 755 prometheus-*/prometheus /usr/local/bin/
        install -m 755 prometheus-*/promtool /usr/local/bin/
        cp -r prometheus-*/consoles /etc/prometheus/
        cp -r prometheus-*/console_libraries /etc/prometheus/
        rm -rf /tmp/prometheus-* /tmp/prometheus.tar.gz
      when: not prometheus_binary.stat.exists
      tags: [monitoring]

    # ── Download Node Exporter ──

    - name: Check if node_exporter is installed
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_binary
      tags: [monitoring]

    - name: Download node_exporter (ARM64)
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-arm64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
      when: not node_exporter_binary.stat.exists and ansible_architecture == "aarch64"
      tags: [monitoring]

    - name: Download node_exporter (x86_64)
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
      when: not node_exporter_binary.stat.exists and ansible_architecture == "x86_64"
      tags: [monitoring]

    - name: Extract and install node_exporter
      shell: |
        cd /tmp
        tar xzf node_exporter.tar.gz
        install -m 755 node_exporter-*/node_exporter /usr/local/bin/
        rm -rf /tmp/node_exporter-* /tmp/node_exporter.tar.gz
      when: not node_exporter_binary.stat.exists
      tags: [monitoring]

    # ── Prometheus Config ──

    - name: Deploy Prometheus config
      copy:
        src: ../monitoring/prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: "0644"
      notify: restart prometheus
      tags: [monitoring]

    # ── systemd Units ──

    - name: Deploy Prometheus systemd unit
      copy:
        src: ../monitoring/prometheus.service
        dest: /etc/systemd/system/prometheus.service
        mode: "0644"
      notify:
        - reload systemd
        - restart prometheus
      tags: [monitoring]

    - name: Deploy node_exporter systemd unit
      copy:
        src: ../monitoring/node-exporter.service
        dest: /etc/systemd/system/node-exporter.service
        mode: "0644"
      notify:
        - reload systemd
        - restart node-exporter
      tags: [monitoring]

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        enabled: true
        state: started
        daemon_reload: true
      tags: [monitoring]

    - name: Enable and start node_exporter
      systemd:
        name: node-exporter
        enabled: true
        state: started
        daemon_reload: true
      tags: [monitoring]

    # ── Grafana (APT) ──

    - name: Add Grafana GPG key
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://apt.grafana.com/gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
      args:
        creates: /etc/apt/keyrings/grafana.gpg
      tags: [monitoring]

    - name: Add Grafana repository
      copy:
        content: |
          deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main
        dest: /etc/apt/sources.list.d/grafana.list
        mode: "0644"
      tags: [monitoring]

    - name: Install Grafana
      apt:
        name: grafana
        state: present
        update_cache: true
      tags: [monitoring]

    - name: Deploy Grafana config
      copy:
        src: ../monitoring/grafana/grafana.ini
        dest: /etc/grafana/grafana.ini
        owner: root
        group: grafana
        mode: "0640"
      notify: restart grafana
      tags: [monitoring]

    - name: Create Grafana dashboards directory
      file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: "0755"
      tags: [monitoring]

    - name: Deploy Grafana datasource provisioning
      copy:
        src: ../monitoring/grafana/provisioning/datasources/prometheus.yml
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: grafana
        mode: "0640"
      notify: restart grafana
      tags: [monitoring]

    - name: Deploy Grafana dashboard provisioning
      copy:
        src: ../monitoring/grafana/provisioning/dashboards/dashboard.yml
        dest: /etc/grafana/provisioning/dashboards/dashboard.yml
        owner: root
        group: grafana
        mode: "0640"
      notify: restart grafana
      tags: [monitoring]

    - name: Enable and start Grafana
      systemd:
        name: grafana-server
        enabled: true
        state: started
      tags: [monitoring]

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Handlers
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  handlers:
    - name: restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart cws-server
      systemd:
        name: cws-server
        state: restarted

    - name: reload sysctl
      command: sysctl --system

    - name: restart prometheus
      systemd:
        name: prometheus
        state: restarted

    - name: restart node-exporter
      systemd:
        name: node-exporter
        state: restarted

    - name: restart grafana
      systemd:
        name: grafana-server
        state: restarted
