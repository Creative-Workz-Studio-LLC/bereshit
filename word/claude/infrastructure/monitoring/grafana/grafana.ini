# ── CWS Server — Grafana Configuration ────────────────────────────────
# Serves behind Cloudflare Tunnel at grafana.creativeworkzstudio.com.
# Bound to localhost:3000 — tunnel provides HTTPS and auth relay.
#
# Deploy: ansible-playbook cws-production.yaml --tags monitoring
#   OR:  sudo cp grafana.ini /etc/grafana/grafana.ini
#         sudo systemctl restart grafana-server
# ──────────────────────────────────────────────────────────────────────

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = grafana.creativeworkzstudio.com
root_url = https://grafana.creativeworkzstudio.com
serve_from_sub_path = false

[security]
admin_user = seanje
# Admin password set on first deploy via:
#   grafana-cli admin reset-admin-password <password>
# Or via GRAFANA_ADMIN_PASSWORD env var in systemd unit override.
cookie_secure = true
cookie_samesite = strict

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console
level = info

[unified_alerting]
enabled = true

[feature_toggles]
# Enable useful features
publicDashboards = true
