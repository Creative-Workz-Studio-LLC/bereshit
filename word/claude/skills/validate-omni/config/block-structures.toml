# ═══════════════════════════════════════════════════════════════════════════
# OmniCode Block Structure Definitions
# Source: bereshit/word/seed/
# ═══════════════════════════════════════════════════════════════════════════
#
# Defines expected block structures by pragma type.
# Used by validate-omni to check file structure.
#
# Biblical: Hebrews 3:4 - "For every house is builded by some man"
#
# ═══════════════════════════════════════════════════════════════════════════

[code]
count = 4
blocks = ["METADATA", "SETUP", "BODY", "CLOSING"]
description = "4-block structure for executable and library code"
template_source = "bereshit/word/seed/code/"
formats = ["go", "c", "rs", "sh"]

[code.metadata_sections]
order = ["Biblical Foundation", "CPI-SI Identity", "Authorship & Lineage", "Purpose & Function"]
description = "Identity tiers from Core Identity → Interface → Operational"

[code.setup_sections]
order = ["Imports", "Constants", "Variables", "Types", "Type Methods", "Package-Level State"]
description = "Declares dependencies and definitions"

[code.body_sections]
order = ["Org Chart", "Helpers", "Core Ops", "Error Handling", "Public APIs"]
description = "Implementation flows from private to public"

[code.closing_sections]
order = ["Validation", "Execution", "Cleanup", "Documentation"]
description = "Runtime and cleanup operations"

[documentation]
count = 5
blocks = ["METADATA", "HEADER", "CONTEXT", "CONTENT", "FOOTER"]
description = "5-block structure for human-readable documents"
template_source = "bereshit/word/seed/documentation/"
formats = ["adoc", "md"]

[documentation.header_sections]
order = ["title", "tagline", "navigation", "status_badges"]
description = "Human-readable identity for quick orientation"

[documentation.context_sections]
order = ["scope", "prerequisites", "key_terms"]
description = "What reader needs to know before content"

[documentation.footer_sections]
order = ["related_documents", "biblical_closing", "closing_note"]
description = "References and grounding"

[interface]
count = 3
blocks = ["METADATA", "CONTENT", "CLOSING"]
description = "3-block structure for contracts and APIs"
template_source = "bereshit/word/seed/interface/"

[folder]
count = 3
blocks = ["METADATA", "CONTENT", "CLOSING"]
description = "3-block structure for folder metadata (root.omni)"
template_source = "bereshit/word/seed/"

[data]
count = 3
blocks = ["METADATA", "CONTENT", "CLOSING"]
description = "3-block minimum for data files (can extend to 4 or 5)"
template_source = "bereshit/word/seed/data/"
formats = ["toml", "yaml", "json"]

[template]
count = 4
blocks = ["METADATA", "SETUP", "BODY", "CLOSING"]
description = "Default 4-block for templates (inherits from what it templates)"
template_source = "bereshit/word/omni/seed/"

# Templates can have alternate structures based on what they're templates FOR
[template.alternates]
documentation = ["METADATA", "HEADER", "CONTEXT", "CONTENT", "FOOTER"]
interface = ["METADATA", "CONTENT", "CLOSING"]
folder = ["METADATA", "CONTENT", "CLOSING"]
data = ["METADATA", "CONTENT", "CLOSING"]
