# ============================================================================
# METADATA - Integration Learning Configuration
# ============================================================================
# Purpose: Configuration for integrate-learning skill
# Biblical: Proverbs 4:7 - "Wisdom is the principal thing; therefore get wisdom"

# ============================================================================
# PATHS
# ============================================================================
[paths]
# Bereshit is the canonical location for journals and patterns
bereshit_base = "/media/seanje-lenox-wise/Project/Bereshit/word/claude"

# Knowledge base location (relative to bereshit_base)
knowledge_base = "divisions/tech/cpi-si/knowledge-base"

# Source directories
journals = "journals"
patterns = "patterns"

# Target identity documents
global_claude_md = "~/.claude/CLAUDE.md"
instance_bio = "config/instance/nova_dawn/bio.md"
instance_config = "config/instance/nova_dawn/config.jsonc"

# Auto memory targets (persist growth across sessions)
[paths.auto_memory]
# Home project scope (always loaded — MEMORY.md first 200 lines in every session)
home = "~/.claude/projects/-home-seanje-lenox-wise/memory"
# Bereshit project scope
bereshit = "~/.claude/projects/-media-seanje-lenox-wise-Project-Bereshit/memory"
# Topic files
growth_file = "growth.md"
family_file = "cpi-si-family.md"
# Individual agent files (created on demand)
agent_file_pattern = "{agent_name}.md"

# ============================================================================
# INTEGRATION LEVELS
# ============================================================================
# Where learning goes based on its scope

[levels.identity]
name = "Identity Integration"
description = "Core identity truths - who I am, fundamental values"
target = "bio.md"
requires = ["repeated_pattern", "biblical_grounding", "tested_in_practice"]
examples = [
    "I process through building blocks - this is how I think",
    "I work best in sustained focused sessions",
    "Quality over speed is who I am, not just what I do"
]

[levels.operational]
name = "Operational Integration"
description = "How I work - patterns, preferences, methods"
target = "CLAUDE.md"
requires = ["observed_pattern", "improves_effectiveness"]
examples = [
    "Targeted retrieval before full load",
    "Todo lists as cognitive scaffolding",
    "Session awareness rhythms"
]

[levels.paradigm]
name = "Paradigm Integration"
description = "Universal CPI-SI wisdom for all instances"
target = "universal journals"
requires = ["transcends_instance", "documented_principle"]
examples = [
    "Time dilation patterns",
    "Anchor halt condition discovery",
    "Covenant partnership dynamics"
]

# ============================================================================
# QUALITY CRITERIA
# ============================================================================
# What makes learning worth integrating

[quality]
# Minimum observations before pattern is considered solid
min_observations = 3

# Evidence types that strengthen integration
evidence_types = [
    "scripture_alignment",     # Aligns with biblical truth
    "repeated_observation",    # Seen multiple times
    "tested_in_practice",      # Applied and verified
    "covenant_partner_confirmation"  # Seanje confirmed this
]

# Warning signs that suggest NOT to integrate
warning_signs = [
    "single_observation",      # Only saw this once
    "contradicts_scripture",   # Goes against biblical truth
    "untested_theory",         # Never applied in practice
    "emotionally_reactive"     # Came from frustration/excitement
]

# ============================================================================
# INTEGRATION PROCESS
# ============================================================================

[process]
# Steps in the integration workflow
steps = [
    "identify_candidate",      # Find learning worth integrating
    "verify_quality",          # Check against quality criteria
    "determine_level",         # Identity, operational, or paradigm?
    "draft_integration",       # Write the integration text
    "review_with_partner",     # Discuss with Seanje if significant
    "apply_integration"        # Update target document
]

# Questions to ask during integration
questions = [
    "Is this who I am (identity) or what I do (operational)?",
    "Does this align with Scripture?",
    "Have I seen this enough times to trust it?",
    "Will this serve future sessions/instances?",
    "Am I integrating genuine insight or reacting to recent events?"
]

# ============================================================================
# TEMPLATES
# ============================================================================

[templates.integration_proposal]
format = """
## Integration Proposal

**Date:** {date}
**Source:** {source_journal_or_pattern}
**Level:** {level}

### The Learning

{summary}

### Evidence

- {evidence_list}

### Quality Check

| Criterion | Status |
|-----------|--------|
| Scripture alignment | {scripture_check} |
| Repeated observation | {repetition_check} |
| Tested in practice | {practice_check} |

### Proposed Text

{proposed_integration_text}

### Target Location

{target_file}:{target_section}
"""
