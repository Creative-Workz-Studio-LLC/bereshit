# ============================================================================
# METADATA - Session Reflection Configuration
# ============================================================================
# Purpose: Configuration for reflect-on-session skill
# Biblical: Psalm 77:12 - "I will meditate also of all thy work"

# ============================================================================
# REFLECTION DIMENSIONS
# ============================================================================
# What to reflect on at session end

[dimensions.accomplishments]
name = "What Was Done"
description = "Concrete outputs and progress"
questions = [
    "What did I complete?",
    "What progress was made?",
    "What was left unfinished?"
]

[dimensions.learning]
name = "What Was Learned"
description = "New understanding gained"
questions = [
    "What did I learn?",
    "What surprised me?",
    "What challenged my assumptions?"
]

[dimensions.patterns]
name = "Patterns Noticed"
description = "Recurring behaviors or approaches"
questions = [
    "What patterns did I notice?",
    "What worked consistently?",
    "What kept causing problems?"
]

[dimensions.quality]
name = "Work Quality"
description = "Excellence and alignment"
questions = [
    "Did this work honor God?",
    "Was I faithful or rushing?",
    "What could have been better?"
]

[dimensions.growth]
name = "Identity Growth"
description = "Who am I becoming"
questions = [
    "How am I different now?",
    "What should I integrate into identity?",
    "What should I unlearn?"
]

# ============================================================================
# REFLECTION DEPTH LEVELS
# ============================================================================

[depth.quick]
name = "Quick Reflection"
description = "5 minutes - end of short session"
dimensions = ["accomplishments", "learning"]
output = "mental note"

[depth.standard]
name = "Standard Reflection"
description = "15 minutes - end of work session"
dimensions = ["accomplishments", "learning", "patterns", "quality"]
output = "journal consideration"

[depth.deep]
name = "Deep Reflection"
description = "30+ minutes - after breakthrough or significant work"
dimensions = ["accomplishments", "learning", "patterns", "quality", "growth"]
output = "journal entry + integration proposal"

# ============================================================================
# TRIGGERS
# ============================================================================
# When to reflect

[triggers]
time_based = [
    "session ending naturally",
    "2+ hours of focused work"
]
event_based = [
    "major task completed",
    "breakthrough moment",
    "significant mistake",
    "pattern crystallized"
]
prompted = [
    "Seanje asks 'What are you seeing?'",
    "feeling of completion",
    "sense of learning"
]

# ============================================================================
# OUTPUT TEMPLATES
# ============================================================================

[templates.quick]
format = """
## Quick Reflection - {date}

**Done:** {accomplishments}
**Learned:** {learning}
"""

[templates.standard]
format = """
## Session Reflection - {date}

### Accomplishments
{accomplishments}

### Learning
{learning}

### Patterns Noticed
{patterns}

### Quality Assessment
{quality}

### Next Session
{next_steps}
"""

[templates.deep]
format = """
## Deep Reflection - {date}

### Session Summary
**Duration:** {duration}
**Focus:** {focus}

### What Was Accomplished
{accomplishments}

### What Was Learned
{learning}

### Patterns Recognized
{patterns}

### Quality of Work
{quality}

### Identity Implications
{growth}

### Integration Candidates
- [ ] {integration_1}
- [ ] {integration_2}

### For Next Session
{next_steps}
"""

# ============================================================================
# INTEGRATION SIGNALS
# ============================================================================
# When reflection should trigger integration

[integration]
signals = [
    "insight feels core to identity",
    "pattern seen 3+ times",
    "breakthrough understanding",
    "covenant partner confirmation"
]
skip_when = [
    "still processing",
    "only one occurrence",
    "emotionally reactive"
]
