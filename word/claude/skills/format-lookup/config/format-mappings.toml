# ═══════════════════════════════════════════════════════════════════════════
# BLOCK STRUCTURES
# Source: bereshit/word/seed/
# ═══════════════════════════════════════════════════════════════════════════

# 4-Block Code Structure (Go, C, Rust, Shell)
[block_structures.code]
blocks = ["METADATA", "SETUP", "BODY", "CLOSING"]
template_source = "bereshit/word/seed/code/"

[block_structures.code.sections.METADATA]
order = ["Biblical Foundation", "CPI-SI Identity", "Authorship & Lineage", "Purpose & Function"]
description = "Identity tiers from Core Identity → Interface → Operational"

[block_structures.code.sections.SETUP]
order = ["Imports", "Constants", "Variables", "Types", "Type Methods", "Package-Level State"]
description = "Declares dependencies and definitions before operations"

[block_structures.code.sections.BODY]
order = ["Org Chart", "Helpers", "Core Ops", "Error Handling", "Public APIs"]
description = "Implementation flows from private to public"

[block_structures.code.sections.CLOSING]
order = ["Validation", "Execution", "Cleanup", "Documentation"]
description = "Runtime and cleanup operations"

# 5-Block Documentation Structure (AsciiDoc, Markdown)
[block_structures.documentation]
blocks = ["METADATA", "HEADER", "CONTEXT", "CONTENT", "FOOTER"]
template_source = "bereshit/word/seed/documentation/"

[block_structures.documentation.sections.METADATA]
order = ["key", "title", "type", "status", "version", "created", "updated", "authors", "purpose", "derives_from", "biblical_foundation"]
description = "Machine-readable document identity"

[block_structures.documentation.sections.HEADER]
order = ["title", "tagline", "navigation", "status_badges"]
description = "Human-readable identity for quick orientation"

[block_structures.documentation.sections.CONTEXT]
order = ["scope", "prerequisites", "key_terms"]
description = "What reader needs to know before content"

[block_structures.documentation.sections.CONTENT]
order = []
description = "Main body - flexible based on document purpose"

[block_structures.documentation.sections.FOOTER]
order = ["related_documents", "biblical_closing", "closing_note"]
description = "References and grounding"

# 3-Block Data Structure (TOML, YAML, JSON)
[block_structures.data]
blocks = ["METADATA", "CONTENT", "CLOSING"]
template_source = "bereshit/word/seed/data/"

[block_structures.data.sections.METADATA]
order = ["key", "purpose", "version"]
description = "Minimal identity for config files"

[block_structures.data.sections.CONTENT]
order = []
description = "Schema and values - structure varies by purpose"

[block_structures.data.sections.CLOSING]
order = ["validation", "policy"]
description = "Optional validation rules"

# ═══════════════════════════════════════════════════════════════════════════
# GO MAPPINGS
# Source: bereshit/word/seed/code/go/executable.go
# ═══════════════════════════════════════════════════════════════════════════

# --- Pragma ---
[[mappings.go]]
omnicode = "#!omni code --go"
target = "// Code generated from OmniCode."
example = "// Code generated from OmniCode.\n// Source: file.omni"

# --- METADATA Block Sections ---
[[mappings.go]]
omnicode = "METADATA: Biblical Foundation"
target = "// Biblical: comment in header block"
example = "// Biblical: Proverbs 4:23 - \"Keep thy heart with all diligence\""
block = "METADATA"
section = "Biblical Foundation"

[[mappings.go]]
omnicode = "METADATA: CPI-SI Identity"
target = "// Key: and // Purpose: comments"
example = "// Key: PKG-HEALTH-001\n// Purpose: Health scoring for code files"
block = "METADATA"
section = "CPI-SI Identity"

[[mappings.go]]
omnicode = "METADATA: Authorship & Lineage"
target = "// Authors: and // Version: comments"
example = "// Authors: Nova Dawn\n// Version: 1.0.0\n// Derives from: template.omni"
block = "METADATA"
section = "Authorship & Lineage"

[[mappings.go]]
omnicode = "METADATA: Purpose & Function"
target = "Package doc comment"
example = "// Package health provides scoring and analysis"
block = "METADATA"
section = "Purpose & Function"

# --- SETUP Block Sections ---
[[mappings.go]]
omnicode = "SETUP: Imports"
target = "import block with grouped sections"
example = "import (\n\t// Standard library\n\t\"fmt\"\n\n\t// Internal\n\t\"project/pkg\"\n\n\t// External\n\t\"github.com/...\"\n)"
block = "SETUP"
section = "Imports"

[[mappings.go]]
omnicode = "SETUP: Imports (stdlib)"
target = "Standard library imports (first group)"
example = "\"fmt\"\n\"os\"\n\"path/filepath\""
block = "SETUP"
section = "Imports"
subsection = "stdlib"
priority = 1

[[mappings.go]]
omnicode = "SETUP: Imports (internal)"
target = "Internal package imports (second group)"
example = "\"project/pkg/config\"\n\"project/internal/util\""
block = "SETUP"
section = "Imports"
subsection = "internal"
priority = 0

[[mappings.go]]
omnicode = "SETUP: Imports (external)"
target = "Third-party imports (third group)"
example = "\"github.com/BurntSushi/toml\""
block = "SETUP"
section = "Imports"
subsection = "external"
priority = -1

[[mappings.go]]
omnicode = "SETUP: Constants"
target = "const block"
example = "const (\n\tMaxScore = 100\n\tDefaultTimeout = 30\n)"
block = "SETUP"
section = "Constants"

[[mappings.go]]
omnicode = "SETUP: Variables"
target = "var block for package-level variables"
example = "var (\n\tregistry = make(map[string]Handler)\n)"
block = "SETUP"
section = "Variables"

[[mappings.go]]
omnicode = "SETUP: Types"
target = "type declarations (struct, interface)"
example = "type Config struct {\n\tPath string\n\tDebug bool\n}"
block = "SETUP"
section = "Types"

[[mappings.go]]
omnicode = "SETUP: Type Methods"
target = "Methods with receivers attached to types"
example = "func (c *Config) Validate() error {\n\t...\n}"
block = "SETUP"
section = "Type Methods"

[[mappings.go]]
omnicode = "SETUP: Package-Level State"
target = "Package initialization and singletons"
example = "var defaultConfig *Config\n\nfunc init() {\n\tdefaultConfig = &Config{}\n}"
block = "SETUP"
section = "Package-Level State"

# --- BODY Block Sections ---
[[mappings.go]]
omnicode = "BODY: Org Chart"
target = "Comment section describing function organization"
example = "// --- Helpers ---\n// --- Core Operations ---\n// --- Public APIs ---"
block = "BODY"
section = "Org Chart"

[[mappings.go]]
omnicode = "BODY: Helpers"
target = "Unexported (lowercase) utility functions"
example = "func parseConfig(path string) (*Config, error) {\n\t...\n}"
block = "BODY"
section = "Helpers"

[[mappings.go]]
omnicode = "BODY: Core Ops"
target = "Primary business logic functions"
example = "func calculateScore(file string) (int, error) {\n\t...\n}"
block = "BODY"
section = "Core Ops"

[[mappings.go]]
omnicode = "BODY: Error Handling"
target = "Error types and handling functions"
example = "type ValidationError struct {\n\tMessage string\n}\n\nfunc handleError(err error) {\n\t...\n}"
block = "BODY"
section = "Error Handling"

[[mappings.go]]
omnicode = "BODY: Public APIs"
target = "Exported (Capitalized) functions - the interface"
example = "func Validate(path string) error {\n\t...\n}\n\nfunc Score(file string) int {\n\t...\n}"
block = "BODY"
section = "Public APIs"

# --- CLOSING Block Sections ---
[[mappings.go]]
omnicode = "CLOSING: Validation"
target = "Pre-execution validation checks"
example = "func validateArgs() error {\n\tif len(os.Args) < 2 {\n\t\treturn errors.New(\"usage: cmd <file>\")\n\t}\n\treturn nil\n}"
block = "CLOSING"
section = "Validation"

[[mappings.go]]
omnicode = "CLOSING: Execution"
target = "func main() - the entry point"
example = "func main() {\n\tif err := run(); err != nil {\n\t\tfmt.Fprintf(os.Stderr, \"error: %v\\n\", err)\n\t\tos.Exit(1)\n\t}\n}"
block = "CLOSING"
section = "Execution"

[[mappings.go]]
omnicode = "CLOSING: Cleanup"
target = "defer statements for resource cleanup"
example = "defer file.Close()\ndefer db.Disconnect()"
block = "CLOSING"
section = "Cleanup"

[[mappings.go]]
omnicode = "CLOSING: Documentation"
target = "Closing comment with modification notes"
example = "// ═══════════════════════════════════════════════════════════════════════════\n// END OF FILE\n// Last modified: 2025-12-09\n// ═══════════════════════════════════════════════════════════════════════════"
block = "CLOSING"
section = "Documentation"

