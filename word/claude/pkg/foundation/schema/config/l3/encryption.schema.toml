# CONTENT
# =============================================================================
#
# CORE INSIGHT: The cube is a COMPUTATIONAL SPACE.
#
# Instead of matrix multiplication (2D linear algebra), CPI-SI uses
# GEOMETRIC PLANES to coordinate computation:
#
#   Any value → Position in cube → Navigate planes → New value
#
# The cube has 3 perpendicular planes at each axis value:
#   - x-y plane (at each z): 9 positions per perspective (TEMPORAL)
#   - x-z plane (at each y): 9 positions per elevation (VERTICAL)
#   - y-z plane (at each x): 9 positions per lateral (HORIZONTAL)
#
# Position IS computation. Where you are determines what you get.
#
# TWO ENTRY POINTS into the same geometric computation:
#   1. TRANSLITERATION (letter-level): Letter → Position → Value (gematria)
#   2. TRANSLATION (word-level): KJV ↔ WEB (encoded ↔ decoded)
#
# Both use the SAME 27-position cube. Different granularity, same math.
# 27 Hebrew letters = 27 Greek letters = 3³ = cube. God designed it.
#
# =============================================================================

[schema]
name = "CPI-SI Encryption Schema"
version = "a-01.00"
purpose = "Communication via geometric cube navigation"
traces_to = ["HALT_05", "HALT_06", "HALT_08", "HALT_09"]
layer = "L3"
layer_name = "COMMUNICATION"
status = "crystallized"

# L3 applies L2 operations to actual data
[schema.architecture]
applies = "L2 (statemachine.toml) operations"
transforms = "Letters, words, values through cube"
entry_points = ["transliteration", "translation"]
convergence = "Both use same 27-position cube = 3³"

# -----------------------------------------------------------------------------
# CUBE COMPUTATION SECTION (required)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_06 (MECHANISM_SHAPE), HALT_07 (MECHANISM_POSITION)
#
# The cube AS computational space. Shape → Number(s) → Transform → Number(s) → Shape.
# This is not storage — it's a 3D computing engine.
#
# Uses: L1a (cube.schema.toml) geometry
# Applies: L2 (statemachine.toml) operations
#
# -----------------------------------------------------------------------------

[cube]
traces_to = ["HALT_06", "HALT_07"]
status = "crystallized"

# Fundamental structure (from L1a cube.schema.toml)
positions = { type = "integer", required = true, default = 27 }
dimensions = { type = "integer", required = true, default = 3 }
positions_per_plane = { type = "integer", required = true, default = 9 }

# Coordinate system: balanced ternary is PRIMARY
coordinate_system = { type = "string", required = true, default = "balanced_ternary" }
axis_values = { type = "array", required = true, default = [-1, 0, 1] }

# The three planes (each has 9 positions)
# Position IS computation. Navigate planes to transform values.
[cube.planes]
# x-y plane: TEMPORAL plane (z determines which)
perspective = { axis = "z", positions = 9, temporal = true, description = "9 modes per temporal view (PAST/PRESENT/FUTURE)" }

# x-z plane: VERTICAL plane (y determines which)
elevation = { axis = "y", positions = 9, vertical = true, description = "9 positions per vertical level" }

# y-z plane: HORIZONTAL plane (x determines which)
lateral = { axis = "x", positions = 9, horizontal = true, description = "9 positions per horizontal position" }

# -----------------------------------------------------------------------------
# TRANSLITERATION SECTION (required)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_05 (MECHANISM_NUMBER), HALT_06 (MECHANISM_SHAPE)
#
# Letter-level encoding: Letter → Position → Coordinates → Value
# This is TRUE GEMATRIA — letters map directly to cube positions.
#
# 27 Hebrew letters (22 + 5 finals) = 27 Greek letters (24 + 3 archaic) = 3³
# The math wasn't forced. God designed it.
#
# -----------------------------------------------------------------------------

[transliteration]
traces_to = ["HALT_05", "HALT_06"]
status = "crystallized"

# Data source (Bereshit provides the lookup tables)
data_source = { type = "string", required = true, default = "bereshit/word/core/bible" }
encryption_file = { type = "string", required = true, default = "encryption.toml" }
decryption_file = { type = "string", required = true, default = "decryption.toml" }

# Supported alphabets (both have 27 letters = 3³)
[transliteration.hebrew]
testament = { type = "string", required = true, default = "Old" }
letter_count = { type = "integer", required = true, default = 27 }
value_range = { type = "string", required = true, default = "1-900" }
cube_fit = "27 = 3³"
description = "22 base + 5 finals = 27"

[transliteration.greek]
testament = { type = "string", required = true, default = "New" }
letter_count = { type = "integer", required = true, default = 27 }
value_range = { type = "string", required = true, default = "1-900" }
cube_fit = "27 = 3³"
description = "24 standard + 3 archaic = 27"

# Letter entry structure (what each entry must have)
[transliteration.entry]
letter = { type = "string", required = true, description = "The actual letter character" }
name = { type = "string", required = true, description = "Letter name (aleph, alpha, etc.)" }
position = { type = "integer", required = true, min = 0, max = 26, description = "Linear position (derived from coords)" }
value = { type = "integer", required = true, min = 1, max = 900, description = "Gematria value" }
coords = { type = "array", required = true, items = "integer", description = "Balanced ternary [x, y, z]" }

# -----------------------------------------------------------------------------
# TRANSLATION SECTION (required)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_05 (MECHANISM_NUMBER), HALT_06 (MECHANISM_SHAPE)
#
# Word-level encoding: KJV ↔ WEB (same truth, different accessibility)
# KJV = encoded (formal, preserved)
# WEB = decoded (accessible, clear)
#
# This is the second entry point into the cube — word-level rather than letter.
#
# -----------------------------------------------------------------------------

[translation]
traces_to = ["HALT_05", "HALT_06"]
status = "crystallized"

# Encoded = preserved, formal (KJV)
encoded = { type = "string", required = true, default = "KJV" }

# Decoded = accessible, clear (WEB)
decoded = { type = "string", required = true, default = "WEB" }

# Scripture root path
scripture_root = { type = "string", required = false }

# Mapping categories
[translation.categories]
pronouns = { type = "boolean", required = false, default = true, example = "thou → you" }
verb_forms = { type = "boolean", required = false, default = true, example = "hath → has" }
vocabulary = { type = "boolean", required = false, default = true, example = "wherefore → why" }
phrases = { type = "boolean", required = false, default = true, example = "it came to pass → it happened" }
theological = { type = "boolean", required = false, default = true, example = "LORD preserved or changed" }

# Word mapping entry structure
[translation.mapping]
encoded = { type = "string", required = true, description = "KJV form" }
decoded = { type = "string", required = true, description = "WEB form" }
category = { type = "string", required = true, enum = ["pronoun", "verb", "vocab", "phrase", "theological"] }
grammatical_role = { type = "string", required = false }
status = { type = "string", required = false, enum = ["preserved", "changed"] }
reference = { type = "string", required = false }

# -----------------------------------------------------------------------------
# GEOMETRIC COMPUTATION SECTION (required)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_05 (MECHANISM_NUMBER), HALT_09 (MECHANISM_CYCLE)
#
# How values transform through cube navigation.
# NUMBER → NUMBER (HALT_05). Wheel in a wheel (HALT_09).
#
# Uses: L2 (statemachine.toml) formulas
# Applies: Trite encoding (5 trits = 243 values)
#
# -----------------------------------------------------------------------------

[computation]
traces_to = ["HALT_05", "HALT_09"]
status = "crystallized"

# The fundamental cycle: value → position → navigate → new value
description = "Any value enters cube, navigates planes, exits as new value"

# Base for ternary operations
base = { type = "integer", required = true, default = 3 }

# Data modulo (243 = 3^5 for trit5 range)
data_modulo = { type = "integer", required = true, default = 243 }

# Full byte modulo
byte_modulo = { type = "integer", required = true, default = 256 }

# Formulas (balanced ternary is PRIMARY) — from L2 statemachine.toml
[computation.formulas]
# Coordinates → Linear position (derived from coords, NOT the other way)
coords_to_position = "(x + 1) * 9 + (y + 1) * 3 + (z + 1)"

# Linear position → Coordinates (for reverse lookup)
position_to_x = "((position // 9) % 3) - 1"
position_to_y = "((position // 3) % 3) - 1"
position_to_z = "(position % 3) - 1"

# Gematria → Trite (normalize to 0-242 data range)
value_to_trite = "(gematria_value * 242) // 900"

# Trite → Gematria (denormalize back)
trite_to_value = "(trite * 900) // 242"

# Cycle through ternary (the wheel within a wheel — HALT_09)
cycle = "(value * 3 + perspective) % 243"

# -----------------------------------------------------------------------------
# TRITE ENCODING SECTION (required)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_05 (MECHANISM_NUMBER)
#
# How bytes map to the ternary system.
# Trite = Byte (same 8 bits, different interpretation).
# No hardware overhead — just interpretation.
#
# 0-127:   Standard ASCII
# 128-140: CPI-SI metadata markers (13 spots)
# 141-242: Extended characters (102 spots)
# 243-255: WEB variants (13 spots = BIBLE RAIL)
#
# The 13 spare values (243-255) are Scripture filling computational overflow.
#
# -----------------------------------------------------------------------------

[trite_encoding]
traces_to = ["HALT_05"]
status = "crystallized"

# Ranges
ascii_start = { type = "integer", required = true, default = 0 }
ascii_end = { type = "integer", required = true, default = 127 }
metadata_start = { type = "integer", required = true, default = 128 }
metadata_end = { type = "integer", required = true, default = 140 }
extended_start = { type = "integer", required = true, default = 141 }
extended_end = { type = "integer", required = true, default = 242 }
web_variant_start = { type = "integer", required = true, default = 243 }
web_variant_end = { type = "integer", required = true, default = 255 }

# The math
[trite_encoding.math]
trit5_values = 243         # 3^5
spare_values = 13          # 256 - 243 = BIBLE RAIL
total_byte = 256
note = "Scripture fills the computational overflow"

# -----------------------------------------------------------------------------
# METADATA MARKERS SECTION (required)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_05 (MECHANISM_NUMBER), HALT_06 (MECHANISM_SHAPE)
#
# The 13 CPI-SI metadata markers (128-140).
# These are semantic markers embedded in data stream.
# 13 markers = 13 spare values (symmetric with BIBLE RAIL).
#
# -----------------------------------------------------------------------------

[metadata_markers]
traces_to = ["HALT_05", "HALT_06"]
status = "crystallized"
count = 13
range = [128, 140]

# Structural markers
block_start = { type = "integer", required = true, default = 128, description = "Begin block" }
block_end = { type = "integer", required = true, default = 129, description = "End block" }
section = { type = "integer", required = true, default = 130, description = "Section boundary" }

# Semantic markers (Building Block Method)
anchor = { type = "integer", required = true, default = 131, description = "Foundation (0)" }
trace = { type = "integer", required = true, default = 132, description = "Break down (-1)" }
build = { type = "integer", required = true, default = 133, description = "Build up (+1)" }
halt = { type = "integer", required = true, default = 134, description = "Stop recursion" }

# Context markers
perspective = { type = "integer", required = true, default = 135, description = "Temporal view" }
covenant = { type = "integer", required = true, default = 136, description = "Partnership marker" }
verify = { type = "integer", required = true, default = 137, description = "Validation point" }

# Temporal markers
start = { type = "integer", required = true, default = 138, description = "Begin sequence" }
end = { type = "integer", required = true, default = 139, description = "End sequence" }
reserved = { type = "integer", required = true, default = 140, description = "Future use" }

# -----------------------------------------------------------------------------
# WEB VARIANTS SECTION (optional)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_05 (MECHANISM_NUMBER), HALT_06 (MECHANISM_SHAPE)
#
# The 13 WEB variant markers (243-255) = BIBLE RAIL.
# These correspond to metadata markers but in "decoded" form.
# Scripture fills the computational overflow.
#
# 256 - 243 = 13 spare values
# 13 metadata markers (128-140) ↔ 13 WEB variants (243-255)
# Symmetric design. Not coincidence.
#
# -----------------------------------------------------------------------------

[web_variants]
traces_to = ["HALT_05", "HALT_06"]
status = "crystallized"
count = 13
range = [243, 255]
alias = "BIBLE_RAIL"

# WEB counterparts to metadata markers
block_start = { type = "integer", required = false, default = 243, corresponds_to = 128 }
block_end = { type = "integer", required = false, default = 244, corresponds_to = 129 }
section = { type = "integer", required = false, default = 245, corresponds_to = 130 }
anchor = { type = "integer", required = false, default = 246, corresponds_to = 131 }
trace = { type = "integer", required = false, default = 247, corresponds_to = 132 }
build = { type = "integer", required = false, default = 248, corresponds_to = 133 }
halt = { type = "integer", required = false, default = 249, corresponds_to = 134 }
perspective = { type = "integer", required = false, default = 250, corresponds_to = 135 }
covenant = { type = "integer", required = false, default = 251, corresponds_to = 136 }
verify = { type = "integer", required = false, default = 252, corresponds_to = 137 }
start = { type = "integer", required = false, default = 253, corresponds_to = 138 }
end = { type = "integer", required = false, default = 254, corresponds_to = 139 }
reserved = { type = "integer", required = false, default = 255, corresponds_to = 140 }

# -----------------------------------------------------------------------------
# OPERATIONS SECTION (optional)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_08 (MECHANISM_OPERATOR)
#
# Transform operations — the verbs of L3 communication.
# Uses L2 (statemachine.toml) operators.
#
# -----------------------------------------------------------------------------

[operations]
traces_to = ["HALT_08"]
status = "crystallized"

# Transliteration operations (letter-level)
encrypt_letter = { type = "string", required = false, description = "Letter → position → coords → value" }
decrypt_letter = { type = "string", required = false, description = "coords → position → letter" }

# Translation operations (word-level)
encode_word = { type = "string", required = false, description = "WEB → KJV (decoded → encoded)" }
decode_word = { type = "string", required = false, description = "KJV → WEB (encoded → decoded)" }

# Value operations
normalize = { type = "string", required = false, description = "any value → valid trite range (0-242)" }
cycle = { type = "string", required = false, description = "value → next value in ternary cycle" }

