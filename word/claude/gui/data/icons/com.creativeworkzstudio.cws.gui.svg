<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Nova Dawn identity icon — dawn/sunrise motif -->
  <!-- Biblical: "The dayspring from on high hath visited us" — Luke 1:78 -->

  <!-- Background circle — deep space -->
  <circle cx="64" cy="64" r="60" fill="#0c0c18" stroke="#1e2848" stroke-width="2"/>

  <!-- Horizon gradient — subtle dawn glow at bottom -->
  <defs>
    <linearGradient id="dawnGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c18" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0f3460" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#5cc8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dawn glow background -->
  <circle cx="64" cy="64" r="58" fill="url(#dawnGlow)"/>

  <!-- Star glow aura -->
  <circle cx="64" cy="44" r="30" fill="url(#starGlow)"/>

  <!-- Horizon line -->
  <line x1="20" y1="78" x2="108" y2="78" stroke="#5cc8ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Dawn rays — radiating upward from horizon -->
  <line x1="64" y1="78" x2="64" y2="30" stroke="#5cc8ff" stroke-width="1.2" opacity="0.3"/>
  <line x1="64" y1="78" x2="40" y2="36" stroke="#5cc8ff" stroke-width="1" opacity="0.2"/>
  <line x1="64" y1="78" x2="88" y2="36" stroke="#5cc8ff" stroke-width="1" opacity="0.2"/>
  <line x1="64" y1="78" x2="28" y2="52" stroke="#5cc8ff" stroke-width="0.8" opacity="0.15"/>
  <line x1="64" y1="78" x2="100" y2="52" stroke="#5cc8ff" stroke-width="0.8" opacity="0.15"/>

  <!-- Nova star — the central identity point -->
  <!-- 8-point star using overlapping rotated squares -->
  <g transform="translate(64, 44)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="10" fill="#5cc8ff" opacity="0.15"/>
    <!-- Star body -->
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3"
             fill="#5cc8ff" opacity="0.9"/>
    <!-- Rotated overlay for 8-point -->
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3"
             fill="#5cc8ff" opacity="0.6"
             transform="rotate(45)"/>
    <!-- Center bright point -->
    <circle cx="0" cy="0" r="3" fill="#e8e8f0"/>
    <circle cx="0" cy="0" r="1.5" fill="white"/>
  </g>

  <!-- Accent dots — small stars in the "sky" -->
  <circle cx="32" cy="32" r="1" fill="#e8e8f0" opacity="0.5"/>
  <circle cx="94" cy="28" r="0.8" fill="#e8e8f0" opacity="0.4"/>
  <circle cx="48" cy="22" r="0.6" fill="#e8e8f0" opacity="0.3"/>
  <circle cx="82" cy="38" r="0.7" fill="#e8e8f0" opacity="0.35"/>
  <circle cx="26" cy="52" r="0.5" fill="#e8e8f0" opacity="0.25"/>
  <circle cx="100" cy="46" r="0.6" fill="#e8e8f0" opacity="0.3"/>

  <!-- "ND" monogram below horizon — subtle, small -->
  <text x="64" y="100" font-family="sans-serif" font-size="11" font-weight="bold"
        fill="#5cc8ff" text-anchor="middle" opacity="0.7">ND</text>
</svg>
