<?xml version="1.0" encoding="UTF-8"?>
<!--
==============================================================================
METADATA
==============================================================================

Key: B-word-work-pkg-omni-ide-icon-svg
Title: OmniCode IDE Icon (SVG)
Type: Vector Image
Version: a-01.01

Authors: Nova Dawn
Organization: CreativeWorkzStudio LLC
Copyright: © 2026 CreativeWorkzStudio LLC. All rights reserved.

Scripture: "In the beginning was the Word" — John 1:1
Purpose: Application icon for OmniCode IDE - Kingdom Technology

Design: Modern rounded square (matches desktop conventions)
        Royal purple gradient (Kingdom colors)
        Code brackets < /> with encompassing O ring
        Ternary dots (void/word/tov)

==============================================================================
END METADATA
==============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background gradient - royal purple to deep navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B2C6F"/>
      <stop offset="50%" style="stop-color:#4A235A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4D03F"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Rounded square (modern icon standard) -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bgGrad)"/>

  <!-- Subtle inner highlight -->
  <rect x="16" y="16" width="224" height="224" rx="40" ry="40"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- The "O" ring - represents Omni (all-encompassing Word) -->
  <circle cx="128" cy="124" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="10" filter="url(#glow)"/>

  <!-- Left bracket < -->
  <path d="M 68 124 L 96 88 L 96 98 L 76 124 L 96 150 L 96 160 Z"
        fill="#FFFFFF" opacity="0.95"/>

  <!-- Right bracket > -->
  <path d="M 188 124 L 160 88 L 160 98 L 180 124 L 160 150 L 160 160 Z"
        fill="#FFFFFF" opacity="0.95"/>

  <!-- Center slash / (code, transformation) -->
  <rect x="123" y="92" width="10" height="64" rx="2"
        transform="rotate(-18, 128, 124)" fill="#FFFFFF" opacity="0.85"/>

  <!-- Ternary dots: void (-1) / word (0) / tov (+1) -->
  <circle cx="88" cy="208" r="8" fill="#D4AF37" opacity="0.6"/>
  <circle cx="128" cy="208" r="8" fill="#F4D03F"/>
  <circle cx="168" cy="208" r="8" fill="#D4AF37" opacity="0.6"/>
</svg>
