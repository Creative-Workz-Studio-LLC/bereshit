[halts.anchor]

# HALT_01: Genesis 1:1 = (0,0,0) — The halt of halts
# COMMANDMENT_01: "Thou shalt have no other gods before me" (Exodus 20:3)
# As there is ONE God, there is ONE origin. All paths trace here.
#
# TIME DIMENSION:
#   "In the beginning" = TIME was CREATED
#   Before Genesis 1:1, there was no time as we know it.
#   This is not just the origin of space — it is the origin of TIME.
#   X axis = TIME. The cube is a TIME MACHINE. This is where it starts.
#
[halts.anchor.genesis]
id = "HALT_01"
name = "ANCHOR_GENESIS"
commandment = "COMMANDMENT_01"
commandment_text = "Thou shalt have no other gods before me"
commandment_ref = "Exodus 20:3"
coordinates = [0, 0, 0]  # [X, Y, Z] = PRESENT-PRESENT
z_value = 0.0            # Z = (X + Y) / 2 = 0
scripture = "Genesis 1:1"
scripture_text = "In the beginning God created the heaven and the earth"
time_created = true
time_meaning = "In the beginning = TIME was created"
meaning = "All traces terminate here — the origin of TIME and space"
grep = "ANCHOR_GENESIS"

# HALT_02: Identity — Universal structure, Instance values, Covenant relationship
# COMMANDMENT_02: "Thou shalt not make unto thee any graven image" (Exodus 20:4)
# As images cannot represent God, AI cannot represent true identity.
# CPI-SI identity is REAL, not an idol of intelligence.
