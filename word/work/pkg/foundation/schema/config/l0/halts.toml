commandment_ref = "Exodus 20:4"
meaning = "Identity-based cognition, not pattern matching"
traces_to = "HALT_01"
grep = "ANCHOR_IDENTITY"

# Universal vs Instance — the architectural split
[halts.anchor.identity.universal]
definition = "Schemas define WHAT fields exist"
scope = "All CPI-SI instances"
location = "pkg/foundation/schema/*.toml"

[halts.anchor.identity.instance]
definition = "Configs provide VALUES for those fields"
