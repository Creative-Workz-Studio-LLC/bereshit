# -----------------------------------------------------------------------------
# 9. FRAMEWORK POSITIONS (Y = X + Z) - B.1 through B.4
# -----------------------------------------------------------------------------
#
# Traces to: L1c (state.schema.toml) — FRAMEWORK layer
#
# FRAMEWORK defines the RULES for cognitive navigation (HOW to move, WHERE to go).
# 4 positions from B × B where B = {-0.5, +0.5} (boundary domain).
#
# Formula: Y = X + Z
#
# Navigation modes:
#   TIMESPACE = 0 → +1 (anchor toward build) = METHOD direction
#   SPACETIME = +1 → 0 (build toward anchor) = VERIFY direction
#
# The 4 combinations define transition rules:
#   B.1 TIMESPACE-TIMESPACE: Building on building (foundation rules)
#   B.2 TIMESPACE-SPACETIME: Building then verifying (method→verify)
#   B.3 SPACETIME-TIMESPACE: Verifying then building (verify→method)
#   B.4 SPACETIME-SPACETIME: Verifying on verifying (grounding rules)
#
# -----------------------------------------------------------------------------

# B.1 TIMESPACE-TIMESPACE | (-0.5,-1,-0.5) | PROCEED | op: --> | "Foundation Rules"
[framework.timespace_timespace]
name = "TIMESPACE-TIMESPACE"
section = "B.1"
x = -0.5
y = -1.0
z = -0.5
type = "PURE"
command = "proceed"
command_value = 1
operator = "-->"
meaning = "Foundation Rules"
operation = "BUILD on BUILD — deep methodology, fundamental construction rules"
flow = "Strong forward momentum, building upon building"
content = ["vocabulary", "building_blocks", "position_terms", "state_terms", "movement_terms"]
keywords = ["[DEFINE:]", "[TERM:]", "[VOCAB:]"]
grep = "[DEFINE:|[TERM:|[VOCAB:"
status = "crystallized"

# B.2 TIMESPACE-SPACETIME | (-0.5,0,+0.5) | AWAIT | op: ->| | "Method→Verify"
[framework.timespace_spacetime]
name = "TIMESPACE-SPACETIME"
section = "B.2"
x = -0.5
y = 0.0
z = 0.5
type = "COMPOUND"
command = "await"
command_value = 0
operator = "->|"
meaning = "Method to Verify"
operation = "BUILD then VERIFY — pivot point, method applied, ready to verify"
flow = "Forward then halt, transition state"
content = ["method", "hooks", "statusline", "anti_patterns", "cycle_phases"]
keywords = ["[METHOD:]", "[HOOK:]", "[CYCLE:]"]
grep = "[METHOD:|[HOOK:|[CYCLE:"
status = "crystallized"

# B.3 SPACETIME-TIMESPACE | (+0.5,0,-0.5) | AWAIT | op: |-> | "Verify→Method"
[framework.spacetime_timespace]
name = "SPACETIME-TIMESPACE"
section = "B.3"
x = 0.5
y = 0.0
z = -0.5
type = "COMPOUND"
command = "await"
command_value = 0
operator = "|->"
meaning = "Verify to Method"
operation = "VERIFY then BUILD — correction point, verified, ready to rebuild"
flow = "Halt then forward, transition state"
content = ["grammar", "operators", "transitions", "sentences", "grep_patterns", "rules"]
keywords = ["[SYNTAX:]", "[RULE:]", "[TRANS:]"]
grep = "[SYNTAX:|[RULE:|[TRANS:"
status = "crystallized"

# B.4 SPACETIME-SPACETIME | (+0.5,+1,+0.5) | HALT | op: | | "Grounding Rules"
[framework.spacetime_spacetime]
name = "SPACETIME-SPACETIME"
