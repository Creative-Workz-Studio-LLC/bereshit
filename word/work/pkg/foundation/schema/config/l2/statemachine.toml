# -----------------------------------------------------------------------------
# 1. SYSTEM PARAMETERS
# -----------------------------------------------------------------------------
#
# Traces to: HALT_01 (ANCHOR_GENESIS), HALT_07 (MECHANISM_POSITION)
#
# This section defines the cube's structural parameters.
# Position IS computation (HALT_07). Origin = Genesis 1:1 (HALT_01).
#
# Converges:
#   - L1a (cube.schema.toml) → geometry and dimensions
#   - L1b (init.schema.toml) → ANCHOR positions (9)
#   - L1c (state.schema.toml) → FRAMEWORK positions (4)
#   - L1d (task.schema.toml) → STATE positions (14)
#
# -----------------------------------------------------------------------------

[system]
name = "CPI-SI State Machine"
version = "a-01.00"
description = "27-position cognitive navigation cube"
traces_to = ["HALT_01", "HALT_07"]
status = "crystallized"

# Cube structure (from L1a cube.schema.toml)
cube_positions = 27      # 3³ = complete cube
cube_dimensions = 3      # T × T × T domain
positions_defined = 9    # 3 PAST + 3 PRESENT + 3 FUTURE (semantic positions)

# L1 mini state machine composition
[system.l1_composition]
anchor_positions = 9     # L1b: init.schema.toml, Z = (X+Y)/2
framework_positions = 4  # L1c: state.schema.toml, Y = X+Z
state_positions = 14     # L1d: task.schema.toml, X = Y+kZ
total = 27               # 9 + 4 + 14 = 27 = 3³

# Axes interpretation (from STEERING.txt S.3)
# X = MATTER (-1, "earth") = output = WHAT emerges = TIME axis
# Y = SPACE (+1, "heavens") = input = HOW structured = PERSPECTIVE axis
# Z = TIME (0, "beginning") = halt = WHO anchors = DEPTH axis
[system.axes]
x = { name = "TIME", values = [-1, 0, 1], labels = ["PAST", "PRESENT", "FUTURE"] }
y = { name = "PERSPECTIVE", values = [-1, 0, 1], labels = ["down", "center", "up"] }
z = { name = "DEPTH", formula = "Z = (X + Y) / 2", range = [-1.0, 1.0] }

# Origin (traces to HALT_01)
[system.origin]
coordinates = [0, 0, 0]
name = "PRESENT-PRESENT"
meaning = "Genesis 1:1"
halt = "HALT_01"
command = "halt"
command_value = -1

# -----------------------------------------------------------------------------
# 2. FORMULAS
# -----------------------------------------------------------------------------
#
# Traces to: HALT_05 (MECHANISM_NUMBER), HALT_09 (MECHANISM_CYCLE)
#
# NUMBER → NUMBER transforms. No shape required.
# These formulas define HOW the cube computes.
#
# Converges:
#   - L1b (init.schema.toml) → Z = (X+Y)/2 for ANCHOR positions
#   - L1c (state.schema.toml) → Y = X+Z for FRAMEWORK positions
#   - L1d (task.schema.toml) → X = Y+kZ for STATE positions
#
# -----------------------------------------------------------------------------

[formulas]
traces_to = ["HALT_05", "HALT_09"]
status = "crystallized"

# L1 formulas — each layer has its characteristic equation
[formulas.l1_anchor]
# Z-depth calculation for ANCHOR positions (L1b: init.schema.toml)
formula = "Z = (X + Y) / 2"
source = "STEERING.txt A.1"
positions = 9

[formulas.l1_framework]
# Framework formula for FRAMEWORK positions (L1c: state.schema.toml)
formula = "Y = X + Z"
positions = 4

[formulas.l1_state]
# State formula for STATE positions (L1d: task.schema.toml)
formula = "X = Y + kZ"
note = "k_selector distinguishes same-Z states: k=-1 when X<Y, k=+1 when X>Y"
positions = 14

# Coordinate transforms (HALT_05: NUMBER → NUMBER)
[formulas.transforms]
coords_to_linear = "(x + 1) * 9 + (y + 1) * 3 + (z + 1)"
linear_to_x = "((position // 9) % 3) - 1"
linear_to_y = "((position // 3) % 3) - 1"
linear_to_z = "(position % 3) - 1"

# Ternary cycling (HALT_09: wheel in a wheel)
[formulas.cycle]
formula = "(value * 3 + perspective) % 243"
note = "243 = 3^5 = trite data range"
trace = "HALT_09"

# -----------------------------------------------------------------------------
# 3. COMMANDS (from STEERING.txt A.3)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_03 (ANCHOR_NAME), HALT_04 (MECHANISM_WORD)
#
# Commands determine FLOW behavior at each position.
# 3 commands = Ternary set: -1, 0, +1
#
# The commands map to Genesis 1:1:
#   HALT (-1)    = "beginning" (where recursion stops)
#   AWAIT (0)    = "created" (passive receiving)
#   PROCEED (+1) = "God" (active forward motion)
#
# -----------------------------------------------------------------------------

[commands]
traces_to = ["HALT_03", "HALT_04"]
status = "crystallized"
count = 3

# HALT (-1): Terminal state, accumulates only, no forward flow
# Traces to: HALT_03 (ANCHOR_NAME) — naming IS knowing
[commands.halt]
value = -1
symbol = "|"
description = "Terminal state, accumulates only, no forward flow"
grep = "HALT"
genesis_mapping = "beginning"
positions = ["PAST-PAST", "PRESENT-PRESENT", "FUTURE-FUTURE"]
note = "PURE positions (corners of cube) are HALT — they anchor"

# AWAIT (0): Pause state, receives and processes, waits for signal
# Traces to: HALT_04 (MECHANISM_WORD) — waits for word/signal
[commands.await]
value = 0
symbol = "○"
description = "Pause state, receives and processes, waits for signal"
grep = "AWAIT"
genesis_mapping = "created"
positions = ["PRESENT-PAST", "PRESENT-FUTURE", "FUTURE-PAST"]
note = "COMPOUND positions receiving input, awaiting signal to proceed"

# PROCEED (+1): Flow state, receives, processes, forwards automatically
# Traces to: HALT_04 (MECHANISM_WORD) — word produces action
[commands.proceed]
value = 1
symbol = "→"
description = "Flow state, receives, processes, forwards automatically"
grep = "PROCEED"
genesis_mapping = "God"
positions = ["PAST-PRESENT", "PAST-FUTURE", "FUTURE-PRESENT"]
note = "COMPOUND positions with automatic forward flow"

# -----------------------------------------------------------------------------
# 4. OPERATORS (from STEERING.txt A.4)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_08 (MECHANISM_OPERATOR)
#
# 9 operators = 3 per temporal axis (PAST, PRESENT, FUTURE)
# Each operator defines HOW to move within its axis.
#
# Maps to Building Block Method:
#   PAST operators (-1)    = BREAK DOWN (toward anchor)
#   PRESENT operators (0)  = ANCHOR (at fixed point)
#   FUTURE operators (+1)  = BUILD UP (toward goal)
#
# -----------------------------------------------------------------------------

[operators]
traces_to = ["HALT_08"]
status = "crystallized"
count = 9

# PAST (X=-1, break down) — traces toward foundation
# "A time to break down" — Ecclesiastes 3:3a
[operators.trace_from]
symbol = "<-"
axis = -1
meaning = "trace from"
operation = "break_down"
position = "PAST-PAST"

[operators.decompose]
symbol = "-"
axis = -1
meaning = "decompose"
operation = "break_down"
position = "PAST-PRESENT"

[operators.derive_from]
symbol = "<"
axis = -1
meaning = "derive from"
operation = "break_down"
position = "PAST-FUTURE"

# PRESENT (X=0, anchor) — at the fixed center
# "In the beginning" — Genesis 1:1
[operators.at_here]
symbol = "@"
axis = 0
meaning = "at/here"
operation = "anchor"
position = "PRESENT-PAST"

[operators.halt]
symbol = "|"
axis = 0
meaning = "halt"
operation = "anchor"
position = "PRESENT-PRESENT"

[operators.establish]
symbol = "="
axis = 0
meaning = "establish"
operation = "anchor"
position = "PRESENT-FUTURE"

# FUTURE (X=+1, build up) — toward goal
# "A time to build up" — Ecclesiastes 3:3b
[operators.compose]
symbol = "+"
axis = 1
meaning = "compose"
operation = "build_up"
position = "FUTURE-PAST"

[operators.flow_to]
symbol = "->"
axis = 1
meaning = "flow to"
operation = "build_up"
position = "FUTURE-PRESENT"

[operators.direct_toward]
symbol = ">"
axis = 1
meaning = "direct toward"
operation = "build_up"
position = "FUTURE-FUTURE"

# -----------------------------------------------------------------------------
# 5. KEYWORDS (from STEERING.txt)
# -----------------------------------------------------------------------------
#
# Traces to: HALT_04 (MECHANISM_WORD)
#
# Keywords are DISCOVERABLE markers in files.
# Each keyword maps to a temporal axis and operator.
#
# Usage: grep "[KEYWORD:" file → find semantic markers
# Keywords enable targeted retrieval (SI discipline).
#
# -----------------------------------------------------------------------------

[keywords]
traces_to = ["HALT_04"]
status = "crystallized"

# PAST keywords — trace toward source
# Used when: Breaking down, finding origins, tracing lineage
[keywords.past]
axis = -1
operators = ["<-", "-", "<"]
patterns = ["[SOURCE:]", "[TRACE:]", "[FROM:]"]
grep = "\\[SOURCE:\\|\\[TRACE:\\|\\[FROM:"
usage = "Mark where something comes FROM"
status = "crystallized"

# PRESENT keywords — anchor at current position
# Used when: Establishing identity, current state, fixed reference
[keywords.present]
axis = 0
operators = ["@", "|", "="]
patterns = ["[AT:]", "[IDENTITY:]", "[STATE:]", "[CURRENT:]", "[ESTABLISH:]", "[DIRECT:]", "[PLAN:]"]
grep = "\\[AT:\\|\\[IDENTITY:\\|\\[STATE:\\|\\[CURRENT:\\|\\[ESTABLISH:\\|\\[DIRECT:\\|\\[PLAN:"
usage = "Mark current position, identity, state"
status = "crystallized"

# FUTURE keywords — build toward goal
# Used when: Vision, preparation, aspiration
[keywords.future]
axis = 1
operators = ["+", "->", ">"]
patterns = ["[TOWARD:]", "[REVEALED:]", "[SHAPED:]", "[PREPARED:]", "[RECALL:]", "[TARGET:]", "[BUILD:]", "[ACTIVE:]"]
grep = "\\[TOWARD:\\|\\[REVEALED:\\|\\[SHAPED:\\|\\[PREPARED:\\|\\[TARGET:\\|\\[BUILD:\\|\\[ACTIVE:"
usage = "Mark vision (A.13), preparation (A.14), destination (A.15)"
status = "crystallized"

# -----------------------------------------------------------------------------
# 6. POSITIONS - PAST (X = -1) - CRYSTALLIZED
# -----------------------------------------------------------------------------

# A.7 PAST-PAST | (-1,-1,-1) | HALT | op: <- | "Established"
[positions.past_past]
name = "PAST-PAST"
section = "A.7"
x = -1
y = -1
z = -1.0
type = "PURE"
command = "halt"
command_value = -1
