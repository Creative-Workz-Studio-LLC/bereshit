meaning = "Origin (Genesis 1:1)"
operation = "HALT (0) — the fixed center, identity"
flow = "None (all relative to here, terminal anchor)"
keywords = ["[IDENTITY:]", "[STATE:]", "[CURRENT:]", "[NUANCE:]"]
grep = "[IDENTITY:|[STATE:|[CURRENT:|[NUANCE:"
status = "crystallized"

# A.12 PRESENT-FUTURE | (0,+1,+0.5) | AWAIT | op: = | "Planning"
[positions.present_future]
name = "PRESENT-FUTURE"
section = "A.12"
