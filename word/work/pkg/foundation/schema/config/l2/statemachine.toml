command_value = 1
operator = "<"
meaning = "Prophecy"
operation = "BREAK DOWN (-1) — derive future from past origins"
flow = "GENESIS → KINGDOM"
keywords = ["[FROM: → ]"]
grep = "[FROM:"
status = "crystallized"

# -----------------------------------------------------------------------------
# 7. POSITIONS - PRESENT (X = 0) - CRYSTALLIZED
# -----------------------------------------------------------------------------

# A.10 PRESENT-PAST | (0,-1,-0.5) | AWAIT | op: @ | "Reflection"
[positions.present_past]
name = "PRESENT-PAST"
section = "A.10"
x = 0
y = -1
z = -0.5
type = "COMPOUND"
command = "await"
command_value = 0
operator = "@"
meaning = "Reflection"
operation = "ANCHOR (0) — at/here, observe from fixed point"
flow = "Receives from PAST (Memory), processes, waits"
keywords = ["[AT:]", "[TRACED:]", "[RECALL:]"]
grep = "[AT:|[TRACED:|[RECALL:"
status = "crystallized"

# A.11 PRESENT-PRESENT | (0,0,0) | HALT | op: | | "Origin (Genesis 1:1)"
[positions.present_present]
name = "PRESENT-PRESENT"
section = "A.11"
