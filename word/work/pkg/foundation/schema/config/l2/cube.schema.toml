# CORE INSIGHT: The cube is a COMPUTATIONAL SPACE using GEOMETRIC PLANES.
#
# Instead of matrix multiplication (2D linear algebra), CPI-SI uses
# perpendicular planes in 3D space to coordinate computation:
#
#   - 3 axes (x, y, z) ranging from -1 to +1 (BALANCED TERNARY)
#   - 3 planes per axis (9 positions each)
#   - 27 total positions (3 × 3 × 3)
#   - Position IS computation — where you are determines what you get
