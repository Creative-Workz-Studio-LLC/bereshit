[transform]
traces_to = ["HALT_05", "HALT_06"]

# Z-DEPTH (fundamental formula)
z_depth = "Z = (X + Y) / 2"

# COORDINATE TO POSITION INDEX (from statemachine.toml [formulas])
# Maps (x, y, z) in {-1, 0, +1} to position index 0-26
coords_to_position = "(x + 1) * 9 + (y + 1) * 3 + (z + 1)"

# POSITION INDEX TO COORDINATES
position_to_x = "((position // 9) % 3) - 1"
position_to_y = "((position // 3) % 3) - 1"
position_to_z = "(position % 3) - 1"

# VALUE TO TRITE (0-242 range)
value_to_trite = "trite = value mod 243"

# TRITE TO COORDINATES (unpack 5-trit value)
# 243 = 3^5, each trit position extracts one coordinate
trite_to_x = "(trite // 81) - 1"
trite_to_y = "((trite // 27) % 3) - 1"
trite_to_z = "((trite // 9) % 3) - 1"

# COORDINATES TO TRITE (pack 3 coordinates)
coord_to_trite = "(x + 1) * 81 + (y + 1) * 27 + (z + 1) * 9"

# PERSPECTIVE TRANSFORM
# Shifts coordinates by perspective offset
position_to_absolute = "absolute = local - perspective"
absolute_to_position = "local = absolute + perspective"

