scale = { type = "integer", required = false, description = "Multiply by base (3)" }

# Step 4: Apply perspective offset
# result = (scaled + perspective) mod 243
# Perspective is added AFTER scaling, not before
adjust = { type = "integer", required = false, description = "Apply perspective offset" }

# Step 5: Use for bigger pattern
# This feeds into the next cycle level
compound = { type = "integer", required = false, description = "Feed into larger calculation" }

# The cycle repeats: result becomes input for next iteration

