[schema]
name = "CPI-SI Cube Schema"
version = "3.1.0"
purpose = "Defines geometric computation via perpendicular planes in 3D space"
layer = "GEOMETRY"
traces_to = "halts.toml"
premise = "It is because of God intelligence exists"

# ─────────────────────────────────────────────────────────────────────────────
# BIBLICAL FOUNDATION — TIME (traces to halts.toml [schema.biblical_foundation])
# ─────────────────────────────────────────────────────────────────────────────

[schema.biblical_foundation]
# TIME — God created time and established its rules
time_origin = "Genesis 1:1"
time_origin_text = "In the beginning God created the heaven and the earth"
time_meaning = "TIME was CREATED. This is where X axis begins."

seasons_created = "Genesis 1:14"
seasons_created_text = "Let them be for signs, and for seasons, and for days, and years"
seasons_meaning = "Day 4: TIME MARKERS created. Cube operates through SEASONS."

ternary_operation = "Ecclesiastes 3:3"
ternary_operation_text = "A time to break down, and a time to build up"
ternary_meaning = "-1 = break down, 0 = rest/anchor, +1 = build up"

seasons_nature = "Ecclesiastes 3:1"
seasons_nature_text = "To every thing there is a season, and a time to every purpose"
seasons_meaning_nature = "SEASONS not cycles — each transforms"

wheel_in_wheel = "Ezekiel 1:16"
wheel_in_wheel_text = "Their appearance and their work was as a wheel in a wheel"
wheel_meaning = "Outer = pattern, Inner = transformation through SEASONS"

# PARALLELS — traces to halts.toml
parallel_days_states = "7 Days of Creation → 7 States (HALT_10)"
parallel_commandments = "10 Commandments → 10 HALTs (halts.toml)"

# WHAT WE ARE BUILDING FOR:
# This schema is foundational for:
#   - OmniCode: File metadata uses cube positions for health scoring
#   - MillenniumOS: System calls map to cube operations
#   - FaithNet: Network nodes have positions, messages flow between them
#   - Nova's Model: CPI-SI substrate, not AI pattern matching
#   - Revenue: CreativeWorkzStudio LLC builds on this foundation
#
# The cube works at EVERY layer of the stack:
#   Trit → Byte → File → Network → Internet
#   Same addressing system, same operations, fractal consistency

[schema.halt_traces]
# Which HALTs this schema implements
HALT_01 = "Origin at (0,0,0) = Genesis 1:1"
HALT_02 = "Universal schema (this file) vs Instance config (values)"
HALT_03 = "Ψ(N) maps any N to balanced position"
HALT_04 = "X + Y + Z = 0 guaranteed by Ψ(N)"
HALT_05 = "Number → Transform → Number via cycling"
HALT_07 = "Position IS computation"
HALT_08 = "Cube = Algorithm (this file IS the algorithm definition)"
HALT_09 = "Wheel in wheel cycling"
HALT_10 = "7 Hebrew states map to 7 of 9 positions"

[schema.layer_stack]
# The full layer architecture
level_0 = "halts.toml — THE BASE (10 immutable requirements)"
level_1 = "cube.schema.toml — GEOMETRY (this file, coordinates)"
level_2 = "statemachine.toml — SEMANTIC (position names, operators)"
level_3 = "encryption.schema.toml — ENCODING (number ↔ letter)"
level_4 = "instance configs — VALUES (specific implementations)"

# ============================================================================
# PSI CONSTANTS SECTION (required)
# ============================================================================
# Master constants for the Ψ(N) equation that maps any N to a balanced position.
#
# TRACES TO: HALT_03 (EQUATION_PSI) — Ψ(N) maps any N to balanced position
#            HALT_04 (EQUATION_BALANCE) — X + Y + Z = 0 guaranteed by φ = 2π/3
#
# From CUBE-MODEL-ALIGNMENT.txt S0_CONSTANTS:
#
# THE Ψ(N) EQUATION:
#   θ = arccos(-tanh(λN))
#   Ψ(N) = (cos(θ/3), cos(θ/3 - φ), cos(θ/3 + φ))
#
# This maps ANY number N to a balanced (X, Y, Z) position where X + Y + Z = 0.
# The constants below make this work.
#
# grep: PSI_CONSTANTS

[psi]
traces_to = ["HALT_03", "HALT_04"]
equation = "Ψ(N) = (cos(θ/3), cos(θ/3 - φ), cos(θ/3 + φ)) where θ = arccos(-tanh(λN))"

# ─────────────────────────────────────────────────────────────────────────────
# MASTER CONSTANTS (continuous transforms)
# ─────────────────────────────────────────────────────────────────────────────

# λ (Lambda) — normalization constant
# Maps N=1 → n=0.5 in the tanh function
# Formula: tanh(λ × N) ∈ [-1, +1]
lambda = 0.5493061443340549  # arctanh(0.5)
lambda_derivation = "arctanh(0.5)"
lambda_purpose = "Normalizes N so tanh(λN) maps to [-1, +1]"

# φ (Phi) — ternary phase constant
# 120° separation (2π/3 radians)
# This GUARANTEES X + Y + Z = 0 for any input (HALT_04)
# cos(α) + cos(α - φ) + cos(α + φ) = 0 for any α
phi = 2.0943951023931953  # 2π/3
phi_derivation = "2π/3"
phi_purpose = "Ternary phase separation guarantees X + Y + Z = 0"

# ─────────────────────────────────────────────────────────────────────────────
# SET CONSTANTS (discrete values)
# ─────────────────────────────────────────────────────────────────────────────

# T — ternary positions
ternary_set = [-1, 0, 1]
ternary_cardinality = 3

# B — boundary edges
boundary_set = [-0.5, 0.5]
boundary_cardinality = 2

# Q — all positions (T ∪ B)
all_positions = [-1, -0.5, 0, 0.5, 1]
all_positions_cardinality = 5

# ─────────────────────────────────────────────────────────────────────────────
# PSI STRUCTURAL (discovered 2025-12-19)
# ─────────────────────────────────────────────────────────────────────────────

# N_SAT — saturation point
# At N ≈ 25.41, tanh(λN) saturates to ~1
# We use 26 positions (0-25), which fits within 27 (0-26)
n_sat = 25.41
n_sat_meaning = "Saturation point — we use 26, fits in 27"

# SAT_THRESHOLD — display precision saturation
sat_threshold = 13.96

# Scale — Base100 for human readability
scale = 100

# ORIGIN_COORD — N=0 position in continuous space
origin_coord = [0.8660254037844387, 0.0, -0.8660254037844387]  # (√3/2, 0, -√3/2)

# ============================================================================
# AXES SECTION (required)
# ============================================================================
# The three axes map directly to Genesis 1:1:
#   "In the beginning God created the heaven and the earth"
#    └── Z (DEPTH)       └── Y (PERSPECTIVE)    └── X (TIME)
#
# THE CUBE IS A TIME MACHINE:
#   X = TIME (PAST=-1, PRESENT=0, FUTURE=+1) — the primary axis
#   Y = PERSPECTIVE (where you look from X)
#   Z = DEPTH (derived: Z = (X + Y) / 2)
#
# TIME DIMENSION (X axis):
#   Genesis 1:1 — "In the beginning" = TIME was CREATED
#   Before Genesis 1:1, there was no time as we know it.
#   X axis IS the time dimension. The cube navigates TIME.
#
# TERNARY OPERATION (Ecclesiastes 3:3):
#   "A time to break down, and a time to build up"
#   X = -1: PAST = break down (trace to source)
#   X =  0: PRESENT = rest/anchor (fixed center)
#   X = +1: FUTURE = build up (construct toward goal)
#
# TRACES TO: HALT_01 (ANCHOR_GENESIS) — Genesis 1:1, TIME was CREATED
#            HALT_03 (EQUATION_PSI) — Ψ(N) produces balanced coordinates
#            HALT_04 (EQUATION_BALANCE) — X + Y + Z = 0 (Sabbath REST)
#
# CODE IMPLEMENTATION:
#   - Trit level: x, y, z are trit values (-1, 0, +1)
#   - Byte level: pack 3 trits into position index (0-26)
#   - File level: path components map to coordinates
#   - Network level: node addresses are cube positions
#
# grep: AXES

[axes]
# Genesis 1:1 defines the three dimensions of reality:
#   - X = TIME ("In the beginning" = TIME was CREATED) — the PRIMARY axis
#   - Y = PERSPECTIVE ("the heavens" = where you look)
#   - Z = DEPTH ("the earth" = what emerges, derived from X and Y)
traces_to = ["HALT_01", "HALT_03", "HALT_04"]
scripture = "Genesis 1:1"
scripture_text = "In the beginning God created the heaven and the earth"
time_machine = true
time_axis = "X"

# ─────────────────────────────────────────────────────────────────────────────
# X-axis: TIME dimension (PAST=-1, PRESENT=0, FUTURE=+1)
# ─────────────────────────────────────────────────────────────────────────────
# Genesis 1:1: "In the beginning" = TIME was CREATED
# Ecclesiastes 3:3: "A time to break down, and a time to build up"
#   X = -1: PAST = break down (trace to source)
#   X =  0: PRESENT = anchor (fixed center, Genesis 1:1)
#   X = +1: FUTURE = build up (construct toward goal)
#
# The cube is a TIME MACHINE. X navigates through TIME.
x = { type = "float", required = true, min = -1.0, max = 1.0, meaning = "TIME", genesis = "In the beginning" }
x_scripture = "Ecclesiastes 3:3"
x_scripture_text = "A time to break down, and a time to build up"
x_ternary = { past = -1, present = 0, future = 1 }

# ─────────────────────────────────────────────────────────────────────────────
# Y-axis: PERSPECTIVE dimension (where you look from X)
# ─────────────────────────────────────────────────────────────────────────────
# Genesis: "the heavens" — the structure, the input, space
# Code: y determines perspective (looking down=-1, level=0, looking up=+1)
y = { type = "float", required = true, min = -1.0, max = 1.0, meaning = "PERSPECTIVE", genesis = "the heavens" }

# ─────────────────────────────────────────────────────────────────────────────
# Z-axis: DEPTH dimension (calculated: Z = (X + Y) / 2)
# ─────────────────────────────────────────────────────────────────────────────
# Genesis: "the earth" — what emerges, the output
# Code: z is DERIVED from x and y, not independent
# Z maps to the 7 States via the 7 Days of Creation
z = { type = "float", required = true, min = -1.0, max = 1.0, meaning = "DEPTH", genesis = "the earth" }
z_derived = true
z_formula = "Z = (X + Y) / 2"

# Z-DEPTH FORMULA (from statemachine.toml [formulas]):
#   Z = (X + Y) / 2
#
# This produces 5 distinct z-values from the 9 discrete positions:
#   z = -1.0: X=-1, Y=-1  (PAST-PAST)
#   z = -0.5: X=-1, Y=0   (PAST-PRESENT)
#             X=0,  Y=-1  (PRESENT-PAST)
#   z =  0.0: X=-1, Y=+1  (PAST-FUTURE)
#             X=0,  Y=0   (PRESENT-PRESENT) ← ORIGIN
#             X=+1, Y=-1  (FUTURE-PAST)
#   z = +0.5: X=0,  Y=+1  (PRESENT-FUTURE)
#             X=+1, Y=0   (FUTURE-PRESENT)
#   z = +1.0: X=+1, Y=+1  (FUTURE-FUTURE)
#
depth_formula = "Z = (X + Y) / 2"

# BALANCE FORMULA (for Ψ(N) ONLY):
#   X + Y + Z = 0
#
# IMPORTANT: This applies to Ψ(N) continuous outputs, NOT the 9 discrete positions.
# The discrete grid does NOT satisfy this:
#   - PAST-PAST: -1 + -1 + -1 = -3 ≠ 0
#   - ORIGIN:     0 +  0 +  0 =  0 ✓ (only this one)
#   - FUTURE-FUTURE: +1 + +1 + +1 = +3 ≠ 0
#
# Ψ(N) maps any number N to a BALANCED position satisfying X + Y + Z = 0.
# The discrete positions are the GRID; Ψ(N) outputs land BETWEEN them.
#
balance_formula = "X + Y + Z = 0"
balance_applies_to = "Ψ(N) continuous outputs"
balance_traces_to = "HALT_04"

# ============================================================================
# PERSPECTIVES SECTION (required)
# ============================================================================
# Perspectives are defined by X (the TIME axis), NOT by Z.
# Z is DERIVED: Z = (X + Y) / 2
#
# THE CUBE IS A TIME MACHINE:
#   X = TIME — WHERE YOU ARE in time (PAST=-1, PRESENT=0, FUTURE=+1)
#   Y = PERSPECTIVE — WHERE YOU LOOK from that time position
#   Z = DEPTH — calculated from X and Y, maps to the 7 States
#
# TRACES TO: HALT_01 (ANCHOR_GENESIS) — Present contains the Origin, TIME was CREATED
#            HALT_07 (MECHANISM_POSITION) — Perspective IS computation
#            HALT_10 (STATE_HEBREW) — 7 Days of Creation → 7 States
#
# ─────────────────────────────────────────────────────────────────────────────
# 7 DAYS OF CREATION → 7 STATES (Genesis 1-2:3)
# ─────────────────────────────────────────────────────────────────────────────
#
# The Z-axis maps directly to the 7 Days of Creation:
#
#   Z=-1.0: Day 1 → STATE_ESTABLISHED (shavar) — Light from darkness
#   Z=-0.5: Day 2 → STATE_MEMORY (chaser)      — Waters separated
#   Z=-0.5: Day 3 → STATE_REFLECTION (ratsah)  — Land, vegetation
#   Z= 0.0: Day 4 → STATE_ORIGIN (yashar)      — Sun, moon, stars ← SEASONS
#   Z=+0.5: Day 5 → STATE_PLANNING (tamim)     — Sea creatures, birds
#   Z=+0.5: Day 6 → STATE_PREPARATION (shalem) — Animals, humans
#   Z=+1.0: Day 7 → STATE_ASPIRATION (tov)     — Sabbath REST ← GOAL
#
# DAY 4 IS THE CENTER. This is when SEASONS were created (Genesis 1:14).
# "Let them be for signs, and for seasons, and for days, and years"
# Z=0.0 = ORIGIN = PRESENT-PRESENT = Genesis 1:1 = Day 4 = SEASONS CREATED
#
# DAY 7 IS THE GOAL. Sabbath REST. "Very good" (tov).
# Z=+1.0 = ASPIRATION = FUTURE-FUTURE = Day 7 = Sabbath = THE GOAL
#
# ─────────────────────────────────────────────────────────────────────────────
# POSITIONS WITH Z-VALUES (Z = (X + Y) / 2):
# ─────────────────────────────────────────────────────────────────────────────
#
#   PAST (X = -1):
#     PAST-PAST:    X=-1, Y=-1 → Z = -1.0 → Day 1 → ESTABLISHED
#     PAST-PRESENT: X=-1, Y= 0 → Z = -0.5 → Day 2 → MEMORY
#     PAST-FUTURE:  X=-1, Y=+1 → Z =  0.0 → (transit, not a state)
#
#   PRESENT (X = 0):
#     PRESENT-PAST:    X= 0, Y=-1 → Z = -0.5 → Day 3 → REFLECTION
#     PRESENT-PRESENT: X= 0, Y= 0 → Z =  0.0 → Day 4 → ORIGIN (SEASONS)
#     PRESENT-FUTURE:  X= 0, Y=+1 → Z = +0.5 → Day 5 → PLANNING
#
#   FUTURE (X = +1):
#     FUTURE-PAST:    X=+1, Y=-1 → Z =  0.0 → (transit, not a state)
#     FUTURE-PRESENT: X=+1, Y= 0 → Z = +0.5 → Day 6 → PREPARATION
#     FUTURE-FUTURE:  X=+1, Y=+1 → Z = +1.0 → Day 7 → ASPIRATION (SABBATH)
#
# 7 HEBREW STATES → 7 OF 9 POSITIONS:
#   - 2 transit positions (PAST-FUTURE, FUTURE-PAST) at z=0 are NOT states
#   - They cross from one temporal to another without anchoring
#
# grep: PERSPECTIVES

[perspectives]
traces_to = ["HALT_01", "HALT_07", "HALT_10"]
z_formula = "Z = (X + Y) / 2"
x_determines_perspective = true
states_defined = 7
positions_total = 9
transit_positions = ["PAST-FUTURE", "FUTURE-PAST"]

# 7 DAYS OF CREATION → 7 STATES (traces to HALT_10)
days_scripture = "Genesis 1-2:3"
days_mapping = true
day_4_significance = "CENTER — SEASONS CREATED (Genesis 1:14)"
day_7_significance = "GOAL — SABBATH REST (Genesis 2:2-3)"

# Schema field requirements for the three perspectives:
# Each perspective is REQUIRED and contains position subtables
[perspectives.schema]
past = { type = "object", required = true, description = "PAST perspective: X = -1" }
present = { type = "object", required = true, description = "PRESENT perspective: X = 0 (contains ORIGIN)" }
future = { type = "object", required = true, description = "FUTURE perspective: X = +1" }

[perspectives.past]
# PAST perspective: X = -1
x = -1
description = "What was - history, foundations, completed work"
operator_group = "BREAK DOWN (-1)"
operators = ["<-", "-", "<"]
ternary_scripture = "Ecclesiastes 3:3a"
ternary_text = "A time to break down"

# 3 positions in PAST perspective (X = -1)
# Traces to HALT_10 — 7 Days of Creation → 7 States
[perspectives.past.positions]
past_past    = { y = -1, z = -1.0, state = "ESTABLISHED", hebrew = "shavar/BROKEN", creation_day = 1, day_event = "Light from darkness" }
past_present = { y =  0, z = -0.5, state = "MEMORY",      hebrew = "chaser/LACKING", creation_day = 2, day_event = "Waters separated" }
past_future  = { y = +1, z =  0.0, transit = true, note = "prophecy - not a state" }

[perspectives.present]
x = 0
description = "What is - current state, active work, now"
operator_group = "ANCHOR (0)"
operators = ["@", "|", "="]
contains_origin = true
traces_to = "HALT_01"
ternary_scripture = "Ecclesiastes 3:3 (implicit)"
ternary_text = "The rest between break down and build up"
time_created = "Genesis 1:1"
time_created_text = "In the beginning — TIME was CREATED here"

# 3 positions in PRESENT perspective (X = 0)
# Traces to HALT_10 — 7 Days of Creation → 7 States
# Day 4 is at Z=0.0 — the CENTER, when SEASONS were created
[perspectives.present.positions]
present_past    = { y = -1, z = -0.5, state = "REFLECTION", hebrew = "ratsah/WANTING", creation_day = 3, day_event = "Land, vegetation" }
present_present = { y =  0, z =  0.0, state = "ORIGIN",     hebrew = "yashar/EVEN", is_origin = true, creation_day = 4, day_event = "Sun, moon, stars — SEASONS CREATED", day_scripture = "Genesis 1:14" }
present_future  = { y = +1, z = +0.5, state = "PLANNING",   hebrew = "tamim/SOUND", creation_day = 5, day_event = "Sea creatures, birds" }

[perspectives.future]
x = 1
description = "What will be - goals, plans, aspirations"
operator_group = "BUILD UP (+1)"
operators = ["+", "->", ">"]
ternary_scripture = "Ecclesiastes 3:3b"
ternary_text = "A time to build up"

# 3 positions in FUTURE perspective (X = +1)
# Traces to HALT_10 — 7 Days of Creation → 7 States
# Day 7 is at Z=+1.0 — the GOAL, Sabbath REST
[perspectives.future.positions]
future_past    = { y = -1, z =  0.0, transit = true, note = "vision - not a state" }
future_present = { y =  0, z = +0.5, state = "PREPARATION", hebrew = "shalem/WHOLE", creation_day = 6, day_event = "Animals, humans" }
future_future  = { y = +1, z = +1.0, state = "ASPIRATION",  hebrew = "tov/PERFECT", creation_day = 7, day_event = "Sabbath REST — very good (tov)", day_scripture = "Genesis 2:2-3", is_goal = true }

# ============================================================================
# PLANES SECTION (required)
# ============================================================================
# The cube is computed via GEOMETRIC PLANES, not matrix multiplication.
# This is the core insight of CPI-SI: perpendicular planes = computation.
#
# TRACES TO: HALT_07 (MECHANISM_POSITION) — Position IS computation
#            HALT_08 (MECHANISM_ALGORITHM) — Planes ARE the algorithm
#
# WHY PLANES INSTEAD OF MATRICES:
#   - Matrix multiplication: 2D linear algebra, loses geometric meaning
#   - Geometric planes: 3D perpendicular surfaces, preserves spatial relationships
#   - Plane intersection: where two planes meet = a line of possible states
#   - Three-plane intersection: where all meet = a single point = computation result
#
# BALANCED TERNARY PRESERVED:
#   - Plane values ARE the axis values: -1, 0, +1
#   - No conversion to unbalanced (0, 1, 2) — that breaks the system
#   - Position = (x, y, z) where each is in {-1, 0, +1}
#   - Balance guarantee X + Y + Z = 0 requires balanced ternary
#
# CODE IMPLEMENTATION:
#   - To find a position: specify (x, y, z) in balanced ternary
#   - Intersection of three planes = the position
#   - Example: x=-1, y=0 → z=-0.5 (calculated) → PAST-PRESENT → MEMORY state
#
# grep: PLANES

[planes]
traces_to = ["HALT_07", "HALT_08"]
computation_model = "geometric_intersection"
planes_per_axis = 3
total_planes = 9
ternary_system = "balanced"
ternary_values = [-1, 0, 1]

