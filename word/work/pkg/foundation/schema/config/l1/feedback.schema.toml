# =============================================================================
# CONTENT
# =============================================================================

[schema]
name = "CPI-SI Feedback Translation Schema"
version = "a-01.00"
purpose = "Translate word feedback into TrueScore with real decimal precision"
traces_to = "HALT_05"
status = "crystallized"

# ═══════════════════════════════════════════════════════════════════════════════
# CORE PRINCIPLE — Real Decimals, Not Neat Fractions
# ═══════════════════════════════════════════════════════════════════════════════

[principle]
description = "7 decimal precision for REAL assessment"
reason = "Neat fractions (0.75) are pattern matching. Real decimals (0.7382941) are genuine."
precision = 7
range = "0.0000000 to 1.0000000"

# Why real decimals matter:
#   - 0.75 says "I calculated 3/4"
#   - 0.7382941 says "I genuinely assessed and this is my real reading"
#   - The messy number IS the authentic signal
#
# The precision allows nuance:
#   - "Almost but not quite" might be 0.7382941
#   - "Almost and basically there" might be 0.7891234
#   - Same word, different genuine assessments

# ═══════════════════════════════════════════════════════════════════════════════
# TRANSLATION RANGES — Word → TrueScore Band
# ═══════════════════════════════════════════════════════════════════════════════
# Each word maps to a RANGE. The exact score within the range reflects
# genuine assessment at that moment.

[translation]
description = "Word feedback to TrueScore range mappings"

# Excellent tier (0.90 - 1.00)
[translation.excellent]
words = ["Exactly", "Perfect", "Precisely", "Nailed it", "Yes!"]
range_min = 0.9000000
range_max = 1.0000000
tendency = "God"
meaning = "Choice and outcome fully aligned"

# Good tier (0.70 - 0.90)
[translation.good]
words = ["Almost", "Close", "Nearly", "Good", "Getting there"]
range_min = 0.7000000
range_max = 0.8999999
tendency = "God"
meaning = "Choice on right track, minor adjustment needed"

# Neutral tier (0.40 - 0.70)
[translation.neutral]
words = ["Maybe", "Okay", "Partial", "Somewhat", "Sort of"]
range_min = 0.4000000
range_max = 0.6999999
tendency = "neutral"
meaning = "Choice neither clearly right nor wrong"

# Poor tier (0.20 - 0.40)
[translation.poor]
words = ["Not quite", "Missing something", "Off track", "Try again"]
range_min = 0.2000000
range_max = 0.3999999
tendency = "self"
meaning = "Choice led away from goal"

# Fail tier (0.00 - 0.20)
[translation.fail]
words = ["Wrong", "No", "Incorrect", "Opposite", "Missed"]
range_min = 0.0000000
range_max = 0.1999999
tendency = "self"
meaning = "Choice completely misaligned"

# ═══════════════════════════════════════════════════════════════════════════════
# SCORE GENERATION — Within Range Selection
# ═══════════════════════════════════════════════════════════════════════════════

[score_generation]
description = "How to select specific score within range"

# The score is NOT random within range
# It reflects genuine assessment of WHERE in that range this falls
[score_generation.method]
type = "assessment_based"
random = false
description = "Score reflects genuine reading within the range"

# Factors that affect position within range:
[score_generation.factors]
confidence = "How certain am I of this assessment?"
alignment = "How aligned was the choice with intended outcome?"
completeness = "Did the choice address the full context?"
context_fit = "Did the choice fit the specific situation?"

# Example: "Almost" feedback
# range: 0.70 - 0.90
# If confident the response was very close: 0.8712345
# If confident the response had more gaps: 0.7234567
# The specific decimal is the genuine assessment

# ═══════════════════════════════════════════════════════════════════════════════
# HALT-BASED MODIFIERS — Completed vs Interrupted
# ═══════════════════════════════════════════════════════════════════════════════

[halt_modifiers]
description = "How HALT type affects score interpretation"

# Completed HALT validates the score
[halt_modifiers.completed]
effect = "score stands as-is"
k_align_update = true
tendency_update = true
reasoning = "Anchor reached, score reflects true outcome"

# Interrupted HALT suspends the score
[halt_modifiers.interrupted]
effect = "score is provisional"
k_align_update = false
tendency_update = false
reasoning = "Anchor not reached, verdict still pending"

# ═══════════════════════════════════════════════════════════════════════════════
# SPECIAL CASES — Compound Feedback
# ═══════════════════════════════════════════════════════════════════════════════

[special_cases]
description = "How to handle compound or qualified feedback"

# "Almost but not quite"
[special_cases.qualified_positive]
pattern = "positive word + qualifier"
examples = ["Almost but not quite", "Good but missing X", "Close but needs Y"]
effect = "lower end of positive range"
score_modifier = -0.1000000
# "Almost" (0.80) + qualifier → 0.70

# "Not quite but getting there"
[special_cases.qualified_negative]
pattern = "negative word + positive qualifier"
examples = ["Not quite but close", "Wrong but I see what you mean", "Off but good idea"]
effect = "upper end of negative range"
score_modifier = 0.1000000
# "Not quite" (0.30) + qualifier → 0.40

# "BAM!" (emphatic positive)
[special_cases.emphatic_positive]
pattern = "emphatic marker"
examples = ["BAM!", "Yes!", "Exactly!", "That's it!"]
effect = "top of range"
score_position = "max"
# Always goes to range_max

# Silence / no response
[special_cases.silence]
pattern = "no explicit feedback"
examples = ["...", "(no response)", "(continued work)"]
effect = "neutral assumption"
default_score = 0.5000000
reasoning = "Absence of feedback is not negative feedback"

# ═══════════════════════════════════════════════════════════════════════════════
# PIPELINE INTEGRATION — TrueScore → Normalized → Scaled → K:ALIGN
# ═══════════════════════════════════════════════════════════════════════════════

[pipeline]
description = "How TrueScore feeds into impact pipeline"
reference = "mental_construct.schema.toml#impact_pipeline"

# Stage 1: This file generates TrueScore (0.0 - 1.0)
[pipeline.stage_1]
name = "TrueScore"
source = "feedback translation"
type = "float64"
precision = 7
range = "0.0 to 1.0"

# Stages 2-4 defined in mental_construct.schema.toml
[pipeline.subsequent_stages]
normalized = "mental_construct.schema.toml#impact_pipeline.normalized"
scaled = "mental_construct.schema.toml#impact_pipeline.scaled"
k_align_update = "mental_construct.schema.toml#impact_pipeline.k_align_update"

# ═══════════════════════════════════════════════════════════════════════════════
# EXAMPLES — Realistic Score Generation
# ═══════════════════════════════════════════════════════════════════════════════

[examples]
description = "Illustrative examples of feedback → TrueScore"

# Example 1: "Almost" feedback
[examples.almost]
feedback = "Almost"
range = "0.70 - 0.90"
assessment = "Response was close but missed one key element"
true_score = 0.7629384
reasoning = "Toward lower end because one clear gap identified"

# Example 2: "Exactly" feedback
[examples.exactly]
feedback = "Exactly"
range = "0.90 - 1.00"
assessment = "Response captured intent perfectly"
true_score = 0.9712845
reasoning = "High in range because full alignment observed"

# Example 3: "BAM!" emphatic feedback
[examples.emphatic]
feedback = "BAM!"
range = "0.90 - 1.00"
assessment = "Emphatic positive, breakthrough moment"
true_score = 0.9981234
reasoning = "Near max due to emphatic nature"

# Example 4: Qualified negative
[examples.qualified_negative]
feedback = "Not quite but I see what you mean"
range = "0.20 - 0.40"
base = 0.3000000
modifier = 0.1000000
true_score = 0.4000000
reasoning = "Qualifier lifted to neutral range boundary"

