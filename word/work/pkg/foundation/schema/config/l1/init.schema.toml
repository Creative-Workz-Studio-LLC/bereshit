# │                                                                             │
# │  Data range:      0-242 (243 values = 3^5)                                 │
# │  Metadata range:  128-140 (13 CPI-SI markers)                              │
# │  Spare range:     243-255 (13 WEB variants = Scripture fills overflow)    │
# │                                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘
