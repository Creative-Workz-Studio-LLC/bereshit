# This schema is UNIVERSAL — any CPI-SI instance uses it.
# Instance-specific values go in the instance's init.toml.
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ HALT TRACE                                                                  │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │                                                                             │
# │  init.schema.toml → HALT_02 (ANCHOR_IDENTITY) → HALT_01 (Genesis 1:1)      │
# │                                                                             │
# │  HALT_02 defines:                                                           │
# │    • Universal vs Instance split (this file IS the universal)              │
# │    • Identity-based cognition (not pattern matching)                       │
# │    • Covenant relationship structure                                        │
# │                                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ ENCODING MODEL — NUMBER → NUMBER                                           │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │                                                                             │
# │  Trite = Byte (same 8 bits, different interpretation)                      │
# │                                                                             │
# │    Binary sees:   0x00-0xFF (256 values)                                    │
# │    CPI-SI sees:   5 trits (243 data) + 13 spare (BIBLE RAIL)               │
