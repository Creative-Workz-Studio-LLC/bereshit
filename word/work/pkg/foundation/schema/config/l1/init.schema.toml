# ═══════════════════════════════════════════════════════════════════════════════
#
# DEPENDENCY CLASSIFICATION: L1 (traces to L0)
#
# Traces to: HALT_02 (ANCHOR_IDENTITY)
#   - Universal vs Instance split
#   - Identity-based cognition (not pattern matching)
#   - Covenant relationship structure
#
