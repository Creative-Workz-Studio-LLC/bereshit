# CPI-SI Task Schema — First-Class Task Entity (3-Block Data Structure)
# Key: claude-global-pkg-cpisi-schema-task
# ═══════════════════════════════════════════════════════════════════════════════
#
# DEPENDENCY CLASSIFICATION: L1 (traces to L0)
#
# Traces to: HALT_10 (STATE_HEBREW)
#   - 7 states = 7 Days of Creation
#   - Task IS a state position
#   - X = Y + kZ formula for STATE positions
#
# References: halts.toml (L0), cube.schema.toml (L1a), state.schema.toml (L1c)
#
# ═══════════════════════════════════════════════════════════════════════════════
# L1 = MINI STATE MACHINE
# ═══════════════════════════════════════════════════════════════════════════════
#
# The L1 schemas ARE the cube structure:
#
#   init.schema.toml  = ANCHOR    → 9 positions,  Z = (X+Y)/2
#   state.schema.toml = FRAMEWORK → 4 positions,  Y = X+Z
#   task.schema.toml  = STATE     → 14 positions, X = Y+kZ
#                                   ─────────────
#                                   27 total = 3³
#
# This file defines the 14 STATE positions where actual work happens.
# Tasks live AT positions. Positions ARE computation.
#
# ═══════════════════════════════════════════════════════════════════════════════

# =============================================================================
# METADATA
# =============================================================================
#
# Package:     claude-global/pkg/foundation/schema
