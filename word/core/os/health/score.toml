    "health.ternary",      # INTERPRETATION_MIN = -100, INTERPRETATION_MAX = 100, CENTER = 0
    "levels.broken",       # BROKEN_MIN_STORED = 0, BROKEN_MAX_STORED = 42
    "levels.wanting",      # WANTING_MIN_STORED = 43, WANTING_MAX_STORED = 84
    "levels.lacking",      # LACKING_MIN_STORED = 85, LACKING_MAX_STORED = 127
    "levels.even",         # EVEN_STORED = 128
    "levels.sound",        # SOUND_MIN_STORED = 129, SOUND_MAX_STORED = 170
    "levels.whole",        # WHOLE_MIN_STORED = 171, WHOLE_MAX_STORED = 212
    "levels.perfect"       # PERFECT_MIN_STORED = 213, PERFECT_MAX_STORED = 255
]

