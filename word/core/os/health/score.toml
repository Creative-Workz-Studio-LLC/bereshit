# -----------------------------------------------------------------------------
# 3. Policy - Modification
# -----------------------------------------------------------------------------
#
# CRYSTALLIZED FOUNDATION (Never Modify):
#   ❌ uint8 storage type (0-255)
#   ❌ 8-bit binary ASCII encoding
#   ❌ File format (single line, 8 chars + LF)
#   ❌ 128 as center point (even balance)
#
# INTERPRETATION LAYER (Built On Foundation):
#   ⚖️ Ternary mapping (-100 to +100)
#   ⚖️ Level thresholds (7-level system)
#   ⚖️ Display mappings (emoji, colors)
#
# Safe to Add:
#   ✅ New calculation triggers
#   ✅ Additional display formats
#   ✅ Comments and examples
#   ✅ Tool integration hooks
#
# Requires Coordination:
#   ⚠️ Changing level boundaries (affects interpretation)
#   ⚠️ Modifying decay rules (affects existing health)
#   ⚠️ Changing hierarchy rules (affects parent calculations)
#

