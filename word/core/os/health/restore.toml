#          sins be as scarlet, they shall be as white as snow."
#          — Isaiah 1:18 KJV
#
# Application: Restoration prescribes the path back to health:
#              - Recovery actions (what to do)
#              - Priority ordering (what to do first)
#              - Progress tracking (how far along)
#              - Completion verification (did it work)
#
# # CPI-SI Identity
#
# Component Type: Rung (schema that defines health restoration structure)
#
# Role: Schema definition for health restoration — the RESTORE phase in
#       detect → assess → restore workflow. Completes the immune system.
