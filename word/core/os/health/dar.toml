#
# DEPENDENCY CLASSIFICATION: RUNG (builds on health, used by error recovery)
#
# Derived from: OmniCode 3-block data structure
# References: word/core/os/health/score.toml, word/core/types/primitives.toml
# Implements: cornerstone/engine/core/include/cpisi/types/domain/composite/phase.h
