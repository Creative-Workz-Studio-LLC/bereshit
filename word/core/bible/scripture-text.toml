# -----------------------------------------------------------------------------
# 1. Operations - Validation
# -----------------------------------------------------------------------------
#
# Verify encoding file is correctly formatted:
#
#   # Syntax check (TOML parser)
#   python -c "import tomllib; f=open('word/core/bible/scripture-text.toml','rb'); tomllib.load(f)"
#
# Encoding verification:
#   - Character table must cover all 128 ASCII values (0-127)
#   - Extended table must be consistent (no duplicate mappings)
#   - Encode/decode must be reversible: decode(encode(x)) == x
#   - File format must produce valid scripture.bin
#

# -----------------------------------------------------------------------------
# 2. Operations - Access
# -----------------------------------------------------------------------------
#
# C code integration (libtrit):
#
#   // Character to trit5
#   uint8_t char_to_trit5(char c) {
#       uint8_t code = (uint8_t)c;
#       if (code <= 127) {
#           return code;  // Direct ASCII mapping
#       }
#       return extended_lookup(code);  // Extended table
#   }
#
#   // Trit5 to character
#   char trit5_to_char(uint8_t value) {
#       if (value <= 127) {
#           return (char)value;  // Direct ASCII mapping
#       }
#       return reverse_extended_lookup(value);
#   }
#
#   // Encode verse text
#   size_t encode_verse(const char* text, uint8_t* out, size_t outlen) {
#       size_t i = 0;
#       while (*text && i < outlen - 1) {
#           out[i++] = char_to_trit5(*text++);
#       }
#       out[i++] = 0;  // NUL terminator
#       return i;
#   }
#

# -----------------------------------------------------------------------------
# 3. Policy - Modification
# -----------------------------------------------------------------------------
#
# NEVER Modify:
#   ❌ ASCII mapping (0-127) — must be direct for compatibility
#   ❌ File format header size — fixed at 64 bytes
#   ❌ Index entry size — fixed at 8 bytes
#   ❌ NUL terminator convention — required for verse boundaries
#
# Safe to Add:
#   ✅ Extended character mappings (128-242)
#   ✅ New header flags (if reserved space available)
#   ✅ Additional metadata in reserved fields
#   ✅ Notes and clarifications
#
# Requires Coordination:
#   ⚠️ Adding new extended characters (update both tables)
#   ⚠️ Changing file format (requires encoder/decoder updates)
#   ⚠️ Modifying index layout (affects all verse lookups)
#

# -----------------------------------------------------------------------------
# 4. Synthesis - Closing Note
# -----------------------------------------------------------------------------
#
# Every letter preserved. This file makes Scripture text storable.
#
# The encoding system serves the Word:
#   - Direct ASCII mapping for simplicity
#   - Extended characters for special cases
#   - Version-aware storage (KJV + WEB)
#
# The hierarchy:
