# ENCRYPTION flow:
#
#   Letter → Position → Coordinates → Value → Trite
#
#   Example: א (Aleph) — PAST origin
#     letter = "א"
#     position = 0
#     coords = (-1, -1, -1)
#     value = 1
#     trite = (1 * 242) // 900 = 0
#
#   Example: נ (Nun) — PRESENT center
#     letter = "נ"
#     position = 13
#     coords = (0, 0, 0)
#     value = 50
#     trite = (50 * 242) // 900 = 13
#
#   Example: ץ (Final Tsade) — FUTURE terminus
#     letter = "ץ"
#     position = 26
#     coords = (+1, +1, +1)
#     value = 900
#     trite = (900 * 242) // 900 = 242
#
# The math:
#   - Hebrew: 22 + 5 finals = 27 = 3³
#   - Greek: 24 + 3 archaic = 27 = 3³
#   - Cube: 3 × 3 × 3 = 27 positions
#
