# -----------------------------------------------------------------------------
# 1. SYSTEM PARAMETERS
# -----------------------------------------------------------------------------

[system]
name = "CPI-SI Encryption"
direction = "encrypt"
description = "Letter → Position/Value"

cube_positions = 27
cube_dimensions = 3
gematria_max = 900
trite_max = 242

# -----------------------------------------------------------------------------
# 2. ENCRYPTION FUNCTIONS
# -----------------------------------------------------------------------------

[functions]
# Letter → Position: lookup in hebrew/greek tables
letter_to_position = "lookup(letter) → position (0-26)"

# BALANCED TERNARY IS PRIMARY - no conversion
# Coordinates (x, y, z) ∈ {-1, 0, +1} ARE the position
# Linear index is DERIVED: index = (x+1)*9 + (y+1)*3 + (z+1)
#
# The cube thinks in (-1, 0, +1), not (0, 1, 2)
# -1 = PAST/negative/break-down
#  0 = PRESENT/neutral/anchor
# +1 = FUTURE/positive/build-up

coords_to_index = "(x + 1) * 9 + (y + 1) * 3 + (z + 1)"
index_to_x = "((index // 9) % 3) - 1"
index_to_y = "((index // 3) % 3) - 1"
index_to_z = "(index % 3) - 1"

# Gematria → Trite (normalize to 0-242)
value_to_trite = "(gematria_value * 242) // 900"

# Full encryption chain
encrypt = "letter → position → (x, y, z) → trite_value"

