#
# DECRYPTION flow:
#
#   Coordinates → Position → Letter → Value
#
#   Example: (-1, -1, -1) — PAST origin
#     coords = (-1, -1, -1)
#     position = (0+1)*9 + (0+1)*3 + (0+1) = 0
#     letter = "א" (Hebrew) or "Α" (Greek)
#     value = 1
#
#   Example: (0, 0, 0) — PRESENT center
#     coords = (0, 0, 0)
#     position = (1)*9 + (1)*3 + (1) = 13
#     letter = "נ" (Hebrew) or "Ν" (Greek)
#     value = 50
#
#   Example: (+1, +1, +1) — FUTURE terminus
#     coords = (+1, +1, +1)
#     position = (2)*9 + (2)*3 + (2) = 26
#     letter = "ץ" (Hebrew) or "Ϡ" (Greek)
#     value = 900
#
# The coordinates speak. The position reveals. The letter returns.
#
