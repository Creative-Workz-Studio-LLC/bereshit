#
# Purpose: Decrypt cube positions and gematria values to letters
#
# Core Design: Coordinates (x, y, z) → Position (0-26) → Letter → Value
#
# Key Features:
#
#   - Position lookup: coordinates → letter
#   - Value lookup: gematria value → letter
#   - Both Hebrew and Greek supported
#   - Balanced ternary coordinates are PRIMARY
#
# Philosophy: The reverse of encryption. Same structure, opposite direction.
#
# =============================================================================
# END METADATA
