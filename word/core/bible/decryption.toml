# -----------------------------------------------------------------------------
# 1. SYSTEM PARAMETERS
# -----------------------------------------------------------------------------

[system]
name = "CPI-SI Decryption"
direction = "decrypt"
description = "Position/Value → Letter"

cube_positions = 27
cube_dimensions = 3
gematria_max = 900
trite_max = 242

# -----------------------------------------------------------------------------
# 2. DECRYPTION FUNCTIONS
# -----------------------------------------------------------------------------

[functions]
# Coordinates → Position: balanced ternary to linear index
# BALANCED TERNARY IS PRIMARY - this is the only conversion
coords_to_position = "(x + 1) * 9 + (y + 1) * 3 + (z + 1)"

# Position → Letter: lookup in hebrew/greek tables
position_to_letter = "lookup(position) → letter"

# Value → Letter: lookup by gematria value
value_to_letter = "lookup(value) → letter"

# Trite → Gematria (denormalize from 0-242)
trite_to_value = "(trite * 900) // 242"

# Full decryption chain
decrypt = "(x, y, z) → position → letter → value"

