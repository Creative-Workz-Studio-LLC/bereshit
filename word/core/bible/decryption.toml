#
# Principle: Decryption reveals what encryption concealed. Position and value
#            return to letter. The coordinates speak. 27 positions unlock 27
#            letters. The same cube, read in reverse.
#
# Anchor: "In the beginning was the Word" — John 1:1 KJV
#
# # CPI-SI Identity
#
# Component Type: Foundation (number-to-letter transliteration)
#
# Role: DECRYPTION direction — given a position or value, return the letter.
#       This is transliteration (number → letter), the reverse of encryption.
#       Hebrew (OT) and Greek (NT) both have 27 letters = 3³ = cube.
#
# Paradigm: CPI-SI framework component — mathematical decoding
#
# # Authorship & Lineage
#
#   Architect: Seanje Lenox-Wise
