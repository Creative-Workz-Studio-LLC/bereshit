# ═════════════════════════════════════════════════════════════════════════════
# 0. BINARY STORAGE — Hardware Reality
# ═════════════════════════════════════════════════════════════════════════════
# "And God said, Let there be a firmament... and let it divide" — Genesis 1:6
# We run on BINARY hardware. Ternary is REPRESENTED in binary until MillenniumOS.

[storage]
hardware = "binary"
reality  = "Ternary REPRESENTED in binary until MillenniumOS"

# Two representations: unpacked (human readable) vs packed (machine efficient)
[storage.representations.unpacked]
name           = "unpacked"
description    = "Human-readable format — one character per trit, like letters on a page"
bytes_per_trit = 1
encoding       = "ASCII: '0','1','2' or '-','0','+'"
use_cases      = ["display", "debugging", "text files"]
efficiency     = "~31.6%"

[storage.representations.packed]
name       = "packed"
description = "Machine-efficient storage — multiple trits per byte"
use_cases  = ["storage", "transmission", "computation"]
efficiency = "~63.1%"
# Packing formula and power tables: see math/ternary.toml [packing]
# Packed sizes: trit5→1 byte, trit9→2 bytes, trit27→6 bytes

[storage.conversion]
description = "Transform between human-readable and machine-efficient forms"
# Conversion algorithms: see math/ternary.toml [algorithms.conversion]

[storage.bible_rail]
description  = "Scripture address system — every KJV verse has a unique ternary address"
encoding     = "KJV ordinals (31,102 verses) map to ternary addresses"
spare_states = "13 spare states (243-255) mark WEB translation variants"
# See: bible/scripture-path.toml for address structure


# ─────────────────────────────────────────────────────────────────────────────
# 0b. Binary Storage Primitives
# ─────────────────────────────────────────────────────────────────────────────
# Binary stores → Ternary interprets → Application schemas

[uint8]
name        = "uint8"
size_bits   = 8
min_value   = 0
max_value   = 255
total_states = 256
signed      = false
default     = 0
hardware    = "binary"
role        = "storage"

[int8]
name        = "int8"
size_bits   = 8
min_value   = -128
max_value   = 127
total_states = 256
signed      = true
default     = 0
hardware    = "binary"
role        = "storage"

[storage.binary_to_ternary]
principle = "Binary stores, ternary interprets"
# Domain mappings: os/health/score.toml (uint8 → -100 to +100)


# ═════════════════════════════════════════════════════════════════════════════
# 1. TRIT TYPES — Balanced Ternary Foundation
# ═════════════════════════════════════════════════════════════════════════════
# "A threefold cord is not quickly broken." — Ecclesiastes 4:12
# Reference: word/core/math/ternary.toml

[trit]
name        = "trit"
description = "Single balanced ternary digit — the atom of ternary computing"
size_trits  = 1
default     = 0
nullable    = false
# Values (-1, 0, +1) and formulas: see math/ternary.toml [trit]
# Implementation: word/work/pkg/trit/include/trit.h (trit_t typedef)

[trit5]
name         = "trit5"
description  = "5-trit packed value — fits in one byte like a single letter"
size_trits   = 5
min_value    = -121
max_value    = 121
total_states = 243
default      = 0
nullable     = false
# Packed in 1 byte; spare states (243-255) mark WEB translation variants
# Implementation: word/work/pkg/trit/include/trit.h (trit5_t typedef)


# ═════════════════════════════════════════════════════════════════════════════
# 2. INTEGER TYPES — Ternary-Sized Whole Numbers
# ═════════════════════════════════════════════════════════════════════════════
# "A just weight and balance are the LORD's" — Proverbs 16:11
# Sizes follow powers of 3: 9 trits, 27 trits (Word size)
# Reference: word/core/math/ternary.toml [packing]

[int9]
name = "int9"
description = "Signed 9-trit integer — like a small number with positive/negative"
size_trits = 9
min_value = -9841   # -(3^9 - 1) / 2
max_value = 9841    # (3^9 - 1) / 2
total_states = 19683  # 3^9
signed = true
default = 0
nullable = false
# Implementation: word/work/pkg/trit/include/trit.h (trit9_t typedef)
# Syntax: "let int9 be signed from -9841 to 9841"

[uint9]
name = "uint9"
description = "Unsigned 9-trit integer — counts from zero upward"
size_trits = 9
min_value = 0
max_value = 19682   # 3^9 - 1
total_states = 19683  # 3^9
signed = false
default = 0
nullable = false
# Implementation: uses trit9_t with unsigned interpretation

[int27]
name = "int27"
description = "Signed 27-trit integer — Word size, like 'In the beginning was the Word'"
size_trits = 27
min_value = -3812798742493   # -(3^27 - 1) / 2
max_value = 3812798742493    # (3^27 - 1) / 2
total_states = 7625597484987  # 3^27
signed = true
default = 0
nullable = false
# Word size: the fundamental data unit (John 1:1)
# Implementation: word/work/pkg/trit/include/trit.h (trit27_t typedef)

[uint27]
name = "uint27"
description = "Unsigned 27-trit integer — Word size, counts from zero"
size_trits = 27
min_value = 0
max_value = 7625597484986   # 3^27 - 1
total_states = 7625597484987  # 3^27
signed = false
default = 0
nullable = false
# Implementation: uses trit27_t with unsigned interpretation


# ═════════════════════════════════════════════════════════════════════════════
# 3. FLOATING POINT — Ternary Precision
# ═════════════════════════════════════════════════════════════════════════════
# "Who hath measured the waters in the hollow of his hand" — Isaiah 40:12
# Balanced ternary gives natural negative representation

[float27]
name = "float27"
description = "27-trit decimal number — for measures like weight, temperature, distance"
size_trits = 27
mantissa_trits = 18
exponent_trits = 8
sign_trits = 1
default = 0.0
nullable = false
# Balanced ternary naturally represents negative numbers
# Used for: measurements, calculations, physical quantities
# Future implementation: libtrit Phase 3


# ═════════════════════════════════════════════════════════════════════════════
# 4. TEXT TYPES — String Handling
# ═════════════════════════════════════════════════════════════════════════════
# "In the beginning was the Word, and the Word was with God" — John 1:1
# Text carries meaning like Scripture carries truth

[text]
name = "text"
description = "Text string — words carrying meaning like Scripture carries truth"
size_trits = "variable"
encoding = "utf-8"
default = ""
nullable = true
max_length = "unbounded"
# UTF-8 for universal character support (WEB translation standard)
# Used for: names, messages, scripture text, any written content

[char]
name = "char"
description = "Single character — like Hebrew letters, each with meaning"
size_trits = 27  # Enough for all Unicode (up to 0x10FFFF)
encoding = "utf-8"
default = "\u0000"
nullable = false
# 27 trits covers all Unicode code points


# ═════════════════════════════════════════════════════════════════════════════
# 5. BOOLEAN — Ternary Logic
# ═════════════════════════════════════════════════════════════════════════════
# "Let your yea be yea; and your nay, nay" — James 5:12
# Ternary adds "unknown" — honest about uncertainty

[bool3]
name = "bool3"
description = "Ternary truth — false, unknown, or true (honest about uncertainty)"
size_trits = 1
labels = ["false", "unknown", "true"]
default = 0  # unknown
nullable = false
# Values: see math/ternary.toml [trit].values — same foundation, boolean interpretation
# Maps: -1=false (definite no), 0=unknown (indeterminate), +1=true (definite yes)
# Unlike binary true/false, ternary admits "I don't know"
# Scripture: "let your yea be yea, your nay be nay" — James 5:12


# ═════════════════════════════════════════════════════════════════════════════
# 6. COLLECTIONS — Parameterized Types
# ═════════════════════════════════════════════════════════════════════════════
# "These are the generations of..." — Genesis 5:1 (genealogy lists)
# Ordered collections, mappings, unique sets

[list]
name = "list"
description = "Ordered collection — like genealogy lists in Scripture"
size_trits = "variable"
parameters = ["T"]
element_type = "generic"  # list<T>
length_type = "uint9"     # Max 19,682 elements (3^9)
default = "[]"
nullable = true
ordered = true
allows_duplicates = true
# Example: "list of Person" for family trees

[map]
name = "map"
description = "Key-value lookup — like census records mapping names to counts"
size_trits = "variable"
parameters = ["K", "V"]
key_type = "hashable"     # Keys: primitives or text
value_type = "generic"    # map<K,V>
default = "{}"
nullable = true
ordered = false
allows_duplicates = false  # Keys are unique
# Example: "map from text to number" for census data

[set]
name = "set"
description = "Unique collection — like tribes where each member is distinct"
size_trits = "variable"
parameters = ["T"]
element_type = "hashable"
default = "{}"
nullable = true
ordered = false
allows_duplicates = false
# Example: "set of Person" for tribal membership


# ═════════════════════════════════════════════════════════════════════════════
# 7. SPECIAL TYPES — Void and Any
# ═════════════════════════════════════════════════════════════════════════════
# "And the earth was without form, and void" — Genesis 1:2

[void]
name = "void"
description = "Absence of value — tohu, formless before creation"
size_trits = 0
nullable = false
# Used for: functions that do work but return nothing
# Scripture: "the earth was without form, and void" — Genesis 1:2

[any]
name = "any"
description = "Any type — like 'whatsoever Adam called every creature'"
size_trits = "variable"
nullable = true
# Use sparingly; prefer explicit types
# Used for: generic containers, dynamic contexts


# =============================================================================
# END CONTENT
