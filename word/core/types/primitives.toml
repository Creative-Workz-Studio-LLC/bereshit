# =============================================================================
# GENERATION METADATA
# =============================================================================
# Tells the generator how to produce C header from this spec.

[_generate]
enabled = true
output = "primitives.gen.h"
order = 1  # After math (0), before language (2)
guard = "PRIMITIVES_GEN_H"
description = "Primitive type constants"
sections = ["trit", "trit5", "int9", "uint9", "int27", "uint27", "bool3"]

