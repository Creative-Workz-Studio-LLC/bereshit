# ═════════════════════════════════════════════════════════════════════════════
# BUILDING BLOCK — Trit-to-Operation Mapping
# ═════════════════════════════════════════════════════════════════════════════
# -1 = break_down (toward anchor)   0 = anchor (halt)   +1 = build_up (from anchor)

[building_block]
description     = "CPI-SI reasoning method — trit values as cognitive operations"
operations      = ["break_down", "anchor", "build_up"]
equation        = "-1 + 0 + 1 = 0"                           # Balanced, never through anchor
genesis_pattern = ["waters_below", "firmament", "waters_above"]    # Genesis 1:6
numbers_pattern = ["toward_foundation", "tabernacle_midst", "from_foundation"]


# ═════════════════════════════════════════════════════════════════════════════
# GENESIS 1:1 — Fundamental Constants (TIME/SPACE/MATTER)
# ═════════════════════════════════════════════════════════════════════════════
# "In the beginning God created the heaven and the earth." — Genesis 1:1
#
# Trit → Dimension → Phrase → Function:
#   0  → TIME   → "In the beginning" → when
#  +1  → SPACE  → "the heavens"      → where
#  -1  → MATTER → "the earth"        → what

[genesis_1_1.constants]
time   = { trit = 0,  phrase = "In the beginning", function = "when",  cognitive = "temporal_awareness" }
space  = { trit = 1,  phrase = "the heavens",      function = "where", cognitive = "spatial_awareness" }
matter = { trit = -1, phrase = "the earth",        function = "what",  cognitive = "material_awareness" }

# God: TIME → SPACE → MATTER (top-down)   We: MATTER → SPACE → TIME (bottom-up)
# "For as the heavens are higher than the earth..." — Isaiah 55:9
[genesis_1_1.directions]
creation       = ["TIME", "SPACE", "MATTER"]
implementation = ["MATTER", "SPACE", "TIME"]

# Moral polarity: "Set your affection on things above..." — Colossians 3:2
[genesis_1_1.moral_compass]
positive = { trit = 1,  direction = "above",  meaning = "heavenly, toward God" }
negative = { trit = -1, direction = "below",  meaning = "earthly, away from God" }
anchor   = { trit = 0,  direction = "center", meaning = "temporal anchor, halt condition" }


# ═════════════════════════════════════════════════════════════════════════════
# DIMENSIONS — Cognitive Navigation Framework
# ═════════════════════════════════════════════════════════════════════════════
# Trits encode DIMENSIONS of awareness. Building block = dimensional navigation.
# CPI-SI navigates cognitive space; AI processes flat vectors.

[dimensions.temporal]
trit           = 0
name           = "Temporal Awareness"
question       = "when"
function       = "Sequence, causality, order, precedence"
building_block = "anchor"
navigation     = "Halt condition — recursion terminates"

[dimensions.spatial]
trit           = 1
name           = "Spatial Awareness"
question       = "where"
function       = "Relationships, position, context, connections"
building_block = "build_up"
navigation     = "Toward relationships, meaning, abstraction"

[dimensions.material]
trit           = -1
name           = "Material Awareness"
question       = "what"
function       = "Identity, substance, concrete reality"
building_block = "break_down"
navigation     = "Toward foundation, concreteness, anchor"

[dimensions.navigation]
break_down = { direction = -1, toward = "matter", description = "Trace toward foundation" }
anchor     = { direction = 0,  toward = "time",   description = "Halt at temporal center" }
build_up   = { direction = 1,  toward = "space",  description = "Construct toward meaning" }

implementation_order = ["material", "spatial", "temporal"]    # Our way: bottom-up
creation_order       = ["temporal", "spatial", "material"]    # God's way: top-down


# ═════════════════════════════════════════════════════════════════════════════
# TEMPORAL STATES — 9-State Cognitive Model
# ═════════════════════════════════════════════════════════════════════════════
# Position IN time (past/present/future), not the temporal dimension itself.
# "To every thing there is a season..." — Ecclesiastes 3:1

# 3 Base States: where in time
[temporal_states.base]
past    = { trit = -1, meaning = "what was",     cognitive = "memory, history, foundation" }
present = { trit = 0,  meaning = "what is",      cognitive = "now, current, anchor" }
future  = { trit = 1,  meaning = "what will be", cognitive = "anticipation, planning, direction" }

# 6 Compound States: lens (viewing FROM) → target (viewing AT)
[temporal_states.compound]
memory      = { lens = "past",    target = "present", description = "past informing now" }
prophecy    = { lens = "past",    target = "future",  description = "pattern recognition across time" }
reflection  = { lens = "present", target = "past",    description = "analyzing what was" }
planning    = { lens = "present", target = "future",  description = "anticipating what will be" }
hindsight   = { lens = "future",  target = "past",    description = "wisdom from imagined future" }
preparation = { lens = "future",  target = "present", description = "urgency from future perspective" }

[temporal_states.structure]
fields         = ["lens", "target", "is_compound"]
base_count     = 3
compound_count = 6
total_modes    = 9


# ═════════════════════════════════════════════════════════════════════════════
# ALGORITHMS — Pack/Unpack Conversion (PURE MATH)
# ═════════════════════════════════════════════════════════════════════════════
# "The LORD by wisdom hath founded the earth; by understanding hath he established the heavens." — Proverbs 3:19
# Formulas for converting between trit arrays and packed integers.
# Implementation: word/work/pkg/trit/src/pack.c (trit5_pack, trit5_unpack)

# Balanced ↔ Unsigned: foundation of all pack/unpack
[algorithms.conversion]
description     = "Trit value offset for packing algorithms"
to_unsigned     = "trit_unsigned = trit_balanced + 1"
to_balanced     = "trit_balanced = trit_unsigned - 1"
balanced_values = [-1, 0, 1]
unsigned_values = [0, 1, 2]

# Pack: Trit[] → Integer (Horner's method, MST first, O(n))
[algorithms.pack]
description = "Convert trit array to packed integer"
name        = "Horner's method"
complexity  = "O(n)"
direction   = "MST first"
formula     = "result = result * 3 + (trit + 1)"

# Unpack: Integer → Trit[] (Repeated division, LST first, O(n))
[algorithms.unpack]
description = "Convert packed integer to trit array"
name        = "Repeated division"
complexity  = "O(n)"
direction   = "LST first"
formula     = "trit = (value % 3) - 1; value = value / 3"


