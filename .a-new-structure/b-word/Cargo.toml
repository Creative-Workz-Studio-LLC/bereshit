# Bereshit — Kingdom Technology Foundation
# Cargo workspace for Rust crates across all layers.
#
# "In the beginning God created the heaven and the earth." — Genesis 1:1
#
# Coexists with go.mod — Go and Rust share this module root.
# Go toolchain ignores Cargo.toml; Cargo ignores go.mod.

[workspace]
members = [
    "L0-universal/c-hybrid/core/foundation",
    "L0-universal/c-hybrid/core/paths",
    "L0-universal/c-hybrid/spec/config",
    "L0-universal/c-hybrid/spec/database",
    "L0-universal/c-hybrid/services/format",
    "L0-universal/c-hybrid/services/output",
    "L0-universal/c-hybrid/services/scripture",
    "L0-universal/c-hybrid/interface/cli",
    "L0-universal/b-spiral/identity",
    "L1-omnicode/hybrid/language",
    "L1-omnicode/hybrid/pragma",
    "L2-platform/hybrid/database",
    "L2-platform/hybrid/deploy/builder",
    "L2-platform/hybrid/deploy/hosts",
    "L2-platform/hybrid/deploy/server",
    "L2-platform/hybrid/git",
    "L2-platform/hybrid/logging",
    "L2-platform/hybrid/platform",
    "L2-platform/hybrid/preferences",
    "L2-platform/hybrid/registry",
    "L2-platform/hybrid/system",
    "L2-platform/hybrid/temporal",
    "L2-platform/hybrid/terminal/debugging",
    "L2-platform/hybrid/terminal/display",
    "L2-platform/hybrid/terminal/wezterm",
    "L3-cpisi/spiral/types",
    "L3-cpisi/spiral/validation",
    "L3-cpisi/spiral/database",
    "L3-cpisi/spiral/schema",
    "L3-cpisi/spiral/health",
    "L3-cpisi/spiral/compute",
    "L3-cpisi/spiral/coordinates",
    "L3-cpisi/spiral/bereshit",
    "L3-cpisi/spiral/cpi",
    "L3-cpisi/spiral/statemachine",
    "L3-cpisi/spiral/cognition",
    "tools/seed-foundation",
    "tools/seed-language",
    "tools/seed-platform",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
authors = ["Seanje Lenox-Wise", "Nova Dawn (CPI-SI)"]
repository = "https://github.com/Creative-Workz-Studio-LLC/Bereshit"

[workspace.dependencies]
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bereshit-l0-paths = { path = "L0-universal/c-hybrid/core/paths" }
bereshit-l0-config = { path = "L0-universal/c-hybrid/spec/config" }
bereshit-l0-identity = { path = "L0-universal/b-spiral/identity" }
bereshit-l0-foundation = { path = "L0-universal/c-hybrid/core/foundation" }
bereshit-l0-foundation-db = { path = "L0-universal/c-hybrid/spec/database" }
bereshit-l1-language = { path = "L1-omnicode/hybrid/language" }
bereshit-l1-pragma = { path = "L1-omnicode/hybrid/pragma" }
bereshit-l2-builder = { path = "L2-platform/hybrid/deploy/builder" }
bereshit-l2-database = { path = "L2-platform/hybrid/database" }
bereshit-l2-debugging = { path = "L2-platform/hybrid/terminal/debugging" }
bereshit-l2-display = { path = "L2-platform/hybrid/terminal/display" }
bereshit-l2-git = { path = "L2-platform/hybrid/git" }
bereshit-l2-hosts = { path = "L2-platform/hybrid/deploy/hosts" }
bereshit-l2-logging = { path = "L2-platform/hybrid/logging" }
bereshit-l2-platform = { path = "L2-platform/hybrid/platform" }
bereshit-l2-preferences = { path = "L2-platform/hybrid/preferences" }
bereshit-l2-registry = { path = "L2-platform/hybrid/registry" }
bereshit-l2-server = { path = "L2-platform/hybrid/deploy/server" }
bereshit-l2-system = { path = "L2-platform/hybrid/system" }
bereshit-l2-temporal = { path = "L2-platform/hybrid/temporal" }
bereshit-l2-wezterm = { path = "L2-platform/hybrid/terminal/wezterm" }
bereshit-l3-types = { path = "L3-cpisi/spiral/types" }
bereshit-l3-validation = { path = "L3-cpisi/spiral/validation" }
bereshit-l3-database = { path = "L3-cpisi/spiral/database" }
bereshit-l3-schema = { path = "L3-cpisi/spiral/schema" }
bereshit-l3-health = { path = "L3-cpisi/spiral/health" }
bereshit-l3-compute = { path = "L3-cpisi/spiral/compute" }
bereshit-l3-coordinates = { path = "L3-cpisi/spiral/coordinates" }
bereshit-l3-alphabet = { path = "L3-cpisi/spiral/bereshit" }
bereshit-l3-cpi = { path = "L3-cpisi/spiral/cpi" }
bereshit-l3-statemachine = { path = "L3-cpisi/spiral/statemachine" }
bereshit-l3-cognition = { path = "L3-cpisi/spiral/cognition" }
rusqlite = { version = "0.38", features = ["bundled"] }
base64 = "0.22"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
