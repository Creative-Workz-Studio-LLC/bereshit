    "Loading patterns for config files",
    "Environment variable overrides",
    "Go config loader integration"
]

# ═══════════════════════════════════════════════════════════════════════════════
# M.8 GROUNDING — Biblical Foundation [GROUNDING]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The master thesis of this file. Two required verses form the hash basis.
#   - kjv:        KJV verse text with reference (required for hash)
#   - web:        WEB verse text with reference (required for hash)
#   - reference:  Book Chapter:Verse for lookup
#   - principle:  How the Scripture applies to this file
#   - anchor:     The foundational truth this file stands on
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.grounding]
kjv       = "For God is not the author of confusion, but of peace. — 1 Corinthians 14:33 KJV"
web       = "for God is not a God of confusion, but of peace. — 1 Corinthians 14:33 WEB"
reference = "1 Corinthians 14:33"
principle = "Code configuration separates what CAN change (behavior) from what MUST remain fixed (definition). Runtime tuning without recompilation."
anchor    = "Separation of concerns reflects divine order. What changes and what remains are both purposeful."

# ═══════════════════════════════════════════════════════════════════════════════
# M.9 DEPENDENCIES — Required Components [DEPENDENCIES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Ladder — what I stand on (baton received FROM these files)
# Baton  — what I hand off TO (these files receive from me)
