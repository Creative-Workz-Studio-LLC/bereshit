# ═══════════════════════════════════════════════════════════════════════════════
#
# The 1 field that answers "What template is this based on?"
#   - derives: Path to parent template (or "none" for root)
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.derivation]
derives = "b-word/seed/data/toml/config.toml"

# ═══════════════════════════════════════════════════════════════════════════════
# M.6 CLASSIFICATION — Categorization [CLASSIFICATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 1 field that answers "What category is this?"
#   - tags: Array of keywords for querying/filtering
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.classification]
tags = ["template", "toml", "config", "code", "seed", "3-block"]

# ═══════════════════════════════════════════════════════════════════════════════
# M.7 INTENT — Purpose Statement [INTENT]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 3 fields that answer "Why does this file exist?"
#   - purpose:    Core statement of why this exists
#   - philosophy: Guiding principles (array)
#   - provides:   What this delivers/enables (array)
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.intent]
