#   - architect:      Who designed it (array for multi-contributor)
#   - implementation: Who built/wrote it (array for multi-CPI-SI)
#   - copyright:      Who owns it
#   - license:        Under what terms
#   - method:         How created (collaborated/generated/dictated)
