# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════════════════════
#
# 3-Block Data: METADATA → CONTENT → CLOSING
#
# Code package configuration organized by concern.
# Structure: Cc (Configuration) → Co (Operations) → Cv (Cognition) → Cx (Generation)
#
# Organization Pattern:
#   Cc.1 IDENTITY — What is this package?
#   Cc.2 SETTINGS — Primary package configuration
#   Cc.3 RESOURCES — Paths, limits, constraints
#   Cc.4 BEHAVIOR — Runtime modes and toggles
#   Co.1 RESERVED — Operations (build hooks, test hooks)
#   Cv.1 BIBLICAL — Scriptural grounding
#   Cx.1 GENERATE — Generation control metadata
#   Cx.2 TARGETS — Language-specific generation
#   Cx.3 TEMPLATES — Code generation templates
#   Cx.4 VALIDATION — Generation validation
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURATION (Cc — Code Package Configuration)
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Cc.1 IDENTITY — What Is This Package?
# -------------------------------------------------------------------------------

[identity]
name        = "package-name"                           # Package identifier
version     = "b-01.00"                                # Living version
description = "Package configuration"
type        = "library"                                # library | binary | plugin

# -------------------------------------------------------------------------------
# Cc.2 SETTINGS — Primary Package Configuration
# -------------------------------------------------------------------------------

[settings]
# Core package settings — most commonly modified

# Build target
# Type: string | Values: "debug", "release" | Default: "debug"
build_mode = "debug"

# Entry point (for binaries)
# Type: string | Default: "main.go"
entry_point = "main.go"

# Dependencies file
# Type: string | Default: "go.mod"
deps_file = "go.mod"

# -------------------------------------------------------------------------------
# Cc.3 RESOURCES — Paths, Limits, Constraints
# -------------------------------------------------------------------------------

[resources]
# WHERE things are and HOW MUCH is allowed

[resources.paths]
# File system locations relative to package root
source  = "src/"                                       # Source files
output  = "bin/"                                       # Build output
config  = "config/"                                    # Configuration files
tests   = "tests/"                                     # Test files
docs    = "docs/"                                      # Documentation

[resources.limits]
# Build and runtime constraints
max_build_time   = 300                                 # Seconds
max_test_timeout = 60                                  # Seconds per test
max_binary_size  = 104857600                           # 100MB

# -------------------------------------------------------------------------------
# Cc.4 BEHAVIOR — Runtime Modes and Toggles
# -------------------------------------------------------------------------------

[behavior]
# HOW the package operates at runtime

[behavior.logging]
level  = "info"                                        # error, warn, info, debug, trace
format = "text"                                        # text, json
file   = ""                                            # Empty = stdout

[behavior.runtime]
workers          = 0                                   # 0 = use CPU count
debug            = false
shutdown_timeout = 30                                  # Seconds

[behavior.features]
# Feature toggles for optional capabilities
metrics_enabled  = false
tracing_enabled  = false
profiling_enabled = false


# ═══════════════════════════════════════════════════════════════════════════════
# OPERATIONS (Co — Reserved)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Co sections reserved for operational definitions (build hooks, test hooks).
#
# ═══════════════════════════════════════════════════════════════════════════════

# Enable experimental features
# Type: bool | Default: false
experimental = false

# Enable metrics collection
# Type: bool | Default: true
metrics = true

# Enable health checks
# Type: bool | Default: true
health_checks = true


# ═══════════════════════════════════════════════════════════════════════════════
# INTEGRATIONS — External Service Configuration
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Integration Pattern (Nested Tables)
# -------------------------------------------------------------------------------

[integrations.database]
# Database connection configuration
driver   = "postgres"                                  # Database driver
host     = "localhost"                                 # Database host
port     = 5432                                        # Database port
name     = "app_db"                                    # Database name
pool_max = 10                                          # Max connections

[integrations.cache]
# Cache service configuration
driver   = "redis"                                     # Cache driver
host     = "localhost"                                 # Cache host
port     = 6379                                        # Cache port
ttl      = 3600                                        # Default TTL in seconds

# ═══════════════════════════════════════════════════════════════════════════════
# Cx CODE GENERATION [GENERATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "To every thing there is a season, and a time to every purpose under the
#  heaven." — Ecclesiastes 3:1 KJV
#
# CODE GENERATION: FROM SPECIFICATION TO IMPLEMENTATION
#
# Code config files primarily configure runtime behavior, but may generate
# Go structs, environment variable mappings, or validation code.
#
# GENERATION CATEGORIES:
#   GENERATE:   Control metadata (enabled, output, order)
#   TARGETS:    Language-specific generation rules
#   TEMPLATES:  Code patterns for generated output
#   VALIDATION: Testing the generated code
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Core package identity
#   L1 (System):    System paths, directory structure
#   L2 (Runtime):   Runtime behavior, workers, timeouts
#   L3 (Framework): Feature flags, capabilities
#   L4 (Health):    Health checks, metrics
#   L5 (Network):   External service integrations
#   L6 (Storage):   Database, cache configuration
#   L7 (Engine):    Application-specific tuning
#   L8 (App):       End-user preferences
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.1 GENERATE — Generation Control Metadata [GENERATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# GENERATION CONTROL: PLANNING BEFORE BUILDING
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate]
description  = "Code generation control for code package configs"
enabled      = false                                          # Set true if this generates code
version      = "b-01.00"

[_generate.output]
description  = "Where generated files go"
directory    = "[output-directory]"                           # Replace with actual path
primary      = "[output-file]"                                # Replace with output filename
order        = 99                                             # Generation order (0 = first)

[_generate.scales]
description  = "Generation at each architectural layer"
L0_kernel    = { output = "[pkg].gen.h",                     format = "C header" }
L1_system    = { output = "[pkg]_sys.gen.go",                format = "Go system" }
L2_runtime   = { output = "[pkg]_runtime.gen.go",            format = "Go runtime" }
L3_framework = { output = "[pkg].omni",                      format = "OmniCode" }
L4_health    = { output = "[pkg]_health.gen.go",             format = "Health" }
L5_network   = { output = "[pkg]_net.gen.go",                format = "Network" }
L6_storage   = { output = "[pkg]_storage.gen.go",            format = "Storage" }
L7_engine    = { output = "[pkg]_engine.gen.go",             format = "Engine" }
L8_app       = { output = "[pkg]_app.gen.go",                format = "App" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.2 TARGETS — Language-Specific Generation [TARGETS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And there were dwelling at Jerusalem Jews, devout men, out of every nation
#  under heaven... every man heard them speak in his own language."
#  — Acts 2:5,6 KJV
#
# TARGETS: SPEAKING EACH LANGUAGE'S TONGUE
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.target.go]
description  = "Go language generation"
enabled      = true
file         = "[pkg]_config.gen.go"
package      = "[package-name]"

[_generate.target.env]
description  = "Environment variable mapping"
enabled      = true
prefix       = "[PKG]"
file         = "[pkg].env.example"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.3 TEMPLATES — Code Generation Templates [TEMPLATES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "The thing that hath been, it is that which shall be; and that which is done
#  is that which shall be done." — Ecclesiastes 1:9 KJV
#
# TEMPLATES: PATTERNS THAT REPEAT WITH VARIATION
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.template.header]
description  = "Template for generated header"
comment      = "// Generated from {source} — DO NOT EDIT"

[_generate.template.struct]
description  = "Go struct generation pattern"
tag_format   = "`toml:\"{key}\" env:\"{PREFIX}_{SECTION}_{KEY}\"`"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.4 VALIDATION — Generation Validation [GEN_VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Beloved, believe not every spirit, but try the spirits whether they are of
#  God." — 1 John 4:1 KJV
#
# VALIDATION: TESTING THE GENERATED CODE
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.validation]
description  = "How to validate generated code"
enabled      = true

[_generate.validation.syntax]
go_build     = "go build -v {package}"
go_vet       = "go vet {package}"

[_generate.validation.scales]
description  = "Validation at each layer"
L0_kernel    = { check = "compile only" }
L2_runtime   = { check = "build + unit test" }
L8_app       = { check = "full test suite" }

# ═══════════════════════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Structure: X.1 Policy → X.2 Extension → X.3 Troubleshooting → X.4 Reference → X.5 Note
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# X.1 POLICY — Modification Guidelines [POLICY]
# ───────────────────────────────────────────────────────────────────────────────
#
# ❌ NEVER MODIFY:
#   - 3-block structure (METADATA → CONTENT → CLOSING)
#   - Required keys without corresponding code changes
#   - Key types without updating Go structs
#
# ⚠️ MODIFY WITH CARE:
#   - Section names (breaks code looking for old names)
#   - Key names (breaks struct field mapping)
#   - Value types (may cause parse errors)
#
# ✅ SAFE TO ADD:
#   - Values within documented ranges
#   - New keys (if code supports them)
#   - Comments for clarity
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.2 EXTENSION — Ideas for Future Sessions [EXTENSION]
# ───────────────────────────────────────────────────────────────────────────────
#
# Capture extension ideas discovered during work.
# Reference: Move to M.10 Planned when ready to implement.
#
# [Reserved: Capture extension ideas as they emerge during work]
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.3 TROUBLESHOOTING — Common Problems [TROUBLESHOOTING]
# ───────────────────────────────────────────────────────────────────────────────
#
# "invalid TOML":
#   → Missing quotes around strings with special characters
#   → Duplicate keys in same section
#
# "key not found":
#   → Section name doesn't match code expectation
#   → Key spelling doesn't match struct field tags
#
# "type mismatch":
#   → Strings need quotes: key = "value"
#   → Numbers don't: key = 42
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.4 REFERENCE — Quick Lookup [REFERENCE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Validation:
#   tomlv config.toml
#   python -c "import toml; toml.load('config.toml')"
#
# Environment Overrides:
#   [PREFIX]_[SECTION]_[KEY] pattern
#   Priority: env var > config file > code default
#
# Go Integration:
#   type Config struct {
#       Package struct {
#           Name string `toml:"name"`
#       } `toml:"package"`
#   }
#   cfg, err := config.Load("config.toml")
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.5 NOTE — Final Guidance [NOTE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Code Configuration Philosophy:
#   - Package identity stays in code (compile-time, type-safe)
#   - Runtime behavior goes in config (tunable without recompile)
#
# "For God is not the author of confusion, but of peace."
# — 1 Corinthians 14:33
#
# ───────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# END CLOSING [END]
# ═══════════════════════════════════════════════════════════════════════════════
