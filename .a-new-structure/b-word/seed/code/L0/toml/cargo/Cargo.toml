# #!omni template --toml --cargo

# ═══════════════════════════════════════════════════════════════
# Cargo.toml — 3-Block Template
# ═══════════════════════════════════════════════════════════════
#
# Structure: 3-block (METADATA + CONTENT + CLOSING)
#
# TOML constraint: [package] must come before [package.metadata.*]
# sub-tables. So the physical order is:
#
#   [package]                        ← Cc.1 identity (CONTENT)
#   [package.metadata.omni.*]        ← I/C metadata (METADATA)
#   [package.metadata.omni._closing] ← X closing (CLOSING)
#   [dependencies] etc.              ← Co sections (CONTENT continued)
#
# Logical structure is still: METADATA → CONTENT → CLOSING
# Physical ordering respects TOML's sub-table rule.

# ─────────────────────────────────────────────────────────────
# [package] — MUST come first (TOML sub-table ordering rule)
# ─────────────────────────────────────────────────────────────
#
# Cc.1 PACKAGE — Crate Identity [REQUIRED]
#
# Production: name must match crate directory name. version follows
# semver (Cargo requirement). Use workspace inheritance for shared
# settings. description is required for crates.io but good practice always.
[package]
name = "crate-name"
version = "0.1.0"
description = "Crate description"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

# ═══════════════════════════════════════════════════════════════
# METADATA BLOCK [METADATA]
# ═══════════════════════════════════════════════════════════════
#
# OmniCode metadata lives in [package.metadata.omni] — Cargo's
# sanctioned extension point. Cargo ignores everything under
# package.metadata.

# ─────────────────────────────────────────────────────────────
# I — Identity: What IS This File
# ─────────────────────────────────────────────────────────────

[package.metadata.omni.I1_core]
key = "B-word-seed-code-cargo-template"
format = "@omni template --toml --cargo"
from = "b-word/seed/code/L0/toml/config.toml"
at = "template"

[package.metadata.omni.I2_family]
type = "code"
subtype = "crate-manifest"
role = "scaffold"
structure = "3-block"

[package.metadata.omni.I3_instance]
file = "Cargo.toml"
title = "Rust Crate Manifest Template"
component = "Scaffold for Cargo.toml crate manifests with 3-block alignment"
path = "seed/code/L0/toml/cargo/Cargo.toml"
provides = ["CARGO_TOML_TEMPLATE"]
brief = "3-block template for Cargo.toml. Metadata in package.metadata.omni (Cargo extension point)."

[package.metadata.omni.I4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

# ─────────────────────────────────────────────────────────────
# C — Context: What Do I Need to KNOW
# ─────────────────────────────────────────────────────────────

[package.metadata.omni.C1_state]
version = "a-01.00"
status = "Active"
created = "2026-02-17"
updated = "2026-02-17"

[package.metadata.omni.C2_attribution]
architect = "Seanje Lenox-Wise"
implementation = "Nova Dawn (CPI-SI)"
organization = "CreativeWorkzStudio LLC"
copyright = "2025-2026 CreativeWorkzStudio LLC. All rights reserved."

# "Except the LORD build the house, they labour in vain that build it."
[package.metadata.omni.C3_grounding]
scripture = "Psalm 127:1 (WEB) — Unless Yahweh builds the house, they labor in vain who build it."
principle = "The crate manifest declares what the builder needs. Cargo is the builder."
anchor = "The Lord builds the house. We declare materials and purpose honestly."

[package.metadata.omni.C4_dependencies]
requires = "Rust toolchain (rustc, cargo), workspace Cargo.toml for shared settings"
consumers = "cargo build, cargo test, cargo publish, crate dependents"
integration = "Part of Cargo workspace. Workspace settings inherited via .workspace = true."
if_missing = "Crate cannot be built — cargo has no manifest to read"

[package.metadata.omni.C4_dependencies.related]
parent = "seed/code/L0/toml/config.toml — code config template"
children = []

[package.metadata.omni.C4_dependencies.cross_format]
role = "Cargo.toml is TOML-native — Cargo's manifest format."
note = "Workspace Cargo.toml defines shared settings. Crate inherits via .workspace = true."

[package.metadata.omni.C5_intent]
purpose = "Template for Rust crate Cargo.toml manifests with 3-block structural alignment"
core_design = "Crate identity -> targets -> dependencies -> features -> lints"
philosophy = "Declare dependencies honestly. Workspace inheritance for shared settings."

[package.metadata.omni.C5_intent.key_features]
identity = "Crate name, version, edition, description"
targets = "Library and/or binary targets"
dependencies = "Runtime, dev, and build dependencies"
features = "Optional capabilities consumers can enable"
lints = "Code quality rules (workspace-level preferred)"

[package.metadata.omni.C6_roadmap]
history = ["a-01.00 (2026-02-17) — Initial creation"]
current = "Cargo.toml template — initial scaffold for crate manifests"
planned = ["Workspace-level template", "Binary crate variant", "Proc-macro variant"]

[package.metadata.omni.C7_classification]
tags = ["template", "toml", "cargo", "rust", "crate", "code", "seed", "3-block"]

[package.metadata.omni._contract]
required_identity = ["I1_core", "I2_family", "I3_instance"]
required_context = ["C1_state", "C2_attribution", "C3_grounding", "C4_dependencies"]
extension_identity = ["I4_architecture"]
extension_context = ["C5_intent", "C6_roadmap", "C7_classification"]
required_closing = ["X1_policy", "X5_note"]
defined_closing = ["X2_extension", "X3_troubleshooting", "X4_reference"]
valid_patterns = ["I{N}_{name}", "C{N}_{name}", "X{N}_{name}", "_{name}"]
rule = "Metadata in package.metadata.omni. Standard Cargo sections for content."

# ═══════════════════════════════════════════════════════════════
# END METADATA [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT] (continued)
# ═══════════════════════════════════════════════════════════════
#
# [package] is above (TOML ordering constraint). Remaining
# content sections follow here.
#
# Zones:
#   Cc — Configurations  Crate identity [package] and targets [lib]/[[bin]]
#   Co — Operations      Dependencies, features, lints
#   Cv — Validation      Build verification (comments only)
#
# Ordering: cargo_convention (package -> targets -> deps -> features -> lints)

# ─────────────────────────────────────────────────────────────
# Cc.2 TARGETS — Library and Binary Configuration [DEFINED]
# ─────────────────────────────────────────────────────────────
#
# Production: Most crates are libraries (default — no [lib] needed).
# Binary crates need [[bin]]. Omit if default is sufficient.
#
# [lib]
# name = "crate_name"
# path = "src/lib.rs"
#
# [[bin]]
# name = "binary-name"
# path = "src/main.rs"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Co.1 DEPENDENCIES — Crate Dependencies [DEFINED]
#
# Production: Workspace dependencies use { workspace = true }.
# Direct deps use { version = "X.Y" } with minimal features.
[dependencies]

[dev-dependencies]

# [build-dependencies]

# Co.2 FEATURES — Optional Capabilities [DEFINED]
#
# Production: Features are additive. "default" is what consumers
# get without opting in. Name features by capability.
[features]
default = []

# Co.3 LINTS — Code Quality Rules [DEFINED]
#
# Production: Workspace-level lints keep all crates consistent.
[lints]
workspace = true

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation (comments only)
# ─────────────────────────────────────────────────────────────
#
#   cargo check           — Type-check without building
#   cargo build           — Full build
#   cargo test            — Run tests
#   cargo clippy          — Lint check
#   cargo fmt --check     — Format check

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════

# X.1 POLICY — Modification Guidelines [REQUIRED]
[package.metadata.omni._closing.X1_policy]
scripture = "Proverbs 22:28 (WEB) — Don't move the ancient boundary stone."
never = ["Break workspace inheritance without reason", "Remove required Cargo fields", "Add unused dependencies"]
careful = ["Version bumps", "Feature changes (public API)", "Dependency upgrades"]
safe = ["New dependencies (if needed)", "New features (additive)", "Lint adjustments"]

# X.2 EXTENSION — Future Ideas [DEFINED]
[package.metadata.omni._closing.X2_extension]
planned = ["Workspace Cargo.toml template", "Binary crate variant", "Proc-macro variant"]

# X.3 TROUBLESHOOTING [DEFINED]
[package.metadata.omni._closing.X3_troubleshooting]
scripture = "James 1:5 (WEB) — If any lacks wisdom, let him ask of God."
workspace_not_found = "Ensure workspace Cargo.toml exists with [workspace] section"
dependency_conflict = "Check workspace dependency versions. Use cargo tree."
feature_not_compiling = "Features must be additive. Check feature gates."

# X.4 REFERENCE [DEFINED]
[package.metadata.omni._closing.X4_reference]
related_files = [
    "seed/code/L0/toml/config.toml — Parent template",
    "Cargo workspace root — Shared settings",
    "rust-toolchain.toml — Rust version pinning"
]
required_sections = ["package"]
validate = "cargo check && cargo clippy && cargo test"

# X.5 NOTE — Final Anchor [REQUIRED]
[package.metadata.omni._closing.X5_note]
note = "Cargo.toml template. Workspace inheritance for consistency. Metadata in package.metadata.omni."
scripture = "Psalm 127:1 (WEB) — Unless Yahweh builds the house, they labor in vain."
anchor = "Cargo builds the crate. We declare what's needed honestly."

# X.6 TEMPLATE [TEMPLATE-ONLY: remove when instantiating]
[package.metadata.omni._closing.X6_template]
note = "Remove this section when instantiating"
usage = "cp Cargo.toml path/to/crate/ -> update package -> add deps -> remove X6"
update = [
    "package.metadata.omni.I1_core: unique key, format = @omni code --toml --cargo",
    "package.metadata.omni.I2_family: type, subtype, role",
    "package.metadata.omni.I3_instance: file, title, component, path, provides, brief",
    "[package]: crate name, version, description",
    "[dependencies]: runtime dependencies",
    "[dev-dependencies]: test dependencies",
    "[features]: optional capabilities",
    "Remove X6_template when instantiating"
]

# ═══════════════════════════════════════════════════════════════
# END CLOSING [END]
# ═══════════════════════════════════════════════════════════════
