# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════
#
# CONTENT IS the data. METADATA says what this file IS. CONTENT
# says what it HOLDS. CLOSING says what to PROTECT.
#
# Code configs specialize the root data template for packages:
# language definition stays in code, behavioral tuning goes in config.
#
# Three zones, always in this order:
#
#   Cc — Configurations  Define what exists (identity, settings, resources)
#   Co — Operations      Define what happens (behavior, integrations)
#   Cv — Validation      Define what's correct (schema, health, content rules)
#
# Ordering principle: "definition_flow"
#   Define first. Configure second. Validate last.
#
# Subsections:
#
#   Cc.1 Identity       — Package name, version, type [REQUIRED]
#   Cc.2 Settings       — Build mode, entry point, deps [DEFINED]
#   Cc.3 Resources      — Paths, limits, constraints [DEFINED]
#   ---
#   Co.1 Behavior       — Logging, runtime, feature toggles [DEFINED]
#   Co.2 Integrations   — Database, cache, external services [DEFINED]
#   ---
#   Cv.1 Validation     — Schema, health scoring, content rules [REQUIRED]

[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores, match Go struct field tags"
constraint = "All values typed. Go struct tags must match TOML key names."
ordering = "definition_flow"
Cc = "Content Configurations — identity, settings, resources"
Co = "Content Operations — behavior (logging, runtime, features), integrations (database, cache)"
Cv = "Content Validation — schema, health scoring"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────
#
# Cc defines what EXISTS. Package identity and static structure.
# These sections define the shape of the package config.

# Cc.1 IDENTITY — Package Identity [REQUIRED]
#
# Production: Every package config MUST have identity. name + version
# let tooling discover and reference this config. type distinguishes
# libraries from binaries from plugins — build behavior depends on it.
[identity]
name = "package-name"
version = "a-01.00"
description = "Package configuration"
type = "library"                        # library | binary | plugin

# Cc.2 SETTINGS — Primary Package Configuration [DEFINED]
#
# Production: Build settings change per environment. debug vs release
# affects optimization, debug symbols, and output size. entry_point
# only matters for binaries — libraries don't have one.
[settings]
build_mode = "debug"                    # debug | release
entry_point = "main.go"                 # For binaries
deps_file = "go.mod"

# Cc.3 RESOURCES — Paths, Limits, Constraints [DEFINED]
#
# Production: Resource paths are relative to the package root.
# Limits prevent runaway builds — always document units and
# what happens when a limit is exceeded.
[resources.paths]
source = "src/"
output = "bin/"
config = "config/"
tests = "tests/"
docs = "docs/"

[resources.limits]
max_build_time = 300                    # Seconds
max_test_timeout = 60                   # Seconds per test
max_binary_size = 104857600             # 100MB

# Cc extensions — experimental configuration patterns
[_extensions.cc]
note = "Experimental Cc patterns — may be promoted into identity, settings, or resources"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────
#
# Co defines what HAPPENS. Runtime behavior, external integrations.
# These sections vary by deployment — production vs development,
# local vs cloud, connected vs isolated.

# Co.1 BEHAVIOR — Runtime Modes and Toggles [DEFINED]
#
# Production: Behavior is organized by concern (logging, runtime,
# features) using nested tables. Each sub-table groups related
# controls. Logging should always have a level and format.
# Workers = 0 means "auto-detect" — document this convention.
[behavior.logging]
level = "info"                          # error, warn, info, debug, trace
format = "text"                         # text | json
file = ""                               # Empty = stdout

[behavior.runtime]
workers = 0                             # 0 = use CPU count
debug = false
shutdown_timeout = 30                   # Seconds

[behavior.features]
metrics_enabled = false
tracing_enabled = false
profiling_enabled = false

# Co.2 INTEGRATIONS — External Service Configuration [DEFINED]
#
# Production: Credentials go in env vars, not config files.
# Config holds connection parameters (host, port, pool_size).
# Each integration is a nested table. If a service is optional,
# the whole sub-table can be absent — check before accessing.
[integrations.database]
driver = "postgres"
host = "localhost"
port = 5432
name = "app_db"
pool_max = 10

[integrations.cache]
driver = "redis"
host = "localhost"
port = 6379
ttl = 3600                              # Default TTL seconds

# Co extensions — experimental operational patterns
[_extensions.co]
note = "Experimental Co patterns — may be promoted into behavior or integrations"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────
#
# Cv defines what's CORRECT. Schema constraints, health scoring,
# content rules. The config validates itself — Cv makes that
# explicit. Uses _ prefix tables because validation is meta-content.

# Cv.1 VALIDATION — Schema, Health, Content Rules [REQUIRED]
#
# Production: commands includes both TOML parse check AND build
# verification. schema.fields enables per-section field contracts.
# health_scoring weights quality: structure, configuration, and
# code_integration (does the config actually work with the code?).
[_validation]
commands = ["tomlv config.toml", "go build -v ./..."]

[_validation.schema]
required = ["identity"]
defined = ["settings", "resources", "behavior", "integrations"]
optional = ["_extensions"]

[_validation.schema.fields.identity]
required = ["name", "version"]
defined = ["description", "type"]

[_validation.schema.fields.settings]
required = []
defined = ["build_mode", "entry_point"]

[_validation.schema.fields.behavior]
required = []
defined = ["logging", "runtime", "features"]

[_validation.schema.fields.integrations]
required = []
defined = ["database", "cache"]

[_validation.health_scoring]
total = 100
correct_structure = 30
valid_configuration = 40
code_integration = 30

# Cv extensions — experimental validation patterns
[_extensions.cv]
note = "Experimental Cv patterns — may be promoted into _validation"

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
