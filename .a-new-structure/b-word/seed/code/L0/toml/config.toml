# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores, match Go struct field tags"
constraint = "All values typed. Go struct tags must match TOML key names."

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Cc.1 IDENTITY — Package Identity
[identity]
name = "package-name"
version = "a-01.00"
description = "Package configuration"
type = "library"                        # library | binary | plugin

# Cc.2 SETTINGS — Primary Package Configuration
[settings]
build_mode = "debug"                    # debug | release
entry_point = "main.go"                 # For binaries
deps_file = "go.mod"

# Cc.3 RESOURCES — Paths, Limits, Constraints
[resources.paths]
source = "src/"
output = "bin/"
config = "config/"
tests = "tests/"
docs = "docs/"

[resources.limits]
max_build_time = 300                    # Seconds
max_test_timeout = 60                   # Seconds per test
max_binary_size = 104857600             # 100MB

# Cc.4 BEHAVIOR — Runtime Modes and Toggles
[behavior.logging]
level = "info"                          # error, warn, info, debug, trace
format = "text"                         # text | json
file = ""                               # Empty = stdout

[behavior.runtime]
workers = 0                             # 0 = use CPU count
debug = false
shutdown_timeout = 30                   # Seconds

[behavior.features]
metrics_enabled = false
tracing_enabled = false
profiling_enabled = false

# INTEGRATIONS — External Service Configuration
[integrations.database]
driver = "postgres"
host = "localhost"
port = 5432
name = "app_db"
pool_max = 10

[integrations.cache]
driver = "redis"
host = "localhost"
port = 6379
ttl = 3600                              # Default TTL seconds

[extensions]
note = "Experimental patterns — may be promoted or removed"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["tomlv config.toml", "go build -v ./..."]

[_validation.schema]
required = ["identity", "settings"]
optional = ["resources", "behavior", "integrations", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 30
valid_configuration = 40
code_integration = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


