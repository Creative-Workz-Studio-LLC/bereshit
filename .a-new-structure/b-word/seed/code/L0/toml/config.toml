[_pragma]
format = "@omni template --toml"

[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

# P.1 CORE — Identity
[_pragma.P1_core]
key = "B-word-seed-code-toml-config"
from = "b-word/seed/data/L0/toml/config.toml"
at = "template"

# P.2 FAMILY — Classification
[_pragma.P2_family]
type = "code"
subtype = "config"
role = "scaffold"
structure = "3-block"

# P.3 INSTANCE — File Details
[_pragma.P3_instance]
component = "Scaffold — code package TOML configuration template"
layer = "seed/code/L0/toml"
includes = "none"
provides = ["CODE_CONFIG_TEMPLATE"]

# P.4 ARCHITECTURE — Scaling Context
[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

# P.5 SUMMARY — Human Identity
[_pragma.P5_summary]
title = "Code Configuration Template"
brief = "3-block template for code package TOML configuration. Package identity, settings, resources, behavior, integrations."

