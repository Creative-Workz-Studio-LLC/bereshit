# ===================================================================
# CONTENT BLOCK [CONTENT]
# ===================================================================
#
# CONTENT IS the data. Same 3-block structure as data bare-bone.
# Code bare-bone inherits the data bare-bone shape and adds the
# type=code distinction.
#
# Three zones (same as data bare-bone):
#
#   Cc -- Configurations  Define what EXISTS
#   Co -- Operations      Define what HAPPENS
#   Cv -- Validation      Define what's CORRECT
#
# Ordering principle: "definition_flow"
#
# Bare-bone subsections:
#
#   Cc.1 Identity       -- What IS this config? Name, version, type [REQUIRED]
#   Cc.2 Settings       -- Build mode, entry point, deps           [DEFINED stub]
#   Cc.3 Resources      -- Source paths, output dirs, limits       [DEFINED stub]
#   Co.1 Behavior       -- Logging, runtime, feature toggles       [DEFINED stub]
#   Co.2 Integrations   -- Database, cache, external services      [DEFINED stub]
#   Cv.1 Validation     -- Schema, health scoring, content rules   [REQUIRED]
#
# Cargo-specific Reserved Omission (not in bare-bone or config form):
#
#   [package]           -- Crate identity                          [cargo form]
#   [dependencies]      -- Crate dependencies                      [cargo form]
#   [dev-dependencies]  -- Test dependencies                       [cargo form]
#   [lints]             -- Lint configuration                      [cargo form]
#   package.metadata.omni -- OmniCode metadata in Cargo format     [cargo form]

[_content]
format = "TOML -- UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
ordering = "definition_flow"
Cc = "Content Configurations -- identity [REQUIRED], settings + resources [DEFINED stubs]"
Co = "Content Operations -- behavior + integrations [DEFINED stubs]"
Cv = "Content Validation -- schema, health scoring [REQUIRED]"

# -------------------------------------------------------------------
# Cc -- Content Configurations
# -------------------------------------------------------------------
#
# Cc defines what EXISTS. In code bare-bone, only identity is REQUIRED.
# Same structure as data bare-bone. The type=code distinction lives
# in _metadata.I2_family, not in the content sections.

# Cc.1 IDENTITY -- Package Identity [REQUIRED]
#
# Every code TOML file MUST have identity. For code configs, the type
# field distinguishes libraries from binaries from plugins -- build
# behavior depends on it.
[identity]
name = "package-name"                           # Unique package identifier
version = "a-01.00"                             # Living version (stage-phase.completion)
description = "Package configuration"
type = "library"                                # library | binary | plugin

# Cc.2 SETTINGS -- Build Configuration Values [DEFINED]
#
# Build mode, entry point, dependency file. Code-specific settings.
[settings]
# Reserved -- populate when deriving from this template

# Cc.3 RESOURCES -- Source Paths, Output Dirs, Limits [DEFINED]
#
# Source, output, config, test, doc paths and resource constraints.
[resources]
# Reserved -- populate when deriving from this template

# -------------------------------------------------------------------
# Co -- Content Operations
# -------------------------------------------------------------------
#
# Co defines what HAPPENS. In bare-bone, both operations sections are
# declared as stubs. Code form variants populate with their specifics.

# Co.1 BEHAVIOR -- Runtime Modes and Feature Toggles [DEFINED]
#
# Logging, runtime, feature toggles. Code-specific runtime behavior.
[behavior]
# Reserved -- populate when deriving from this template

# Co.2 INTEGRATIONS -- External Services [DEFINED]
#
# Database, cache, external API connections for code packages.
[integrations]
# Reserved -- populate when deriving from this template

# -------------------------------------------------------------------
# Cv -- Content Validation
# -------------------------------------------------------------------
#
# Cv defines what's CORRECT. Same structure as data bare-bone.
# Code bare-bone adds build verification to the validation commands.

# Cv.1 VALIDATION -- Schema, Health, Content Rules [REQUIRED]
[_validation]
commands = ["tomlv config.toml"]

[_validation.schema]
required = ["identity"]
defined = []
optional = ["_extensions"]

[_validation.schema.fields.identity]
required = ["name", "version"]
defined = ["description", "type"]

[_validation.health_scoring]
total = 100
correct_structure = 40
valid_configuration = 30
useful_documentation = 30

# ===================================================================
# END CONTENT [END]
# ===================================================================


