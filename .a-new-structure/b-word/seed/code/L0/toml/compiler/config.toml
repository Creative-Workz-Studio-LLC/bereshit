# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores, match Go struct field tags"
constraint = "Language definition stays in code. Only behavioral tuning in config."
Cc = "Content Configurations — compiler identity, settings, phases, resources, behavior"
Co = "Content Operations — health scoring, tuning parameters"
Cv = "Content Validation — schema, health scoring, content rules"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────

# Cc.1 IDENTITY — Compiler Identity
[identity]
name = "omnicode"
version = "a-01.00"
description = "OmniCode compiler configuration"
target = "ternary"                      # Target architecture

# Cc.2 SETTINGS — Compilation Settings
[settings]
mode = "debug"                          # debug | release
optimization = 1                        # 0-3
output_format = "ternary"               # ternary | binary | both

[settings.phases]
lexer = true
parser = true
semantic = true
codegen = true

# Cc.3 RESOURCES — Paths, Limits, Constraints
[resources.paths]
source = "src/"
output = "build/"
cache = ".cache/"

[resources.limits]
max_token_length = 1024                 # Lexer
max_nesting_depth = 256                 # Parser
max_errors = 10                         # Before abort
max_compile_time = 300                  # Seconds

# Cc.4 BEHAVIOR — Phase-Specific Behavior
[behavior.lexer]
tab_width = 4                           # Position calculation

[behavior.parser]
error_recovery = true                   # Attempt recovery on errors

[behavior.codegen]
debug_info = false                      # Generate debug symbols

[behavior.runtime]
verbose = false
strict = false

# HEALTH — Quality Scoring Configuration
[health.phases]
lexer = 1.0                             # Phase health weight
parser = 1.0
semantic = 1.5                          # Higher = stricter
codegen = 1.0

[health.thresholds]
warning_level = 0.7                     # Below = warning
error_level = 0.5                       # Below = error

# TUNING — Advanced Performance Parameters
[tuning]
symbol_table_size = 1024                # Initial symbol table
ast_pool_size = 4096                    # AST node pool
parallel = false                        # Parallel compilation

[extensions]
note = "Experimental patterns — may be promoted or removed"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["tomlv config.toml", "go build -v ./pkg/compiler/config"]

[_validation.schema]
required = ["identity", "settings", "settings.phases"]
optional = ["resources", "behavior", "health", "tuning", "extensions"]

[_validation.health_scoring]
total = 100
correct_phase_config = 30
valid_thresholds = 30
useful_tuning = 20
code_integration = 20

[_validation.content]
target_valid = ["ternary", "binary", "both"]
optimization_range = [0, 3]
threshold_order = "error_level < warning_level"
threshold_range = [0.0, 1.0]

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
