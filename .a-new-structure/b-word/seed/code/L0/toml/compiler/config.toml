[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores, match Go struct field tags"
constraint = "Language definition stays in code. Only behavioral tuning in config."
Cc = "Content Configurations — compiler identity, settings, phases, resources"
Co = "Content Operations — behavior (per-phase), health scoring, tuning"
Cv = "Content Validation — schema, health scoring, content rules"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────

# Cc.1 IDENTITY — Compiler Identity [REQUIRED]
[identity]
name = "omnicode"
version = "a-01.00"
description = "OmniCode compiler configuration"
target = "ternary"                      # Target architecture

# Cc.2 SETTINGS — Compilation Settings [DEFINED]
[settings]
mode = "debug"                          # debug | release
optimization = 1                        # 0-3
output_format = "ternary"               # ternary | binary | both

[settings.phases]
lexer = true
parser = true
semantic = true
codegen = true

# Cc.3 RESOURCES — Paths, Limits, Constraints [DEFINED]
[resources.paths]
source = "src/"
output = "build/"
cache = ".cache/"

[resources.limits]
max_token_length = 1024                 # Lexer
max_nesting_depth = 256                 # Parser
max_errors = 10                         # Before abort
max_compile_time = 300                  # Seconds

# Cc extensions — experimental configuration patterns
[_extensions.cc]
note = "Experimental Cc patterns — may be promoted into identity, settings, or resources"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Co.1 BEHAVIOR — Phase-Specific Behavior [DEFINED]
[behavior.lexer]
tab_width = 4                           # Position calculation

[behavior.parser]
error_recovery = true                   # Attempt recovery on errors

[behavior.codegen]
debug_info = false                      # Generate debug symbols

[behavior.runtime]
verbose = false
strict = false

# Co.2 HEALTH — Quality Scoring Configuration [DOMAIN]
[health.phases]
lexer = 1.0                             # Phase health weight
parser = 1.0
semantic = 1.5                          # Higher = stricter
codegen = 1.0

[health.thresholds]
warning_level = 0.7                     # Below = warning
error_level = 0.5                       # Below = error

# Co.3 TUNING — Advanced Performance Parameters [DOMAIN]
[tuning]
symbol_table_size = 1024                # Initial symbol table
ast_pool_size = 4096                    # AST node pool
parallel = false                        # Parallel compilation

# Co extensions — experimental operational patterns
[_extensions.co]
note = "Experimental Co patterns — may be promoted into behavior, health, or tuning"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

# Cv.1 VALIDATION — Schema, Health, Content Rules [REQUIRED]
[_validation]
commands = ["tomlv config.toml", "go build -v ./pkg/compiler/config"]

[_validation.schema]
required = ["identity"]
defined = ["settings", "resources", "behavior", "health", "tuning"]
optional = ["_extensions"]

[_validation.schema.fields.identity]
required = ["name", "version"]
defined = ["description", "target"]

[_validation.schema.fields.settings]
required = []
defined = ["mode", "optimization", "output_format", "phases"]

[_validation.schema.fields.behavior]
required = []
defined = ["lexer", "parser", "codegen", "runtime"]

[_validation.schema.fields.health]
required = ["phases", "thresholds"]
defined = []

[_validation.schema.fields.tuning]
required = []
defined = ["symbol_table_size", "ast_pool_size", "parallel"]

[_validation.health_scoring]
total = 100
correct_phase_config = 30
valid_thresholds = 30
useful_tuning = 20
code_integration = 20

[_validation.content]
target_valid = ["ternary", "binary", "both"]
optimization_range = [0, 3]
threshold_order = "error_level < warning_level"
threshold_range = [0.0, 1.0]

# Cv extensions — experimental validation patterns
[_extensions.cv]
note = "Experimental Cv patterns — may be promoted into _validation"

