# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════════════════════
#
# 3-Block Data: METADATA → CONTENT → CLOSING
#
# Compiler configuration organized by concern.
# Structure: Cc (Configuration) → Co (Operations) → Cv (Cognition) → Cx (Generation)
#
# Organization Pattern:
#   Cc.1 IDENTITY — What is this compiler?
#   Cc.2 SETTINGS — Primary compiler configuration
#   Cc.3 RESOURCES — Paths, limits, constraints
#   Cc.4 BEHAVIOR — Phase-specific behavior
#   Co.1 RESERVED — Operations (compile hooks, phase events)
#   Cv.1 BIBLICAL — Scriptural grounding
#   Cx.1 GENERATE — Generation control metadata
#   Cx.2 TARGETS — Language-specific generation
#   Cx.3 TEMPLATES — Code generation templates
#   Cx.4 VALIDATION — Generation validation
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURATION (Cc — Compiler Configuration)
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Cc.1 IDENTITY — What Is This Compiler?
# -------------------------------------------------------------------------------

[identity]
name        = "omnicode"                               # Compiler name
version     = "b-01.00"                                # Compiler version
description = "OmniCode compiler configuration"
target      = "ternary"                                # Target architecture

# -------------------------------------------------------------------------------
# Cc.2 SETTINGS — Primary Compiler Configuration
# -------------------------------------------------------------------------------

[settings]
# Core compiler settings — most commonly modified

# Compilation mode
# Type: string | Values: "debug", "release" | Default: "debug"
mode = "debug"

# Optimization level (0-3)
# Type: int | Default: 1
optimization = 1

# Output format
# Type: string | Values: "ternary", "binary", "both" | Default: "ternary"
output_format = "ternary"

# Enabled phases
[settings.phases]
lexer    = true
parser   = true
semantic = true
codegen  = true

# -------------------------------------------------------------------------------
# Cc.3 RESOURCES — Paths, Limits, Constraints
# -------------------------------------------------------------------------------

[resources]
# WHERE things are and HOW MUCH is allowed

[resources.paths]
source = "src/"
output = "build/"
cache  = ".cache/"

[resources.limits]
max_token_length = 1024                                # Lexer
max_nesting_depth = 256                                # Parser
max_errors       = 10                                  # Before abort
max_compile_time = 300                                 # Seconds

# -------------------------------------------------------------------------------
# Cc.4 BEHAVIOR — Phase-Specific Behavior
# -------------------------------------------------------------------------------

[behavior]
# HOW each phase operates

[behavior.lexer]
tab_width = 4                                          # For position calculation

[behavior.parser]
error_recovery = true                                  # Attempt recovery on errors

[behavior.codegen]
debug_info = false                                     # Generate debug symbols

[behavior.runtime]
verbose = false
strict  = false


# ═══════════════════════════════════════════════════════════════════════════════
# OPERATIONS (Co — Reserved)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Co sections reserved for operational definitions (compile hooks, phase events).
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# HEALTH — Health Scoring Configuration
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Health Weights (4+1+4 Pattern)
# -------------------------------------------------------------------------------

[health]
# Health scoring weights for compiler quality metrics

# Phase health weights
[health.phases]
lexer    = 1.0                                         # Lexer health weight
parser   = 1.0                                         # Parser health weight
semantic = 1.5                                         # Semantic health weight (higher = stricter)
codegen  = 1.0                                         # Codegen health weight

# Metric thresholds
[health.thresholds]
warning_level = 0.7                                    # Below this = warning
error_level   = 0.5                                    # Below this = error


# ═══════════════════════════════════════════════════════════════════════════════
# TUNING — Advanced Tuning Parameters
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Memory and Performance Tuning
# -------------------------------------------------------------------------------

[tuning]
# Advanced tuning parameters (modify with care)

# Initial symbol table size
# Type: int | Default: 1024
symbol_table_size = 1024

# AST node pool size
# Type: int | Default: 4096
ast_pool_size = 4096

# Enable parallel compilation
# Type: bool | Default: false
parallel = false

# ═══════════════════════════════════════════════════════════════════════════════
# Cx CODE GENERATION [GENERATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "In the beginning was the Word, and the Word was with God, and the Word was
#  God." — John 1:1 KJV
#
# CODE GENERATION: FROM SPECIFICATION TO IMPLEMENTATION
#
# Compiler config separates language DEFINITION (immutable, in code) from
# compilation BEHAVIOR (tunable, in config). This section documents how
# config generates Go structs and validation code.
#
# GENERATION CATEGORIES:
#   GENERATE:   Control metadata (enabled, output, order)
#   TARGETS:    Language-specific generation rules
#   TEMPLATES:  Code patterns for generated output
#   VALIDATION: Testing the generated code
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Compiler identity, version
#   L1 (System):    Phase enable/disable
#   L2 (Runtime):   Lexer behavior (token limits, tab width)
#   L3 (Framework): Parser behavior (depth, error recovery)
#   L4 (Health):    Health scoring, quality thresholds
#   L5 (Network):   Distributed compilation (future)
#   L6 (Storage):   Symbol table sizing, AST pooling
#   L7 (Engine):    Codegen optimization, output format
#   L8 (App):       IDE integration, user preferences
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.1 GENERATE — Generation Control Metadata [GENERATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# GENERATION CONTROL: PLANNING BEFORE BUILDING
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate]
description  = "Code generation control for compiler configs"
enabled      = true                                           # Compiler config generates Go structs
version      = "b-01.00"

[_generate.output]
description  = "Where generated files go"
directory    = "pkg/compiler/config"                          # Compiler config package
primary      = "config.gen.go"                                # Generated Go structs
order        = 10                                             # Early in generation order

[_generate.scales]
description  = "Generation at each architectural layer"
L0_kernel    = { output = "compiler.gen.h",                  format = "C header" }
L1_system    = { output = "phases.gen.go",                   format = "Go phases" }
L2_runtime   = { output = "lexer_config.gen.go",             format = "Go lexer" }
L3_framework = { output = "parser_config.gen.go",            format = "Go parser" }
L4_health    = { output = "health_config.gen.go",            format = "Health" }
L5_network   = { output = "distributed.gen.go",              format = "Network" }
L6_storage   = { output = "tuning.gen.go",                   format = "Storage" }
L7_engine    = { output = "codegen_config.gen.go",           format = "Engine" }
L8_app       = { output = "ide_config.gen.go",               format = "App" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.2 TARGETS — Language-Specific Generation [TARGETS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And there were dwelling at Jerusalem Jews, devout men, out of every nation
#  under heaven... every man heard them speak in his own language."
#  — Acts 2:5,6 KJV
#
# TARGETS: SPEAKING EACH LANGUAGE'S TONGUE
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.target.go]
description  = "Go language generation"
enabled      = true
file         = "config.gen.go"
package      = "config"

[_generate.target.go.structs]
CompilerConfig = "[compiler]"
PhasesConfig   = "[phases]"
LexerConfig    = "[lexer]"
ParserConfig   = "[parser]"
CodegenConfig  = "[codegen]"
HealthConfig   = "[health]"
TuningConfig   = "[tuning]"

[_generate.target.env]
description  = "Environment variable mapping"
enabled      = true
prefix       = "OMNICODE"
file         = "omnicode.env.example"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.3 TEMPLATES — Code Generation Templates [TEMPLATES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "The thing that hath been, it is that which shall be; and that which is done
#  is that which shall be done." — Ecclesiastes 1:9 KJV
#
# TEMPLATES: PATTERNS THAT REPEAT WITH VARIATION
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.template.header]
description  = "Template for generated header"
comment      = "// Generated from {source} — DO NOT EDIT"

[_generate.template.struct]
description  = "Go struct generation pattern"
tag_format   = "`toml:\"{key}\" env:\"OMNICODE_{SECTION}_{KEY}\"`"

[_generate.template.phase]
description  = "Phase configuration pattern"
enabled_type = "bool"
config_type  = "struct"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.4 VALIDATION — Generation Validation [GEN_VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Beloved, believe not every spirit, but try the spirits whether they are of
#  God." — 1 John 4:1 KJV
#
# VALIDATION: TESTING THE GENERATED CODE
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.validation]
description  = "How to validate generated code"
enabled      = true

[_generate.validation.syntax]
go_build     = "go build -v ./pkg/compiler/config"
go_vet       = "go vet ./pkg/compiler/config"

[_generate.validation.content]
target_valid        = ["ternary", "binary", "both"]
optimization_range  = [0, 3]
threshold_order     = "error_level < warning_level"
threshold_range     = [0.0, 1.0]

[_generate.validation.scales]
description  = "Validation at each layer"
L0_kernel    = { check = "compile only" }
L2_runtime   = { check = "build + unit test" }
L4_health    = { check = "threshold validation" }
L8_app       = { check = "full test suite" }

# ═══════════════════════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Structure: X.1 Policy → X.2 Extension → X.3 Troubleshooting → X.4 Reference → X.5 Note
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# X.1 POLICY — Modification Guidelines [POLICY]
# ───────────────────────────────────────────────────────────────────────────────
#
# ❌ NEVER MODIFY:
#   - 3-block structure (METADATA → CONTENT → CLOSING)
#   - Language-defining settings (these belong in code)
#   - Phase order (lexer → parser → semantic → codegen)
#
# ⚠️ MODIFY WITH CARE:
#   - Health weights (affects quality scoring)
#   - Tuning parameters (affects performance)
#   - Phase enable flags (may break compilation)
#
# ✅ SAFE TO ADD:
#   - New tuning parameters (if code supports)
#   - Comments for clarity
#   - Health threshold adjustments
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.2 EXTENSION — Ideas for Future Sessions [EXTENSION]
# ───────────────────────────────────────────────────────────────────────────────
#
# Capture extension ideas discovered during work.
# Reference: Move to M.10 Planned when ready to implement.
#
# [Reserved: Capture extension ideas as they emerge during work]
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.3 TROUBLESHOOTING — Common Problems [TROUBLESHOOTING]
# ───────────────────────────────────────────────────────────────────────────────
#
# "invalid TOML":
#   → Missing quotes around strings with special characters
#   → Duplicate keys in same section
#
# "compilation failed":
#   → Check phase enable flags (all should be true)
#   → Check max_errors threshold
#
# "health score low":
#   → Review health.thresholds settings
#   → Check phase weights balance
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.4 REFERENCE — Quick Lookup [REFERENCE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Validation:
#   tomlv config.toml
#   python -c "import toml; toml.load('config.toml')"
#
# Environment Overrides:
#   OMNICODE_[SECTION]_[KEY] pattern
#   Priority: env var > config file > code default
#
# Go Integration:
#   type Config struct {
#       Compiler struct {
#           Name string `toml:"name"`
#       } `toml:"compiler"`
#   }
#   cfg, err := config.Load("config.toml")
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.5 NOTE — Final Guidance [NOTE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Compiler Configuration Philosophy:
#   - Language definition stays in code (compile-time, type-safe)
#   - Behavioral tuning goes in config (runtime configurable)
#   - If it changes HOW the compiler works, it's config
#   - If it changes WHAT OmniCode IS, it's code
#
# "In the beginning was the Word..." — John 1:1
#
# ───────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# END CLOSING [END]
