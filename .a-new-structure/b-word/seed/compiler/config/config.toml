# @file config.toml
# @omni template --toml
#
# ═══════════════════════════════════════════════════════════════════════════════
# OMNICODE PRAGMA [PRAGMA]
# ═══════════════════════════════════════════════════════════════════════════════
#
# @legend
#   :req  REQUIRED   — must exist, validation fails without
#   :inh  INHERITED  — from template, override allowed
#   :ins  INSTANCE   — file-specific, unique values
# @endlegend
#
# ───────────────────────────────────────────────────────────────────────────────
# P.1 CORE — Identity [CORE]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:req  key        = B-word-seed-compiler-config-toml
# @omni:req  from       = bereshit/word/seed/code/config/config.toml
# @omni:req  at         = template
#
# ───────────────────────────────────────────────────────────────────────────────
# P.2 FAMILY — Classification [FAMILY]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:inh  type       = compiler
# @omni:inh  subtype    = config
# @omni:inh  role       = seed
# @omni:inh  structure  = 3-block
#
# ───────────────────────────────────────────────────────────────────────────────
# P.3 INSTANCE — File Details [INSTANCE]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:ins  component  = seed
# @omni:ins  layer      = compiler/config
# @omni:ins  includes   = none
# @omni:ins  provides   = [COMPILER_CONFIG_TEMPLATE]
#
# ───────────────────────────────────────────────────────────────────────────────
# P.4 ARCHITECTURE — Scaling Context [ARCH]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:ins  layers     = [0:kernel, 1:system, 2:runtime, 3:framework,
#                          4:health, 5:network, 6:storage, 7:engine, 8:app]
# @omni:ins  scale      = 3^n [1, 3, 9, 27, 81, 243, 729, 2187, 6561]
# @omni:ins  pattern    = 4+1+4 [below:0-3, center:4, above:5-8]
# @omni:ins  anchor     = genesis_1_1 -> void(0) -> unity(1) -> derivation
#
# ───────────────────────────────────────────────────────────────────────────────
# P.5 SUMMARY — Human Identity [SUMMARY]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:req  title      = Compiler Configuration Template
# @omni:req  brief      = 3-block template for compiler config (phases, health, tuning)
#
# ═══════════════════════════════════════════════════════════════════════════════
# END PRAGMA [END]
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# METADATA BLOCK [METADATA]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Identity and context for this template.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# M.1 IDENTITY — Core Identity [IDENTITY]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 7 fields that answer "What IS this file?"
#   - file:      The filename
#   - brief:     One-sentence description
#   - key:       Unique identifier for referencing
#   - title:     Human-readable display name
#   - type:      Category of content
#   - component: Position in hierarchy (Ladder/Rung/Rails)
#   - role:      Responsibility statement
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.identity]
file      = "config.toml"
brief     = "Template for compiler-level TOML configuration files."
key       = "B-word-seed-compiler-config-toml"
title     = "Compiler Configuration Template"
type      = "Template (Compiler Config)"
component = "Rails"
role      = "Template for compiler phase configuration with health scoring."

# ═══════════════════════════════════════════════════════════════════════════════
# M.2 STATE — Lifecycle State [STATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 5 fields that answer "Where is this in its lifecycle?"
#   - version:  Living version (stage-phase.completion)
#   - status:   Active / Draft / Deprecated / Archived
#   - created:  Original creation date
#   - updated:  Last modification date
#   - note:     Brief description of current state
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.state]
version = "b-01.00"
status  = "Active"
created = "2025-12-01"
updated = "2026-02-02"
note    = "Baseline alignment — M.1-M.10 structure with TOML metadata"

# ═══════════════════════════════════════════════════════════════════════════════
