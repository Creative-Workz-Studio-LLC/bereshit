# ===================================================================
# CONTENT BLOCK [CONTENT]
# ===================================================================
#
# CONTENT IS the data. METADATA says what this file IS. CONTENT
# says what it HOLDS. CLOSING says what to PROTECT.
#
# CONTENT IS the data. METADATA says what this file IS. CONTENT
# says what it HOLDS. CLOSING says what to PROTECT.
#
# Three zones organize the data by concern:
#
#   Cc -- Configurations  Define what EXISTS (identity, settings, resources)
#   Co -- Operations      Define what HAPPENS (behavior, integrations)
#   Cv -- Validation      Define what's CORRECT (schema, health, content rules)
#
# Ordering principle: "definition_flow"
#   Define first. Configure second. Validate last.
#
# Bare-bone subsections:
#
#   Cc.1 Identity       -- What IS this config? Name, version, type [REQUIRED]
#   Cc.2 Settings       -- Primary configuration values             [DEFINED stub]
#   Cc.3 Resources      -- Paths, limits, constraints               [DEFINED stub]
#   Co.1 Behavior       -- Runtime modes and toggles                [DEFINED stub]
#   Co.2 Integrations   -- External service configuration           [DEFINED stub]
#   Cv.1 Validation     -- Schema, health scoring, content rules    [REQUIRED]
#
# Reserved Omission (form-specific, not in bare-bone):
#
#   Co.2 Patterns       -- TOML structural examples                 [root template only]

[_content]
format = "TOML -- UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
ordering = "definition_flow"
Cc = "Content Configurations -- identity [REQUIRED], settings + resources [DEFINED stubs]"
Co = "Content Operations -- behavior + integrations [DEFINED stubs]"
Cv = "Content Validation -- schema, health scoring [REQUIRED]"

# -------------------------------------------------------------------
# Cc -- Content Configurations
# -------------------------------------------------------------------
#
# Cc defines what EXISTS. Identity is REQUIRED. Settings and resources
# are DEFINED stubs -- present in the template, populated when deriving.

# Cc.1 IDENTITY -- What Is This Config? [REQUIRED]
#
# Every TOML data file MUST have identity. name + version are the
# minimum viable contract. Without identity, the config is anonymous
# data -- tooling can't discover, version, or reference it.
[identity]
name = "config-name"                            # Unique configuration identifier
version = "a-01.00"                             # Living version (stage-phase.completion)
description = "Configuration file description"
type = "generic"                                # Config type for categorization

# Cc.2 SETTINGS -- Primary Configuration Values [DEFINED]
#
# Most commonly modified values. Form variants populate with their
# specific settings (mode, enabled, name, etc.).
[settings]
# Reserved -- populate when deriving from this template

# Cc.3 RESOURCES -- Paths, Limits, Constraints [DEFINED]
#
# Filesystem paths, output directories, resource limits. Form variants
# populate with their specific paths and constraints.
[resources]
# Reserved -- populate when deriving from this template

# -------------------------------------------------------------------
# Co -- Content Operations
# -------------------------------------------------------------------
#
# Co defines what HAPPENS. In bare-bone, both operations sections are
# declared as stubs. Form variants populate with their specifics.

# Co.1 BEHAVIOR -- Runtime Modes and Toggles [DEFINED]
#
# Logging, debug mode, strict mode, feature toggles.
[behavior]
# Reserved -- populate when deriving from this template

# Co.2 INTEGRATIONS -- External Service Configuration [DEFINED]
#
# Database, cache, external API connections. Used primarily by code
# config forms; data config forms may omit.
[integrations]
# Reserved -- populate when deriving from this template

# -------------------------------------------------------------------
# Cv -- Content Validation
# -------------------------------------------------------------------
#
# Cv defines what's CORRECT. In bare-bone, validation is REQUIRED --
# every TOML file must be validatable. Uses _ prefix tables because
# validation is meta-content, not data the consumer reads directly.

# Cv.1 VALIDATION -- Schema, Health, Content Rules [REQUIRED]
#
# Every TOML data file MUST have validation. At minimum, a command
# to verify the file parses. schema.required tells tooling which
# sections MUST exist. health_scoring weights quality gates.
[_validation]
commands = ["tomlv config.toml"]

[_validation.schema]
required = ["identity"]
defined = []
optional = ["_extensions"]

[_validation.schema.fields.identity]
required = ["name", "version"]
defined = ["description", "type"]

[_validation.health_scoring]
total = 100
correct_structure = 40
valid_configuration = 30
useful_documentation = 30

# ===================================================================
# END CONTENT [END]
# ===================================================================


