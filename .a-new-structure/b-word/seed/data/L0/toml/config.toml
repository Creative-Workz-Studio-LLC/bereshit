[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

# P.1 CORE — Identity
[_pragma.P1_core]
key = "B-word-seed-data-toml-config"
from = "none"
at = "template"

# P.2 FAMILY — Classification
[_pragma.P2_family]
type = "data"
subtype = "config"
role = "seed"
structure = "3-block"

# P.3 INSTANCE — File Details
[_pragma.P3_instance]
component = "Rails — root template for all TOML configurations"
layer = "seed/data/L0/toml"
includes = "none"
provides = ["TOML_CONFIG_TEMPLATE"]

# P.4 ARCHITECTURE — Scaling Context
[_pragma.P4_architecture]
