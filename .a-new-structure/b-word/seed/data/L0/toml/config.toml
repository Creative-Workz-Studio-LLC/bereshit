# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores, match Go struct field tags"
constraint = "All values typed. Go struct tags must match TOML key names."
Cc = "Content Configurations — identity, settings, resources"
Co = "Content Operations — behavior, patterns (root template examples)"
Cv = "Content Validation — schema, health scoring, content rules"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────

# Cc.1 IDENTITY — What Is This Config? [REQUIRED]
[identity]
name = "config-name"                            # Unique configuration identifier
version = "a-01.00"                             # Living version (stage-phase.completion)
description = "Configuration file description"
type = "generic"                                # Config type for categorization

# Cc.2 SETTINGS — Primary Configuration Values [DEFINED]
[settings]
# Core settings — most commonly modified values
# Type annotations: string, int, float, bool, array, table
mode = "development"                            # development | production
enabled = true                                  # Enable core feature
name = "default"                                # Primary string setting

# Cc.3 RESOURCES — Paths, Limits, Constraints [DEFINED]
[resources.paths]
root = "./"
output = "./output"
cache = "./cache"

[resources.limits]
max_concurrent = 10                             # Range: 1-100
max_memory = 104857600                          # 100MB in bytes
timeout_ms = 30000                              # Range: 1000-300000

# Cc extensions — experimental configuration patterns
[_extensions.cc]
note = "Experimental Cc patterns — may be promoted into identity, settings, or resources"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Co.1 BEHAVIOR — Runtime Modes and Toggles [DEFINED]
[behavior]
log_level = "info"                              # error, warn, info, debug
debug_mode = false
strict_mode = false
verbose_output = false

# Co.2 PATTERNS — TOML Structural Templates (root template only)

# Nested Table Pattern
# Access in code: config.Parent.Child.Setting
[parent.child]
nested_setting = "value"

[parent.another_child]
other_setting = 42

# Array of Tables Pattern
# Access in code: config.Handlers[0].Name
[[handlers]]
name = "handler_one"
enabled = true
order = 1

[[handlers]]
name = "handler_two"
enabled = false
order = 2

# Co extensions — experimental operational patterns
[_extensions.co]
note = "Experimental Co patterns — may be promoted into behavior or new operational sections"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

# Cv.1 VALIDATION — Schema, Health, Content Rules [REQUIRED]
[_validation]
commands = ["tomlv config.toml"]

[_validation.schema]
required = ["identity"]
defined = ["settings", "resources", "behavior"]
optional = ["_extensions"]

[_validation.schema.fields.identity]
required = ["name", "version"]
defined = ["description", "type"]

[_validation.schema.fields.settings]
required = []
defined = ["mode", "enabled"]

[_validation.schema.fields.behavior]
required = []
defined = ["log_level", "debug_mode"]

[_validation.health_scoring]
total = 100
correct_structure = 30
valid_configuration = 40
useful_documentation = 30

[_validation.content]
mode_valid = ["development", "production"]
log_levels = ["error", "warn", "info", "debug"]

# Cv extensions — experimental validation patterns
[_extensions.cv]
note = "Experimental Cv patterns — may be promoted into _validation"

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
