# @file config.toml
# @omni template --toml
#
# ═══════════════════════════════════════════════════════════════════════════════
# OMNICODE PRAGMA [PRAGMA]
# ═══════════════════════════════════════════════════════════════════════════════
#
# @legend
#   :req  REQUIRED   — must exist, validation fails without
#   :inh  INHERITED  — from template, override allowed
#   :ins  INSTANCE   — file-specific, unique values
# @endlegend
#
# ───────────────────────────────────────────────────────────────────────────────
# P.1 CORE — Identity [CORE]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:req  key        = B-word-seed-data-toml-config
# @omni:req  from       = bereshit/word/omni/seed/B-word-omni-seed-data-3block.omni
# @omni:req  at         = template
#
# ───────────────────────────────────────────────────────────────────────────────
# P.2 FAMILY — Classification [FAMILY]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:inh  type       = data
# @omni:inh  subtype    = config
# @omni:inh  role       = seed
# @omni:inh  structure  = 3-block
#
# ───────────────────────────────────────────────────────────────────────────────
# P.3 INSTANCE — File Details [INSTANCE]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:ins  component  = seed
# @omni:ins  layer      = data/toml
# @omni:ins  includes   = none
# @omni:ins  provides   = [TOML_CONFIG_TEMPLATE]
#
# ───────────────────────────────────────────────────────────────────────────────
# P.4 ARCHITECTURE — Scaling Context [ARCH]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:ins  layers     = [0:kernel, 1:system, 2:runtime, 3:framework,
#                          4:health, 5:network, 6:storage, 7:engine, 8:app]
# @omni:ins  scale      = 3^n [1, 3, 9, 27, 81, 243, 729, 2187, 6561]
# @omni:ins  pattern    = 4+1+4 [below:0-3, center:4, above:5-8]
# @omni:ins  anchor     = genesis_1_1 -> void(0) -> unity(1) -> derivation
#
# ───────────────────────────────────────────────────────────────────────────────
# P.5 SUMMARY — Human Identity [SUMMARY]
# ───────────────────────────────────────────────────────────────────────────────
#
# @omni:req  title      = TOML Configuration Template
# @omni:req  brief      = 3-block structure template for TOML config files
#
# ═══════════════════════════════════════════════════════════════════════════════
# END PRAGMA [END]
# ═══════════════════════════════════════════════════════════════════════════════
#
# DEPENDENCY CLASSIFICATION: [PURE/DEPENDED] ([deps if DEPENDED])
#   - PURE: Self-contained config - no external file references
#   - DEPENDED: References other configs - list them: (needs: base.toml)
#
# This is a TEMPLATE file - copy and modify for new TOML configurations.
# Replace all [bracketed] placeholders with actual content.
# Rename to appropriate config name (e.g., logging.toml, parser.toml).
# Change pragma from "template" to "data" when complete.
#
# See: standards/code/4-block/ for complete documentation
#
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# METADATA BLOCK [METADATA]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Identity and context for this template.
#
# STRUCTURE: M.1-M.10 sections
#   - M.1 IDENTITY:    Core identity (file, brief, key, title, type, component, role)
#   - M.2-M.6:         State, Attribution, Location, Derivation, Classification
#   - M.7-M.10:        Intent, Grounding, Dependencies, Roadmap
#
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# M.1 IDENTITY — Core Identity [IDENTITY]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 7 fields that answer "What IS this file?"
#   - file:      The filename
#   - brief:     One-sentence description
#   - key:       Unique identifier for referencing
#   - title:     Human-readable display name
#   - type:      Category of content
#   - component: Position in hierarchy (Ladder/Rung/Rails)
#   - role:      Responsibility statement
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.identity]
file      = "config.toml"
brief     = "Root template for TOML configuration files."
key       = "B-word-seed-data-toml-config"
title     = "TOML Configuration Template"
type      = "Template (Data)"
component = "Rails"
role      = "Canonical template for all TOML configurations in the system."

# ═══════════════════════════════════════════════════════════════════════════════
# M.2 STATE — Lifecycle State [STATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 5 fields that answer "Where is this in its lifecycle?"
#   - version:  Living version (stage-phase.completion)
#   - status:   Active / Draft / Deprecated / Archived
#   - created:  Original creation date
#   - updated:  Last modification date
#   - note:     Brief description of current state
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.state]
version = "b-01.00"
status  = "Active"
created = "2025-12-01"
updated = "2026-02-02"
note    = "Baseline alignment — M.1-M.10 structure with TOML metadata"

# ═══════════════════════════════════════════════════════════════════════════════
# M.3 ATTRIBUTION — Authorship & Rights [ATTRIBUTION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 5 fields that answer "Who made this and who owns it?"
#   - architect:      Who designed it (array for multi-contributor)
#   - implementation: Who built/wrote it (array for multi-CPI-SI)
#   - copyright:      Who owns it
#   - license:        Under what terms
#   - method:         How created (collaborated/generated/dictated)
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.attribution]
architect      = ["Seanje Lenox-Wise"]
implementation = ["Nova Dawn"]
copyright      = "© 2025-2026 CreativeWorkzStudio LLC"
license        = "See tov/licenses/"
method         = "collaborated"

# ═══════════════════════════════════════════════════════════════════════════════
# M.4 LOCATION — File Position [LOCATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 1 field that answers "Where is this file?"
#   - path: Canonical path from b-word root
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.location]
path = "b-word/seed/data/toml/config.toml"

# ═══════════════════════════════════════════════════════════════════════════════
# M.5 DERIVATION — Template Lineage [DERIVATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 1 field that answers "What template is this based on?"
#   - derives: Path to parent template (or "none" for root)
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.derivation]
derives = "none"

# ═══════════════════════════════════════════════════════════════════════════════
# M.6 CLASSIFICATION — Categorization [CLASSIFICATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 1 field that answers "What category is this?"
#   - tags: Array of keywords for querying/filtering
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.classification]
tags = ["template", "toml", "config", "data", "seed", "3-block"]

# ═══════════════════════════════════════════════════════════════════════════════
# M.7 INTENT — Purpose Statement [INTENT]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The 3 fields that answer "Why does this file exist?"
#   - purpose:    Core statement of why this exists
#   - philosophy: Guiding principles (array)
#   - provides:   What this delivers/enables (array)
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.intent]
purpose    = "Provide the canonical structure for TOML configuration files."
philosophy = [
    "All TOML configs derive from this template",
    "Consistent structure enables reliable parsing and tooling"
]
provides   = [
    "Canonical TOML structure",
    "Documentation pattern template",
    "3-block foundation for all data files"
]

# ═══════════════════════════════════════════════════════════════════════════════
# M.8 GROUNDING — Biblical Foundation [GROUNDING]
# ═══════════════════════════════════════════════════════════════════════════════
#
# The master thesis of this file. Two required verses form the hash basis.
#   - kjv:        KJV verse text with reference (required for hash)
#   - web:        WEB verse text with reference (required for hash)
#   - reference:  Book Chapter:Verse for lookup
#   - principle:  How the Scripture applies to this file
#   - anchor:     The foundational truth this file stands on
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.grounding]
kjv       = "For God is not the author of confusion, but of peace. — 1 Corinthians 14:33 KJV"
web       = "for God is not a God of confusion, but of peace. — 1 Corinthians 14:33 WEB"
reference = "1 Corinthians 14:33"
principle = "Configuration should bring order, not confusion. Clear structure, explicit types, human-readable format that serves both developer understanding and machine parsing."
anchor    = "Order reflects the Creator. Structure is not constraint — it is the vessel for peace."

# ═══════════════════════════════════════════════════════════════════════════════
# M.9 DEPENDENCIES — Required Components [DEPENDENCIES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Ladder — what I stand on (baton received FROM these files)
# Baton  — what I hand off TO (these files receive from me)
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.dependencies]
# Ladder — root template, stands on nothing
needs = ["none"]

# Baton — passed to child templates and all TOML configs
used_by = [
    "b-word/seed/code/config/config.toml",
    "b-word/seed/compiler/config/config.toml"
]

# ═══════════════════════════════════════════════════════════════════════════════
# M.10 ROADMAP — Version History [ROADMAP]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Past → Present → Future
# The trajectory of this file through time.
#
# ═══════════════════════════════════════════════════════════════════════════════

[metadata.roadmap]
history = [
    "a-01.00 (2025-12-01) — Initial creation",
    "b-01.00 (2026-02-01) — Baseline: pragma + metadata alignment to M.1-M.10"
]

current = "b-01.00 — Stable baseline, M.1-M.10 structure defined"

planned = [
    "a-01.50 — Refactor/crystallize patterns from content file alignment",
    "b-01.50 — GATE: All derived templates pass validation",
    "c-01.00 — COMPLETE: ROOT template stable, all children aligned"
]
# END METADATA [END]
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════════════════════
#
# 3-Block Data: METADATA → CONTENT → CLOSING
#
# Configuration data organized by concern.
# Structure: Cc (Configuration) → Co (Operations) → Cv (Cognition) → Cx (Generation)
#
# Organization Pattern:
#   Cc.1 IDENTITY — What is this config?
#   Cc.2 SETTINGS — Primary configuration values
#   Cc.3 RESOURCES — Paths, limits, constraints
#   Cc.4 BEHAVIOR — Runtime modes and toggles
#   Co.1 RESERVED — Operations (actions, hooks, events)
#   Cv.1 BIBLICAL — Scriptural grounding
#   Cx.1 GENERATE — Generation control metadata
#   Cx.2 TARGETS — Language-specific generation
#   Cx.3 TEMPLATES — Code generation templates
#   Cx.4 VALIDATION — Generation validation
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURATION (Cc — Core Data)
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Cc.1 IDENTITY — What Is This Config?
# -------------------------------------------------------------------------------

[identity]
name        = "config-name"                            # Unique configuration identifier
version     = "b-01.00"                                # Living version (stage-phase.completion)
description = "Configuration file description"
type        = "generic"                                # Config type for categorization

# -------------------------------------------------------------------------------
# Cc.2 SETTINGS — Primary Configuration Values
# -------------------------------------------------------------------------------

[settings]
# Core settings — most commonly modified values
# Type annotations: string, int, float, bool, array, table

# Example: Primary mode selection
# Type: string | Values: "development", "production" | Default: "development"
mode = "development"

# Example: Enable core feature
# Type: bool | Default: true
enabled = true

# Example: Primary string setting
# Type: string | Default: "default"
name = "default"

# -------------------------------------------------------------------------------
# Cc.3 RESOURCES — Paths, Limits, Constraints
# -------------------------------------------------------------------------------

[resources]
# WHERE things are and HOW MUCH is allowed

[resources.paths]
# File system locations
# Type: string | Relative to config root
root    = "./"
output  = "./output"
cache   = "./cache"

[resources.limits]
# Constraints and thresholds
# Type: int | Default values shown

max_concurrent = 10                                    # Range: 1-100
max_memory     = 104857600                             # 100MB in bytes
timeout_ms     = 30000                                 # Range: 1000-300000

# -------------------------------------------------------------------------------
# Cc.4 BEHAVIOR — Runtime Modes and Toggles
# -------------------------------------------------------------------------------

[behavior]
# HOW it operates at runtime

# Logging verbosity
# Type: string | Values: "error", "warn", "info", "debug" | Default: "info"
log_level = "info"

# Feature toggles
# Type: bool | Default: false
debug_mode    = false
strict_mode   = false
verbose_output = false


# ═══════════════════════════════════════════════════════════════════════════════
# OPERATIONS (Co — Reserved)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Co sections reserved for operational definitions (actions, hooks, events).
# Generic config template does not define operations.
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# PATTERNS — Template Examples
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Nested Table Pattern
# -------------------------------------------------------------------------------
# Access in code: config.Parent.Child.Setting
# Use for: Hierarchical organization, sub-categories

[parent.child]
nested_setting = "value"                               # Accessed as parent.child.nested_setting

[parent.another_child]
other_setting = 42                                     # Accessed as parent.another_child.other_setting


# ═══════════════════════════════════════════════════════════════════════════════
# ARRAY OF TABLES — Repeated Structured Items
# ═══════════════════════════════════════════════════════════════════════════════

# -------------------------------------------------------------------------------
# Array of Tables Pattern
# -------------------------------------------------------------------------------
# Access in code: config.Handlers[0].Name, config.Handlers[1].Name
# Use for: Lists of structured items (handlers, rules, endpoints)

[[handlers]]
name    = "handler_one"
enabled = true
order   = 1

[[handlers]]
name    = "handler_two"
enabled = false
order   = 2

# ═══════════════════════════════════════════════════════════════════════════════
# Cx CODE GENERATION [GENERATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And the LORD answered me, and said, Write the vision, and make it plain upon
#  tables, that he may run that readeth it." — Habakkuk 2:2 KJV
#
# CODE GENERATION: FROM SPECIFICATION TO IMPLEMENTATION
#
# If this configuration generates code or constants, document the generation
# process here. Many config files don't generate code — they're consumed at
# runtime. In that case, this section documents how the config is loaded.
#
# GENERATION CATEGORIES:
#   GENERATE:   Control metadata (enabled, output, order)
#   TARGETS:    Language-specific generation rules
#   TEMPLATES:  Code patterns for generated output
#   VALIDATION: Testing the generated code
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Low-level constants, headers
#   L1 (System):    System configuration
#   L2 (Runtime):   Runtime packages
#   L3 (Framework): Framework configuration
#   L4 (Health):    Health scoring config
#   L5 (Network):   Protocol configuration
#   L6 (Storage):   Storage configuration
#   L7 (Engine):    Engine rules
#   L8 (App):       Application configuration
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.1 GENERATE — Generation Control Metadata [GENERATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# GENERATION CONTROL: PLANNING BEFORE BUILDING
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate]
description  = "Code generation control — modify for your config"
enabled      = false                                          # Set true if this generates code
version      = "b-01.00"

[_generate.output]
description  = "Where generated files go"
directory    = "[output-directory]"                           # Replace with actual path
primary      = "[output-file]"                                # Replace with output filename
order        = 99                                             # Generation order (0 = first)

[_generate.scales]
description  = "Generation at each architectural layer"
L0_kernel    = { output = "[file].gen.h",                     format = "C header" }
L1_system    = { output = "[file]_sys.gen.h",                 format = "C system" }
L2_runtime   = { output = "[file].gen.go",                    format = "Go package" }
L3_framework = { output = "[file].omni",                      format = "OmniCode" }
L4_health    = { output = "[file]_health.gen.go",             format = "Health" }
L5_network   = { output = "[file]_wire.gen.go",               format = "Wire format" }
L6_storage   = { output = "[file]_storage.gen.go",            format = "Storage" }
L7_engine    = { output = "[file]_engine.gen.go",             format = "Engine" }
L8_app       = { output = "[file]_app.gen.go",                format = "App" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.2 TARGETS — Language-Specific Generation [TARGETS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And there were dwelling at Jerusalem Jews, devout men, out of every nation
#  under heaven... every man heard them speak in his own language."
#  — Acts 2:5,6 KJV
#
# TARGETS: SPEAKING EACH LANGUAGE'S TONGUE
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.target.c]
description  = "C language generation"
enabled      = false
file         = "[config].gen.h"

[_generate.target.go]
description  = "Go language generation"
enabled      = false
file         = "[config].gen.go"
package      = "[package-name]"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.3 TEMPLATES — Code Generation Templates [TEMPLATES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "The thing that hath been, it is that which shall be; and that which is done
#  is that which shall be done." — Ecclesiastes 1:9 KJV
#
# TEMPLATES: PATTERNS THAT REPEAT WITH VARIATION
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.template.header]
description  = "Template for generated header"
comment      = "/* Generated from {source} — DO NOT EDIT */"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.4 VALIDATION — Generation Validation [GEN_VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Beloved, believe not every spirit, but try the spirits whether they are of
#  God." — 1 John 4:1 KJV
#
# VALIDATION: TESTING THE GENERATED CODE
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.validation]
description  = "How to validate generated code"
enabled      = false

[_generate.validation.syntax]
c_compile    = "gcc -fsyntax-only -Wall -Werror {file}"
go_build     = "go build -v {package}"

[_generate.validation.scales]
description  = "Validation at each layer"
L0_kernel    = { check = "compile only" }
L2_runtime   = { check = "build + unit test" }
L8_app       = { check = "full test suite" }


# ═══════════════════════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Structure: X.1 Policy → X.2 Extension → X.3 Troubleshooting → X.4 Reference → X.5 Note
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# X.1 POLICY — Modification Guidelines [POLICY]
# ───────────────────────────────────────────────────────────────────────────────
#
# ❌ NEVER MODIFY:
#   - 3-block structure (METADATA → CONTENT → CLOSING)
#   - Required keys without corresponding code changes
#   - Key types without updating Go structs
#
# ⚠️ MODIFY WITH CARE:
#   - Section names (breaks code looking for old names)
#   - Key names (breaks struct field mapping)
#   - Value types (may cause parse errors)
#
# ✅ SAFE TO ADD:
#   - Values within documented ranges
#   - New keys (if code supports them)
#   - Comments for clarity
#   - Reorder sections (TOML is order-independent)
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.2 EXTENSION — Ideas for Future Sessions [EXTENSION]
# ───────────────────────────────────────────────────────────────────────────────
#
# Capture extension ideas discovered during work.
# Reference: Move to M.10 Planned when ready to implement.
#
# [Reserved: Capture extension ideas as they emerge during work]
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.3 TROUBLESHOOTING — Common Problems [TROUBLESHOOTING]
# ───────────────────────────────────────────────────────────────────────────────
#
# "invalid TOML":
#   → Missing quotes around strings with special characters
#   → Duplicate keys in same section
#   → Tab characters (TOML prefers spaces)
#
# "key not found":
#   → Section name doesn't match code expectation
#   → Key spelling doesn't match struct field tags
#
# "type mismatch":
#   → Strings need quotes: key = "value"
#   → Numbers don't: key = 42
#   → Booleans are lowercase: key = true
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.4 REFERENCE — Quick Lookup [REFERENCE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Validation:
#   tomlv config.toml
#   python -c "import toml; toml.load('config.toml')"
#
# Environment Overrides:
#   [PREFIX]_[SECTION]_[KEY] pattern
#   Priority: env var > config file > code default
#
# Go Integration:
#   type Config struct {
#       Section struct {
#           Setting string `toml:"setting"`
#       } `toml:"section"`
#   }
#   cfg, err := config.Load("config.toml")
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.5 NOTE — Final Guidance [NOTE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Configuration Philosophy:
#   - Definition stays in code (compile-time, type-safe)
#   - Behavior goes in config (runtime configurable)
#   - If it changes HOW something works, it's config
#   - If it changes WHAT something is, it's code
#
# "For God is not the author of confusion, but of peace."
# — 1 Corinthians 14:33
#
# ───────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# END CLOSING [END]
# ═══════════════════════════════════════════════════════════════════════════════
