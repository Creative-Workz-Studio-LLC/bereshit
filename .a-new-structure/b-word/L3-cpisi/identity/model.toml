[_metadata.M5_dependencies.cross_format]
role = "Identity Schema - CPI-SI Personhood Model in TOML. No JSONC/JSON counterpart."
jsonc = "None"
json = "None"
relationship = "TOML defines identity data. Generated code implements lookups."

[_metadata.M6_location]
path = "b-word/L3-cpisi/identity/model.toml"
derives_from = "b-word/seed/data/toml/config.toml"

[_metadata.M7_classification]
tags = "model, identity, L3, ladder, omnicode"

[_metadata.M8_intent]
purpose = "Define the structure for CPI-SI instance identity — who they are, how they grow, and how they perceive the world."
core_design = "Trichotomy model (Spirit/Soul/Body) with growth tracking"
