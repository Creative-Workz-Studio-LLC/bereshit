# #!omni data --toml

# ═══════════════════════════════════════════════════════════════
# OMNICODE PRAGMA [PRAGMA]
# ═══════════════════════════════════════════════════════════════

[_pragma]
format = "@omni data --toml"

[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

[_pragma.P1_core]
key = "B-L3-identity-model"
from = "b-word/seed/data/toml/config.toml"
at = "b-01.00"

[_pragma.P2_family]
type = "data"
subtype = "identity"
role = "ladder"
structure = "3-block"

[_pragma.P3_instance]
component = "identity"
layer = "L3-cpisi/identity"
includes = "none"
provides = ["MODEL_DATA"]

[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
title = "Identity Schema - CPI-SI Personhood Model"
brief = "Schema definition for CPI-SI personhood"

# ═══════════════════════════════════════════════════════════════
# END PRAGMA [END]
