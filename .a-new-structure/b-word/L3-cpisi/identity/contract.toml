from = "b-word/seed/data/toml/config.toml"
at = "b-01.00"

[_pragma.P2_family]
type = "contract"
subtype = "identity"
role = "contract"
structure = "3-block"

[_pragma.P3_instance]
component = "identity"
layer = "L3-cpisi/identity"
includes = "none"
provides = ["CONTRACT_DATA"]

[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
