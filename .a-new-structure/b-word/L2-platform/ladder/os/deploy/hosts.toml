# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# Ternary Foundation
# ───────────────────────────────────────────────────────────────

[ternary]
scale = "balanced"
description = "Host availability maps to the ternary health model"

[ternary.mapping]
primary = "+1 (primary production host — Oracle Cloud, always-on)"
fallback = "0 (fallback host — Dell LAN, available when primary fails)"
standby = "-1 (standby host — Fly.io, auto-stopped, cold start)"

# ───────────────────────────────────────────────────────────────
# Deployment Hosts
# ───────────────────────────────────────────────────────────────

[hosts.oracle]
name = "oracle"
address = "163.192.118.124"
username = "seanje"
arch = "arm64"
is_primary = true
description = "Oracle Cloud VM — ARM64, Ubuntu 24.04, 4 OCPU, 12GB RAM"

[hosts.dell]
name = "dell"
address = "192.168.1.99"
username = "seanje"
arch = "amd64"
is_primary = false
description = "Dell workstation — LAN only, x86_64 fallback"

# ───────────────────────────────────────────────────────────────
# Production Paths
# ───────────────────────────────────────────────────────────────

[paths]
prod_dir = "/home/seanje/cws"
prod_bin = "/usr/local/bin/cws-server"
description = "Remote filesystem paths shared by all deployment targets"

# ───────────────────────────────────────────────────────────────
# Server Configuration
# ───────────────────────────────────────────────────────────────

[server]
description = "CWS server runtime defaults"

[server.defaults]
port = 3847
env_port = "CWS_PORT"
env_builder_dir = "CWS_BUILDER_DIR"
description = "Default port and environment variable names"

[server.features]
health_endpoint = "/health"
config_endpoint = "/api/config"
preferences_endpoint = "/api/preferences"
description = "Known HTTP endpoints served by cws-server"

# ───────────────────────────────────────────────────────────────
# System Limits
# ───────────────────────────────────────────────────────────────

[system]
description = "Counts for the deployment subsystem"

[system.type_counts]
hosts = 2
paths = 2
server_endpoints = 3

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


