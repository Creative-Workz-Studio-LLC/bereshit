# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# Ternary Foundation
# ───────────────────────────────────────────────────────────────

[ternary]
scale = "balanced"
description = "Temporal classifications map to the ternary productivity model"

[ternary.mapping]
positive = "+1 (peak productivity hours — focused, alert, optimal)"
neutral = "0 (transitional hours — rising, recovering, winding down)"
negative = "-1 (rest hours — body preparing for or in recovery)"

# ───────────────────────────────────────────────────────────────
# Time of Day — 7 Ranges
# ───────────────────────────────────────────────────────────────

[time_of_day.morning]
start_hour = 5
end_hour = 9
icon = "🌅"
label = "morning"
color = "yellow"
description = "Morning — cortisol rising, alertness building"

[time_of_day.mid_morning]
start_hour = 9
end_hour = 12
icon = "☀️"
label = "mid-morning"
color = "bright_yellow"
description = "Mid-morning — peak cognitive performance window"

[time_of_day.midday]
start_hour = 12
end_hour = 14
icon = "🌞"
label = "midday"
color = "yellow"
description = "Midday — post-lunch dip normal, lighter tasks"

[time_of_day.afternoon]
start_hour = 14
end_hour = 17
icon = "🌤️"
label = "afternoon"
color = "cyan"
description = "Afternoon — second wind building, moderate focus"

[time_of_day.evening]
start_hour = 17
end_hour = 20
icon = "🌆"
label = "evening"
color = "blue"
description = "Evening — creativity often high, winding down"

[time_of_day.night]
start_hour = 20
end_hour = 23
icon = "🌙"
label = "night"
color = "magenta"
description = "Night — decreasing alertness, prepare for rest"

[time_of_day.late_night]
start_hour = 23
end_hour = 5
icon = "🌑"
label = "late night"
color = "dim_blue"
description = "Late night — body in recovery mode, rest recommended"

# ───────────────────────────────────────────────────────────────
# Session Phase — 5 Phases (by elapsed minutes)
# ───────────────────────────────────────────────────────────────

[session_phase.fresh]
max_minutes = 15
color = "green"
description = "Fresh — just started, warming up"

[session_phase.active]
max_minutes = 60
color = "cyan"
description = "Active — in the flow, productive"

[session_phase.sustained]
max_minutes = 120
color = "yellow"
description = "Sustained — long session, watch for fatigue"

[session_phase.long]
max_minutes = 240
color = "blue"
description = "Long — consider a break, diminishing returns likely"

[session_phase.extended]
max_minutes = 0
color = "magenta"
description = "Extended — marathon session, rest strongly recommended"

# ───────────────────────────────────────────────────────────────
# Circadian Phase — 6 Phases
# ───────────────────────────────────────────────────────────────

[circadian.rising]
start_hour = 5
end_hour = 9
productivity = "increasing"
note = "cortisol rising, alertness building"

[circadian.peak]
start_hour = 9
end_hour = 12
productivity = "high"
note = "peak cognitive performance"

[circadian.dip]
start_hour = 12
end_hour = 14
productivity = "lower"
note = "post-lunch dip normal"

[circadian.recovery]
start_hour = 14
end_hour = 17
productivity = "moderate"
note = "second wind building"

[circadian.evening]
start_hour = 17
end_hour = 21
productivity = "variable"
note = "creativity often high"

[circadian.rest]
start_hour = 21
end_hour = 5
productivity = "low"
note = "body preparing for rest"

# ───────────────────────────────────────────────────────────────
# System Limits
# ───────────────────────────────────────────────────────────────

[system]
description = "Counts for the temporal boundary subsystem"

[system.type_counts]
time_of_day_ranges = 7
session_phases = 5
circadian_phases = 6

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


