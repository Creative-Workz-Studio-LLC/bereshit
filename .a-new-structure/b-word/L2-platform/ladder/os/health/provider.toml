[_pragma]
format = "@omni contract --toml"

[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

[_pragma.P1_core]
key = "B-L2-os-provider"
from = "b-word/seed/data/toml/config.toml"
at = "b-01.00"

[_pragma.P2_family]
type = "contract"
subtype = "os"
role = "contract"
structure = "3-block"

[_pragma.P3_instance]
component = "os"
layer = "L2-platform/os"
includes = "none"
provides = ["PROVIDER_DATA"]

[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
title = "HealthProvider Contract"
brief = "Interface contract for health providers"

