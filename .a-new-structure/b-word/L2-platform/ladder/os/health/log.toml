# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Rung data file — health log schema - cpi-si health history tracking for the OmniCode system"
Cc = "Content Configurations — Schema definition for .health-log files"
Co = "Content Operations — log data"
Cv = "Content Validation — schema requirements, type constraints"

[ternary]
description = "Ternary scale foundation for health logging"

[ternary.scale]
# The ternary balance: -100 (wanting) → 0 (even) → +100 (integrity)
min = -100
center = 0
max = 100
# Log RECORDS movements; diagnostics OBSERVES position; restoration MOVES

[ternary.levels]
# 7-level system with ternary ranges (from score.toml)
# Log entries can move true score between these levels
broken = { range = [-100, -67], direction = "wanting" }
wanting = { range = [-66, -34], direction = "wanting" }
lacking = { range = [-33, -1], direction = "wanting" }
even = { range = [0, 0], direction = "center" }
sound = { range = [1, 33], direction = "integrity" }
whole = { range = [34, 66], direction = "integrity" }
perfect = { range = [67, 100], direction = "integrity" }

[ternary.atomic]
# Atomic delta values — the irreducible unit of change
# "Narrow is the way" — success is always +1 (one path)
# "Broad is the way" — failure is always -1 (but many can occur)
# — Matthew 7:13-14 KJV
success_value = 1
failure_value = -1
neutral_value = 0


# -----------------------------------------------------------------------------
# 2. Log Entry Format - Structure of Each Entry
# -----------------------------------------------------------------------------
# Each line in the log is a single entry recording one health-affecting action.
#
# Format: TIMESTAMP|ACTION|DELTA|SOURCE|DETAIL
#
# Example: 2025-12-12T14:30:00Z|success|+1|test_pass|tests/unit/foo_test.go
# Example: 2025-12-12T14:31:00Z|failure|-3|lint_error|src/main.go:45 undefined var
# Example: 2025-12-12T14:32:00Z|neutral|0|file_read|src/config.toml

[entry]
description = "Single log entry recording a health-affecting action"
format = "TIMESTAMP|ACTION|DELTA|SOURCE|DETAIL"
delimiter = "|"

[entry.timestamp]
description = "When the action occurred"
format = "ISO8601"  # 2025-12-12T14:30:00Z
position = 1
required = true

[entry.action]
description = "Category of action"
type = "enum"
values = ["success", "failure", "neutral", "recovery", "reset"]
position = 2
required = true

[entry.delta]
description = "Health change value"
type = "int"
position = 3
required = true
# +1 for success (narrow way)
# -1, -2, -3... for failure (broad way, varying severity)
# 0 for neutral

[entry.source]
description = "What triggered the action"
type = "string"
position = 4
examples = ["test_pass", "test_fail", "lint_error", "file_created", "manual"]
required = true

[entry.detail]
description = "Additional context (file path, error message, etc.)"
type = "string"
position = 5
required = false  # Optional for more context


# -----------------------------------------------------------------------------
# 3. Action Types - Categories of Health-Affecting Actions
# -----------------------------------------------------------------------------
# Actions follow the biblical principle:
#   Narrow way (+1): One path to success
#   Broad way (-N): Many paths to failure, varying severity

[actions.success]
description = "Positive action — narrow way (+1)"
delta = 1  # Always +1 for success
examples = [
    "test_pass",
    "lint_clean",
    "build_success",
    "file_created",
    "documentation_added",
]
scripture = "Matthew 7:14 — narrow is the way which leadeth unto life"

[actions.failure]
description = "Negative action — broad way (variable -N)"
delta_range = [-1, -100]  # -1 minimum, can be more severe
examples = [
    { source = "test_fail", typical_delta = -1 },
    { source = "lint_error", typical_delta = -1 },
    { source = "build_fail", typical_delta = -3 },
    { source = "broken_reference", typical_delta = -5 },
    { source = "security_issue", typical_delta = -10 },
]
scripture = "Matthew 7:13 — broad is the way that leadeth to destruction"

[actions.neutral]
description = "No health impact"
delta = 0
examples = ["file_read", "status_check", "log_viewed"]

[actions.recovery]
description = "Intentional recovery action"
delta_range = [1, 100]  # Positive, restoring health
examples = ["manual_fix", "refactor_complete", "debt_paid"]
note = "Recovery still uses +1 per action (narrow way), but recorded separately for tracking"

[actions.reset]
description = "Health reset to baseline"
delta = "special"  # Sets to 0, not additive
examples = ["full_reset", "reinitialize"]
note = "Rare — clears history and starts fresh at even balance"


# -----------------------------------------------------------------------------
# 4. File Format - .health-log File Structure
# -----------------------------------------------------------------------------
# Append-only text file, one entry per line

[file]
name = ".health-log"
description = "Health change history — one entry per line"
location = "directory root"  # Same location as .health
hidden = true  # Dot-prefixed
content_type = "text/plain"

[file.structure]
format = "append-only"
line_format = "TIMESTAMP|ACTION|DELTA|SOURCE|DETAIL"
encoding = "UTF-8"
line_terminator = "LF"
# Each line is independent — can be read in any order for sum calculation

[file.permissions]
read = "all"  # Anyone can read history
write = "append"  # Only append, never modify existing entries
execute = "none"

[file.git]
track = true  # Log files tracked in git
ignore = false
commit_message_prefix = "[health-log]"


# -----------------------------------------------------------------------------
# 5. True Score Calculation - Reconstructing from Log
# -----------------------------------------------------------------------------
# True score = sum of all delta values in the log
#
# This is the UNBOUNDED score that can exceed -100 to +100.
# The normalized/clamped display comes from health.toml.

[calculation]
description = "How to calculate true score from log"
method = "sum"  # Sum all delta values
formula = "true_score = Σ(entry.delta for all entries)"

[calculation.algorithm]
# Pseudocode:
#   true_score = 0
#   for each line in .health-log:
#       parse entry
#       if entry.action == "reset":
#           true_score = 0  # Reset clears accumulated score
#       else:
#           true_score += entry.delta
#   return true_score
handle_reset = "clear_accumulator"  # Reset action clears running sum

[calculation.example]
# Example log:
#   2025-12-12T10:00:00Z|success|+1|test_pass|tests/a.go
#   2025-12-12T10:01:00Z|success|+1|test_pass|tests/b.go
#   2025-12-12T10:02:00Z|failure|-3|build_fail|src/main.go
#   2025-12-12T10:03:00Z|success|+1|lint_clean|src/
#   2025-12-12T10:04:00Z|failure|-5|broken_ref|src/util.go
#
# Calculation: +1 +1 -3 +1 -5 = -5
# True score: -5
# Normalized (Base50): 0 (rounds to even)
# But TRUE shows we're -5 in debt

[calculation.normalization]
description = "After calculating true score, apply normalization from health.toml"
reference = "health.toml [health.normalized.bases]"
# true_score → normalized = round(true_score / base) * base
# Then clamp to -100/+100 for display


# -----------------------------------------------------------------------------
# 6. Retention Policy - How Long to Keep Entries
# -----------------------------------------------------------------------------
# Log can grow indefinitely, but may be pruned for performance

[retention]
description = "How long to keep log entries"
default_policy = "indefinite"  # Keep all by default

[retention.pruning]
enabled = false  # Default: don't prune
# If enabled:
strategy = "preserve_summary"
# Prune old entries but preserve:
#   - Running total at prune point
#   - Recent entries (last N days)
#   - All reset events
preserve_days = 90  # Keep last 90 days of detail
summary_entry = "TIMESTAMP|summary|ACCUMULATED_DELTA|prune|entries before DATE summarized"

[retention.archival]
description = "Move old logs to archive instead of deleting"
archive_path = ".health-log.archive"
compress = true


# -----------------------------------------------------------------------------
# 7. System Limits - C Implementation Constants
# -----------------------------------------------------------------------------
# These limits define buffer sizes and timing for C implementations.
# C code derives #define constants from these values.
#
# Scripture: "For which of you, intending to build a tower, sitteth not down
#             first, and counteth the cost" — Luke 14:28 KJV

[system]
description = "System limits for C implementation - source of truth for cpisi_types.h"

[system.buffers]
# Buffer sizes for log entry fields (in bytes/characters)
# Sized for real-world usage: stack traces, error messages, paths
msg_max        = 2048  # Maximum log message length (room for stack traces)
source_max     = 256   # Maximum source identifier (file:line:func)
component_max  = 64    # Maximum component name length
detail_max     = 512   # Maximum detail field length
format_max     = 512   # Maximum format string length
path_max       = 4096  # Maximum file path (matches PATH_MAX on Linux)
name_max       = 256   # Maximum file/entry name length
error_max      = 256   # Maximum short error string

[system.history]
# History tracking limits
log_history_max     = 1000  # Maximum log entries to keep in memory
event_history_max   = 100   # Maximum recent events to track
search_paths_max    = 8     # Maximum search paths for file location

[system.rotation]
# File rotation settings (used by cpisi_dar_rotation)
size_kb        = 1024  # Rotate when file exceeds this size (1MB)
check_hours    = 1     # Check for rotation every N hours
recent_days    = 90    # Keep detailed logs for N days
archive_days   = 180   # Keep archived logs for N days

[system.timing]
# Timing intervals (in milliseconds)
poll_interval_ms   = 1000   # Default polling interval (1 second)
debounce_ms        = 100    # Debounce time for rapid events
timeout_ms         = 5000   # Default operation timeout (5 seconds)
flush_interval_ms  = 1000   # Flush log buffer interval

[system.type_counts]
# Enum counts for array sizing and validation
log_level_count    = 9   # Number of log levels (CRISIS through INSIGHT)
action_type_count  = 5   # Number of action types (success, failure, neutral, recovery, reset)

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions defined"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('log.toml','rb'))\""]

[_validation.schema]
required = ["actions", "calculation", "entry", "file", "retention", "system", "ternary"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_tables_valid = 30
data_completeness = 30

