# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# Ternary Foundation
# ───────────────────────────────────────────────────────────────

[ternary]
scale = "balanced"
description = "Command states map directly to the ternary model"

[ternary.mapping]
proceed = "+1 (flowing/go — green spectrum)"
await = "0 (waiting/caution — yellow spectrum)"
halt = "-1 (stopped/terminal — red spectrum)"

# ───────────────────────────────────────────────────────────────
# CPI-SI Command Colors (OSC 10/11/12)
# ───────────────────────────────────────────────────────────────

[command_colors.HALT]
foreground = "#ff6b6b"
background = "#1a1a2e"
cursor = "#ff4757"
description = "Red spectrum — terminal/stop state"

[command_colors.AWAIT]
foreground = "#ffd93d"
background = "#1a1a2e"
cursor = "#feca57"
description = "Yellow spectrum — waiting/caution state"

[command_colors.PROCEED]
foreground = "#6bcb77"
background = "#1a1a2e"
cursor = "#26de81"
description = "Green spectrum — flowing/go state"

# ───────────────────────────────────────────────────────────────
# WezTerm State File Configuration
# ───────────────────────────────────────────────────────────────

[state_file]
runtime_dir_env = "XDG_RUNTIME_DIR"
fallback_dir = "/tmp"
filename = "cpisi-wezterm-state"
permissions = "0600"
description = "Persists current command for transition detection across invocations"

# ───────────────────────────────────────────────────────────────
# Health Emoji Mapping (for debug output)
# ───────────────────────────────────────────────────────────────

[[health_emoji]]
min_percent = 90
emoji = "💚"
label = "Excellent"

[[health_emoji]]
min_percent = 70
emoji = "💛"
label = "Good"

[[health_emoji]]
min_percent = 50
emoji = "🧡"
label = "Moderate"

[[health_emoji]]
min_percent = 30
emoji = "❤️"
label = "Poor"

[[health_emoji]]
min_percent = 10
emoji = "🩸"
label = "Critical"

[[health_emoji]]
min_percent = 0
emoji = "☠️"
label = "Failed"

# ───────────────────────────────────────────────────────────────
# Debug Session Markers
# ───────────────────────────────────────────────────────────────

[debug_markers]
session_start = "# DEBUG_SESSION_START"
session_end = "# DEBUG_SESSION_END"
section_separator = "────────────────────────────────────────────────────────────────"
box_top = "┌────────────────────────────────────────────────────────────────┐"
box_bottom = "└────────────────────────────────────────────────────────────────┘"
box_divider = "├────────────────────────────────────────────────────────────────┤"
description = "Structured markers for debug session parsing"

# ───────────────────────────────────────────────────────────────
# System Limits
# ───────────────────────────────────────────────────────────────

[system]
description = "Counts for the terminal display subsystem"

[system.type_counts]
command_colors = 3
health_emoji_levels = 6
debug_markers = 6

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


