# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# Ternary Foundation
# ───────────────────────────────────────────────────────────────

[ternary]
scale = "balanced"
description = "Two-level alert thresholds map to the ternary health model"

[ternary.mapping]
green = "+1 (sound/whole/perfect range — system healthy)"
yellow = "0 (even/lacking range — caution, approaching limits)"
red = "-1 (wanting/broken range — action required)"

# ───────────────────────────────────────────────────────────────
# Load Average Monitoring
# ───────────────────────────────────────────────────────────────

[metrics.load]
description = "System load average (1-minute) thresholds"
source = "/proc/loadavg"
icon = "📊"

[metrics.load.yellow]
threshold = 2.0
description = "Elevated load — system busy but functional"
health_mapping = "even/lacking"

[metrics.load.red]
threshold = 4.0
description = "High load — system under stress, degraded performance"
health_mapping = "wanting/broken"

# ───────────────────────────────────────────────────────────────
# Memory Monitoring
# ───────────────────────────────────────────────────────────────

[metrics.memory]
description = "Memory usage percentage thresholds"
source = "/proc/meminfo"
icon = "🧠"

[metrics.memory.yellow]
threshold = 70.0
description = "Elevated memory usage — swap pressure likely"
health_mapping = "even/lacking"

[metrics.memory.red]
threshold = 90.0
description = "Critical memory usage — OOM risk"
health_mapping = "wanting/broken"

# ───────────────────────────────────────────────────────────────
# Disk Monitoring
# ───────────────────────────────────────────────────────────────

[metrics.disk]
description = "Disk usage percentage thresholds"
source = "syscall.Statfs / df"
icon = "💾"

[metrics.disk.yellow]
threshold = 80.0
description = "Disk filling — cleanup recommended"
health_mapping = "even/lacking"

[metrics.disk.red]
threshold = 95.0
description = "Disk nearly full — writes may fail"
health_mapping = "wanting/broken"

# ───────────────────────────────────────────────────────────────
# Display Configuration
# ───────────────────────────────────────────────────────────────

[display]
description = "Color and formatting for threshold display"

[display.green]
ansi = "\u001B[32m"
label = "OK"
health_range = "sound to perfect"

[display.yellow]
ansi = "\u001B[33m"
label = "WARN"
health_range = "lacking to even"

[display.red]
ansi = "\u001B[31m"
label = "CRIT"
health_range = "broken to wanting"

# ───────────────────────────────────────────────────────────────
# System Limits
# ───────────────────────────────────────────────────────────────

[system]
description = "Operational limits for monitoring subsystem"

[system.polling]
min_interval_seconds = 1
default_interval_seconds = 5
max_interval_seconds = 60

[system.type_counts]
metrics = 3
alert_levels = 2
display_colors = 3

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


