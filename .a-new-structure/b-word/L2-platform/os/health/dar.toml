# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Rung data file — omnicode dar phase types for the OmniCode system"

[dar]
description = "Detect-Assess-Restore phase system"
phase_count = 3
aspect_count = 3
severity_count = 3
total_positions = 27

# DAR Phases
[dar.phases]
description = "3 DAR phases: witness system"

DETECT  = { index = 0, balanced = -1, description = "Witness — detect the problem" }
ASSESS  = { index = 1, balanced =  0, description = "Evaluate — assess the situation (CENTER)" }
RESTORE = { index = 2, balanced = +1, description = "Recover — restore to health" }

# Aspects (within each phase)
[dar.aspects]
description = "3 aspects per phase: lifecycle"

ENTRY   = { index = 0, balanced = -1, description = "Init — enter the phase" }
PROCESS = { index = 1, balanced =  0, description = "Handle — process in phase (CENTER)" }
EXIT    = { index = 2, balanced = +1, description = "Cleanup — exit the phase" }

# Severity levels
[dar.severity]
description = "3 severity levels: impact"

MILD     = { index = 0, balanced = -1, description = "Warning — continue with caution" }
MEDIUM   = { index = 1, balanced =  0, description = "Degraded — reduced functionality (CENTER)" }
CRITICAL = { index = 2, balanced = +1, description = "Fatal — immediate action required" }

# Restore results
[dar.restore_result]
description = "7 possible restore outcomes"

SUCCESS        = { value = 0, description = "Fully restored" }
PARTIAL        = { value = 1, description = "Partially restored" }
DEGRADED       = { value = 2, description = "Running degraded" }
DEFERRED       = { value = 3, description = "Deferred for later" }
BLOCKED        = { value = 4, description = "Blocked by dependency" }
FAILED         = { value = 5, description = "Restore failed" }
FATAL          = { value = 6, description = "Unrecoverable" }

# Restore strategies (from flags.toml)
[dar.restore_strategy]
description = "Strategy flags for restore operations"
reference = "types/flags.toml"

NONE          = { value = "0x00", description = "No strategy" }
FILL_DEFAULTS = { value = "0x01", description = "Fill missing with defaults" }
LOCATE_FILES  = { value = "0x02", description = "Search for files" }
CREATE_DIRS   = { value = "0x04", description = "Create directories" }
CLAMP_VALUES  = { value = "0x08", description = "Clamp out-of-range" }
FALLBACK      = { value = "0x10", description = "Use fallback" }
DEGRADE       = { value = "0x20", description = "Graceful degradation" }

# Offset encoding (27-cube navigation)
[dar.offset]
description = "27-position offset encoding"
formula = "offset = phase * 9 + severity * 3 + aspect"
min = 0
max = 26
face = 9

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions defined"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('dar.toml','rb'))\""]

[_validation.schema]
required = ["dar"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_tables_valid = 30
data_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
