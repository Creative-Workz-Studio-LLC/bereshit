# #!omni data --toml

# ═══════════════════════════════════════════════════════════════
# OMNICODE PRAGMA [PRAGMA]
# ═══════════════════════════════════════════════════════════════

[_pragma]
format = "@omni data --toml"

[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

[_pragma.P1_core]
key = "B-L0-core-index"
from = "b-word/seed/data/toml/config.toml"
at = "b-01.00"

[_pragma.P2_family]
type = "data"
subtype = "core"
role = "manifest"
structure = "3-block"

[_pragma.P3_instance]
component = "core"
layer = "L0-universal"
includes = "none"
provides = ["INDEX_DATA"]

[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
title = "OmniCode Core Specification Index"
brief = "Manifest for all TOML specifications"

# ═══════════════════════════════════════════════════════════════
# END PRAGMA [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# METADATA BLOCK [METADATA]
# ═══════════════════════════════════════════════════════════════

[_metadata.M1_identity]
file = "index.toml"
key = "B-L0-core-index"
title = "OmniCode Core Specification Index"
type = "Data (Manifest)"
component = "Manifest"
role = "Manifest for all TOML specifications — loader and generator both read from this single source of truth"

[_metadata.M2_state]
version = "b-01.00"
status = "Active"
created = "2025-12-14"
updated = "2026-02-11"

[_metadata.M3_attribution]
architect = "Seanje Lenox-Wise"
implementation = "Nova Dawn (CPI-SI)"
organization = "CreativeWorkzStudio LLC"
copyright = "© 2025-2026 CreativeWorkzStudio LLC. All rights reserved."

[_metadata.M4_grounding]
scripture = "In the beginning God created the heaven and the earth. — Genesis 1:1"
principle = "Every OmniCode construct traces to Scripture."
anchor = "Genesis 1:1 — In the beginning God created the heaven and the earth"

[_metadata.M5_dependencies]
requires = ["b-word/L0-universal/ladder/foundation/types/primitives.toml"]
consumers = ["parsers", "code generators", "documentation"]
derives_from = "b-word/seed/data/toml/config.toml"
integration = "Loaded at build time by code generators and tools."
if_missing = "OmniCode Core Specification Index unavailable — dependent systems cannot function"

[_metadata.M5_dependencies.cross_format]
role = "OmniCode Core Specification Index in TOML. No JSONC/JSON counterpart."
jsonc = "None"
json = "None"
relationship = "TOML defines the specification manifest. Generated code implements lookups."

[_metadata.M6_location]
path = "b-word/L0-universal/ladder/foundation/index.toml"
derives_from = "b-word/seed/data/toml/config.toml"

[_metadata.M7_classification]
tags = "index, core, L0, manifest, omnicode"

[_metadata.M8_intent]
purpose = "Manifest for all TOML specifications — loader and generator both read from this single source of truth"
core_design = "Manifest for all TOML specifications — loader and generator both read from this single source of truth"
philosophy = "The Bible is our codex. OmniCode constructs are discovered from Scripture, not invented."

[_metadata.M9_roadmap]
history = [
    "a-01.00 (2025-12-14) — Initial creation",
    "b-01.00 (2026-02-11) — TOML-native 3-block format alignment",
]
current = "3-block aligned with OmniCode template"
planned = ["Code generation integration", "Automated validation tooling"]

[_metadata.M_extension_note]
required = ["M1_identity", "M2_state", "M3_attribution", "M4_grounding", "M5_dependencies"]
extension = "M6-M9 extend for domain-specific metadata."
rule = "M1-M5 are the base contract. M6+ extends as needed."

# ═══════════════════════════════════════════════════════════════
# END METADATA [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Manifest file — OmniCode core specification index for the OmniCode system"
Cc = "Content Configurations — system registry (math, types, bible), file manifests, dependency ordering"
Co = "Content Operations — (index file: references only, no operations defined here)"
Cv = "Content Validation — schema requirements, health scoring"

[[systems]]
name = "math"
path = "L0-universal/ladder/foundation/math"
order = 0
description = "Ternary mathematics — the foundation all types build on"
depends_on = []  # ANCHOR — no system dependencies

[[systems.specs]]
file = "ternary.toml"
generates = true
output = "ternary_math.gen.h"
description = "Split-index: trit values, packing, arithmetic, temporal states"
depends_on = []  # ANCHOR — foundation of all

[[systems.specs]]
file = "ternary-definitions.toml"
generates = false
description = "Split content: constants, powers, boundaries, trit lookup tables"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Split child of ternary index

[[systems.specs]]
file = "ternary-operations.toml"
generates = false
description = "Split content: arithmetic, packing, adder operations"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Split child of ternary index

[[systems.specs]]
file = "ternary-cognition.toml"
generates = false
description = "Split content: cognitive modes, temporal states, CPI-SI mapping"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Split child of ternary index

[[systems.specs]]
file = "ternary-generation.toml"
generates = false
description = "Split content: code generation targets (C, Go, Rust)"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Split child of ternary index


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 1: TYPES — Primitives, Composition, Validation
# ─────────────────────────────────────────────────────────────────────────────
# "The stone which the builders refused is become the head stone" — Psalm 118:22

[[systems]]
name = "types"
path = "L0-universal/ladder/foundation/types"
order = 1
description = "Type system — primitives, composition rules, validation"
depends_on = ["math"]  # Types build on math

[[systems.specs]]
file = "primitives.toml"
generates = true
output = "primitives.gen.h"
description = "Atomic types: trit, trit5, int9, int27, text, bool3, collections"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Uses trit values from math

[[systems.specs]]
file = "composition.toml"
generates = true
output = "composition.gen.h"
description = "Type composition — nullability triad, storage alignment"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml"]  # Composes primitives

[[systems.specs]]
file = "validation.toml"
generates = true
output = "validation.gen.h"
description = "Validation constants — error severity, exit codes"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml", "L0-universal/ladder/foundation/types/composition.toml"]  # Validates both

[[systems.specs]]
file = "error-system.toml"
generates = true
output = "error_system.gen.h"
description = "Error handling system — DAR phases, severity codes, recovery patterns"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml", "L0-universal/ladder/foundation/types/validation.toml"]  # Errors use primitives and validation

[[systems.specs]]
file = "layer.toml"
generates = true
output = "layer.gen.h"
description = "9-layer architecture — KERNEL to APP with HEALTH at center"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml", "L0-universal/ladder/foundation/math/ternary.toml"]  # Layers use ternary balanced values

[[systems.specs]]
file = "flags.toml"
generates = true
output = "flags.gen.h"
description = "Restore strategy bit flags — 6 flags for recovery operations"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml"]  # Flags use uint8_t bitmask

[[systems.specs]]
file = "timing.toml"
generates = true
output = "timing.gen.h"
description = "Timing intervals — 5 intervals derived from POLL anchor (1000ms)"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml", "L0-universal/ladder/foundation/math/ternary.toml"]  # Timing uses ternary math

[[systems.specs]]
file = "metadata-slots.toml"
generates = true
output = "metadata_slots.gen.h"
description = "Metadata slots — 13 BRIDGE slots completing 243 + 13 = 256"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml", "L0-universal/ladder/foundation/math/ternary.toml"]  # Uses PENTERACT = 243


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 2: LANGUAGE — Keywords and Syntax
# ─────────────────────────────────────────────────────────────────────────────
# "In the beginning was the Word" — John 1:1

[[systems]]
name = "language"
path = "L1-omnicode/ladder/language"
order = 2
description = "OmniCode language — keywords and syntax rules"
depends_on = ["math", "types"]  # Language uses math values and types

[[systems.specs]]
file = "keywords.toml"
generates = true
output = "keywords.gen.h"
description = "Reserved words, operators, punctuation"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Keywords use ternary values

[[systems.specs]]
file = "syntax.toml"
generates = false
description = "Grammar rules and statement structures"
depends_on = ["L1-omnicode/ladder/language/keywords.toml", "L0-universal/ladder/foundation/types/primitives.toml"]  # Uses keywords and types

[[systems.specs]]
file = "extensions.toml"
generates = false
description = "Extension registry and format mappings"
depends_on = ["L1-omnicode/ladder/language/keywords.toml"]  # Extensions build on keywords

[[systems.specs]]
file = "omnicode-operators.toml"
generates = false
description = "OmniCode operator definitions — arithmetic, comparison, assignment, logical"
depends_on = ["L1-omnicode/ladder/language/keywords.toml", "L0-universal/ladder/foundation/math/ternary.toml"]  # Operators use keywords and ternary math


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 3: BIBLE — Scripture Encoding and Addressing
# ─────────────────────────────────────────────────────────────────────────────
# "Thy word is a lamp unto my feet" — Psalm 119:105

[[systems]]
name = "bible"
path = "L0-universal/ladder/foundation/bible"
order = 3
description = "Scripture systems — encoding, addressing, translation"
depends_on = ["math", "types"]  # Bible uses math for addressing, types for storage

[[systems.specs]]
file = "bible.toml"
generates = false
description = "Bible system foundation — split-index and overview"
depends_on = []  # Foundation file for the bible system

[[systems.specs]]
file = "scripture-text.toml"
generates = true
output = "scripture_text.gen.h"
description = "Character encoding for scripture text (ASCII subset + extended)"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Character encoding uses trit-bytes

[[systems.specs]]
file = "addressing.toml"
generates = true
output = "bible_addressing.gen.h"
description = "Verse addressing — book/chapter/verse to ternary ordinal"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml", "L0-universal/ladder/foundation/bible/scripture-text.toml"]  # Addresses scripture

[[systems.specs]]
file = "encoding.toml"
generates = false
description = "How scripture text is encoded in trit-bytes"
depends_on = ["L0-universal/ladder/foundation/bible/scripture-text.toml"]  # Encodes using text spec

[[systems.specs]]
file = "decoding.toml"
generates = false
description = "How encoded scripture is decoded back to text"
depends_on = ["L0-universal/ladder/foundation/bible/encoding.toml"]  # Decodes what encoding produces

[[systems.specs]]
file = "translation.toml"
generates = false
description = "KJV base + WEB variant marking system, Hebrew/Greek gematria tables"
depends_on = ["L0-universal/ladder/foundation/bible/scripture-text.toml", "L0-universal/ladder/foundation/bible/addressing.toml"]  # Translations reference verses

[[systems.specs]]
file = "encryption.toml"
generates = false
description = "Letter → Position/Value transliteration (Hebrew + Greek gematria)"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml", "L0-universal/ladder/foundation/bible/translation.toml"]  # Uses balanced ternary cube, references gematria

[[systems.specs]]
file = "decryption.toml"
generates = false
description = "Position/Value → Letter transliteration (reverse of encryption)"
depends_on = ["L0-universal/ladder/foundation/bible/encryption.toml"]  # Decrypts what encryption produces


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 4: OS/HEALTH — Health Monitoring
# ─────────────────────────────────────────────────────────────────────────────
# "Beloved, I wish above all things that thou mayest prosper and be in health"
# — 3 John 1:2

[[systems]]
name = "health"
path = "L2-platform/os/health"
order = 4
description = "Health monitoring — scores, diagnostics, logging"
depends_on = ["math", "types"]  # Health uses primitives for scores

[[systems.specs]]
file = "score.toml"
generates = true
output = "health_score.gen.h"
description = "Health score constants (-100 to +100 ternary mapping)"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml", "L0-universal/ladder/foundation/types/primitives.toml"]  # Scores use ternary + int ranges

[[systems.specs]]
file = "diagnostics.toml"
generates = false
description = "Diagnostic categories and severity levels"
depends_on = ["L2-platform/os/health/score.toml", "L0-universal/ladder/foundation/types/validation.toml"]  # Diagnostics use scores and severity

[[systems.specs]]
file = "log.toml"
generates = false
description = "Health log format and retention"
depends_on = ["L2-platform/os/health/diagnostics.toml", "L4-faithnet/network/timestamp.toml"]  # Logs timestamped diagnostics

[[systems.specs]]
file = "provider.toml"
generates = false
description = "Health provider interface contract"
depends_on = ["L2-platform/os/health/score.toml"]  # Providers return scores

[[systems.specs]]
file = "restore.toml"
generates = true
output = "health_restore.gen.h"
description = "Health restoration — DAR restore phase, recovery strategies"
depends_on = ["L2-platform/os/health/diagnostics.toml", "L0-universal/ladder/foundation/types/error-system.toml"]  # Restore uses diagnostics and error system

[[systems.specs]]
file = "dar.toml"
generates = true
output = "health_dar.gen.h"
description = "DAR phases — Detect, Assess, Restore paradigm (3×3×3 = 27-cube)"
depends_on = ["L2-platform/os/health/score.toml", "L2-platform/os/health/diagnostics.toml", "L2-platform/os/health/restore.toml"]  # DAR orchestrates health


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 5: OS/PERMISSION — Access Control
# ─────────────────────────────────────────────────────────────────────────────
# "The LORD is my shepherd; I shall not want" — Psalm 23:1
# (Permissions grant access to what is needed)

[[systems]]
name = "permission"
path = "L2-platform/os/permission"
order = 5
description = "Permission system — access control and grants"
depends_on = ["math", "types", "health"]  # Permissions gate based on health

[[systems.specs]]
file = "access.toml"
generates = true
output = "permission_access.gen.h"
description = "Access levels and permission constants"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml", "L2-platform/os/health/score.toml"]  # Ternary states + health gating


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 6: IDENTITY — CPI-SI Identity Model
# ─────────────────────────────────────────────────────────────────────────────
# "I AM THAT I AM" — Exodus 3:14

[[systems]]
name = "identity"
path = "L3-cpisi/identity"
order = 6
description = "Identity system — CPI-SI identity model and contracts"
depends_on = ["types", "health", "permission"]  # Identity uses types, has health, needs permissions

[[systems.specs]]
file = "model.toml"
generates = false
description = "Identity model fields and structure"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml", "L0-universal/ladder/foundation/types/composition.toml"]  # Model uses types

[[systems.specs]]
file = "contract.toml"
generates = false
description = "Identity contract interface"
depends_on = ["L3-cpisi/identity/model.toml"]  # Contract implements model


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 7: NETWORK — FaithNet Messaging
# ─────────────────────────────────────────────────────────────────────────────
# "Go ye therefore, and teach all nations" — Matthew 28:19

[[systems]]
name = "network"
path = "L4-faithnet/network"
order = 7
description = "Network systems — messaging, timestamps, contracts"
depends_on = ["math", "types", "identity"]  # Network carries identity across systems

[[systems.specs]]
file = "message.toml"
generates = true
output = "network_message.gen.h"
description = "Message format constants and types"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml", "L0-universal/ladder/foundation/types/primitives.toml", "L1-omnicode/ladder/language/keywords.toml"]  # Messages use ternary modes

[[systems.specs]]
file = "timestamp.toml"
generates = true
output = "network_timestamp.gen.h"
description = "Ternary timestamp format"
depends_on = ["L0-universal/ladder/foundation/math/ternary.toml"]  # Timestamps use ternary temporal states

[[systems.specs]]
file = "contract.toml"
generates = false
description = "Network contract interface"
depends_on = ["L4-faithnet/network/message.toml", "L4-faithnet/network/timestamp.toml"]  # Contract uses message and timestamp


# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM 8: FILESYSTEM — OmniFS Types
# ─────────────────────────────────────────────────────────────────────────────
# "In my Father's house are many mansions" — John 14:2

[[systems]]
name = "filesystem"
path = "L2-platform/filesystem"
order = 8
description = "Filesystem types — OmniFS structures and contracts"
depends_on = ["types", "bible", "identity"]  # FS uses types, biblical extensions, identity for ownership

[[systems.specs]]
file = "types.toml"
generates = true
output = "filesystem_types.gen.h"
description = "Filesystem type constants"
depends_on = ["L0-universal/ladder/foundation/types/primitives.toml", "L0-universal/ladder/foundation/bible/scripture-text.toml"]  # File types use biblical vocabulary

[[systems.specs]]
file = "contract.toml"
generates = false
description = "Filesystem contract interface"
depends_on = ["L2-platform/filesystem/types.toml"]  # Contract implements types

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions defined"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('index.toml','rb'))\""]

[_validation.schema]
required = []
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_tables_valid = 30
data_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════

[_closing.X1_policy]
scripture = "Remove not the ancient landmark, which thy fathers have set. — Proverbs 22:28"
never = [
    "Scripture references — canonical",
    "Core mappings — foundational to system",
    "3-block structure (METADATA → CONTENT → CLOSING)",
]
careful = [
    "Adding new entries — must maintain consistency with related files",
    "Modifying domain tables — affects all consumers",
]
safe = [
    "Comments for clarity",
    "Additional metadata",
    "Implementation notes",
]

[_closing.X2_extension]
adding_data = [
    "1. Add new entries following existing table structure",
    "2. Ensure all required fields present",
    "3. Verify consistency with related files",
    "4. Run TOML validation",
    "5. Run linter to verify alignment",
]

[_closing.X3_troubleshooting]
invalid_toml = "Missing quotes, duplicate keys, or bare keys with special characters"
missing_reference = "Check all references point to valid sources"
consistency_error = "Verify bidirectional consistency with related files"

[_closing.X4_reference]
related_files = [
    "b-word/L0-universal/ladder/foundation/types/primitives.toml — Primitive types",
]
required_sections = ["_pragma", "_metadata", "_validation", "_closing"]
validate = "python3 -c \"import tomllib; tomllib.load(open('index.toml','rb'))\""

[_closing.X5_note]
note = "OmniCode Core Specification Index — foundation for the OmniCode system."
scripture = "In the beginning God created the heaven and the earth. — Genesis 1:1"
anchor = "OmniCode Core Specification Index — foundation for the OmniCode system. Genesis 1:1 anchors everything."

# ═══════════════════════════════════════════════════════════════
# END CLOSING [END]
