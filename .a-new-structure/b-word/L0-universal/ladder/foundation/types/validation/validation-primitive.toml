# ───────────────────────────────────────────────────────────────────────────────
# Cc.1g TEXT — UTF-8 Text Validation [TEXT]
# ───────────────────────────────────────────────────────────────────────────────

[primitive.text]
name             = "text"
description      = "Validate UTF-8 text — variable-length character sequence"
source_type      = "primitives.toml [text]"
category         = "text"

# Validation Rule
[primitive.text.rule]
type             = "format"                               # Format/encoding check
encoding         = "utf-8"                                # Required encoding
allow_empty      = true                                   # Empty string is valid
allow_null       = false                                  # Null terminator in content invalid
max_codepoint    = 1114111                                # U+10FFFF (max Unicode)

# Error Definition
[primitive.text.error]
code             = "INVALID_TEXT"
severity         = "error"
message          = "Text must be valid UTF-8"
message_template = "Invalid text at byte {position}: {reason}"

# Additional Text Errors
[primitive.text.error.encoding]
code             = "INVALID_UTF8_ENCODING"
message          = "Invalid UTF-8 byte sequence"

[primitive.text.error.codepoint]
code             = "INVALID_CODEPOINT"
message          = "Codepoint outside valid Unicode range"

[primitive.text.error.surrogate]
code             = "INVALID_SURROGATE"
message          = "Surrogate codepoint (U+D800-DFFF) not allowed in UTF-8"

# OmniCode Syntax
[primitive.text.omnicode]
check            = "is valid text"
declare          = "let value be text"
assert           = "assert {value} as text"
guard            = "guard text {value} else {error}"
literal          = "'{value}'"                            # String literal

# CPI-SI Interpretation
[primitive.text.cpisi]
valid_meaning    = "Text is well-formed — can be processed, displayed, stored"
invalid_meaning  = "Text is malformed — cannot be safely handled"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "content"
weight           = "variable"

# Target Language Implementations
[primitive.text.types]
c_validator      = "bool validate_text(const char* value, size_t len)"
go_validator     = "func ValidateText(v string) bool { return utf8.ValidString(v) }"
rust_validator   = "fn validate_text(v: &str) -> bool { true } // Rust strings are always valid UTF-8"
c_repr           = "const char*"
go_repr          = "string"
rust_repr        = "&str"

# Scale Applications
[primitive.text.scales]
L0_kernel        = { use = "device names",                example = "string validity" }
L1_system        = { use = "path names",                  example = "path encoding" }
L2_runtime       = { use = "string interning",            example = "intern validity" }
L3_framework     = { use = "config strings",              example = "setting values" }
L4_health        = { use = "log messages",                example = "message content" }
L5_network       = { use = "protocol strings",            example = "wire encoding" }
L6_storage       = { use = "file content",                example = "data integrity" }
L7_engine        = { use = "rule text",                   example = "expression text" }
L8_app           = { use = "user content",                example = "input validation" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.1h BOOL3 — Ternary Boolean Validation [BOOL3]
# ───────────────────────────────────────────────────────────────────────────────

[primitive.bool3]
name             = "bool3"
description      = "Validate ternary boolean — three-valued logic (false/unknown/true)"
source_type      = "primitives.toml [bool3]"
category         = "boolean"

# Validation Rule
[primitive.bool3.rule]
type             = "enum"                                 # Enumeration check
valid_values     = [-1, 0, 1]                             # Same as trit values
labels           = ["false", "unknown", "true"]           # Boolean interpretation

# Error Definition
[primitive.bool3.error]
code             = "INVALID_BOOL3"
severity         = "error"
message          = "Boolean must be false (-1), unknown (0), or true (1)"
message_template = "Invalid bool3 value: {value}. Must be false (-1), unknown (0), or true (1)"

# OmniCode Syntax
[primitive.bool3.omnicode]
check            = "is valid bool3"
declare          = "let value be bool3"
assert           = "assert {value} as bool3"
guard            = "guard bool3 {value} else {error}"
literal_false    = "false"
literal_unknown  = "unknown"
literal_true     = "true"

# CPI-SI Interpretation
[primitive.bool3.cpisi]
valid_meaning    = "Boolean in valid state — can participate in logic operations"
invalid_meaning  = "Boolean in invalid state — logic undefined"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "decision"
weight           = "minimal"

# Kleene Logic (three-valued)
[primitive.bool3.logic]
description      = "Kleene strong logic of indeterminacy"
and_table        = { ff = -1, fu = -1, ft = -1, uf = -1, uu = 0, ut = 0, tf = -1, tu = 0, tt = 1 }
or_table         = { ff = -1, fu = 0, ft = 1, uf = 0, uu = 0, ut = 1, tf = 1, tu = 1, tt = 1 }
not_table        = { f = 1, u = 0, t = -1 }

# Target Language Implementations
[primitive.bool3.types]
c_validator      = "bool validate_bool3(int8_t value) { return value >= -1 && value <= 1; }"
go_validator     = "func ValidateBool3(v int8) bool { return v >= -1 && v <= 1 }"
rust_validator   = "fn validate_bool3(v: i8) -> bool { v >= -1 && v <= 1 }"
c_repr           = "int8_t"
go_repr          = "int8"
rust_repr        = "i8"
typedef          = "bool3_t"

# Scale Applications
[primitive.bool3.scales]
L0_kernel        = { use = "flag states",                 example = "flag validity" }
L1_system        = { use = "permission checks",           example = "access decision" }
L2_runtime       = { use = "condition results",           example = "branch condition" }
L3_framework     = { use = "config flags",                example = "toggle state" }
L4_health        = { use = "health flags",                example = "status indicator" }
L5_network       = { use = "connection state",            example = "connected/pending/disconnected" }
L6_storage       = { use = "dirty flags",                 example = "modified state" }
L7_engine        = { use = "rule conditions",             example = "match result" }
L8_app           = { use = "user preferences",            example = "yes/maybe/no" }

