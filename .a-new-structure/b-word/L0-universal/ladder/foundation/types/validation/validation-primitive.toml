# Validation Rule
[primitive.int9.rule]
type             = "range"
min_value        = -9841                                  # -(3^9 - 1) / 2
max_value        = 9841                                   # (3^9 - 1) / 2
total_states     = 19683                                  # 3^9
signed           = true

# Error Definition
[primitive.int9.error]
code             = "INVALID_INT9"
severity         = "error"
message          = "Value must be between -9841 and 9841"
message_template = "Invalid int9 value: {value}. Range is [-9841, 9841] (19683 states)"

# OmniCode Syntax
[primitive.int9.omnicode]
check            = "is valid int9"
declare          = "let value be int9 where -9841 <= value <= 9841"
assert           = "assert {value} as int9"
guard            = "guard int9 {value} else {error}"
literal          = "9s'{value}'"                          # 9-trit signed literal

# CPI-SI Interpretation
[primitive.int9.cpisi]
valid_meaning    = "Value fits runtime counter scale — suitable for loops, indices"
invalid_meaning  = "Value exceeds runtime scale — use int27 for larger values"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "counter"
