# Cc.1 PRIMITIVE — Base Type Validation [PRIMITIVE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "A just weight and balance are the LORD's: all the weights of the bag are
#  his work." — Proverbs 16:11 KJV
#
# VALIDATING THE ATOMS
#
# Primitive validation is the first line of defense. These rules verify that
# values conform to the fundamental types defined in primitives.toml. If a
# value fails primitive validation, it cannot be trusted for any higher purpose.
#
# KEY INSIGHT (from primitives.toml):
#   Primitives have FIXED ranges derived from ternary math:
#   trit   = [-1, 0, 1]           — the three states
#   trit5  = [-121, 121]          — (3^5-1)/2 = 121
#   int9   = [-9841, 9841]        — (3^9-1)/2 = 9841
#   uint9  = [0, 19682]           — 3^9-1 = 19682
#   int27  = [-3812798742493, +]  — (3^27-1)/2
#   uint27 = [0, 7625597484986]   — 3^27-1
#
# VALIDATION PRINCIPLE:
#   Values must fit their declared type. No silent truncation.
#   Out-of-range is ERROR, not warning. Truth at the boundary.
#
# TERNARY ALIGNMENT:
#   Valid    = +1 (passes, can proceed)
#   Unknown  =  0 (cannot determine, needs more info)
#   Invalid  = -1 (fails, must reject)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register bounds, flag validity
#   L1 (System):    Syscall argument validation
#   L2 (Runtime):   Type checking at assignment
#   L3 (Framework): Config value validation
#   L4 (Health):    Health score bounds checking
#   L5 (Network):   Message field validation
#   L6 (Storage):   Record field verification
#   L7 (Engine):    State value validation
#   L8 (App):       User input validation
#
# Reference: L0-universal/foundation/types/primitives.toml
# Reference: L0-universal/foundation/math/ternary.toml
#
# ═══════════════════════════════════════════════════════════════════════════════

[primitive]
description = "Primitive type validation — verifying atoms are well-formed"
principle   = "Just weights (Prov 16:11) — values must fit their declared type"
source      = "L0-universal/foundation/types/primitives.toml"
categories  = ["numeric", "text", "boolean", "special"]

# ───────────────────────────────────────────────────────────────────────────────
# Cc.1a TRIT — Single Trit Validation [TRIT]
# ───────────────────────────────────────────────────────────────────────────────

[primitive.trit]
name             = "trit"
description      = "Validate single trit value — the atomic unit of ternary"
source_type      = "primitives.toml [trit]"
category         = "numeric"

# Validation Rule
[primitive.trit.rule]
type             = "enum"                                 # Enumeration check, not range
valid_values     = [-1, 0, 1]                             # From ternary.toml [trit].values
count            = 3                                      # Exactly 3 valid states

# Error Definition
[primitive.trit.error]
code             = "INVALID_TRIT"
severity         = "error"                                # Fails validation
message          = "Value must be -1, 0, or 1"
message_template = "Invalid trit value: {value}. Must be -1 (negative), 0 (neutral), or 1 (positive)"

# OmniCode Syntax
[primitive.trit.omnicode]
check            = "is valid trit"
declare          = "let value be trit where value in [-1, 0, 1]"
assert           = "assert {value} as trit"
guard            = "guard trit {value} else {error}"

# CPI-SI Interpretation
[primitive.trit.cpisi]
valid_meaning    = "Value is in foundation state — aligned with ternary base"
invalid_meaning  = "Value outside foundation — cannot participate in ternary ops"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[primitive.trit.types]
c_validator      = "bool validate_trit(int8_t value) { return value >= -1 && value <= 1; }"
go_validator     = "func ValidateTrit(v int8) bool { return v >= -1 && v <= 1 }"
rust_validator   = "fn validate_trit(v: i8) -> bool { v >= -1 && v <= 1 }"

# Scale Applications
[primitive.trit.scales]
L0_kernel        = { use = "CPU flag states",             example = "register bit validation" }
L1_system        = { use = "syscall return codes",        example = "-1/0/1 result" }
L2_runtime       = { use = "comparison results",          example = "less/equal/greater" }
L3_framework     = { use = "config toggles",              example = "off/default/on" }
L4_health        = { use = "health indicator",            example = "bad/neutral/good" }
L5_network       = { use = "ack/nak/pending",             example = "protocol response" }
L6_storage       = { use = "dirty/clean/committed",       example = "write state" }
L7_engine        = { use = "state transitions",           example = "-1/0/+1 delta" }
L8_app           = { use = "user choice",                 example = "no/maybe/yes" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.1b TRIT5 — Trit-Byte Validation [TRIT5]
# ───────────────────────────────────────────────────────────────────────────────

[primitive.trit5]
name             = "trit5"
description      = "Validate trit-byte value — 5 trits packed in 1 byte"
source_type      = "primitives.toml [trit5]"
category         = "numeric"

# Validation Rule
[primitive.trit5.rule]
type             = "range"                                # Range check
min_value        = -121                                   # -(3^5 - 1) / 2
max_value        = 121                                    # (3^5 - 1) / 2
total_states     = 243                                    # 3^5
signed           = true

# Error Definition
[primitive.trit5.error]
code             = "INVALID_TRIT5"
severity         = "error"
message          = "Value must be between -121 and 121"
message_template = "Invalid trit5 value: {value}. Range is [-121, 121] (243 states)"

# OmniCode Syntax
[primitive.trit5.omnicode]
check            = "is valid trit5"
declare          = "let value be trit5 where -121 <= value <= 121"
assert           = "assert {value} as trit5"
guard            = "guard trit5 {value} else {error}"

# CPI-SI Interpretation
[primitive.trit5.cpisi]
valid_meaning    = "Value fits in single packed byte — efficient storage"
invalid_meaning  = "Value overflows byte boundary — cannot pack"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[primitive.trit5.types]
c_validator      = "bool validate_trit5(int16_t value) { return value >= -121 && value <= 121; }"
go_validator     = "func ValidateTrit5(v int16) bool { return v >= -121 && v <= 121 }"
rust_validator   = "fn validate_trit5(v: i16) -> bool { v >= -121 && v <= 121 }"

# Scale Applications
[primitive.trit5.scales]
L0_kernel        = { use = "single-byte state",           example = "flag byte validation" }
L1_system        = { use = "compact arguments",           example = "syscall byte args" }
L2_runtime       = { use = "small enum values",           example = "enum < 243 variants" }
L3_framework     = { use = "config codes",                example = "compact settings" }
L4_health        = { use = "health byte",                 example = "single score" }
L5_network       = { use = "header flags",                example = "protocol flags" }
L6_storage       = { use = "type tags",                   example = "record type byte" }
L7_engine        = { use = "state codes",                 example = "machine state" }
L8_app           = { use = "user codes",                  example = "preference byte" }


