# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════════════════════

[_content]
format = "TOML — native tables, UTF-8, LF line endings"
key_convention = "UPPER_SNAKE for flag names, lower_snake for properties"
constraint = "All flags within 6-bit mask (0x3F). Composite strategies combine individual flags."
Cc = "Content Configurations — individual flags (6-bit), composite strategies, flag combinations"
Co = "Content Operations — flag combination rules, mask application"
Cv = "Content Validation — schema requirements, health scoring"

# ───────────────────────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ───────────────────────────────────────────────────────────────────────────────

[flags]
description = "Restore strategy bit flags"
count = 6
max_bit = 5
mask = "0x3F"

# Individual flags
[flags.restore_strategy]
description = "6 restore strategy flags (bits 0-5)"

NONE           = { bit = -1, value = "0x00", description = "No recovery" }
FILL_DEFAULTS  = { bit = 0,  value = "0x01", description = "Fill missing with defaults" }
LOCATE_FILES   = { bit = 1,  value = "0x02", description = "Search for misplaced files" }
CREATE_DIRS    = { bit = 2,  value = "0x04", description = "Create missing directories" }
CLAMP_VALUES   = { bit = 3,  value = "0x08", description = "Clamp out-of-range values" }
FALLBACK       = { bit = 4,  value = "0x10", description = "Use fallback resources" }
DEGRADE        = { bit = 5,  value = "0x20", description = "Graceful degradation" }

# ───────────────────────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ───────────────────────────────────────────────────────────────────────────────

# Composite strategies
[flags.composites]
BASIC = { flags = ["FILL_DEFAULTS", "CLAMP_VALUES"], description = "Minimal safe recovery" }
FULL  = { flags = ["FILL_DEFAULTS", "LOCATE_FILES", "CREATE_DIRS", "CLAMP_VALUES", "FALLBACK", "DEGRADE"], description = "Maximum recovery effort" }

# Operations
[flags.operations]
HAS_FLAG   = { signature = "(flags, flag) -> bool", description = "Test if flag is set" }
SET_FLAG   = { signature = "(flags, flag) -> flags", description = "Set a flag" }
CLEAR_FLAG = { signature = "(flags, flag) -> flags", description = "Clear a flag" }
IS_VALID   = { signature = "(flags) -> bool", description = "Check flags are within mask" }

# ───────────────────────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ───────────────────────────────────────────────────────────────────────────────

[extensions]

[_validation]
commands = "python3 -c \"import tomllib; tomllib.load(open('flags.toml','rb'))\""

[_validation.schema]
required = ["flags", "flags.restore_strategy", "flags.composites", "flags.operations"]

[_validation.health_scoring]
base = 100
deductions = { missing_table = -25, invalid_toml = -100 }

# ═══════════════════════════════════════════════════════════════════════════════
# END CONTENT [END]
