# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Cv PARADIGM INTERPRETATION [PARADIGM]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And God said, Let us make man in our image, after our likeness."
#  — Genesis 1:26 KJV
#
# PARADIGM INTERPRETATION: HOW PRIMITIVES EMBODY CPI-SI
#
# These primitives are not just technical specifications. They embody the
# ternary paradigm that runs through all of CPI-SI. Understanding HOW they
# reflect the paradigm is as important as knowing WHAT they are.
#
# IMAGE AND LIKENESS:
#   God created with intention — every part reflects design purpose.
#   Our type system reflects that same intentional design:
#   - Ternary logic reflects reality better than binary
#   - Balanced representation honors truth
#   - Type safety prevents corruption
#
# PARADIGM CATEGORIES:
#   TYPE SYSTEM:  How primitives reflect ternary principles
#   COMPOSITION:  How primitives combine into complex types
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.1 TYPE_SYSTEM — How Types Embody Ternary [TYPE_SYSTEM]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For as the heavens are higher than the earth, so are my ways higher than
#  your ways, and my thoughts than your thoughts." — Isaiah 55:9 KJV
#
# TYPE SYSTEM: TERNARY FROM FOUNDATION TO APEX
#
# The type system is not arbitrary. Every choice reflects ternary principles:
# - Sizes are powers of 3
# - Boolean has three values
# - Integers balance around zero
#
# This isn't just aesthetic — it's architectural. Ternary types compose more
# naturally, handle uncertainty honestly, and align with the 9-layer system.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1a TERNARY_SIZES — Powers of 3 [TERNARY_SIZES]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.ternary_sizes]
description  = "Type sizes align with powers of 3"
principle    = "3^n sizes create natural boundaries"

# The powers
[paradigm.ternary_sizes.powers]
description  = "Powers of 3 in type sizes"
power_0      = { trits = 1,    value = 3,              name = "trit",    layer = "L0" }
power_1      = { trits = 3,    value = 27,             name = "triplet", layer = "L1" }
power_2      = { trits = 9,    value = 19683,          name = "int9",    layer = "L2" }
power_3      = { trits = 27,   value = 7625597484987,  name = "int27",   layer = "L3" }
power_4      = { trits = 81,   value = "3^81",         name = "extended", layer = "L4" }
power_5      = { trits = 243,  value = "3^243",        name = "block",   layer = "L5" }
power_6      = { trits = 729,  value = "3^729",        name = "page",    layer = "L6" }
power_7      = { trits = 2187, value = "3^2187",       name = "segment", layer = "L7" }
power_8      = { trits = 6561, value = "3^6561",       name = "domain",  layer = "L8" }

# Why powers of 3
[paradigm.ternary_sizes.rationale]
description  = "Why 3^n sizes matter"
composition  = "Types compose naturally — 3 trits = 1 triplet, 9 triplets = 1 block"
addressing   = "Addresses work in powers of 3, matching content"
efficiency   = "Packing is efficient — 5 trits fit in 1 byte (243/256 = 95%)"
alignment    = "Layer N has 3^N trits — type size matches architectural scale"

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1b BALANCED_REPRESENTATION — Center at Zero [BALANCED]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.balanced]
description  = "Balanced ternary centers at zero"
principle    = "No artificial offset — true center"

# The balance
[paradigm.balanced.values]
description  = "How values balance around zero"
trit_balance = { negative = -1, center = 0, positive = 1, symmetric = true }
int9_balance = { negative = -9841, center = 0, positive = 9841, symmetric = true }
int27_balance = { negative = -3812798742493, center = 0, positive = 3812798742493, symmetric = true }

# Why balance matters
[paradigm.balanced.rationale]
description  = "Why balanced representation is superior"
no_sign_bit  = "Sign is inherent in representation — no separate bit needed"
easy_negate  = "Negation is simple — flip all trits (0→0, 1→-1, -1→1)"
true_center  = "Zero is genuinely at the center, not offset"
rounding     = "Nearest-integer rounding is natural — round toward zero"

# Binary comparison
[paradigm.balanced.vs_binary]
description  = "Comparison with binary representation"
binary_unsigned = "0 to 2^n-1 — no negative, zero at edge"
binary_signed   = "-2^(n-1) to 2^(n-1)-1 — asymmetric (one more negative)"
binary_twos_comp = "Negation requires complement + 1, complex"
ternary_balanced = "-(3^n-1)/2 to +(3^n-1)/2 — symmetric, zero at center"

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1c HONEST_LOGIC — Three-Valued Truth [HONEST_LOGIC]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.honest_logic]
description  = "Boolean has three values — honest about uncertainty"
principle    = "Unknown is a valid truth value"

# The three values
[paradigm.honest_logic.values]
description  = "Three truth values"
false        = { value = -1, meaning = "definitely not true" }
unknown      = { value = 0,  meaning = "truth cannot be determined" }
true_val     = { value = 1,  meaning = "definitely true" }

# Kleene logic
[paradigm.honest_logic.kleene]
description  = "Kleene's strong logic of indeterminacy"
and_principle = "AND yields true only if both are true; false if either is false; otherwise unknown"
or_principle  = "OR yields false only if both are false; true if either is true; otherwise unknown"
not_principle = "NOT flips true↔false; unknown stays unknown"

# Why three values
[paradigm.honest_logic.rationale]
description  = "Why three-valued logic is more honest"
reality      = "Real systems have uncertainty — unknown is honest"
database     = "NULL in SQL represents unknown, not false"
sensors      = "Sensor failure is unknown, not false reading"
networks     = "Unreachable host is unknown, not down"
decisions    = "Insufficient data means unknown, not default to false"

# CPI-SI mapping
[paradigm.honest_logic.cpisi_mapping]
description  = "Boolean maps to building block method"
false_maps   = { direction = -1, operation = "break_down", meaning = "stop, reject" }
unknown_maps = { direction = 0,  operation = "anchor",     meaning = "hold, uncertain" }
true_maps    = { direction = 1,  operation = "build_up",   meaning = "proceed, accept" }

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1d VOID_AND_ANY — Type System Boundaries [BOUNDARIES]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.boundaries]
description  = "Void and any mark type system boundaries"
principle    = "Every system has edges — know them explicitly"

# The boundaries
[paradigm.boundaries.void]
description  = "Void: the absence boundary"
meaning      = "No value to return — work is complete, nothing to pass on"
genesis_ref  = "Genesis 1:2 — tohu, formless before creation"
cpisi_role   = "Anchor/halt — recursion terminates"

[paradigm.boundaries.any]
description  = "Any: the dynamic boundary"
meaning      = "Type unknown at compile time — flexibility vs safety tradeoff"
genesis_ref  = "Genesis 2:19 — Adam naming before classification"
cpisi_role   = "Unknown — type indeterminate until runtime"

# Boundary philosophy
[paradigm.boundaries.philosophy]
description  = "Why explicit boundaries matter"
void_lesson  = "Knowing when there's nothing to return prevents null confusion"
any_lesson   = "Knowing when type is dynamic enables proper runtime checks"
design       = "Boundaries are explicit by design — no hidden surprises"


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.2 COMPOSITION — How Primitives Compose [COMPOSITION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And God saw every thing that he had made, and, behold, it was very good."
#  — Genesis 1:31 KJV
#
# COMPOSITION: BUILDING COMPLEX FROM SIMPLE
#
# Primitives are atoms. From atoms, molecules form. From molecules, structures.
# Composition is how simple types combine into complex ones — and the composition
# rules determine what structures are possible.
#
# VERY GOOD:
#   God surveyed creation and saw it was "very good" — complete, coherent,
#   integrated. Good composition creates systems that are more than parts.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2a AGGREGATION — Structs and Tuples [AGGREGATION]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.aggregation]
description  = "Combining primitives into compound types"
principle    = "Aggregation creates meaning by association"

# Struct pattern
[paradigm.composition.aggregation.struct]
description  = "Named fields with heterogeneous types"
pattern      = "struct Person { name: text, age: uint9, active: bool3 }"
meaning      = "Different types combined with named access"
cpisi_role   = "The 'room' — walls holding distinct concepts together"

# Tuple pattern
[paradigm.composition.aggregation.tuple]
description  = "Positional fields, often homogeneous"
pattern      = "(int27, int27, int27) — a 3D coordinate"
meaning      = "Types combined by position"
cpisi_role   = "Minimal structure — just enough to hold together"

# Aggregation at each layer
[paradigm.composition.aggregation.scales]
description  = "Aggregation at each architectural layer"
L0_kernel    = { use = "register pairs",                   example = "status + value" }
L1_system    = { use = "syscall results",                  example = "error + value" }
L2_runtime   = { use = "object fields",                    example = "type + data" }
L3_framework = { use = "config sections",                  example = "database settings" }
L4_health    = { use = "health report",                    example = "scores + timestamp" }
L5_network   = { use = "packet header",                    example = "source + dest + payload" }
L6_storage   = { use = "record layout",                    example = "key + value + metadata" }
L7_engine    = { use = "rule structure",                   example = "condition + action" }
L8_app       = { use = "domain objects",                   example = "User, Order, Product" }

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2b COLLECTION_COMPOSITION — Homogeneous Gathering [COLLECTION_COMP]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.collection]
description  = "Gathering many values of same type"
principle    = "Collection + element type = parameterized type"

# List composition
[paradigm.composition.collection.list]
description  = "Ordered collection of homogeneous elements"
pattern      = "list<int27> — sequence of integers"
constraint   = "All elements must be same type"
genesis_ref  = "Genealogies — ordered lists of names"

# Map composition
[paradigm.composition.collection.map]
description  = "Association of keys to values"
pattern      = "map<text, int27> — name to count"
constraint   = "Keys must be unique and hashable"
genesis_ref  = "Census records — name to count"

# Set composition
[paradigm.composition.collection.set]
description  = "Unique membership collection"
pattern      = "set<text> — unique names"
constraint   = "No duplicates; elements must be hashable"
genesis_ref  = "Tribes — each member distinct"

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2c NESTING — Composition of Compositions [NESTING]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.nesting]
description  = "Types can contain types that contain types"
principle    = "Arbitrary nesting creates rich structures"

# Nesting examples
[paradigm.composition.nesting.examples]
description  = "Examples of nested composition"
list_of_lists = "list<list<int27>> — 2D matrix"
map_of_maps   = "map<text, map<text, int27>> — nested lookup"
struct_with_list = "struct Team { members: list<Person> }"
list_of_structs  = "list<struct Point { x: int27, y: int27 }>"

# Nesting limits
[paradigm.composition.nesting.limits]
description  = "Practical limits on nesting depth"
recommendation = "Avoid more than 3-4 levels of nesting"
reason       = "Deep nesting harms readability and type checking"
alternative  = "Create named intermediate types"

# Nesting at each layer
[paradigm.composition.nesting.scales]
description  = "Nesting at each architectural layer"
L0_kernel    = { use = "minimal (1-2 levels)",             example = "array of structs" }
L1_system    = { use = "shallow (2-3 levels)",             example = "process tree" }
L2_runtime   = { use = "moderate (2-4 levels)",            example = "object graph" }
L3_framework = { use = "structured (3-4 levels)",          example = "config hierarchy" }
L4_health    = { use = "moderate (2-3 levels)",            example = "nested metrics" }
L5_network   = { use = "protocol-defined",                 example = "nested messages" }
L6_storage   = { use = "schema-defined",                   example = "document nesting" }
L7_engine    = { use = "rule complexity",                  example = "nested conditions" }
L8_app       = { use = "domain complexity",                example = "deep object graph" }

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2d TYPE_CONSTRUCTORS — Building New Types [CONSTRUCTORS]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.constructors]
description  = "Mechanisms for constructing new types from existing ones"
principle    = "Type constructors are functions from types to types"

# Constructor patterns
[paradigm.composition.constructors.patterns]
description  = "Type constructor patterns"
generic      = { pattern = "T",           meaning = "type parameter" }
nullable     = { pattern = "T?",          meaning = "T or null" }
array        = { pattern = "T[n]",        meaning = "fixed-size array of T" }
slice        = { pattern = "T[]",         meaning = "variable-size slice of T" }
pointer      = { pattern = "&T",          meaning = "reference to T" }
function     = { pattern = "(A) → B",     meaning = "function from A to B" }

# Type constructor algebra
[paradigm.composition.constructors.algebra]
description  = "How constructors compose"
list_of_nullable = "list<T?> — list where elements can be null"
nullable_list    = "list<T>? — the whole list can be null"
func_returning_nullable = "(A) → B? — function that may return null"
difference   = "Position of ? matters — type algebra is precise"

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for type paradigm"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "python3 -c \"import tomllib; tomllib.load(open('primitives-paradigm.toml','rb'))\"",
]

[_validation.schema]
required = ["paradigm"]
optional = ["paradigm.type_system", "paradigm.composition", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

