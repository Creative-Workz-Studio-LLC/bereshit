generation = { file = "primitives-generation.toml", sections = "Cx.1-4" }

# ─────────────────────────────────────────────────────────────
# THE 23 PRIMITIVE TYPES
# ─────────────────────────────────────────────────────────────
#
# TERNARY FOUNDATION (2 types):
#   trit    — Single balanced ternary digit: {-1, 0, +1}
#   trit5   — 5 trits packed in 1 byte (byte bridge)
#
# INTEGERS (8 types):
#   int9, uint9     — 9-trit  (L2 scale)
#   int27, uint27   — 27-trit (L3 scale, the Word)
#   int81, uint81   — 81-trit (L4 scale, extended)
#   int243, uint243 — 243-trit (L5 scale, block)
#
# FLOATING POINT (1 type):
#   float27 — 27-trit IEEE-style float
#
# TEXT (2 types):
#   text — UTF-8 string (variable length)
#   char — Single Unicode codepoint
#
# BOOLEAN (1 type):
#   bool3 — Three-valued: false(-1), unknown(0), true(+1)
#
# COLLECTIONS (3 types):
#   list — Ordered, indexed, homogeneous
#   map  — Key-value pairs
#   set  — Unique, unordered
#
# SPECIAL (2 types):
#   void — Absence of value (nothing returns)
#   any  — Universal supertype (anything accepted)
#
# EXTENDED (2 types):
#   decimal27 — Fixed-point decimal (uses int27 storage)
#   timestamp — Ternary time (uses int81 storage)
#
# TEMPORAL (1 type):
#   duration — Time span (uses int81 storage)
#
# WHY 23: 23 types across 10 families. Not arbitrary — each justified by
# ternary math, CPI-SI paradigm, or practical necessity. No more, no fewer.
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

