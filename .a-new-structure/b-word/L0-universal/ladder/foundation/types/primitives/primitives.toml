# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Index file — references split content files. No primitive data defined here."
Cc = "Content Configurations — Index for split primitive type specification — 23 atomic building block types"
Co = "Content Operations — primitives index, split documentation"
Cv = "Content Validation — schema requirements, type constraints"

# ─────────────────────────────────────────────────────────────
# SPLIT FILE OVERVIEW
# ─────────────────────────────────────────────────────────────
#
# Primitive type definitions for the OmniCode type system.
# Structure: Cc (Type Definitions) → Co (Operations) → Cv (Cognition) → Cx (Generation)
#
# STANDARDIZED Cc ORGANIZATION (4-Section):
#   Cc.1 IDENTITY   — What primitives ARE (type catalog, distinctions, purpose)
#   Cc.2 SETTINGS   — Primary configuration (defaults, sizes, parameters)
#   Cc.3 RESOURCES  — WHERE + HOW MUCH (storage, packing, layer assignments)
#   Cc.4 BEHAVIOR   — HOW types operate (OmniCode syntax, CPI-SI mappings, bindings)
#
# Co/Cv/Cx ORGANIZATION:
#   Co.1 CONVERSION — Type-to-type transformation rules
#   Co.2 VALIDATION — Type constraint verification
#   Co.3 COERCION   — Implicit type promotion rules
#   Cv.1 TYPE_SYSTEM  — Ternary principles embodied in types
#   Cv.2 COMPOSITION  — How primitives compose into complex types
#   Cx.1 GENERATE   — Generation control metadata
#   Cx.2 TARGETS    — Language-specific generation
#   Cx.3 TEMPLATES  — Code generation templates
#   Cx.4 VALIDATION — Generation validation
#
# ─────────────────────────────────────────────────────────────

[index]
type = "split_index"
total_files = 7
total_sections = 11
original_lines = 4083

[index.key_constants]
total_types = 23
type_families = 10
ternary_foundation = "trit, trit5"
power_sizes = "9, 27, 81, 243 trits (3^2, 3^3, 3^4, 3^5)"

[index.files]
