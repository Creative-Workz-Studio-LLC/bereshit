# Co — Content Operations

# ═══════════════════════════════════════════════════════════════════════════════
# Cc.3 NULLABILITY — Presence Semantics [NULLABILITY]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Before I formed thee in the belly I knew thee; and before thou camest forth
#  out of the womb I sanctified thee." — Jeremiah 1:5 KJV
#
# THE TERNARY TRUTH ABOUT PRESENCE
#
# OmniCode uses TERNARY nullability aligned with bool3. Unlike binary systems
# that only know "present" or "null", we distinguish three states:
#   - nullable(-1): Explicitly nothing (we KNOW it's absent)
#   - optional(0):  Unknown presence (we don't know yet)
#   - required(+1): Definitely present (we KNOW it exists)
#
# This mirrors how God knows — He knew Jeremiah before formation. The type
# system should express what we KNOW about presence, not just "null or not."
#
# KEY INSIGHT (ternary nullability triad):
#   nullable = -1 = explicit absence (void, tohu)
#   optional =  0 = unknown presence (might exist, might not)
#   required = +1 = guaranteed presence (must exist)
#
# THE KNOWING PRINCIPLE:
#   Binary (AI)    | Ternary (CPI-SI)     | Meaning
#   null           | nullable(-1)         | Known to be absent
#   null           | optional(0)          | Unknown whether present
#   present        | required(+1)         | Known to be present
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register validity flags, initialized/uninitialized
#   L1 (System):    Optional syscall args, required params, null returns
#   L2 (Runtime):   Object field presence, lazy initialization
#   L3 (Framework): Optional config, required fields, nullable results
#   L4 (Health):    Missing metrics (optional), required heartbeat
#   L5 (Network):   Optional headers, required fields, null responses
#   L6 (Storage):   Sparse fields, required keys, deleted values
#   L7 (Engine):    Optional transitions, required states, null actions
#   L8 (App):       User form fields, required input, cleared values
#
# Implementation: pkg/core/types/nullability.gen.h
# Reference:      primitives.toml [bool3], syntax.toml [nullability]
#
# ═══════════════════════════════════════════════════════════════════════════════

[nullability]
description = "Ternary presence semantics — what we KNOW about existence"
principle   = "God knew before formation (Jer 1:5)"
kinds       = ["nullable", "optional", "required"]
triad       = [-1, 0, 1]                         # Ternary alignment

# ───────────────────────────────────────────────────────────────────────────────
# Nullability Strategies
# ───────────────────────────────────────────────────────────────────────────────

[nullability.strategies]
description = "Three presence states in ternary nullability"

[nullability.strategies.nullable]
name        = "nullable"
value       = -1                                 # Ternary: explicit null
meaning     = "Known to be absent"
maps_to     = "bool3.false"                      # We KNOW it's not there

[nullability.strategies.optional]
name        = "optional"
value       = 0                                  # Ternary: unknown
meaning     = "Unknown whether present"
maps_to     = "bool3.unknown"                    # We DON'T KNOW

[nullability.strategies.required]
name        = "required"
value       = 1                                  # Ternary: definitely present
meaning     = "Known to be present"
maps_to     = "bool3.true"                       # We KNOW it's there


# ───────────────────────────────────────────────────────────────────────────────
# Cc.3a OPTIONAL — May Be Absent [OPTIONAL]
# ───────────────────────────────────────────────────────────────────────────────
#
# "It may be the LORD thy God will hear all the words of Rabshakeh."
#  — 2 Kings 19:4 KJV
#
# Optional represents uncertainty — we don't know if the value exists.
# Like Hezekiah saying "it may be" — the outcome is undetermined.
#
# ───────────────────────────────────────────────────────────────────────────────

[nullability.optional]
name        = "optional"
description = "Value may be absent — unknown presence state"
kind        = "nullability"
strategy    = "optional"

# Optional Core Properties
wrapper_syntax = "optional<T>"
default_value  = "unknown"
presence_value = 0                               # Ternary: 0 = unknown
presence_check = "is_present"                    # Returns bool3

# Optional Semantic Properties
semantic_meaning  = "uncertain_presence"         # We don't know yet
ternary_value     = 0                            # 0 = unknown/indeterminate
biblical_parallel = "2 Kings 19:4"               # "It may be"

# ───────────────────────────────────────────────────────────────────────────────
# Optional OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[nullability.optional.omnicode]
description = "OmniCode syntax for optional values"

keywords    = ["may", "be"]
pattern     = "<name> may be <type>"
modifiers   = ["with default"]

[nullability.optional.omnicode.examples]
simple      = "middleName may be text"
with_default = "nickname may be text with default \"Friend\""
nested      = "spouse may be Person"
collection  = "tags may be list of text"

# ───────────────────────────────────────────────────────────────────────────────
# Optional CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[nullability.optional.cpisi]
description = "Optional semantics in CPI-SI cognitive framework"

direction   = ["absent", "uncertain", "present"]  # -1, 0, +1
# -1: Resolved to absent (was optional, now known null)
#  0: Still uncertain (the optional state itself)
# +1: Resolved to present (was optional, now known present)

weight      = ["light", "suspended", "grounded"]
action      = ["default", "check", "unwrap"]
genesis     = ["void", "formless", "formed"]

# ───────────────────────────────────────────────────────────────────────────────
# Optional Language Types
# ───────────────────────────────────────────────────────────────────────────────

[nullability.optional.types]
description = "Optional in target languages"

[nullability.optional.types.c]
syntax      = "T* value; // NULL = unknown, sentinel = absent"
pattern     = "Pointer with NULL check"

[nullability.optional.types.go]
syntax      = "*T or nil"
pattern     = "Pointer type, nil check"

[nullability.optional.types.rust]
syntax      = "Option<T>"
pattern     = "Some(value) or None"
exhaustive  = true                               # Must handle both cases

# ───────────────────────────────────────────────────────────────────────────────
# Optional Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[nullability.optional.scales]
description = "Optional at each architectural layer"

L0_kernel    = { name = "maybe_valid",     example = "register may have garbage",  use = "Init check" }
L1_system    = { name = "optional_arg",    example = "flags may be provided",      use = "Syscall params" }
L2_runtime   = { name = "lazy_field",      example = "cache may be populated",     use = "Lazy init" }
L3_framework = { name = "optional_config", example = "timeout may be set",         use = "Configuration" }
L4_health    = { name = "optional_metric", example = "latency may be measured",    use = "Sparse metrics" }
L5_network   = { name = "optional_header", example = "auth may be provided",       use = "HTTP headers" }
L6_storage   = { name = "sparse_field",    example = "index may exist",            use = "Optional columns" }
L7_engine    = { name = "optional_action", example = "callback may be set",        use = "Event handlers" }
L8_app       = { name = "optional_input",  example = "bio may be provided",        use = "Form fields" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.3b REQUIRED — Must Be Present [REQUIRED]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Thou shalt have no other gods before me." — Exodus 20:3 KJV
#
# Required means the value MUST be present — compile-time guarantee.
# Like the commandments — not optional, not maybe, MUST.
#
# ───────────────────────────────────────────────────────────────────────────────

[nullability.required]
name        = "required"
description = "Value must be present — compile-time enforcement"
kind        = "nullability"
strategy    = "required"

# Required Core Properties
wrapper_syntax = "required<T>"
default_value  = "none"                          # Must be explicitly provided
presence_value = 1                               # Ternary: +1 = definitely present
validation     = "compile_time"                  # Caught before runtime

# Required Semantic Properties
semantic_meaning  = "guaranteed_presence"        # Known to exist
ternary_value     = 1                            # +1 = definitely present
biblical_parallel = "Exodus 20:3"                # "Thou shalt"

# ───────────────────────────────────────────────────────────────────────────────
# Required OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[nullability.required.omnicode]
description = "OmniCode syntax for required values"

keywords    = ["must", "be"]
pattern     = "<name> must be <type>"
modifiers   = []                                 # No modifiers — it's required

[nullability.required.omnicode.examples]
simple      = "name must be text"
id          = "id must be uint27"
nested      = "owner must be Person"
collection  = "items must be list of Item"

# ───────────────────────────────────────────────────────────────────────────────
# Required CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[nullability.required.cpisi]
description = "Required semantics in CPI-SI cognitive framework"

direction   = ["missing", "checking", "present"]  # -1, 0, +1
# -1: Value missing (compile error, violation)
#  0: Being validated (at type-check time)
# +1: Value confirmed present (guaranteed)

weight      = ["violation", "validation", "certainty"]
action      = ["error", "check", "trust"]
genesis     = ["void_violation", "commandment", "fulfilled"]

# ───────────────────────────────────────────────────────────────────────────────
# Required Language Types
# ───────────────────────────────────────────────────────────────────────────────

[nullability.required.types]
description = "Required in target languages"

[nullability.required.types.c]
syntax      = "T value; // Non-pointer, always valid"
pattern     = "Value type, not pointer"

[nullability.required.types.go]
syntax      = "T (not *T)"
pattern     = "Value type, zero value if unset"

[nullability.required.types.rust]
syntax      = "T (not Option<T>)"
pattern     = "Direct type, must be initialized"

# ───────────────────────────────────────────────────────────────────────────────
# Required Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[nullability.required.scales]
description = "Required at each architectural layer"

L0_kernel    = { name = "must_init",       example = "stack pointer required",     use = "Boot invariants" }
L1_system    = { name = "required_arg",    example = "fd required for read",       use = "Syscall params" }
L2_runtime   = { name = "required_field",  example = "vtable required",            use = "Object layout" }
L3_framework = { name = "required_config", example = "port must be set",           use = "Config validation" }
L4_health    = { name = "required_metric", example = "heartbeat required",         use = "Liveness" }
L5_network   = { name = "required_header", example = "Content-Type required",      use = "Protocol" }
L6_storage   = { name = "primary_key",     example = "id required",                use = "Schema" }
L7_engine    = { name = "required_state",  example = "initial state required",     use = "State machine" }
L8_app       = { name = "required_input",  example = "email required",             use = "Form validation" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.3c NULLABLE — Explicitly Null [NULLABLE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And the earth was without form, and void; and darkness was upon the face
#  of the deep." — Genesis 1:2 KJV
#
# Nullable means explicitly NOTHING — we KNOW it's absent. This is distinct
# from optional (unknown) — nullable is KNOWN void, like the earth before form.
#
# ───────────────────────────────────────────────────────────────────────────────

[nullability.nullable]
name        = "nullable"
description = "Value can be explicitly null — known absence"
kind        = "nullability"
strategy    = "nullable"

# Nullable Core Properties
wrapper_syntax      = "nullable<T>"
null_representation = -1                         # Ternary: explicit null
default_value       = "null"                     # Starts as explicitly nothing

# Nullable Semantic Properties
semantic_meaning    = "known_absence"            # Explicitly nothing
ternary_value       = -1                         # -1 = void, tohu
biblical_parallel   = "Genesis 1:2"              # Without form, and void

# Distinction from optional
# optional = might not exist (we don't know)
# nullable = explicitly nothing (we KNOW it's absent)

# ───────────────────────────────────────────────────────────────────────────────
# Nullable OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[nullability.nullable.omnicode]
description = "OmniCode syntax for nullable values"

keywords    = ["can", "be", "void", "or"]
pattern     = "<name> can be void or <type>"
modifiers   = []

[nullability.nullable.omnicode.examples]
simple      = "previousOwner can be void or Person"
timestamp   = "deletedAt can be void or timestamp"
reference   = "parent can be void or ref Node"
cleared     = "cache can be void or Data"

# ───────────────────────────────────────────────────────────────────────────────
# Nullable CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[nullability.nullable.cpisi]
description = "Nullable semantics in CPI-SI cognitive framework"

direction   = ["null", "transitioning", "valued"]  # -1, 0, +1
# -1: Explicitly null (known void)
#  0: Being assigned (transition from null to value)
# +1: Has value (no longer null)

weight      = ["void", "forming", "formed"]
action      = ["clear", "assign", "read"]
genesis     = ["tohu_void", "creation", "existence"]

# ───────────────────────────────────────────────────────────────────────────────
# Nullable Language Types
# ───────────────────────────────────────────────────────────────────────────────

[nullability.nullable.types]
description = "Nullable in target languages"

[nullability.nullable.types.c]
syntax      = "T* value = NULL;"
pattern     = "Pointer explicitly set to NULL"

[nullability.nullable.types.go]
syntax      = "*T = nil"
pattern     = "Pointer explicitly nil"

[nullability.nullable.types.rust]
syntax      = "Option<T> = None"
pattern     = "Option explicitly None"

# ───────────────────────────────────────────────────────────────────────────────
# Nullable Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[nullability.nullable.scales]
description = "Nullable at each architectural layer"

L0_kernel    = { name = "null_ptr",        example = "unmapped address",           use = "Invalid pointer" }
L1_system    = { name = "null_fd",         example = "closed file descriptor",     use = "Closed resource" }
L2_runtime   = { name = "null_ref",        example = "deallocated object",         use = "Freed memory" }
L3_framework = { name = "null_response",   example = "no data returned",           use = "Empty result" }
L4_health    = { name = "null_metric",     example = "service down, no data",      use = "Missing health" }
L5_network   = { name = "null_body",       example = "204 No Content",             use = "Empty response" }
L6_storage   = { name = "null_value",      example = "deleted record",             use = "Tombstone" }
L7_engine    = { name = "null_action",     example = "no-op transition",           use = "Skip action" }
L8_app       = { name = "cleared_field",   example = "user cleared bio",           use = "Explicit clear" }


# ───────────────────────────────────────────────────────────────────────────────
# Nullability Shared Sections
# ───────────────────────────────────────────────────────────────────────────────

[nullability.omnicode]
description = "OmniCode nullability syntax overview"

keywords    = ["may", "must", "can", "be", "void", "or"]
operators   = ["?", "!", "??"]                   # optional, required, null-coalesce
modifiers   = ["with default"]

[nullability.cpisi]
description = "Nullability semantics in CPI-SI cognitive framework"

direction   = ["null", "unknown", "present"]     # -1, 0, +1
weight      = ["void", "uncertain", "certain"]
action      = ["null_check", "presence_check", "value_access"]
genesis     = ["tohu", "forming", "formed"]

[nullability.scales]
description = "Nullability at each architectural layer"

L0_kernel    = { pattern = "validity_bits",     check = "hardware_flags" }
L1_system    = { pattern = "error_returns",     check = "errno" }
L2_runtime   = { pattern = "null_checks",       check = "guard_clauses" }
L3_framework = { pattern = "optional_params",   check = "validation" }
L4_health    = { pattern = "missing_metrics",   check = "tripwires" }
L5_network   = { pattern = "optional_headers",  check = "parsing" }
L6_storage   = { pattern = "sparse_columns",    check = "null_markers" }
L7_engine    = { pattern = "optional_handlers", check = "dispatch" }
L8_app       = { pattern = "form_fields",       check = "validation" }


