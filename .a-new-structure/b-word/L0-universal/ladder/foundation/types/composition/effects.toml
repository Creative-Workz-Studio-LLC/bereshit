ternary_value          = 1                                       # Expansive — reaches outward
biblical_parallel      = "Genesis 1:3"
biblical_text          = "And God said, Let there be light: and there was light"

[effect_io.properties]
referentially_transparent = false
idempotent               = false
cacheable                = false
parallelizable           = "with care"
testable                 = "requires mocking"

[effect_io.omnicode]
keywords    = ["io", "world", "external", "effect"]
pattern     = "io func <name>(<params>) -> <return>"
modifiers   = ["read", "write", "readwrite"]
examples    = [
    "io func readFile(path: String) -> Bytes",
    "io func print(msg: String) -> Void",
]

[effect_io.cpisi]
direction   = ["reach_out", "hold", "receive"]
