L1_system    = { name = "SyscallIO",         example = "read, write, open",             use = "System calls" }
L2_runtime   = { name = "FileIO",            example = "file read/write",               use = "File operations" }
L3_framework = { name = "HttpIO",            example = "HTTP request/response",         use = "Network requests" }
L4_health    = { name = "DeviceIO",          example = "sensor read",                   use = "Medical device IO" }
L5_network   = { name = "SocketIO",          example = "socket read/write",             use = "Network socket IO" }
L6_storage   = { name = "DatabaseIO",        example = "query execute",                 use = "Database operations" }
L7_engine    = { name = "RenderIO",          example = "GPU draw calls",                use = "Graphics rendering" }
L8_app       = { name = "UserIO",            example = "input/output events",           use = "User interaction" }


