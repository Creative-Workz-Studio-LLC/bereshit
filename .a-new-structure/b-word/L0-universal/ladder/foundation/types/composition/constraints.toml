# Co — Content Operations

# ═══════════════════════════════════════════════════════════════════════════════
# Cc.2 CONSTRAINTS — Type Narrowing Rules [CONSTRAINTS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Thou shalt not remove thy neighbour's landmark, which they of old time have
#  set in thine inheritance." — Deuteronomy 19:14 KJV
#
# THE BOUNDARIES OF VALID VALUES
#
# Constraints narrow types to express truth more precisely. Like the landmarks
# that mark property boundaries, constraints mark the boundaries of valid values.
# What is within the constraint is valid; what is outside is rejected.
#
# KEY INSIGHT (from building block method):
#   Types without constraints = overly broad (could be anything)
#   Types with constraints = precisely scoped (exactly what's valid)
#   Good constraint design makes invalid states UNREPRESENTABLE
#
# FOUR CONSTRAINT STRATEGIES:
#   Range:   Numeric boundaries (min/max)
#   Pattern: String structure (regex, format)
#   Enum:    Finite set of valid values
#   Length:  Collection/string size limits
#
# THE LANDMARK PRINCIPLE:
#   Unconstrained | Constraint    | Constrained
#   Wild territory| Landmarks set | Valid territory
#   Anything goes | Boundaries    | Truth enforced
#
# TERNARY ALIGNMENT:
#   range  = +1 (expansion within bounds, growth permitted)
#   enum   =  0 (fixed set, neither expanding nor contracting)
#   length = -1 (restriction, limiting size)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register bounds, interrupt vectors, flag masks
#   L1 (System):    File descriptors (0-1023), signal numbers, errno ranges
#   L2 (Runtime):   Array indices, stack depth, heap size limits
#   L3 (Framework): API versions, config values, valid states
#   L4 (Health):    Score ranges (-100 to +100), percentage (0-100)
#   L5 (Network):   Port numbers (0-65535), packet sizes, TTL
#   L6 (Storage):   Block sizes, path lengths, filename patterns
#   L7 (Engine):    State identifiers, transition counts, queue depths
#   L8 (App):       Age limits, price ranges, rating values
#
# Implementation: pkg/core/types/constraint.gen.h
# Reference:      primitives.toml [integer ranges], syntax.toml [constraint]
#
# ═══════════════════════════════════════════════════════════════════════════════

[constraint]
description = "Type constraints — boundaries that enforce truth"
principle   = "Landmarks mark valid territory (Deut 19:14)"
kinds       = ["range", "pattern", "enum", "length"]

# ───────────────────────────────────────────────────────────────────────────────
# Constraint Strategies
# ───────────────────────────────────────────────────────────────────────────────

[constraint.strategies]
description = "Four fundamental constraint approaches"

[constraint.strategies.range]
name        = "range"
description = "Numeric boundaries — min and max values"
applies_to  = ["numeric types"]
validation  = "compile_time"                     # Catch violations early

[constraint.strategies.pattern]
name        = "pattern"
description = "String structure — regex or named format"
applies_to  = ["text"]
validation  = "runtime"                          # Pattern matching at runtime

[constraint.strategies.enum]
name        = "enum"
description = "Finite set — value must be one of listed options"
applies_to  = ["text", "numeric types"]
validation  = "compile_time"                     # Exhaustive checking

[constraint.strategies.length]
name        = "length"
description = "Size limits — collection or string length bounds"
applies_to  = ["text", "list", "set", "bytes"]
validation  = "mixed"                            # Some compile-time, some runtime


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2a RANGE — Numeric Range Constraint [RANGE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And the LORD said unto Moses, Is the LORD's hand waxed short? thou shalt see
#  now whether my word shall come to pass unto thee or not." — Numbers 11:23 KJV
#
# Range constraints set the min and max — the boundaries within which values
# can exist. Like measuring a cubit or a span, ranges define exact limits.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.range]
name        = "range"
description = "Numeric range constraint — min and max boundaries"
kind        = "constraint"
strategy    = "range"

# Range Core Properties
applies_to        = ["int9", "uint9", "int27", "uint27", "int81", "uint81",
                     "int243", "uint243", "float27", "decimal27", "trit", "trit5"]
properties        = ["min", "max", "exclusive_min", "exclusive_max"]
default_inclusive = true                         # Bounds included by default

# Range Semantic Properties
semantic_meaning  = "bounded_territory"          # Valid within limits
ternary_value     = 1                            # +1 = expansion within bounds
biblical_parallel = "Numbers 11:23"              # Is the LORD's hand waxed short?

# ───────────────────────────────────────────────────────────────────────────────
# Range OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[constraint.range.omnicode]
description = "OmniCode syntax for range constraints"

keywords    = ["from", "to", "between", "within"]
pattern     = "<name> as <type> from <min> to <max>"
modifiers   = ["exclusive", "inclusive"]

[constraint.range.omnicode.examples]
simple      = "age as int27 from 0 to 120"
health      = "score as int9 from -100 to 100"
exclusive   = "temp as float27 from 0 exclusive to 100"
percentage  = "percent as uint9 from 0 to 100"

# ───────────────────────────────────────────────────────────────────────────────
# Range CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[constraint.range.cpisi]
description = "Range semantics in CPI-SI cognitive framework"

direction   = ["below_min", "within_range", "above_max"]  # -1, 0, +1
# -1: Value below minimum (violation, rejection)
#  0: Value within range (valid, acceptance)
# +1: Value above maximum (violation, rejection)

weight      = ["rejected", "valid", "rejected"]
action      = ["clamp_up", "pass", "clamp_down"]
genesis     = ["too_small", "just_right", "too_large"]

# ───────────────────────────────────────────────────────────────────────────────
# Range Language Types
# ───────────────────────────────────────────────────────────────────────────────

[constraint.range.types]
description = "Range constraint in target languages"

[constraint.range.types.c]
syntax      = "assert(value >= min && value <= max)"
macro       = "#define IN_RANGE(v, min, max) ((v) >= (min) && (v) <= (max))"

[constraint.range.types.go]
syntax      = "if value < min || value > max { return error }"
validator   = "type RangedInt struct { Value, Min, Max int }"

[constraint.range.types.rust]
syntax      = "assert!(value >= min && value <= max)"
newtype     = "struct BoundedInt<const MIN: i32, const MAX: i32>(i32)"

# ───────────────────────────────────────────────────────────────────────────────
# Range Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[constraint.range.scales]
description = "Range constraint at each architectural layer"

L0_kernel    = { name = "register_bits",   example = "bit 0-31",              use = "Register addressing" }
L1_system    = { name = "fd_range",        example = "0-1023",                use = "File descriptors" }
L2_runtime   = { name = "index_bounds",    example = "0 to len-1",            use = "Array indexing" }
L3_framework = { name = "version_range",   example = "1.0 to 2.0",            use = "API compatibility" }
L4_health    = { name = "score_range",     example = "-100 to +100",          use = "Health scoring" }
L5_network   = { name = "port_range",      example = "0-65535",               use = "Port numbers" }
L6_storage   = { name = "block_range",     example = "0 to max_blocks",       use = "Block addressing" }
L7_engine    = { name = "state_id_range",  example = "0 to max_states",       use = "State identifiers" }
L8_app       = { name = "age_range",       example = "0 to 150",              use = "Human age" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2b PATTERN — String Pattern Constraint [PATTERN]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Look that thou make them after their pattern, which was shewed thee in the
#  mount." — Exodus 25:40 KJV
#
# Pattern constraints define the structure a string must follow — like the
# pattern God showed Moses for the tabernacle. The value must conform to shape.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.pattern]
name        = "pattern"
description = "String pattern constraint — regex or named format"
kind        = "constraint"
strategy    = "pattern"

# Pattern Core Properties
applies_to     = ["text"]
properties     = ["regex", "format"]
common_formats = ["email", "uuid", "uri", "date", "time", "datetime",
                  "phone", "zip", "ip_address", "mac_address"]

# Pattern Semantic Properties
semantic_meaning  = "structural_conformity"      # Must match shape
ternary_value     = 0                            # 0 = neutral, structure-based
biblical_parallel = "Exodus 25:40"               # Make after the pattern

# ───────────────────────────────────────────────────────────────────────────────
# Pattern OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[constraint.pattern.omnicode]
description = "OmniCode syntax for pattern constraints"

keywords    = ["according", "to", "pattern", "of", "matching"]
pattern     = "<name> as text according to pattern of <format>"
modifiers   = ["case_insensitive", "multiline"]

[constraint.pattern.omnicode.examples]
email       = "address as text according to pattern of email"
custom      = "code as text according to pattern of \"[A-Z]{3}-[0-9]{4}\""
uuid        = "id as text according to pattern of uuid"
date        = "birthday as text according to pattern of date"

# ───────────────────────────────────────────────────────────────────────────────
# Pattern CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[constraint.pattern.cpisi]
description = "Pattern semantics in CPI-SI cognitive framework"

direction   = ["malformed", "conforming", "exceeding"]  # -1, 0, +1
# -1: String doesn't match pattern (rejection)
#  0: String matches pattern (acceptance)
# +1: String exceeds pattern requirements (bonus validation passed)

weight      = ["invalid_shape", "valid_shape", "enhanced_shape"]
action      = ["reject", "accept", "celebrate"]
genesis     = ["formless", "patterned", "perfect"]

# ───────────────────────────────────────────────────────────────────────────────
# Pattern Language Types
# ───────────────────────────────────────────────────────────────────────────────

[constraint.pattern.types]
description = "Pattern constraint in target languages"

[constraint.pattern.types.c]
syntax      = "regex_match(pattern, value)"
library     = "regex.h or PCRE"

[constraint.pattern.types.go]
syntax      = "regexp.MustCompile(pattern).MatchString(value)"
import      = "regexp"

[constraint.pattern.types.rust]
syntax      = "Regex::new(pattern).unwrap().is_match(value)"
crate       = "regex"

# ───────────────────────────────────────────────────────────────────────────────
# Pattern Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[constraint.pattern.scales]
description = "Pattern constraint at each architectural layer"

L0_kernel    = { name = "opcode_pattern",   example = "bit field patterns",    use = "Instruction decode" }
L1_system    = { name = "path_pattern",     example = "/dev/* pattern",        use = "Device paths" }
L2_runtime   = { name = "symbol_pattern",   example = "[A-Za-z_][A-Za-z0-9_]*", use = "Identifiers" }
L3_framework = { name = "route_pattern",    example = "/api/v1/:id",           use = "URL routing" }
L4_health    = { name = "log_pattern",      example = "timestamp format",      use = "Log parsing" }
L5_network   = { name = "protocol_pattern", example = "HTTP/1.1",              use = "Protocol version" }
L6_storage   = { name = "filename_pattern", example = "*.txt, *.log",          use = "Glob matching" }
L7_engine    = { name = "rule_pattern",     example = "trigger conditions",    use = "Rule matching" }
L8_app       = { name = "email_pattern",    example = "RFC 5322 email",        use = "User input" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2c ENUM — Enumeration Constraint [ENUM]
# ───────────────────────────────────────────────────────────────────────────────
#
# "I call heaven and earth to record this day against you, that I have set
#  before you life and death, blessing and cursing: therefore choose life."
#  — Deuteronomy 30:19 KJV
#
# Enum constraints define a finite set of valid values — choose from these and
# only these. Like the choice between life and death, the options are fixed.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.enum]
name        = "enum"
description = "Enumeration constraint — finite set of valid values"
kind        = "constraint"
strategy    = "enum"

# Enum Core Properties
applies_to          = ["text", "int9", "uint9", "int27", "uint27", "trit"]
properties          = ["values", "labels"]
requires_exhaustive = true                       # All variants must be handled

# Enum Semantic Properties
semantic_meaning    = "finite_choice"            # Choose from fixed set
ternary_value       = 0                          # 0 = neutral, enumerated
biblical_parallel   = "Deuteronomy 30:19"        # Choose life or death

# ───────────────────────────────────────────────────────────────────────────────
# Enum OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[constraint.enum.omnicode]
description = "OmniCode syntax for enum constraints"

keywords    = ["chosen", "from", "or"]
pattern     = "<name> chosen from <value> or <value> or <value>"
modifiers   = ["default"]

[constraint.enum.omnicode.examples]
status      = "status chosen from active or inactive or pending"
direction   = "dir chosen from north or south or east or west"
ternary     = "signal chosen from negative or neutral or positive"
with_default = "priority chosen from low or medium or high default medium"

# ───────────────────────────────────────────────────────────────────────────────
# Enum CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[constraint.enum.cpisi]
description = "Enum semantics in CPI-SI cognitive framework"

direction   = ["first_option", "middle_options", "last_option"]  # -1, 0, +1
# -1: First enumerated value
#  0: Middle values
# +1: Last enumerated value

weight      = ["defined", "enumerated", "bounded"]
action      = ["select", "match", "exhaust"]
genesis     = ["death", "choice", "life"]        # From Deuteronomy 30:19

# ───────────────────────────────────────────────────────────────────────────────
# Enum Language Types
# ───────────────────────────────────────────────────────────────────────────────

[constraint.enum.types]
description = "Enum constraint in target languages"

[constraint.enum.types.c]
syntax      = "enum Name { VALUE1, VALUE2, VALUE3 };"
typedef     = "typedef enum { ... } Name;"

[constraint.enum.types.go]
syntax      = "type Name int; const ( Value1 Name = iota; Value2; Value3 )"
iota        = true

[constraint.enum.types.rust]
syntax      = "enum Name { Value1, Value2, Value3 }"
exhaustive  = true                               # match must cover all

# ───────────────────────────────────────────────────────────────────────────────
# Enum Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[constraint.enum.scales]
description = "Enum constraint at each architectural layer"

L0_kernel    = { name = "OpCode",          example = "ADD, SUB, MUL, DIV",      use = "CPU operations" }
L1_system    = { name = "Signal",          example = "SIGINT, SIGTERM, SIGKILL", use = "Unix signals" }
L2_runtime   = { name = "TypeTag",         example = "INT, FLOAT, STRING",      use = "Dynamic typing" }
L3_framework = { name = "HttpMethod",      example = "GET, POST, PUT, DELETE",  use = "REST methods" }
L4_health    = { name = "HealthState",     example = "HEALTHY, DEGRADED, DOWN", use = "Service status" }
L5_network   = { name = "PacketType",      example = "DATA, ACK, SYN, FIN",     use = "TCP flags" }
L6_storage   = { name = "FileType",        example = "FILE, DIR, LINK, SOCKET", use = "Inode types" }
L7_engine    = { name = "Action",          example = "CREATE, UPDATE, DELETE",  use = "CRUD ops" }
L8_app       = { name = "UserRole",        example = "ADMIN, USER, GUEST",      use = "Authorization" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2d LENGTH — Collection/String Length Constraint [LENGTH]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And this is the fashion which thou shalt make it of: The length of the ark
#  shall be three hundred cubits, the breadth of it fifty cubits, and the
#  height of it thirty cubits." — Genesis 6:15 KJV
#
# Length constraints specify size limits — how long a string can be, how many
# items a collection can hold. Like Noah's ark dimensions, precise measurement.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.length]
name        = "length"
description = "Collection/string length constraint — size limits"
kind        = "constraint"
strategy    = "length"

# Length Core Properties
applies_to = ["text", "list", "set", "bytes"]
properties = ["min_length", "max_length", "exact_length"]

# Length Semantic Properties
semantic_meaning  = "measured_size"              # Fits within dimensions
ternary_value     = -1                           # -1 = restriction, limiting
biblical_parallel = "Genesis 6:15"               # Ark dimensions

# ───────────────────────────────────────────────────────────────────────────────
# Length OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[constraint.length.omnicode]
description = "OmniCode syntax for length constraints"

keywords    = ["measured", "from", "to", "at", "most", "least", "exactly"]
pattern     = "<name> as <type> measured from <min> to <max>"
modifiers   = ["at most", "at least", "exactly"]

[constraint.length.omnicode.examples]
name        = "name as text measured from 1 to 255"
password    = "password as text measured at least 8"
pin         = "pin as text measured exactly 4"
items       = "items as list measured at most 100"

# ───────────────────────────────────────────────────────────────────────────────
# Length CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[constraint.length.cpisi]
description = "Length semantics in CPI-SI cognitive framework"

direction   = ["too_short", "right_size", "too_long"]  # -1, 0, +1
# -1: Below minimum length (violation)
#  0: Within length bounds (valid)
# +1: Above maximum length (violation)

weight      = ["truncated", "measured", "overflow"]
action      = ["pad", "accept", "trim"]
genesis     = ["insufficient", "measured", "excessive"]

# ───────────────────────────────────────────────────────────────────────────────
# Length Language Types
# ───────────────────────────────────────────────────────────────────────────────

[constraint.length.types]
description = "Length constraint in target languages"

[constraint.length.types.c]
syntax      = "strlen(s) >= min && strlen(s) <= max"
array       = "sizeof(arr) / sizeof(arr[0])"

[constraint.length.types.go]
syntax      = "len(s) >= min && len(s) <= max"
slice       = "len(slice), cap(slice)"

[constraint.length.types.rust]
syntax      = "s.len() >= min && s.len() <= max"
vector      = "vec.len(), vec.capacity()"

# ───────────────────────────────────────────────────────────────────────────────
# Length Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[constraint.length.scales]
description = "Length constraint at each architectural layer"

L0_kernel    = { name = "buffer_size",     example = "64, 256, 4096 bytes",    use = "DMA buffers" }
L1_system    = { name = "arg_length",      example = "ARG_MAX limit",          use = "Syscall args" }
L2_runtime   = { name = "stack_depth",     example = "max recursion",          use = "Call stack" }
L3_framework = { name = "message_size",    example = "max payload bytes",      use = "Protocol limits" }
L4_health    = { name = "vector_length",   example = "9 dimensions",           use = "Health vectors" }
L5_network   = { name = "packet_size",     example = "MTU 1500 bytes",         use = "Network frames" }
L6_storage   = { name = "path_length",     example = "PATH_MAX 4096",          use = "File paths" }
L7_engine    = { name = "queue_depth",     example = "max pending items",      use = "Work queues" }
L8_app       = { name = "field_length",    example = "username 3-50 chars",    use = "User input" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2e UNIQUE — Uniqueness Constraint [UNIQUE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "There is one body, and one Spirit, even as ye are called in one hope of your
#  calling; One Lord, one faith, one baptism." — Ephesians 4:4-5 KJV
#
# Uniqueness constraints ensure no duplicates — each value is singular, distinct.
# Like fingerprints, like names given by Adam, like the one body of Christ.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.unique]
name        = "unique"
description = "Uniqueness constraint — no duplicate values"
kind        = "constraint"
strategy    = "unique"

applies_to  = ["text", "int", "uuid", "list", "set"]
properties  = ["scope", "case_sensitive", "compound"]

semantic_meaning  = "singularity"
ternary_value     = -1                           # Contractive — rejects duplicates
biblical_parallel = "Ephesians 4:4-5"

[constraint.unique.omnicode]
keywords    = ["unique", "distinct", "singular", "only"]
pattern     = "<name> as <type> unique"
modifiers   = ["within", "globally", "case_insensitive"]
examples    = [
    "email as text unique",
    "username as text unique case_insensitive",
    "compound unique (tenant_id, name)",
]

[constraint.unique.cpisi]
direction   = ["duplicate", "unique", "first"]    # -1, 0, +1
weight      = ["rejected", "accepted", "canonical"]
action      = ["reject", "accept", "promote"]
genesis     = ["confusion", "named", "firstborn"]

[constraint.unique.types.sql]
syntax      = "UNIQUE (column)"
compound    = "UNIQUE (col1, col2)"

[constraint.unique.types.go]
syntax      = "// enforce via map[T]struct{} for uniqueness check"
example     = "seen := make(map[string]struct{})"

[constraint.unique.types.rust]
syntax      = "HashSet<T> for unique collections"
example     = "let unique: HashSet<String> = items.into_iter().collect();"

[constraint.unique.scales]
L0_kernel    = { name = "UniqueId",          example = "interrupt vectors",      use = "Hardware IDs" }
L1_system    = { name = "PID",               example = "process IDs",            use = "Process unique" }
L2_runtime   = { name = "ObjectId",          example = "memory addresses",       use = "Object identity" }
L3_framework = { name = "SessionId",         example = "session tokens",         use = "Session unique" }
L4_health    = { name = "PatientId",         example = "MRN",                    use = "Patient unique" }
L5_network   = { name = "ConnectionId",      example = "socket pair",            use = "Connection unique" }
L6_storage   = { name = "PrimaryKey",        example = "database PK",            use = "Record unique" }
L7_engine    = { name = "EntityId",          example = "ECS entity ID",          use = "Entity unique" }
L8_app       = { name = "UserId",            example = "user UUID",              use = "User unique" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2f FOREIGN_KEY — Referential Constraint [FOREIGN_KEY]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Honour thy father and thy mother: that thy days may be long upon the land
#  which the LORD thy God giveth thee." — Exodus 20:12 KJV
#
# Foreign key constraints establish relationship — this value references that
# value. Like genealogies connecting generations, like covenant bonds.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.foreign_key]
name        = "foreign_key"
description = "Foreign key constraint — referential integrity"
kind        = "constraint"
strategy    = "reference"

applies_to  = ["int", "uuid", "text"]
properties  = ["references", "on_delete", "on_update"]

semantic_meaning  = "relationship"
ternary_value     = 0                            # Balanced — connects types
biblical_parallel = "Exodus 20:12"

[constraint.foreign_key.omnicode]
keywords    = ["references", "belongs_to", "child_of", "linked"]
pattern     = "<name> as <type> references <Target>.<field>"
modifiers   = ["cascade", "restrict", "set_null", "orphan"]
examples    = [
    "author_id as uuid references User.id",
    "parent_id as uuid references self.id",
    "category_id as int references Category.id cascade",
]

[constraint.foreign_key.cpisi]
direction   = ["orphaned", "linked", "source"]    # -1, 0, +1
weight      = ["broken", "connected", "authoritative"]
action      = ["reject", "link", "own"]
genesis     = ["cursed", "blessed", "firstborn"]

[constraint.foreign_key.actions]
cascade     = "Delete/update child when parent changes"
restrict    = "Prevent parent change if children exist"
set_null    = "Set to null when parent deleted"
no_action   = "Defer check to transaction end"

[constraint.foreign_key.types.sql]
syntax      = "FOREIGN KEY (col) REFERENCES target(col)"
cascade     = "ON DELETE CASCADE ON UPDATE CASCADE"

[constraint.foreign_key.types.go]
syntax      = "// enforce via application logic or ORM"
example     = "type Post struct { AuthorID uuid.UUID `gorm:\"foreignKey:UserID\"` }"

[constraint.foreign_key.types.rust]
syntax      = "// Diesel/SQLx foreign key constraints"
example     = "#[diesel(belongs_to(User))]"

[constraint.foreign_key.scales]
L0_kernel    = { name = "PointerRef",        example = "memory address",         use = "Pointer validity" }
L1_system    = { name = "HandleRef",         example = "file descriptor",        use = "Handle ownership" }
L2_runtime   = { name = "ObjectRef",         example = "object reference",       use = "GC roots" }
L3_framework = { name = "ServiceRef",        example = "dependency injection",   use = "Service links" }
L4_health    = { name = "ProviderRef",       example = "provider NPI",           use = "Provider link" }
L5_network   = { name = "RouteRef",          example = "next hop",               use = "Routing tables" }
L6_storage   = { name = "ForeignKey",        example = "database FK",            use = "Table relations" }
L7_engine    = { name = "ComponentRef",      example = "entity reference",       use = "ECS relations" }
L8_app       = { name = "ResourceRef",       example = "API resource link",      use = "REST relations" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2g DEFAULT — Default Value Constraint [DEFAULT]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And God said, Let there be light: and there was light." — Genesis 1:3 KJV
#
# Default constraints provide initial values — what exists before explicit
# specification. Like light appearing before the sun, defaults fill the void.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.default]
name        = "default"
description = "Default value constraint — automatic initialization"
kind        = "constraint"
strategy    = "default"

applies_to  = ["bool", "int", "text", "timestamp", "uuid"]
properties  = ["value", "expression", "function"]

semantic_meaning  = "initialization"
ternary_value     = 0                            # Balanced — provides when absent
biblical_parallel = "Genesis 1:3"

[constraint.default.omnicode]
keywords    = ["default", "initially", "starts", "begins"]
pattern     = "<name> as <type> default <value>"
modifiers   = ["lazy", "computed", "constant"]
examples    = [
    "active as bool default true",
    "created_at as timestamp default now",
    "role as text default 'user'",
    "id as uuid default uuid_v7",
]

[constraint.default.cpisi]
direction   = ["void", "initialized", "specified"]  # -1, 0, +1
weight      = ["empty", "default", "explicit"]
action      = ["provide", "use", "override"]
genesis     = ["void", "let_there_be", "it_was_so"]

[constraint.default.types.sql]
syntax      = "DEFAULT value"
timestamp   = "DEFAULT CURRENT_TIMESTAMP"
uuid        = "DEFAULT gen_random_uuid()"

[constraint.default.types.go]
syntax      = "// zero values are defaults, explicit via struct tags"
example     = "Active bool `default:\"true\"`"

[constraint.default.types.rust]
syntax      = "#[serde(default)]"
example     = "#[serde(default = \"default_active\")] active: bool"

[constraint.default.scales]
L0_kernel    = { name = "ZeroInit",          example = "BSS segment",            use = "Memory init" }
L1_system    = { name = "EnvDefault",        example = "PATH default",           use = "Environment" }
L2_runtime   = { name = "ZeroValue",         example = "Go zero values",         use = "Type defaults" }
L3_framework = { name = "ConfigDefault",     example = "default config",         use = "Configuration" }
L4_health    = { name = "BaselineDefault",   example = "normal ranges",          use = "Health baselines" }
L5_network   = { name = "ProtocolDefault",   example = "default port",           use = "Protocol defaults" }
L6_storage   = { name = "ColumnDefault",     example = "DEFAULT clause",         use = "Database defaults" }
L7_engine    = { name = "ComponentDefault",  example = "prefab values",          use = "Entity defaults" }
L8_app       = { name = "FormDefault",       example = "form prefill",           use = "UI defaults" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2h IMMUTABLE — Immutability Constraint [IMMUTABLE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "For I am the LORD, I change not." — Malachi 3:6 KJV
#
# Immutability constraints prevent modification — once set, forever fixed.
# Like God's unchanging nature, like covenants sealed, like the written Word.
#
# ───────────────────────────────────────────────────────────────────────────────

[constraint.immutable]
name        = "immutable"
description = "Immutability constraint — cannot be modified after creation"
kind        = "constraint"
strategy    = "immutable"

applies_to  = ["any"]                            # Can apply to any type
properties  = ["after_create", "after_first_set", "always"]

semantic_meaning  = "permanence"
ternary_value     = -1                           # Contractive — prevents change
biblical_parallel = "Malachi 3:6"

[constraint.immutable.omnicode]
keywords    = ["immutable", "readonly", "const", "final", "sealed"]
pattern     = "<name> as <type> immutable"
modifiers   = ["after_create", "deep", "shallow"]
examples    = [
    "id as uuid immutable",
    "created_at as timestamp immutable",
    "signature as bytes immutable after_create",
]

[constraint.immutable.cpisi]
direction   = ["mutable", "locked", "eternal"]    # -1, 0, +1
weight      = ["changeable", "fixed", "permanent"]
action      = ["allow_change", "reject_change", "never_change"]
genesis     = ["void", "created", "it_was_so"]

[constraint.immutable.types.c]
syntax      = "const Type name"
deep        = "const Type* const ptr"

[constraint.immutable.types.go]
syntax      = "// no const for variables, enforce via unexported + getter"
example     = "type Entity struct { id uuid.UUID } func (e Entity) ID() uuid.UUID { return e.id }"

[constraint.immutable.types.rust]
syntax      = "let name: Type = value  // immutable by default"
mutable     = "let mut name: Type = value  // explicit mutability"

[constraint.immutable.scales]
L0_kernel    = { name = "ROM",               example = "firmware",               use = "Read-only memory" }
L1_system    = { name = "ReadOnlyMount",     example = "ro filesystem",          use = "Immutable FS" }
L2_runtime   = { name = "FrozenObject",      example = "Object.freeze()",        use = "Object freeze" }
L3_framework = { name = "ImmutableConfig",   example = "sealed config",          use = "Config immutability" }
L4_health    = { name = "SealedRecord",      example = "signed record",          use = "Audit trail" }
L5_network   = { name = "SignedMessage",     example = "digital signature",      use = "Message integrity" }
L6_storage   = { name = "AuditLog",          example = "append-only log",        use = "Immutable log" }
L7_engine    = { name = "SnapshotState",     example = "game save",              use = "State snapshot" }
L8_app       = { name = "HistoryEntry",      example = "transaction history",    use = "Audit history" }


# ───────────────────────────────────────────────────────────────────────────────
# Constraint Shared Sections
# ───────────────────────────────────────────────────────────────────────────────

[constraint.omnicode]
description = "OmniCode constraint syntax overview"

# Constraint declaration keywords
keywords    = ["from", "to", "pattern", "chosen", "measured",
               "according", "between", "within", "at", "most", "least"]

# Constraint operators
operators   = [">=", "<=", "==", "=~"]           # range, range, exact, pattern

# Constraint modifiers
modifiers   = ["exclusive", "inclusive", "case_insensitive", "default"]

[constraint.cpisi]
description = "Constraint semantics in CPI-SI cognitive framework"

# Directional meaning
direction   = ["violation_low", "valid", "violation_high"]  # -1, 0, +1
# -1: Below constraint (too small, too short, wrong shape)
#  0: Within constraint (valid)
# +1: Above constraint (too large, too long, over-specified)

# Cognitive weight
weight      = ["rejection", "acceptance", "rejection"]

# Action semantics
action      = ["reject_low", "accept", "reject_high"]

# Deuteronomy 19:14 mapping
genesis     = ["outside_landmark", "within_landmark", "outside_landmark"]

[constraint.scales]
description = "Constraint validation at each architectural layer"

L0_kernel    = { validation = "hardware_check",  timing = "cycle-level" }
L1_system    = { validation = "kernel_check",    timing = "syscall-level" }
L2_runtime   = { validation = "runtime_check",   timing = "call-level" }
L3_framework = { validation = "schema_check",    timing = "request-level" }
L4_health    = { validation = "tripwire_check",  timing = "heartbeat-level" }
L5_network   = { validation = "protocol_check",  timing = "packet-level" }
L6_storage   = { validation = "format_check",    timing = "write-level" }
L7_engine    = { validation = "rule_check",      timing = "transition-level" }
L8_app       = { validation = "input_check",     timing = "event-level" }




[extensions]
note = "Reserved — no extensions for constraints"

# Cv — Content Validation
[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('constraints.toml','rb'))\""]

[_validation.schema]
required = ["constraint"]
optional = ["_content", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

