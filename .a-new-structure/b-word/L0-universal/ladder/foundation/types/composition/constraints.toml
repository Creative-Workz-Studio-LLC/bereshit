[_closing.X5_note]
note = "Type constraints: landmarks defining valid values. What is within is valid; what is outside is rejected."
scripture = "In the beginning God created the heaven and the earth. — Genesis 1:1"
anchor = "Genesis 1:1 — God set boundaries (badal). Constraints are the landmarks of the type system."

