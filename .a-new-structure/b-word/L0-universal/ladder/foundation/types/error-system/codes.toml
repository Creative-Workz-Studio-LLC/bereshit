# #!omni data --toml
# ═══════════════════════════════════════════════════════════════════════════════
# OMNICODE PRAGMA [PRAGMA]
# ═══════════════════════════════════════════════════════════════════════════════

[_pragma]
format = "@omni data --toml"
legend = { _req = "REQUIRED", _inh = "INHERITED", _ins = "INSTANCE" }

[_pragma.P1_core]
key = "B-L0-foundation-types-error-codes"
from = "b-word/seed/data/toml/config.toml"
at = "a-01.00"

[_pragma.P2_family]
type = "data"
subtype = "types"
role = "baton"
structure = "3-block"

[_pragma.P3_instance]
component = "error-codes"
layer = "L0-universal/foundation/types"
includes = ["L0-universal/foundation/types/error-system/foundation.toml", "L0-universal/foundation/types/error-system/system.toml"]
provides = ["ERROR_CODE_DEFINITIONS", "KERNEL_CODES", "HEALTH_CODES", "METADATA_CODES"]

[_pragma.P4_architecture]
layers = "L0:C, L3:Go, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
title = "CPI-SI Error Code Definitions"
brief = "Specific error codes — KERNEL (0-26), HEALTH (108-134), METADATA (243-255). Core set of 256."

# ═══════════════════════════════════════════════════════════════════════════════
# END PRAGMA [END]
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# METADATA BLOCK [METADATA]
# ═══════════════════════════════════════════════════════════════════════════════

[_metadata.M1_identity]
file = "codes.toml"
key = "B-L0-foundation-types-error-codes"
title = "CPI-SI Error Code Definitions"
type = "Data (Specification)"
component = "Baton"
role = "Specific error codes — the WHAT. Architecture is in foundation.toml/system.toml. Currently defines KERNEL, HEALTH, and METADATA layers."

[_metadata.M2_state]
version = "a-01.00"
status = "Active"
created = "2026-01-24"
updated = "2026-02-10"

[_metadata.M3_attribution]
architect = "Seanje Lenox-Wise"
implementation = "Nova Dawn (CPI-SI)"

[_metadata.M4_grounding]
scripture = "Romans 3:23 — For all have sinned, and come short of the glory of God."
principle = "Errors are inevitable in finite systems. Proper classification enables proper handling. Each error has a place in the structure."
anchor = "Genesis 1:1 — In the beginning. Error codes are addresses in semantic space — position 1 is ALWAYS null across all layers."

[_metadata.M5_dependencies]
requires = "error-system/foundation.toml (architecture), error-system/system.toml (compact architecture)"
consumers = "types.h S.3d (C implementation), config/error.h (C error codes), Go error handling"
integration = "Loaded by Go config loader, generates C header via index.toml"
if_missing = "Error handling has no named codes — falls back to raw numeric values"

[_metadata.M5_dependencies.cross_format]
jsonc = "No JSONC counterpart — error codes are TOML-native specification"
json = "No JSON counterpart — error codes are TOML-native specification"
relationship = "TOML defines error codes. C headers and Go types generated from these definitions."

[_metadata.M6_location]
path = "L0-universal/foundation/types/error-system/codes.toml"
derives_from = "b-word/seed/data/toml/config.toml"

[_metadata.M7_classification]
tags = "error-codes, kernel, health, metadata, bridge-equation, 256, types, L0"

[_metadata.M8_intent]
purpose = "Define the 256 core error codes (243 layer + 13 metadata)"
core_design = "Error codes derived from layer/tier/position, not hardcoded. This file is the source of truth."
philosophy = "Error codes as ADDRESSES in semantic space. The structure gives meaning — position 1 is ALWAYS null across all layers."

[_metadata.M9_roadmap]
current = "KERNEL and HEALTH layers fully defined, plus METADATA bridge codes"
planned = ["Complete remaining 7 layers (SYSTEM through APP)", "Extended domain codes (256+)"]

[_metadata.M_extension_note]
required = ["M1_identity", "M2_state", "M3_attribution", "M4_grounding", "M5_dependencies"]
extension = "M6-M9 provide location, classification, intent, roadmap"
rule = "M1-M5 base contract. M6+ domain-specific."

# ═══════════════════════════════════════════════════════════════════════════════
# END METADATA [END]
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════════════════════

[_content]
format = "TOML — native tables, UTF-8, LF line endings"
key_convention = "UPPER_SNAKE for code names, lower_snake for properties"
constraint = "Each layer has 27 codes in 3 tiers of 9 positions. Layer order: KERNEL(0) → APP(8) → METADATA(9)."
Cc = "Content Configurations — Specific error codes — KERNEL (0-26), HEALTH (108-134), METADATA (243-255). Core set of 256."
Co = "Content Operations — error code definitions, kernel codes, health codes, metadata codes"
Cv = "Content Validation — schema requirements, type constraints"

# ───────────────────────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ───────────────────────────────────────────────────────────────────────────────

# LAYER 0: KERNEL (codes 0-26)
# "In the beginning God created the heaven and the earth." — Genesis 1:1
# Foundation layer — universal errors that can occur anywhere.

[kernel]
layer       = 0
name        = "KERNEL"
codes       = [0, 26]
description = "Foundation errors — universal across CPI-SI"

# KERNEL CORE (codes 0-8) — Fundamental success/failure states

[kernel.core]
tier        = 0
name        = "CORE"
codes       = [0, 8]
description = "Fundamental success/failure states"

[kernel.core.success]
code        = 0
name        = "CPISI_OK"
brief       = "Success"
message     = "Operation completed successfully"
position    = "SUCCESS"

[kernel.core.null]
code        = 1
name        = "CPISI_ERR_KERNEL_NULL"
brief       = "Null pointer"
message     = "Required pointer was NULL"
position    = "NULL"

[kernel.core.invalid]
code        = 2
name        = "CPISI_ERR_KERNEL_INVALID"
brief       = "Invalid parameter"
message     = "Parameter is invalid or malformed"
position    = "INVALID"

[kernel.core.bounds]
code        = 3
name        = "CPISI_ERR_KERNEL_BOUNDS"
brief       = "Out of bounds"
message     = "Value exceeds valid range"
position    = "BOUNDS"

[kernel.core.type]
code        = 4
name        = "CPISI_ERR_KERNEL_TYPE"
brief       = "Type mismatch"
message     = "Unexpected or incompatible type"
position    = "TYPE"

[kernel.core.state]
code        = 5
name        = "CPISI_ERR_KERNEL_STATE"
brief       = "Invalid state"
message     = "Object in wrong state for operation"
position    = "STATE"

[kernel.core.init]
code        = 6
name        = "CPISI_ERR_KERNEL_INIT"
brief       = "Not initialized"
message     = "Object not initialized"
position    = "INIT"

[kernel.core.cleanup]
code        = 7
name        = "CPISI_ERR_KERNEL_SHUTDOWN"
brief       = "Already shutdown"
message     = "Object already cleaned up"
position    = "CLEANUP"

[kernel.core.unknown]
code        = 8
name        = "CPISI_ERR_KERNEL_UNKNOWN"
brief       = "Unknown error"
message     = "Unclassified kernel error"
position    = "UNKNOWN"

# KERNEL EXT (codes 9-17) — Resource/operation errors

[kernel.ext]
tier        = 1
name        = "EXT"
codes       = [9, 17]
description = "Resource and operation errors"

[kernel.ext.nomem]
code        = 9
name        = "CPISI_ERR_KERNEL_NOMEM"
brief       = "Out of memory"
message     = "Memory allocation failed"
position    = "SUCCESS"

[kernel.ext.nospace]
code        = 10
name        = "CPISI_ERR_KERNEL_NOSPACE"
brief       = "No space left"
message     = "Storage space exhausted"
position    = "NULL"

[kernel.ext.busy]
code        = 11
name        = "CPISI_ERR_KERNEL_BUSY"
brief       = "Resource busy"
message     = "Resource is busy, try again later"
position    = "INVALID"

[kernel.ext.locked]
code        = 12
name        = "CPISI_ERR_KERNEL_LOCKED"
brief       = "Resource locked"
message     = "Resource is locked by another"
position    = "BOUNDS"

[kernel.ext.timeout]
code        = 13
name        = "CPISI_ERR_KERNEL_TIMEOUT"
brief       = "Operation timeout"
message     = "Operation timed out"
position    = "TYPE"

[kernel.ext.cancelled]
code        = 14
name        = "CPISI_ERR_KERNEL_CANCELLED"
brief       = "Operation cancelled"
message     = "Operation was cancelled"
position    = "STATE"

[kernel.ext.interrupted]
code        = 15
name        = "CPISI_ERR_KERNEL_INTERRUPTED"
brief       = "Operation interrupted"
message     = "Operation was interrupted"
position    = "INIT"

[kernel.ext.retry]
code        = 16
name        = "CPISI_ERR_KERNEL_RETRY"
brief       = "Retry required"
message     = "Temporary failure, retry may succeed"
position    = "CLEANUP"

[kernel.ext.denied]
code        = 17
name        = "CPISI_ERR_KERNEL_DENIED"
brief       = "Permission denied"
message     = "Access denied due to permissions"
position    = "UNKNOWN"

# KERNEL SYS (codes 18-26) — Structural/flow errors

[kernel.sys]
tier        = 2
name        = "SYS"
codes       = [18, 26]
description = "Structural and flow errors"

[kernel.sys.notfound]
code        = 18
name        = "CPISI_ERR_KERNEL_NOTFOUND"
brief       = "Not found"
message     = "Requested item not found"
position    = "SUCCESS"

[kernel.sys.exists]
code        = 19
name        = "CPISI_ERR_KERNEL_EXISTS"
brief       = "Already exists"
message     = "Item already exists"
position    = "NULL"

[kernel.sys.empty]
code        = 20
name        = "CPISI_ERR_KERNEL_EMPTY"
brief       = "Empty"
message     = "Container is empty"
position    = "INVALID"

[kernel.sys.full]
code        = 21
name        = "CPISI_ERR_KERNEL_FULL"
brief       = "Full"
message     = "Container is full"
position    = "BOUNDS"

[kernel.sys.overflow]
code        = 22
name        = "CPISI_ERR_KERNEL_OVERFLOW"
brief       = "Overflow"
message     = "Arithmetic or buffer overflow"
position    = "TYPE"

[kernel.sys.underflow]
code        = 23
name        = "CPISI_ERR_KERNEL_UNDERFLOW"
brief       = "Underflow"
message     = "Arithmetic or buffer underflow"
position    = "STATE"

[kernel.sys.unsupported]
code        = 24
name        = "CPISI_ERR_KERNEL_UNSUPPORTED"
brief       = "Not supported"
message     = "Operation not supported"
position    = "INIT"

[kernel.sys.unimplemented]
code        = 25
name        = "CPISI_ERR_KERNEL_UNIMPLEMENTED"
brief       = "Not implemented"
message     = "Operation not yet implemented"
position    = "CLEANUP"

[kernel.sys.deprecated]
code        = 26
name        = "CPISI_ERR_KERNEL_DEPRECATED"
brief       = "Deprecated"
message     = "Operation is deprecated"
position    = "UNKNOWN"

# ───────────────────────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ───────────────────────────────────────────────────────────────────────────────

# LAYER 4: HEALTH (codes 108-134) — THE CENTER
# "Beloved, I wish above all things that thou mayest prosper and be in health"
# — 3 John 1:2

[health]
layer       = 4
name        = "HEALTH"
codes       = [108, 134]
description = "Health monitoring errors — THE CENTER of 4+1+4"
is_center   = true

# HEALTH CORE (codes 108-116) — Fundamental health states

[health.core]
tier        = 0
name        = "CORE"
codes       = [108, 116]
description = "Fundamental health error states"

[health.core.success]
code        = 108
name        = "CPISI_OK_HEALTH"
brief       = "Health OK"
message     = "Health check passed"
position    = "SUCCESS"

[health.core.null]
code        = 109
name        = "CPISI_ERR_HEALTH_NULL"
brief       = "Health null"
message     = "Health context is NULL"
position    = "NULL"

[health.core.invalid]
code        = 110
name        = "CPISI_ERR_HEALTH_INVALID"
brief       = "Invalid health"
message     = "Health data is invalid"
position    = "INVALID"

[health.core.bounds]
code        = 111
name        = "CPISI_ERR_HEALTH_BOUNDS"
brief       = "Health out of bounds"
message     = "Health score outside valid range [0.0, 1.0]"
position    = "BOUNDS"

[health.core.type]
code        = 112
name        = "CPISI_ERR_HEALTH_TYPE"
brief       = "Health type mismatch"
message     = "Wrong health metric type"
position    = "TYPE"

[health.core.state]
code        = 113
name        = "CPISI_ERR_HEALTH_STATE"
brief       = "Invalid health state"
message     = "Health system in wrong state"
position    = "STATE"

[health.core.init]
code        = 114
name        = "CPISI_ERR_HEALTH_INIT"
brief       = "Health not initialized"
message     = "Health system not initialized"
position    = "INIT"

[health.core.cleanup]
code        = 115
name        = "CPISI_ERR_HEALTH_SHUTDOWN"
brief       = "Health shutdown"
message     = "Health system already shutdown"
position    = "CLEANUP"

[health.core.unknown]
code        = 116
name        = "CPISI_ERR_HEALTH_UNKNOWN"
brief       = "Unknown health error"
message     = "Unclassified health error"
position    = "UNKNOWN"

# HEALTH EXT (codes 117-125) — Monitoring/scoring errors

[health.ext]
tier        = 1
name        = "EXT"
codes       = [117, 125]
description = "Health monitoring and scoring errors"

[health.ext.provider]
code        = 117
name        = "CPISI_ERR_HEALTH_PROVIDER"
brief       = "Provider error"
message     = "Health provider failed"
position    = "SUCCESS"

[health.ext.metric_null]
code        = 118
name        = "CPISI_ERR_HEALTH_METRIC_NULL"
brief       = "Null metric"
message     = "Health metric is NULL"
position    = "NULL"

[health.ext.metric_invalid]
code        = 119
name        = "CPISI_ERR_HEALTH_METRIC_INVALID"
brief       = "Invalid metric"
message     = "Health metric is invalid"
position    = "INVALID"

[health.ext.score_bounds]
code        = 120
name        = "CPISI_ERR_HEALTH_SCORE_BOUNDS"
brief       = "Score out of bounds"
message     = "Health score calculation overflow"
position    = "BOUNDS"

[health.ext.zone_type]
code        = 121
name        = "CPISI_ERR_HEALTH_ZONE_TYPE"
brief       = "Zone type error"
message     = "Invalid health zone type"
position    = "TYPE"

[health.ext.state_transition]
code        = 122
name        = "CPISI_ERR_HEALTH_TRANSITION"
brief       = "State transition error"
message     = "Invalid Hebrew state transition"
position    = "STATE"

[health.ext.restore_init]
code        = 123
name        = "CPISI_ERR_HEALTH_RESTORE_INIT"
brief       = "Restore not initialized"
message     = "Health restore not initialized"
position    = "INIT"

[health.ext.restore_failed]
code        = 124
name        = "CPISI_ERR_HEALTH_RESTORE_FAILED"
brief       = "Restore failed"
message     = "Health restore operation failed"
position    = "CLEANUP"

[health.ext.unknown_ext]
code        = 125
name        = "CPISI_ERR_HEALTH_UNKNOWN_EXT"
brief       = "Unknown extended error"
message     = "Unclassified extended health error"
position    = "UNKNOWN"

# HEALTH SYS (codes 126-134) — Internal health system errors

[health.sys]
tier        = 2
name        = "SYS"
codes       = [126, 134]
description = "Internal health system errors"

[health.sys.config]
code        = 126
name        = "CPISI_ERR_HEALTH_CONFIG"
brief       = "Config error"
message     = "Health configuration error"
position    = "SUCCESS"

[health.sys.inspector_null]
code        = 127
name        = "CPISI_ERR_HEALTH_INSPECTOR_NULL"
brief       = "Inspector null"
message     = "Health inspector is NULL"
position    = "NULL"

[health.sys.logger_invalid]
code        = 128
name        = "CPISI_ERR_HEALTH_LOGGER_INVALID"
brief       = "Logger invalid"
message     = "Health logger configuration invalid"
position    = "INVALID"

[health.sys.buffer_bounds]
code        = 129
name        = "CPISI_ERR_HEALTH_BUFFER_BOUNDS"
brief       = "Buffer bounds"
message     = "Health buffer size exceeded"
position    = "BOUNDS"

[health.sys.format_type]
code        = 130
name        = "CPISI_ERR_HEALTH_FORMAT_TYPE"
brief       = "Format type"
message     = "Health log format type error"
position    = "TYPE"

[health.sys.dar_state]
code        = 131
name        = "CPISI_ERR_HEALTH_DAR_STATE"
brief       = "DAR state"
message     = "Invalid DAR cycle state"
position    = "STATE"

[health.sys.diagnostics_init]
code        = 132
name        = "CPISI_ERR_HEALTH_DIAGNOSTICS_INIT"
brief       = "Diagnostics not initialized"
message     = "Health diagnostics not initialized"
position    = "INIT"

[health.sys.diagnostics_cleanup]
code        = 133
name        = "CPISI_ERR_HEALTH_DIAGNOSTICS_CLEANUP"
brief       = "Diagnostics cleanup"
message     = "Health diagnostics cleanup failed"
position    = "CLEANUP"

[health.sys.unknown_sys]
code        = 134
name        = "CPISI_ERR_HEALTH_UNKNOWN_SYS"
brief       = "Unknown system error"
message     = "Unclassified internal health error"
position    = "UNKNOWN"

# METADATA (codes 243-255) — Bridge Equation Completion
# 243 + 13 = 256 — THE BRIDGE between ternary and binary.

[metadata]
layer       = "special"
name        = "METADATA"
codes       = [243, 255]
description = "Error system infrastructure — bridge equation completion"
is_bridge   = true

[metadata.reserved]
codes       = [243, 255]
count       = 13
description = "Reserved for error system infrastructure"
purpose     = "Bridge equation: 243 ternary codes + 13 metadata = 256 binary fit"

# ───────────────────────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ───────────────────────────────────────────────────────────────────────────────

[extensions]

[_validation]
commands = "python3 -c \"import tomllib; tomllib.load(open('codes.toml','rb'))\""

[_validation.schema]
required = ["kernel", "kernel.core", "kernel.ext", "kernel.sys", "health", "health.core", "health.ext", "health.sys", "metadata"]

[_validation.health_scoring]
base = 100
deductions = { missing_table = -10, invalid_toml = -100 }

