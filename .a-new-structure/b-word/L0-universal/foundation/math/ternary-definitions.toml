scale_1      = { power = 1, value = 3,    name = "triplet", layer = "L1" }
scale_2      = { power = 2, value = 9,    name = "nonet",   layer = "L2" }
scale_3      = { power = 3, value = 27,   name = "tryte",   layer = "L3" }
scale_4      = { power = 4, value = 81,   name = "octant",  layer = "L4" }
scale_5      = { power = 5, value = 243,  name = "block",   layer = "L5" }
scale_6      = { power = 6, value = 729,  name = "sector",  layer = "L6" }
scale_7      = { power = 7, value = 2187, name = "segment", layer = "L7" }
scale_8      = { power = 8, value = 6561, name = "domain",  layer = "L8" }

# 243-based network protocol scales (for FaithNet)
[resources.powers.network]
packet       = 243                                     # Minimum packet payload
packet_std   = 729                                     # Standard packet (3 × 243)
frame        = 2187                                    # Frame (9 × 243)
block        = 6561                                    # Block (27 × 243)
chunk        = 19683                                   # Chunk (81 × 243)
segment      = 59049                                   # Segment (243 × 243)


# ═══════════════════════════════════════════════════════════════════════════════
# Cc.4 BEHAVIOR — Runtime Modes & Toggles [BEHAVIOR]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Choose you this day whom ye will serve." — Joshua 24:15
#
# RUNTIME SEMANTICS FOR BALANCED TERNARY
#
# Balanced ternary isn't just a storage format—it's a way of thinking about
# choice, direction, and state. This section maps trit values to their
# semantic meanings in OmniCode and CPI-SI:
#
#   -1 (negative): Break down, retreat, toward anchor, heavy
#    0 (neutral):  Anchor, hold, at rest, balanced
#   +1 (positive): Build up, advance, from anchor, light
#
# These mappings allow code to be written that "thinks" in balanced ternary,
# expressing direction, weight, and choice naturally.
#
# ═══════════════════════════════════════════════════════════════════════════════

# OmniCode language bindings for ternary operations
[behavior.omnicode]
keywords   = ["break_down", "anchor", "build_up"]      # -1, 0, +1 as verbs
operators  = ["←", "◆", "→"]                           # -1, 0, +1 as symbols
modifiers  = ["toward", "at", "from"]                  # -1, 0, +1 as prepositions
sigils     = ["-:", "0:", "+:"]                        # -1, 0, +1 as prefixes

# CPI-SI cognitive state mappings
[behavior.cpisi]
direction  = ["toward_anchor", "at_anchor", "from_anchor"]  # Movement relative to center
weight     = ["heavy", "balanced", "light"]                 # Cognitive load
action     = ["retreat", "hold", "advance"]                 # Strategic movement
genesis    = ["waters_below", "firmament", "waters_above"]  # Genesis 1 creation pattern



# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for mathematical definitions"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('ternary-definitions.toml','rb'))\""]

[_validation.schema]
required = ["identity", "settings", "resources", "behavior"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
valid_values = 30
mathematical_invariants = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
