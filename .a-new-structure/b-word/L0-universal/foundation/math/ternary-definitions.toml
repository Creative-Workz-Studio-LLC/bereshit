# ─────────────────────────────────────────────────────────────
# Co — Content Operations (Cc.1-4: Definitions)
# ─────────────────────────────────────────────────────────────

# Cc.1 IDENTITY — What Is a Trit? [IDENTITY]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "A threefold cord is not quickly broken." — Ecclesiastes 4:12
#
# THE ATOM OF BALANCED TERNARY
#
# A trit is the smallest unit of balanced ternary—a single digit with three
# possible values: -1 (negative), 0 (neutral), and +1 (positive). Unlike
# standard ternary (0, 1, 2), balanced ternary centers on zero.
#
# WHY BALANCED TERNARY MATTERS:
#
# The sum -1 + 0 + 1 = 0 expresses perfect mathematical balance. This isn't
# merely elegant—it has practical consequences:
#
#   • Sign is inherent: Negative values are first-class citizens, not encoded
#     with a separate sign bit. The value -5 in binary needs a sign bit plus
#     magnitude; in balanced ternary, it's simply represented directly.
#
#   • Rounding is natural: The nearest integer is found by truncating toward
#     zero, and rounding follows naturally from the representation.
#
#   • Direction is native: Movement toward/away from center maps directly to
#     +1/-1. This makes balanced ternary ideal for representing direction,
#     tendency, and state transitions.
#
# RELATIONSHIP TO BINARY:
#
# Binary hardware stores trits in bytes. The fundamental bridge is 243 = 3^5,
# which fits within a byte (256 = 2^8). See Cc.3.1 PACKING for details.
#
# Implementation: L0-universal/libtrit/include/trit/trit.h
#                 L0-universal/libtrit/src/matter/trit.op.c
#
# ═══════════════════════════════════════════════════════════════════════════════

# Core identity of a trit
[identity]
name        = "trit"                                   # Short name for the type
description = "Single balanced ternary digit"         # Human-readable description
type        = "mathematical foundation"               # Role in the system

# The three fundamental values
[identity.values]
numeric     = [-1, 0, 1]                               # The actual values: negative, zero, positive
labels      = ["negative", "neutral", "positive"]     # Full names for each state
short       = ["N", "Z", "P"]                          # Single-character abbreviations

# Mathematical constants derived from the definition
[identity.constants]
states      = 3                                        # 3 possible states (3^1)
base        = 3                                        # Base of the number system
sum         = 0                                        # -1 + 0 + 1 = 0 (the balance equation)
product     = 0                                        # Anything × 0 = 0 (zero annihilates)


# ═══════════════════════════════════════════════════════════════════════════════
# Cc.2 SETTINGS — Primary Definitions [SETTINGS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "A false balance is abomination to the LORD: but a just weight is his
#  delight." — Proverbs 11:1
#
# CONFIGURABLE REPRESENTATIONS
#
# Trits need to be displayed, parsed, stored, and transmitted. This section
# defines the various ways to represent trit values depending on context:
#
#   • Characters: How trits appear in text (display, config files, logs)
#   • Types: How trits are represented in programming languages
#   • Composition: How trits combine into larger units (3^n pattern)
#   • Scales: Named units with their properties
#
# The key insight is that 5 trits (243 states) fit perfectly in 1 byte
# (256 states), making "packed5" the fundamental unit for binary storage.
#
# ═══════════════════════════════════════════════════════════════════════════════

# Character representations for different contexts
[settings.chars]
standard    = ["-", "0", "+"]                          # Mathematical: clear, universal
ascii       = ["N", "Z", "P"]                          # ASCII-safe: Negative/Zero/Positive
arrow       = ["↓", "●", "↑"]                          # Visual: direction indicators
block       = ["▼", "■", "▲"]                          # Block: high-visibility display
wave        = ["∿", "―", "∼"]                          # Wave: signal processing contexts

# Type bindings for programming languages
[settings.types]
rust        = "i8"                                     # Rust: signed 8-bit integer
c           = "int8_t"                                 # C: standard signed integer
go          = "int8"                                   # Go: signed 8-bit integer
bits        = 2                                        # Minimum bits to encode 3 states
bytes       = 1                                        # Single byte when aligned

# Composition scales following the 3^n pattern
# Each level has 3× the states of the previous
[settings.composition]
tryte       = 3                                        # 3 trits = 27 states (3^3)
packed      = 5                                        # 5 trits = 243 states (3^5) ★ BYTE BRIDGE
tribble     = 9                                        # 9 trits = 19,683 states (3^9)
trord       = 27                                       # 27 trits = 7.6T states (3^27)
extended    = 81                                       # 81 trits = 4.4e38 states (3^81)
block       = 243                                      # 243 trits = 5.6e115 states (3^243) ★

# Named scales with full metadata
[settings.scales]
trit        = { count = 1,   states = 3,             bytes = 1,  layer = "L0" }
triplet     = { count = 3,   states = 27,            bytes = 1,  layer = "L1" }
nonet       = { count = 9,   states = 19683,         bytes = 2,  layer = "L2" }
tryte       = { count = 27,  states = 7625597484987, bytes = 6,  layer = "L3" }
octant      = { count = 81,  states = "4.4e38",      bytes = 18, layer = "L4" }
block_243   = { count = 243, states = "5.6e115",     bytes = 49, layer = "L5" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cc.3 RESOURCES — Storage Constraints [RESOURCES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first,
#  and counteth the cost, whether he have sufficient to finish it?"
#  — Luke 14:28
#
# THE PHYSICAL REALITY OF TERNARY ON BINARY HARDWARE
#
# Modern hardware is binary. Every storage medium, every bus, every register
# operates in powers of 2. Balanced ternary must be packed into this binary
# world. This section defines exactly how that packing works.
#
# The fundamental bridge is the number 243:
#
#   243 = 3^5 (five trits)
#   256 = 2^8 (one byte)
#   243 < 256 → Five trits fit in one byte with 13 states to spare
#
# This section covers:
#   • Cc.3.1 PACKING: How trits pack into bytes
#   • Cc.3.2 POWERS: Pre-computed powers of 3 for O(1) conversion
#
# ═══════════════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────────────
# Cc.3.1 PACKING — Binary Bridge [resources.packing]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Diverse weights, and diverse measures, both of them are alike abomination
#  to the LORD." — Proverbs 20:10
#
# TRIT-TO-BYTE PACKING
#
# The core insight: 3^5 = 243, which fits in 2^8 = 256. This means exactly
# 5 trits can be packed into 1 byte, using 243 of the 256 possible values.
#
# THE PACKING ALGORITHM (Horner's Method):
#
# To pack trits into an integer (MST-first, where MST = Most Significant Trit):
#
#   result = 0
#   for each trit from MST to LST:
#       result = result × 3 + (trit + 1)    # trit+1 shifts [-1,0,1] to [0,1,2]
#
# To unpack an integer into trits (LST-first):
#
#   for each position from LST to MST:
#       trit = (value % 3) - 1              # Shift [0,1,2] back to [-1,0,1]
#       value = value / 3                   # Integer division
#
# EFFICIENCY AT DIFFERENT SCALES:
#
#   5 trits  → 1 byte:  243 / 256    = 94.9% efficient (excellent)
#   9 trits  → 2 bytes: 19683 / 65536 = 30.0% efficient (acceptable)
#   27 trits → 6 bytes: 7.6T / 281T   = 2.7% efficient  (sparse but correct)
#
# The efficiency drops at larger scales because we're fighting the fundamental
# 2 vs 3 mismatch. This is acceptable—correctness over density. The 5-trit
# byte boundary is the sweet spot for most operations.
#
# THE 13-STATE GAP:
#
# 256 - 243 = 13 spare states. These aren't wasted—they're used for WEB
# translation (Write/Erase/Burn) for ternary memory emulation:
#
#   States 243-246: Write operations
#   States 247-250: Erase operations
#   States 251-254: Burn operations
#   State 255:      Reserved/escape
#
# WHERE PACKING IS USED (by architectural layer):
#
#   L0 (Kernel):    Packed trit registers, memory-mapped I/O
#   L1 (System):    Syscall argument packing, IPC message formats
#   L2 (Runtime):   Stack frame layout, heap block headers
#   L3 (Framework): Serialization formats, wire protocols
#   L4 (Health):    Compact health vectors, status bitfields
#   L5 (Network):   Packet payload encoding, header compression
#   L6 (Storage):   Disk block format, index node packing
#   L7 (Engine):    State machine encoding, rule compression
#   L8 (App):       User data serialization, config packing
#
# Implementation: L0-universal/libtrit/src/matter/pack.op.c
#
# ───────────────────────────────────────────────────────────────────────────────

# Core packing constants
[resources.packing]
trits_per_byte = 5                                     # 5 trits pack into 1 byte
trit_states    = 243                                   # 3^5 = 243 possible trit combinations
byte_capacity  = 256                                   # 2^8 = 256 possible byte values
gap            = 13                                    # 256 - 243 = 13 spare states for WEB

# Packing efficiency at different widths
[resources.efficiency]
trit5          = 94.9                                  # 243/256 = 94.9% byte utilization
trit9          = 30.0                                  # 19683/65536 = 30.0% utilization
trit27         = 2.7                                   # 7.6T/281T = 2.7% utilization

# WEB translation states (Write/Erase/Burn for ternary memory)
[resources.web]
write          = 243                                   # States 243-246: write operations
erase          = 247                                   # States 247-250: erase operations
burn           = 251                                   # States 251-254: burn operations
reserved       = 255                                   # State 255: reserved/escape sequence

# Standard packing widths and their properties
[resources.widths]
trit5          = { trits = 5,   bytes = 1,  states = 243 }
trit9          = { trits = 9,   bytes = 2,  states = 19683 }
trit27         = { trits = 27,  bytes = 6,  states = 7625597484987 }
trit81         = { trits = 81,  bytes = 18, states = "4.4e38" }
trit243        = { trits = 243, bytes = 49, states = "5.6e115" }

# Architecture alignment for cache and memory efficiency
[resources.alignment]
cache_line     = 64                                    # Typical CPU cache line size (bytes)
page_size      = 4096                                  # Typical memory page size (bytes)
trits_per_line = 320                                   # 64 bytes × 5 trits/byte = 320 trits
trits_per_page = 20480                                 # 4096 bytes × 5 trits/byte = 20,480 trits
blocks_per_page = 84                                   # 20480 / 243 = 84 full 243-trit blocks

# OmniCode scalar type names and sizes
[resources.omnicode_types]
trit1          = { name = "trit",     trits = 1,   bytes = 1 }    # Single trit (padded)
trit3          = { name = "tryte",    trits = 3,   bytes = 1 }    # 3-trit semantic unit
trit5          = { name = "packed5",  trits = 5,   bytes = 1 }    # 5 trits = 1 byte ★
trit9          = { name = "trint9",   trits = 9,   bytes = 2 }    # 9-trit integer
trit27         = { name = "trint27",  trits = 27,  bytes = 6 }    # 27-trit word
trit81         = { name = "trint81",  trits = 81,  bytes = 18 }   # 81-trit extended
trit243        = { name = "trint243", trits = 243, bytes = 49 }   # 243-trit block

# The 243 constant — the byte bridge
[resources.scale_243]
value          = 243                                   # The magic number: 3^5
power          = 5                                     # Five trits
fits_in_byte   = true                                  # 243 < 256
gap            = 13                                    # Spare states for WEB
layer          = "L5"                                  # Network layer in 9-layer arch

# Multiples of 243 for larger structures
[resources.scale_243.units]
x1             = { trits = 243,   states = "5.6e115" }   # 1 × 243 = 243 trits
x3             = { trits = 729,   states = "1.8e347" }   # 3 × 243 = 729 trits
x9             = { trits = 2187,  states = "1.0e1043" }  # 9 × 243 = 2,187 trits
x27            = { trits = 6561,  states = "3.3e3130" }  # 27 × 243 = 6,561 trits
x81            = { trits = 19683, states = "inf" }       # 81 × 243 = 19,683 trits

# 243 in different numeric representations
[resources.scale_243.repr]
decimal        = 243                                   # Base 10
binary         = "11110011"                            # Base 2 (0b11110011)
hex            = "0xF3"                                # Base 16
ternary        = "100000"                              # Base 3 (1×3^5)


# ───────────────────────────────────────────────────────────────────────────────
# Cc.3.2 POWERS — Powers of 3 [resources.powers]
# ───────────────────────────────────────────────────────────────────────────────
#
# "For as the heavens are higher than the earth, so are my ways higher
#  than your ways, and my thoughts than your thoughts." — Isaiah 55:9
#
# POSITIONAL WEIGHTING FOR TRIT CONVERSION
#
# Every positional number system uses powers of its base for place values.
# In balanced ternary, position n has weight 3^n:
#
#   Position:  4    3    2    1    0
#   Weight:   81   27    9    3    1
#   Example:  +1   -1    0   +1   -1  = 81 - 27 + 0 + 3 - 1 = 56
#
# THE ROLE OF POWER TABLES:
#
# Converting between trits and integers requires multiplying by powers of 3.
# Pre-computed power tables eliminate this multiplication:
#
#   • Pack: Use powers for weighted sum (O(n) additions, no multiplications)
#   • Unpack: Use powers for position lookup (O(1) array access)
#
# These tables are compile-time constants embedded in generated code.
#
# SCALE SIGNIFICANCE:
#
#   3^0  = 1           (single trit)
#   3^3  = 27          (tryte — minimal semantic unit)
#   3^5  = 243         (packed byte — binary bridge) ★
#   3^9  = 19,683      (tribble — extended precision)
#   3^27 = 7.6 trillion (trord — full machine word)
#   3^81 = 4.4×10^38   (extended — cognitive space)
#
# Implementation: L0-universal/libtrit/src/matter/pack.op.c
#
# ───────────────────────────────────────────────────────────────────────────────

# Pre-computed power tables for common widths
[resources.powers.tables]

# 5 trits → 1 byte (the most common packing unit)
trit5  = [1, 3, 9, 27, 81]

