# X.3 TROUBLESHOOTING — Common Problems [TROUBLESHOOTING]
# ───────────────────────────────────────────────────────────────────────────────
#
# TOML Syntax Errors:
#
#   "Cannot declare X twice":
#     → Check for duplicate section names
#     → Inline key conflicts with table name (rename inline key)
#
#   "Cannot overwrite a value":
#     → Same key used as value AND as table header
#     → Rename inline key (e.g., structure → structure_pattern)
#
#   "Invalid TOML":
#     → Check array syntax: [1, 2, 3] not 1, 2, 3
#     → Strings need quotes: "value" not value
#     → Multi-line arrays need proper continuation
#
# Math Invariant Failures:
#
#   "identity_sum ≠ 0":
#     → trit.values must be exactly [-1, 0, 1]
#     → Check no accidental modification
#
#   "packing.trit_states ≠ 243":
#     → Must equal 3^5 exactly
#     → The byte bridge constant is mathematical truth
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.4 REFERENCE — Quick Lookup [REFERENCE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Validation Commands:
#   tomlv ternary.toml
#   python3 -c "import tomllib; tomllib.load(open('ternary.toml', 'rb'))"
#
# Math Invariants (must always hold):
#   trit.values = [-1, 0, 1]           # Balanced ternary
#   trit.identity_sum = 0              # -1 + 0 + 1 = 0
#   packing.trit_states = 243          # 3^5 = 243 (byte bridge)
#   packing.gap = 13                   # 256 - 243
#
# Access Patterns:
#
#   Go (runtime):
#     cfg, _ := ternary.Load("ternary.toml")
#     values := cfg.Trit.Values  // []int{-1, 0, 1}
#
#   C (generated):
#     #include "ternary_math.gen.h"
#     static const int8_t TRIT_VALUES[] = {-1, 0, 1};
#
#   Rust (generated):
#     use ternary_math::TRIT_VALUES;
#     const VALUES: [i8; 3] = TRIT_VALUES;
#
#   OmniCode (future):
#     use bereshit.math.ternary
#     let values = trit.values
#
# Key Constants:
#   243 = 3^5  — Byte bridge constant (fits in 256)
#   27  = 3^3  — Cognitive cube positions
#   9   = 3^2  — Temporal/layer count
#   3   = 3^1  — Keys/dimensions/values
#
# ───────────────────────────────────────────────────────────────────────────────

