# ═══════════════════════════════════════════════════════════════════════════════
# Cv.4 TEMPORAL STATES — 9-State Cognitive Model [TEMPORAL]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "To every thing there is a season, and a time to every purpose under
#  the heaven." — Ecclesiastes 3:1
#
# THE 9 COGNITIVE MODES: POSITION IN TIME
#
# This section defines position IN time—not the temporal dimension itself
# (which is defined in Cv.2 and Cv.3), but where consciousness is located
# within the temporal stream and where it's looking.
#
# THE STRUCTURE:
#   3 Base States:     Past / Present / Future (where you ARE)
#   6 Compound States: Lens → Target (where you ARE looking AT)
#   Total: 9 modes (3 + 6)
#
# WHY 9?
# Each temporal position can look at any other position:
#   3 positions × 3 targets = 9 combinations
# But 3 of these are base states (looking at self), leaving 6 compounds.
#
# BASE STATES (lens = target):
#   Past (-1):    Memory, history, foundation
#   Present (0):  Now, current, anchor
#   Future (+1):  Anticipation, planning, direction
#
# COMPOUND STATES (lens ≠ target):
#   Memory:      Past → Present     (past informing now)
#   Prophecy:    Past → Future      (pattern recognition)
#   Reflection:  Present → Past     (analyzing what was)
#   Planning:    Present → Future   (anticipating what will be)
#   Hindsight:   Future → Past      (wisdom from imagined future)
#   Preparation: Future → Present   (urgency from future perspective)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Instruction fetch (past), execute (present), prefetch (future)
#   L1 (System):    Event log (past), state (present), scheduling (future)
#   L2 (Runtime):   Stack history, current frame, call planning
#   L3 (Framework): Request history, current handler, response planning
#   L4 (Health):    Health history, current status, trend prediction
#   L5 (Network):   Packet history, in-flight, queued for send
#   L6 (Storage):   Version history, current state, write-ahead log
#   L7 (Engine):    Decision history, current context, planned actions
#   L8 (App):       User history, current session, predicted behavior
#
# Implementation: libtrit/src/time (C), pkg/core/temporal (Go)
#
# ═══════════════════════════════════════════════════════════════════════════════

[temporal_states]
description = "9-state cognitive model — position in time with viewing direction"
total_modes = 9                                         # 3 base + 6 compound
structure_pattern = "lens (viewing FROM) → target (viewing AT)"

# -------------------------------------------------------------------------------
# 3 Base States: Where in Time (lens = target)
# -------------------------------------------------------------------------------

[temporal_states.base]
description = "Pure temporal positions — where consciousness is located"

past    = { trit = -1, meaning = "what was",     cognitive = "memory, history, foundation",       hebrew = "עָבַר" }
present = { trit = 0,  meaning = "what is",      cognitive = "now, current, anchor",              hebrew = "עַתָּה" }
future  = { trit = 1,  meaning = "what will be", cognitive = "anticipation, planning, direction", hebrew = "עָתִיד" }

# -------------------------------------------------------------------------------
# 6 Compound States: Lens → Target (lens ≠ target)
# -------------------------------------------------------------------------------

[temporal_states.compound]
description = "Compound cognitive modes — viewing one time from another"

# From Past
memory   = { lens = "past", lens_trit = -1, target = "present", target_trit = 0,  description = "past informing now",           cognitive = "experience applied" }
prophecy = { lens = "past", lens_trit = -1, target = "future",  target_trit = 1,  description = "pattern recognition across time", cognitive = "foresight from hindsight" }

# From Present
reflection = { lens = "present", lens_trit = 0, target = "past",   target_trit = -1, description = "analyzing what was",          cognitive = "learning from experience" }
planning   = { lens = "present", lens_trit = 0, target = "future", target_trit = 1,  description = "anticipating what will be",   cognitive = "strategic thinking" }

# From Future
hindsight   = { lens = "future", lens_trit = 1, target = "past",    target_trit = -1, description = "wisdom from imagined future", cognitive = "regret avoidance" }
preparation = { lens = "future", lens_trit = 1, target = "present", target_trit = 0,  description = "urgency from future perspective", cognitive = "deadline awareness" }

# -------------------------------------------------------------------------------
# The 9-State Matrix
# -------------------------------------------------------------------------------

[temporal_states.matrix]
description = "Full 3×3 matrix of temporal modes"

# Matrix layout: [lens][target] where -1=past, 0=present, 1=future
# Diagonal = base states, off-diagonal = compound states
layout = """
              Target:
              Past      Present     Future
Lens: Past    [past]    memory      prophecy
      Present reflection [present]  planning
      Future  hindsight  preparation [future]
"""

# -------------------------------------------------------------------------------
# Temporal Arithmetic
# -------------------------------------------------------------------------------

[temporal_states.arithmetic]
description = "Operations on temporal modes"

# Mode encoding: lens_trit × 3 + target_trit + 4 → index 0-8
encoding = "index = (lens + 1) * 3 + (target + 1)"

# Index mapping
indices = [
    { index = 0, lens = -1, target = -1, mode = "past",        is_base = true },
    { index = 1, lens = -1, target = 0,  mode = "memory",      is_base = false },
    { index = 2, lens = -1, target = 1,  mode = "prophecy",    is_base = false },
    { index = 3, lens = 0,  target = -1, mode = "reflection",  is_base = false },
    { index = 4, lens = 0,  target = 0,  mode = "present",     is_base = true },
    { index = 5, lens = 0,  target = 1,  mode = "planning",    is_base = false },
    { index = 6, lens = 1,  target = -1, mode = "hindsight",   is_base = false },
    { index = 7, lens = 1,  target = 0,  mode = "preparation", is_base = false },
    { index = 8, lens = 1,  target = 1,  mode = "future",      is_base = true }
]

# -------------------------------------------------------------------------------
# Structure Metadata
# -------------------------------------------------------------------------------

[temporal_states.structure]
fields         = ["lens", "target", "is_compound"]
base_count     = 3
compound_count = 6
total_modes    = 9
encoding_base  = 3                                      # 3^2 = 9 combinations
center_index   = 4                                      # Present (0,0) is center


# ═══════════════════════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx CODE GENERATION [GENERATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "So shall my word be that goeth forth out of my mouth: it shall not return
#  unto me void, but it shall accomplish that which I please." — Isaiah 55:11
#
# CODE GENERATION: FROM SPECIFICATION TO IMPLEMENTATION
#
# This TOML specification is the SOURCE OF TRUTH from which actual code is
# generated. The generator reads this file and produces headers, constants,
# and lookup tables for target languages.
#
# MY WORD SHALL NOT RETURN VOID:
#   Isaiah speaks of God's word accomplishing its purpose. Generation takes
#   specification and produces working code — the word becomes implementation.
#   Specification becomes reality. Vision becomes executable.
#
# GENERATION PHILOSOPHY:
#   - TOML is the source of truth
#   - Generated code is derived, never hand-edited
#   - All target languages get the same constants
#   - Regenerate on any spec change
#
# GENERATION CATEGORIES:
#   GENERATE:   Control metadata for the generation process
#   TARGETS:    Language-specific generation rules
#   TEMPLATES:  Code patterns for arrays and sections
#   VALIDATION: Testing the generated code
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    C headers for libtrit, inline asm constants
#   L1 (System):    System-level types and constants
#   L2 (Runtime):   Runtime packages and modules
#   L3 (Framework): OmniCode native constants
#   L4 (Health):    Health scoring constants
#   L5 (Network):   Protocol constants, packet layouts
#   L6 (Storage):   Block format constants
#   L7 (Engine):    Decision table constants
#   L8 (App):       UI constants, user-facing values
#
# Implementation: L0-universal/tools/generate/
# Reference:      L0-universal/foundation/types/primitives.toml [_generate]
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.1 GENERATE — Generation Control Metadata [GENERATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# GENERATION CONTROL: PLANNING BEFORE BUILDING
#
# Generation settings control WHAT gets generated, WHERE it goes, and in WHAT
# ORDER. Counting the cost before building — knowing what you'll produce.
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate]
description  = "Master generation control for ternary.toml"
enabled      = true                                           # Generation is active
version      = "b-01.00"                                      # Generator version

# Output configuration
[_generate.output]
description  = "Where generated files go"
directory    = "L0-universal/libtrit/include/trit/generated/" # Output directory
primary      = "ternary_math.gen.h"                           # Primary output file
order        = 0                                              # Foundation — generates FIRST
guard        = "TERNARY_MATH_GEN_H"                           # Include guard
template     = "complex"                                      # Has arrays needing special formatting

# Dependencies
[_generate.dependencies]
description  = "Files that must be generated first"
requires     = []                                             # Foundation — no dependencies
provides     = ["ternary_math.gen.h", "ternary_math.gen.go"]  # What this generates
blocks       = ["primitives.toml"]                            # Must generate before primitives

# Generation at each layer
[_generate.scales]
description  = "Generation configuration at each architectural layer"
L0_kernel    = { output = "ternary_math.gen.h",               format = "C header" }
L1_system    = { output = "ternary_sys.gen.h",                format = "C system types" }
L2_runtime   = { output = "ternary_math.gen.go",              format = "Go types" }
L3_framework = { output = "ternary.omni",                     format = "OmniCode constants" }
L4_health    = { output = "ternary_health.gen.go",            format = "Health constants" }
L5_network   = { output = "ternary_wire.gen.go",              format = "Wire format" }
L6_storage   = { output = "ternary_storage.gen.go",           format = "Storage constants" }
L7_engine    = { output = "ternary_engine.gen.go",            format = "Engine constants" }
L8_app       = { output = "ternary_app.gen.go",               format = "App constants" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.2 TARGETS — Language-Specific Generation [TARGETS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And there were dwelling at Jerusalem Jews, devout men, out of every nation
#  under heaven... every man heard them speak in his own language."
#  — Acts 2:5,6 KJV
#
# TARGETS: SPEAKING EACH LANGUAGE'S TONGUE
#
# Pentecost saw one message spoken in every hearer's language. Generation takes
# one specification and produces code in each target's native tongue. Same truth,
# different expressions.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2a C_TARGET — C Language Generation [C_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.target.c]
description  = "C language code generation"
enabled      = true
priority     = 1                                              # Generated first (foundational)
file         = "ternary_math.gen.h"
format       = "c_header"

# C naming conventions
[_generate.target.c.naming]
style        = "SCREAMING_SNAKE_CASE"
prefix       = "TRIT_"                                        # All constants prefixed

# C type mappings
[_generate.target.c.types]
description  = "How ternary types map to C types"
trit         = { type = "int8_t",   typedef = "trit_t" }
trit5        = { type = "uint8_t",  typedef = "trit5_t" }
int9         = { type = "int16_t",  typedef = "trit9_t" }
int27        = { type = "int64_t",  typedef = "trit27_t" }

# C at each layer
[_generate.target.c.scales]
description  = "C generation at each architectural layer"
L0_kernel    = { use = "core constants + arrays",             example = "TRIT_VALUES[]" }
L1_system    = { use = "syscall constants",                   example = "TRIT_RESULT_*" }
L2_runtime   = { use = "runtime tables",                      example = "TRIT_ADD_TABLE[][]" }
L3_framework = { use = "framework constants",                 example = "TRIT_WORD_SIZE" }
L4_health    = { use = "health constants",                    example = "TRIT_HEALTH_*" }
L5_network   = { use = "protocol constants",                  example = "TRIT_PACKET_*" }
L6_storage   = { use = "storage constants",                   example = "TRIT_BLOCK_*" }
L7_engine    = { use = "engine tables",                       example = "TRIT_DECISION_*" }
L8_app       = { use = "app constants",                       example = "TRIT_USER_*" }

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2b GO_TARGET — Go Language Generation [GO_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.target.go]
description  = "Go language code generation"
enabled      = true
priority     = 2                                              # After C
file         = "ternary_math.gen.go"
format       = "go_package"
package      = "ternary"

# Go naming conventions
[_generate.target.go.naming]
style        = "PascalCase"
package      = "ternary"

# Go type mappings
[_generate.target.go.types]
description  = "How ternary types map to Go types"
trit         = { type = "int8",   alias = "Trit" }
trit5        = { type = "uint8",  alias = "Trit5" }
int9         = { type = "int16",  alias = "Int9" }
int27        = { type = "int64",  alias = "Int27" }

# Go at each layer
[_generate.target.go.scales]
description  = "Go generation at each architectural layer"
L0_kernel    = { use = "const arrays",                        example = "TritValues" }
L1_system    = { use = "system types",                        example = "TritResult" }
L2_runtime   = { use = "runtime tables",                      example = "AddTable" }
L3_framework = { use = "framework types",                     example = "WordSize" }
L4_health    = { use = "health types",                        example = "HealthScore" }
L5_network   = { use = "protocol types",                      example = "PacketHeader" }
L6_storage   = { use = "storage types",                       example = "BlockFormat" }
L7_engine    = { use = "engine types",                        example = "DecisionTable" }
L8_app       = { use = "app types",                           example = "UserValue" }

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2c RUST_TARGET — Rust Language Generation [RUST_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.target.rust]
description  = "Rust language code generation"
enabled      = false                                          # Reserved for future
priority     = 3                                              # After Go
file         = "ternary_math.gen.rs"
format       = "rust_module"
note         = "Rust generation planned for Phase 3"

# Rust naming conventions
[_generate.target.rust.naming]
const_style  = "SCREAMING_SNAKE_CASE"
static_style = "snake_case"

# Rust type mappings
[_generate.target.rust.types]
description  = "How ternary types map to Rust types"
trit         = { type = "i8",   alias = "Trit" }
trit5        = { type = "u8",   alias = "Trit5" }
int9         = { type = "i16",  alias = "Int9" }
int27        = { type = "i64",  alias = "Int27" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.3 TEMPLATES — Code Generation Templates [TEMPLATES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "The thing that hath been, it is that which shall be; and that which is done
#  is that which shall be done." — Ecclesiastes 1:9 KJV
#
# TEMPLATES: PATTERNS THAT REPEAT WITH VARIATION
#
# Ecclesiastes reminds us that patterns repeat. Templates capture patterns that
# recur across sections — what has been (the pattern) is what shall be (new
# sections from the pattern). Template + data = generated code.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3a SECTIONS — Sections to Generate [SECTIONS]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.sections]
description  = "Sections included in generated output (in order)"

# Core sections — always generated
core = [
    "trit",                                            # TRIT_VALUES, TRIT_STATES, TRIT_BASE
    "trit.chars",                                      # Character representations
    "trit.types",                                      # Type system constants
    "packing",                                         # PACKING_TRITS_PER_BYTE, constants
    "packing.widths",                                  # Width configurations
    "powers.tables",                                   # Power lookup tables
]

# Operation sections — arithmetic and logic
operations = [
    "arithmetic",                                      # Unary operations
    "arithmetic.addition",                             # Addition table
    "arithmetic.multiplication",                       # Multiplication table
    "arithmetic.compare",                              # Comparison table
    "arithmetic.min",                                  # Min table
    "arithmetic.max",                                  # Max table
    "arithmetic.logic_and",                            # Ternary AND
    "arithmetic.logic_or",                             # Ternary OR
    "operations.half_adder",                           # Half adder tables
    "operations.full_adder",                           # Full adder tables
    "algorithms",                                      # Pack/unpack formulas
]

# Cognitive sections — CPI-SI paradigm
cognitive = [
    "building_block",                                  # Building block operations
    "genesis_1_1.dimensions",                          # TIME/SPACE/MATTER
    "dimensions",                                      # Cognitive navigation
    "temporal_states",                                 # 9-state model
]

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3b ARRAYS — Array Formatting Templates [ARRAYS]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.arrays]
description  = "Array fields requiring special C formatting"

# 1D arrays
arrays_1d = [
    "trit.values",                                     # [-1, 0, 1]
    "arithmetic.negation",                             # [1, 0, -1]
    "arithmetic.absolute",                             # [1, 0, 1]
    "arithmetic.sign",                                 # [-1, 0, 1]
    "powers.tables.trit5",                             # [1, 3, 9, 27, 81]
    "powers.tables.trit9",                             # [1, 3, 9, ..., 6561]
]

# 2D arrays
arrays_2d = [
    "arithmetic.addition.table",                       # 3×3 addition
    "arithmetic.multiplication.table",                 # 3×3 multiplication
    "arithmetic.compare.table",                        # 3×3 comparison
    "operations.half_adder.sum",                       # 3×3 half adder sum
    "operations.half_adder.carry",                     # 3×3 half adder carry
]

# 3D arrays
arrays_3d = [
    "operations.full_adder.sum",                       # 3×3×3 full adder sum
    "operations.full_adder.carry_out",                 # 3×3×3 full adder carry
]

# Large arrays (generate as external data)
arrays_large = [
    "powers.tables.trit27",                            # 27 entries
    "powers.tables.trit81",                            # 81 entries
]

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3c HEADER_TEMPLATE — C Header Template [HEADER_TEMPLATE]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.template.header]
description  = "Template for C header generation"

# Comment template
[_generate.template.header.comment]
template     = """
/*
 * {filename} — Generated from {source}
 *
 * Ternary math constants for balanced ternary computing.
 *
 * DO NOT EDIT — Regenerate from TOML source.
 * Generator: L0-universal/tools/generate/
 * Generated: {timestamp}
 */
"""

# Constant template
[_generate.template.header.constant]
template     = "#define {PREFIX}_{NAME} ({value})"
example      = "#define TRIT_VALUES {-1, 0, 1}"

# Array template
[_generate.template.header.array]
template_1d  = "static const {type} {NAME}[{size}] = {values};"
template_2d  = "static const {type} {NAME}[{rows}][{cols}] = {values};"
template_3d  = "static const {type} {NAME}[{d1}][{d2}][{d3}] = {values};"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.4 VALIDATION — Generation Validation [GEN_VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Beloved, believe not every spirit, but try the spirits whether they are of
#  God." — 1 John 4:1 KJV
#
# VALIDATION: TESTING THE GENERATED CODE
#
# Generated code must be tested — don't blindly trust output. Validation ensures
# what was generated matches what was intended. Try the spirits.
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.validation]
description  = "How to validate generated code"
enabled      = true

# Syntax validation
[_generate.validation.syntax]
description  = "Syntax checks for generated code"
c_compile    = "gcc -fsyntax-only -Wall -Werror {file}"
go_build     = "go build -v {package}"
rust_check   = "cargo check"

# Content validation
[_generate.validation.content]
description  = "Content checks for generated code"
has_guard    = "Header must have include guard"
has_arrays   = "All lookup tables must be present"
no_duplicates = "No duplicate definitions"

# Math invariant validation
[_generate.validation.invariants]
description  = "Mathematical invariants that must hold"
trit_values  = "TRIT_VALUES must be [-1, 0, 1]"
identity_sum = "-1 + 0 + 1 must equal 0"
packing      = "PACKING_TRIT_STATES must be 243"
powers       = "Each power entry must be 3^n"

# Round-trip validation
[_generate.validation.roundtrip]
description  = "Verify generated code matches spec"
parse_toml   = "Load TOML, extract values"
parse_header = "Parse generated header, extract values"
compare      = "Values must match exactly"

# Validation at each layer
[_generate.validation.scales]
description  = "Validation at each architectural layer"
L0_kernel    = { check = "compile + invariants",              example = "gcc + check 243" }
L1_system    = { check = "compile only",                      example = "verify types" }
L2_runtime   = { check = "build + unit test",                 example = "go test" }
L3_framework = { check = "build + integration",               example = "framework tests" }
L4_health    = { check = "build + validation",                example = "health tests" }
L5_network   = { check = "build + wire tests",                example = "protocol tests" }
L6_storage   = { check = "build + storage tests",             example = "persistence tests" }
L7_engine    = { check = "build + engine tests",              example = "decision tests" }
L8_app       = { check = "full test suite",                   example = "end-to-end tests" }


