# POSITIONAL WEIGHTING FOR TRIT CONVERSION
#
# Every positional number system uses powers of its base for place values.
# In balanced ternary, position n has weight 3^n:
#
#   Position:  4    3    2    1    0
#   Weight:   81   27    9    3    1
#   Example:  +1   -1    0   +1   -1  = 81 - 27 + 0 + 3 - 1 = 56
