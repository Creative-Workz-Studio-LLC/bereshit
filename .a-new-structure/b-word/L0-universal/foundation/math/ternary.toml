# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Mathematical constants are exact values. Lookup tables are complete truth tables. No approximations."

# ─────────────────────────────────────────────────────────────
# SPLIT FILE OVERVIEW
# ─────────────────────────────────────────────────────────────
#
# This index documents the split ternary math specification.
# Content lives in 4 focused files:
#
#   ternary-definitions.toml  — Cc.1-4 (What a trit IS)
#     Cc.1 IDENTITY   — What is a trit?
#     Cc.2 SETTINGS   — Primary definitions (chars, types, composition, scales)
#     Cc.3 RESOURCES  — Storage constraints (packing, widths, alignment, powers)
#     Cc.4 BEHAVIOR   — How it operates (omnicode, cpisi, layers, network)
#
#   ternary-operations.toml   — Co.1-6 (How trits compute)
#     Co.1 ARITHMETIC — Basic trit operations (add, subtract, multiply, etc.)
#     Co.2 HALF ADDER — Two-input addition (sum + carry)
#     Co.3 FULL ADDER — Three-input addition (a + b + carry)
#     Co.4 SUBTRACTION — Via negation (negate then add)
#     Co.5 DIVISION — Balanced ternary division
#     Co.6 ALGORITHMS — Pack/unpack conversion (trit ↔ byte bridge)
#
#   ternary-cognition.toml    — Cv.1-4 (How trits think)
#     Cv.1 BUILDING BLOCK — Trit-to-operation mapping (CPI-SI reasoning)
#     Cv.2 GENESIS 1:1 — TIME/SPACE/MATTER constants
#     Cv.3 DIMENSIONS — Cognitive navigation framework (27-cube)
#     Cv.4 TEMPORAL STATES — 9-state cognitive model
#
#   ternary-generation.toml   — Cx.1-4 (How trits become code)
#     Cx.1 GENERATE — Generation control metadata
#     Cx.2 TARGETS — Language-specific generation (C, Go, Rust)
#     Cx.3 TEMPLATES — Code generation templates
#     Cx.4 VALIDATION — Generation validation

[index]
type = "split_index"
total_files = 4
total_sections = 18
original_lines = 2414

[index.key_constants]
balanced_equation = "-1 + 0 + 1 = 0"
byte_bridge = "243 = 3^5 < 256 = 2^8"
cube_positions = "27 = 3^3"
temporal_layers = "9 = 3^2"
trit_values = "3 = 3^1"

[index.files]
definitions = { file = "ternary-definitions.toml", lines = 565, sections = "Cc.1-4" }
operations = { file = "ternary-operations.toml", lines = 745, sections = "Co.1-6" }
cognition = { file = "ternary-cognition.toml", lines = 617, sections = "Cv.1-4" }
generation = { file = "ternary-generation.toml", lines = 460, sections = "Cx.1-4" }

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

