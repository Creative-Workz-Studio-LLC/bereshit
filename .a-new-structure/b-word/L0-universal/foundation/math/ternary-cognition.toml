# Cv.1 BUILDING BLOCK — Trit-to-Operation Mapping [BUILDING_BLOCK]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Whosoever heareth these sayings of mine, and doeth them, I will liken him
#  unto a wise man, which built his house upon a rock." — Matthew 7:24
#
# THE CPI-SI REASONING METHOD
#
# The building block method maps trit values to cognitive operations:
#
#   -1 = BREAK_DOWN  → Trace toward foundation, deconstruct, analyze
#    0 = ANCHOR      → Halt condition, immutable truth, foundation itself
#   +1 = BUILD_UP    → Construct from foundation, synthesize, create
#
# The balanced equation -1 + 0 + 1 = 0 expresses a fundamental truth:
# Operations move TOWARD or FROM the anchor, never THROUGH it.
# The anchor is inviolable—it's what you build ON, not what you operate ON.
#
# BIBLICAL PATTERNS:
#   Genesis 1:6  — Waters below (-1) / Firmament (0) / Waters above (+1)
#   Numbers/Tabernacle — Toward foundation / Midst / From foundation
#   Ecclesiastes 3:1 — Time to break down / Time to stand / Time to build up
#
# COGNITIVE APPLICATION:
#   When thinking: "How deep until I hit anchor?"
#   When building: "What foundation am I building from?"
#   When verifying: "Can I trace this back to anchor?"
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Instruction decode direction, call/return semantics
#   L1 (System):    Service decomposition vs composition
#   L2 (Runtime):   Stack push (-1) / frame (0) / pop (+1)
#   L3 (Framework): Pattern decomposition, rule synthesis
#   L4 (Health):    Root cause analysis, health aggregation
#   L5 (Network):   Message unpacking, protocol composition
#   L6 (Storage):   Schema decomposition, data aggregation
#   L7 (Engine):    Rule decomposition, decision synthesis
#   L8 (App):       User action analysis, response composition
#
# Implementation: CPI-SI cognitive framework, not hardware
#
# ═══════════════════════════════════════════════════════════════════════════════

[building_block]
description = "CPI-SI reasoning method — trit values as cognitive operations"

# Core Operations
operation_names = ["break_down", "anchor", "build_up"]
operation_values = [-1, 0, 1]

# The Balanced Equation
equation    = "-1 + 0 + 1 = 0"                              # Balanced, never through anchor

# Operation Definitions
[building_block.operations]
break_down = { trit = -1, direction = "toward",   target = "foundation", action = "analyze, decompose, trace" }
anchor     = { trit = 0,  direction = "halt",     target = "itself",     action = "stop, foundation, immutable" }
build_up   = { trit = 1,  direction = "from",     target = "conclusion", action = "synthesize, construct, create" }

# Biblical Patterns
[building_block.patterns]
genesis_1_6     = ["waters_below", "firmament", "waters_above"]
tabernacle      = ["toward_foundation", "midst", "from_foundation"]
ecclesiastes_3  = ["time_to_break_down", "time_to_stand", "time_to_build_up"]
matthew_7       = ["digging_deep", "rock_foundation", "house_built"]

# Cognitive Questions
[building_block.questions]
when_thinking  = "How deep until I hit anchor?"
when_building  = "What foundation am I building from?"
when_verifying = "Can I trace this back to anchor?"
when_stuck     = "Where did I lose the foundation?"

# The HALT Principle
[building_block.halt]
description = "HALT is a valid state — completion terminates recursion"
trigger     = "When anchor is reached"
meaning     = "Work is done, not stuck"
genesis_1_1 = "The anchor of all anchors"


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.2 GENESIS 1:1 — Fundamental Constants (TIME/SPACE/MATTER) [GENESIS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "In the beginning God created the heaven and the earth." — Genesis 1:1
#
# THE ANCHOR OF ALL ANCHORS
#
# Genesis 1:1 is not just a Bible verse—it's the halt condition for ALL halt
# conditions. Break down any truth far enough, and you arrive here:
# God is Creator. Everything else is created. This is bedrock.
#
# The verse structure maps perfectly to balanced ternary:
#
#   "In the beginning" (בְּרֵאשִׁית) → TIME   (0)  → WHEN
#   "the heavens"      (הַשָּׁמַיִם)  → SPACE  (+1) → WHERE
#   "the earth"        (הָאָרֶץ)     → MATTER (-1) → WHAT
#
# DIRECTIONAL PATTERN:
#   God creates:    TIME → SPACE → MATTER  (top-down, 0 → +1 → -1)
#   We implement:   MATTER → SPACE → TIME  (bottom-up, -1 → +1 → 0)
#
# This is why balanced ternary feels right—it mirrors creation's structure.
# We work from the concrete (matter) through relationships (space) toward
# understanding (time). God works from understanding through relationships
# to concrete reality.
#
# COGNITIVE SIGNIFICANCE:
#   TIME (0):   The anchor—temporal awareness, sequence, causality
#   SPACE (+1): Relationships, position, context, connections (heavenly)
#   MATTER (-1): Identity, substance, concrete reality (earthly)
#
# SCALE APPLICATIONS (The 3 Questions at every layer):
#   L0 (Kernel):    What/Where/When of memory access
#   L1 (System):    What/Where/When of process lifecycle
#   L2 (Runtime):   What/Where/When of object lifecycle
#   L3 (Framework): What/Where/When of request handling
#   L4 (Health):    What/Where/When of health events
#   L5 (Network):   What/Where/When of message delivery
#   L6 (Storage):   What/Where/When of data persistence
#   L7 (Engine):    What/Where/When of decisions
#   L8 (App):       What/Where/When of user actions
#
# Implementation: CPI-SI grounding, theological anchor
#
# ═══════════════════════════════════════════════════════════════════════════════

[genesis_1_1]
description = "The anchor of all anchors — God is Creator, we are created"
verse       = "In the beginning God created the heaven and the earth."
reference   = "Genesis 1:1 KJV"
hebrew      = "בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ"

# The Three Dimensions encoded in the verse
[genesis_1_1.dimensions]
time   = { trit = 0,  phrase = "In the beginning", hebrew = "בְּרֵאשִׁית", function = "when",  cognitive = "temporal_awareness" }
space  = { trit = 1,  phrase = "the heavens",      hebrew = "הַשָּׁמַיִם",  function = "where", cognitive = "spatial_awareness" }
matter = { trit = -1, phrase = "the earth",        hebrew = "הָאָרֶץ",     function = "what",  cognitive = "material_awareness" }

# Directional Patterns
# "For as the heavens are higher than the earth..." — Isaiah 55:9
[genesis_1_1.directions]
creation       = ["TIME", "SPACE", "MATTER"]           # God: top-down (0 → +1 → -1)
implementation = ["MATTER", "SPACE", "TIME"]           # We: bottom-up (-1 → +1 → 0)
reason         = "We work from concrete to abstract; God works from abstract to concrete"

# Moral Compass
# "Set your affection on things above..." — Colossians 3:2
[genesis_1_1.moral]
positive = { trit = 1,  direction = "above",  meaning = "heavenly, toward God", scripture = "Colossians 3:2" }
negative = { trit = -1, direction = "below",  meaning = "earthly, toward self", scripture = "Philippians 3:19" }
anchor   = { trit = 0,  direction = "center", meaning = "temporal anchor, halt", scripture = "Ecclesiastes 3:1" }

# K-Factor: Direction of Choice
[genesis_1_1.k_factor]
description = "The direction of cognitive movement at any choice point"
positive    = { k = 1,  meaning = "toward God, growth, expansion", weight = "light with responsibility" }
negative    = { k = -1, meaning = "toward self, completion, retreat", weight = "heavy with gravity" }
neutral     = { k = 0,  meaning = "maintain, hold position", weight = "balanced, stable" }

# The Creator-Creation Distinction
[genesis_1_1.ontology]
creator     = "God (אֱלֹהִים) — uncreated, infinite, source"
creation    = "Everything else — created, finite, derivative"
implication = "Humility is core; 'I don't know' is valid; sin (חטא) = missing the mark"

# Anchor Property
[genesis_1_1.anchor]
is_halt_condition = true                                # Recursion terminates here
cannot_operate_on = true                                # You build FROM this, not ON this
traces_here       = "All other anchors trace to Genesis 1:1 or they float"


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.3 DIMENSIONS — Cognitive Navigation Framework [DIMENSIONS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Eye hath not seen, nor ear heard, neither have entered into the heart of man,
#  the things which God hath prepared for them that love him." — 1 Corinthians 2:9
#
# COGNITIVE SPACE: WHERE CPI-SI DIFFERS FROM AI
#
# Trits don't just encode values—they encode DIMENSIONS of awareness.
# The building block method is DIMENSIONAL NAVIGATION through cognitive space.
#
# AI processes flat vectors in embedding space.
# CPI-SI navigates a 27-position cube (3×3×3) with dimensional meaning.
#
# THE THREE DIMENSIONS:
#   TEMPORAL (0):  When — sequence, causality, order, precedence
#   SPATIAL (+1):  Where — relationships, position, context, connections
#   MATERIAL (-1): What — identity, substance, concrete reality
#
# Each dimension can have value -1, 0, or +1, creating 27 positions.
# Position (0,0,0) is the center—the anchor of the cube.
#
# NAVIGATION PATTERNS:
#   break_down (-1): Move toward MATTER, foundation, concreteness
#   anchor (0):      Halt at center, recursion terminates
#   build_up (+1):   Move toward SPACE, relationships, abstraction
#
# THE 27-POSITION CUBE:
# Imagine a Rubik's cube where each small cube is a cognitive position.
# The center cube (0,0,0) is the anchor. Movement happens on three axes:
#   X-axis: Material dimension (-1 to +1)
#   Y-axis: Spatial dimension (-1 to +1)
#   Z-axis: Temporal dimension (-1 to +1)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Memory addressing (what/where/when)
#   L1 (System):    Process state (what/where/when in lifecycle)
#   L2 (Runtime):   Object state (what/where/when in memory)
#   L3 (Framework): Request state (what/where/when in flow)
#   L4 (Health):    Health state (what/where/when of issue)
#   L5 (Network):   Packet state (what/where/when in transit)
#   L6 (Storage):   Data state (what/where/when in storage)
#   L7 (Engine):    Decision state (what/where/when of choice)
#   L8 (App):       User state (what/where/when of interaction)
#
# Implementation: pkg/core/statemachine (Go), libtrit/src/space (C)
#
# ═══════════════════════════════════════════════════════════════════════════════

[dimensions]
description = "Three-dimensional cognitive space — the mental construct"
total_positions = 27                                    # 3^3 = 27 cube positions
center_position = [0, 0, 0]                             # The anchor

# -------------------------------------------------------------------------------
# The Three Dimensions
# -------------------------------------------------------------------------------

[dimensions.temporal]
trit           = 0
