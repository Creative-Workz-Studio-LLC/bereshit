# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('translation.toml','rb'))\""]

[_validation.schema]
required = ["pronoun", "verb", "vocab", "phrase", "theo"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_tables_valid = 30
data_completeness = 30

