# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Index file — references split content files. No bible data defined here."

# ─────────────────────────────────────────────────────────────
# SPLIT FILE OVERVIEW
# ─────────────────────────────────────────────────────────────
#
# The Bible system maps between Scripture and OmniCode.
# Structure: Encoding/Decoding (syntax) → Addressing (verses) →
#            Encryption/Decryption (letters) → Text (storage) → Translation (versions)
#
# Organization Pattern:
#   ENCODING     — Scripture → OmniCode (Hebrew roots, Greek terms, patterns, numbers)
#   DECODING     — OmniCode → Scripture (keyword, type, pattern, operator reverse lookup)
#   ADDRESSING   — Verse → Ordinal → Ternary (66 books, 31,102 KJV + 13 WEB)
#   ENCRYPTION   — Letter → Position → Coordinates → Value (27 Hebrew, 27 Greek)
#   DECRYPTION   — Coordinates → Position → Letter → Value (reverse of encryption)
#   SCRIPTURE    — Character → Trit5 → Byte (243 chars, indexed binary format)
#   TRANSLATION  — KJV ↔ WEB (pronouns, verbs, vocab, phrases, theological terms)
#
# ─────────────────────────────────────────────────────────────

[index]
type = "split_index"
total_files = 7

[index.key_constants]
total_hebrew_roots = 11
total_greek_terms = 7
total_creation_patterns = 7
total_covenant_patterns = 5
total_genealogy_patterns = 4
total_number_symbols = 11
total_keywords_decoded = 30
total_types_decoded = 11
total_books = 66
kjv_verses = 31102
web_variants = 13
hebrew_letters = 27
greek_letters = 27
character_table_size = 243

[index.files]
encoding = { file = "encoding.toml", tables = "hebrew, greek, creation, covenant, genealogy, numbers" }
decoding = { file = "decoding.toml", tables = "keyword, type, pattern, operator" }
addressing = { file = "addressing.toml", tables = "address_space, books, ternary, web_variants" }
encryption = { file = "encryption.toml", tables = "system, functions, hebrew, greek" }
decryption = { file = "decryption.toml", tables = "system, functions, hebrew, greek" }
scripture_text = { file = "scripture-text.toml", tables = "character_table, extended_characters, file_format, encoding" }
translation = { file = "translation.toml", tables = "pronoun, verb, vocab, phrase, theo" }

# ─────────────────────────────────────────────────────────────
# THE BIBLE SYSTEM FLOW
# ─────────────────────────────────────────────────────────────
#
# Scripture → OmniCode (ENCODING direction):
#   encoding.toml: Hebrew roots, Greek terms, biblical patterns → syntax
#   encryption.toml: Letters → cube positions → gematria values
#   scripture-text.toml: Characters → trit5 values → binary storage
#   translation.toml: KJV (formal/archaic) → WEB (modern/accessible)
#
# OmniCode → Scripture (DECODING direction):
#   decoding.toml: Keywords, types, patterns, operators → biblical source
#   decryption.toml: Cube positions → letters → gematria values
#   scripture-text.toml: Trit5 values → characters → text retrieval
#   translation.toml: WEB (modern) → KJV (archaic/formal)
#
# Verse Addressing (NAVIGATION):
#   addressing.toml: Book/Chapter/Verse ↔ Ordinal ↔ Ternary
#
# TOTAL: 7 files, bidirectional, ternary-native
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for index file"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "python3 -c \"import tomllib; tomllib.load(open('bible.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('encoding.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('decoding.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('addressing.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('encryption.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('decryption.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('scripture-text.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('translation.toml','rb'))\"",
]

[_validation.schema]
required = ["index"]
optional = ["index.key_constants", "index.files", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_split_files_valid = 30
index_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
