# #!omni data --toml

# ═══════════════════════════════════════════════════════════════
# OMNICODE PRAGMA [PRAGMA]
# ═══════════════════════════════════════════════════════════════

[_pragma]
format = "@omni data --toml"

[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

[_pragma.P1_core]
key = "B-L0-bible"
from = "b-word/seed/data/toml/config.toml"
at = "b-01.00"

[_pragma.P2_family]
type = "data"
subtype = "bible"
role = "foundation"
structure = "3-block"

[_pragma.P3_instance]
component = "bible"
layer = "L0-universal/bible"
includes = "none"
provides = ["BIBLE_INDEX", "SPLIT_DOCUMENTATION"]

[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
title = "Bible System Index"
brief = "Index for the Bible system — Scripture encoding, decoding, addressing, encryption, decryption, translation, text storage"

# ═══════════════════════════════════════════════════════════════
# END PRAGMA [END]
