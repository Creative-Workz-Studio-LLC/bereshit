# -----------------------------------------------------------------------------
# 3. File Format - Binary Scripture Storage
# -----------------------------------------------------------------------------
# Combined binary file storing 62,204 verses (31,102 KJV + 31,102 WEB).
# Structure: HEADER → VERSE INDEX → TEXT DATA
#
# Design goals:
#   - Random access: Jump to any verse by ordinal in O(1)
#   - Compact storage: ~4.6MB for all Scripture text
#   - Version-aware: KJV and WEB stored together

[file_format]
description = "Binary Scripture file format"
filename = "scripture.bin"
location = "word/scripture/scripture.bin"
total_verses = 62204
kjv_verses = 31102
web_verses = 31102
note = "Combined storage for both KJV and WEB translations"

# -----------------------------------------------------------------------------
# 3a. HEADER Section
# -----------------------------------------------------------------------------
# Fixed-size header at start of file

[file_format.header]
description = "File header with metadata and offsets"
size_bytes = 64
note = "Fixed size allows direct offset calculation"

[file_format.header.fields]
magic = { offset = 0, size = 4, value = "SCRP", note = "Magic number for identification" }
version = { offset = 4, size = 2, value = 1, note = "File format version" }
flags = { offset = 6, size = 2, value = 0, note = "Reserved for future flags" }
kjv_count = { offset = 8, size = 4, value = 31102, note = "Number of KJV verses" }
web_count = { offset = 12, size = 4, value = 31102, note = "Number of WEB verses" }
index_offset = { offset = 16, size = 8, note = "Byte offset to verse index" }
data_offset = { offset = 24, size = 8, note = "Byte offset to text data" }
kjv_data_size = { offset = 32, size = 8, note = "Total bytes of KJV text" }
web_data_size = { offset = 40, size = 8, note = "Total bytes of WEB text" }
reserved = { offset = 48, size = 16, note = "Reserved for future use" }

# -----------------------------------------------------------------------------
# 3b. VERSE INDEX Section
# -----------------------------------------------------------------------------
# Array of index entries, one per verse (62,204 total)
# Enables O(1) random access to any verse

[file_format.index]
description = "Verse index for random access"
entry_size = 8
total_entries = 62204
note = "Index immediately follows header"

[file_format.index.entry]
description = "Single index entry"
text_offset = { offset = 0, size = 4, note = "Byte offset into text data section" }
text_length = { offset = 4, size = 2, note = "Length of verse text in bytes" }
flags = { offset = 6, size = 1, note = "Verse flags (variant marker, etc.)" }
reserved = { offset = 7, size = 1, note = "Reserved" }

[file_format.index.layout]
kjv_range = { start = 0, end = 31101, note = "Indices 0-31101 = KJV verses 1-31102" }
web_range = { start = 31102, end = 62203, note = "Indices 31102-62203 = WEB verses 1-31102" }
note = "KJV index i → verse (i+1). WEB index i → verse (i-31101)."

# -----------------------------------------------------------------------------
# 3c. TEXT DATA Section
# -----------------------------------------------------------------------------
# Packed trit5 encoded verse text

[file_format.data]
description = "Verse text encoded as trit5 bytes"
format = "trit5"
note = "Each character → trit5 value (0-242) → stored as byte"

[file_format.data.layout]
kjv_section = { note = "All KJV verses, contiguous, order 1-31102" }
web_section = { note = "All WEB verses, contiguous, order 1-31102" }
separator = { note = "NUL (0x00) terminates each verse" }

[file_format.data.char_encoding]
character_to_trit5 = "Direct ASCII value for 0-127, extended table for 128-242"
verse_terminator = 0
note = "Each verse is NUL-terminated sequence of trit5 bytes"

# -----------------------------------------------------------------------------
# 3d. Access Patterns
# -----------------------------------------------------------------------------

[file_format.access]
description = "How to access verses in the binary file"

[file_format.access.by_ordinal]
description = "Access verse by KJV ordinal (1-31102)"
algorithm = """
# KJV verse by ordinal
kjv_index = ordinal - 1
entry_offset = header.index_offset + (kjv_index * 8)
# Read 8-byte entry at entry_offset
# Jump to header.data_offset + entry.text_offset
# Read entry.text_length bytes
"""

[file_format.access.by_version]
description = "Access verse by version and ordinal"
algorithm = """
# Version-aware access
if version == KJV:
    index = ordinal - 1
else:  # WEB
    index = 31102 + (ordinal - 1)
entry_offset = header.index_offset + (index * 8)
# Same entry read and data jump as above
"""

[file_format.access.size_estimate]
header = 64
index_per_verse = 8
index_total = 497632  # 62204 * 8
kjv_text_estimate = 4400000  # ~4.4MB plain text
web_text_estimate = 4400000  # ~4.4MB plain text (similar to KJV)
total_estimate = 9297696  # ~9.3MB total
note = "Actual size depends on text compression and encoding efficiency"


# -----------------------------------------------------------------------------
# 4. Encoding Algorithms
# -----------------------------------------------------------------------------
# Text → trit5 → binary and reverse

[encoding]
description = "Character encoding and decoding algorithms"

# -----------------------------------------------------------------------------
# 4a. Text to Trit5
# -----------------------------------------------------------------------------

[encoding.char_to_trit5]
description = "Convert single character to trit5 value"
algorithm = """
def char_to_trit5(char):
    code = ord(char)
    if code <= 127:
        # ASCII range: direct mapping
        return code
    elif code in extended_table:
        # Extended range: lookup mapping
        return extended_table[code]
    else:
        # Unknown character: use replacement
        return 63  # '?' character
"""

[encoding.text_to_bytes]
description = "Convert text string to trit5 byte sequence"
algorithm = """
def text_to_bytes(text):
    result = []
    for char in text:
        result.append(char_to_trit5(char))
    result.append(0)  # NUL terminator
    return bytes(result)
"""

# -----------------------------------------------------------------------------
# 4b. Trit5 to Text
# -----------------------------------------------------------------------------

[encoding.trit5_to_char]
description = "Convert trit5 value to character"
algorithm = """
def trit5_to_char(value):
    if value <= 127:
        # ASCII range: direct mapping
        return chr(value)
    elif value in reverse_extended_table:
        # Extended range: reverse lookup
        return reverse_extended_table[value]
    else:
        # Unknown value: use replacement
        return '?'
"""

[encoding.bytes_to_text]
description = "Convert trit5 byte sequence to text string"
algorithm = """
def bytes_to_text(data):
    result = []
    for byte in data:
        if byte == 0:
            break  # NUL terminator
        result.append(trit5_to_char(byte))
    return ''.join(result)
"""

# -----------------------------------------------------------------------------
# 4c. Verse Encoding
# -----------------------------------------------------------------------------

[encoding.verse]
description = "Encode complete verse for storage"
algorithm = """
def encode_verse(text, ordinal, version):
    # Convert text to trit5 bytes
    encoded = text_to_bytes(text)

    # Create index entry
    entry = IndexEntry(
        text_offset=current_data_offset,
        text_length=len(encoded),
        flags=0 if version == KJV else 1
    )

    return entry, encoded
"""

[encoding.decode_verse]
description = "Decode verse from storage"
algorithm = """
def decode_verse(data, entry):
    # Extract verse bytes using index entry
    verse_bytes = data[entry.text_offset:entry.text_offset + entry.text_length]

    # Convert back to text
    return bytes_to_text(verse_bytes)
"""

# -----------------------------------------------------------------------------
# 4d. Full File Encoding
# -----------------------------------------------------------------------------

[encoding.build_file]
description = "Build complete scripture.bin file"
algorithm = """
def build_scripture_file(kjv_verses, web_verses):
    # 1. Build header
    header = Header(
        magic=b'SCRP',
        version=1,
        kjv_count=len(kjv_verses),
        web_count=len(web_verses)
    )

    # 2. Build index and data sections
    index_entries = []
    text_data = bytearray()

    # KJV verses first
    for ordinal, text in kjv_verses:
        entry, encoded = encode_verse(text, ordinal, KJV)
        index_entries.append(entry)
        text_data.extend(encoded)

    # WEB verses second
    for ordinal, text in web_verses:
        entry, encoded = encode_verse(text, ordinal, WEB)
        index_entries.append(entry)
        text_data.extend(encoded)

    # 3. Calculate offsets
    header.index_offset = 64  # After header
    header.data_offset = 64 + (len(index_entries) * 8)

    # 4. Write file
    write_header(header)
    write_index(index_entries)
    write_data(text_data)
"""

[encoding.notes]
reversibility = "encode(decode(x)) == x for all valid inputs"
efficiency = "ASCII-compatible - most Scripture text is 1 byte per character"
extensibility = "115 spare values available for future character additions"


