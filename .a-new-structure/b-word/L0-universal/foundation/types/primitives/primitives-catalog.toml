# ─────────────────────────────────────────────────────────────
# Co — Content Operations (Cc.1: Catalog)
# ─────────────────────────────────────────────────────────────

# Cc.1 IDENTITY — What Primitives ARE [IDENTITY]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "In the beginning God created the heaven and the earth." — Genesis 1:1 KJV
#
# PRIMITIVE TYPES: THE ATOMIC BUILDING BLOCKS
#
# Before anything complex, God established the fundamentals. Primitives are the
# atoms of the OmniCode type system — indivisible types from which all other
# types compose. Just as Genesis 1:1 establishes the foundation for all creation,
# these primitives establish the foundation for all data representation.
#
# WHAT MAKES OMNICODE'S TYPE SYSTEM DISTINCT:
#
#   1. TERNARY-NATIVE: Types sized by powers of 3 (trit, trit5, int9, int27, int81)
#      rather than powers of 2. This aligns with balanced ternary mathematics.
#
#   2. BINARY BRIDGED: We run on binary hardware until MillenniumOS. The storage
#      layer (the "firmament") bridges binary reality and ternary conceptual types.
#      3^5 = 243 fits in 2^8 = 256 — the byte bridge with 13 spare states.
#
#   3. HONEST ABOUT UNCERTAINTY: bool3 has THREE values (false/unknown/true),
#      not two. When you don't know, you can say so. Yea, yea; nay, nay.
#
#   4. SCRIPTURE-GROUNDED: Each type category carries biblical meaning.
#      The threefold cord, the firmament, the Word made flesh — types as theology.
#
#   5. SCALE-AWARE: Every type knows its role at each architectural layer (L0-L8).
#      A trit means different things at kernel level vs application level.
#
# THE COMPLETE PRIMITIVE CATALOG (23 Types):
#
#   STORAGE (2):     uint8, int8 — binary bridge containers
#   TRIT (2):        trit, trit5 — balanced ternary foundation
#   INTEGER (8):     int9, uint9, int27, uint27, int81, uint81, int243, uint243
#   FLOAT (1):       float27 — ternary floating point
#   TEXT (2):        text, char — UTF-8 strings and characters
#   BOOLEAN (1):     bool3 — ternary logic (false/unknown/true)
#   COLLECTIONS (3): list<T>, map<K,V>, set<T> — parameterized containers
#   SPECIAL (2):     void, any — type system boundaries
#   DECIMAL (1):     decimal27 — fixed-point precision
#   TEMPORAL (2):    timestamp, duration — time primitives
#
# WHY THESE 23 TYPES (NOT MORE, NOT FEWER):
#
#   - STORAGE bridges binary hardware to ternary logic (necessary until native hw)
#   - TRIT is the atom; compositions build from it (1, 5, 9, 27, 81, 243 trits)
#   - INTEGER covers signed/unsigned at each meaningful ternary scale
#   - FLOAT provides continuous measurement (creation measured in spans)
#   - TEXT carries meaning (the Word)
#   - BOOLEAN enables honest logic with uncertainty
#   - COLLECTIONS organize the many into comprehensible wholes
#   - SPECIAL marks the boundaries (void = nothing returns; any = type unknown)
#   - DECIMAL provides exact representation (just weights, no false balance)
#   - TEMPORAL grounds us in time (a time to every purpose)
#
# Implementation: L0-universal/libtrit/ (C library)
# Reference:      L0-universal/foundation/math/ternary.toml (mathematical foundation)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cc.1.1 TYPE CATALOG — The Complete Primitive List [CATALOG]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And God saw every thing that he had made, and, behold, it was very good."
#  — Genesis 1:31 KJV
#
# The complete catalog of primitive types, organized by category.
# Each type is defined in detail in subsequent sections.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.identity.catalog]
description = "The 23 primitive types that form OmniCode's type system foundation"

# Category counts
total_types = 23
categories  = 10

# Type listing by category
[cc.identity.catalog.storage]
description = "Binary hardware bridge — the firmament between hardware and logic"
scripture   = "Genesis 1:6 — Let there be a firmament in the midst of the waters"
types       = ["uint8", "int8"]
count       = 2
purpose     = "Store ternary values in binary hardware until MillenniumOS"

[cc.identity.catalog.trit]
description = "Balanced ternary foundation — the atom of ternary computing"
scripture   = "Ecclesiastes 4:12 — A threefold cord is not quickly broken"
types       = ["trit", "trit5"]
count       = 2
purpose     = "Indivisible ternary units: single trit and 5-trit packed byte"

[cc.identity.catalog.integer]
description = "Ternary-sized whole numbers — counting and measuring"
scripture   = "Numbers 1:2 — Take ye the sum of all the congregation"
types       = ["int9", "uint9", "int27", "uint27", "int81", "uint81", "int243", "uint243"]
count       = 8
purpose     = "Signed and unsigned integers at each ternary scale (3^2, 3^3, 3^4, 3^5)"

[cc.identity.catalog.float]
description = "Ternary floating point — precise measurement"
scripture   = "Isaiah 40:12 — Who hath measured the waters in the hollow of his hand"
types       = ["float27"]
count       = 1
purpose     = "Continuous values with balanced ternary mantissa and exponent"

[cc.identity.catalog.text]
description = "String and character — the Word made accessible"
scripture   = "John 1:1 — In the beginning was the Word"
types       = ["text", "char"]
count       = 2
purpose     = "UTF-8 encoded text for meaning communication"

[cc.identity.catalog.boolean]
description = "Ternary logic — honest about uncertainty"
scripture   = "Matthew 5:37 — Let your yea be yea; and your nay, nay"
types       = ["bool3"]
count       = 1
purpose     = "Three-valued logic: false (-1), unknown (0), true (+1)"

[cc.identity.catalog.collections]
description = "Parameterized containers — gathering and organizing"
scripture   = "Genesis 5:1 — These are the generations of Adam"
types       = ["list", "map", "set"]
count       = 3
purpose     = "Generic containers: ordered lists, key-value maps, unique sets"

[cc.identity.catalog.special]
description = "Type system boundaries — void and any"
scripture   = "Genesis 1:2 — The earth was without form, and void"
types       = ["void", "any"]
count       = 2
purpose     = "Edge cases: void (no return), any (runtime type)"

[cc.identity.catalog.decimal]
description = "Fixed-point precision — exact representation"
scripture   = "Proverbs 11:1 — A false balance is abomination to the LORD"
types       = ["decimal27"]
count       = 1
purpose     = "Exact numeric representation without floating point surprises"

[cc.identity.catalog.temporal]
description = "Time primitives — moments and durations"
scripture   = "Ecclesiastes 3:1 — To every thing there is a season"
types       = ["timestamp", "duration"]
count       = 2
purpose     = "Absolute moments and relative spans in nanosecond precision"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.1.2 DISTINCTIONS — What Makes This System Unique [DISTINCTIONS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "There is none like unto the God of Jeshurun, who rideth upon the heaven"
#  — Deuteronomy 33:26 KJV
#
# What distinguishes OmniCode's primitive types from other type systems.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.identity.distinctions]
description = "What makes OmniCode's type system distinct from binary-native systems"

[cc.identity.distinctions.ternary_native]
principle   = "Types sized by powers of 3, not powers of 2"
sizes       = [1, 3, 9, 27, 81, 243]
rationale   = "Balanced ternary has mathematical elegance: -1 + 0 + 1 = 0"
contrast    = "Binary types (8, 16, 32, 64 bit) vs ternary types (9, 27, 81 trit)"

[cc.identity.distinctions.binary_bridged]
principle   = "Binary stores, ternary interprets"
insight     = "3^5 = 243 fits in 2^8 = 256 with 13 spare states"
spare_use   = "WEB translation variants (Write/Erase/Burn)"
analogy     = "Firmament divides waters below (binary) from waters above (ternary)"

[cc.identity.distinctions.honest_uncertainty]
principle   = "Three-valued logic acknowledges what we don't know"
values      = ["false (-1)", "unknown (0)", "true (+1)"]
contrast    = "Binary boolean forces choice; ternary boolean allows honesty"
scripture   = "Matthew 5:37 — When you know, declare; when you don't, say so"

[cc.identity.distinctions.scripture_grounded]
principle   = "Types carry biblical meaning, not just technical function"
examples    = [
    "Trit as threefold cord (Ecclesiastes 4:12)",
    "Storage as firmament (Genesis 1:6)",
    "Text as the Word (John 1:1)",
    "Void as tohu (Genesis 1:2)"
]
purpose     = "Technology that honors the Creator in its very structure"

[cc.identity.distinctions.scale_aware]
principle   = "Every type knows its role at each architectural layer"
layers      = ["L0_kernel", "L1_system", "L2_runtime", "L3_framework",
               "L4_health", "L5_network", "L6_storage", "L7_engine", "L8_app"]
rationale   = "A trit at kernel level means flags; at app level means user choice"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.1.3 ARCHITECTURE — How Types Relate [ARCHITECTURE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Except the LORD build the house, they labour in vain that build it"
#  — Psalm 127:1 KJV
#
# The structural relationships between primitive types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.identity.architecture]
description = "Structural relationships between primitive type categories"

# Dependency chain: what builds on what
[cc.identity.architecture.foundation]
layer_0     = "ternary.toml — mathematical foundation (trit values, packing constants)"
layer_1     = "storage — binary bridge (uint8, int8 store packed trits)"
layer_2     = "trit — atomic ternary (trit, trit5 are the building blocks)"
layer_3     = "composed — all other types compose from trits"

# Type composition hierarchy
[cc.identity.architecture.composition]
atomic      = ["trit"]
packed      = ["trit5", "int9", "int27", "int81", "int243"]
derived     = ["float27", "decimal27", "bool3", "char", "timestamp", "duration"]
container   = ["text", "list", "map", "set"]
boundary    = ["void", "any"]
bridge      = ["uint8", "int8"]

# Reference to ternary.toml
[cc.identity.architecture.depends_on]
file        = "L0-universal/foundation/math/ternary.toml"
provides    = ["trit values", "packing algorithms", "power tables", "scale definitions"]
relationship = "Primitives.toml IMPLEMENTS types; ternary.toml DEFINES the math"




# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for type catalog"

