format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Content file — storage widths, packing rules, alignment, and layer-scale requirements for primitive types"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Cc.3 RESOURCES — WHERE + HOW MUCH [RESOURCES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# PRIMITIVE TYPE RESOURCES: STORAGE, CAPACITY, CONSTRAINTS
#
# Resources answer "WHERE does it live?" and "HOW MUCH does it need?" — the
# physical and logical requirements for each primitive type. Before building,
# count the cost. Before allocating, know the requirements.
#
# WHAT BELONGS IN RESOURCES:
#
#   - Storage requirements (bytes, bits, trits)
#   - Packing details (how trits fit into bytes)
#   - Layer assignments (which architectural layer)
#   - Capacity limits (per scale)
#   - Alignment requirements
#   - Efficiency metrics
#
# RESOURCES VS SETTINGS VS BEHAVIOR:
#
#   SETTINGS:  "What are the configuration values?"
#   RESOURCES: "How much space/capacity does it need?"
#   BEHAVIOR:  "How does it operate in code?"
#
# Implementation: Resource constraints used by allocators and code generators
# Reference:      L0-universal/foundation/math/ternary.toml [packing]
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3.1 STORAGE WIDTHS — Byte Requirements Per Scale [WIDTHS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A just weight and balance are the LORD's" — Proverbs 16:11 KJV
#
# Standard storage widths aligned with ternary.toml [packing.widths].
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.resources.widths]
description = "Standard storage widths from ternary.toml [packing.widths]"

# Trit-to-byte mapping at each scale
trit5   = { trits = 5,   bytes = 1,  states = 243,            max_packed = 242 }
trit9   = { trits = 9,   bytes = 2,  states = 19683,          max_packed = 19682 }
trit27  = { trits = 27,  bytes = 6,  states = 7625597484987,  max_packed = 7625597484986 }
trit81  = { trits = 81,  bytes = 17, states = "4.4e38",       max_packed = "4.4e38" }
trit243 = { trits = 243, bytes = 49, states = "5.6e115",      max_packed = "5.6e115" }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3.2 LAYER SCALES — Requirements At Each Architectural Layer [SCALES]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Line upon line; here a little, and there a little" — Isaiah 28:10 KJV
#
# Storage requirements at each layer of the 9-layer architecture.
# From ternary.toml [powers.layers]: 3^n for each layer.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.resources.scales]
description = "Storage requirements at each architectural layer (L0-L8)"

L0_kernel   = { name = "trit",    power = 0, trits = 1,    bytes = 1,    states = 3,             use = "flags, status, ALU" }
L1_system   = { name = "triplet", power = 1, trits = 3,    bytes = 1,    states = 27,            use = "syscall results, IPC" }
L2_runtime  = { name = "nonet",   power = 2, trits = 9,    bytes = 2,    states = 19683,         use = "stack frames, objects" }
L3_framework = { name = "tryte",  power = 3, trits = 27,   bytes = 6,    states = 7625597484987, use = "word size, semantics" }
L4_health   = { name = "octant",  power = 4, trits = 81,   bytes = 17,   states = "4.4e38",      use = "health vectors" }
L5_network  = { name = "block",   power = 5, trits = 243,  bytes = 49,   states = "5.6e115",     use = "network packets" }
L6_storage  = { name = "sector",  power = 6, trits = 729,  bytes = 146,  states = "1.8e347",     use = "disk blocks, files" }
L7_engine   = { name = "segment", power = 7, trits = 2187, bytes = 438,  states = "1.0e1043",    use = "state machines, rules" }
L8_app      = { name = "domain",  power = 8, trits = 6561, bytes = 1313, states = "3.3e3130",    use = "app context, user data" }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3.3 ALIGNMENT — Memory Alignment Requirements [ALIGNMENT]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Set thine house in order" — 2 Kings 20:1 KJV
#
# Memory alignment for efficient hardware access.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.resources.alignment]
description = "Memory alignment for efficient access"

# Hardware alignment
cache_line       = 64                                    # CPU cache line (bytes)
trits_per_line   = 320                                   # 64 × 5 = 320 trits per cache line
page_size        = 4096                                  # Memory page (bytes)
trits_per_page   = 20480                                 # 4096 × 5 = 20,480 trits per page

# Block alignment
block_243_per_page = 84                                  # 20480 / 243 = 84 full blocks per page

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3.4 EFFICIENCY — Storage Efficiency Metrics [EFFICIENCY]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Gather up the fragments that remain, that nothing be lost" — John 6:12 KJV
#
# Storage efficiency = ternary_states / binary_capacity.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.resources.efficiency]
description = "Storage efficiency at each scale"

[cc.resources.efficiency.packed]
trit5_percent  = 94.9                                    # 243/256 = 94.9%
trit9_percent  = 30.0                                    # 19683/65536 = 30.0%
trit27_percent = 2.7                                     # 7.6T/281T = 2.7%
note           = "Efficiency drops at larger scales — fighting 2 vs 3 mismatch. Acceptable: correctness over density."

[cc.resources.efficiency.unpacked]
trit1_percent  = 31.6                                    # 3/256 = ~1.2% (wasteful)
note           = "Unpacked is always ~1/3 efficient but human-readable"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3.5 BIBLE RAIL — Scripture Address Resources [BIBLE_RAIL]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Thy word is a lamp unto my feet" — Psalm 119:105 KJV
#
# Resource requirements for Scripture address encoding.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.resources.bible_rail]
description  = "Scripture address system — every KJV verse has ternary address"
total_verses = 31102                                     # KJV verse count
trits_needed = 10                                        # ceil(log3(31102)) = 10 trits
spare_states = 13                                        # WEB translation markers
encoding     = "Ordinal → ternary address"

