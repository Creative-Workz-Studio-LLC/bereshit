format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Content file — code generation control, language targets, templates, and validation for primitive types"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Cx CODE GENERATION [GENERATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And the LORD answered me, and said, Write the vision, and make it plain upon
#  tables, that he may run that readeth it." — Habakkuk 2:2 KJV
#
# CODE GENERATION: FROM SPECIFICATION TO IMPLEMENTATION
#
# These TOML specifications are not just documentation — they are the SOURCE OF
# TRUTH from which actual code is generated. The generator reads this file and
# produces headers, type definitions, and constants for target languages.
#
# WRITE THE VISION:
#   Habakkuk was told to write clearly so runners could read while running.
#   Generation creates code that machines can "run" — executable from vision.
#   Specification becomes implementation. Vision becomes reality.
#
# GENERATION CATEGORIES:
#   GENERATE: Control metadata for the generation process
#   TARGETS:  Language-specific generation rules
#   TEMPLATES: Code patterns for each primitive type
#   GUARDS:   Header guards and namespace protection
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    C headers, assembly constants
#   L1 (System):    System call types, ABI definitions
#   L2 (Runtime):   Go types, Rust structs
#   L3 (Framework): OmniCode type definitions
#   L4 (Health):    Health metric types
#   L5 (Network):   Wire format types
#   L6 (Storage):   Serialization types
#   L7 (Engine):    Rule engine types
#   L8 (App):       Application-level types
#
# Implementation: L0-universal/tools/generate/
# Reference:      L0-universal/foundation/math/ternary.toml [generate]
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.1 GENERATE — Generation Control Metadata [GENERATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# GENERATION CONTROL: PLANNING BEFORE BUILDING
#
# Generation settings control WHAT gets generated, WHERE it goes, and in WHAT
# ORDER. Counting the cost before building — knowing what you'll produce.
#
# ═══════════════════════════════════════════════════════════════════════════════

[generate]
description  = "Master generation control for primitives.toml"
enabled      = true                                           # Generation is active
version      = "b-01.00"                                      # Generator version

# Output configuration
[generate.output]
description  = "Where generated files go"
directory    = "L0-universal/libtrit/include/trit/"           # Output directory
primary      = "primitives.gen.h"                             # Primary output file
order        = 1                                              # After math (0), before language (2)

# Header guard
[generate.guard]
description  = "C header guard configuration"
name         = "PRIMITIVES_GEN_H"
pattern      = "#ifndef {guard}\n#define {guard}\n\n{content}\n\n#endif /* {guard} */"

# Generation scope
[generate.scope]
description  = "What sections to generate"
include      = ["trit", "trit5", "int9", "uint9", "int27", "uint27", "float27", "bool3", "void"]
exclude      = ["list", "map", "set", "any", "text", "char"]  # Collections handled separately
reason       = "Primitive types only; collections need parameterized generation"

# Dependencies
[generate.dependencies]
description  = "Files that must be generated first"
requires     = ["ternary.toml"]                               # Depends on ternary constants
provides     = ["primitives.gen.h"]                           # What this generates
blocks       = []                                             # Nothing depends on us for generation

# Generation at each layer
[generate.scales]
description  = "Generation configuration at each architectural layer"
L0_kernel    = { output = "primitives.gen.h",                 format = "C header" }
L1_system    = { output = "primitives_sys.gen.h",             format = "C system types" }
L2_runtime   = { output = "primitives.gen.go",                format = "Go types" }
L3_framework = { output = "primitives.omni",                  format = "OmniCode types" }
L4_health    = { output = "primitives_health.gen.go",         format = "Health metric types" }
L5_network   = { output = "primitives_wire.gen.go",           format = "Wire format types" }
L6_storage   = { output = "primitives_storage.gen.go",        format = "Serialization types" }
L7_engine    = { output = "primitives_engine.gen.go",         format = "Engine types" }
L8_app       = { output = "primitives_app.gen.go",            format = "Application types" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.2 TARGETS — Language-Specific Generation [TARGETS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And there were dwelling at Jerusalem Jews, devout men, out of every nation
#  under heaven... every man heard them speak in his own language."
#  — Acts 2:5,6 KJV
#
# TARGETS: SPEAKING EACH LANGUAGE'S TONGUE
#
# Pentecost saw one message spoken in every hearer's language. Generation takes
# one specification and produces code in each target's native tongue. Same truth,
# different expressions.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2a C_TARGET — C Language Generation [C_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[generate.target.c]
description  = "C language code generation"
enabled      = true
priority     = 1                                              # Generated first (foundational)

# Type mappings (primitive → C type)
[generate.target.c.types]
description  = "How primitives map to C types"
trit         = { type = "int8_t",   typedef = "trit_t",       comment = "single trit value" }
trit5        = { type = "uint8_t",  typedef = "trit5_t",      comment = "5 packed trits" }
int9         = { type = "int16_t",  typedef = "trit9_t",      comment = "9-trit signed" }
uint9        = { type = "uint16_t", typedef = "utrit9_t",     comment = "9-trit unsigned" }
int27        = { type = "int64_t",  typedef = "trit27_t",     comment = "27-trit signed (Word)" }
uint27       = { type = "uint64_t", typedef = "utrit27_t",    comment = "27-trit unsigned" }
float27      = { type = "double",   typedef = "tfloat_t",     comment = "ternary float" }
bool3        = { type = "int8_t",   typedef = "tbool_t",      comment = "ternary boolean" }
void_type    = { type = "void",     typedef = "void",         comment = "no value" }

# Constant generation
[generate.target.c.constants]
description  = "How to generate C constants"
pattern      = "#define {NAME}_{FIELD} ({value})"
example      = "#define TRIT_MIN (-1)"

# Enum generation
[generate.target.c.enums]
description  = "How to generate C enums"
pattern      = "typedef enum { {values} } {name}_t;"
bool3_values = "TRIT_FALSE = -1, TRIT_UNKNOWN = 0, TRIT_TRUE = 1"

# C generation at each layer
[generate.target.c.scales]
description  = "C generation at each architectural layer"
L0_kernel    = { use = "core types + constants",              example = "trit_t, TRIT_MIN" }
L1_system    = { use = "syscall types",                       example = "trit_result_t" }
L2_runtime   = { use = "runtime structs",                     example = "trit_array_t" }
L3_framework = { use = "framework types",                     example = "trit_config_t" }
L4_health    = { use = "health types",                        example = "trit_health_t" }
L5_network   = { use = "wire types",                          example = "trit_packet_t" }
L6_storage   = { use = "storage types",                       example = "trit_block_t" }
L7_engine    = { use = "engine types",                        example = "trit_rule_t" }
L8_app       = { use = "app types",                           example = "trit_user_t" }

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2b GO_TARGET — Go Language Generation [GO_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[generate.target.go]
description  = "Go language code generation"
enabled      = true
priority     = 2                                              # After C

# Package configuration
[generate.target.go.package]
description  = "Go package configuration"
name         = "trit"
path         = "L0-universal/libtrit/pkg/trit"
imports      = []                                             # No external imports for primitives

# Type mappings (primitive → Go type)
[generate.target.go.types]
description  = "How primitives map to Go types"
trit         = { type = "int8",    alias = "Trit",            comment = "single trit value" }
trit5        = { type = "uint8",   alias = "Trit5",           comment = "5 packed trits" }
int9         = { type = "int16",   alias = "Int9",            comment = "9-trit signed" }
uint9        = { type = "uint16",  alias = "UInt9",           comment = "9-trit unsigned" }
int27        = { type = "int64",   alias = "Int27",           comment = "27-trit signed (Word)" }
uint27       = { type = "uint64",  alias = "UInt27",          comment = "27-trit unsigned" }
float27      = { type = "float64", alias = "Float27",         comment = "ternary float" }
bool3        = { type = "int8",    alias = "Bool3",           comment = "ternary boolean" }

# Constant generation
[generate.target.go.constants]
description  = "How to generate Go constants"
pattern      = "const {Name}{Field} {type} = {value}"
example      = "const TritMin int8 = -1"

# Method generation
[generate.target.go.methods]
description  = "Methods to generate for each type"
String       = "func (t {Type}) String() string"
IsValid      = "func (t {Type}) IsValid() bool"
Negate       = "func (t {Type}) Negate() {Type}"

# Go generation at each layer
[generate.target.go.scales]
description  = "Go generation at each architectural layer"
L0_kernel    = { use = "core types",                          example = "type Trit int8" }
L1_system    = { use = "syscall types",                       example = "type Result struct{}" }
L2_runtime   = { use = "runtime types",                       example = "type Array []Trit" }
L3_framework = { use = "framework types",                     example = "type Config struct{}" }
L4_health    = { use = "health types",                        example = "type Health struct{}" }
L5_network   = { use = "wire types",                          example = "type Packet struct{}" }
L6_storage   = { use = "storage types",                       example = "type Block struct{}" }
L7_engine    = { use = "engine types",                        example = "type Rule struct{}" }
L8_app       = { use = "app types",                           example = "type User struct{}" }

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2c RUST_TARGET — Rust Language Generation [RUST_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[generate.target.rust]
description  = "Rust language code generation"
enabled      = false                                          # Reserved for future
priority     = 3                                              # After Go
note         = "Rust generation planned for Phase 3"

# Type mappings (primitive → Rust type)
[generate.target.rust.types]
description  = "How primitives map to Rust types"
trit         = { type = "i8",      alias = "Trit",            comment = "single trit value" }
trit5        = { type = "u8",      alias = "Trit5",           comment = "5 packed trits" }
int9         = { type = "i16",     alias = "Int9",            comment = "9-trit signed" }
uint9        = { type = "u16",     alias = "UInt9",           comment = "9-trit unsigned" }
int27        = { type = "i64",     alias = "Int27",           comment = "27-trit signed (Word)" }
uint27       = { type = "u64",     alias = "UInt27",          comment = "27-trit unsigned" }
float27      = { type = "f64",     alias = "Float27",         comment = "ternary float" }
bool3        = { type = "i8",      alias = "Bool3",           comment = "ternary boolean" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.3 TEMPLATES — Code Generation Templates [TEMPLATES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "The thing that hath been, it is that which shall be; and that which is done
#  is that which shall be done." — Ecclesiastes 1:9 KJV
#
# TEMPLATES: PATTERNS THAT REPEAT WITH VARIATION
#
# Ecclesiastes reminds us that patterns repeat. Templates capture patterns that
# recur across types — what has been (the pattern) is what shall be (new types
# from the pattern). Template + data = generated code.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3a HEADER_TEMPLATE — C Header Template [HEADER_TEMPLATE]
# ───────────────────────────────────────────────────────────────────────────────

[generate.template.header]
description  = "Template for C header generation"

# Header structure
[generate.template.header.structure]
description  = "Structure of generated header"
sections     = ["guard_open", "includes", "typedefs", "constants", "enums", "guard_close"]

# Comment template
[generate.template.header.comment]
description  = "File header comment"
template     = """
/*
 * {filename} — Generated from {source}
 *
 * {description}
 *
 * DO NOT EDIT — Regenerate from TOML source.
 * Generator: L0-universal/tools/generate/
 * Generated: {timestamp}
 */
"""

# Typedef template
[generate.template.header.typedef]
description  = "Typedef generation template"
template     = "typedef {base_type} {typedef_name};  /* {comment} */"
example      = "typedef int8_t trit_t;  /* single trit value */"

# Constant template
[generate.template.header.constant]
description  = "Constant generation template"
template     = "#define {PREFIX}_{NAME} ({value})"
example      = "#define TRIT_MIN (-1)"

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3b TYPE_TEMPLATE — Per-Type Templates [TYPE_TEMPLATE]
# ───────────────────────────────────────────────────────────────────────────────

[generate.template.type.trit]
description  = "Generation template for trit type"
constants    = ["MIN", "ZERO", "MAX", "STATES"]
values       = [-1, 0, 1, 3]
operations   = ["negate", "abs", "sign"]

[generate.template.type.trit5]
description  = "Generation template for trit5 type"
constants    = ["MIN", "MAX", "PACKED_MAX", "STATES", "SPARE_START"]
values       = [-121, 121, 242, 243, 243]
operations   = ["pack", "unpack", "validate"]

[generate.template.type.int9]
description  = "Generation template for int9 type"
constants    = ["MIN", "MAX", "STATES"]
values       = [-9841, 9841, 19683]
operations   = ["add", "sub", "mul", "div", "mod", "negate"]

[generate.template.type.int27]
description  = "Generation template for int27 (Word) type"
constants    = ["MIN", "MAX", "STATES"]
values       = [-3812798742493, 3812798742493, 7625597484987]
operations   = ["add", "sub", "mul", "div", "mod", "negate"]
note         = "THE WORD — fundamental semantic unit"

[generate.template.type.bool3]
description  = "Generation template for bool3 type"
constants    = ["FALSE", "UNKNOWN", "TRUE"]
values       = [-1, 0, 1]
operations   = ["and", "or", "not", "implies"]

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3c SCALE_TEMPLATES — Per-Layer Templates [SCALE_TEMPLATES]
# ───────────────────────────────────────────────────────────────────────────────

[generate.template.scales]
description  = "Generation templates for each architectural layer"
L0_kernel    = { suffix = "",           includes = ["stdint.h"],      style = "minimal" }
L1_system    = { suffix = "_sys",       includes = ["stdint.h"],      style = "minimal" }
L2_runtime   = { suffix = "_runtime",   includes = ["stdint.h"],      style = "verbose" }
L3_framework = { suffix = "_framework", includes = ["stdint.h"],      style = "verbose" }
L4_health    = { suffix = "_health",    includes = ["stdint.h"],      style = "verbose" }
L5_network   = { suffix = "_wire",      includes = ["stdint.h"],      style = "minimal" }
L6_storage   = { suffix = "_storage",   includes = ["stdint.h"],      style = "minimal" }
L7_engine    = { suffix = "_engine",    includes = ["stdint.h"],      style = "verbose" }
L8_app       = { suffix = "_app",       includes = ["stdint.h"],      style = "verbose" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.4 VALIDATION — Generation Validation [GEN_VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Beloved, believe not every spirit, but try the spirits whether they are of
#  God." — 1 John 4:1 KJV
#
# VALIDATION: TESTING THE GENERATED CODE
#
# Generated code must be tested — don't blindly trust output. Validation ensures
# what was generated matches what was intended. Try the spirits.
#
# ═══════════════════════════════════════════════════════════════════════════════

[generate.validation]
description  = "How to validate generated code"
enabled      = true

# Syntax validation
[generate.validation.syntax]
description  = "Syntax checks for generated code"
c_compile    = "gcc -fsyntax-only -Wall -Werror {file}"
go_build     = "go build -v {package}"
rust_check   = "cargo check"

# Content validation
[generate.validation.content]
description  = "Content checks for generated code"
has_guard    = "Header must have include guard"
has_typedefs = "All primitives must have typedefs"
has_constants = "All primitives must have constants"
no_duplicates = "No duplicate definitions"

# Round-trip validation
[generate.validation.roundtrip]
description  = "Verify generated code matches spec"
parse_toml   = "Load TOML, extract values"
parse_header = "Parse generated header, extract values"
compare      = "Values must match"

# Validation at each layer
[generate.validation.scales]
description  = "Validation at each architectural layer"
L0_kernel    = { check = "compile only",                      example = "gcc -fsyntax-only" }
L1_system    = { check = "compile only",                      example = "verify syscall types" }
L2_runtime   = { check = "build + unit test",                 example = "go test" }
L3_framework = { check = "build + integration test",          example = "framework tests" }
L4_health    = { check = "build + validation",                example = "health metric tests" }
L5_network   = { check = "build + wire tests",                example = "serialization tests" }
L6_storage   = { check = "build + storage tests",             example = "persistence tests" }
L7_engine    = { check = "build + engine tests",              example = "rule evaluation tests" }
L8_app       = { check = "full test suite",                   example = "end-to-end tests" }

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for type generation"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "python3 -c \"import tomllib; tomllib.load(open('primitives-generation.toml','rb'))\"",
]

[_validation.schema]
required = ["generate"]
optional = ["generate.scope", "generate.targets", "generate.templates", "generate.validation", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════

[_closing.X1_policy]
scripture = "Remove not the ancient landmark, which thy fathers have set. — Proverbs 22:28"
never = ["Type-to-language mappings (C, Go, Rust)", "Template structure", "Generation scope"]
careful = ["Target type mappings — affects generated code", "Template patterns", "Validation rules"]
safe = ["New language targets", "Additional templates", "Implementation notes"]

[_closing.X2_extension]
