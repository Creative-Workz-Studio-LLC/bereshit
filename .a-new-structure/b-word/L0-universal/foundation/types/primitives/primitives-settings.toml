# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Type settings — defaults and sizes are exact values derived from ternary math. No approximations."

# ─────────────────────────────────────────────────────────────
# Co — Content Operations (Cc.2: Settings)
# ─────────────────────────────────────────────────────────────

# Cc.2 SETTINGS — Primary Configuration [SETTINGS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Order my steps in thy word: and let not any iniquity have dominion over me."
#  — Psalm 119:133 KJV
#
# PRIMITIVE TYPE SETTINGS: THE CONFIGURATION FOUNDATION
#
# Settings define the PRIMARY CONFIGURATION for all primitive types — defaults,
# modes, parameters that control how types behave. These are the knobs and
# switches that configure the type system before any resources are allocated
# or behaviors are executed.
#
# WHAT BELONGS IN SETTINGS:
#
#   - Default values for each type
#   - Storage mode configuration (packed vs unpacked)
#   - Representation format choices
#   - Type parameters (scale for decimal, capacity hints for collections)
#   - Encoding configuration (UTF-8 for text, etc.)
#   - Nullability settings
#
# SETTINGS VS RESOURCES VS BEHAVIOR:
#
#   SETTINGS:  "What are the configuration values?"
#   RESOURCES: "How much space/capacity does it need?"
#   BEHAVIOR:  "How does it operate in code?"
#
# Implementation: Configuration values used by libtrit and code generators
# Reference:      Each type's settings inform its resource allocation and behavior
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.1 GLOBAL SETTINGS — System-Wide Configuration [GLOBAL]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Let all things be done decently and in order." — 1 Corinthians 14:40 KJV
#
# Configuration that applies across all primitive types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.global]
description = "System-wide configuration for all primitive types"

# Hardware bridge configuration
[cc.settings.global.hardware]
target      = "binary"
reality     = "Ternary REPRESENTED in binary until MillenniumOS"
bridge_type = "firmament"

# Default storage mode
[cc.settings.global.storage_mode]
default     = "packed"
options     = ["packed", "unpacked"]
packed_desc = "Machine-efficient: 5 trits per byte (94.9% efficient)"
unpacked_desc = "Human-readable: 1 character per trit (31.6% efficient)"

# Default nullability
[cc.settings.global.nullability]
primitives  = false                                          # Primitives non-nullable by default
collections = true                                           # Collections nullable by default
text        = true                                           # Text nullable by default

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.2 STORAGE SETTINGS — Binary Bridge Configuration [STORAGE_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And God said, Let there be a firmament in the midst of the waters"
#  — Genesis 1:6 KJV
#
# Configuration for the binary-ternary storage bridge.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.storage]
description = "Binary-ternary bridge configuration"

# Representation settings
[cc.settings.storage.representations]
unpacked    = { bytes_per_trit = 1, encoding = "ASCII: '-','0','+'", use = "display, debugging" }
packed      = { trits_per_byte = 5, states = 243, spare = 13, use = "storage, transmission" }

# Binary storage type defaults
[cc.settings.storage.uint8]
name        = "uint8"
size_bits   = 8
min_value   = 0
max_value   = 255
default     = 0
signed      = false

[cc.settings.storage.int8]
name        = "int8"
size_bits   = 8
min_value   = -128
max_value   = 127
default     = 0
signed      = true

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.3 TRIT SETTINGS — Balanced Ternary Configuration [TRIT_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A threefold cord is not quickly broken." — Ecclesiastes 4:12 KJV
#
# Configuration for trit and trit5 types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.trit]
description = "Balanced ternary type configuration"

[cc.settings.trit.trit]
name         = "trit"
size_trits   = 1
default      = 0
nullable     = false
values       = [-1, 0, 1]
labels       = ["negative", "neutral", "positive"]
short_labels = ["N", "Z", "P"]
states       = 3
base         = 3
identity_sum = 0                                             # -1 + 0 + 1 = 0 (balanced)
identity_mul = 0                                             # Product with 0 = 0 (annihilator)

[cc.settings.trit.trit5]
name         = "trit5"
size_trits   = 5
default      = 0
nullable     = false
states       = 243                                           # 3^5
packed_size  = 1                                             # 1 byte
min_value    = -121
max_value    = 121
spare_states = 13                                            # 256 - 243 for WEB encoding

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.4 INTEGER SETTINGS — Whole Number Configuration [INTEGER_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Numbers 1:2 — Take ye the sum of all the congregation"
#
# Configuration for integer types at each ternary scale.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.integer]
description = "Ternary integer type configuration"

# 9-trit integers (3^2 = 9 trits)
[cc.settings.integer.int9]
name        = "int9"
size_trits  = 9
signed      = true
default     = 0
nullable    = false

[cc.settings.integer.uint9]
name        = "uint9"
size_trits  = 9
signed      = false
default     = 0
nullable    = false

# 27-trit integers (3^3 = 27 trits) — Word size
[cc.settings.integer.int27]
name        = "int27"
size_trits  = 27
signed      = true
default     = 0
nullable    = false

[cc.settings.integer.uint27]
name        = "uint27"
size_trits  = 27
signed      = false
default     = 0
nullable    = false

# 81-trit integers (3^4 = 81 trits) — Health scale
[cc.settings.integer.int81]
name        = "int81"
size_trits  = 81
signed      = true
default     = 0
nullable    = false

[cc.settings.integer.uint81]
name        = "uint81"
size_trits  = 81
signed      = false
default     = 0
nullable    = false

# 243-trit integers (3^5 = 243 trits) — Network scale
[cc.settings.integer.int243]
name        = "int243"
size_trits  = 243
signed      = true
default     = 0
nullable    = false

[cc.settings.integer.uint243]
name        = "uint243"
size_trits  = 243
signed      = false
default     = 0
nullable    = false

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.5 FLOAT SETTINGS — Floating Point Configuration [FLOAT_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Who hath measured the waters in the hollow of his hand" — Isaiah 40:12 KJV
#
# Configuration for ternary floating point.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.float]
description = "Ternary floating point configuration"

[cc.settings.float.float27]
name           = "float27"
size_trits     = 27
mantissa_trits = 18
exponent_trits = 8
sign_trits     = 1
default        = 0.0
nullable       = false

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.6 TEXT SETTINGS — String Configuration [TEXT_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "In the beginning was the Word" — John 1:1 KJV
#
# Configuration for text and character types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.text]
description = "Text type configuration"

[cc.settings.text.text]
name        = "text"
encoding    = "utf-8"
default     = ""
nullable    = true
max_length  = "unbounded"

[cc.settings.text.char]
name        = "char"
size_trits  = 27                                             # Word size for Unicode coverage
encoding    = "utf-8"
default     = "\u0000"
nullable    = false

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.7 BOOLEAN SETTINGS — Ternary Logic Configuration [BOOLEAN_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Let your yea be yea; and your nay, nay" — Matthew 5:37 KJV
#
# Configuration for ternary boolean.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.boolean]
description = "Ternary boolean configuration"

[cc.settings.boolean.bool3]
name        = "bool3"
size_trits  = 1
default     = 0                                              # Unknown is the honest default
nullable    = false
values      = [-1, 0, 1]
labels      = ["false", "unknown", "true"]

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.8 COLLECTION SETTINGS — Container Configuration [COLLECTION_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "These are the generations of Adam" — Genesis 5:1 KJV
#
# Configuration for parameterized collection types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.collections]
description = "Collection type configuration"

[cc.settings.collections.list]
name             = "list"
default          = "[]"
nullable         = true
ordered          = true
allows_duplicates = true

[cc.settings.collections.map]
name             = "map"
default          = "{}"
nullable         = true
ordered          = false
allows_duplicates = false                                    # Keys unique

[cc.settings.collections.set]
name             = "set"
default          = "{}"
nullable         = true
ordered          = false
allows_duplicates = false                                    # Elements unique

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.9 SPECIAL SETTINGS — Boundary Type Configuration [SPECIAL_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "The earth was without form, and void" — Genesis 1:2 KJV
#
# Configuration for void and any types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.special]
description = "Special type configuration"

[cc.settings.special.void]
name        = "void"
size_trits  = 0
nullable    = false
default     = "none"

[cc.settings.special.any]
name        = "any"
size_trits  = "variable"
nullable    = true
default     = "null"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.10 DECIMAL SETTINGS — Fixed-Point Configuration [DECIMAL_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A false balance is abomination to the LORD" — Proverbs 11:1 KJV
#
# Configuration for fixed-point decimal.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.decimal]
description = "Fixed-point decimal configuration"

[cc.settings.decimal.decimal27]
name          = "decimal27"
size_trits    = 27
storage_type  = "int27"
default       = 0
nullable      = false
max_scale     = 9
default_scale = 2                                            # Default for money (cents)

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2.11 TEMPORAL SETTINGS — Time Type Configuration [TEMPORAL_SETTINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "To every thing there is a season" — Ecclesiastes 3:1 KJV
#
# Configuration for time primitives.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.settings.temporal]
description = "Time type configuration"

[cc.settings.temporal.timestamp]
name         = "timestamp"
size_trits   = 81
storage_type = "int81"
unit         = "nanosecond"
epoch        = "1970-01-01T00:00:00Z"
default      = 0
nullable     = false

[cc.settings.temporal.duration]
name         = "duration"
size_trits   = 81
storage_type = "int81"
unit         = "nanosecond"
default      = 0
nullable     = false
signed       = true



# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for type settings"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('primitives-settings.toml','rb'))\""]

[_validation.schema]
required = ["cc"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
valid_values = 30
settings_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
