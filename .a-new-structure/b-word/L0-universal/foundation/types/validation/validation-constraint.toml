# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Content file — validation rules for 8 applied constraints (range, pattern, enum, length, unique, foreign_key, default, immutable)"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Cc.2 CONSTRAINT — Applied Constraint Validation [CONSTRAINT]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Divers weights, and divers measures, both of them are alike abomination
#  to the LORD." — Proverbs 20:10 KJV
#
# VALIDATING TYPE CONSTRAINTS
#
# Constraints narrow types — they restrict the valid values beyond what the
# base type allows. A constraint that validates is a type that can be trusted.
# These rules verify that constrained values meet their declared restrictions.
#
# KEY INSIGHT (from composition.toml):
#   Constraints are type narrowing operations:
#   range:       Restrict numeric values to [min, max]
#   pattern:     Restrict text to match regex
#   enum:        Restrict to enumerated values
#   length:      Restrict collection/text size
#   unique:      Ensure no duplicates
#   foreign_key: Ensure referential integrity
#   default:     Provide fallback value
#   immutable:   Prevent modification
#
# VALIDATION PRINCIPLE:
#   Constraints are contracts. Violated constraints break the contract.
#   Consistent measures (Prov 20:10) — validation must be exact.
#
# TERNARY ALIGNMENT:
#   Passes constraint  = +1 (value is within narrowed type)
#   Cannot determine   =  0 (insufficient info to validate)
#   Violates constraint = -1 (value outside narrowed type)
#
# Reference: L0-universal/foundation/types/composition.toml [constraint.*]
#
# ═══════════════════════════════════════════════════════════════════════════════

[constraint]
description = "Constraint validation — verifying values meet narrowing rules"
principle   = "Consistent measures (Prov 20:10) — validation must be exact"
source      = "L0-universal/foundation/types/composition.toml"
categories  = ["range", "pattern", "enum", "length", "unique", "foreign_key", "default", "immutable"]

# ───────────────────────────────────────────────────────────────────────────────
# Cc.2a RANGE — Numeric Range Constraint Validation [RANGE]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.range]
name             = "range"
description      = "Validate numeric range constraint — value within [min, max]"
source_type      = "composition.toml [constraint.range]"
category         = "numeric"
applies_to       = ["trit", "trit5", "int9", "uint9", "int27", "uint27", "float27"]

# Validation Rule
[constraint.range.rule]
type             = "bounds_check"
check_min        = true
check_max        = true
inclusive        = true                                   # min <= value <= max
allow_open       = true                                   # Can omit min or max

# Error Definition
[constraint.range.error]
code             = "RANGE_VIOLATION"
severity         = "error"
message          = "Value outside allowed range"
message_template = "Range violation: {value} not in [{min}, {max}]"

[constraint.range.error.below_min]
code             = "BELOW_MIN"
message_template = "Value {value} is below minimum {min}"

[constraint.range.error.above_max]
code             = "ABOVE_MAX"
message_template = "Value {value} is above maximum {max}"

# OmniCode Syntax
[constraint.range.omnicode]
check            = "is within range"
declare          = "let value be int9 where {min} <= value <= {max}"
assert           = "assert {value} in range [{min}, {max}]"
guard            = "guard range {value} in [{min}, {max}] else {error}"

# CPI-SI Interpretation
[constraint.range.cpisi]
valid_meaning    = "Value within bounds — appropriate for its context"
invalid_meaning  = "Value out of bounds — cannot be used in constrained context"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.range.types]
c_validator      = "bool validate_range(int64_t value, int64_t min, int64_t max) { return value >= min && value <= max; }"
go_validator     = "func ValidateRange[T constraints.Ordered](v, min, max T) bool { return v >= min && v <= max }"
rust_validator   = "fn validate_range<T: Ord>(v: T, min: T, max: T) -> bool { v >= min && v <= max }"

# Scale Applications
[constraint.range.scales]
L0_kernel        = { use = "register bounds",             example = "hardware limits" }
L1_system        = { use = "syscall limits",              example = "argument bounds" }
L2_runtime       = { use = "array bounds",                example = "index limits" }
L3_framework     = { use = "config bounds",               example = "setting limits" }
L4_health        = { use = "score bounds",                example = "metric ranges" }
L5_network       = { use = "protocol limits",             example = "field bounds" }
L6_storage       = { use = "allocation bounds",           example = "size limits" }
L7_engine        = { use = "state bounds",                example = "value ranges" }
L8_app           = { use = "business rules",              example = "domain limits" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2b PATTERN — Regex Pattern Constraint Validation [PATTERN]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.pattern]
name             = "pattern"
description      = "Validate regex pattern constraint — text matches pattern"
source_type      = "composition.toml [constraint.pattern]"
category         = "text"
applies_to       = ["text"]

# Validation Rule
[constraint.pattern.rule]
type             = "regex_match"
regex_flavor     = "PCRE"                                 # Perl-Compatible Regular Expressions
case_sensitive   = true                                   # Default case-sensitive
full_match       = true                                   # Must match entire string
allow_partial    = false                                  # No partial matches by default

# Error Definition
[constraint.pattern.error]
code             = "PATTERN_VIOLATION"
severity         = "error"
message          = "Value does not match required pattern"
message_template = "Pattern violation: '{value}' does not match /{pattern}/"

[constraint.pattern.error.invalid_regex]
code             = "INVALID_PATTERN"
message_template = "Invalid regex pattern: {pattern}"

# OmniCode Syntax
[constraint.pattern.omnicode]
check            = "matches pattern"
declare          = "let value be text where value matches /{pattern}/"
assert           = "assert {value} matches /{pattern}/"
guard            = "guard pattern {value} matches /{pattern}/ else {error}"

# CPI-SI Interpretation
[constraint.pattern.cpisi]
valid_meaning    = "Text conforms to expected format — structured correctly"
invalid_meaning  = "Text malformed — does not match expected structure"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.pattern.types]
c_validator      = "bool validate_pattern(const char* value, const char* pattern)"
go_validator     = "func ValidatePattern(v string, pattern *regexp.Regexp) bool { return pattern.MatchString(v) }"
rust_validator   = "fn validate_pattern(v: &str, pattern: &Regex) -> bool { pattern.is_match(v) }"

# Scale Applications
[constraint.pattern.scales]
L0_kernel        = { use = "device names",                example = "naming conventions" }
L1_system        = { use = "path validation",             example = "path format" }
L2_runtime       = { use = "identifier format",           example = "name rules" }
L3_framework     = { use = "config keys",                 example = "key format" }
L4_health        = { use = "log format",                  example = "message structure" }
L5_network       = { use = "protocol format",             example = "message format" }
L6_storage       = { use = "filename format",             example = "name validity" }
L7_engine        = { use = "rule syntax",                 example = "expression format" }
L8_app           = { use = "input format",                example = "email, phone, etc." }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2c ENUM — Enumeration Constraint Validation [ENUM]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.enum]
name             = "enum"
description      = "Validate enumeration constraint — value in allowed set"
source_type      = "composition.toml [constraint.enum]"
category         = "discrete"
applies_to       = ["trit", "int9", "text"]

# Validation Rule
[constraint.enum.rule]
type             = "set_membership"
case_sensitive   = true                                   # For text enums
require_exhaustive = true                                 # All cases must be handled
allow_alias      = false                                  # No duplicate values by default

# Error Definition
[constraint.enum.error]
code             = "ENUM_VIOLATION"
severity         = "error"
message          = "Value not in allowed set"
message_template = "Enum violation: '{value}' not in {allowed_values}"

[constraint.enum.error.non_exhaustive]
code             = "NON_EXHAUSTIVE_MATCH"
message_template = "Non-exhaustive match: missing case for {missing}"

# OmniCode Syntax
[constraint.enum.omnicode]
check            = "is one of"
declare          = "let value be enum { a, b, c }"
assert           = "assert {value} in {allowed_values}"
guard            = "guard enum {value} in {allowed_values} else {error}"

# CPI-SI Interpretation
[constraint.enum.cpisi]
valid_meaning    = "Value is recognized variant — has defined meaning"
invalid_meaning  = "Value is unknown variant — undefined behavior"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.enum.types]
c_validator      = "bool validate_enum(int value, const int* allowed, size_t count)"
go_validator     = "func ValidateEnum[T comparable](v T, allowed []T) bool { return slices.Contains(allowed, v) }"
rust_validator   = "fn validate_enum<T: Eq>(v: &T, allowed: &[T]) -> bool { allowed.contains(v) }"

# Scale Applications
[constraint.enum.scales]
L0_kernel        = { use = "CPU modes",                   example = "mode validity" }
L1_system        = { use = "syscall numbers",             example = "call validity" }
L2_runtime       = { use = "type tags",                   example = "tag validity" }
L3_framework     = { use = "config options",              example = "option validity" }
L4_health        = { use = "status codes",                example = "status validity" }
L5_network       = { use = "message types",               example = "type validity" }
L6_storage       = { use = "record types",                example = "type validity" }
L7_engine        = { use = "action types",                example = "action validity" }
L8_app           = { use = "user choices",                example = "choice validity" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2d LENGTH — Length Constraint Validation [LENGTH]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.length]
name             = "length"
description      = "Validate length constraint — size within bounds"
source_type      = "composition.toml [constraint.length]"
category         = "size"
applies_to       = ["text", "list", "set", "bytes"]

# Validation Rule
[constraint.length.rule]
type             = "length_check"
check_min        = true
check_max        = true
min_default      = 0                                      # Default minimum is 0
max_default      = "unlimited"                            # No default maximum

# Error Definition
[constraint.length.error]
code             = "LENGTH_VIOLATION"
severity         = "error"
message          = "Length outside allowed range"
message_template = "Length violation: {actual} not in [{min}, {max}]"

[constraint.length.error.too_short]
code             = "TOO_SHORT"
message_template = "Length {actual} is below minimum {min}"

[constraint.length.error.too_long]
code             = "TOO_LONG"
message_template = "Length {actual} is above maximum {max}"

# OmniCode Syntax
[constraint.length.omnicode]
check            = "has length in range"
declare          = "let value be text where length(value) in [{min}, {max}]"
assert           = "assert length({value}) in [{min}, {max}]"
guard            = "guard length {value} in [{min}, {max}] else {error}"

# CPI-SI Interpretation
[constraint.length.cpisi]
valid_meaning    = "Collection/text is appropriate size — fits constraints"
invalid_meaning  = "Collection/text wrong size — cannot process"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.length.types]
c_validator      = "bool validate_length(size_t actual, size_t min, size_t max) { return actual >= min && actual <= max; }"
go_validator     = "func ValidateLength(actual, min, max int) bool { return actual >= min && actual <= max }"
rust_validator   = "fn validate_length(actual: usize, min: usize, max: usize) -> bool { actual >= min && actual <= max }"

# Scale Applications
[constraint.length.scales]
L0_kernel        = { use = "buffer sizes",                example = "allocation bounds" }
L1_system        = { use = "argument lengths",            example = "parameter limits" }
L2_runtime       = { use = "array sizes",                 example = "capacity limits" }
L3_framework     = { use = "config lengths",              example = "string limits" }
L4_health        = { use = "log lengths",                 example = "message limits" }
L5_network       = { use = "packet sizes",                example = "MTU limits" }
L6_storage       = { use = "record sizes",                example = "storage limits" }
L7_engine        = { use = "rule lengths",                example = "complexity limits" }
L8_app           = { use = "input lengths",               example = "field limits" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2e UNIQUE — Uniqueness Constraint Validation [UNIQUE]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.unique]
name             = "unique"
description      = "Validate uniqueness constraint — no duplicates allowed"
source_type      = "composition.toml [constraint.unique]"
category         = "integrity"
applies_to       = ["list", "set", "map"]

# Validation Rule
[constraint.unique.rule]
type             = "uniqueness_check"
scope            = "collection"                           # Within single collection
by_field         = false                                  # Check whole value by default

# Error Definition
[constraint.unique.error]
code             = "UNIQUE_VIOLATION"
severity         = "error"
message          = "Duplicate value found"
message_template = "Unique violation: duplicate '{value}' at positions {positions}"

# OmniCode Syntax
[constraint.unique.omnicode]
check            = "all unique"
declare          = "let value be list<T> where unique(value)"
assert           = "assert unique({value})"
guard            = "guard unique {value} else {error}"

# CPI-SI Interpretation
[constraint.unique.cpisi]
valid_meaning    = "All elements distinct — identity preserved"
invalid_meaning  = "Duplicates present — identity confusion"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.unique.types]
c_validator      = "bool validate_unique(const void* array, size_t count, size_t elem_size, int (*cmp)(const void*, const void*))"
go_validator     = "func ValidateUnique[T comparable](items []T) bool { seen := make(map[T]bool); for _, v := range items { if seen[v] { return false }; seen[v] = true }; return true }"
rust_validator   = "fn validate_unique<T: Eq + Hash>(items: &[T]) -> bool { items.iter().collect::<HashSet<_>>().len() == items.len() }"

# Scale Applications
[constraint.unique.scales]
L0_kernel        = { use = "interrupt vectors",           example = "no duplicate handlers" }
L1_system        = { use = "file descriptors",            example = "unique handles" }
L2_runtime       = { use = "object IDs",                  example = "unique references" }
L3_framework     = { use = "config keys",                 example = "unique settings" }
L4_health        = { use = "metric IDs",                  example = "unique identifiers" }
L5_network       = { use = "connection IDs",              example = "unique sessions" }
L6_storage       = { use = "primary keys",                example = "unique records" }
L7_engine        = { use = "rule IDs",                    example = "unique rules" }
L8_app           = { use = "user IDs",                    example = "unique accounts" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2f FOREIGN_KEY — Referential Integrity Validation [FOREIGN_KEY]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.foreign_key]
name             = "foreign_key"
description      = "Validate referential integrity — referenced value exists"
source_type      = "composition.toml [constraint.foreign_key]"
category         = "integrity"
applies_to       = ["any"]

# Validation Rule
[constraint.foreign_key.rule]
type             = "reference_check"
target_required  = true                                   # Referenced entity must exist
on_delete        = "restrict"                             # Default: prevent delete if referenced
on_update        = "cascade"                              # Default: update references

# Error Definition
[constraint.foreign_key.error]
code             = "FOREIGN_KEY_VIOLATION"
severity         = "error"
message          = "Referenced value does not exist"
message_template = "Foreign key violation: '{value}' not found in {target}"

[constraint.foreign_key.error.dangling]
code             = "DANGLING_REFERENCE"
message_template = "Dangling reference: {source}.{field} -> {target} (missing: {value})"

# OmniCode Syntax
[constraint.foreign_key.omnicode]
check            = "references exist"
declare          = "let value be ref T where exists(T, value)"
assert           = "assert {value} references {target}"
guard            = "guard foreign_key {value} in {target} else {error}"

# CPI-SI Interpretation
[constraint.foreign_key.cpisi]
valid_meaning    = "Reference resolves — relationship intact"
invalid_meaning  = "Reference broken — orphaned data"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.foreign_key.types]
c_validator      = "bool validate_foreign_key(const char* value, const Table* target)"
go_validator     = "func ValidateForeignKey[K comparable](key K, lookup map[K]any) bool { _, ok := lookup[key]; return ok }"
rust_validator   = "fn validate_foreign_key<K: Eq + Hash>(key: &K, lookup: &HashSet<K>) -> bool { lookup.contains(key) }"

# Scale Applications
[constraint.foreign_key.scales]
L0_kernel        = { use = "device references",           example = "device exists" }
L1_system        = { use = "process references",          example = "process exists" }
L2_runtime       = { use = "object references",           example = "object alive" }
L3_framework     = { use = "config references",           example = "setting exists" }
L4_health        = { use = "source references",           example = "source valid" }
L5_network       = { use = "peer references",             example = "peer connected" }
L6_storage       = { use = "record references",           example = "record exists" }
L7_engine        = { use = "rule references",             example = "rule defined" }
L8_app           = { use = "entity references",           example = "entity exists" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2g DEFAULT — Default Value Constraint Validation [DEFAULT]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.default]
name             = "default"
description      = "Validate default value constraint — fallback when absent"
source_type      = "composition.toml [constraint.default]"
category         = "fallback"
applies_to       = ["any"]

# Validation Rule
[constraint.default.rule]
type             = "default_check"
when_missing     = "apply_default"                        # Use default when value absent
when_null        = "apply_default"                        # Use default when null
type_match       = true                                   # Default must match field type

# Error Definition
[constraint.default.error]
code             = "DEFAULT_VIOLATION"
severity         = "error"
message          = "Default value does not match type"
message_template = "Default violation: '{default}' not valid for type {type}"

[constraint.default.error.type_mismatch]
code             = "DEFAULT_TYPE_MISMATCH"
message_template = "Default value type mismatch: expected {expected}, got {actual}"

# OmniCode Syntax
[constraint.default.omnicode]
check            = "has valid default"
declare          = "let value be T = {default}"
assert           = "assert default({value}) as {type}"
apply            = "value ?? {default}"

# CPI-SI Interpretation
[constraint.default.cpisi]
valid_meaning    = "Default is appropriate fallback — system can proceed"
invalid_meaning  = "Default is wrong type — cannot safely apply"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.default.types]
c_validator      = "bool validate_default(const void* default_val, TypeInfo* expected_type)"
go_validator     = "func ValidateDefault[T any](defaultVal T) bool { return true } // Type enforced at compile time"
rust_validator   = "fn validate_default<T: Default>(_: &T) -> bool { true } // Type enforced at compile time"

# Scale Applications
[constraint.default.scales]
L0_kernel        = { use = "register defaults",           example = "reset values" }
L1_system        = { use = "config defaults",             example = "missing settings" }
L2_runtime       = { use = "field defaults",              example = "uninitialized fields" }
L3_framework     = { use = "option defaults",             example = "missing options" }
L4_health        = { use = "baseline defaults",           example = "missing metrics" }
L5_network       = { use = "protocol defaults",           example = "missing fields" }
L6_storage       = { use = "schema defaults",             example = "missing columns" }
L7_engine        = { use = "rule defaults",               example = "missing parameters" }
L8_app           = { use = "preference defaults",         example = "missing settings" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2h IMMUTABLE — Immutability Constraint Validation [IMMUTABLE]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.immutable]
name             = "immutable"
description      = "Validate immutability constraint — value cannot change"
source_type      = "composition.toml [constraint.immutable]"
category         = "protection"
applies_to       = ["any"]

# Validation Rule
[constraint.immutable.rule]
type             = "immutability_check"
allow_initial    = true                                   # Can set once
allow_modify     = false                                  # Cannot change after set
deep             = true                                   # Nested values also immutable

# Error Definition
[constraint.immutable.error]
code             = "IMMUTABLE_VIOLATION"
severity         = "error"
message          = "Attempted to modify immutable value"
message_template = "Immutable violation: cannot modify '{field}' after initialization"

[constraint.immutable.error.deep_modify]
code             = "DEEP_IMMUTABLE_VIOLATION"
message_template = "Deep immutable violation: cannot modify nested field '{path}'"

# OmniCode Syntax
[constraint.immutable.omnicode]
check            = "is immutable"
declare          = "let const value be T"
assert           = "assert immutable({value})"
guard            = "guard immutable {value} else {error}"

# CPI-SI Interpretation
[constraint.immutable.cpisi]
valid_meaning    = "Value preserved — integrity maintained"
invalid_meaning  = "Modification attempted — integrity violated"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.immutable.types]
c_validator      = "// Immutability enforced via const qualifier"
c_pattern        = "const T value;"
go_validator     = "// Go has no native immutability — use conventions"
go_pattern       = "unexported field + getter only"
rust_validator   = "// Rust immutable by default"
rust_pattern     = "let value: T; // immutable unless mut"

# Scale Applications
[constraint.immutable.scales]
L0_kernel        = { use = "hardware constants",          example = "ROM values" }
L1_system        = { use = "system constants",            example = "config constants" }
L2_runtime       = { use = "frozen objects",              example = "sealed values" }
L3_framework     = { use = "config constants",            example = "read-only settings" }
L4_health        = { use = "historical records",          example = "audit trail" }
L5_network       = { use = "signed messages",             example = "tamper prevention" }
L6_storage       = { use = "archived records",            example = "write-once data" }
L7_engine        = { use = "rule definitions",            example = "frozen rules" }
L8_app           = { use = "user history",                example = "immutable logs" }

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for constraint validation"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "python3 -c \"import tomllib; tomllib.load(open('validation-constraint.toml','rb'))\"",
]

[_validation.schema]
required = ["constraint"]
optional = ["constraint.range", "constraint.pattern", "constraint.enum_val", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

