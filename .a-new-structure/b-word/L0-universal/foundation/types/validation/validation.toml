# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Index file — references split content files. No validation rules defined here."

# ─────────────────────────────────────────────────────────────
# SPLIT FILE OVERVIEW
# ─────────────────────────────────────────────────────────────
#
# Validation rules for the OmniCode type system.
# Structure: Cc (Rules) → Co (Operations) → Cv (Cognition) → Cx (Generation)
#
# Organization Pattern:
#   Cc.1 PRIMITIVE   — Base type validation (trit, int9, text, bool3)
#   Cc.2 CONSTRAINT  — Applied constraint validation (range, pattern, enum)
#   Cc.3 STRUCTURAL  — Composite type validation (struct, union, list, map)
#   Cc.4 SCHEMA      — OmniCode file structure validation (pragma, blocks)
#   Co.1 ERROR       — Error handling, severity levels, aggregation
#   Co.2 MODES       — When validation runs (compile, runtime, boundary)
#   Cv.1-4 COGNITION — Biblical grounding, mental model, wisdom, ternary
#   Cx.1-6 GENERATION — Code generation targets, templates, validation
#
# ─────────────────────────────────────────────────────────────

[index]
type = "split_index"
total_files = 7
total_sections = 16
original_lines = 3145

[index.key_constants]
total_validators = 28
validator_categories = 4
severity_levels = 3
validation_modes = 4

[index.files]
primitive = { file = "validation-primitive.toml", sections = "Cc.1" }
constraint = { file = "validation-constraint.toml", sections = "Cc.2" }
structural = { file = "validation-structural.toml", sections = "Cc.3" }
schema = { file = "validation-schema.toml", sections = "Cc.4" }
errors_modes = { file = "validation-errors-modes.toml", sections = "Co.1-2" }
cognition = { file = "validation-cognition.toml", sections = "Cv.1-4" }
generation = { file = "validation-generation.toml", sections = "Cx.1-6" }

# ─────────────────────────────────────────────────────────────
# VALIDATION CATEGORIES
# ─────────────────────────────────────────────────────────────
#
# PRIMITIVE (8 validators):
#   trit, trit5, int9, uint9, int27, uint27, text, bool3
#
# CONSTRAINT (8 validators):
#   range, pattern, enum, length, unique, foreign_key, default, immutable
#
# STRUCTURAL (6 validators):
#   struct, union, list, map, tuple, bytes
#
# SCHEMA (6 validators):
#   pragma, blocks_3, blocks_4, blocks_5, block_boundary, metadata
#
# ERROR SYSTEM:
#   3 severity levels (error, warning, info)
#   Structured error format with location, code, message, help
#   Aggregation with configurable limits
#
# VALIDATION MODES:
#   compile_time — Static analysis (strictest)
#   runtime — Dynamic checks (strict)
#   parse_time — Parsing checks (strict, early)
#   boundary — System boundary checks (never trust external)
#
# TOTAL: 28 validators across 4 categories + error system + 4 modes
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for index file"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "python3 -c \"import tomllib; tomllib.load(open('validation.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('validation-primitive.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('validation-constraint.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('validation-structural.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('validation-schema.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('validation-errors-modes.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('validation-cognition.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('validation-generation.toml','rb'))\"",
]

[_validation.schema]
required = ["index"]
optional = ["index.key_constants", "index.files", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_split_files_valid = 30
index_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
