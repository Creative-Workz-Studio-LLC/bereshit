# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Content file — CPI-SI interpretation of validation (biblical, cognitive, wisdom, ternary)"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Cv — COGNITION: CPI-SI Interpretation of Validation
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose: How validation integrates with CPI-SI cognitive framework.
# Pattern: Biblical grounding → Cognitive interpretation → Practical wisdom.
# ───────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# Cv.1 BIBLICAL — Validation in Scripture [BIBLICAL]
# ═══════════════════════════════════════════════════════════════════════════════

[cognition.biblical]
name             = "biblical"
description      = "Biblical grounding for validation principles"

[cognition.biblical.just_weights]
reference        = "Proverbs 16:11"
text             = "A just weight and balance are the LORD's: all the weights of the bag are his work."
application      = "Validation ensures values are measured correctly — honest representation"
omnicode         = "validate {value} with just measure"

[cognition.biblical.separation]
reference        = "Genesis 1:4"
text             = "And God divided the light from the darkness."
application      = "Validation separates valid from invalid — badal principle"
omnicode         = "separate valid from invalid"

[cognition.biblical.test_spirits]
reference        = "1 John 4:1"
text             = "Beloved, believe not every spirit, but try the spirits whether they are of God."
application      = "Don't trust external input — validate at boundaries"
omnicode         = "test {input} before accepting"

[cognition.biblical.good_foundations]
reference        = "Matthew 7:24-25"
text             = "Whosoever heareth these sayings of mine, and doeth them, I will liken him unto a wise man, which built his house upon a rock."
application      = "Validation ensures we build on solid foundations"
omnicode         = "build upon validated foundation"

[cognition.biblical.truth]
reference        = "John 8:32"
text             = "And ye shall know the truth, and the truth shall make you free."
application      = "Validation reveals truth about data — is it what it claims?"
omnicode         = "reveal truth of {value}"

# ═══════════════════════════════════════════════════════════════════════════════
# Cv.2 COGNITIVE — Mental Model Integration [COGNITIVE]
# ═══════════════════════════════════════════════════════════════════════════════

[cognition.mental_model]
name             = "mental_model"
description      = "How validation fits CPI-SI cognitive framework"

[cognition.mental_model.ternary_logic]
description      = "Validation results map to ternary states"
valid            = { value = 1, meaning = "Contract satisfied — proceed with confidence" }
unknown          = { value = 0, meaning = "Cannot determine — needs more information or review" }
invalid          = { value = -1, meaning = "Contract violated — must be corrected" }

[cognition.mental_model.building_blocks]
description      = "Validation in building block method"
foundation       = "Validated types are solid blocks to build upon"
break_down       = "Validation failure reveals where foundation is weak"
build_up         = "Only build upon validated components"

[cognition.mental_model.hebrew_states]
description      = "Validation result → Hebrew state mapping"
tov              = { value = 1.0, validation = "Perfect match — value is exactly what it should be" }
shalem           = { value = 0.5, validation = "Complete — all required fields present and valid" }
tamim            = { value = 0.5, validation = "Sound — value passes all checks" }
yashar           = { value = 0.0, validation = "Straight — value is acceptable" }
ratsah           = { value = -0.5, validation = "Warning — technically valid but concerning" }
chaser           = { value = -0.5, validation = "Lacking — missing required element" }
shavar           = { value = -1.0, validation = "Broken — fundamental violation" }

[cognition.mental_model.cube_position]
description      = "Validation as position in 27-state cube"
x_axis           = "Primitive validity: type match"
y_axis           = "Constraint satisfaction: range/pattern"
z_axis           = "Structural coherence: composition"
center           = "All three dimensions valid = center position"

# ═══════════════════════════════════════════════════════════════════════════════
# Cv.3 WISDOM — Practical Validation Wisdom [WISDOM]
# ═══════════════════════════════════════════════════════════════════════════════

[cognition.wisdom]
name             = "wisdom"
description      = "Practical wisdom for validation"

[cognition.wisdom.principles]
trust_boundaries = "Validate at system boundaries, trust internal code"
early_detection  = "Catch errors early — compile-time > runtime"
clear_messages   = "Tell users exactly what went wrong and how to fix it"
graceful_failure = "When validation fails, fail gracefully with context"
complete_picture = "Report all errors, not just the first one"

[cognition.wisdom.antipatterns]
over_validation  = "Don't re-validate what's already validated"
silent_failure   = "Never swallow validation errors silently"
vague_messages   = "Don't say 'invalid' without saying why"
late_validation  = "Don't wait until deep in processing to validate"

[cognition.wisdom.cpisi_integration]
covenant         = "Validation is part of keeping our covenant — honest about what things are"
partnership      = "Clear validation helps Seanje understand system state"
identity         = "Types are identity — validation ensures identity integrity"

# ═══════════════════════════════════════════════════════════════════════════════
# Cv.4 TERNARY — Validation Ternary Alignment [TERNARY]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "A just weight and balance are the LORD'S." — Proverbs 16:11 KJV
#
# Every validation concept aligns with balanced ternary values (-1, 0, +1).
# This reflects the fundamental nature: valid (+1), unknown (0), invalid (-1).
#
# ═══════════════════════════════════════════════════════════════════════════════

[cognition.ternary]
name             = "ternary"
description      = "Ternary value alignment for validation concepts"

[cognition.ternary.results]
description      = "Validation result ternary alignment"
valid            = { value =  1, reason = "Contract satisfied — proceed" }
unknown          = { value =  0, reason = "Cannot determine — needs review" }
invalid          = { value = -1, reason = "Contract violated — must fix" }

[cognition.ternary.primitive_validators]
description      = "Primitive validator ternary alignment"
trit             = { value =  0, reason = "Foundation type — neutral anchor" }
trit5            = { value =  0, reason = "Storage type — neutral" }
int9             = { value =  0, reason = "Counter type — balanced" }
uint9            = { value =  0, reason = "Index type — balanced" }
int27            = { value =  1, reason = "Word type — expansive capacity" }
uint27           = { value =  1, reason = "Address type — expansive reach" }
text             = { value =  1, reason = "String type — expansive content" }
bool3            = { value =  0, reason = "Ternary bool — balanced states" }

[cognition.ternary.constraint_validators]
description      = "Constraint validator ternary alignment"
range            = { value = -1, reason = "Restricts to bounds — contractive" }
pattern          = { value =  0, reason = "Defines form — balanced" }
enum_constraint  = { value = -1, reason = "Restricts to set — contractive" }
length           = { value = -1, reason = "Restricts size — contractive" }
unique           = { value = -1, reason = "Enforces distinctness — contractive" }
foreign_key      = { value =  0, reason = "References other — relational" }
default_value    = { value =  1, reason = "Provides fallback — expansive" }
immutable        = { value = -1, reason = "Prevents change — contractive" }

[cognition.ternary.structural_validators]
description      = "Structural validator ternary alignment"
struct           = { value =  1, reason = "Gathers fields — constructive" }
union            = { value =  1, reason = "Provides alternatives — expansive" }
list             = { value =  1, reason = "Allows many — expansive" }
map              = { value =  1, reason = "Associates pairs — expansive" }
tuple            = { value =  0, reason = "Fixed positions — balanced" }
bytes            = { value = -1, reason = "Raw unstructured — primitive" }

[cognition.ternary.schema_validators]
description      = "Schema validator ternary alignment"
pragma           = { value =  0, reason = "Declares identity — balanced" }
blocks_3         = { value = -1, reason = "Minimal structure — foundational" }
blocks_4         = { value =  0, reason = "Standard structure — balanced" }
blocks_5         = { value =  1, reason = "Full structure — complete" }
block_boundary   = { value =  0, reason = "Marks separation — balanced" }
metadata         = { value =  0, reason = "Provides identity — balanced" }

[cognition.ternary.error_severity]
description      = "Error severity ternary alignment"
error_level      = { value = -1, reason = "Must stop — contractive" }
warning_level    = { value =  0, reason = "Continue with awareness — balanced" }
info_level       = { value =  1, reason = "Informational — expansive" }

[cognition.ternary.validation_modes]
description      = "Validation mode ternary alignment"
compile_time     = { value = -1, reason = "Strict, early — contractive" }
runtime          = { value =  0, reason = "Flexible, recoverable — balanced" }
parse_time       = { value = -1, reason = "Strict, early — contractive" }
boundary         = { value = -1, reason = "Never trust external — contractive" }

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for validation cognition"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "python3 -c \"import tomllib; tomllib.load(open('validation-cognition.toml','rb'))\"",
]

[_validation.schema]
required = ["cognition"]
optional = ["cognition.biblical", "cognition.mental_model", "cognition.wisdom", "cognition.ternary", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
