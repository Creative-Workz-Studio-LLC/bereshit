    "validation-generation.toml — Code generation (Cx.1-6)",
]
required_sections = ["_pragma", "_metadata", "_content", "cognition", "_validation", "_closing"]
validate = "python3 -c \"import tomllib; tomllib.load(open('validation-cognition.toml','rb'))\""

[_closing.X5_note]
note = "Cognition connects validation rules to eternal principles — WHY we validate, not just HOW."
scripture = "In the beginning God created the heaven and the earth. — Genesis 1:1"
anchor = "Test the spirits. 1 John 4:1 applied to data — discernment is validation's purpose."

