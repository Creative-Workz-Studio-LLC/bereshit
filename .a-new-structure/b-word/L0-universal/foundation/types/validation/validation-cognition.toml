[_pragma]
format = "@omni data --toml"

[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

[_pragma.P1_core]
key = "B-L0-foundation-types-validation-cognition"
from = "b-word/seed/data/toml/config.toml"
at = "b-01.00"

[_pragma.P2_family]
type = "data"
subtype = "types"
role = "rung"
structure = "3-block"

[_pragma.P3_instance]
component = "foundation"
layer = "L0-universal/foundation/types"
includes = "none"
provides = ["VALIDATION_BIBLICAL", "VALIDATION_COGNITIVE", "VALIDATION_WISDOM", "VALIDATION_TERNARY"]

[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
title = "Validation Cognition"
brief = "CPI-SI interpretation — biblical grounding, mental model, wisdom principles, ternary alignment"

# ═══════════════════════════════════════════════════════════════
# END PRAGMA [END]
