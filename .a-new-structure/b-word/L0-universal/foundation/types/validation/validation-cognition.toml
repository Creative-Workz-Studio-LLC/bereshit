paradigm_drift = "Check cognitive mappings align with current CPI-SI paradigm documentation"

[_closing.X4_reference]
related_files = [
    "validation.toml — Index file (parent)",
    "validation-primitive.toml — Base type validation (Cc.1)",
    "validation-constraint.toml — Constraint validation (Cc.2)",
    "validation-structural.toml — Composite type validation (Cc.3)",
