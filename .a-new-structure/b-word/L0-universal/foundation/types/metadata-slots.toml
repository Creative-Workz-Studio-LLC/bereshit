# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════════════════════

[_content]
format = "TOML — native tables, UTF-8, LF line endings"
key_convention = "UPPER_SNAKE for slot names, lower_snake for properties"
constraint = "13 slots exactly (0-12). Ordinals = 243 + slot. Categories: Reserved(0), Config(1-4), Resource(5-8), System(9-12)."

# ───────────────────────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ───────────────────────────────────────────────────────────────────────────────

[metadata]
description = "13 metadata slots completing BRIDGE equation"
count = 13
reserved = 1
working = 12

# The BRIDGE equation
[metadata.bridge]
penteract = 243
bridge = 13
total = 256
description = "243 + 13 = 256 — BRIDGE completes the byte"

# Categories (4 slots each after reserved)
[metadata.categories]
description = "4 categories organizing the 12 working slots"

RESERVED = { slots = [0], description = "Anchor slot (fallback)" }
CONFIG   = { slots = [1, 2, 3, 4], description = "Configuration metadata" }
RESOURCE = { slots = [5, 6, 7, 8], description = "Resource metadata" }
SYSTEM   = { slots = [9, 10, 11, 12], description = "System metadata" }

# ───────────────────────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ───────────────────────────────────────────────────────────────────────────────

# Individual slot definitions
[metadata.slots]
description = "13 slots with ordinal values (243 + slot)"

RESERVED   = { slot = 0,  ordinal = 243, description = "Fallback/anchor" }
VERSION    = { slot = 1,  ordinal = 244, category = "CONFIG", description = "Version mismatch" }
CONFIG     = { slot = 2,  ordinal = 245, category = "CONFIG", description = "Configuration error" }
STATE      = { slot = 3,  ordinal = 246, category = "CONFIG", description = "Invalid state" }
INIT       = { slot = 4,  ordinal = 247, category = "CONFIG", description = "Initialization failed" }
MEMORY     = { slot = 5,  ordinal = 248, category = "RESOURCE", description = "Memory allocation" }
TIMEOUT    = { slot = 6,  ordinal = 249, category = "RESOURCE", description = "Operation timeout" }
PERMISSION = { slot = 7,  ordinal = 250, category = "RESOURCE", description = "Permission denied" }
RESOURCE   = { slot = 8,  ordinal = 251, category = "RESOURCE", description = "Resource unavailable" }
ASSERT     = { slot = 9,  ordinal = 252, category = "SYSTEM", description = "Assertion failed" }
OVERFLOW   = { slot = 10, ordinal = 253, category = "SYSTEM", description = "Numeric overflow" }
UNDERFLOW  = { slot = 11, ordinal = 254, category = "SYSTEM", description = "Numeric underflow" }
FORMAT     = { slot = 12, ordinal = 255, category = "SYSTEM", description = "Format error (MAX)" }

# Bounds
[metadata.bounds]
slot_min = 0
slot_max = 12
ordinal_min = 243
ordinal_max = 255

# ───────────────────────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ───────────────────────────────────────────────────────────────────────────────

[extensions]

[_validation]
commands = "python3 -c \"import tomllib; tomllib.load(open('metadata-slots.toml','rb'))\""

[_validation.schema]
required = ["metadata", "metadata.bridge", "metadata.categories", "metadata.slots", "metadata.bounds"]

[_validation.health_scoring]
base = 100
deductions = { missing_table = -20, invalid_toml = -100 }

