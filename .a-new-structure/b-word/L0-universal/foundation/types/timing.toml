# ═══════════════════════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════════════════════

[_content]
format = "TOML — native tables, UTF-8, LF line endings"
key_convention = "UPPER_SNAKE for interval names, lower_snake for properties"
constraint = "POLL (1000ms) is the anchor. All other intervals derived from it. 9 rotation tiers from real-time to weekly."

# ───────────────────────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ───────────────────────────────────────────────────────────────────────────────

[timing]
description = "Timing intervals derived from POLL anchor"
anchor_ms = 1000
count = 5

# Interval definitions (derived from POLL = 1000ms)
[timing.intervals]
description = "5 intervals: fastest to slowest"

DEBOUNCE  = { index = 0, ms = 100,  formula = "POLL / 10", description = "Fastest — UI debounce" }
HALF_POLL = { index = 1, ms = 499,  formula = "POLL / 2 - 1", description = "Half poll interval" }
POLL      = { index = 2, ms = 1000, formula = "POLL (anchor)", description = "CENTER — standard check" }
FLUSH     = { index = 3, ms = 3000, formula = "POLL * 3", description = "Buffer flush interval" }
TIMEOUT   = { index = 4, ms = 5000, formula = "POLL * 5", description = "Slowest — operation timeout" }

# Bounds
[timing.bounds]
min_ms = 100
max_ms = 5000
center_index = 2

# ───────────────────────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ───────────────────────────────────────────────────────────────────────────────

# Rotation tiers (9 tiers for log rotation)
[timing.rotation]
description = "9 rotation tiers for log management"
count = 9

# Tier 0 = most frequent (100ms), Tier 8 = least frequent (1 week)
tiers = [
    { index = 0, interval = "100ms", description = "Real-time" },
    { index = 1, interval = "1s", description = "Second" },
    { index = 2, interval = "10s", description = "Deca-second" },
    { index = 3, interval = "1m", description = "Minute" },
    { index = 4, interval = "10m", description = "Deca-minute (CENTER)" },
    { index = 5, interval = "1h", description = "Hour" },
    { index = 6, interval = "6h", description = "Quarter-day" },
    { index = 7, interval = "1d", description = "Day" },
    { index = 8, interval = "1w", description = "Week" },
]

# ───────────────────────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ───────────────────────────────────────────────────────────────────────────────

[extensions]

[_validation]
commands = "python3 -c \"import tomllib; tomllib.load(open('timing.toml','rb'))\""

[_validation.schema]
required = ["timing", "timing.intervals", "timing.bounds", "timing.rotation"]

[_validation.health_scoring]
base = 100
deductions = { missing_table = -25, invalid_toml = -100 }

# ═══════════════════════════════════════════════════════════════════════════════
# END CONTENT [END]
