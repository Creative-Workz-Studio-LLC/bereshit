# "Be ye doers of the word, and not hearers only" — James 1:22 KJV
#
# PRIMITIVE TYPE BEHAVIOR: SYNTAX, SEMANTICS, BINDINGS
#
# Behavior defines HOW types operate in code — the OmniCode syntax for declaring
# and using them, the CPI-SI cognitive mappings for understanding them, and the
# language bindings for implementing them.
#
# WHAT BELONGS IN BEHAVIOR:
#
#   - OmniCode syntax (declare, literal, cast, operators)
#   - CPI-SI cognitive mappings (direction, weight, action, genesis)
#   - Language type bindings (c_repr, go_repr, rust_repr)
#   - Type-specific operations (for collections, etc.)
#
# BEHAVIOR VS SETTINGS VS RESOURCES:
#
#   SETTINGS:  "What are the configuration values?"
#   RESOURCES: "How much space/capacity does it need?"
#   BEHAVIOR:  "How does it operate in code?"
#
# Implementation: Used by code generators and the OmniCode compiler
# Reference:      OmniCode syntax specification
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.1 OMNICODE SYNTAX — Storage Operations [OMNICODE_STORAGE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Write the vision, and make it plain" — Habakkuk 2:2 KJV
#
# OmniCode syntax for storage operations.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.omnicode.storage]
description = "OmniCode syntax for storage operations"

keywords    = ["store", "load", "pack", "unpack", "encode", "decode"]
operators   = ["→", "←", "⇄"]                            # store, load, bidirectional
modifiers   = ["packed", "unpacked", "aligned", "raw"]
sigils      = ["$:", "!:", "@:"]                         # packed, unpacked, aligned

[cc.behavior.omnicode.storage.examples]
pack        = "store packed $:value → $:buffer"
unpack      = "load packed $:buffer → $:value"
convert     = "encode unpacked !:text ⇄ packed $:bytes"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.2 CPISI MAPPINGS — Cognitive Framework [CPISI]
# ───────────────────────────────────────────────────────────────────────────────
#
# "For as he thinketh in his heart, so is he" — Proverbs 23:7 KJV
#
# How types map to the CPI-SI cognitive framework.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.cpisi]
description = "Type semantics in CPI-SI cognitive framework"

# Directional meaning (from building block method)
[cc.behavior.cpisi.direction]
negative    = "persist_down"                             # -1: toward material/earth
neutral     = "bridge"                                   # 0: firmament itself
positive    = "retrieve_up"                              # +1: toward conceptual/heaven

# Cognitive weight
[cc.behavior.cpisi.weight]
negative    = "heavy"                                    # Persistence is commitment
neutral     = "grounded"                                 # Bridge is stable
positive    = "light"                                    # Retrieval is access

# Action semantics
[cc.behavior.cpisi.action]
negative    = "commit"                                   # Write to permanent storage
neutral     = "hold"                                     # Buffer in bridge layer
positive    = "access"                                   # Read from storage

# Genesis 1:6 mapping
[cc.behavior.cpisi.genesis]
negative    = "waters_below"                             # Physical storage
neutral     = "firmament"                                # This bridge layer
positive    = "waters_above"                             # Conceptual types

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.3 LANGUAGE BINDINGS — Target Language Types [BINDINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "To every nation, and kindred, and tongue" — Revelation 14:6 KJV
#
# How primitive types map to target language types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.bindings]
description = "Type representations in target languages"

# Packed storage types
[cc.behavior.bindings.packed5]
c_repr      = "uint8_t"
go_repr     = "uint8"
rust_repr   = "u8"
trit_count  = 5

[cc.behavior.bindings.packed9]
c_repr      = "uint16_t"
go_repr     = "uint16"
rust_repr   = "u16"
trit_count  = 9

[cc.behavior.bindings.packed27]
c_repr      = "uint64_t"                                 # 6 bytes, padded to 8
go_repr     = "uint64"
rust_repr   = "u64"
trit_count  = 27

[cc.behavior.bindings.packed81]
c_repr      = "__int128"                                 # or custom struct
go_repr     = "big.Int"
rust_repr   = "i128"
trit_count  = 81

[cc.behavior.bindings.packed243]
c_repr      = "trit243_t"                                # Custom 49-byte struct
go_repr     = "big.Int"
rust_repr   = "[i8; 49]"
trit_count  = 243

