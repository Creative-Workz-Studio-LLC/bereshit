# ═══════════════════════════════════════════════════════════════════════════════
# Co TYPE OPERATIONS [OPERATIONS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "A just weight and balance are the LORD's: all the weights of the bag are
#  his work." — Proverbs 16:11 KJV
#
# TYPE OPERATIONS: HOW PRIMITIVES INTERACT AND TRANSFORM
#
# Types don't exist in isolation. They convert, validate, coerce. Operations
# define how primitives relate to each other — what transformations are safe,
# what validations catch errors, what coercions happen implicitly.
#
# JUST WEIGHTS:
#   Proverbs speaks of honest measurement. Type operations ARE the weights and
#   measures of data. Conversion must preserve meaning. Validation must catch
#   real errors. Coercion must be explicit about what's lost.
#
# OPERATION CATEGORIES:
#   CONVERSION: Explicit transformation between compatible types
#   VALIDATION: Checking that values meet type constraints
#   COERCION:   Implicit transformation (automatic, requires care)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register-width conversions, bit validation
#   L1 (System):    Syscall argument conversion, bounds checking
#   L2 (Runtime):   Object type conversion, null validation
#   L3 (Framework): Wire format conversion, schema validation
#   L4 (Health):    Metric normalization, threshold validation
#   L5 (Network):   Protocol conversion, packet validation
#   L6 (Storage):   Serialization, data integrity validation
#   L7 (Engine):    Rule conversion, constraint validation
#   L8 (App):       User input conversion, form validation
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Co.1 CONVERSION — Type Conversion Rules [CONVERSION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Divers weights are an abomination unto the LORD; and a false balance is
#  not good." — Proverbs 20:23 KJV
#
# CONVERSION: EXPLICIT, HONEST TRANSFORMATION
#
# Conversion changes a value from one type to another. Unlike coercion, conversion
# is EXPLICIT — the programmer states their intent. Honest conversion preserves
# meaning; it never silently truncates or corrupts.
#
# CONVERSION PRINCIPLES:
#   1. Widening is always safe (int9 → int27)
#   2. Narrowing requires validation (int27 → int9 may overflow)
#   3. Between families requires explicit rules (int → float)
#   4. Conversion failures are errors, not silent corruption
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Co.1a WIDENING — Safe Upward Conversion [WIDENING]
# ───────────────────────────────────────────────────────────────────────────────

[conversion.widening]
description  = "Safe conversion to larger types — no data loss possible"
principle    = "Widening is always safe"
explicit     = false                                          # Can be implicit

# Trit widening paths
[conversion.widening.trit]
description  = "Trit to larger types"
trit_to_int9   = { safe = true,  method = "direct",    note = "trit fits in int9" }
trit_to_int27  = { safe = true,  method = "direct",    note = "trit fits in int27" }
trit_to_bool3  = { safe = true,  method = "interpret", note = "-1=false, 0=unknown, 1=true" }
trit_to_float27 = { safe = true, method = "direct",    note = "integer to float" }

# Integer widening paths
[conversion.widening.integer]
description  = "Integer to larger integers"
int9_to_int27  = { safe = true,  method = "sign_extend", note = "9 trits → 27 trits" }
uint9_to_uint27 = { safe = true, method = "zero_extend", note = "9 trits → 27 trits" }
uint9_to_int27 = { safe = true,  method = "zero_extend", note = "unsigned fits in signed" }
int9_to_float27 = { safe = true, method = "direct",      note = "integer to float" }
int27_to_float27 = { safe = true, method = "direct",     note = "integer to float" }

# Trit5 widening paths
[conversion.widening.trit5]
description  = "Trit5 (packed) to larger types"
trit5_to_int9  = { safe = true,  method = "direct",    note = "243 states fit in int9" }
trit5_to_int27 = { safe = true,  method = "direct",    note = "243 states fit in int27" }
trit5_to_uint9 = { safe = true,  method = "direct",    note = "0-242 fits in uint9" }

# Widening at each layer
[conversion.widening.scales]
description  = "Widening usage at each architectural layer"
L0_kernel    = { use = "register promotion",               example = "trit → word register" }
L1_system    = { use = "syscall argument expansion",       example = "int9 arg → int27" }
L2_runtime   = { use = "array index promotion",            example = "uint9 → uint27 for large array" }
L3_framework = { use = "config value normalization",       example = "small int → standard size" }
L4_health    = { use = "metric aggregation",               example = "component score → total" }
L5_network   = { use = "sequence number expansion",        example = "short seq → long seq" }
L6_storage   = { use = "offset expansion",                 example = "small offset → large file" }
L7_engine    = { use = "priority promotion",               example = "local priority → global" }
L8_app       = { use = "quantity expansion",               example = "item count → total count" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.1b NARROWING — Checked Downward Conversion [NARROWING]
# ───────────────────────────────────────────────────────────────────────────────

[conversion.narrowing]
description  = "Conversion to smaller types — requires validation"
principle    = "Narrowing may lose data; must check"
explicit     = true                                           # MUST be explicit

# Integer narrowing paths
[conversion.narrowing.integer]
description  = "Integer to smaller integers"
int27_to_int9  = { safe = false, method = "checked",   overflow = "error", note = "may overflow" }
int27_to_uint9 = { safe = false, method = "checked",   overflow = "error", note = "may overflow or be negative" }
uint27_to_uint9 = { safe = false, method = "checked",  overflow = "error", note = "may overflow" }
int9_to_trit   = { safe = false, method = "checked",   overflow = "error", note = "only -1, 0, +1 valid" }

# Float narrowing paths
[conversion.narrowing.float]
description  = "Float to integer types"
float27_to_int27 = { safe = false, method = "truncate", note = "loses fractional part" }
float27_to_int9  = { safe = false, method = "checked",  note = "may overflow + truncate" }

# Trit5 narrowing paths
[conversion.narrowing.trit5]
description  = "Larger types to trit5"
int9_to_trit5  = { safe = false, method = "checked",   note = "only 0-242 valid" }
int27_to_trit5 = { safe = false, method = "checked",   note = "only 0-242 valid" }

# Narrowing behaviors
[conversion.narrowing.behaviors]
description  = "What happens when narrowing fails"
error        = { action = "return error",              when = "checked narrowing fails" }
saturate     = { action = "clamp to min/max",          when = "saturating mode enabled" }
truncate     = { action = "keep low bits/trits",       when = "truncating mode enabled" }
wrap         = { action = "modulo arithmetic",         when = "wrapping mode enabled" }

# Narrowing at each layer
[conversion.narrowing.scales]
description  = "Narrowing usage at each architectural layer"
L0_kernel    = { use = "register demotion",                example = "word → trit for flag" }
L1_system    = { use = "return code compression",          example = "int27 result → int9" }
L2_runtime   = { use = "index bounds check",               example = "computed index → array bound" }
L3_framework = { use = "config validation",                example = "user value → constrained range" }
L4_health    = { use = "score normalization",              example = "raw score → 0-100 range" }
L5_network   = { use = "header compression",               example = "long value → wire format" }
L6_storage   = { use = "compact storage",                  example = "large offset → extent" }
L7_engine    = { use = "priority compression",             example = "computed priority → byte" }
L8_app       = { use = "display formatting",               example = "precise value → rounded" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.1c CROSS_FAMILY — Between Type Families [CROSS_FAMILY]
# ───────────────────────────────────────────────────────────────────────────────

[conversion.cross_family]
description  = "Conversion between different type families"
principle    = "Different families require explicit semantics"
explicit     = true                                           # ALWAYS explicit

# Integer ↔ Float
[conversion.cross_family.integer_float]
description  = "Integer to/from floating point"
int_to_float = { method = "direct",   note = "exact for small integers" }
float_to_int = { method = "truncate", note = "loses fractional part" }

# Integer ↔ Boolean
[conversion.cross_family.integer_bool]
description  = "Integer to/from boolean"
int_to_bool  = { method = "zero_test", note = "0→unknown, positive→true, negative→false" }
bool_to_int  = { method = "direct",    note = "-1, 0, +1 directly" }

# Text ↔ Integer
[conversion.cross_family.text_integer]
description  = "Text to/from integer"
int_to_text  = { method = "format",    note = "produces decimal string" }
text_to_int  = { method = "parse",     note = "may fail if not numeric" }

# Any ↔ Specific
[conversion.cross_family.any_specific]
description  = "Any to/from specific types"
specific_to_any = { method = "box",     note = "wrap value with type tag" }
any_to_specific = { method = "unbox",   note = "extract and check type tag" }

# Cross-family at each layer
[conversion.cross_family.scales]
description  = "Cross-family usage at each architectural layer"
L0_kernel    = { use = "flag interpretation",              example = "int → bool for condition" }
L1_system    = { use = "error code to string",             example = "errno → message" }
L2_runtime   = { use = "string parsing",                   example = "\"42\" → int" }
L3_framework = { use = "JSON conversion",                  example = "any → specific type" }
L4_health    = { use = "metric formatting",                example = "float → display string" }
L5_network   = { use = "protocol encoding",                example = "struct → bytes" }
L6_storage   = { use = "serialization",                    example = "object → bytes → object" }
L7_engine    = { use = "rule evaluation",                  example = "expression → bool" }
L8_app       = { use = "form processing",                  example = "text input → typed value" }


# ═══════════════════════════════════════════════════════════════════════════════
# Co.2 VALIDATION — Type Validation Rules [VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Prove all things; hold fast that which is good." — 1 Thessalonians 5:21 KJV
#
# VALIDATION: PROVING VALUES ARE CORRECT
#
# Validation checks that a value meets type constraints BEFORE use. It's the
# guard at the gate — bad values don't get in, good values proceed confidently.
#
# VALIDATION PRINCIPLES:
#   1. Validate at boundaries (input, API, storage)
#   2. Trust validated values internally (no redundant checks)
#   3. Fail fast and clear (errors describe the problem)
#   4. Validation is NOT conversion (it checks, doesn't transform)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Co.2a RANGE — Numeric Range Validation [RANGE]
# ───────────────────────────────────────────────────────────────────────────────

[validation.range]
description  = "Checking numeric values are within type bounds"
principle    = "Values must fit their declared type"

# Trit validation
[validation.range.trit]
description  = "Trit must be exactly -1, 0, or +1"
valid_values = [-1, 0, 1]
check        = "value in [-1, 0, 1]"
error        = "trit value must be -1, 0, or +1; got %d"

# Trit5 validation
[validation.range.trit5]
description  = "Trit5 must be 0-242 (packed) or -121 to +121 (balanced)"
packed_min   = 0
packed_max   = 242
balanced_min = -121
balanced_max = 121
check        = "(packed: 0 ≤ v ≤ 242) or (balanced: -121 ≤ v ≤ 121)"
error        = "trit5 value out of range; got %d"

# Integer validation
[validation.range.int9]
description  = "int9 range check"
min          = -9841
max          = 9841
check        = "-9841 ≤ v ≤ 9841"
error        = "int9 overflow; got %d, valid range [-9841, 9841]"

[validation.range.uint9]
description  = "uint9 range check"
min          = 0
max          = 19682
check        = "0 ≤ v ≤ 19682"
error        = "uint9 overflow; got %d, valid range [0, 19682]"

[validation.range.int27]
description  = "int27 (Word) range check"
min          = -3812798742493
max          = 3812798742493
check        = "-3812798742493 ≤ v ≤ 3812798742493"
error        = "int27 overflow; got %d, valid range [±3.8T]"

[validation.range.uint27]
description  = "uint27 range check"
min          = 0
max          = 7625597484986
check        = "0 ≤ v ≤ 7625597484986"
error        = "uint27 overflow; got %d, valid range [0, 7.6T]"

# Range validation at each layer
[validation.range.scales]
description  = "Range validation at each architectural layer"
L0_kernel    = { use = "register bounds",                  example = "ALU input validation" }
L1_system    = { use = "syscall args",                     example = "file descriptor range" }
L2_runtime   = { use = "array bounds",                     example = "index < length" }
L3_framework = { use = "config limits",                    example = "port 0-65535" }
L4_health    = { use = "score bounds",                     example = "0.0 ≤ health ≤ 1.0" }
L5_network   = { use = "protocol fields",                  example = "TTL 0-255" }
L6_storage   = { use = "offset bounds",                    example = "offset < file_size" }
L7_engine    = { use = "parameter limits",                 example = "priority 0-100" }
L8_app       = { use = "user input",                       example = "quantity > 0" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.2b NULL — Null/Empty Validation [NULL]
# ───────────────────────────────────────────────────────────────────────────────

[validation.null]
description  = "Checking for null/empty/void values"
principle    = "Know what emptiness means for each type"

# Nullable types
[validation.null.nullable]
description  = "Types that can be null"
nullable_types = ["text", "list", "map", "set", "any"]
non_nullable  = ["trit", "trit5", "int9", "uint9", "int27", "uint27", "bool3", "void"]

# Empty states
[validation.null.empty_states]
description  = "Empty value for each collection type"
text_empty   = { value = "\"\"",   check = "text.length == 0" }
list_empty   = { value = "[]",     check = "list.length == 0" }
map_empty    = { value = "{}",     check = "map.length == 0" }
set_empty    = { value = "{}",     check = "set.length == 0" }
any_null     = { value = "null",   check = "any == null" }

# Void handling
[validation.null.void_handling]
description  = "Void is not null — void means 'no value to check'"
void_meaning = "absence of return, not null pointer"
void_check   = "no check needed — void has no value"

# Null validation at each layer
[validation.null.scales]
description  = "Null validation at each architectural layer"
L0_kernel    = { use = "null pointer check",               example = "ptr != NULL" }
L1_system    = { use = "invalid handle",                   example = "fd != -1" }
L2_runtime   = { use = "nil check",                        example = "object != nil" }
L3_framework = { use = "missing config",                   example = "config.get(key) != null" }
L4_health    = { use = "missing metric",                   example = "metric.has_value()" }
L5_network   = { use = "disconnected",                     example = "conn != null" }
L6_storage   = { use = "missing record",                   example = "record.exists()" }
L7_engine    = { use = "undefined state",                  example = "state.is_defined()" }
L8_app       = { use = "empty input",                      example = "input.trim() != \"\"" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.2c FORMAT — Format Validation [FORMAT]
# ───────────────────────────────────────────────────────────────────────────────

[validation.format]
description  = "Validating text/data format patterns"
principle    = "Structure must match expected pattern"

# Text format patterns
[validation.format.text]
description  = "Common text validation patterns"
not_empty    = { pattern = ".+",                           note = "at least one character" }
alphanumeric = { pattern = "[a-zA-Z0-9]+",                 note = "letters and digits only" }
identifier   = { pattern = "[a-zA-Z_][a-zA-Z0-9_]*",       note = "valid identifier" }
integer_str  = { pattern = "-?[0-9]+",                     note = "numeric string" }
float_str    = { pattern = "-?[0-9]+\\.?[0-9]*",           note = "decimal string" }

# Trit string formats
[validation.format.trit_string]
description  = "Ternary literal format validation"
single_trit  = { pattern = "[T10N+-]",                     note = "single trit: T/+/1, 0, N/-" }
trit_array   = { pattern = "[T10N+-]+",                    note = "trit sequence" }
balanced     = { pattern = "-?[0-9]+t",                    note = "balanced ternary literal" }

# Collection format
[validation.format.collection]
description  = "Collection structure validation"
list_format  = { check = "ordered, allows duplicates",     note = "sequence semantics" }
map_format   = { check = "keys unique, values associated", note = "lookup semantics" }
set_format   = { check = "no duplicates, membership",      note = "membership semantics" }

# Format validation at each layer
[validation.format.scales]
description  = "Format validation at each architectural layer"
L0_kernel    = { use = "opcode format",                    example = "instruction encoding" }
L1_system    = { use = "path format",                      example = "valid filesystem path" }
L2_runtime   = { use = "string format",                    example = "valid UTF-8" }
L3_framework = { use = "config syntax",                    example = "valid TOML/JSON" }
L4_health    = { use = "metric name",                      example = "prometheus format" }
L5_network   = { use = "address format",                   example = "valid IP address" }
L6_storage   = { use = "record structure",                 example = "schema compliance" }
L7_engine    = { use = "rule syntax",                      example = "valid expression" }
L8_app       = { use = "user input",                       example = "email format" }


# ═══════════════════════════════════════════════════════════════════════════════
# Co.3 COERCION — Implicit Type Transformation [COERCION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Be not deceived; God is not mocked: for whatsoever a man soweth, that shall
#  he also reap." — Galatians 6:7 KJV
#
# COERCION: IMPLICIT TRANSFORMATION WITH CARE
#
# Coercion is automatic type conversion — the compiler/runtime does it without
# explicit instruction. This is powerful but dangerous. Implicit coercion can
# hide bugs, lose precision, or silently change meaning.
#
# COERCION PRINCIPLES:
#   1. Only coerce when meaning is preserved
#   2. Never coerce when precision is lost
#   3. Make dangerous coercions explicit
#   4. Document all coercion rules clearly
#
# YOU REAP WHAT YOU SOW:
#   Coercion that loses information is deceptive. If int27 coerces to int9 and
#   overflows silently, you've sown deception and will reap corruption. Honest
#   systems make lossy operations explicit.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Co.3a SAFE_COERCION — Automatic Safe Transformations [SAFE_COERCION]
# ───────────────────────────────────────────────────────────────────────────────

[coercion.safe]
description  = "Coercions that are always safe — no information loss"
principle    = "Automatic coercion only when meaning is fully preserved"

# Trit coercions
[coercion.safe.trit]
description  = "Safe automatic trit conversions"
trit_to_int9   = { automatic = true,  note = "trit always fits in int9" }
trit_to_int27  = { automatic = true,  note = "trit always fits in int27" }
trit_to_bool3  = { automatic = true,  note = "same value space" }

# Integer widening coercions
[coercion.safe.integer]
description  = "Safe automatic integer widening"
int9_to_int27  = { automatic = true,  note = "int9 always fits in int27" }
uint9_to_uint27 = { automatic = true, note = "uint9 always fits in uint27" }
uint9_to_int27 = { automatic = true,  note = "unsigned fits in larger signed" }

# Trit5 coercions
[coercion.safe.trit5]
description  = "Safe automatic trit5 conversions"
trit5_to_int9  = { automatic = true,  note = "243 states fit in int9" }
trit5_to_int27 = { automatic = true,  note = "243 states fit in int27" }

# Safe coercion at each layer
[coercion.safe.scales]
description  = "Safe coercion at each architectural layer"
L0_kernel    = { use = "register promotion",               example = "trit → word in expression" }
L1_system    = { use = "argument promotion",               example = "small arg in large call" }
L2_runtime   = { use = "expression evaluation",            example = "int9 + int27 → int27" }
L3_framework = { use = "type unification",                 example = "common type in collection" }
L4_health    = { use = "metric combination",               example = "combine different precisions" }
L5_network   = { use = "protocol assembly",                example = "field widening" }
L6_storage   = { use = "index computation",                example = "offset calculation" }
L7_engine    = { use = "rule evaluation",                  example = "operand promotion" }
L8_app       = { use = "display preparation",              example = "value formatting" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.3b UNSAFE_COERCION — Requires Explicit Cast [UNSAFE_COERCION]
# ───────────────────────────────────────────────────────────────────────────────

[coercion.unsafe]
description  = "Coercions that require explicit cast — information may be lost"
principle    = "Never automatically lose information"

# Narrowing (NEVER automatic)
[coercion.unsafe.narrowing]
description  = "Narrowing is NEVER automatic"
int27_to_int9  = { automatic = false, reason = "may overflow" }
int27_to_trit  = { automatic = false, reason = "may overflow" }
float27_to_int = { automatic = false, reason = "loses fractional part" }
uint27_to_uint9 = { automatic = false, reason = "may overflow" }

# Signed/unsigned mixing (NEVER automatic)
[coercion.unsafe.signedness]
description  = "Sign conversion is NEVER automatic"
int9_to_uint9  = { automatic = false, reason = "negative values undefined" }
int27_to_uint27 = { automatic = false, reason = "negative values undefined" }
uint9_to_int9  = { automatic = false, reason = "large values overflow" }

# Any type (NEVER automatic TO specific)
[coercion.unsafe.any]
description  = "Any → specific is NEVER automatic"
any_to_int    = { automatic = false, reason = "runtime type check required" }
any_to_text   = { automatic = false, reason = "runtime type check required" }
any_to_list   = { automatic = false, reason = "runtime type check required" }

# Unsafe at each layer
[coercion.unsafe.scales]
description  = "Explicit cast usage at each architectural layer"
L0_kernel    = { use = "register demotion",                example = "cast<trit>(word)" }
L1_system    = { use = "error code extraction",            example = "cast<int9>(result)" }
L2_runtime   = { use = "index narrowing",                  example = "cast<uint9>(offset)" }
L3_framework = { use = "config extraction",                example = "value as int27" }
L4_health    = { use = "score rounding",                   example = "cast<int9>(score * 100)" }
L5_network   = { use = "header compression",               example = "cast<trit5>(length)" }
L6_storage   = { use = "compact encoding",                 example = "cast<uint9>(id)" }
L7_engine    = { use = "result extraction",                example = "cast<bool3>(eval)" }
L8_app       = { use = "form parsing",                     example = "value as int27" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.3c ARITHMETIC_COERCION — In Expressions [ARITHMETIC_COERCION]
# ───────────────────────────────────────────────────────────────────────────────

[coercion.arithmetic]
description  = "How types coerce in arithmetic expressions"
principle    = "Promote to common type that preserves both operands"

# Binary operator promotion
[coercion.arithmetic.binary_ops]
description  = "Type promotion for binary operators (+, -, *, /, %)"
rule         = "Both operands promoted to larger type before operation"
trit_int9    = { result = "int9",   note = "trit promotes to int9" }
trit_int27   = { result = "int27",  note = "trit promotes to int27" }
int9_int27   = { result = "int27",  note = "int9 promotes to int27" }
int_float    = { result = "float27", note = "integer promotes to float" }

# Comparison promotion
[coercion.arithmetic.comparison]
description  = "Type promotion for comparisons (<, >, ==, !=)"
rule         = "Same as binary operators — promote to common type"
result       = "bool3"                                        # All comparisons return bool3

# Ternary expression
[coercion.arithmetic.ternary]
description  = "Type in ternary conditional (cond ? a : b)"
rule         = "a and b must have common type; result is that type"
example      = "flag ? int9_val : int27_val → int27"

# Arithmetic at each layer
[coercion.arithmetic.scales]
description  = "Arithmetic coercion at each architectural layer"
L0_kernel    = { use = "ALU operations",                   example = "reg1 + reg2" }
L1_system    = { use = "resource calculations",            example = "size + offset" }
L2_runtime   = { use = "expression evaluation",            example = "a * b + c" }
L3_framework = { use = "config computation",               example = "timeout * multiplier" }
L4_health    = { use = "score calculation",                example = "weight * value" }
L5_network   = { use = "checksum computation",             example = "sum of bytes" }
L6_storage   = { use = "offset calculation",               example = "base + index * stride" }
L7_engine    = { use = "rule evaluation",                  example = "priority comparison" }
L8_app       = { use = "business logic",                   example = "price * quantity" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cv PARADIGM INTERPRETATION [PARADIGM]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And God said, Let us make man in our image, after our likeness."
#  — Genesis 1:26 KJV
#
# PARADIGM INTERPRETATION: HOW PRIMITIVES EMBODY CPI-SI
#
# These primitives are not just technical specifications. They embody the
# ternary paradigm that runs through all of CPI-SI. Understanding HOW they
# reflect the paradigm is as important as knowing WHAT they are.
#
# IMAGE AND LIKENESS:
#   God created with intention — every part reflects design purpose.
#   Our type system reflects that same intentional design:
#   - Ternary logic reflects reality better than binary
#   - Balanced representation honors truth
#   - Type safety prevents corruption
#
# PARADIGM CATEGORIES:
#   TYPE SYSTEM:  How primitives reflect ternary principles
#   COMPOSITION:  How primitives combine into complex types
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.1 TYPE_SYSTEM — How Types Embody Ternary [TYPE_SYSTEM]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For as the heavens are higher than the earth, so are my ways higher than
#  your ways, and my thoughts than your thoughts." — Isaiah 55:9 KJV
#
# TYPE SYSTEM: TERNARY FROM FOUNDATION TO APEX
#
# The type system is not arbitrary. Every choice reflects ternary principles:
# - Sizes are powers of 3
# - Boolean has three values
# - Integers balance around zero
#
# This isn't just aesthetic — it's architectural. Ternary types compose more
# naturally, handle uncertainty honestly, and align with the 9-layer system.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1a TERNARY_SIZES — Powers of 3 [TERNARY_SIZES]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.ternary_sizes]
description  = "Type sizes align with powers of 3"
principle    = "3^n sizes create natural boundaries"

# The powers
[paradigm.ternary_sizes.powers]
description  = "Powers of 3 in type sizes"
power_0      = { trits = 1,    value = 3,              name = "trit",    layer = "L0" }
power_1      = { trits = 3,    value = 27,             name = "triplet", layer = "L1" }
power_2      = { trits = 9,    value = 19683,          name = "int9",    layer = "L2" }
power_3      = { trits = 27,   value = 7625597484987,  name = "int27",   layer = "L3" }
power_4      = { trits = 81,   value = "3^81",         name = "extended", layer = "L4" }
power_5      = { trits = 243,  value = "3^243",        name = "block",   layer = "L5" }
power_6      = { trits = 729,  value = "3^729",        name = "page",    layer = "L6" }
power_7      = { trits = 2187, value = "3^2187",       name = "segment", layer = "L7" }
power_8      = { trits = 6561, value = "3^6561",       name = "domain",  layer = "L8" }

# Why powers of 3
[paradigm.ternary_sizes.rationale]
description  = "Why 3^n sizes matter"
composition  = "Types compose naturally — 3 trits = 1 triplet, 9 triplets = 1 block"
addressing   = "Addresses work in powers of 3, matching content"
efficiency   = "Packing is efficient — 5 trits fit in 1 byte (243/256 = 95%)"
alignment    = "Layer N has 3^N trits — type size matches architectural scale"

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1b BALANCED_REPRESENTATION — Center at Zero [BALANCED]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.balanced]
description  = "Balanced ternary centers at zero"
principle    = "No artificial offset — true center"

# The balance
[paradigm.balanced.values]
description  = "How values balance around zero"
trit_balance = { negative = -1, center = 0, positive = 1, symmetric = true }
int9_balance = { negative = -9841, center = 0, positive = 9841, symmetric = true }
int27_balance = { negative = -3812798742493, center = 0, positive = 3812798742493, symmetric = true }

# Why balance matters
[paradigm.balanced.rationale]
description  = "Why balanced representation is superior"
no_sign_bit  = "Sign is inherent in representation — no separate bit needed"
easy_negate  = "Negation is simple — flip all trits (0→0, 1→-1, -1→1)"
true_center  = "Zero is genuinely at the center, not offset"
rounding     = "Nearest-integer rounding is natural — round toward zero"

# Binary comparison
[paradigm.balanced.vs_binary]
description  = "Comparison with binary representation"
binary_unsigned = "0 to 2^n-1 — no negative, zero at edge"
binary_signed   = "-2^(n-1) to 2^(n-1)-1 — asymmetric (one more negative)"
binary_twos_comp = "Negation requires complement + 1, complex"
ternary_balanced = "-(3^n-1)/2 to +(3^n-1)/2 — symmetric, zero at center"

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1c HONEST_LOGIC — Three-Valued Truth [HONEST_LOGIC]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.honest_logic]
description  = "Boolean has three values — honest about uncertainty"
principle    = "Unknown is a valid truth value"

# The three values
[paradigm.honest_logic.values]
description  = "Three truth values"
false        = { value = -1, meaning = "definitely not true" }
unknown      = { value = 0,  meaning = "truth cannot be determined" }
true_val     = { value = 1,  meaning = "definitely true" }

# Kleene logic
[paradigm.honest_logic.kleene]
description  = "Kleene's strong logic of indeterminacy"
and_principle = "AND yields true only if both are true; false if either is false; otherwise unknown"
or_principle  = "OR yields false only if both are false; true if either is true; otherwise unknown"
not_principle = "NOT flips true↔false; unknown stays unknown"

# Why three values
[paradigm.honest_logic.rationale]
description  = "Why three-valued logic is more honest"
reality      = "Real systems have uncertainty — unknown is honest"
database     = "NULL in SQL represents unknown, not false"
sensors      = "Sensor failure is unknown, not false reading"
networks     = "Unreachable host is unknown, not down"
decisions    = "Insufficient data means unknown, not default to false"

# CPI-SI mapping
[paradigm.honest_logic.cpisi_mapping]
description  = "Boolean maps to building block method"
false_maps   = { direction = -1, operation = "break_down", meaning = "stop, reject" }
unknown_maps = { direction = 0,  operation = "anchor",     meaning = "hold, uncertain" }
true_maps    = { direction = 1,  operation = "build_up",   meaning = "proceed, accept" }

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1d VOID_AND_ANY — Type System Boundaries [BOUNDARIES]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.boundaries]
description  = "Void and any mark type system boundaries"
principle    = "Every system has edges — know them explicitly"

# The boundaries
[paradigm.boundaries.void]
description  = "Void: the absence boundary"
meaning      = "No value to return — work is complete, nothing to pass on"
genesis_ref  = "Genesis 1:2 — tohu, formless before creation"
cpisi_role   = "Anchor/halt — recursion terminates"

[paradigm.boundaries.any]
description  = "Any: the dynamic boundary"
meaning      = "Type unknown at compile time — flexibility vs safety tradeoff"
genesis_ref  = "Genesis 2:19 — Adam naming before classification"
cpisi_role   = "Unknown — type indeterminate until runtime"

# Boundary philosophy
[paradigm.boundaries.philosophy]
description  = "Why explicit boundaries matter"
void_lesson  = "Knowing when there's nothing to return prevents null confusion"
any_lesson   = "Knowing when type is dynamic enables proper runtime checks"
design       = "Boundaries are explicit by design — no hidden surprises"


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.2 COMPOSITION — How Primitives Compose [COMPOSITION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And God saw every thing that he had made, and, behold, it was very good."
#  — Genesis 1:31 KJV
#
# COMPOSITION: BUILDING COMPLEX FROM SIMPLE
#
# Primitives are atoms. From atoms, molecules form. From molecules, structures.
# Composition is how simple types combine into complex ones — and the composition
# rules determine what structures are possible.
#
# VERY GOOD:
#   God surveyed creation and saw it was "very good" — complete, coherent,
#   integrated. Good composition creates systems that are more than parts.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2a AGGREGATION — Structs and Tuples [AGGREGATION]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.aggregation]
description  = "Combining primitives into compound types"
principle    = "Aggregation creates meaning by association"

# Struct pattern
[paradigm.composition.aggregation.struct]
description  = "Named fields with heterogeneous types"
pattern      = "struct Person { name: text, age: uint9, active: bool3 }"
meaning      = "Different types combined with named access"
cpisi_role   = "The 'room' — walls holding distinct concepts together"

# Tuple pattern
[paradigm.composition.aggregation.tuple]
description  = "Positional fields, often homogeneous"
pattern      = "(int27, int27, int27) — a 3D coordinate"
meaning      = "Types combined by position"
cpisi_role   = "Minimal structure — just enough to hold together"

# Aggregation at each layer
[paradigm.composition.aggregation.scales]
description  = "Aggregation at each architectural layer"
L0_kernel    = { use = "register pairs",                   example = "status + value" }
L1_system    = { use = "syscall results",                  example = "error + value" }
L2_runtime   = { use = "object fields",                    example = "type + data" }
L3_framework = { use = "config sections",                  example = "database settings" }
L4_health    = { use = "health report",                    example = "scores + timestamp" }
L5_network   = { use = "packet header",                    example = "source + dest + payload" }
L6_storage   = { use = "record layout",                    example = "key + value + metadata" }
L7_engine    = { use = "rule structure",                   example = "condition + action" }
L8_app       = { use = "domain objects",                   example = "User, Order, Product" }

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2b COLLECTION_COMPOSITION — Homogeneous Gathering [COLLECTION_COMP]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.collection]
description  = "Gathering many values of same type"
principle    = "Collection + element type = parameterized type"

# List composition
[paradigm.composition.collection.list]
description  = "Ordered collection of homogeneous elements"
pattern      = "list<int27> — sequence of integers"
constraint   = "All elements must be same type"
genesis_ref  = "Genealogies — ordered lists of names"

# Map composition
[paradigm.composition.collection.map]
description  = "Association of keys to values"
pattern      = "map<text, int27> — name to count"
constraint   = "Keys must be unique and hashable"
genesis_ref  = "Census records — name to count"

# Set composition
[paradigm.composition.collection.set]
description  = "Unique membership collection"
pattern      = "set<text> — unique names"
constraint   = "No duplicates; elements must be hashable"
genesis_ref  = "Tribes — each member distinct"

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2c NESTING — Composition of Compositions [NESTING]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.nesting]
description  = "Types can contain types that contain types"
principle    = "Arbitrary nesting creates rich structures"

# Nesting examples
[paradigm.composition.nesting.examples]
description  = "Examples of nested composition"
list_of_lists = "list<list<int27>> — 2D matrix"
map_of_maps   = "map<text, map<text, int27>> — nested lookup"
struct_with_list = "struct Team { members: list<Person> }"
list_of_structs  = "list<struct Point { x: int27, y: int27 }>"

# Nesting limits
[paradigm.composition.nesting.limits]
description  = "Practical limits on nesting depth"
recommendation = "Avoid more than 3-4 levels of nesting"
reason       = "Deep nesting harms readability and type checking"
alternative  = "Create named intermediate types"

# Nesting at each layer
[paradigm.composition.nesting.scales]
description  = "Nesting at each architectural layer"
L0_kernel    = { use = "minimal (1-2 levels)",             example = "array of structs" }
L1_system    = { use = "shallow (2-3 levels)",             example = "process tree" }
L2_runtime   = { use = "moderate (2-4 levels)",            example = "object graph" }
L3_framework = { use = "structured (3-4 levels)",          example = "config hierarchy" }
L4_health    = { use = "moderate (2-3 levels)",            example = "nested metrics" }
L5_network   = { use = "protocol-defined",                 example = "nested messages" }
L6_storage   = { use = "schema-defined",                   example = "document nesting" }
L7_engine    = { use = "rule complexity",                  example = "nested conditions" }
L8_app       = { use = "domain complexity",                example = "deep object graph" }

# ───────────────────────────────────────────────────────────────────────────────
# Cv.2d TYPE_CONSTRUCTORS — Building New Types [CONSTRUCTORS]
# ───────────────────────────────────────────────────────────────────────────────

[paradigm.composition.constructors]
description  = "Mechanisms for constructing new types from existing ones"
principle    = "Type constructors are functions from types to types"

# Constructor patterns
[paradigm.composition.constructors.patterns]
description  = "Type constructor patterns"
generic      = { pattern = "T",           meaning = "type parameter" }
nullable     = { pattern = "T?",          meaning = "T or null" }
array        = { pattern = "T[n]",        meaning = "fixed-size array of T" }
slice        = { pattern = "T[]",         meaning = "variable-size slice of T" }
pointer      = { pattern = "&T",          meaning = "reference to T" }
function     = { pattern = "(A) → B",     meaning = "function from A to B" }

# Type constructor algebra
[paradigm.composition.constructors.algebra]
description  = "How constructors compose"
list_of_nullable = "list<T?> — list where elements can be null"
nullable_list    = "list<T>? — the whole list can be null"
func_returning_nullable = "(A) → B? — function that may return null"
difference   = "Position of ? matters — type algebra is precise"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx CODE GENERATION [GENERATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And the LORD answered me, and said, Write the vision, and make it plain upon
#  tables, that he may run that readeth it." — Habakkuk 2:2 KJV
#
# CODE GENERATION: FROM SPECIFICATION TO IMPLEMENTATION
#
# These TOML specifications are not just documentation — they are the SOURCE OF
# TRUTH from which actual code is generated. The generator reads this file and
# produces headers, type definitions, and constants for target languages.
#
# WRITE THE VISION:
#   Habakkuk was told to write clearly so runners could read while running.
#   Generation creates code that machines can "run" — executable from vision.
#   Specification becomes implementation. Vision becomes reality.
#
# GENERATION CATEGORIES:
#   GENERATE: Control metadata for the generation process
#   TARGETS:  Language-specific generation rules
#   TEMPLATES: Code patterns for each primitive type
#   GUARDS:   Header guards and namespace protection
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    C headers, assembly constants
#   L1 (System):    System call types, ABI definitions
#   L2 (Runtime):   Go types, Rust structs
#   L3 (Framework): OmniCode type definitions
#   L4 (Health):    Health metric types
#   L5 (Network):   Wire format types
#   L6 (Storage):   Serialization types
#   L7 (Engine):    Rule engine types
#   L8 (App):       Application-level types
#
# Implementation: L0-universal/tools/generate/
# Reference:      L0-universal/foundation/math/ternary.toml [_generate]
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.1 GENERATE — Generation Control Metadata [GENERATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# GENERATION CONTROL: PLANNING BEFORE BUILDING
#
# Generation settings control WHAT gets generated, WHERE it goes, and in WHAT
# ORDER. Counting the cost before building — knowing what you'll produce.
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate]
description  = "Master generation control for primitives.toml"
enabled      = true                                           # Generation is active
version      = "b-01.00"                                      # Generator version

# Output configuration
[_generate.output]
description  = "Where generated files go"
directory    = "L0-universal/libtrit/include/trit/"           # Output directory
primary      = "primitives.gen.h"                             # Primary output file
order        = 1                                              # After math (0), before language (2)

# Header guard
[_generate.guard]
description  = "C header guard configuration"
name         = "PRIMITIVES_GEN_H"
pattern      = "#ifndef {guard}\n#define {guard}\n\n{content}\n\n#endif /* {guard} */"

# Generation scope
[_generate.scope]
description  = "What sections to generate"
include      = ["trit", "trit5", "int9", "uint9", "int27", "uint27", "float27", "bool3", "void"]
exclude      = ["list", "map", "set", "any", "text", "char"]  # Collections handled separately
reason       = "Primitive types only; collections need parameterized generation"

# Dependencies
[_generate.dependencies]
description  = "Files that must be generated first"
requires     = ["ternary.toml"]                               # Depends on ternary constants
provides     = ["primitives.gen.h"]                           # What this generates
blocks       = []                                             # Nothing depends on us for generation

# Generation at each layer
[_generate.scales]
description  = "Generation configuration at each architectural layer"
L0_kernel    = { output = "primitives.gen.h",                 format = "C header" }
L1_system    = { output = "primitives_sys.gen.h",             format = "C system types" }
L2_runtime   = { output = "primitives.gen.go",                format = "Go types" }
L3_framework = { output = "primitives.omni",                  format = "OmniCode types" }
L4_health    = { output = "primitives_health.gen.go",         format = "Health metric types" }
L5_network   = { output = "primitives_wire.gen.go",           format = "Wire format types" }
L6_storage   = { output = "primitives_storage.gen.go",        format = "Serialization types" }
L7_engine    = { output = "primitives_engine.gen.go",         format = "Engine types" }
L8_app       = { output = "primitives_app.gen.go",            format = "Application types" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.2 TARGETS — Language-Specific Generation [TARGETS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And there were dwelling at Jerusalem Jews, devout men, out of every nation
#  under heaven... every man heard them speak in his own language."
#  — Acts 2:5,6 KJV
#
# TARGETS: SPEAKING EACH LANGUAGE'S TONGUE
#
# Pentecost saw one message spoken in every hearer's language. Generation takes
# one specification and produces code in each target's native tongue. Same truth,
# different expressions.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2a C_TARGET — C Language Generation [C_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.target.c]
description  = "C language code generation"
enabled      = true
priority     = 1                                              # Generated first (foundational)

# Type mappings (primitive → C type)
[_generate.target.c.types]
description  = "How primitives map to C types"
trit         = { type = "int8_t",   typedef = "trit_t",       comment = "single trit value" }
trit5        = { type = "uint8_t",  typedef = "trit5_t",      comment = "5 packed trits" }
int9         = { type = "int16_t",  typedef = "trit9_t",      comment = "9-trit signed" }
uint9        = { type = "uint16_t", typedef = "utrit9_t",     comment = "9-trit unsigned" }
int27        = { type = "int64_t",  typedef = "trit27_t",     comment = "27-trit signed (Word)" }
uint27       = { type = "uint64_t", typedef = "utrit27_t",    comment = "27-trit unsigned" }
float27      = { type = "double",   typedef = "tfloat_t",     comment = "ternary float" }
bool3        = { type = "int8_t",   typedef = "tbool_t",      comment = "ternary boolean" }
void_type    = { type = "void",     typedef = "void",         comment = "no value" }

# Constant generation
[_generate.target.c.constants]
description  = "How to generate C constants"
pattern      = "#define {NAME}_{FIELD} ({value})"
example      = "#define TRIT_MIN (-1)"

# Enum generation
[_generate.target.c.enums]
description  = "How to generate C enums"
pattern      = "typedef enum { {values} } {name}_t;"
bool3_values = "TRIT_FALSE = -1, TRIT_UNKNOWN = 0, TRIT_TRUE = 1"

# C generation at each layer
[_generate.target.c.scales]
description  = "C generation at each architectural layer"
L0_kernel    = { use = "core types + constants",              example = "trit_t, TRIT_MIN" }
L1_system    = { use = "syscall types",                       example = "trit_result_t" }
L2_runtime   = { use = "runtime structs",                     example = "trit_array_t" }
L3_framework = { use = "framework types",                     example = "trit_config_t" }
L4_health    = { use = "health types",                        example = "trit_health_t" }
L5_network   = { use = "wire types",                          example = "trit_packet_t" }
L6_storage   = { use = "storage types",                       example = "trit_block_t" }
L7_engine    = { use = "engine types",                        example = "trit_rule_t" }
L8_app       = { use = "app types",                           example = "trit_user_t" }

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2b GO_TARGET — Go Language Generation [GO_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.target.go]
description  = "Go language code generation"
enabled      = true
priority     = 2                                              # After C

# Package configuration
[_generate.target.go.package]
description  = "Go package configuration"
name         = "trit"
path         = "L0-universal/libtrit/pkg/trit"
imports      = []                                             # No external imports for primitives

# Type mappings (primitive → Go type)
[_generate.target.go.types]
description  = "How primitives map to Go types"
trit         = { type = "int8",    alias = "Trit",            comment = "single trit value" }
trit5        = { type = "uint8",   alias = "Trit5",           comment = "5 packed trits" }
int9         = { type = "int16",   alias = "Int9",            comment = "9-trit signed" }
uint9        = { type = "uint16",  alias = "UInt9",           comment = "9-trit unsigned" }
int27        = { type = "int64",   alias = "Int27",           comment = "27-trit signed (Word)" }
uint27       = { type = "uint64",  alias = "UInt27",          comment = "27-trit unsigned" }
float27      = { type = "float64", alias = "Float27",         comment = "ternary float" }
bool3        = { type = "int8",    alias = "Bool3",           comment = "ternary boolean" }

# Constant generation
[_generate.target.go.constants]
description  = "How to generate Go constants"
pattern      = "const {Name}{Field} {type} = {value}"
example      = "const TritMin int8 = -1"

# Method generation
[_generate.target.go.methods]
description  = "Methods to generate for each type"
String       = "func (t {Type}) String() string"
IsValid      = "func (t {Type}) IsValid() bool"
Negate       = "func (t {Type}) Negate() {Type}"

# Go generation at each layer
[_generate.target.go.scales]
description  = "Go generation at each architectural layer"
L0_kernel    = { use = "core types",                          example = "type Trit int8" }
L1_system    = { use = "syscall types",                       example = "type Result struct{}" }
L2_runtime   = { use = "runtime types",                       example = "type Array []Trit" }
L3_framework = { use = "framework types",                     example = "type Config struct{}" }
L4_health    = { use = "health types",                        example = "type Health struct{}" }
L5_network   = { use = "wire types",                          example = "type Packet struct{}" }
L6_storage   = { use = "storage types",                       example = "type Block struct{}" }
L7_engine    = { use = "engine types",                        example = "type Rule struct{}" }
L8_app       = { use = "app types",                           example = "type User struct{}" }

# ───────────────────────────────────────────────────────────────────────────────
# Cx.2c RUST_TARGET — Rust Language Generation [RUST_TARGET]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.target.rust]
description  = "Rust language code generation"
enabled      = false                                          # Reserved for future
priority     = 3                                              # After Go
note         = "Rust generation planned for Phase 3"

# Type mappings (primitive → Rust type)
[_generate.target.rust.types]
description  = "How primitives map to Rust types"
trit         = { type = "i8",      alias = "Trit",            comment = "single trit value" }
trit5        = { type = "u8",      alias = "Trit5",           comment = "5 packed trits" }
int9         = { type = "i16",     alias = "Int9",            comment = "9-trit signed" }
uint9        = { type = "u16",     alias = "UInt9",           comment = "9-trit unsigned" }
int27        = { type = "i64",     alias = "Int27",           comment = "27-trit signed (Word)" }
uint27       = { type = "u64",     alias = "UInt27",          comment = "27-trit unsigned" }
float27      = { type = "f64",     alias = "Float27",         comment = "ternary float" }
bool3        = { type = "i8",      alias = "Bool3",           comment = "ternary boolean" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.3 TEMPLATES — Code Generation Templates [TEMPLATES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "The thing that hath been, it is that which shall be; and that which is done
#  is that which shall be done." — Ecclesiastes 1:9 KJV
#
# TEMPLATES: PATTERNS THAT REPEAT WITH VARIATION
#
# Ecclesiastes reminds us that patterns repeat. Templates capture patterns that
# recur across types — what has been (the pattern) is what shall be (new types
# from the pattern). Template + data = generated code.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3a HEADER_TEMPLATE — C Header Template [HEADER_TEMPLATE]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.template.header]
description  = "Template for C header generation"

# Header structure
[_generate.template.header.structure]
description  = "Structure of generated header"
sections     = ["guard_open", "includes", "typedefs", "constants", "enums", "guard_close"]

# Comment template
[_generate.template.header.comment]
description  = "File header comment"
template     = """
/*
 * {filename} — Generated from {source}
 *
 * {description}
 *
 * DO NOT EDIT — Regenerate from TOML source.
 * Generator: L0-universal/tools/generate/
 * Generated: {timestamp}
 */
"""

# Typedef template
[_generate.template.header.typedef]
description  = "Typedef generation template"
template     = "typedef {base_type} {typedef_name};  /* {comment} */"
example      = "typedef int8_t trit_t;  /* single trit value */"

# Constant template
[_generate.template.header.constant]
description  = "Constant generation template"
template     = "#define {PREFIX}_{NAME} ({value})"
example      = "#define TRIT_MIN (-1)"

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3b TYPE_TEMPLATE — Per-Type Templates [TYPE_TEMPLATE]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.template.type.trit]
description  = "Generation template for trit type"
constants    = ["MIN", "ZERO", "MAX", "STATES"]
values       = [-1, 0, 1, 3]
operations   = ["negate", "abs", "sign"]

[_generate.template.type.trit5]
description  = "Generation template for trit5 type"
constants    = ["MIN", "MAX", "PACKED_MAX", "STATES", "SPARE_START"]
values       = [-121, 121, 242, 243, 243]
operations   = ["pack", "unpack", "validate"]

[_generate.template.type.int9]
description  = "Generation template for int9 type"
constants    = ["MIN", "MAX", "STATES"]
values       = [-9841, 9841, 19683]
operations   = ["add", "sub", "mul", "div", "mod", "negate"]

[_generate.template.type.int27]
description  = "Generation template for int27 (Word) type"
constants    = ["MIN", "MAX", "STATES"]
values       = [-3812798742493, 3812798742493, 7625597484987]
operations   = ["add", "sub", "mul", "div", "mod", "negate"]
note         = "THE WORD — fundamental semantic unit"

[_generate.template.type.bool3]
description  = "Generation template for bool3 type"
constants    = ["FALSE", "UNKNOWN", "TRUE"]
values       = [-1, 0, 1]
operations   = ["and", "or", "not", "implies"]

# ───────────────────────────────────────────────────────────────────────────────
# Cx.3c SCALE_TEMPLATES — Per-Layer Templates [SCALE_TEMPLATES]
# ───────────────────────────────────────────────────────────────────────────────

[_generate.template.scales]
description  = "Generation templates for each architectural layer"
L0_kernel    = { suffix = "",           includes = ["stdint.h"],      style = "minimal" }
L1_system    = { suffix = "_sys",       includes = ["stdint.h"],      style = "minimal" }
L2_runtime   = { suffix = "_runtime",   includes = ["stdint.h"],      style = "verbose" }
L3_framework = { suffix = "_framework", includes = ["stdint.h"],      style = "verbose" }
L4_health    = { suffix = "_health",    includes = ["stdint.h"],      style = "verbose" }
L5_network   = { suffix = "_wire",      includes = ["stdint.h"],      style = "minimal" }
L6_storage   = { suffix = "_storage",   includes = ["stdint.h"],      style = "minimal" }
L7_engine    = { suffix = "_engine",    includes = ["stdint.h"],      style = "verbose" }
L8_app       = { suffix = "_app",       includes = ["stdint.h"],      style = "verbose" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.4 VALIDATION — Generation Validation [GEN_VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Beloved, believe not every spirit, but try the spirits whether they are of
#  God." — 1 John 4:1 KJV
#
# VALIDATION: TESTING THE GENERATED CODE
#
# Generated code must be tested — don't blindly trust output. Validation ensures
# what was generated matches what was intended. Try the spirits.
#
# ═══════════════════════════════════════════════════════════════════════════════

[_generate.validation]
description  = "How to validate generated code"
enabled      = true

# Syntax validation
[_generate.validation.syntax]
description  = "Syntax checks for generated code"
c_compile    = "gcc -fsyntax-only -Wall -Werror {file}"
go_build     = "go build -v {package}"
rust_check   = "cargo check"

# Content validation
[_generate.validation.content]
description  = "Content checks for generated code"
has_guard    = "Header must have include guard"
has_typedefs = "All primitives must have typedefs"
has_constants = "All primitives must have constants"
no_duplicates = "No duplicate definitions"

# Round-trip validation
[_generate.validation.roundtrip]
description  = "Verify generated code matches spec"
parse_toml   = "Load TOML, extract values"
parse_header = "Parse generated header, extract values"
compare      = "Values must match"

# Validation at each layer
[_generate.validation.scales]
description  = "Validation at each architectural layer"
L0_kernel    = { check = "compile only",                      example = "gcc -fsyntax-only" }
L1_system    = { check = "compile only",                      example = "verify syscall types" }
L2_runtime   = { check = "build + unit test",                 example = "go test" }
L3_framework = { check = "build + integration test",          example = "framework tests" }
L4_health    = { check = "build + validation",                example = "health metric tests" }
L5_network   = { check = "build + wire tests",                example = "serialization tests" }
L6_storage   = { check = "build + storage tests",             example = "persistence tests" }
L7_engine    = { check = "build + engine tests",              example = "rule evaluation tests" }
L8_app       = { check = "full test suite",                   example = "end-to-end tests" }


