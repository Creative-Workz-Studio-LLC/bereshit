# ───────────────────────────────────────────────────────────────────────────────
# X.3 TROUBLESHOOTING — Common Problems [TROUBLESHOOTING]
# ───────────────────────────────────────────────────────────────────────────────
#
# "If any of you lack wisdom, let him ask of God, that giveth to all men
#  liberally, and upbraideth not; and it shall be given him." — James 1:5 KJV
#
# COMMON PROBLEMS AND SOLUTIONS:
#
# ───────────────────────────────────────────────────────────────────────────────

# "Invalid TOML syntax":
#
#   Cause: Missing quotes around strings with special characters
#   Fix:   String values need quotes: key = "value with spaces"
#
#   Cause: Duplicate keys in same section
#   Fix:   Each key can only appear once per table
#
#   Cause: Bare keys with invalid characters
#   Fix:   Use quotes for keys with dots/special chars: "my.key" = value

# "Type not found":
#
#   Cause: Referencing type before definition
#   Fix:   Order matters in TOML — define types before referencing
#
#   Cause: Typo in type name
#   Fix:   Check spelling matches exactly (case-sensitive)

# "Value out of range":
#
#   Cause: Assigning value outside type's min/max
#   Fix:   Check [type].min_value and [type].max_value
#
#   Cause: Overflow during conversion
#   Fix:   Use explicit checked conversion with validation

# "Generation failed":
#
#   Cause: Missing required field
#   Fix:   All types need: name, description, size_trits, default
#
#   Cause: Invalid template reference
#   Fix:   Verify template exists in _generate.template section

# "Test failures after modification":
#
#   Cause: Changed value without updating dependent code
#   Fix:   Regenerate headers, rebuild libtrit, run tests
#
#   Cause: Modified frozen field
#   Fix:   Revert change — some fields cannot be modified

# Troubleshooting at each layer:
#
#   L0 (Kernel):    Recompile libtrit, check assembly
#   L1 (System):    Check syscall compatibility
#   L2 (Runtime):   Run unit tests: go test ./...
#   L3 (Framework): Run integration tests
#   L4 (Health):    Check health metric alignment
#   L5 (Network):   Test wire format compatibility
#   L6 (Storage):   Test serialization round-trip
#   L7 (Engine):    Test rule evaluation
#   L8 (App):       Run end-to-end tests


