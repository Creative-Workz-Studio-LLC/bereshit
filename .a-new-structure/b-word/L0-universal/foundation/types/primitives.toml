# ───────────────────────────────────────────────────────────────────────────────
# X.1 POLICY — Modification Guidelines [POLICY]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Remove not the ancient landmark, which thy fathers have set."
#  — Proverbs 22:28 KJV
#
# POLICY: WHAT TO PRESERVE, WHAT MAY CHANGE
#
# These primitives are ancient landmarks — foundational to the entire type
# system. Removing or changing them affects everything built upon them.
#
# ───────────────────────────────────────────────────────────────────────────────

# ❌ NEVER MODIFY:
#
#   - Primitive names (trit, int9, int27, etc.)
#     → All references would break
#     → Names are the identity
#
#   - Trit value space [-1, 0, +1]
#     → Foundational to balanced ternary
#     → Mathematically fixed
#
#   - Size relationships (3^n)
#     → Powers of 3 are mathematical truth
#     → Sizes derive from ternary math
#
#   - bool3 value mappings (-1=false, 0=unknown, +1=true)
#     → Paradigm alignment with CPI-SI
#     → Building block method mapping
#
#   - 3-block structure (METADATA → CONTENT → CLOSING)
#     → Structural contract
#     → Parsers depend on this
#
# ⚠️ MODIFY WITH CARE:
#
#   - Adding new primitive types
#     → Must be mathematically justified
#     → Must fit ternary paradigm
#     → Requires corresponding code changes
#
#   - Changing min/max values
#     → Affects all type checking
#     → Requires libtrit updates
#
#   - Adding type parameters
#     → Affects types.toml
#     → Requires schema updates
#
#   - Modifying OmniCode syntax
#     → Affects parser
#     → Requires OmniCode spec updates
#
# ✅ SAFE TO ADD:
#
#   - Comments for clarity
#   - Additional .scales entries (if layer exists)
#   - Implementation notes in .cpisi
#   - New metadata fields (if code supports)
#   - Examples and documentation
#
# Policy at each layer:
#
#   L0 (Kernel):    FROZEN — core types never change
#   L1 (System):    STABLE — syscall types rarely change
#   L2 (Runtime):   STABLE — runtime types versioned
#   L3 (Framework): EVOLVING — framework types may extend
#   L4 (Health):    EVOLVING — health metrics may extend
#   L5 (Network):   VERSIONED — wire types carefully versioned
#   L6 (Storage):   VERSIONED — storage types carefully versioned
#   L7 (Engine):    EVOLVING — engine types may extend
#   L8 (App):       FLEXIBLE — app types most flexible


