careful = ["Layer names (affects all error code names)", "Tier names (affects severity mapping)", "Expansion domain ranges (affects future compatibility)"]
safe = ["Updating descriptions", "Adding metadata", "Adding new expansion domains", "Adding examples"]

[_closing.X2_extension]
planned = ["Layer-aware error routing", "Severity-based escalation"]

[_closing.X3_troubleshooting]
