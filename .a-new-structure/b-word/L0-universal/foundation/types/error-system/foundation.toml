name        = "NULL"
brief       = "Null pointer or missing"
description = "Required pointer was NULL or required item is missing"
macro       = "CPISI_POS_NULL"
examples    = ["NULL argument", "missing config", "object not found"]

[position.null.omnicode]
marker      = "{layer}.{tier}.NULL"
example     = "KERNEL.CORE.NULL"

[position.null.cpisi]
ternary     = -1
meaning     = "Missing — something required was not provided"

[position.invalid]
index       = 2
name        = "INVALID"
brief       = "Invalid parameter or malformed"
description = "Parameter is syntactically invalid or data is malformed"
macro       = "CPISI_POS_INVALID"
examples    = ["invalid enum", "malformed string", "corrupt data"]

[position.invalid.omnicode]
marker      = "{layer}.{tier}.INVALID"
example     = "SYSTEM.CORE.INVALID"

[position.invalid.cpisi]
ternary     = -1
meaning     = "Bad input — data provided but incorrect"

[position.bounds]
index       = 3
name        = "BOUNDS"
brief       = "Out of bounds or range"
description = "Value exceeds valid range or index is out of bounds"
macro       = "CPISI_POS_BOUNDS"
examples    = ["array overflow", "health > 1.0", "layer > 8"]

[position.bounds.omnicode]
marker      = "{layer}.{tier}.BOUNDS"
example     = "HEALTH.CORE.BOUNDS"

[position.bounds.cpisi]
ternary     = -1
meaning     = "Out of range — value exceeded limits"

[position.type]
index       = 4
name        = "TYPE"
brief       = "Type mismatch or format"
description = "Wrong type or incompatible format"
macro       = "CPISI_POS_TYPE"
examples    = ["expected int got string", "wrong encoding", "version mismatch"]

[position.type.omnicode]
marker      = "{layer}.{tier}.TYPE"
example     = "RUNTIME.CORE.TYPE"

[position.type.cpisi]
ternary     = -1
meaning     = "Wrong type — incompatible data format"

[position.state]
index       = 5
name        = "STATE"
brief       = "Invalid state or condition"
description = "Object is in wrong state for requested operation"
macro       = "CPISI_POS_STATE"
examples    = ["read before open", "already initialized", "connection closed"]

[position.state.omnicode]
marker      = "{layer}.{tier}.STATE"
example     = "NETWORK.CORE.STATE"

[position.state.cpisi]
ternary     = 0
meaning     = "Wrong state — operation not valid in current state"

[position.init]
index       = 6
name        = "INIT"
brief       = "Initialization or setup failure"
description = "Failed to initialize or set up a resource"
macro       = "CPISI_POS_INIT"
examples    = ["alloc failed", "config load failed", "subsystem init failed"]

[position.init.omnicode]
marker      = "{layer}.{tier}.INIT"
example     = "STORAGE.CORE.INIT"

[position.init.cpisi]
ternary     = +1
meaning     = "Init failed — could not start or set up"

[position.cleanup]
index       = 7
name        = "CLEANUP"
brief       = "Cleanup or teardown failure"
description = "Failed to clean up or tear down a resource"
macro       = "CPISI_POS_CLEANUP"
examples    = ["close failed", "free failed", "shutdown incomplete"]

[position.cleanup.omnicode]
marker      = "{layer}.{tier}.CLEANUP"
example     = "ENGINE.SYS.CLEANUP"

[position.cleanup.cpisi]
ternary     = +1
meaning     = "Cleanup failed — could not stop or tear down"

[position.unknown]
index       = 8
name        = "UNKNOWN"
brief       = "Unknown or uncategorized"
description = "Error doesn't fit other categories — should be rare"
macro       = "CPISI_POS_UNKNOWN"
warning     = "Prefer specific positions. UNKNOWN is a last resort."

[position.unknown.omnicode]
marker      = "{layer}.{tier}.UNKNOWN"
example     = "APP.EXT.UNKNOWN"

[position.unknown.cpisi]
ternary     = 0
meaning     = "Uncategorized — catch-all for unexpected errors"

# ─────────────────────────────────────────────────────────────────────────
# Cc.5 FORMULAS — Error Code Construction
# ─────────────────────────────────────────────────────────────────────────

[formula]
description = "Error codes are derived, not arbitrary"

[formula.make_error]
name        = "CPISI_MAKE_ERROR"
formula     = "(layer × CUBE) + (tier × FACE) + position"
expanded    = "(layer × 27) + (tier × 9) + position"
description = "Construct error code from layer, tier, and position"

[formula.make_error.omnicode]
marker      = "@formula MAKE_ERROR"
example     = "CPISI_MAKE_ERROR(KERNEL, CORE, NULL)"

[formula.make_error.examples]
cpisi_ok               = { formula = "(0 × 27) + (0 × 9) + 0", result = 0 }
cpisi_err_kernel_null  = { formula = "(0 × 27) + (0 × 9) + 1", result = 1 }
cpisi_err_health_bounds = { formula = "(4 × 27) + (0 × 9) + 3", result = 111 }

[formula.extract_layer]
name        = "Layer extraction"
formula     = "layer = code ÷ 27"
description = "Get layer index from error code"
c_macro     = "#define CPISI_ERR_LAYER(e) ((e) / 27)"
go_func     = "func ErrLayer(e CpisiError) int { return int(e) / 27 }"

[formula.extract_offset]
name        = "Offset extraction"
formula     = "offset = code % 27"
description = "Get position within layer"
c_macro     = "#define CPISI_ERR_OFFSET(e) ((e) % 27)"
go_func     = "func ErrOffset(e CpisiError) int { return int(e) % 27 }"

[formula.extract_tier]
name        = "Tier extraction"
formula     = "tier = (code % 27) ÷ 9"
description = "Get tier index within layer"
c_macro     = "#define CPISI_ERR_TIER(e) (((e) % 27) / 9)"
go_func     = "func ErrTier(e CpisiError) int { return (int(e) % 27) / 9 }"

[formula.extract_position]
name        = "Position extraction"
formula     = "position = (code % 27) % 9"
description = "Get position within tier"
c_macro     = "#define CPISI_ERR_POSITION(e) (((e) % 27) % 9)"
go_func     = "func ErrPosition(e CpisiError) int { return (int(e) % 27) % 9 }"

# ─────────────────────────────────────────────────────────────────────────
# Cc.6 EXPANSION — Domain Expansion
# ─────────────────────────────────────────────────────────────────────────

[expansion]
description = "Error type allows expansion beyond core 256"
type        = "uint16_t"
max_codes   = 65536

[expansion.domains.core]
range       = [0, 255]
description = "CPI-SI core (current)"
note        = "Bridge equation: 243 + 13 = 256"

[expansion.domains.extended]
range       = [256, 511]
description = "CPI-SI extended"
note        = "Future CPI-SI expansion"

[expansion.domains.cornerstone]
range       = [512, 767]
description = "Cornerstone engine"
note        = "Game engine specific errors"

[expansion.domains.faithnet]
range       = [768, 1023]
description = "FaithNet"
note        = "Network protocol errors"

[expansion.domains.bereshit]
range       = [1024, 1279]
description = "Bereshit storage"
note        = "Bible storage and retrieval errors"

[expansion.domains.application]
range       = [1280, 65535]
description = "Application-specific"
note        = "Reserved for applications"

# ───────────────────────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ───────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Co.1 DAR — Detect/Assess/Recover Phases
# ─────────────────────────────────────────────────────────────────────────

[dar]
description = "Detect → Assess → Recover: The three phases of error handling"
phases      = ["detect", "assess", "recover"]

[dar.detect]
phase       = 1
name        = "DETECT"
brief       = "Notice the error"
description = "First awareness that something went wrong"
questions   = ["What happened?", "Where did it happen?", "What was the context?"]

[dar.detect.omnicode]
marker      = "@dar.detect"
example     = "@dar.detect KERNEL.CORE.NULL"

[dar.detect.cpisi]
mental_pos  = "(-1, 0, 0)"
k_factor    = -1
role        = "Awareness — breaking down to identify problem"

[dar.assess]
phase       = 2
name        = "ASSESS"
brief       = "Understand severity and impact"
description = "Evaluate how serious the error is"
questions   = ["How bad is it?", "Can we recover?", "What resources do we need?"]

[dar.assess.omnicode]
marker      = "@dar.assess"
example     = "@dar.assess severity=critical"

[dar.assess.cpisi]
mental_pos  = "(0, 0, 0)"
k_factor    = 0
role        = "Evaluation — balanced assessment"

[dar.recover]
phase       = 3
name        = "RECOVER"
brief       = "Take corrective action"
description = "Fix the problem or fail gracefully"
questions   = ["What's the fix?", "How do we clean up?", "What do we report?"]

[dar.recover.omnicode]
marker      = "@dar.recover"
example     = "@dar.recover action=retry"

[dar.recover.cpisi]
mental_pos  = "(+1, 0, 0)"
k_factor    = +1
role        = "Action — building up toward solution"

# ─────────────────────────────────────────────────────────────────────────
# Co.2 SEVERITY — Error Severity Levels
# ─────────────────────────────────────────────────────────────────────────

[severity]
description = "Error severity determines required response"
levels      = ["fatal", "critical", "warning", "info", "debug"]

[severity.fatal]
level       = 0
name        = "FATAL"
ternary     = -1
brief       = "Cannot continue"
description = "System must terminate immediately"
action      = "Log and exit"
tier_map    = "CORE tier, positions 1-4"

[severity.critical]
level       = 1
name        = "CRITICAL"
ternary     = -1
brief       = "Major problem"
description = "Operation failed, requires attention"
action      = "Log, notify, attempt recovery"
tier_map    = "CORE tier, positions 5-8"

[severity.warning]
level       = 2
name        = "WARNING"
ternary     = 0
brief       = "Minor problem"
description = "Something unexpected but recoverable"
action      = "Log, continue with fallback"
tier_map    = "EXT tier"

[severity.info]
level       = 3
name        = "INFO"
ternary     = 0
brief       = "Informational"
description = "Noteworthy condition"
action      = "Log for diagnostics"
tier_map    = "SYS tier, positions 0-4"

[severity.debug]
level       = 4
name        = "DEBUG"
ternary     = +1
brief       = "Debug only"
description = "Developer information"
action      = "Log in debug builds only"
tier_map    = "SYS tier, positions 5-8"

# ─────────────────────────────────────────────────────────────────────────
# Co.3 RECOVERY — Recovery Modes
# ─────────────────────────────────────────────────────────────────────────

[recovery]
description = "Recovery strategies for different error types"

[recovery.retry]
name        = "RETRY"
description = "Try the operation again"
when        = ["Transient failures", "Network timeouts", "Resource busy"]
max_attempts = 3
backoff     = "exponential"

[recovery.fallback]
name        = "FALLBACK"
description = "Use alternative approach"
when        = ["Primary path unavailable", "Resource exhausted"]
example     = "Use cached value if network fails"

[recovery.propagate]
name        = "PROPAGATE"
description = "Let caller handle it"
when        = ["Caller has more context", "Error affects caller's operation"]
transform   = "May wrap error with additional context"

[recovery.ignore]
name        = "IGNORE"
description = "Continue without handling"
when        = ["DEBUG level errors", "Non-critical metrics"]
warning     = "Use sparingly — most errors should be handled"

[recovery.terminate]
name        = "TERMINATE"
description = "Stop operation or process"
when        = ["FATAL errors", "Unrecoverable state"]
cleanup     = "Always clean up resources before terminating"

# ───────────────────────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ───────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Cv.1 BIBLICAL — Scripture Grounding
# ─────────────────────────────────────────────────────────────────────────

[biblical]
description = "Error handling wisdom from Scripture"

[biblical.foresight]
scripture   = "Proverbs 27:12"
text        = "A prudent man foreseeth the evil, and hideth himself: but the simple pass on, and are punished."
principle   = "Error detection enables error prevention"
application = "Build systems that detect errors early"

[biblical.confession]
scripture   = "James 5:16"
text        = "Confess your faults one to another"
principle   = "Errors must be acknowledged to be fixed"
application = "Log errors honestly — hiding problems makes them worse"

[biblical.resilience]
scripture   = "Proverbs 24:16"
text        = "A just man falleth seven times, and riseth up again"
principle   = "Recovery is expected, not exceptional"
application = "Design for graceful recovery, not just error detection"

[biblical.judgment]
scripture   = "2 Corinthians 5:10"
text        = "For we must all appear before the judgment seat"
principle   = "Not all errors are equal"
application = "Use severity levels — triage errors appropriately"

[biblical.clarity]
scripture   = "James 5:12"
text        = "Let your yea be yea; and your nay, nay"
principle   = "Error meanings must be clear and consistent"
application = "Universal positions — same meaning across all layers"

# ─────────────────────────────────────────────────────────────────────────
# Cv.2 COGNITIVE — Mental Construct Mapping
# ─────────────────────────────────────────────────────────────────────────

[cognitive]
description = "Error system maps to mental construct"

[cognitive.cube_mapping]
description = "27-position cube maps to error space"
cube_size   = 27
layers      = 9
tiers       = 3
positions   = 9
formula     = "layer × 27 + tier × 9 + position"

[cognitive.layer_axis]
description = "Layers map to X-axis (WHERE)"
below       = "Layers 0-3: foundations (kernel, system, runtime, framework)"
center      = "Layer 4: health (THE CENTER)"
above       = "Layers 5-8: applications (network, storage, engine, app)"

[cognitive.tier_axis]
description = "Tiers map to Y-axis (HOW DEEP)"
core        = "Tier 0: fundamental (must handle)"
ext         = "Tier 1: extended (should handle)"
sys         = "Tier 2: system (may handle)"

[cognitive.position_axis]
description = "Positions map to Z-axis (WHAT KIND)"
success     = "Position 0: no error"
null        = "Position 1: missing"
invalid     = "Position 2: malformed"
bounds      = "Position 3: out of range"
type        = "Position 4: wrong type"
state       = "Position 5: wrong state"
init        = "Position 6: init failed"
cleanup     = "Position 7: cleanup failed"
unknown     = "Position 8: uncategorized"

# ─────────────────────────────────────────────────────────────────────────
# Cv.3 TERNARY — Ternary Alignment
# ─────────────────────────────────────────────────────────────────────────

[ternary]
description = "Ternary alignment for error system"

[ternary.bridge_equation]
alignment   = "243 + 13 = 256"
meaning     = "Ternary meets binary"
neg1        = "243 = 3^5 = PENTERACT (ternary codes)"
zero        = "13 = center of CUBE (metadata bridge)"
pos1        = "256 = 2^8 = one byte (binary fit)"

[ternary.layer_balance]
alignment   = "4 + 1 + 4"
meaning     = "Balanced around health"
neg1        = "4 layers below center (foundations)"
zero        = "1 layer at center (health)"
pos1        = "4 layers above center (applications)"

[ternary.tier_alignment]
alignment   = "CORE, EXT, SYS"
meaning     = "Severity gradient"
neg1        = "CORE: critical, must handle"
zero        = "EXT: warning, should handle"
pos1        = "SYS: internal, may ignore"

[ternary.dar_phases]
alignment   = "Detect, Assess, Recover"
meaning     = "Building block flow"
neg1        = "Detect: break down to identify (-1)"
zero        = "Assess: balanced evaluation (0)"
pos1        = "Recover: build up to solution (+1)"

[ternary.severity_mapping]
alignment   = "fatal/critical, warning/info, debug"
meaning     = "Response gradient"
neg1        = "FATAL/CRITICAL: must stop or fix"
zero        = "WARNING/INFO: note and continue"
pos1        = "DEBUG: development only"

# ─────────────────────────────────────────────────────────────────────────
# Cx — Generation (Code Output)
# ─────────────────────────────────────────────────────────────────────────

[generate.targets]
description = "Languages to generate error handling code for"

[generate.targets.c]
enabled     = true
output      = "error.gen.h"
type_def    = "typedef uint16_t CpisiError"
patterns    = ["#define macros", "enum error codes", "static inline functions"]

[generate.targets.go]
enabled     = true
output      = "error_gen.go"
package     = "cpisi"
type_def    = "type CpisiError uint16"
patterns    = ["const blocks", "type definitions", "methods"]

[generate.targets.rust]
enabled     = true
output      = "error_gen.rs"
type_def    = "type CpisiError = u16"
patterns    = ["const definitions", "enum variants", "impl blocks"]

[generate.process]
description = "Steps to generate error handling code"
steps       = [
    "1. Parse foundation.toml architecture",
    "2. Generate layer base constants",
    "3. Generate tier offset constants",
    "4. Generate position constants",
    "5. Generate MAKE_ERROR macro/function",
    "6. Generate extraction macros/functions",
    "7. Generate severity mapping",
    "8. Generate DAR phase handlers",
]

[generate.template.c_header]
description = "C header guard and includes"
content     = """
#ifndef CPISI_ERROR_GEN_H
#define CPISI_ERROR_GEN_H

#include <stdint.h>

/* Generated from foundation.toml - DO NOT EDIT */

typedef uint16_t CpisiError;

{content}

#endif /* CPISI_ERROR_GEN_H */
"""

[generate.template.go_package]
description = "Go package declaration"
content     = """
// Package cpisi provides error handling types and functions.
// Generated from foundation.toml - DO NOT EDIT
package cpisi

{content}
"""

[generate.template.rust_module]
description = "Rust module declaration"
content     = """
//! CPI-SI Error types and handling.
//! Generated from foundation.toml - DO NOT EDIT

{content}
"""

[generate.layer.c_pattern]
description = "C layer constant pattern"
pattern     = "#define CPISI_ERR_BASE_{NAME} ({index} * 27)"
example     = "#define CPISI_ERR_BASE_KERNEL (0 * 27)  /* = 0 */"

[generate.layer.go_pattern]
description = "Go layer constant pattern"
pattern     = "const ErrBase{Name} CpisiError = {index} * 27"
example     = "const ErrBaseKernel CpisiError = 0 * 27  // = 0"

[generate.layer.rust_pattern]
description = "Rust layer constant pattern"
pattern     = "pub const ERR_BASE_{NAME}: CpisiError = {index} * 27;"
example     = "pub const ERR_BASE_KERNEL: CpisiError = 0 * 27;  // = 0"

[generate.formula.make_error_c]
description = "C MAKE_ERROR macro"
pattern     = "#define CPISI_MAKE_ERROR(layer, tier, pos) (((layer) * 27) + ((tier) * 9) + (pos))"

[generate.formula.make_error_go]
description = "Go MakeError function"
pattern     = """
func MakeError(layer, tier, pos int) CpisiError {
    return CpisiError(layer*27 + tier*9 + pos)
}
"""

[generate.formula.extract_c]
description = "C extraction macros"
pattern     = """
#define CPISI_ERR_LAYER(e)    ((e) / 27)
#define CPISI_ERR_TIER(e)     (((e) % 27) / 9)
#define CPISI_ERR_POSITION(e) (((e) % 27) % 9)
"""

[generate.validation]
description = "How to validate generated code"

[generate.validation.syntax]
c_compile   = "gcc -fsyntax-only -Wall -Werror -pedantic {file}"
go_build    = "go build -v {package}"
rust_check  = "cargo check --lib"

[generate.validation.tests]
c_test      = "Test MAKE_ERROR produces expected values"
go_test     = "Test extraction functions round-trip"
rust_test   = "Test const values match specification"

# ─────────────────────────────────────────────────────────────────────────

[extensions]

[_validation]
commands = "python3 -c \"import tomllib; tomllib.load(open('foundation.toml','rb'))\""

[_validation.schema]
required = ["architecture", "layer", "tier", "position", "formula", "expansion", "dar", "severity", "recovery", "biblical", "cognitive", "ternary", "generate"]

[_validation.health_scoring]
base = 100
deductions = { missing_table = -8, invalid_toml = -100 }

