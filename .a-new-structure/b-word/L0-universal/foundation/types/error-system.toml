[biblical]
description = "Error handling wisdom from Scripture"

[biblical.foresight]
scripture   = "Proverbs 27:12"
text        = "A prudent man foreseeth the evil, and hideth himself: but the simple pass on, and are punished."
principle   = "Error detection enables error prevention"
application = "Build systems that detect errors early"

[biblical.confession]
scripture   = "James 5:16"
text        = "Confess your faults one to another"
principle   = "Errors must be acknowledged to be fixed"
application = "Log errors honestly — hiding problems makes them worse"

[biblical.resilience]
scripture   = "Proverbs 24:16"
text        = "A just man falleth seven times, and riseth up again"
principle   = "Recovery is expected, not exceptional"
application = "Design for graceful recovery, not just error detection"

[biblical.judgment]
scripture   = "2 Corinthians 5:10"
text        = "For we must all appear before the judgment seat"
principle   = "Not all errors are equal"
application = "Use severity levels — triage errors appropriately"

[biblical.clarity]
scripture   = "James 5:12"
text        = "Let your yea be yea; and your nay, nay"
principle   = "Error meanings must be clear and consistent"
application = "Universal positions — same meaning across all layers"


# ───────────────────────────────────────────────────────────────────────────────
# Cv.2 COGNITIVE — Mental Construct Mapping [COGNITIVE]
# ───────────────────────────────────────────────────────────────────────────────

[cognitive]
description = "Error system maps to mental construct"

[cognitive.cube_mapping]
description = "27-position cube maps to error space"
cube_size   = 27
layers      = 9
tiers       = 3
positions   = 9
formula     = "layer × 27 + tier × 9 + position"

[cognitive.layer_axis]
description = "Layers map to X-axis (WHERE)"
below       = "Layers 0-3: foundations (kernel, system, runtime, framework)"
center      = "Layer 4: health (THE CENTER)"
above       = "Layers 5-8: applications (network, storage, engine, app)"

[cognitive.tier_axis]
description = "Tiers map to Y-axis (HOW DEEP)"
core        = "Tier 0: fundamental (must handle)"
ext         = "Tier 1: extended (should handle)"
sys         = "Tier 2: system (may handle)"

[cognitive.position_axis]
description = "Positions map to Z-axis (WHAT KIND)"
success     = "Position 0: no error"
null        = "Position 1: missing"
invalid     = "Position 2: malformed"
bounds      = "Position 3: out of range"
type        = "Position 4: wrong type"
state       = "Position 5: wrong state"
init        = "Position 6: init failed"
cleanup     = "Position 7: cleanup failed"
unknown     = "Position 8: uncategorized"


# ───────────────────────────────────────────────────────────────────────────────
# Cv.3 TERNARY — Ternary Alignment [TERNARY]
# ───────────────────────────────────────────────────────────────────────────────

[ternary]
description = "Ternary alignment for error system"

[ternary.bridge_equation]
alignment   = "243 + 13 = 256"
meaning     = "Ternary meets binary"
_neg1       = "243 = 3^5 = PENTERACT (ternary codes)"
_zero       = "13 = center of CUBE (metadata bridge)"
_pos1       = "256 = 2^8 = one byte (binary fit)"

[ternary.layer_balance]
alignment   = "4 + 1 + 4"
meaning     = "Balanced around health"
_neg1       = "4 layers below center (foundations)"
_zero       = "1 layer at center (health)"
_pos1       = "4 layers above center (applications)"

[ternary.tier_alignment]
alignment   = "CORE, EXT, SYS"
meaning     = "Severity gradient"
_neg1       = "CORE: critical, must handle"
_zero       = "EXT: warning, should handle"
_pos1       = "SYS: internal, may ignore"

[ternary.dar_phases]
alignment   = "Detect, Assess, Recover"
meaning     = "Building block flow"
_neg1       = "Detect: break down to identify (-1)"
_zero       = "Assess: balanced evaluation (0)"
_pos1       = "Recover: build up to solution (+1)"

[ternary.severity_mapping]
alignment   = "fatal/critical, warning/info, debug"
meaning     = "Response gradient"
_neg1       = "FATAL/CRITICAL: must stop or fix"
_zero       = "WARNING/INFO: note and continue"
_pos1       = "DEBUG: development only"


