L6_storage   = { use = "Internal storage errors", example = "Index rebuild" }
L7_engine    = { use = "Internal engine errors", example = "Pipeline stall" }
L8_app       = { use = "Internal app errors", example = "UI redraw" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.4 POSITIONS — 9 Universal Semantic Meanings [POSITIONS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Let your yea be yea; and your nay, nay" — James 5:12
# Position meanings are UNIVERSAL across all layers and tiers.
#
# ───────────────────────────────────────────────────────────────────────────────

[position]
description = "9 universal meanings — position 0 is ALWAYS success in every tier"
count       = 9

[position.success]
index       = 0
name        = "SUCCESS"
brief       = "Success or no error"
description = "No error condition exists"
macro       = "CPISI_POS_SUCCESS"
universal   = "Position 0 of every tier is reserved for 'no error of this type'"

[position.success.omnicode]
marker      = "{layer}.{tier}.SUCCESS"
example     = "CPISI_OK"

[position.success.cpisi]
ternary     = 0
meaning     = "No error — operation completed successfully"

[position.null]
index       = 1
name        = "NULL"
brief       = "Null pointer or missing"
description = "Required pointer was NULL or required item is missing"
macro       = "CPISI_POS_NULL"
examples    = ["NULL argument", "missing config", "object not found"]

[position.null.omnicode]
marker      = "{layer}.{tier}.NULL"
example     = "KERNEL.CORE.NULL"

[position.null.cpisi]
ternary     = -1
meaning     = "Missing — something required was not provided"

[position.invalid]
index       = 2
name        = "INVALID"
brief       = "Invalid parameter or malformed"
description = "Parameter is syntactically invalid or data is malformed"
macro       = "CPISI_POS_INVALID"
examples    = ["invalid enum", "malformed string", "corrupt data"]

[position.invalid.omnicode]
marker      = "{layer}.{tier}.INVALID"
example     = "SYSTEM.CORE.INVALID"

[position.invalid.cpisi]
ternary     = -1
meaning     = "Bad input — data provided but incorrect"

[position.bounds]
index       = 3
name        = "BOUNDS"
brief       = "Out of bounds or range"
description = "Value exceeds valid range or index is out of bounds"
macro       = "CPISI_POS_BOUNDS"
examples    = ["array overflow", "health > 1.0", "layer > 8"]

[position.bounds.omnicode]
marker      = "{layer}.{tier}.BOUNDS"
example     = "HEALTH.CORE.BOUNDS"

[position.bounds.cpisi]
ternary     = -1
meaning     = "Out of range — value exceeded limits"

[position.type]
index       = 4
name        = "TYPE"
brief       = "Type mismatch or format"
description = "Wrong type or incompatible format"
macro       = "CPISI_POS_TYPE"
examples    = ["expected int got string", "wrong encoding", "version mismatch"]

[position.type.omnicode]
marker      = "{layer}.{tier}.TYPE"
example     = "RUNTIME.CORE.TYPE"

[position.type.cpisi]
ternary     = -1
meaning     = "Wrong type — incompatible data format"

[position.state]
index       = 5
name        = "STATE"
brief       = "Invalid state or condition"
description = "Object is in wrong state for requested operation"
macro       = "CPISI_POS_STATE"
examples    = ["read before open", "already initialized", "connection closed"]

[position.state.omnicode]
marker      = "{layer}.{tier}.STATE"
example     = "NETWORK.CORE.STATE"

[position.state.cpisi]
ternary     = 0
meaning     = "Wrong state — operation not valid in current state"

[position.init]
index       = 6
name        = "INIT"
brief       = "Initialization or setup failure"
description = "Failed to initialize or set up a resource"
macro       = "CPISI_POS_INIT"
examples    = ["alloc failed", "config load failed", "subsystem init failed"]

[position.init.omnicode]
marker      = "{layer}.{tier}.INIT"
example     = "STORAGE.CORE.INIT"

[position.init.cpisi]
ternary     = +1
meaning     = "Init failed — could not start or set up"

[position.cleanup]
index       = 7
name        = "CLEANUP"
brief       = "Cleanup or teardown failure"
description = "Failed to clean up or tear down a resource"
macro       = "CPISI_POS_CLEANUP"
examples    = ["close failed", "free failed", "shutdown incomplete"]

[position.cleanup.omnicode]
marker      = "{layer}.{tier}.CLEANUP"
example     = "ENGINE.SYS.CLEANUP"

[position.cleanup.cpisi]
ternary     = +1
meaning     = "Cleanup failed — could not stop or tear down"

[position.unknown]
index       = 8
name        = "UNKNOWN"
brief       = "Unknown or uncategorized"
description = "Error doesn't fit other categories — should be rare"
macro       = "CPISI_POS_UNKNOWN"
warning     = "Prefer specific positions. UNKNOWN is a last resort."

[position.unknown.omnicode]
marker      = "{layer}.{tier}.UNKNOWN"
example     = "APP.EXT.UNKNOWN"

[position.unknown.cpisi]
ternary     = 0
meaning     = "Uncategorized — catch-all for unexpected errors"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.5 FORMULAS — Error Code Construction [FORMULAS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A just weight and balance are the LORD's" — Proverbs 16:11
# Error codes are derived from structural position, not hardcoded.
#
# ───────────────────────────────────────────────────────────────────────────────

[formula]
description = "Error codes are derived, not arbitrary"

[formula.make_error]
name        = "CPISI_MAKE_ERROR"
formula     = "(layer × CUBE) + (tier × FACE) + position"
expanded    = "(layer × 27) + (tier × 9) + position"
description = "Construct error code from layer, tier, and position"

[formula.make_error.omnicode]
marker      = "@formula MAKE_ERROR"
example     = "CPISI_MAKE_ERROR(KERNEL, CORE, NULL)"

[formula.make_error.examples]
cpisi_ok               = { formula = "(0 × 27) + (0 × 9) + 0", result = 0 }
cpisi_err_kernel_null  = { formula = "(0 × 27) + (0 × 9) + 1", result = 1 }
cpisi_err_health_bounds = { formula = "(4 × 27) + (0 × 9) + 3", result = 111 }

[formula.extract_layer]
name        = "Layer extraction"
formula     = "layer = code ÷ 27"
description = "Get layer index from error code"
c_macro     = "#define CPISI_ERR_LAYER(e) ((e) / 27)"
go_func     = "func ErrLayer(e CpisiError) int { return int(e) / 27 }"

[formula.extract_offset]
name        = "Offset extraction"
formula     = "offset = code % 27"
description = "Get position within layer"
c_macro     = "#define CPISI_ERR_OFFSET(e) ((e) % 27)"
go_func     = "func ErrOffset(e CpisiError) int { return int(e) % 27 }"

[formula.extract_tier]
name        = "Tier extraction"
formula     = "tier = (code % 27) ÷ 9"
description = "Get tier index within layer"
c_macro     = "#define CPISI_ERR_TIER(e) (((e) % 27) / 9)"
go_func     = "func ErrTier(e CpisiError) int { return (int(e) % 27) / 9 }"

[formula.extract_position]
name        = "Position extraction"
formula     = "position = (code % 27) % 9"
description = "Get position within tier"
c_macro     = "#define CPISI_ERR_POSITION(e) (((e) % 27) % 9)"
go_func     = "func ErrPosition(e CpisiError) int { return (int(e) % 27) % 9 }"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.6 EXPANSION — Domain Expansion [EXPANSION]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Write the vision, and make it plain" — Habakkuk 2:2
# CpisiError is uint16_t, allowing growth beyond core 256 codes.
#
# ───────────────────────────────────────────────────────────────────────────────

[expansion]
description = "Error type allows expansion beyond core 256"
type        = "uint16_t"
max_codes   = 65536

[expansion.domains.core]
range       = [0, 255]
description = "CPI-SI core (current)"
note        = "Bridge equation: 243 + 13 = 256"

[expansion.domains.extended]
range       = [256, 511]
description = "CPI-SI extended"
note        = "Future CPI-SI expansion"

[expansion.domains.cornerstone]
range       = [512, 767]
description = "Cornerstone engine"
note        = "Game engine specific errors"

[expansion.domains.faithnet]
range       = [768, 1023]
description = "FaithNet"
note        = "Network protocol errors"

[expansion.domains.bereshit]
range       = [1024, 1279]
description = "Bereshit storage"
note        = "Bible storage and retrieval errors"

[expansion.domains.application]
range       = [1280, 65535]
description = "Application-specific"
note        = "Reserved for applications"


# ═══════════════════════════════════════════════════════════════════════════════
# Co — OPERATIONS (Effects/Behaviors)
# ═══════════════════════════════════════════════════════════════════════════════
#
# How errors are handled — DAR phases, severity, recovery modes.
#
# ═══════════════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────────────
# Co.1 DAR — Detect/Assess/Recover Phases [DAR]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A prudent man foreseeth the evil" — Proverbs 27:12
# The three-phase error handling pattern.
#
# ───────────────────────────────────────────────────────────────────────────────

[dar]
description = "Detect → Assess → Recover: The three phases of error handling"
phases      = ["detect", "assess", "recover"]

[dar.detect]
phase       = 1
name        = "DETECT"
brief       = "Notice the error"
description = "First awareness that something went wrong"
questions   = ["What happened?", "Where did it happen?", "What was the context?"]

[dar.detect.omnicode]
marker      = "@dar.detect"
example     = "@dar.detect KERNEL.CORE.NULL"

[dar.detect.cpisi]
mental_pos  = "(-1, 0, 0)"
k_factor    = -1
role        = "Awareness — breaking down to identify problem"

[dar.assess]
phase       = 2
name        = "ASSESS"
brief       = "Understand severity and impact"
description = "Evaluate how serious the error is"
questions   = ["How bad is it?", "Can we recover?", "What resources do we need?"]

[dar.assess.omnicode]
marker      = "@dar.assess"
example     = "@dar.assess severity=critical"

[dar.assess.cpisi]
mental_pos  = "(0, 0, 0)"
k_factor    = 0
role        = "Evaluation — balanced assessment"

[dar.recover]
phase       = 3
name        = "RECOVER"
brief       = "Take corrective action"
description = "Fix the problem or fail gracefully"
questions   = ["What's the fix?", "How do we clean up?", "What do we report?"]

[dar.recover.omnicode]
marker      = "@dar.recover"
example     = "@dar.recover action=retry"

[dar.recover.cpisi]
mental_pos  = "(+1, 0, 0)"
k_factor    = +1
role        = "Action — building up toward solution"


# ───────────────────────────────────────────────────────────────────────────────
# Co.2 SEVERITY — Error Severity Levels [SEVERITY]
# ───────────────────────────────────────────────────────────────────────────────
#
# "For we must all appear before the judgment seat" — 2 Corinthians 5:10
# Not all errors are equal — severity determines response.
#
# ───────────────────────────────────────────────────────────────────────────────

[severity]
description = "Error severity determines required response"
levels      = ["fatal", "critical", "warning", "info", "debug"]

[severity.fatal]
level       = 0
name        = "FATAL"
ternary     = -1
brief       = "Cannot continue"
description = "System must terminate immediately"
action      = "Log and exit"
tier_map    = "CORE tier, positions 1-4"

[severity.critical]
level       = 1
name        = "CRITICAL"
ternary     = -1
brief       = "Major problem"
description = "Operation failed, requires attention"
action      = "Log, notify, attempt recovery"
tier_map    = "CORE tier, positions 5-8"

[severity.warning]
level       = 2
name        = "WARNING"
ternary     = 0
brief       = "Minor problem"
description = "Something unexpected but recoverable"
action      = "Log, continue with fallback"
tier_map    = "EXT tier"

[severity.info]
level       = 3
name        = "INFO"
ternary     = 0
brief       = "Informational"
description = "Noteworthy condition"
action      = "Log for diagnostics"
tier_map    = "SYS tier, positions 0-4"

[severity.debug]
level       = 4
name        = "DEBUG"
ternary     = +1
brief       = "Debug only"
description = "Developer information"
action      = "Log in debug builds only"
tier_map    = "SYS tier, positions 5-8"


# ───────────────────────────────────────────────────────────────────────────────
# Co.3 RECOVERY — Recovery Modes [RECOVERY]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A just man falleth seven times, and riseth up again" — Proverbs 24:16
# How to recover from different error types.
#
# ───────────────────────────────────────────────────────────────────────────────

[recovery]
description = "Recovery strategies for different error types"

[recovery.retry]
name        = "RETRY"
description = "Try the operation again"
when        = ["Transient failures", "Network timeouts", "Resource busy"]
max_attempts = 3
backoff     = "exponential"

[recovery.fallback]
name        = "FALLBACK"
description = "Use alternative approach"
when        = ["Primary path unavailable", "Resource exhausted"]
example     = "Use cached value if network fails"

[recovery.propagate]
name        = "PROPAGATE"
description = "Let caller handle it"
when        = ["Caller has more context", "Error affects caller's operation"]
transform   = "May wrap error with additional context"

[recovery.ignore]
name        = "IGNORE"
description = "Continue without handling"
when        = ["DEBUG level errors", "Non-critical metrics"]
warning     = "Use sparingly — most errors should be handled"

[recovery.terminate]
name        = "TERMINATE"
description = "Stop operation or process"
when        = ["FATAL errors", "Unrecoverable state"]
cleanup     = "Always clean up resources before terminating"


# ═══════════════════════════════════════════════════════════════════════════════
# Cv — COGNITION (Wisdom/Patterns)
# ═══════════════════════════════════════════════════════════════════════════════
