# ───────────────────────────────────────────────────────────────────────────────
# X.1 POLICY — Modification Guidelines [POLICY]
# ───────────────────────────────────────────────────────────────────────────────
#
# ❌ NEVER MODIFY:
#   - Bridge equation (243 + 13 = 256)
#   - Layer count (9 layers)
#   - Tier count (3 tiers)
#   - Position count (9 positions)
#   - Core position meanings (SUCCESS through UNKNOWN)
#   - Layer base calculations (layer × 27)
#
# ⚠️ MODIFY WITH CARE:
#   - Layer names (affects all error code names)
#   - Tier names (affects severity mapping)
#   - Expansion domain ranges (affects future compatibility)
#   - DAR phase definitions (affects error handling patterns)
#
# ✅ SAFE TO ADD:
#   - New domains in expansion section
#   - Additional metadata codes (within 243-255 range)
#   - Documentation and examples
#   - New scales entries
#   - Biblical grounding references
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.2 EXTENSION — How to Extend [EXTENSION]
# ───────────────────────────────────────────────────────────────────────────────
#
# Adding a New Layer:
#
#   NOT POSSIBLE — 9 layers are fixed by bridge equation
#   Instead: Use expansion domains (256-65535)
#
# Adding a New Tier:
#
#   NOT POSSIBLE — 3 tiers are fixed (27 = 3 × 9)
#   Instead: Use positions within existing tiers
#
# Adding a New Position:
#
#   NOT POSSIBLE — 9 positions are fixed (9 = 3²)
#   Instead: Use UNKNOWN position with extended error info
#
# Adding a New Domain:
#
#   1. Choose unused range in [expansion.domains]
#   2. Define range boundaries
#   3. Document domain purpose
#   4. Update error-codes.toml with specific codes
#
# ───────────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────────
# X.3 TROUBLESHOOTING — Common Problems [TROUBLESHOOTING]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Error code out of range":
#
#   Check: code < 256 for core domain
#   Check: layer × 27 + tier × 9 + position
#   Fix:   Verify layer (0-8), tier (0-2), position (0-8)
#
# "Layer extraction wrong":
#
#   Check: Using integer division (/ not %)
#   Fix:   layer = code / 27
#
# "Position meanings inconsistent":
#
#   Check: Using universal position meanings
#   Fix:   Position 1 is ALWAYS NULL across all layers
#
# "Bridge equation broken":
#
#   Check: 243 + 13 = 256
#   Check: 9 × 27 = 243
#   Fix:   Never modify layer/tier/position counts
#
# "Severity mapping wrong":
#
#   Check: CORE = critical, EXT = warning, SYS = internal
#   Fix:   Use tier to determine severity
#
# ───────────────────────────────────────────────────────────────────────────────

