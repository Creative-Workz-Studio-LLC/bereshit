# ───────────────────────────────────────────────────────────────────────────────
# Cc.3 TIERS — 3 Tiers Per Layer [TIERS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A threefold cord is not quickly broken." — Ecclesiastes 4:12
# Each layer's 27 codes divide into 3 tiers × 9 positions.
#
# ───────────────────────────────────────────────────────────────────────────────

[tier]
description = "Each layer has 3 tiers of 9 positions each"
stride      = 9   # FACE = 3^2

[tier.core]
index       = 0
name        = "CORE"
range       = [0, 8]
brief       = "Fundamental errors"
description = "Essential errors every system must handle"
macro       = "CPISI_TIER_CORE"

[tier.core.omnicode]
marker      = "@error {layer}.CORE"
syntax      = "@error {layer}.CORE.{position}"
example     = "@error KERNEL.CORE.NULL"

[tier.core.cpisi]
severity    = "critical"
recovery    = "must_handle"
k_factor    = -1

[tier.core.scales]
L0_kernel    = { use = "Fundamental kernel errors", example = "NULL pointer" }
L1_system    = { use = "Fundamental syscall errors", example = "EINVAL" }
L2_runtime   = { use = "Fundamental runtime errors", example = "Stack overflow" }
L3_framework = { use = "Fundamental framework errors", example = "Init failed" }
L4_health    = { use = "Fundamental health errors", example = "Score invalid" }
L5_network   = { use = "Fundamental network errors", example = "Connection failed" }
L6_storage   = { use = "Fundamental storage errors", example = "File not found" }
L7_engine    = { use = "Fundamental engine errors", example = "Context lost" }
L8_app       = { use = "Fundamental app errors", example = "Startup failed" }

[tier.ext]
index       = 1
name        = "EXT"
range       = [9, 17]
brief       = "Extended errors"
description = "Common scenarios beyond fundamentals"
macro       = "CPISI_TIER_EXT"

[tier.ext.omnicode]
marker      = "@error {layer}.EXT"
syntax      = "@error {layer}.EXT.{position}"
example     = "@error STORAGE.EXT.BOUNDS"

[tier.ext.cpisi]
severity    = "warning"
