L1_system    = { use = "Extended syscall errors", example = "EAGAIN" }
L2_runtime   = { use = "Extended runtime errors", example = "Timeout" }
L3_framework = { use = "Extended framework errors", example = "Config warning" }
L4_health    = { use = "Extended health errors", example = "Score degraded" }
L5_network   = { use = "Extended network errors", example = "Retry needed" }
L6_storage   = { use = "Extended storage errors", example = "Low disk space" }
L7_engine    = { use = "Extended engine errors", example = "Frame skip" }
L8_app       = { use = "Extended app errors", example = "Feature unavailable" }

[tier.sys]
