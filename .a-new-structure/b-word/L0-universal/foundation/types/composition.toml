[storage_alignment.efficiency]
description = "Storage efficiency metrics"

struct_overhead  = "alignment padding (0-7 bytes typical)"
union_overhead   = "discriminant (1 byte) + largest variant padding"
list_overhead    = "length prefix (2 bytes for uint9)"
map_overhead     = "length prefix + key hashing"
set_overhead     = "length prefix + uniqueness tracking"
bytes_overhead   = "length prefix (2 bytes for uint9)"


# ═══════════════════════════════════════════════════════════════════════════════
# OPERATIONS (Co — Type Composition Operations)
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And God made the firmament, and divided the waters which were under the
#  firmament from the waters which were above the firmament: and it was so."
#  — Genesis 1:7 KJV
#
# OPERATIONS THAT TRANSFORM TYPES
#
# Just as God's operations in creation divided, combined, and transformed the
# primordial waters, type operations transform and combine types. These are the
# verbs of the type system — what you DO with types, not what types ARE.
#
# STRUCTURE:
#   Co.1 COMBINATION   — Intersection, union, merge (gathering types)
#   Co.2 PROJECTION    — Pick, omit, transform (selecting from types)
#   Co.3 EFFECTS       — Pure, IO, state, async (side effect tracking)
#   Co.4 VALIDATION    — Assert, guard, narrow (runtime verification)
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Co.1 COMBINATION — Type Combining Operations [COMBINATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And God said, Let the waters under the heaven be gathered together unto one
#  place, and let the dry land appear: and it was so." — Genesis 1:9 KJV
#
# GATHERING AND SEPARATING
#
# Type combination operations mirror God's creative acts of gathering and
# separating. Intersection gathers what's common; union allows alternation;
# merge combines structures; difference separates.
#
# SUB-SECTIONS:
#   Co.1a intersection — Common ground (A & B yields shared properties)
#   Co.1b union_op     — Either/or (A | B yields one of the types)
#   Co.1c merge        — Both together (A + B yields combined properties)
#   Co.1d difference   — Separation (A - B yields what's unique to A)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Co.1a INTERSECTION — Common Ground [INTERSECTION]
# ───────────────────────────────────────────────────────────────────────────────

[intersection]
name        = "intersection"
description = "Type intersection — yields properties common to both types"
kind        = "operation"
category    = "combination"
symbol      = "&"

# Intersection Semantic Properties
semantic_meaning       = "common_ground"
ternary_value          = 0                                       # Balanced — takes from both
biblical_parallel      = "Philippians 2:2"
biblical_text          = "Be likeminded, having the same love, being of one accord"

[intersection.omnicode]
keywords    = ["where", "both", "and", "share"]
pattern     = "<TypeA> where both <TypeB>"
modifiers   = ["strict", "partial"]
examples    = [
    "Person where both Employee",
    "Shape where both Colored",
]

[intersection.cpisi]
direction   = ["narrow", "hold", "combine"]
weight      = ["constrained", "balanced", "expanded"]
action      = ["filter", "compare", "merge"]
genesis     = ["separated", "named", "gathered"]

[intersection.types.typescript]
keyword     = "&"
syntax      = "type Both = TypeA & TypeB"
example     = "type ColoredShape = Shape & Colored"

[intersection.types.go]
keyword     = "embedded"
syntax      = "type Both struct { TypeA; TypeB }"
example     = "type ColoredShape struct { Shape; Colored }"

[intersection.types.rust]
keyword     = "+"
syntax      = "impl TraitA + TraitB"
example     = "fn draw<T: Shape + Colored>(item: T)"

[intersection.scales]
L0_kernel    = { name = "CapabilityMask",    example = "cpu_caps & required_caps",      use = "Hardware capability intersection" }
L1_system    = { name = "PermissionMask",    example = "user_perms & file_perms",       use = "Access control intersection" }
L2_runtime   = { name = "InterfaceMatch",    example = "Reader & Writer",               use = "Multiple interface requirements" }
L3_framework = { name = "TraitBounds",       example = "Serialize & Clone",             use = "Combined trait requirements" }
L4_health    = { name = "RiskFactors",       example = "genetic & lifestyle",           use = "Combined risk assessment" }
L5_network   = { name = "ProtocolCaps",      example = "http2 & tls1.3",                use = "Protocol capability match" }
L6_storage   = { name = "IndexIntersect",    example = "idx_a & idx_b",                 use = "Multi-index query" }
L7_engine    = { name = "EntityComponents",  example = "Position & Velocity",           use = "ECS component queries" }
L8_app       = { name = "FeatureFlags",      example = "premium & beta_tester",         use = "Combined feature access" }


