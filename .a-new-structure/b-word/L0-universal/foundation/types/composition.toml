# ───────────────────────────────────────────────────────────────────────────────
# Cc.1c TUPLE — Anonymous Product Type [TUPLE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And the evening and the morning were the first day."
#  — Genesis 1:5 KJV
#
# The tuple is an ordered sequence of types, accessed by position, not name.
# Like evening AND morning — both present, in order, making one day.
# The tuple is the struct's anonymous cousin: same structure, no names.
#
# ───────────────────────────────────────────────────────────────────────────────

[tuple]
