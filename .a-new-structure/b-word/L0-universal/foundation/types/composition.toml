# X.4 REFERENCE — Quick Lookup [REFERENCE]
# ───────────────────────────────────────────────────────────────────────────────
#
# Validation:
#   tomlv composition.toml
#   python -c "import toml; toml.load('composition.toml')"
#
# Go Integration:
#   type CompositionType struct {
#       Name        string `toml:"name"`
#       Description string `toml:"description"`
#       Kind        string `toml:"kind"`
#   }
#
#   type TypeRules struct {
#       Struct     CompositionType           `toml:"struct"`
#       Union      CompositionType           `toml:"union"`
#       Tuple      CompositionType           `toml:"tuple"`
#       Constraint map[string]Constraint     `toml:"constraint"`
#   }
#
#   cfg, _ := toml.LoadFile("composition.toml")
#
# Dependencies:
#   primitives.toml → composition.toml → schemas/* → contracts/*
#                     ↑ YOU ARE HERE
#
# ───────────────────────────────────────────────────────────────────────────────

