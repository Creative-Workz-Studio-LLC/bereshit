description = "Anonymous product type — ordered sequence of typed elements"
kind        = "composition"
strategy    = "product"

# Tuple Core Properties
field_ordering = "positional"                    # Access by index (0, 1, 2...)
fixed_length   = true                            # Length known at compile time
heterogeneous  = true                            # Elements can have different types
anonymous      = true                            # No field names, just positions

# Tuple Semantic Properties
semantic_meaning  = "sequence"                   # Ordered, positional
ternary_value     = 0                            # 0 = neutral, balanced
biblical_parallel = "Genesis 1:5"                # Evening and morning = one day

# ───────────────────────────────────────────────────────────────────────────────
# Tuple OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[tuple.omnicode]
description = "OmniCode syntax for tuple declaration and usage"

# Declaration keywords
keywords    = ["tuple", "of", "and"]

# Declaration pattern
pattern     = "tuple of <type> and <type> and <type>"

# Access syntax
