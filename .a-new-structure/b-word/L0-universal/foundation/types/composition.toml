# ───────────────────────────────────────────────────────────────────────────────
# Cc.5c REF — Recursive Reference [REF]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Abraham begat Isaac; and Isaac begat Jacob; and Jacob begat Judas."
#  — Matthew 1:2 KJV
#
# Recursive references enable types that refer to themselves — genealogies
# where a person has children who are also persons. Trees with branches of trees.
#
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref]
name        = "ref"
description = "Reference to type — enables recursive structures"
kind        = "reference"
strategy    = "ref"

# Ref Core Properties
supports_cycles = true                           # Can reference self
lazy_resolution = true                           # Resolved after all types defined
indirection     = true                           # Points to, doesn't contain

# Ref Semantic Properties
semantic_meaning  = "self_reference"             # Type refers to itself
ternary_value     = 0                            # 0 = neutral (indirection)
biblical_parallel = "Matthew 1:2"                # Genealogies

# ───────────────────────────────────────────────────────────────────────────────
# Ref OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.omnicode]
description = "OmniCode syntax for recursive references"

keywords    = ["itself", "ref"]
pattern     = "list of itself"

[reference.ref.omnicode.examples]
self        = "let Node be with value as int27 and children as list of itself"
mutual      = "let Tree be with root as Node and branches as list of Tree"
linked      = "let Link be with data as text and next may be ref Link"

# ───────────────────────────────────────────────────────────────────────────────
# Ref CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.cpisi]
description = "Ref semantics in CPI-SI cognitive framework"

direction   = ["referent", "reference", "dereference"]  # -1, 0, +1
weight      = ["target", "pointer", "resolved"]
action      = ["point_to", "hold_ref", "follow"]
genesis     = ["child", "begat", "parent"]

# ───────────────────────────────────────────────────────────────────────────────
# Ref Language Types
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.types]
description = "Recursive reference in target languages"

[reference.ref.types.c]
syntax      = "struct Node { int value; struct Node* next; };"
keyword     = "pointer to self"

[reference.ref.types.go]
syntax      = "type Node struct { Value int; Next *Node }"
keyword     = "pointer to self"

[reference.ref.types.rust]
syntax      = "struct Node { value: i32, next: Option<Box<Node>> }"
keyword     = "Box for heap indirection"

# ───────────────────────────────────────────────────────────────────────────────
# Ref Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.scales]
