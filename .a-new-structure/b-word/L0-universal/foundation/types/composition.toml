# ───────────────────────────────────────────────────────────────────────────────

[relationship.equality.omnicode]
description = "OmniCode syntax for type equality"

keywords    = ["is", "the", "same", "as"]
pattern     = "<Type> is the same as <OtherType>"

[relationship.equality.omnicode.examples]
structural  = "Point is the same as {x: int27, y: int27}"
alias       = "UserID is the same as int27"     # Alias
distinct    = "UserID is not the same as OrderID"  # Newtype

# ───────────────────────────────────────────────────────────────────────────────
# Equality CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[relationship.equality.cpisi]
