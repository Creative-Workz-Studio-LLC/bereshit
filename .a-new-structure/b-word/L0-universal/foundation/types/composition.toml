# ═══════════════════════════════════════════════════════════════════════════════
# Cc.8 STORAGE — Binary Representation [STORAGE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first, and
#  counteth the cost, whether he have sufficient to finish it?" — Luke 14:28 KJV
#
# COUNT THE COST BEFORE BUILDING
#
# Storage defines how composite types map to binary hardware. CRITICAL: this
# inherits from primitives.toml [storage] — the hardware reality. Ternary types
# live in binary storage until MillenniumOS provides native ternary hardware.
#
# KEY INSIGHT (from primitives.toml [storage]):
#   All composite types inherit the binary-ternary bridge
#   Packed: Machine-efficient, 5 trits per byte
#   Unpacked: Human-readable, one char per trit
#
# COMPOSITE STORAGE RULES:
#   struct: Sum of member sizes + alignment padding
#   union:  Size of largest variant (shared storage)
#   tuple:  Concatenation of element sizes
#   list:   Length prefix + packed elements
#   map:    Length prefix + key-value pairs
#   set:    Length prefix + unique elements
#   bytes:  Length prefix + raw uint8 sequence
#
# THE COST PRINCIPLE:
#   Unknown cost  | Counting      | Known cost
#   Just building | This analysis | Informed building
#   Tower fails   | Tower plans   | Tower succeeds
#
# TERNARY ALIGNMENT:
#   unpacked = -1 (human-readable, less efficient)
#   bridge   =  0 (the storage layer itself)
#   packed   = +1 (machine-efficient, optimal)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register layout, cache-line alignment
#   L1 (System):    IPC buffer layout, syscall arg packing
#   L2 (Runtime):   Object layout, stack frame structure
#   L3 (Framework): Serialization format, wire protocol
#   L4 (Health):    Health vector packing, status byte layout
#   L5 (Network):   Packet layout, header alignment
#   L6 (Storage):   Disk block layout, file format
#   L7 (Engine):    State snapshot format, checkpoint layout
#   L8 (App):       API payload format, user data encoding
#
# Implementation: pkg/core/types/storage.gen.h
# Reference:      primitives.toml [storage], ternary.toml [packing]
#
# ═══════════════════════════════════════════════════════════════════════════════

[composite_storage]
description   = "How composite types map to binary storage"
principle     = "Count the cost before building (Luke 14:28)"
inherits_from = "primitives.toml [storage]"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.8a ALIGNMENT — Storage Alignment Rules [ALIGNMENT]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And he measured the city with the reed, twelve thousand furlongs. The length
#  and the breadth and the height of it are equal." — Revelation 21:16 KJV
#
# Alignment ensures efficient memory access. Like the perfectly measured city,
# types must be aligned for optimal hardware access.
#
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment]
name          = "alignment"
description   = "How composite types map to binary storage with alignment"
kind          = "storage"
strategy      = "alignment"

# Alignment Core Properties
inherits_from = "primitives.toml [storage]"
note          = "All ternary storage rules from primitives apply to composite types"

# Alignment Semantic Properties
semantic_meaning  = "optimal_layout"             # Efficient access
ternary_value     = 0                            # 0 = bridge layer
biblical_parallel = "Revelation 21:16"           # Perfectly measured

# ───────────────────────────────────────────────────────────────────────────────
# Struct Storage
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.struct]
description  = "Product type storage — all members present"
packed       = "Sum of packed member sizes, respecting alignment"
unpacked     = "JSON-like object: { field: value, ... }"
padding      = "May include padding for alignment in packed form"
order        = "Fields in declaration order"

# Size calculation
size_formula = "sum(member_sizes) + alignment_padding"
alignment    = "max(member_alignments)"

# ───────────────────────────────────────────────────────────────────────────────
# Union Storage
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.union]
description  = "Sum type storage — one variant active"
packed       = "Size of largest variant (all variants share storage)"
unpacked     = "JSON-like object: { type: 'variant', value: ... }"
discriminant = "Tag byte (trit for 3 variants, uint8 for more)"
layout       = "tag + variant_data"

# Size calculation
size_formula = "discriminant_size + max(variant_sizes)"
alignment    = "max(variant_alignments)"

# ───────────────────────────────────────────────────────────────────────────────
# Tuple Storage
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.tuple]
description  = "Anonymous product storage — positional elements"
packed       = "Concatenation of packed element representations"
unpacked     = "JSON-like array: [value0, value1, ...]"
order        = "Elements in positional order (0, 1, 2...)"
padding      = "May include padding for alignment"

# Size calculation
size_formula = "sum(element_sizes) + alignment_padding"
alignment    = "max(element_alignments)"

# ───────────────────────────────────────────────────────────────────────────────
# List Storage
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.list]
description  = "Ordered collection storage — length-prefixed elements"
packed       = "Length prefix + packed elements"
unpacked     = "JSON-like array: [...]"
length_type  = "uint9"                           # From primitives.toml
max_elements = 19682                             # 3^9 - 1

# Size calculation
size_formula = "length_prefix_size + (element_size × count)"
variable     = true                              # Size depends on content

# ───────────────────────────────────────────────────────────────────────────────
# Map Storage
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.map]
description    = "Key-value storage — length-prefixed pairs"
packed         = "Length prefix + packed key-value pairs"
unpacked       = "JSON-like object: { key: value, ... }"
key_constraint = "Keys must be hashable (primitives or text)"
length_type    = "uint9"                         # From primitives.toml

# Size calculation
size_formula   = "length_prefix_size + sum(key_sizes + value_sizes)"
variable       = true                            # Size depends on content

# ───────────────────────────────────────────────────────────────────────────────
# Set Storage
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.set]
description        = "Unique collection storage — length-prefixed unique elements"
packed             = "Length prefix + packed unique elements"
unpacked           = "JSON-like array with uniqueness: [...]"
element_constraint = "Elements must be hashable"
length_type        = "uint9"                     # From primitives.toml

# Size calculation
size_formula       = "length_prefix_size + (element_size × count)"
variable           = true                        # Size depends on content

# ───────────────────────────────────────────────────────────────────────────────
# Bytes Storage
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.bytes]
description  = "Raw binary storage — the bridge to hardware"
packed       = "Length prefix (uint9) + raw uint8 sequence"
unpacked     = "Base64 or hex string representation"
element_size = 1                                 # 1 byte (uint8)
length_type  = "uint9"                           # From primitives.toml
note         = "Bridge between ternary logic and binary hardware storage"

# Size calculation
size_formula = "length_prefix_size + byte_count"
variable     = true                              # Size depends on content

# ───────────────────────────────────────────────────────────────────────────────
# Storage Language Types
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.types]
description = "Storage representation in target languages"

[storage_alignment.types.c]
struct_layout  = "packed with __attribute__((packed)) or aligned"
union_layout   = "native C union with tag wrapper"
sizeof         = "sizeof(Type)"

[storage_alignment.types.go]
struct_layout  = "encoding/binary package"
json_layout    = "encoding/json package"
reflect        = "reflect.TypeOf(x).Size()"

[storage_alignment.types.rust]
struct_layout  = "#[repr(C)] for C-compatible layout"
packed         = "#[repr(packed)] for no padding"
size_of        = "std::mem::size_of::<Type>()"

# ───────────────────────────────────────────────────────────────────────────────
# Storage Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.scales]
description = "Storage at each architectural layer"

L0_kernel    = { alignment = 64,   note = "Cache line aligned",         use = "DMA, registers" }
L1_system    = { alignment = 8,    note = "Word aligned",               use = "Syscall buffers" }
L2_runtime   = { alignment = 8,    note = "Pointer aligned",            use = "Object layout" }
L3_framework = { alignment = 1,    note = "Byte aligned (wire format)", use = "Serialization" }
L4_health    = { alignment = 1,    note = "Byte aligned (packed)",      use = "Health vectors" }
L5_network   = { alignment = 1,    note = "Network byte order",         use = "Packet layout" }
L6_storage   = { alignment = 512,  note = "Block aligned",              use = "Disk blocks" }
L7_engine    = { alignment = 8,    note = "Word aligned",               use = "State snapshots" }
L8_app       = { alignment = 1,    note = "Variable (JSON/TOML)",       use = "API payloads" }

# ───────────────────────────────────────────────────────────────────────────────
# Bible Connection
# ───────────────────────────────────────────────────────────────────────────────

[storage_alignment.bible_connection]
description = "Bible addressing validates the storage model"
note        = "Bible addressing (bible/addressing.toml) validates storage model"
example     = "VerseAddress struct uses trit5 pair = 2 bytes packed"
reference   = "See bible/addressing.toml [ternary.packed]"
