# ───────────────────────────────────────────────────────────────────────────────
# X.3 TROUBLESHOOTING — Common Problems [TROUBLESHOOTING]
# ───────────────────────────────────────────────────────────────────────────────
#
# "invalid TOML":
#   → Missing quotes around strings with special characters
#   → Duplicate keys in same section
#
# "constraint applies_to invalid":
#   → References primitives that don't exist in primitives.toml
#   → Check primitives.toml for valid type names
#
# "circular inheritance":
#   → Type A extends B extends A
#   → Break the cycle by extracting shared interface
#
# "variance mismatch":
#   → Contravariant type used in covariant position
#   → Review yields/receives semantics
#
# ───────────────────────────────────────────────────────────────────────────────

