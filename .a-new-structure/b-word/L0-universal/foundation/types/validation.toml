# ───────────────────────────────────────────────────────────────────────────────
# Cc.2e UNIQUE — Uniqueness Constraint Validation [UNIQUE]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.unique]
name             = "unique"
description      = "Validate uniqueness constraint — no duplicates allowed"
source_type      = "composition.toml [constraint.unique]"
category         = "integrity"
applies_to       = ["list", "set", "map"]

# Validation Rule
[constraint.unique.rule]
type             = "uniqueness_check"
scope            = "collection"                           # Within single collection
by_field         = false                                  # Check whole value by default

# Error Definition
[constraint.unique.error]
code             = "UNIQUE_VIOLATION"
severity         = "error"
message          = "Duplicate value found"
message_template = "Unique violation: duplicate '{value}' at positions {positions}"

# OmniCode Syntax
[constraint.unique.omnicode]
check            = "all unique"
declare          = "let value be list<T> where unique(value)"
assert           = "assert unique({value})"
guard            = "guard unique {value} else {error}"

# CPI-SI Interpretation
[constraint.unique.cpisi]
valid_meaning    = "All elements distinct — identity preserved"
invalid_meaning  = "Duplicates present — identity confusion"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.unique.types]
c_validator      = "bool validate_unique(const void* array, size_t count, size_t elem_size, int (*cmp)(const void*, const void*))"
go_validator     = "func ValidateUnique[T comparable](items []T) bool { seen := make(map[T]bool); for _, v := range items { if seen[v] { return false }; seen[v] = true }; return true }"
rust_validator   = "fn validate_unique<T: Eq + Hash>(items: &[T]) -> bool { items.iter().collect::<HashSet<_>>().len() == items.len() }"

# Scale Applications
[constraint.unique.scales]
L0_kernel        = { use = "interrupt vectors",           example = "no duplicate handlers" }
L1_system        = { use = "file descriptors",            example = "unique handles" }
L2_runtime       = { use = "object IDs",                  example = "unique references" }
L3_framework     = { use = "config keys",                 example = "unique settings" }
L4_health        = { use = "metric IDs",                  example = "unique identifiers" }
L5_network       = { use = "connection IDs",              example = "unique sessions" }
L6_storage       = { use = "primary keys",                example = "unique records" }
L7_engine        = { use = "rule IDs",                    example = "unique rules" }
L8_app           = { use = "user IDs",                    example = "unique accounts" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2f FOREIGN_KEY — Referential Integrity Validation [FOREIGN_KEY]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.foreign_key]
name             = "foreign_key"
description      = "Validate referential integrity — referenced value exists"
source_type      = "composition.toml [constraint.foreign_key]"
category         = "integrity"
applies_to       = ["any"]

# Validation Rule
[constraint.foreign_key.rule]
type             = "reference_check"
target_required  = true                                   # Referenced entity must exist
on_delete        = "restrict"                             # Default: prevent delete if referenced
on_update        = "cascade"                              # Default: update references

# Error Definition
[constraint.foreign_key.error]
code             = "FOREIGN_KEY_VIOLATION"
severity         = "error"
message          = "Referenced value does not exist"
message_template = "Foreign key violation: '{value}' not found in {target}"

[constraint.foreign_key.error.dangling]
code             = "DANGLING_REFERENCE"
message_template = "Dangling reference: {source}.{field} -> {target} (missing: {value})"

# OmniCode Syntax
[constraint.foreign_key.omnicode]
check            = "references exist"
declare          = "let value be ref T where exists(T, value)"
assert           = "assert {value} references {target}"
guard            = "guard foreign_key {value} in {target} else {error}"

# CPI-SI Interpretation
[constraint.foreign_key.cpisi]
valid_meaning    = "Reference resolves — relationship intact"
invalid_meaning  = "Reference broken — orphaned data"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.foreign_key.types]
c_validator      = "bool validate_foreign_key(const char* value, const Table* target)"
go_validator     = "func ValidateForeignKey[K comparable](key K, lookup map[K]any) bool { _, ok := lookup[key]; return ok }"
rust_validator   = "fn validate_foreign_key<K: Eq + Hash>(key: &K, lookup: &HashSet<K>) -> bool { lookup.contains(key) }"

# Scale Applications
[constraint.foreign_key.scales]
L0_kernel        = { use = "device references",           example = "device exists" }
L1_system        = { use = "process references",          example = "process exists" }
L2_runtime       = { use = "object references",           example = "object alive" }
L3_framework     = { use = "config references",           example = "setting exists" }
L4_health        = { use = "source references",           example = "source valid" }
L5_network       = { use = "peer references",             example = "peer connected" }
L6_storage       = { use = "record references",           example = "record exists" }
L7_engine        = { use = "rule references",             example = "rule defined" }
L8_app           = { use = "entity references",           example = "entity exists" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2g DEFAULT — Default Value Constraint Validation [DEFAULT]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.default]
name             = "default"
description      = "Validate default value constraint — fallback when absent"
source_type      = "composition.toml [constraint.default]"
category         = "fallback"
applies_to       = ["any"]

# Validation Rule
[constraint.default.rule]
type             = "default_check"
when_missing     = "apply_default"                        # Use default when value absent
when_null        = "apply_default"                        # Use default when null
type_match       = true                                   # Default must match field type

# Error Definition
[constraint.default.error]
code             = "DEFAULT_VIOLATION"
severity         = "error"
message          = "Default value does not match type"
message_template = "Default violation: '{default}' not valid for type {type}"

[constraint.default.error.type_mismatch]
code             = "DEFAULT_TYPE_MISMATCH"
message_template = "Default value type mismatch: expected {expected}, got {actual}"

# OmniCode Syntax
[constraint.default.omnicode]
check            = "has valid default"
declare          = "let value be T = {default}"
assert           = "assert default({value}) as {type}"
apply            = "value ?? {default}"

# CPI-SI Interpretation
[constraint.default.cpisi]
valid_meaning    = "Default is appropriate fallback — system can proceed"
invalid_meaning  = "Default is wrong type — cannot safely apply"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.default.types]
c_validator      = "bool validate_default(const void* default_val, TypeInfo* expected_type)"
go_validator     = "func ValidateDefault[T any](defaultVal T) bool { return true } // Type enforced at compile time"
rust_validator   = "fn validate_default<T: Default>(_: &T) -> bool { true } // Type enforced at compile time"

# Scale Applications
[constraint.default.scales]
L0_kernel        = { use = "register defaults",           example = "reset values" }
L1_system        = { use = "config defaults",             example = "missing settings" }
L2_runtime       = { use = "field defaults",              example = "uninitialized fields" }
L3_framework     = { use = "option defaults",             example = "missing options" }
L4_health        = { use = "baseline defaults",           example = "missing metrics" }
L5_network       = { use = "protocol defaults",           example = "missing fields" }
L6_storage       = { use = "schema defaults",             example = "missing columns" }
L7_engine        = { use = "rule defaults",               example = "missing parameters" }
L8_app           = { use = "preference defaults",         example = "missing settings" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.2h IMMUTABLE — Immutability Constraint Validation [IMMUTABLE]
# ───────────────────────────────────────────────────────────────────────────────

[constraint.immutable]
name             = "immutable"
description      = "Validate immutability constraint — value cannot change"
source_type      = "composition.toml [constraint.immutable]"
category         = "protection"
applies_to       = ["any"]

# Validation Rule
[constraint.immutable.rule]
type             = "immutability_check"
allow_initial    = true                                   # Can set once
allow_modify     = false                                  # Cannot change after set
deep             = true                                   # Nested values also immutable

# Error Definition
[constraint.immutable.error]
code             = "IMMUTABLE_VIOLATION"
severity         = "error"
message          = "Attempted to modify immutable value"
message_template = "Immutable violation: cannot modify '{field}' after initialization"

[constraint.immutable.error.deep_modify]
code             = "DEEP_IMMUTABLE_VIOLATION"
message_template = "Deep immutable violation: cannot modify nested field '{path}'"

# OmniCode Syntax
[constraint.immutable.omnicode]
check            = "is immutable"
declare          = "let const value be T"
assert           = "assert immutable({value})"
guard            = "guard immutable {value} else {error}"

# CPI-SI Interpretation
[constraint.immutable.cpisi]
valid_meaning    = "Value preserved — integrity maintained"
invalid_meaning  = "Modification attempted — integrity violated"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# Target Language Implementations
[constraint.immutable.types]
c_validator      = "// Immutability enforced via const qualifier"
c_pattern        = "const T value;"
go_validator     = "// Go has no native immutability — use conventions"
go_pattern       = "unexported field + getter only"
rust_validator   = "// Rust immutable by default"
rust_pattern     = "let value: T; // immutable unless mut"

# Scale Applications
[constraint.immutable.scales]
L0_kernel        = { use = "hardware constants",          example = "ROM values" }
L1_system        = { use = "system constants",            example = "config constants" }
L2_runtime       = { use = "frozen objects",              example = "sealed values" }
L3_framework     = { use = "config constants",            example = "read-only settings" }
L4_health        = { use = "historical records",          example = "audit trail" }
L5_network       = { use = "signed messages",             example = "tamper prevention" }
L6_storage       = { use = "archived records",            example = "write-once data" }
L7_engine        = { use = "rule definitions",            example = "frozen rules" }
L8_app           = { use = "user history",                example = "immutable logs" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cc.3 STRUCTURAL — Composite Type Validation [STRUCTURAL]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Except the LORD build the house, they labour in vain that build it."
#  — Psalm 127:1 KJV
#
# VALIDATING COMPOSITE STRUCTURES
#
# Structural validation verifies that composite types (struct, union, list, map)
# are well-formed. This includes checking required fields, type matches, and
# composition rules from composition.toml.
#
# KEY INSIGHT (from composition.toml):
#   Composite types have internal structure to validate:
#   struct:  All required fields present, all fields correct type
#   union:   Exactly one variant active, discriminator valid
#   list:    All elements same type, length constraints
#   map:     Keys unique, key/value types match
#
# VALIDATION PRINCIPLE:
#   Structure must match schema. Missing required = error.
#   Unknown fields = error (strict) or warning (lenient).
#
# Reference: L0-universal/foundation/types/composition.toml [composition.*]
#
# ═══════════════════════════════════════════════════════════════════════════════

[structural]
description = "Structural validation — verifying composite types are well-formed"
principle   = "The LORD builds the house (Ps 127:1) — structure must match design"
source      = "L0-universal/foundation/types/composition.toml"
categories  = ["struct", "union", "list", "map", "tuple", "bytes"]

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3a STRUCT — Product Type Validation [STRUCT]
# ───────────────────────────────────────────────────────────────────────────────

[structural.struct]
name             = "struct"
description      = "Validate struct composition — named fields, all present (product type)"
source_type      = "composition.toml [struct]"
category         = "product"

[structural.struct.rule]
type             = "product"
check_required   = true                                      # All fields must be present
check_types      = true                                      # Each field matches declared type
allow_extra      = false                                     # No undeclared fields
preserve_order   = false                                     # Field order irrelevant for validation

[structural.struct.rule.field_checks]
required_present = "all declared fields must have values"
type_match       = "each value must match its declared type"
no_unknown       = "reject fields not in declaration"
nested_validate  = "recursively validate nested structs"

[structural.struct.error]
code             = "STRUCT_VIOLATION"
severity         = "error"
message          = "Struct validation failed"

[structural.struct.error.required_field]
code             = "MISSING_REQUIRED_FIELD"
message_template = "Required field '{field}' is missing from struct '{struct}'"

[structural.struct.error.type_mismatch]
code             = "FIELD_TYPE_MISMATCH"
message_template = "Field '{field}' in struct '{struct}': expected {expected}, got {actual}"

[structural.struct.error.unknown_field]
code             = "UNKNOWN_FIELD"
message_template = "Unknown field '{field}' in struct '{struct}' — strict mode rejects extra fields"

[structural.struct.error.nested_failure]
code             = "NESTED_STRUCT_INVALID"
message_template = "Nested struct at '{path}' failed validation: {reason}"

[structural.struct.omnicode]
declare          = "let person be struct { name: text, age: uint9 }"
check            = "{value} is valid struct"
validate         = "validate {struct} against {schema}"
field_access     = "get {field} from {struct}"
construct        = "create struct { name = \"Nova\", age = 1 }"

[structural.struct.cpisi]
valid_meaning    = "All fields present and correctly typed — product is complete"
invalid_meaning  = "Structure incomplete or mistyped — contract violation"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "composition"
weight           = "varies"                                  # Depends on field count/complexity
genesis_parallel = "Creation of distinct, named things — ordering the formless"

[structural.struct.types]
c_validator      = "bool validate_struct(const void* s, const StructSchema* schema) { /* field iteration */ }"
go_validator     = "func ValidateStruct(v any, schema StructSchema) error { /* reflection-based check */ }"
rust_validator   = "fn validate_struct<T: StructValidate>(v: &T, schema: &StructSchema) -> Result<(), ValidationError>"
c_repr           = "struct { ... }"
go_repr          = "struct { ... }"
rust_repr        = "struct { ... }"

[structural.struct.scales]
description      = "struct validation at each architectural layer"
L0_kernel        = { use = "kernel config structs",          example = "device_info { id, type, flags }" }
L1_system        = { use = "syscall arg structs",            example = "ipc_message { sender, data }" }
L2_runtime       = { use = "object instances",               example = "session { user_id, state }" }
L3_framework     = { use = "config containers",              example = "app_settings { theme, lang }" }
L4_health        = { use = "health records",                 example = "health_status { score, checks }" }
L5_network       = { use = "message payloads",               example = "request { header, body }" }
L6_storage       = { use = "data records",                   example = "user_record { name, email }" }
L7_engine        = { use = "state containers",               example = "machine_state { current, history }" }
L8_app           = { use = "domain objects",                 example = "order { items, total, customer }" }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3b UNION — Sum Type Validation [UNION]
# ───────────────────────────────────────────────────────────────────────────────

[structural.union]
name             = "union"
description      = "Validate union composition — tagged sum type, exactly one variant active"
source_type      = "composition.toml [union]"
category         = "sum"

[structural.union.rule]
type             = "sum"
require_tag      = true                                      # Discriminator must be present
exactly_one      = true                                      # Exactly one variant active
check_variant    = true                                      # Variant matches declared type
exhaustive       = false                                     # Match doesn't require all variants

[structural.union.rule.variant_checks]
tag_present      = "discriminator field must exist"
tag_valid        = "discriminator must name declared variant"
value_typed      = "value must match variant's declared type"
single_active    = "only one variant can be active"

[structural.union.error]
code             = "UNION_VIOLATION"
severity         = "error"
message          = "Union validation failed"

[structural.union.error.no_discriminator]
code             = "MISSING_DISCRIMINATOR"
message_template = "Union '{union}' missing discriminator tag — cannot determine active variant"

[structural.union.error.invalid_variant]
code             = "INVALID_VARIANT"
message_template = "Unknown variant '{variant}' in union '{union}' — valid variants: {valid_list}"

[structural.union.error.type_mismatch]
code             = "VARIANT_TYPE_MISMATCH"
message_template = "Variant '{variant}' in union '{union}': expected {expected}, got {actual}"

[structural.union.error.multiple_active]
code             = "MULTIPLE_ACTIVE_VARIANTS"
message_template = "Union '{union}' has multiple active variants — sum types allow exactly one"

[structural.union.omnicode]
declare          = "let result be union { ok: int9, err: text }"
check            = "{value} is valid union"
match            = "match {union} with ok -> handle_ok, err -> handle_err"
tag_access       = "get variant of {union}"
construct        = "create union result as ok(42)"

[structural.union.cpisi]
valid_meaning    = "Exactly one variant active with correct type — sum is coherent"
invalid_meaning  = "No variant, wrong variant, or type mismatch — sum is broken"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "branching"
weight           = "varies"                                  # Depends on active variant complexity
genesis_parallel = "Light or darkness, not both — separation of states"

[structural.union.types]
c_validator      = "bool validate_union(const TaggedUnion* u, const UnionSchema* schema) { /* tag + value check */ }"
go_validator     = "func ValidateUnion(v any, schema UnionSchema) error { /* interface assertion */ }"
rust_validator   = "fn validate_union<T: UnionValidate>(v: &T, schema: &UnionSchema) -> Result<(), ValidationError>"
c_repr           = "struct { int tag; union { ... } value; }"
go_repr          = "interface{} with type switch"
rust_repr        = "enum { Variant1(T1), Variant2(T2), ... }"

[structural.union.scales]
description      = "union validation at each architectural layer"
L0_kernel        = { use = "result types",                   example = "result { ok: value, err: code }" }
L1_system        = { use = "syscall returns",                example = "syscall_result { data | error }" }
L2_runtime       = { use = "response variants",              example = "response { success | failure }" }
L3_framework     = { use = "option types",                   example = "maybe { some: T | none }" }
L4_health        = { use = "health outcomes",                example = "check_result { pass | warn | fail }" }
L5_network       = { use = "message types",                  example = "packet { request | response }" }
L6_storage       = { use = "record variants",                example = "entry { file | directory }" }
L7_engine        = { use = "state branches",                 example = "transition { advance | retreat | hold }" }
L8_app           = { use = "domain variants",                example = "payment { card | bank | crypto }" }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3c LIST — Homogeneous Sequence Validation [LIST]
# ───────────────────────────────────────────────────────────────────────────────

[structural.list]
name             = "list"
description      = "Validate list composition — homogeneous sequence, all elements same type"
source_type      = "composition.toml [list]"
category         = "sequence"

[structural.list.rule]
type             = "sequence"
homogeneous      = true                                      # All elements must match declared type
ordered          = true                                      # Index matters
check_elements   = true                                      # Validate each element
check_length     = true                                      # Optional length constraints

[structural.list.rule.element_checks]
type_match       = "every element must match declared element type"
nested_validate  = "recursively validate element if composite"
index_bounds     = "index must be in [0, length)"
null_handling    = "null elements according to nullability setting"

[structural.list.rule.length_constraints]
min_length       = "list length >= min if specified"
max_length       = "list length <= max if specified"
exact_length     = "list length == exact if specified"
power_of_3       = "optional: length is power of 3 (ternary-aligned)"

[structural.list.error]
code             = "LIST_VIOLATION"
severity         = "error"
message          = "List validation failed"

[structural.list.error.element_type]
code             = "LIST_ELEMENT_TYPE_MISMATCH"
message_template = "List element at index {index}: expected {expected}, got {actual}"

[structural.list.error.length_min]
code             = "LIST_TOO_SHORT"
message_template = "List has {actual} elements, minimum required is {min}"

[structural.list.error.length_max]
code             = "LIST_TOO_LONG"
message_template = "List has {actual} elements, maximum allowed is {max}"

[structural.list.error.null_element]
code             = "LIST_NULL_ELEMENT"
message_template = "List element at index {index} is null — non-nullable list"

[structural.list.error.index_bounds]
code             = "LIST_INDEX_OUT_OF_BOUNDS"
message_template = "Index {index} out of bounds for list of length {length}"

[structural.list.omnicode]
declare          = "let numbers be list of int9"
declare_bounded  = "let items be list of text (min 1, max 27)"
check            = "{value} is valid list of {type}"
element_access   = "get element {index} from {list}"
length           = "length of {list}"
construct        = "create list [ 1, 2, 3 ] of int9"
append           = "append {value} to {list}"

[structural.list.cpisi]
valid_meaning    = "All elements typed correctly, length in bounds — sequence is coherent"
invalid_meaning  = "Element type mismatch or length violation — sequence broken"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "collection"
weight           = "scales with length"                      # O(n) validation
genesis_parallel = "Ordering of days — numbered sequence of same-nature things"

[structural.list.types]
c_validator      = "bool validate_list(const void* list, size_t len, const TypeSchema* elem_type) { /* iterate */ }"
go_validator     = "func ValidateList(v []any, elemType TypeSchema) error { /* range loop */ }"
rust_validator   = "fn validate_list<T: Validate>(v: &[T], schema: &TypeSchema) -> Result<(), ValidationError>"
c_repr           = "T* with size_t length"
go_repr          = "[]T"
rust_repr        = "Vec<T>"

[structural.list.scales]
description      = "list validation at each architectural layer"
L0_kernel        = { use = "trit arrays",                    example = "flags[27] of trit" }
L1_system        = { use = "syscall arg arrays",             example = "fds[8] of handle" }
L2_runtime       = { use = "stack frames",                   example = "call_stack[] of frame" }
L3_framework     = { use = "config arrays",                  example = "plugins[] of plugin_config" }
L4_health        = { use = "metric series",                  example = "samples[] of measurement" }
L5_network       = { use = "packet buffers",                 example = "messages[] of packet" }
L6_storage       = { use = "record collections",             example = "users[] of user_record" }
L7_engine        = { use = "rule lists",                     example = "transitions[] of rule" }
L8_app           = { use = "domain collections",             example = "cart_items[] of product" }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3d MAP — Key-Value Pair Validation [MAP]
# ───────────────────────────────────────────────────────────────────────────────

[structural.map]
name             = "map"
description      = "Validate map composition — key-value pairs, unique keys"
source_type      = "composition.toml [map]"
category         = "associative"

[structural.map.rule]
type             = "associative"
unique_keys      = true                                      # No duplicate keys
check_key_type   = true                                      # Keys match declared key type
check_val_type   = true                                      # Values match declared value type
ordered          = false                                     # Key order not guaranteed

[structural.map.rule.key_checks]
type_match       = "every key must match declared key type"
hashable         = "keys must be hashable (immutable)"
non_null         = "keys cannot be null"
unique           = "all keys must be distinct"

[structural.map.rule.value_checks]
type_match       = "every value must match declared value type"
nested_validate  = "recursively validate value if composite"
null_handling    = "null values according to nullability setting"

[structural.map.rule.size_constraints]
min_entries      = "map size >= min if specified"
max_entries      = "map size <= max if specified"

[structural.map.error]
code             = "MAP_VIOLATION"
severity         = "error"
message          = "Map validation failed"

[structural.map.error.duplicate_key]
code             = "DUPLICATE_MAP_KEY"
message_template = "Duplicate key '{key}' in map — keys must be unique"

[structural.map.error.key_type]
code             = "MAP_KEY_TYPE_MISMATCH"
message_template = "Map key '{key}': expected {expected}, got {actual}"

[structural.map.error.value_type]
code             = "MAP_VALUE_TYPE_MISMATCH"
message_template = "Map value at key '{key}': expected {expected}, got {actual}"

[structural.map.error.null_key]
code             = "MAP_NULL_KEY"
message_template = "Map keys cannot be null"

[structural.map.error.size_min]
code             = "MAP_TOO_FEW_ENTRIES"
message_template = "Map has {actual} entries, minimum required is {min}"

[structural.map.error.size_max]
code             = "MAP_TOO_MANY_ENTRIES"
message_template = "Map has {actual} entries, maximum allowed is {max}"

[structural.map.omnicode]
declare          = "let lookup be map of text to int9"
declare_bounded  = "let cache be map of text to int9 (max 243)"
check            = "{value} is valid map of {key_type} to {value_type}"
get              = "get {key} from {map}"
set              = "set {key} in {map} to {value}"
has              = "{map} contains key {key}"
keys             = "keys of {map}"
values           = "values of {map}"
construct        = "create map { \"a\" = 1, \"b\" = 2 } of text to int9"

[structural.map.cpisi]
valid_meaning    = "All keys unique and typed, all values typed — association is coherent"
invalid_meaning  = "Duplicate key, type mismatch, or constraint violation — association broken"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "association"
weight           = "scales with entry count"                 # O(n) validation
genesis_parallel = "Naming of creation — distinct names mapping to distinct things"

[structural.map.types]
c_validator      = "bool validate_map(const Map* m, const TypeSchema* key_type, const TypeSchema* val_type)"
go_validator     = "func ValidateMap(v map[any]any, keyType, valType TypeSchema) error"
rust_validator   = "fn validate_map<K: Validate + Hash, V: Validate>(m: &HashMap<K, V>, schema: &MapSchema) -> Result<(), ValidationError>"
c_repr           = "custom hash table or tree map"
go_repr          = "map[K]V"
rust_repr        = "HashMap<K, V> or BTreeMap<K, V>"

[structural.map.scales]
description      = "map validation at each architectural layer"
L0_kernel        = { use = "symbol tables",                  example = "syscall_table: map[int9 -> func_ptr]" }
L1_system        = { use = "resource mappings",              example = "fd_table: map[handle -> resource]" }
L2_runtime       = { use = "object caches",                  example = "session_cache: map[id -> session]" }
L3_framework     = { use = "config lookups",                 example = "settings: map[key -> value]" }
L4_health        = { use = "metric lookups",                 example = "health_checks: map[name -> status]" }
L5_network       = { use = "routing tables",                 example = "routes: map[address -> next_hop]" }
L6_storage       = { use = "index structures",               example = "user_index: map[email -> record]" }
L7_engine        = { use = "state lookup",                   example = "state_map: map[input -> next_state]" }
L8_app           = { use = "domain dictionaries",            example = "products: map[sku -> product]" }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3e TUPLE — Fixed-Size Heterogeneous Sequence Validation [TUPLE]
# ───────────────────────────────────────────────────────────────────────────────

[structural.tuple]
name             = "tuple"
description      = "Validate tuple composition — fixed-size heterogeneous sequence, position-typed"
source_type      = "composition.toml [tuple]"
category         = "product"

[structural.tuple.rule]
type             = "product"
fixed_size       = true                                      # Size determined at declaration
heterogeneous    = true                                      # Different types per position
positional       = true                                      # Access by index, type by position
ordered          = true                                      # Index order matters

[structural.tuple.rule.element_checks]
count_exact      = "tuple must have exactly declared number of elements"
position_typed   = "element at position N must match type N in declaration"
nested_validate  = "recursively validate element if composite"

[structural.tuple.error]
code             = "TUPLE_VIOLATION"
severity         = "error"
message          = "Tuple validation failed"

[structural.tuple.error.wrong_size]
code             = "TUPLE_WRONG_SIZE"
message_template = "Tuple expected {expected} elements, got {actual}"

[structural.tuple.error.position_type]
code             = "TUPLE_POSITION_TYPE_MISMATCH"
message_template = "Tuple element at position {position}: expected {expected}, got {actual}"

[structural.tuple.error.null_element]
code             = "TUPLE_NULL_ELEMENT"
message_template = "Tuple element at position {position} is null — non-nullable tuple"

[structural.tuple.omnicode]
declare          = "let point be tuple of (int9, int9)"
declare_named    = "let record be tuple of (name: text, age: uint9, active: bool3)"
check            = "{value} is valid tuple of ({types})"
element_access   = "get element {position} from {tuple}"
destruct         = "let (x, y) be {tuple}"
construct        = "create tuple (42, \"hello\", true)"

[structural.tuple.cpisi]
valid_meaning    = "All positions filled with correct types — fixed product is complete"
invalid_meaning  = "Wrong count or position type mismatch — fixed product broken"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "coordinate"
weight           = "fixed"                                   # O(n) where n is tuple arity
genesis_parallel = "Paired creation — things that go together by design"

[structural.tuple.types]
c_validator      = "bool validate_tuple(const void* t, const TypeSchema** elem_types, size_t arity)"
go_validator     = "func ValidateTuple(v []any, elemTypes []TypeSchema) error"
rust_validator   = "fn validate_tuple<T: TupleValidate>(v: &T, schema: &TupleSchema) -> Result<(), ValidationError>"
c_repr           = "struct { T0 _0; T1 _1; ... }"
go_repr          = "custom struct or []any with type assertion"
rust_repr        = "(T0, T1, ...)"

[structural.tuple.scales]
description      = "tuple validation at each architectural layer"
L0_kernel        = { use = "coordinate pairs",               example = "(x: int9, y: int9)" }
L1_system        = { use = "syscall pairs",                  example = "(result: int9, errno: uint9)" }
L2_runtime       = { use = "function returns",               example = "(value: T, error: E)" }
L3_framework     = { use = "config pairs",                   example = "(key: text, value: text)" }
L4_health        = { use = "metric pairs",                   example = "(score: uint9, timestamp: int27)" }
L5_network       = { use = "address tuples",                 example = "(ip: bytes, port: uint9)" }
L6_storage       = { use = "key-value pairs",                example = "(key: bytes, offset: int27)" }
L7_engine        = { use = "state pairs",                    example = "(state: uint9, data: int27)" }
L8_app           = { use = "domain pairs",                   example = "(id: text, name: text)" }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.3f BYTES — Raw Binary Data Validation [BYTES]
# ───────────────────────────────────────────────────────────────────────────────

[structural.bytes]
name             = "bytes"
description      = "Validate bytes composition — raw binary data, length-constrained"
source_type      = "composition.toml [bytes]"
category         = "binary"

[structural.bytes.rule]
type             = "binary"
raw              = true                                      # No encoding assumption
length_checked   = true                                      # Size constraints apply
alignment        = "optional"                                # Memory alignment if needed
encoding         = "none"                                    # Raw bytes, not text

[structural.bytes.rule.size_constraints]
min_length       = "bytes length >= min if specified"
max_length       = "bytes length <= max if specified"
exact_length     = "bytes length == exact if specified"
multiple_of      = "bytes length multiple of N if specified (alignment)"
power_of_3       = "optional: length is power of 3 (ternary-aligned)"

[structural.bytes.error]
code             = "BYTES_VIOLATION"
severity         = "error"
message          = "Bytes validation failed"

[structural.bytes.error.length_min]
code             = "BYTES_TOO_SHORT"
message_template = "Bytes has {actual} bytes, minimum required is {min}"

[structural.bytes.error.length_max]
code             = "BYTES_TOO_LONG"
message_template = "Bytes has {actual} bytes, maximum allowed is {max}"

[structural.bytes.error.alignment]
code             = "BYTES_MISALIGNED"
message_template = "Bytes length {actual} not multiple of alignment {alignment}"

[structural.bytes.error.null_bytes]
code             = "BYTES_NULL"
message_template = "Bytes value is null — non-nullable bytes"

[structural.bytes.omnicode]
declare          = "let data be bytes"
declare_bounded  = "let hash be bytes (exact 32)"
declare_aligned  = "let block be bytes (multiple of 9)"
check            = "{value} is valid bytes"
length           = "length of {bytes}"
slice            = "slice {bytes} from {start} to {end}"
construct        = "create bytes from [0x00, 0x01, 0x02]"
concat           = "concat {bytes1} with {bytes2}"

[structural.bytes.cpisi]
valid_meaning    = "Binary data within size constraints — raw form is acceptable"
invalid_meaning  = "Size constraint violated — binary exceeds bounds"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "storage"
weight           = "scales with length"                      # O(1) for length check only
genesis_parallel = "Formless matter — raw substance before shaping"

[structural.bytes.types]
c_validator      = "bool validate_bytes(const uint8_t* data, size_t len, const BytesSchema* schema)"
go_validator     = "func ValidateBytes(v []byte, schema BytesSchema) error"
rust_validator   = "fn validate_bytes(v: &[u8], schema: &BytesSchema) -> Result<(), ValidationError>"
c_repr           = "uint8_t*"
go_repr          = "[]byte"
rust_repr        = "Vec<u8> or &[u8]"

[structural.bytes.scales]
description      = "bytes validation at each architectural layer"
L0_kernel        = { use = "raw memory",                     example = "trit_pack[5] for trit5 storage" }
L1_system        = { use = "syscall buffers",                example = "read_buffer[4096]" }
L2_runtime       = { use = "serialized data",                example = "json_bytes[]" }
L3_framework     = { use = "config blobs",                   example = "config_binary[243]" }
L4_health        = { use = "metric snapshots",               example = "health_dump[]" }
L5_network       = { use = "packet payloads",                example = "message_body[1500]" }
L6_storage       = { use = "file content",                   example = "file_data[]" }
L7_engine        = { use = "state snapshots",                example = "checkpoint_data[]" }
L8_app           = { use = "document content",               example = "attachment_bytes[]" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cc.4 SCHEMA — OmniCode File Structure Validation [SCHEMA]
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose: Validate OmniCode document structure — pragma, blocks, metadata.
# Reference: composition.toml [document structure], block-structure.md
# ───────────────────────────────────────────────────────────────────────────────

[schema]
description = "OmniCode document structure validation — pragma, blocks, metadata"
principle   = "Boundaries before content (Genesis 1 - badal) — structure precedes creation"
source      = "composition.toml [document structure]"
categories  = ["pragma", "blocks", "metadata", "boundary"]

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4a PRAGMA — OmniCode Pragma Line Validation [PRAGMA]
# ───────────────────────────────────────────────────────────────────────────────

[schema.pragma]
name             = "pragma"
description      = "Validate OmniCode pragma line — document type declaration"
source_type      = "OmniCode specification"
category         = "declaration"

[schema.pragma.rule]
type             = "pattern"
required         = true                                      # First line must be pragma
position         = "first_line"                              # Must be line 1
pattern          = "^#!omni\\s+(document|template|data|code)\\s+--\\w+$"
valid_types      = ["document", "template", "data", "code"]
valid_formats    = ["md", "adoc", "toml", "jsonc", "go", "c", "rs", "py", "sh"]

[schema.pragma.error]
code             = "INVALID_PRAGMA"
severity         = "error"
message          = "Invalid or missing OmniCode pragma"

[schema.pragma.error.missing]
code             = "MISSING_PRAGMA"
message_template = "File must start with OmniCode pragma, found: '{found}'"

[schema.pragma.error.invalid_type]
code             = "INVALID_PRAGMA_TYPE"
message_template = "Invalid pragma type '{type}'. Valid types: document, template, data, code"

[schema.pragma.error.invalid_format]
code             = "INVALID_PRAGMA_FORMAT"
message_template = "Invalid format '--{format}'. Valid formats: md, adoc, toml, jsonc, go, c, rs, py, sh"

[schema.pragma.omnicode]
check            = "file has valid pragma"
declare          = "document of type {type} in format {format}"
assert           = "assert pragma is {type} --{format}"

[schema.pragma.cpisi]
valid_meaning    = "Document is properly declared — type and format known"
invalid_meaning  = "Document lacks declaration — cannot process reliably"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
role             = "identity"
genesis_parallel = "Let there be light — the first declaration"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4b BLOCKS_3 — 3-Block Structure Validation (Data Files) [3-BLOCK]
# ───────────────────────────────────────────────────────────────────────────────

[schema.blocks_3]
name             = "blocks_3"
description      = "Validate 3-block structure — METADATA → CONTENT → CLOSING"
source_type      = "block-structure.md"
category         = "structure"
applies_to       = "data"                                    # Configs, settings, TOML

[schema.blocks_3.rule]
type             = "sequence"
required_blocks  = ["METADATA", "CONTENT", "CLOSING"]
order_enforced   = true                                      # Must appear in order
allow_extra      = false                                     # No other blocks allowed
block_count      = 3

[schema.blocks_3.error]
code             = "INVALID_3_BLOCK"
severity         = "error"
message          = "3-block structure invalid"

[schema.blocks_3.error.missing_block]
code             = "MISSING_3_BLOCK"
message_template = "Missing required block: {block}. 3-block requires: METADATA, CONTENT, CLOSING"

[schema.blocks_3.error.wrong_order]
code             = "3_BLOCK_ORDER"
message_template = "Block '{found}' at position {pos}. Expected: {expected}. Order: METADATA → CONTENT → CLOSING"

[schema.blocks_3.omnicode]
check            = "file follows 3-block structure"
validate         = "validate data file against 3-block pattern"

[schema.blocks_3.cpisi]
valid_meaning    = "Data file properly structured — identity, content, completion"
invalid_meaning  = "Data structure broken — cannot reliably parse or generate"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4c BLOCKS_4 — 4-Block Structure Validation (Code Files) [4-BLOCK]
# ───────────────────────────────────────────────────────────────────────────────

[schema.blocks_4]
name             = "blocks_4"
description      = "Validate 4-block structure — METADATA → SETUP → BODY → CLOSING"
source_type      = "block-structure.md"
category         = "structure"
applies_to       = "code"                                    # Go, C, Rust, Python, Bash

[schema.blocks_4.rule]
type             = "sequence"
required_blocks  = ["METADATA", "SETUP", "BODY", "CLOSING"]
order_enforced   = true
allow_extra      = false
block_count      = 4

[schema.blocks_4.error]
code             = "INVALID_4_BLOCK"
severity         = "error"
message          = "4-block structure invalid"

[schema.blocks_4.error.missing_block]
code             = "MISSING_4_BLOCK"
message_template = "Missing required block: {block}. 4-block requires: METADATA, SETUP, BODY, CLOSING"

[schema.blocks_4.error.wrong_order]
code             = "4_BLOCK_ORDER"
message_template = "Block '{found}' at position {pos}. Expected: {expected}. Order: METADATA → SETUP → BODY → CLOSING"

[schema.blocks_4.omnicode]
check            = "file follows 4-block structure"
validate         = "validate code file against 4-block pattern"

[schema.blocks_4.cpisi]
valid_meaning    = "Code file properly structured — setup before execution"
invalid_meaning  = "Code structure broken — execution order unreliable"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4d BLOCKS_5 — 5-Block Structure Validation (Documentation) [5-BLOCK]
# ───────────────────────────────────────────────────────────────────────────────

[schema.blocks_5]
name             = "blocks_5"
description      = "Validate 5-block structure — METADATA → HEADER → CONTEXT → CONTENT → FOOTER"
source_type      = "block-structure.md"
category         = "structure"
applies_to       = "document"                                # AsciiDoc, Markdown docs

[schema.blocks_5.rule]
type             = "sequence"
required_blocks  = ["METADATA", "HEADER", "CONTEXT", "CONTENT", "FOOTER"]
order_enforced   = true
allow_extra      = false
block_count      = 5

[schema.blocks_5.error]
code             = "INVALID_5_BLOCK"
severity         = "error"
message          = "5-block structure invalid"

[schema.blocks_5.error.missing_block]
code             = "MISSING_5_BLOCK"
message_template = "Missing required block: {block}. 5-block requires: METADATA, HEADER, CONTEXT, CONTENT, FOOTER"

[schema.blocks_5.error.wrong_order]
code             = "5_BLOCK_ORDER"
message_template = "Block '{found}' at position {pos}. Expected: {expected}. Order: METADATA → HEADER → CONTEXT → CONTENT → FOOTER"

[schema.blocks_5.omnicode]
check            = "file follows 5-block structure"
validate         = "validate documentation against 5-block pattern"

[schema.blocks_5.cpisi]
valid_meaning    = "Documentation properly structured — reader can navigate"
invalid_meaning  = "Documentation structure broken — reader lost"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4e BLOCK_BOUNDARY — Block Marker Validation [BOUNDARY]
# ───────────────────────────────────────────────────────────────────────────────

[schema.block_boundary]
name             = "block_boundary"
description      = "Validate block boundary markers — visual separation"
source_type      = "block-structure.md"
category         = "boundary"

[schema.block_boundary.rule]
type             = "pattern"
start_pattern    = "^[#/]\\s*={76,}$"                        # 76+ equals signs
end_pattern      = "^[#/]\\s*END\\s+\\w+$"                   # END BLOCK_NAME
comment_prefix   = ["#", "//", "/*"]                         # Language-appropriate

[schema.block_boundary.error]
code             = "INVALID_BLOCK_BOUNDARY"
severity         = "warning"                                 # Not fatal, but indicates drift
message          = "Block boundary marker invalid"
message_template = "Invalid boundary at line {line}: '{found}'. Expected: {expected}"

[schema.block_boundary.omnicode]
check            = "block has valid boundaries"
validate         = "validate block markers"

[schema.block_boundary.cpisi]
valid_meaning    = "Boundaries are clear — separation honored"
invalid_meaning  = "Boundaries unclear — structure may drift"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
genesis_parallel = "Separation of light from darkness — badal"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4f METADATA — Metadata Field Validation [METADATA]
# ───────────────────────────────────────────────────────────────────────────────

[schema.metadata]
name             = "metadata"
description      = "Validate METADATA block required fields"
source_type      = "block-structure.md"
category         = "identity"

[schema.metadata.rule]
type             = "field_presence"
required_fields  = ["key", "title", "version", "created"]
optional_fields  = ["updated", "authors", "status", "purpose", "derives_from"]
field_types      = { key = "text", title = "text", version = "text", created = "date" }

[schema.metadata.error]
code             = "METADATA_VIOLATION"
severity         = "error"
message          = "METADATA validation failed"

[schema.metadata.error.missing_field]
code             = "MISSING_METADATA_FIELD"
message_template = "Required metadata field '{field}' is missing"

[schema.metadata.error.invalid_field_type]
code             = "INVALID_METADATA_TYPE"
message_template = "Metadata field '{field}': expected {expected}, got {actual}"

[schema.metadata.omnicode]
check            = "metadata has required fields"
validate         = "validate metadata block against schema"

[schema.metadata.cpisi]
valid_meaning    = "Document has identity — knows what it is"
invalid_meaning  = "Document lacks identity — cannot be properly cataloged"
ternary_result   = { valid = 1, unknown = 0, invalid = -1 }
genesis_parallel = "And God called... — naming gives identity"

[schema.scales]
description      = "schema validation at each architectural layer"
L0_kernel        = { use = "config file structure",          example = "config.toml 3-block" }
L1_system        = { use = "system config validation",       example = "service.toml structure" }
L2_runtime       = { use = "runtime config",                 example = "session config files" }
L3_framework     = { use = "app config structure",           example = "settings.toml layout" }
L4_health        = { use = "health config",                  example = "health.toml format" }
L5_network       = { use = "protocol config",                example = "endpoints.toml" }
L6_storage       = { use = "storage config",                 example = "database.toml" }
L7_engine        = { use = "engine config",                  example = "rules.toml structure" }
L8_app           = { use = "app documentation",              example = "README.md 5-block" }


# ═══════════════════════════════════════════════════════════════════════════════
# Co — OPERATIONS: Validation System Behavior
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose: Define HOW validation operates — error handling, modes, execution flow.
# Pattern: Co.1 (ERROR) → Co.2 (MODES)
# ───────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# Co.1 ERROR — Validation Error System [ERROR]
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose: Define error severity, formatting, and aggregation behavior.
# Pattern: DAR (Detect → Assess → Recover) applied to validation errors.
# Reference: error-system.toml [DAR phases]
# ───────────────────────────────────────────────────────────────────────────────

[error]
description = "Validation error handling system — detect, assess, recover"
principle   = "Grace for finite beings (Prov 24:16) — errors are learning opportunities"
source      = "error-system.toml"

# ───────────────────────────────────────────────────────────────────────────────
# Co.1a SEVERITY — Error Severity Levels [SEVERITY]
# ───────────────────────────────────────────────────────────────────────────────

[error.severity]
name             = "severity"
description      = "Error severity levels — triage validation results"
levels           = ["error", "warning", "info"]
default_level    = "error"

[error.severity.error]
name             = "error"
description      = "Validation FAILED — must be fixed before proceeding"
code             = "ERROR"
value            = -1                                        # Ternary: invalid
blocks_operation = true                                      # Halts processing
exit_code        = 1
color            = "red"
icon             = "✗"
action           = "fix_required"

[error.severity.error.omnicode]
check            = "is error severity"
report           = "report error: {message}"
handle           = "on error {code} do {action}"

[error.severity.error.cpisi]
meaning          = "Contract violated — value does not match specification"
response         = "HALT until corrected"
ternary_result   = -1

[error.severity.warning]
name             = "warning"
description      = "Validation PASSED with concerns — review recommended"
code             = "WARNING"
value            = 0                                         # Ternary: unknown/neutral
blocks_operation = false                                     # Continues processing
exit_code        = 0
color            = "yellow"
icon             = "⚠"
action           = "review_recommended"

[error.severity.warning.omnicode]
check            = "is warning severity"
report           = "report warning: {message}"
handle           = "on warning {code} do {action}"

[error.severity.warning.cpisi]
meaning          = "Technically valid but may indicate drift or concern"
response         = "Continue with awareness"
ternary_result   = 0

[error.severity.info]
name             = "info"
description      = "Informational — no action required"
code             = "INFO"
value            = 1                                         # Ternary: valid/positive
blocks_operation = false
exit_code        = 0
color            = "blue"
icon             = "ℹ"
action           = "none"

[error.severity.info.omnicode]
check            = "is info severity"
report           = "report info: {message}"

[error.severity.info.cpisi]
meaning          = "Additional context for understanding"
response         = "Note for reference"
ternary_result   = 1

# ───────────────────────────────────────────────────────────────────────────────
# Co.1b FORMAT — Error Message Formatting [FORMAT]
# ───────────────────────────────────────────────────────────────────────────────

[error.format]
name             = "format"
description      = "How validation errors are displayed to users"

[error.format.structure]
pattern          = "[{severity}] {file}:{line}:{col}: {code} - {message}"
include_location = true                                      # File, line, column
include_expected = true                                      # What was expected
include_actual   = true                                      # What was found
include_suggest  = true                                      # How to fix

[error.format.components]
severity         = "ERROR|WARNING|INFO"
file             = "path/to/file.ext"
line             = "1-based line number"
col              = "1-based column number"
code             = "VALIDATION_ERROR_CODE"
message          = "Human-readable explanation"

[error.format.example]
full             = "[ERROR] config.toml:42:5: INVALID_INT9 - Value 10000 exceeds int9 range [-9841, 9841]"
minimal          = "INVALID_INT9: Value out of range"

[error.format.omnicode]
format           = "format error as {pattern}"
include          = "include {component} in error"

[error.format.cpisi]
purpose          = "Clear communication enables effective correction"
principle        = "Tell the truth plainly — don't hide the problem"

# ───────────────────────────────────────────────────────────────────────────────
# Co.1c AGGREGATION — Multiple Error Handling [AGGREGATION]
# ───────────────────────────────────────────────────────────────────────────────

[error.aggregation]
name             = "aggregation"
description      = "How multiple validation errors are collected and reported"

[error.aggregation.behavior]
fail_fast        = false                                     # Collect all errors first
max_errors       = 100                                       # Stop after 100 errors
group_by_file    = true                                      # Group errors by source file
sort_by_severity = true                                      # Errors before warnings

[error.aggregation.limits]
max_per_file     = 50                                        # Max errors per file
max_per_type     = 20                                        # Max of same error type
truncate_after   = 100                                       # "...and N more"

[error.aggregation.omnicode]
collect          = "collect errors until {condition}"
report_all       = "report all collected errors"
group            = "group errors by {field}"

[error.aggregation.cpisi]
purpose          = "Show full picture of validation state"
principle        = "Don't stop at first problem — reveal the scope"

[error.scales]
description      = "error handling at each architectural layer"
L0_kernel        = { use = "kernel panic/assert",            example = "ASSERT(trit_valid(t))" }
L1_system        = { use = "syscall error return",           example = "return -EINVAL" }
L2_runtime       = { use = "exception/error values",         example = "return Err(...)" }
L3_framework     = { use = "validation result types",        example = "ValidationResult{errors}" }
L4_health        = { use = "health check failures",          example = "HealthStatus::Unhealthy" }
L5_network       = { use = "protocol error responses",       example = "400 Bad Request" }
L6_storage       = { use = "persistence errors",             example = "WriteError::InvalidFormat" }
L7_engine        = { use = "rule violations",                example = "RuleViolation{rule, value}" }
L8_app           = { use = "user-facing errors",             example = "Please enter valid email" }


# ═══════════════════════════════════════════════════════════════════════════════
# Co.2 MODES — Validation Timing and Strictness [MODES]
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose: Define WHEN validation runs and HOW strict it is.
# Pattern: Look Before You Leap — validate at appropriate times.
# Reference: code-quality.md [error handling philosophy]
# ───────────────────────────────────────────────────────────────────────────────

[modes]
description = "Validation modes — when and how strictly to validate"
principle   = "Validate at system boundaries, trust internal code"
source      = "code-quality.md"

# ───────────────────────────────────────────────────────────────────────────────
# Co.2a COMPILE_TIME — Static Validation [COMPILE]
# ───────────────────────────────────────────────────────────────────────────────

[modes.compile_time]
name             = "compile_time"
description      = "Validation during compilation — catch errors early"
phase            = "compile"
enabled          = true
strict           = true                                      # No tolerance

[modes.compile_time.checks]
primitive        = true                                      # Type validity
constraint       = true                                      # Range, pattern
structural       = true                                      # Composition
schema           = true                                      # Document structure

[modes.compile_time.behavior]
fail_on_error    = true                                      # Stop compilation
fail_on_warning  = false                                     # Warnings don't stop
report_all       = true                                      # Show all issues

[modes.compile_time.omnicode]
declare          = "validate at compile time"
check            = "compile-time check {value} as {type}"

[modes.compile_time.cpisi]
purpose          = "Catch errors before runtime — measure twice, cut once"
principle        = "Early detection prevents costly fixes later"

# ───────────────────────────────────────────────────────────────────────────────
# Co.2b RUNTIME — Dynamic Validation [RUNTIME]
# ───────────────────────────────────────────────────────────────────────────────

[modes.runtime]
name             = "runtime"
description      = "Validation during execution — handle dynamic values"
phase            = "runtime"
enabled          = true
strict           = false                                     # May allow recovery

[modes.runtime.checks]
primitive        = true                                      # Type validity
constraint       = true                                      # Range, pattern
structural       = false                                     # Too expensive at runtime
schema           = false                                     # Already validated at parse

[modes.runtime.behavior]
fail_on_error    = false                                     # Allow error handling
recoverable      = true                                      # Errors can be caught
report_immediate = true                                      # Report as they occur

[modes.runtime.omnicode]
declare          = "validate at runtime"
check            = "runtime check {value} as {type}"
guard            = "guard {type} {value} else {handler}"

[modes.runtime.cpisi]
purpose          = "Validate dynamic values — user input, computed results"
principle        = "Trust but verify — especially at boundaries"

# ───────────────────────────────────────────────────────────────────────────────
# Co.2c PARSE_TIME — Parsing Validation [PARSE]
# ───────────────────────────────────────────────────────────────────────────────

[modes.parse_time]
name             = "parse_time"
description      = "Validation during parsing — ensure well-formed input"
phase            = "parse"
enabled          = true
strict           = true                                      # Malformed = rejected

[modes.parse_time.checks]
primitive        = true                                      # Literal validity
constraint       = false                                     # Deferred to compile
structural       = false                                     # Deferred to compile
schema           = true                                      # Document structure

[modes.parse_time.behavior]
fail_on_error    = true                                      # Can't parse garbage
report_context   = true                                      # Show surrounding text

[modes.parse_time.omnicode]
declare          = "validate at parse time"
check            = "parse {input} as {type}"

[modes.parse_time.cpisi]
purpose          = "Ensure input is syntactically valid before processing"
principle        = "Garbage in, garbage out — stop garbage early"

# ───────────────────────────────────────────────────────────────────────────────
# Co.2d BOUNDARY — System Boundary Validation [BOUNDARY]
# ───────────────────────────────────────────────────────────────────────────────

[modes.boundary]
name             = "boundary"
description      = "Validation at system boundaries — API, file I/O, network"
phase            = "boundary"
enabled          = true
strict           = true                                      # Never trust external

[modes.boundary.checks]
primitive        = true                                      # Type validity
constraint       = true                                      # Full constraint check
structural       = true                                      # Structure verification
schema           = false                                     # Already in expected format

[modes.boundary.behavior]
fail_on_error    = true                                      # Reject invalid input
sanitize         = true                                      # Clean input before use
log_violations   = true                                      # Record for analysis

[modes.boundary.omnicode]
declare          = "validate at boundary"
check            = "boundary check {value} from {source}"
sanitize         = "sanitize {input} before use"

[modes.boundary.cpisi]
purpose          = "Never trust external data — always validate at edges"
principle        = "System boundaries are trust boundaries"
genesis_parallel = "Firmament separating waters — clear boundaries"

[modes.scales]
description      = "validation modes at each architectural layer"
L0_kernel        = { use = "boot-time validation",           example = "hardware config check" }
L1_system        = { use = "syscall parameter check",        example = "validate fd before use" }
L2_runtime       = { use = "function preconditions",         example = "assert params valid" }
L3_framework     = { use = "request validation",             example = "validate API payload" }
L4_health        = { use = "health check validation",        example = "validate metric values" }
L5_network       = { use = "protocol validation",            example = "validate packet format" }
L6_storage       = { use = "persistence validation",         example = "validate before write" }
L7_engine        = { use = "rule input validation",          example = "validate state input" }
L8_app           = { use = "user input validation",          example = "validate form data" }


