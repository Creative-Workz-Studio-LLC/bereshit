# X.5 NOTE — Final Guidance [NOTE]
# ───────────────────────────────────────────────────────────────────────────────
#
# VALIDATION: THE GATEKEEPERS OF TRUTH
#
# Validation is truth enforcement. These rules define what it means for data to
# be "correct" — they are the gatekeepers at every boundary. Invalid data caught
# here never corrupts the system.
#
# The validation system embodies vigilance:
#
#   - Primitive validation catches type errors early (foundations must be sound)
#   - Constraint validation enforces business rules (boundaries must hold)
#   - Schema validation ensures structural integrity (structure precedes content)
#   - Boundary validation protects system integrity (never trust external data)
#
# Dependencies flow upward:
#
#   ternary.toml → primitives.toml → composition.toml → validation.toml
#                                                        ↑ YOU ARE HERE
#                                                        ↓
#                                                   parsers/compilers
#
# Changes here affect what passes through. This is the gatekeeper.
#
# ───────────────────────────────────────────────────────────────────────────────
#
# "Prove all things; hold fast that which is good."
# — 1 Thessalonians 5:21 KJV
#
