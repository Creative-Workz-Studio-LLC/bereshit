#   tomlv validation.toml
#
#   # Full validation with custom validator
#   ./tools/validate-toml validation.toml --schema=validation.schema

# Validator Quick Reference:
#
#   | Category   | Validators                                              |
#   |------------|---------------------------------------------------------|
#   | Primitive  | trit, trit5, int9, uint9, int27, uint27, text, bool3    |
#   | Constraint | range, pattern, enum, length, unique, foreign_key, ...  |
#   | Structural | struct, union, list, map, tuple, bytes                  |
#   | Schema     | pragma, blocks_3, blocks_4, blocks_5, metadata          |

# Error Code Format:
#
#   {TYPE}_{ERROR}
#   Examples: TRIT_INVALID, RANGE_EXCEEDED, STRUCT_MISSING_FIELD

# Go Integration Example:
#
#   import "github.com/bereshit/libtrit/pkg/validation"
#
#   type Validator struct {
#       Type        string `toml:"type"`
#       ErrorCode   string `toml:"error_code"`
#       Description string `toml:"description"`
#   }
#
#   validators, err := validation.LoadValidators("validation.toml")

# C Integration Example:
#
#   #include "trit/validation.gen.h"
#
#   trit_result_t result = validate_trit(value);
#   if (result.error != TRIT_OK) {
#       handle_error(result.error_code);
#   }

