# Co — Content Operations

# Cc.1 COMPOSITION — Product and Sum Types [COMPOSITION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For as the body is one, and hath many members, and all the members of that
#  one body, being many, are one body: so also is Christ." — 1 Corinthians 12:12 KJV
#
# THE GRAMMAR OF TYPE COMBINATION
#
# Composition is how primitives become meaningful structures. Just as the body
# has many members yet is one body, composite types gather many fields into
# one coherent type. This is the "gathering of waters" — many into one.
#
# KEY INSIGHT (from primitives.toml):
#   Primitives are ATOMS — composition creates MOLECULES
#   struct:   "many members, one body" (1 Cor 12:12) — product type
#   union:    "choose this day" (Deut 30:19) — sum type
#   tuple:    "ordered sequence" — positional product
#   bytes:    "raw substance" — binary bridge
#   rational: "just weights" (Prov 16:11) — exact fractions
#   complex:  "two great lights" (Gen 1:16) — real + imaginary
#
# THREE COMPOSITION STRATEGIES:
#   Product Types: ALL fields present (struct, tuple)
#   Sum Types: ONE variant active (union)
#   Collection Types: MANY elements of same type (bytes from list<uint8>)
#
# THE BODY PRINCIPLE:
#   Many members  | Composition | One body
#   Individual    | This layer  | Unified
#   Parts         | Grammar     | Whole
#
# TERNARY ALIGNMENT:
#   struct   = +1 (expansion, gathering, building up)
#   tuple    =  0 (neutral, positional, ordered)
#   union    = -1 (restriction, choice, one of many)
#   rational =  0 (exact, balanced representation)
#   complex  = +1 (expansion, extends real numbers)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register structs, CPU state, flag unions
#   L1 (System):    Syscall args, IPC messages, error unions
#   L2 (Runtime):   Object layout, stack frames, method tables
#   L3 (Framework): Entity schemas, message types, protocol structs
#   L4 (Health):    Health records, status unions, diagnostic tuples
#   L5 (Network):   Packet headers, address structs, payload unions
#   L6 (Storage):   File metadata, index nodes, block structs
#   L7 (Engine):    State machines, rule structs, action unions
#   L8 (App):       User records, domain entities, API responses
#
# Implementation: pkg/core/types/composition.gen.h
# Reference:      primitives.toml [storage], syntax.toml [composition]
#
# ═══════════════════════════════════════════════════════════════════════════════

[composition]
description = "Type composition — gathering many into one coherent type"
principle   = "Many members, one body (1 Cor 12:12)"
kinds       = ["product", "sum", "collection"]

# ───────────────────────────────────────────────────────────────────────────────
# Composition Strategies
# ───────────────────────────────────────────────────────────────────────────────

[composition.strategies]
description = "Three fundamental composition approaches"

# Product: ALL fields present simultaneously
[composition.strategies.product]
name        = "product"
description = "All members present — struct and tuple"
types       = ["struct", "tuple"]
cardinality = "ALL"                              # Every field has a value
storage     = "Sum of member sizes"
example     = "Person with name and age and status"

# Sum: ONE variant active at a time
[composition.strategies.sum]
name        = "sum"
description = "One member active — union"
types       = ["union"]
cardinality = "ONE"                              # Exactly one variant
storage     = "Size of largest variant + discriminator"
example     = "Result of success or failure"

# Collection: MANY elements of same type
[composition.strategies.collection]
name        = "collection"
description = "Many elements of same type — bytes (from list)"
types       = ["bytes"]
cardinality = "MANY"                             # Zero or more elements
storage     = "Length prefix + element storage"
example     = "content as bytes"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.1a STRUCT — Named Product Type [STRUCT]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And God said, Let the waters under the heaven be gathered together unto
#  one place, and let the dry land appear: and it was so." — Genesis 1:9 KJV
#
# The struct gathers many fields into one named type, like waters gathered
# into one place. Each field is named, typed, and accessible by name.
#
# ───────────────────────────────────────────────────────────────────────────────

[struct]
name        = "struct"
description = "Named product type — combines multiple named fields into one type"
kind        = "composition"
strategy    = "product"

# Struct Core Properties
field_ordering         = "declared"              # Fields maintain declaration order
allows_optional_fields = true                    # Fields can be optional<T>
allows_default_values  = true                    # Fields can have defaults
supports_embedding     = true                    # Can embed other structs
visibility_control     = true                    # Fields can be public/private

# Struct Semantic Properties
semantic_meaning       = "gathering"             # Many → one
ternary_value          = 1                       # +1 = expansion, building up
biblical_parallel      = "Genesis 1:9"           # Waters gathered into one

# ───────────────────────────────────────────────────────────────────────────────
# Struct OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[struct.omnicode]
description = "OmniCode syntax for struct declaration and usage"

# Declaration keywords
keywords    = ["let", "be", "with", "and", "as"]

# Declaration pattern
pattern     = "let <Name> be with <field> as <type> and <field> as <type>"

# Field modifiers
modifiers   = ["may be", "must be", "can be void"]

# Examples
[struct.omnicode.examples]
simple      = "let Person be with name as text and age as int27"
optional    = "let Person be with name as text and nickname may be text"
required    = "let Person be with id must be uint27 and name as text"
embedded    = "let Employee be with embed Person and department as text"

# ───────────────────────────────────────────────────────────────────────────────
# Struct CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[struct.cpisi]
description = "Struct semantics in CPI-SI cognitive framework"

# Directional meaning (from building block method)
direction   = ["decompose_down", "hold", "compose_up"]  # -1, 0, +1
# -1: Break struct into individual fields (analysis)
#  0: Hold the struct as a unit (usage)
# +1: Compose fields into struct (synthesis)

# Cognitive weight
weight      = ["light", "balanced", "structured"]
# Creation is structured (planning), usage is balanced, decomposition is light

# Action semantics
action      = ["destructure", "access", "construct"]
# destructure: Break into parts
# access: Use as whole or access fields
# construct: Build from parts

# Genesis 1:9 mapping
genesis     = ["separated_waters", "dry_land", "gathered_waters"]
# separated_waters: Individual fields before gathering
# dry_land: The struct itself (what appears when gathered)
# gathered_waters: The act of composition

# ───────────────────────────────────────────────────────────────────────────────
# Struct Language Representations
# ───────────────────────────────────────────────────────────────────────────────

[struct.types]
description = "Struct representation in target languages"

[struct.types.c]
keyword     = "struct"
syntax      = "struct Name { Type field; ... };"
typedef     = "typedef struct Name { ... } Name;"
access      = "instance.field"
pointer     = "instance->field"

[struct.types.go]
keyword     = "type"
syntax      = "type Name struct { Field Type; ... }"
access      = "instance.Field"
embedding   = "type Child struct { Parent; ... }"

[struct.types.rust]
keyword     = "struct"
syntax      = "struct Name { field: Type, ... }"
access      = "instance.field"
visibility  = "pub field: Type"

# ───────────────────────────────────────────────────────────────────────────────
# Struct Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[struct.scales]
description = "Struct usage at each architectural layer"

L0_kernel    = { name = "RegisterState",  example = "flags, pc, sp",           use = "CPU state capture" }
L1_system    = { name = "SyscallArgs",    example = "call_id, arg1, arg2",     use = "System call params" }
L2_runtime   = { name = "StackFrame",     example = "return_addr, locals",     use = "Call stack entry" }
L3_framework = { name = "EntitySchema",   example = "id, type, attributes",    use = "Domain modeling" }
L4_health    = { name = "HealthRecord",   example = "score, vector, timestamp", use = "Health tracking" }
L5_network   = { name = "PacketHeader",   example = "src, dst, length, type",  use = "Network protocol" }
L6_storage   = { name = "FileMetadata",   example = "name, size, permissions", use = "Filesystem" }
L7_engine    = { name = "RuleStruct",     example = "condition, action, next", use = "State machine" }
L8_app       = { name = "UserRecord",     example = "id, name, email, role",   use = "Application data" }

# ───────────────────────────────────────────────────────────────────────────────
# Struct Storage (references primitives.toml [storage])
# ───────────────────────────────────────────────────────────────────────────────

[struct.storage]
description   = "How struct maps to binary storage"
inherits_from = "primitives.toml [storage]"

# Packed representation
packed        = "Sum of packed member sizes, respecting alignment"
padding       = "May include padding for alignment"
order         = "Fields in declaration order"

# Unpacked representation
unpacked      = "JSON-like object: { field: value, ... }"
format        = "text/json or text/toml"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.1b UNION — Sum Type [UNION]
# ───────────────────────────────────────────────────────────────────────────────
#
# "I call heaven and earth to record this day against you, that I have set
#  before you life and death, blessing and cursing: therefore choose life."
#  — Deuteronomy 30:19 KJV
#
# The union represents choice — a value that can be ONE of several types,
# but only one at a time. Like choosing between life and death, the union
# demands a decision: which variant is active?
#
# ───────────────────────────────────────────────────────────────────────────────

[union]
name        = "union"
description = "Sum type — value can be exactly one of several variant types"
kind        = "composition"
strategy    = "sum"

# Union Core Properties
requires_discriminator    = true                 # Must know which variant is active
variants_exclusive        = true                 # Only one variant at a time
supports_pattern_matching = true                 # Enable exhaustive matching
total_handling_required   = true                 # All variants must be handled

# Union Semantic Properties
semantic_meaning          = "choice"             # One of many
ternary_value             = -1                   # -1 = restriction, selection
biblical_parallel         = "Deuteronomy 30:19" # Choose life or death

# Ternary Alignment for Discriminator
# When 3 variants: discriminator is trit (-1=first, 0=second, +1=third)
# When 2 variants: discriminator is bool3 (false=first, true=second)
discriminator_type        = "trit"               # Uses ternary discriminator

# ───────────────────────────────────────────────────────────────────────────────
# Union OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[union.omnicode]
description = "OmniCode syntax for union declaration and usage"

# Declaration keywords
keywords    = ["of", "or", "as"]

# Declaration pattern
pattern     = "<Name> of <variant> as <type> or <variant> as <type>"

# Matching keywords
matching    = ["when", "is", "otherwise"]

# Examples
[union.omnicode.examples]
simple      = "Result of success as Data or failure as Error"
ternary     = "Direction of backward as int27 or neutral as void or forward as int27"
nested      = "Response of ok as Result or redirect as URI or error as Error"
matching    = "when response is ok then handle success otherwise handle error"

# ───────────────────────────────────────────────────────────────────────────────
# Union CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[union.cpisi]
description = "Union semantics in CPI-SI cognitive framework"

# Directional meaning (from building block method)
direction   = ["first_variant", "neutral_variant", "last_variant"]  # -1, 0, +1
# -1: First variant (often the error/failure case)
#  0: Middle/neutral variant (if exists)
# +1: Last variant (often the success case)

# Cognitive weight
weight      = ["heavy", "balanced", "light"]
# First variant often heavier (error handling), last lighter (success path)

# Action semantics
action      = ["reject", "decide", "accept"]
# reject: Handle error/failure variant
# decide: Pattern match, determine which
# accept: Handle success variant

# Deuteronomy 30:19 mapping
genesis     = ["death_cursing", "choice_moment", "life_blessing"]
# death_cursing: Error/failure variant
# choice_moment: The discriminator check
# life_blessing: Success variant

# ───────────────────────────────────────────────────────────────────────────────
# Union Language Representations
# ───────────────────────────────────────────────────────────────────────────────

[union.types]
description = "Union representation in target languages"

[union.types.c]
keyword     = "union"
syntax      = "union Name { Type variant1; Type variant2; };"
tagged      = "struct { int tag; union { ... } value; };"
access      = "instance.value.variant1"
note        = "C unions are untagged — wrap in struct for safety"

[union.types.go]
keyword     = "interface"
syntax      = "type Name interface { isName() }"
variant     = "type Variant1 struct { ... }; func (Variant1) isName() {}"
access      = "switch v := value.(type) { case Variant1: ... }"
note        = "Go uses interface + type switch for sum types"

[union.types.rust]
keyword     = "enum"
syntax      = "enum Name { Variant1(Type), Variant2(Type) }"
access      = "match value { Name::Variant1(v) => ..., ... }"
exhaustive  = true                               # Compiler enforces all variants

# ───────────────────────────────────────────────────────────────────────────────
# Union Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[union.scales]
description = "Union usage at each architectural layer"

L0_kernel    = { name = "Operand",        example = "register or immediate or memory", use = "ALU input types" }
L1_system    = { name = "SyscallResult",  example = "success or errno",                 use = "Return values" }
L2_runtime   = { name = "Value",          example = "int or float or ref",              use = "Dynamic typing" }
L3_framework = { name = "Message",        example = "request or response or error",     use = "Protocol types" }
L4_health    = { name = "Status",         example = "healthy or degraded or failing",   use = "Health states" }
L5_network   = { name = "Payload",        example = "data or control or heartbeat",     use = "Packet types" }
L6_storage   = { name = "Node",           example = "file or directory or symlink",     use = "FS node types" }
L7_engine    = { name = "Action",         example = "create or update or delete",       use = "CRUD operations" }
L8_app       = { name = "APIResponse",    example = "data or error or redirect",        use = "API results" }

# ───────────────────────────────────────────────────────────────────────────────
# Union Storage (references primitives.toml [storage])
# ───────────────────────────────────────────────────────────────────────────────

[union.storage]
description   = "How union maps to binary storage"
inherits_from = "primitives.toml [storage]"

# Packed representation
packed        = "Size of largest variant (all variants share storage)"
discriminant  = "Tag byte (trit for 3 variants, uint8 for more)"
layout        = "tag + variant_data"

# Unpacked representation
unpacked      = "JSON-like object: { type: 'variant', value: ... }"
format        = "text/json with type discriminator"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.1c TUPLE — Anonymous Product Type [TUPLE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And the evening and the morning were the first day."
#  — Genesis 1:5 KJV
#
# The tuple is an ordered sequence of types, accessed by position, not name.
# Like evening AND morning — both present, in order, making one day.
# The tuple is the struct's anonymous cousin: same structure, no names.
#
# ───────────────────────────────────────────────────────────────────────────────

[tuple]
name        = "tuple"
description = "Anonymous product type — ordered sequence of typed elements"
kind        = "composition"
strategy    = "product"

# Tuple Core Properties
field_ordering = "positional"                    # Access by index (0, 1, 2...)
fixed_length   = true                            # Length known at compile time
heterogeneous  = true                            # Elements can have different types
anonymous      = true                            # No field names, just positions

# Tuple Semantic Properties
semantic_meaning  = "sequence"                   # Ordered, positional
ternary_value     = 0                            # 0 = neutral, balanced
biblical_parallel = "Genesis 1:5"                # Evening and morning = one day

# ───────────────────────────────────────────────────────────────────────────────
# Tuple OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[tuple.omnicode]
description = "OmniCode syntax for tuple declaration and usage"

# Declaration keywords
keywords    = ["tuple", "of", "and"]

# Declaration pattern
pattern     = "tuple of <type> and <type> and <type>"

# Access syntax
access      = "value.0, value.1, value.2"        # Positional access

# Examples
[tuple.omnicode.examples]
simple      = "tuple of text and int27"
triple      = "tuple of text and int27 and bool3"
nested      = "tuple of tuple of int27 and int27 and text"
destructure = "let x and y and z be point"

# ───────────────────────────────────────────────────────────────────────────────
# Tuple CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[tuple.cpisi]
description = "Tuple semantics in CPI-SI cognitive framework"

# Directional meaning (from building block method)
direction   = ["first_element", "middle_elements", "last_element"]  # -1, 0, +1
# -1: First element in sequence
#  0: Middle elements
# +1: Last element in sequence

# Cognitive weight
weight      = ["ordered", "sequential", "positional"]
# All elements equally weighted, order is the meaning

# Action semantics
action      = ["unpack", "access", "pack"]
# unpack: Destructure into parts
# access: Read by position
# pack: Construct from values

# Genesis 1:5 mapping
genesis     = ["evening", "and", "morning"]
# evening: First element
# and: The conjunction (sequence operator)
# morning: Second element → together = one day (the tuple)

# ───────────────────────────────────────────────────────────────────────────────
# Tuple Language Representations
# ───────────────────────────────────────────────────────────────────────────────

[tuple.types]
description = "Tuple representation in target languages"

[tuple.types.c]
keyword     = "struct"
syntax      = "struct { Type _0; Type _1; ... };"
access      = "instance._0"
note        = "C has no native tuple — use anonymous struct"

[tuple.types.go]
keyword     = "struct"
syntax      = "struct { _ Type; _ Type }"
access      = "Not idiomatic in Go — use struct with names"
note        = "Go prefers named structs over tuples"

[tuple.types.rust]
keyword     = "()"
syntax      = "(Type, Type, Type)"
access      = "tuple.0, tuple.1"
native      = true                               # Rust has native tuples

# ───────────────────────────────────────────────────────────────────────────────
# Tuple Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[tuple.scales]
description = "Tuple usage at each architectural layer"

L0_kernel    = { name = "(reg, val)",      example = "register-value pair",       use = "Register ops" }
L1_system    = { name = "(fd, mode)",      example = "file descriptor + mode",    use = "Open calls" }
L2_runtime   = { name = "(ptr, len)",      example = "slice as pointer + length", use = "Fat pointers" }
L3_framework = { name = "(key, val)",      example = "map entry",                 use = "Iteration" }
L4_health    = { name = "(score, time)",   example = "health measurement",        use = "Timestamped data" }
L5_network   = { name = "(addr, port)",    example = "endpoint address",          use = "Socket binding" }
L6_storage   = { name = "(block, offset)", example = "file position",             use = "Seek location" }
L7_engine    = { name = "(state, input)",  example = "transition pair",           use = "State machine" }
L8_app       = { name = "(x, y, z)",       example = "coordinates",               use = "3D positioning" }

# ───────────────────────────────────────────────────────────────────────────────
# Tuple Storage (references primitives.toml [storage])
# ───────────────────────────────────────────────────────────────────────────────

[tuple.storage]
description   = "How tuple maps to binary storage"
inherits_from = "primitives.toml [storage]"

# Packed representation
packed        = "Concatenation of packed element representations"
order         = "Elements in positional order (0, 1, 2...)"
padding       = "May include padding for alignment"

# Unpacked representation
unpacked      = "JSON-like array: [value0, value1, value2]"
format        = "text/json array"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.1d BYTES — Binary Data Type [BYTES]
# ───────────────────────────────────────────────────────────────────────────────
#
# "In the beginning God created the heaven and the earth. And the earth was
#  without form, and void." — Genesis 1:1-2 KJV
#
# Bytes is raw, uninterpreted data — the formless void before structure.
# It is the bridge between ternary logic and binary hardware, the substance
# before meaning is applied. Bytes carries data without knowing what it means.
#
# ───────────────────────────────────────────────────────────────────────────────

[bytes]
name        = "bytes"
description = "Binary data — sequence of uint8 values for raw storage"
kind        = "collection"
strategy    = "collection"

# Bytes Core Properties (references primitives.toml)
element_type      = "uint8"                      # From primitives.toml [uint8]
definition        = "list<uint8>"                # Alias for list of bytes
ordered           = true                         # Bytes maintain order
allows_duplicates = true                         # Same byte can appear multiple times
variable_length   = true                         # Length not fixed at compile time

# Bytes Semantic Properties
semantic_meaning  = "raw_substance"              # Formless, pre-structure
ternary_value     = 0                            # 0 = neutral, foundational
biblical_parallel = "Genesis 1:2"                # Earth without form, void

# Use Cases
use_cases         = ["file_content", "binary_data", "serialization",
                     "network_payload", "encryption", "compression"]

# ───────────────────────────────────────────────────────────────────────────────
# Bytes OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[bytes.omnicode]
description = "OmniCode syntax for bytes declaration and usage"

# Declaration keywords
keywords    = ["as", "bytes"]

# Declaration pattern
pattern     = "<name> as bytes"

# Operations
operations  = ["length", "slice", "concat", "encode", "decode"]

# Examples
[bytes.omnicode.examples]
declare     = "content as bytes"
slice       = "content from 0 to 100"
concat      = "header concat body"
encode      = "encode text as bytes using utf8"
decode      = "decode bytes as text using utf8"

# ───────────────────────────────────────────────────────────────────────────────
# Bytes CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[bytes.cpisi]
description = "Bytes semantics in CPI-SI cognitive framework"

# Directional meaning (from building block method)
direction   = ["decode_up", "raw", "encode_down"]  # -1, 0, +1
# -1: Encode TO bytes (moving toward storage/transmission)
#  0: Raw bytes (the bridge itself)
# +1: Decode FROM bytes (moving toward meaning/structure)

# Cognitive weight
weight      = ["heavy", "grounded", "light"]
# Encoding is heavy (committing to format), decoding is light (extracting)

# Action semantics
action      = ["serialize", "transport", "deserialize"]
# serialize: Structure → bytes
# transport: Bytes in motion (files, network, memory)
# deserialize: Bytes → structure

# Genesis 1:2 mapping
genesis     = ["void", "formless_earth", "structure_emerging"]
# void: Raw, uninterpreted bytes
# formless_earth: Data before meaning applied
# structure_emerging: Bytes being decoded into types

# ───────────────────────────────────────────────────────────────────────────────
# Bytes Language Representations
# ───────────────────────────────────────────────────────────────────────────────

[bytes.types]
description = "Bytes representation in target languages"

[bytes.types.c]
keyword     = "uint8_t*"
syntax      = "uint8_t* data; size_t len;"
struct      = "struct { uint8_t* ptr; size_t len; }"
note        = "C requires explicit length tracking"

[bytes.types.go]
keyword     = "[]byte"
syntax      = "var data []byte"
slice       = true                               # Go slices have len/cap
conversion  = "[]byte(string), string(bytes)"

[bytes.types.rust]
keyword     = "Vec<u8>"
syntax      = "let data: Vec<u8>"
slice       = "&[u8]"                            # Borrowed slice
owned       = "Vec<u8>"                          # Owned vector

# ───────────────────────────────────────────────────────────────────────────────
# Bytes Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[bytes.scales]
description = "Bytes usage at each architectural layer"

L0_kernel    = { name = "register_bytes",  example = "raw register contents",      use = "Hardware I/O" }
L1_system    = { name = "buffer",          example = "I/O buffer, syscall data",   use = "System buffers" }
L2_runtime   = { name = "heap_block",      example = "allocated memory region",    use = "Memory management" }
L3_framework = { name = "wire_format",     example = "serialized protocol data",   use = "Serialization" }
L4_health    = { name = "diagnostic_dump", example = "raw health data export",     use = "Debug dumps" }
L5_network   = { name = "packet_payload",  example = "raw network data",           use = "Wire transfer" }
L6_storage   = { name = "file_content",    example = "raw file bytes",             use = "File I/O" }
L7_engine    = { name = "state_snapshot",  example = "serialized engine state",    use = "Persistence" }
L8_app       = { name = "binary_asset",    example = "images, audio, documents",   use = "Media files" }

# ───────────────────────────────────────────────────────────────────────────────
# Bytes Storage (references primitives.toml [storage])
# ───────────────────────────────────────────────────────────────────────────────

[bytes.storage]
description   = "How bytes maps to binary storage"
inherits_from = "primitives.toml [storage]"

# Packed representation
packed        = "Length prefix (uint9) + raw uint8 sequence"
length_type   = "uint9"                          # From primitives.toml, max 19,682
element_size  = 1                                # 1 byte per element

# Unpacked representation
unpacked      = "Base64 or hex string representation"
base64        = "Standard base64 encoding"
hex           = "Lowercase hex pairs (aa bb cc)"

# Bridge role
bridge_note   = "Bytes is the bridge between ternary logic and binary hardware"
reference     = "See primitives.toml [storage] for binary representation"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.1e RATIONAL — Exact Fraction Type [RATIONAL]
# ───────────────────────────────────────────────────────────────────────────────
#
# "A just weight and balance are the LORD'S: all the weights of the bag are
#  his work." — Proverbs 16:11 KJV
#
# EXACT REPRESENTATION WITHOUT LOSS
#
# Rational numbers are fractions — numerator over denominator. Unlike floats,
# they represent exact values without rounding error. 1/3 is exactly 1/3, not
# 0.333... Like just weights and balances, rationals preserve exactness.
#
# ───────────────────────────────────────────────────────────────────────────────

[rational]
name        = "rational"
description = "Rational number — exact fraction as numerator/denominator pair"
kind        = "composition"
strategy    = "product"

# Rational Core Properties
components    = ["numerator", "denominator"]
numerator     = { type = "int", description = "Top of fraction" }
denominator   = { type = "int", description = "Bottom of fraction, non-zero" }
invariant     = "denominator != 0"
canonical     = "GCD(numerator, denominator) == 1, denominator > 0"

# Rational Semantic Properties
semantic_meaning       = "exact_fraction"
ternary_value          = 0                       # Balanced — exact representation
biblical_parallel      = "Proverbs 16:11"

[rational.omnicode]
keywords    = ["ratio", "fraction", "over", "per"]
pattern     = "<numerator> over <denominator>"
modifiers   = ["reduced", "signed", "unsigned"]
examples    = [
    "1 over 3",
    "ratio of completed to total",
    "22 over 7 as approximate_pi",
]

[rational.cpisi]
direction   = ["underflow", "exact", "overflow"]
weight      = ["reduced", "balanced", "unreduced"]
action      = ["reduce", "represent", "expand"]
genesis     = ["divided", "measured", "multiplied"]

[rational.types.c]
syntax      = "typedef struct { int64_t num; int64_t den; } rational_t;"
operations  = "rational_add, rational_mul, rational_reduce"

[rational.types.go]
syntax      = "type Rational struct { Num, Den int64 }"
package     = "math/big provides big.Rat"

[rational.types.rust]
syntax      = "struct Rational { num: i64, den: i64 }"
crate       = "num-rational crate provides Ratio<T>"

[rational.scales]
L0_kernel    = { name = "ClockRatio",        example = "PLL ratios",                 use = "Clock dividers" }
L1_system    = { name = "ResourceRatio",     example = "CPU time slices",            use = "Scheduling" }
L2_runtime   = { name = "Fraction",          example = "exact arithmetic",           use = "Financial math" }
L3_framework = { name = "Proportion",        example = "aspect ratios",              use = "Layout" }
L4_health    = { name = "Dosage",            example = "mg per kg",                  use = "Medical dosing" }
L5_network   = { name = "Bandwidth",         example = "bits per second",            use = "Rate limiting" }
L6_storage   = { name = "Compression",       example = "ratio before/after",         use = "Compression stats" }
L7_engine    = { name = "TimeScale",         example = "game time / real time",      use = "Time dilation" }
L8_app       = { name = "Progress",          example = "completed / total",          use = "Progress bars" }

[rational.storage]
description   = "Rational storage as two integers"
packed        = "Two consecutive int64 values (16 bytes)"
normalized    = "Always store in reduced form"


# ───────────────────────────────────────────────────────────────────────────────
# Cc.1f COMPLEX — Complex Number Type [COMPLEX]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And God made two great lights; the greater light to rule the day, and the
#  lesser light to rule the night." — Genesis 1:16 KJV
#
# TWO PARTS, ONE NUMBER
#
# Complex numbers have two components — real and imaginary — like the two great
# lights. Neither alone is complete; together they span the complex plane.
# Essential for signal processing, quantum mechanics, and rotation.
#
# ───────────────────────────────────────────────────────────────────────────────

[complex]
name        = "complex"
description = "Complex number — real and imaginary components"
kind        = "composition"
strategy    = "product"

# Complex Core Properties
components    = ["real", "imaginary"]
real          = { type = "float", description = "Real component" }
imaginary     = { type = "float", description = "Imaginary component (coefficient of i)" }
notation      = "a + bi where i² = -1"

# Complex Semantic Properties
semantic_meaning       = "two_dimensional_number"
ternary_value          = 1                       # Expansive — extends real numbers
biblical_parallel      = "Genesis 1:16"

[complex.omnicode]
keywords    = ["complex", "with", "imaginary", "real"]
pattern     = "<real> with imaginary <imaginary>"
modifiers   = ["polar", "rectangular", "conjugate"]
examples    = [
    "3 with imaginary 4",
    "complex from polar magnitude 5 angle 0.927",
]

[complex.cpisi]
direction   = ["contract", "rotate", "expand"]
weight      = ["real_only", "balanced", "imaginary_heavy"]
action      = ["project", "transform", "rotate"]
genesis     = ["day", "night", "twilight"]

[complex.types.c]
syntax      = "typedef struct { double re; double im; } complex_t;"
c99         = "#include <complex.h> provides double _Complex"

[complex.types.go]
syntax      = "complex64, complex128"
builtin     = "complex(re, im), real(c), imag(c)"

[complex.types.rust]
syntax      = "struct Complex { re: f64, im: f64 }"
crate       = "num-complex crate provides Complex<T>"

[complex.scales]
L0_kernel    = { name = "FFTCoeff",          example = "FFT butterfly",              use = "Signal processing" }
L1_system    = { name = "PhaseVector",       example = "AC power analysis",          use = "Electrical systems" }
L2_runtime   = { name = "ComplexNum",        example = "math library",               use = "Scientific computing" }
L3_framework = { name = "Transform",         example = "rotation matrices",          use = "Graphics transforms" }
L4_health    = { name = "BioSignal",         example = "EEG frequency domain",       use = "Signal analysis" }
L5_network   = { name = "Phasor",            example = "modulation/demodulation",    use = "RF processing" }
L6_storage   = { name = "SpectrumData",      example = "frequency domain storage",   use = "Audio/image data" }
L7_engine    = { name = "Quaternion",        example = "rotation (related)",         use = "3D rotation" }
L8_app       = { name = "WaveformData",      example = "audio visualization",        use = "Visualization" }

[complex.storage]
description   = "Complex storage as two floats"
packed        = "Two consecutive float64 values (16 bytes)"
alignment     = 8                                # 8-byte alignment for float64

[complex.operations]
add         = "(a+bi) + (c+di) = (a+c) + (b+d)i"
multiply    = "(a+bi) × (c+di) = (ac-bd) + (ad+bc)i"
conjugate   = "conj(a+bi) = a - bi"
magnitude   = "|a+bi| = sqrt(a² + b²)"
phase       = "arg(a+bi) = atan2(b, a)"



[extensions]
note = "Reserved — no extensions for composite types"

# Cv — Content Validation
[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('composite-types.toml','rb'))\""]

[_validation.schema]
required = ["struct", "union", "tuple", "enum", "complex"]
optional = ["_content", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

