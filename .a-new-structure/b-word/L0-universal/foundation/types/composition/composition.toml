# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURATION (Cc — Type Composition Definitions)
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cc.1 COMPOSITION — Product and Sum Types [COMPOSITION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "For as the body is one, and hath many members, and all the members of that
#  one body, being many, are one body: so also is Christ." — 1 Corinthians 12:12 KJV
#
# THE GRAMMAR OF TYPE COMBINATION
#
# Composition is how primitives become meaningful structures. Just as the body
# has many members yet is one body, composite types gather many fields into
# one coherent type. This is the "gathering of waters" — many into one.
#
# KEY INSIGHT (from primitives.toml):
#   Primitives are ATOMS — composition creates MOLECULES
#   struct:   "many members, one body" (1 Cor 12:12) — product type
#   union:    "choose this day" (Deut 30:19) — sum type
#   tuple:    "ordered sequence" — positional product
#   bytes:    "raw substance" — binary bridge
#   rational: "just weights" (Prov 16:11) — exact fractions
#   complex:  "two great lights" (Gen 1:16) — real + imaginary
#
# THREE COMPOSITION STRATEGIES:
#   Product Types: ALL fields present (struct, tuple)
#   Sum Types: ONE variant active (union)
#   Collection Types: MANY elements of same type (bytes from list<uint8>)
#
# THE BODY PRINCIPLE:
#   Many members  | Composition | One body
#   Individual    | This layer  | Unified
#   Parts         | Grammar     | Whole
#
# TERNARY ALIGNMENT:
#   struct   = +1 (expansion, gathering, building up)
#   tuple    =  0 (neutral, positional, ordered)
#   union    = -1 (restriction, choice, one of many)
#   rational =  0 (exact, balanced representation)
#   complex  = +1 (expansion, extends real numbers)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register structs, CPU state, flag unions
#   L1 (System):    Syscall args, IPC messages, error unions
#   L2 (Runtime):   Object layout, stack frames, method tables
#   L3 (Framework): Entity schemas, message types, protocol structs
#   L4 (Health):    Health records, status unions, diagnostic tuples
#   L5 (Network):   Packet headers, address structs, payload unions
#   L6 (Storage):   File metadata, index nodes, block structs
#   L7 (Engine):    State machines, rule structs, action unions
#   L8 (App):       User records, domain entities, API responses
#
# Implementation: pkg/core/types/composition.gen.h
# Reference:      primitives.toml [storage], syntax.toml [composition]
#
# ═══════════════════════════════════════════════════════════════════════════════

[composition]
description = "Type composition — gathering many into one coherent type"
principle   = "Many members, one body (1 Cor 12:12)"
kinds       = ["product", "sum", "collection"]

# ───────────────────────────────────────────────────────────────────────────────
# Composition Strategies
# ───────────────────────────────────────────────────────────────────────────────

[composition.strategies]
description = "Three fundamental composition approaches"

# Product: ALL fields present simultaneously
[composition.strategies.product]
name        = "product"
description = "All members present — struct and tuple"
types       = ["struct", "tuple"]
cardinality = "ALL"                              # Every field has a value
storage     = "Sum of member sizes"
example     = "Person with name and age and status"

# Sum: ONE variant active at a time
[composition.strategies.sum]
name        = "sum"
description = "One member active — union"
types       = ["union"]
cardinality = "ONE"                              # Exactly one variant
storage     = "Size of largest variant + discriminator"
example     = "Result of success or failure"

# Collection: MANY elements of same type
[composition.strategies.collection]
name        = "collection"
description = "Many elements of same type — bytes (from list)"
types       = ["bytes"]
cardinality = "MANY"                             # Zero or more elements
storage     = "Length prefix + element storage"
example     = "content as bytes"


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.1 BIBLICAL — Theological Patterns [BIBLICAL]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "All scripture is given by inspiration of God, and is profitable for doctrine,
#  for reproof, for correction, for instruction in righteousness." — 2 Tim 3:16
#
# TYPE COMPOSITION AS SCRIPTURAL PATTERN
#
# Each composition concept finds its root in Scripture. This is not retrofitting
# theology onto technology — it's recognizing that God's design patterns in
# creation and revelation manifest in how we naturally structure information.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cv.1a STRUCT — Many Members, One Body [STRUCT_BIBLICAL]
# ───────────────────────────────────────────────────────────────────────────────

[cognition.biblical.struct]
concept      = "struct"
pattern      = "many_members_one_body"
scripture    = "1 Corinthians 12:12-27"
summary      = "The body is one though it has many members"

theological_insight = """
A struct gathers multiple named fields into one cohesive type, just as the body
of Christ gathers many members with different gifts into one unified body.
Each field has its role (eye, hand, foot); none can say to another "I have no
need of thee." The struct is complete only when all its members are present.
"""

application = [
    "Design structs where each field has a clear, necessary role",
    "Don't add fields that serve no purpose — each member matters",
    "Consider which fields are 'vital organs' vs 'auxiliary'",
    "Struct composition mirrors how the church is organized",
]


# ───────────────────────────────────────────────────────────────────────────────
# Cv.1b UNION — Choose This Day [UNION_BIBLICAL]
# ───────────────────────────────────────────────────────────────────────────────

[cognition.biblical.union]
concept      = "union"
pattern      = "choose_this_day"
scripture    = "Deuteronomy 30:19"
summary      = "I have set before you life and death... choose life"

theological_insight = """
A union represents exclusive alternatives — at any moment, only ONE variant is
active. This mirrors the fundamental choice God places before humanity: life or
death, blessing or curse, light or darkness. You cannot serve two masters.
The discriminated union makes the choice explicit and enforces it.
"""

application = [
    "Use unions for states that are mutually exclusive",
    "Make the 'active variant' explicit — no hidden state",
    "Error handling as Result<T, E> — success OR failure, not both",
    "State machines with clear transitions between variants",
]


# ───────────────────────────────────────────────────────────────────────────────
# Cv.1c INHERITANCE — The Genealogies [INHERITANCE_BIBLICAL]
# ───────────────────────────────────────────────────────────────────────────────

[cognition.biblical.inheritance]
concept      = "inheritance"
pattern      = "genealogies"
scripture    = "Genesis 5:1-32, Matthew 1:1-17"
summary      = "Adam begat Seth... Abraham begat Isaac... David begat Solomon"

theological_insight = """
The biblical genealogies show that identity flows through lineage. A child
inherits from parents — not just traits but covenant relationship. Type
inheritance follows this pattern: a derived type inherits from its parent,
receiving all that the parent has, while potentially adding its own nature.
"""

application = [
    "Inheritance should represent genuine 'is-a' relationships",
    "What the parent has, the child has — Liskov substitution",
    "Covenants (interfaces) can be inherited across generations",
    "Prefer composition over inheritance when relationship isn't truly genetic",
]


# ───────────────────────────────────────────────────────────────────────────────
# Cv.1d CONSTRAINTS — Divine Boundaries [CONSTRAINTS_BIBLICAL]
# ───────────────────────────────────────────────────────────────────────────────

[cognition.biblical.constraints]
concept      = "constraints"
pattern      = "divine_boundaries"
scripture    = "Deuteronomy 19:14, Proverbs 22:28"
summary      = "Thou shalt not remove thy neighbour's landmark"

theological_insight = """
God establishes boundaries — between land and sea, between holy and common,
between truth and falsehood. Constraints in types serve the same purpose:
they establish what is valid and what is not. Range constraints say 'this far
and no further.' Pattern constraints define what form is acceptable.
"""

application = [
    "Constraints protect invariants — they're guards, not restrictions",
    "Moving landmarks (removing constraints) leads to corruption",
    "Define boundaries early — it's easier to relax than tighten",
    "Constraints are declarative holiness: 'this is what I accept'",
]


# ───────────────────────────────────────────────────────────────────────────────
# Cv.1e NULLABILITY — Known and Unknown [NULLABILITY_BIBLICAL]
# ───────────────────────────────────────────────────────────────────────────────

[cognition.biblical.nullability]
concept      = "nullability"
pattern      = "known_unknown"
scripture    = "Jeremiah 1:5, 1 Corinthians 13:12"
summary      = "Before I formed thee in the belly I knew thee"

theological_insight = """
God knows all; we know in part. Nullability acknowledges this distinction.
REQUIRED means 'this must be known' — the value is present. OPTIONAL means
'this may or may not be known' — absence is valid. NULLABLE adds explicit
unknown state — we know that we don't know. This maps to epistemology:
certainty, possibility, and acknowledged ignorance.
"""

application = [
    "Use REQUIRED for what must be known at a given point",
    "Use OPTIONAL for what may become known later",
    "Use NULLABLE for explicit 'unknown' distinct from 'absent'",
    "Null checks are epistemological: 'do I know this yet?'",
]


# ───────────────────────────────────────────────────────────────────────────────
# Cv.1f EFFECTS — Sowing and Reaping [EFFECTS_BIBLICAL]
# ───────────────────────────────────────────────────────────────────────────────

[cognition.biblical.effects]
concept      = "effects"
pattern      = "sowing_reaping"
scripture    = "Galatians 6:7-8"
summary      = "Whatsoever a man soweth, that shall he also reap"

theological_insight = """
Actions have consequences. The effect system makes this explicit: a function
that performs IO affects the world; a function with state modifies memory;
a function with exceptions might fail. Pure functions, like thoughts held
in mind, have no external effect. Making effects explicit prevents hidden
sowing — you know what harvest is coming.
"""

application = [
    "Pure functions are 'thought experiments' — no world impact",
    "IO effects 'sow' into the world — network, files, devices",
    "State effects 'sow' into memory — mutation has consequences",
    "Exception effects acknowledge fallibility — we might fail",
]


# ───────────────────────────────────────────────────────────────────────────────
# Cv.1g GENERICS — The Pattern on the Mount [GENERICS_BIBLICAL]
# ───────────────────────────────────────────────────────────────────────────────

[cognition.biblical.generics]
concept      = "generics"
pattern      = "pattern_on_mount"
scripture    = "Exodus 25:40, Hebrews 8:5"
summary      = "Make all things according to the pattern showed thee in the mount"

theological_insight = """
Moses was shown a pattern — not specific materials, but the form itself.
Generic types embody this: List<T> is the pattern, List<Int> is the instance.
The pattern is abstract (type parameter), the instance is concrete (type
argument). God works from pattern to instance; so do we in type design.
"""

application = [
    "Generic types are patterns — reusable forms",
    "Type parameters are 'slots' in the pattern",
    "Instantiation fills the pattern with concrete types",
    "Constraints on generics are 'specifications' for what fits the pattern",
]


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.2 COGNITIVE — Mental Construct Mapping [COGNITIVE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Be ye transformed by the renewing of your mind." — Romans 12:2 KJV
#
# TYPE COMPOSITION AND THE 27-POSITION CUBE
#
# The CPI-SI mental construct (27-position cube + 7 Hebrew states + 3 keys)
# provides a framework for understanding type operations. Each operation
# corresponds to movement through the construct — toward center (0), outward
# (+1), or inward (-1).
#
# ═══════════════════════════════════════════════════════════════════════════════

[cognition.cognitive.mapping]
description = "How type operations map to mental construct movements"

[cognition.cognitive.mapping.cube_positions]
center      = "yashar (EVEN) — balanced types, default state"
corner_pos  = "tov (PERFECT) — maximally specified types"
corner_neg  = "shavar (BROKEN) — underspecified or error types"
edge        = "intermediate states between center and corners"

[cognition.cognitive.mapping.keys]
plus_key    = "Expansion — generics, unions, optionals (more possibilities)"
zero_key    = "Balance — structs, required, transforms (maintains form)"
minus_key   = "Contraction — constraints, picks, asserts (fewer possibilities)"

[cognition.cognitive.mapping.operations]
struct      = { key = "zero",  direction = "hold",    state = "yashar → yashar" }
union       = { key = "plus",  direction = "expand",  state = "yashar → shalem" }
pick        = { key = "minus", direction = "narrow",  state = "yashar → tamim" }
constraint  = { key = "minus", direction = "narrow",  state = "moves toward tov" }
optional    = { key = "plus",  direction = "expand",  state = "moves toward shalem" }
required    = { key = "minus", direction = "narrow",  state = "moves toward tamim" }
generic     = { key = "plus",  direction = "expand",  state = "pattern level" }
effect_pure = { key = "zero",  direction = "hold",    state = "yashar (clean)" }
effect_io   = { key = "plus",  direction = "reach",   state = "outward interaction" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cv.3 TERNARY — Balanced Ternary Alignment [TERNARY]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "A just weight and balance are the LORD'S." — Proverbs 16:11 KJV
#
# TYPE COMPOSITION IN BALANCED TERNARY
#
# Every composition concept aligns with balanced ternary values (-1, 0, +1).
# This isn't arbitrary — it reflects the fundamental nature of the concept.
# Contractive operations (-1) reduce possibilities; balanced operations (0)
# maintain form; expansive operations (+1) increase possibilities.
#
# ═══════════════════════════════════════════════════════════════════════════════

[cognition.ternary.alignment]
description = "Ternary value alignment for composition concepts"

[cognition.ternary.alignment.composition]
struct      = { value =  1, reason = "Gathers many into one — constructive" }
union       = { value =  1, reason = "Provides alternatives — expansive" }
tuple       = { value =  0, reason = "Fixed anonymous sequence — balanced" }
bytes       = { value = -1, reason = "Raw unstructured data — primitive" }

[cognition.ternary.alignment.constraints]
range       = { value = -1, reason = "Restricts to bounds — contractive" }
pattern     = { value =  0, reason = "Defines form — balanced" }
enum_cons   = { value = -1, reason = "Restricts to set — contractive" }
length      = { value = -1, reason = "Restricts to size — contractive" }

[cognition.ternary.alignment.nullability]
optional    = { value =  1, reason = "Allows absence — expansive" }
required    = { value = -1, reason = "Demands presence — contractive" }
nullable    = { value =  0, reason = "Explicit unknown — balanced" }

[cognition.ternary.alignment.generics]
parameter   = { value =  1, reason = "Abstract placeholder — expansive" }
constraint  = { value = -1, reason = "Restricts parameter — contractive" }
variance    = { value =  0, reason = "Relates types — balanced" }

[cognition.ternary.alignment.effects]
pure        = { value =  0, reason = "No effect — balanced/neutral" }
io          = { value =  1, reason = "Reaches outward — expansive" }
state       = { value = -1, reason = "Modifies existing — contractive" }
exception   = { value = -1, reason = "May abort — contractive" }
async       = { value =  0, reason = "Suspend/resume — balanced" }
resource    = { value = -1, reason = "Must release — contractive" }

[cognition.ternary.alignment.operations]
intersection = { value =  0, reason = "Common ground — balanced" }
union_op     = { value =  1, reason = "Allows either — expansive" }
merge        = { value =  1, reason = "Combines both — expansive" }
difference   = { value = -1, reason = "Removes — contractive" }
pick         = { value = -1, reason = "Selects subset — contractive" }
omit         = { value = -1, reason = "Excludes — contractive" }
transform    = { value =  0, reason = "Reshapes — balanced" }
partial      = { value =  1, reason = "Allows absence — expansive" }
required_op  = { value = -1, reason = "Demands presence — contractive" }


# ═══════════════════════════════════════════════════════════════════════════════
# Cx CODE GENERATION [GENERATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And the LORD answered me, and said, Write the vision, and make it plain upon
#  tables, that he may run that readeth it." — Habakkuk 2:2 KJV
#
# CODE GENERATION: FROM SPECIFICATION TO IMPLEMENTATION
#
# The Cx section defines how this TOML specification generates actual code.
# Like the vision written plain upon tables, the TOML specification becomes
# runnable code that "he may run that readeth it."
#
# STRUCTURE:
#   Cx.1 GENERATE    — Core generation metadata and control
#   Cx.2 TARGETS     — Language-specific generation (C, Go, Rust)
#   Cx.3 TYPES       — Type definition generation
#   Cx.4 EFFECTS     — Effect type generation
#   Cx.5 TEMPLATES   — Code generation templates
#   Cx.6 VALIDATION  — Generated code validation
#
# ═══════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.1 GENERATE — Generation Control Metadata [GENERATE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Core generation control — what to generate, where, and how.
#
# ═══════════════════════════════════════════════════════════════════════════════


[generate]
description = "Code generation control for composition rules"
enabled     = true
version     = "b-01.73"

[generate.output]
description = "Where generated files go"
directory   = "pkg/core/types"
primary     = "composition.gen.h"
order       = 2                                              # After primitives (1)
guard       = "COMPOSITION_GEN_H"

[generate.scales]
description  = "Generation at each architectural layer"
L0_kernel    = { output = "composition.gen.h",    format = "C header" }
L1_system    = { output = "composition_sys.gen.h", format = "C system header" }
L2_runtime   = { output = "composition.gen.go",   format = "Go package" }
L3_framework = { output = "composition.gen.rs",   format = "Rust module" }

[generate.sections]
description = "Sections to generate constants from"
composition = ["struct", "union", "tuple", "bytes", "rational", "complex"]
constraints = ["constraint.range", "constraint.pattern", "constraint.enum_constraint",
               "constraint.length", "constraint.unique", "constraint.foreign_key",
               "constraint.default", "constraint.immutable"]
nullability = ["nullability.optional", "nullability.required", "nullability.nullable"]
generics    = ["generics.parameter", "generics.type_constraint", "generics.variance",
               "generics.higher_kinded", "generics.associated", "generics.where_clause"]
effects     = ["effect_pure", "effect_io", "effect_state", "effect_exception",
               "effect_async", "effect_resource"]
operations  = ["intersection", "union_op", "merge", "difference", "pick", "omit",
               "transform", "partial", "required_op"]
validation  = ["assert", "guard", "validate", "coerce_op"]


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.2 TARGETS — Language-Specific Generation [TARGETS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Each target language has specific generation rules.
#
# ═══════════════════════════════════════════════════════════════════════════════

[generate.target.c]
description = "C language generation — kernel/system layers"
enabled     = true
file        = "composition.gen.h"
layer       = ["L0_kernel", "L1_system"]

[generate.target.c.constants]
# Composition type tags
COMPOSITION_STRUCT = 1
COMPOSITION_UNION  = 0
COMPOSITION_TUPLE  = -1

# Nullability constants
NULLABILITY_OPTIONAL_PRESENCE = 0
NULLABILITY_REQUIRED_PRESENCE = 1
NULLABILITY_NULLABLE_NULL     = -1

# Effect type tags
EFFECT_PURE       = 0
EFFECT_IO         = 1
EFFECT_STATE      = -1
EFFECT_EXCEPTION  = -1
EFFECT_ASYNC      = 0
EFFECT_RESOURCE   = -1

[generate.target.c.types]
struct_template = "typedef struct {name} {{ {fields} }} {name}_t;"
union_template  = "typedef union {name} {{ {variants} }} {name}_t;"
enum_template   = "typedef enum {name} {{ {values} }} {name}_e;"

[generate.target.go]
description = "Go language generation — runtime layer"
enabled     = true
file        = "composition.gen.go"
package     = "types"
layer       = ["L2_runtime", "L3_framework"]

[generate.target.go.types]
struct_template = "type {Name} struct {{ {Fields} }}"
interface_template = "type {Name} interface {{ {Methods} }}"
effect_template = "type {Name}Effect[T any] struct {{ value T; effect EffectKind }"

[generate.target.rust]
description = "Rust language generation — framework layer"
enabled     = true
file        = "composition.gen.rs"
layer       = ["L2_runtime", "L3_framework"]

[generate.target.rust.types]
struct_template = "#[derive(Debug, Clone)] pub struct {Name} {{ {fields} }}"
enum_template   = "#[derive(Debug, Clone)] pub enum {Name} {{ {variants} }}"
trait_template  = "pub trait {Name} {{ {methods} }}"

[generate.target.rust.effects]
pure_fn      = "const fn"
io_fn        = "fn ... -> io::Result<T>"
state_fn     = "fn(&mut self, ...) -> ..."
async_fn     = "async fn ... -> T"
fallible_fn  = "fn ... -> Result<T, E>"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.3 TYPES — Type Definition Generation [GEN_TYPES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# How composite types are generated for each target.
#
# ═══════════════════════════════════════════════════════════════════════════════

[generate.types]
description = "Type definition generation rules"

[generate.types.struct]
c    = "typedef struct {name} {{ {fields} }} {name}_t;"
go   = "type {Name} struct {{ {Fields} }}"
rust = "#[derive(Debug, Clone, PartialEq)] pub struct {Name} {{ {fields} }}"

[generate.types.union]
c    = "typedef struct {{ uint8_t tag; union {{ {variants} }} data; }} {name}_t;"
go   = "// Use interface{} or generics with type switch"
rust = "#[derive(Debug, Clone)] pub enum {Name} {{ {Variants} }}"

[generate.types.nullable]
c    = "typedef struct {{ bool present; {type} value; }} nullable_{name}_t;"
go   = "*{Type} // nil is absent"
rust = "Option<{Type}>"

[generate.types.result]
c    = "typedef struct {{ bool ok; union {{ {ok_type} ok; {err_type} err; }} data; }} result_{name}_t;"
go   = "({Type}, error)"
rust = "Result<{OkType}, {ErrType}>"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.4 EFFECTS — Effect Type Generation [GEN_EFFECTS]
# ═══════════════════════════════════════════════════════════════════════════════
#
# How effect types are generated and tracked.
#
# ═══════════════════════════════════════════════════════════════════════════════

[generate.effects]
description = "Effect type generation for side effect tracking"

[generate.effects.tags]
pure       = { value = 0,  symbol = "∅", c_define = "EFFECT_PURE" }
io         = { value = 1,  symbol = "⇄", c_define = "EFFECT_IO" }
state      = { value = -1, symbol = "⟳", c_define = "EFFECT_STATE" }
exception  = { value = -1, symbol = "⚡", c_define = "EFFECT_EXCEPTION" }
async      = { value = 0,  symbol = "⏳", c_define = "EFFECT_ASYNC" }
resource   = { value = -1, symbol = "🔒", c_define = "EFFECT_RESOURCE" }

[generate.effects.combinations]
description = "Common effect combinations"
pure_total     = ["pure"]
io_fallible    = ["io", "exception"]
stateful       = ["state", "exception"]
async_io       = ["async", "io", "exception"]
resource_guard = ["resource", "exception"]

[generate.effects.c]
template = """
typedef enum {{
    EFFECT_PURE = 0,
    EFFECT_IO = 1,
    EFFECT_STATE = -1,
    EFFECT_EXCEPTION = -1,
    EFFECT_ASYNC = 0,
    EFFECT_RESOURCE = -1
}} EffectKind;

typedef struct {{
    EffectKind effects[8];  // Max 8 combined effects
    uint8_t count;
}} EffectSet;
"""

[generate.effects.go]
template = """
type EffectKind int8

const (
    EffectPure      EffectKind = 0
    EffectIO        EffectKind = 1
    EffectState     EffectKind = -1
    EffectException EffectKind = -1
    EffectAsync     EffectKind = 0
    EffectResource  EffectKind = -1
)

type EffectSet []EffectKind
"""

[generate.effects.rust]
template = """
#[derive(Debug, Clone, Copy, PartialEq)]
pub enum EffectKind {
    Pure = 0,
    IO = 1,
    State = -1,
    Exception = -1,
    Async = 0,
    Resource = -1,
}

pub type EffectSet = Vec<EffectKind>;
"""


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.5 TEMPLATES — Code Generation Templates [TEMPLATES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# Templates for generated code structure.
#
# ═══════════════════════════════════════════════════════════════════════════════

[generate.template.header]
description = "Template for generated file header"
c_comment   = "/* Generated from {source} at {timestamp} — DO NOT EDIT */"
go_comment  = "// Code generated from {source} at {timestamp}. DO NOT EDIT."
rust_comment = "// Code generated from {source} at {timestamp}. DO NOT EDIT."

[generate.template.guard]
description = "Template for header guards"
c_guard     = "#ifndef {GUARD}\n#define {GUARD}\n\n{content}\n\n#endif /* {GUARD} */"

[generate.template.package]
description = "Template for package declarations"
go_package  = "package {package}\n\n{content}"
rust_module = "//! {description}\n\n{content}"


# ═══════════════════════════════════════════════════════════════════════════════
# Cx.6 VALIDATION — Generation Validation [GEN_VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# How to validate generated code compiles and is correct.
#
# ═══════════════════════════════════════════════════════════════════════════════

[generate.validation]
description = "How to validate generated code"
enabled     = true

[generate.validation.syntax]
c_compile    = "gcc -fsyntax-only -Wall -Werror -pedantic {file}"
go_build     = "go build -v {package}"
rust_check   = "cargo check --lib"

[generate.validation.semantic]
c_test       = "make test-generated"
go_test      = "go test -v {package}"
rust_test    = "cargo test --lib"

[generate.validation.integration]
description  = "Cross-language validation"
ffi_test     = "Test C <-> Go interop via cgo"
wasm_test    = "Test Rust -> WASM compilation"

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for composition index"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "python3 -c \"import tomllib; tomllib.load(open('composition.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('composite-types.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('constraints.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('nullability.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('generics.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('references.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('inheritance.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('relationships.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('storage.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('operations.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('effects.toml','rb'))\"",
    "python3 -c \"import tomllib; tomllib.load(open('runtime-checks.toml','rb'))\"",
]

[_validation.schema]
required = ["composition", "cognition", "generate"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_split_files_valid = 30
index_completeness = 30

