[extensions]
note = "Reserved — no extensions for references"

# Cv — Content Validation
[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('references.toml','rb'))\""]

[_validation.schema]
required = ["reference"]
optional = ["_content", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

