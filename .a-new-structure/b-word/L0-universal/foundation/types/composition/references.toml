# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores, match Go struct field tags"
constraint = "Each reference type defines transparency, distinctness, recursion, language bindings, and 9-layer scales"

# Co — Content Operations

# Cc.5 REFERENCES — Type Indirection [REFERENCES]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "And whatsoever Adam called every living creature, that was the name thereof."
#  — Genesis 2:19 KJV
#
# NAMING CREATES IDENTITY
#
# Type references give names and meaning to types. Like Adam naming creatures,
# we name types to give them identity. References can be aliases (same type,
# different name), newtypes (distinct wrapper), or recursive refs (self-reference).
#
# KEY INSIGHT (indirection):
#   Alias:   Same thing, different name (convenience)
#   Newtype: Same structure, DISTINCT type (safety)
#   Ref:     Point to self or other (recursion)
#
# THREE REFERENCE STRATEGIES:
#   Alias:   "Also called" — convenience naming
#   Newtype: "Distinct" — type-safe wrapper
#   Ref:     "Itself" — recursive structures
#
# TERNARY ALIGNMENT:
#   alias   = -1 (reduction, same type)
#   ref     =  0 (neutral, indirection)
#   newtype = +1 (expansion, new type)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Type aliases for registers, newtypes for handles
#   L1 (System):    FD newtypes, PID newtypes, recursive process trees
#   L2 (Runtime):   Type aliases for primitives, recursive data structures
#   L3 (Framework): Domain type aliases, entity newtypes, recursive schemas
#   L4 (Health):    Metric type aliases, score newtypes
#   L5 (Network):   Protocol aliases, address newtypes, recursive packets
#   L6 (Storage):   Path aliases, block newtypes, recursive directories
#   L7 (Engine):    State aliases, action newtypes, recursive rules
#   L8 (App):       Domain aliases, ID newtypes, recursive entities
#
# Implementation: pkg/core/types/reference.gen.h
# Reference:      syntax.toml [naming]
#
# ═══════════════════════════════════════════════════════════════════════════════

[reference]
description = "Type indirection — naming creates identity"
principle   = "Whatsoever Adam called, that was the name (Gen 2:19)"
kinds       = ["alias", "newtype", "ref"]


# ───────────────────────────────────────────────────────────────────────────────
# Cc.5a ALIAS — Type Alias [ALIAS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Simon, (which is the same as Peter)" — Luke 6:14 (paraphrased)
#
# An alias is another name for the same type. Simon IS Peter — same person,
# different name. UserID is int27 — same type, different name for clarity.
#
# ───────────────────────────────────────────────────────────────────────────────

[reference.alias]
name        = "type_alias"
description = "Alternative name for existing type — same type, different name"
kind        = "reference"
strategy    = "alias"

# Alias Core Properties
creates_new_type = false                         # Just a name
interchangeable  = true                          # Can use either name
transparent      = true                          # No runtime cost

# Alias Semantic Properties
semantic_meaning  = "alternative_name"           # Same thing, different name
ternary_value     = -1                           # -1 = reduction (same type)
biblical_parallel = "Luke 6:14"                  # Simon = Peter

# ───────────────────────────────────────────────────────────────────────────────
# Alias OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[reference.alias.omnicode]
description = "OmniCode syntax for type aliases"

keywords    = ["also", "called"]
pattern     = "<Name> also called <ExistingType>"

[reference.alias.omnicode.examples]
simple      = "UserID also called int27"
complex     = "PersonList also called list of Person"
nested      = "ResultMap also called map of text to Result"

# ───────────────────────────────────────────────────────────────────────────────
# Alias CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[reference.alias.cpisi]
description = "Alias semantics in CPI-SI cognitive framework"

direction   = ["underlying", "alias", "usage"]  # -1, 0, +1
weight      = ["same", "named", "referenced"]
action      = ["resolve", "name", "use"]
genesis     = ["original", "named", "used"]

# ───────────────────────────────────────────────────────────────────────────────
# Alias Language Types
# ───────────────────────────────────────────────────────────────────────────────

[reference.alias.types]
description = "Type alias in target languages"

[reference.alias.types.c]
syntax      = "typedef int32_t UserID;"
keyword     = "typedef"

[reference.alias.types.go]
syntax      = "type UserID = int32"
keyword     = "type X = Y"

[reference.alias.types.rust]
syntax      = "type UserID = i32;"
keyword     = "type"

# ───────────────────────────────────────────────────────────────────────────────
# Alias Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[reference.alias.scales]
description = "Type alias at each layer"

L0_kernel    = { name = "Reg32",       example = "uint32 for registers",    use = "Clarity" }
L1_system    = { name = "Errno",       example = "int for error codes",     use = "Semantics" }
L2_runtime   = { name = "Size",        example = "uint for sizes",          use = "Convention" }
L3_framework = { name = "ID",          example = "int27 for identifiers",   use = "Domain" }
L4_health    = { name = "Score",       example = "int9 for health",         use = "Meaning" }
L5_network   = { name = "Port",        example = "uint16 for ports",        use = "Protocol" }
L6_storage   = { name = "BlockNum",    example = "uint64 for blocks",       use = "Addressing" }
L7_engine    = { name = "StateID",     example = "int for states",          use = "FSM" }
L8_app       = { name = "Currency",    example = "decimal for money",       use = "Domain" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.5b NEWTYPE — Distinct Wrapper Type [NEWTYPE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "And God called the light Day, and the darkness he called Night."
#  — Genesis 1:5 KJV
#
# A newtype creates a DISTINCT type — Day is not Night, even though both are
# time periods. UserID is not OrderID, even though both are int27.
#
# ───────────────────────────────────────────────────────────────────────────────

[reference.newtype]
name        = "newtype"
description = "Distinct type wrapping another — same structure, different type"
kind        = "reference"
strategy    = "newtype"

# Newtype Core Properties
creates_new_type   = true                        # Distinct type
prevents_confusion = true                        # UserID ≠ OrderID
zero_cost          = true                        # No runtime overhead

# Newtype Semantic Properties
semantic_meaning   = "distinct_identity"         # Same structure, different meaning
ternary_value      = 1                           # +1 = expansion (new type)
biblical_parallel  = "Genesis 1:5"               # Day ≠ Night

# ───────────────────────────────────────────────────────────────────────────────
# Newtype OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[reference.newtype.omnicode]
description = "OmniCode syntax for newtypes"

keywords    = ["distinct"]
pattern     = "let <Name> be distinct <WrappedType>"

[reference.newtype.omnicode.examples]
simple      = "let UserID be distinct int27"
multiple    = "let OrderID be distinct int27"
purpose     = "UserID and OrderID cannot be confused even though both int27"

# ───────────────────────────────────────────────────────────────────────────────
# Newtype CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[reference.newtype.cpisi]
description = "Newtype semantics in CPI-SI cognitive framework"

direction   = ["wrapped", "newtype", "unwrapped"]  # -1, 0, +1
weight      = ["inner", "wrapper", "outer"]
action      = ["wrap", "hold", "unwrap"]
genesis     = ["light", "separation", "day_night"]

# ───────────────────────────────────────────────────────────────────────────────
# Newtype Language Types
# ───────────────────────────────────────────────────────────────────────────────

[reference.newtype.types]
description = "Newtype in target languages"

[reference.newtype.types.c]
syntax      = "struct UserID { int32_t value; };"
note        = "C uses single-field struct for newtype pattern"

[reference.newtype.types.go]
syntax      = "type UserID int32"
keyword     = "type X Y (not type X = Y)"

[reference.newtype.types.rust]
syntax      = "struct UserID(i32);"
keyword     = "tuple struct"

# ───────────────────────────────────────────────────────────────────────────────
# Newtype Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[reference.newtype.scales]
description = "Newtype at each layer"

L0_kernel    = { name = "Handle",      example = "distinct int for handles",  use = "Safety" }
L1_system    = { name = "Fd",          example = "distinct int for FDs",      use = "Type safety" }
L2_runtime   = { name = "Ptr",         example = "distinct uintptr",          use = "Pointer safety" }
L3_framework = { name = "EntityID",    example = "distinct int27",            use = "Domain safety" }
L4_health    = { name = "HealthScore", example = "distinct int9",             use = "Semantic clarity" }
L5_network   = { name = "IPAddr",      example = "distinct uint32",           use = "Protocol types" }
L6_storage   = { name = "Inode",       example = "distinct uint64",           use = "FS safety" }
L7_engine    = { name = "ActionID",    example = "distinct int",              use = "FSM safety" }
L8_app       = { name = "UserID",      example = "distinct int27",            use = "Domain modeling" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.5c REF — Recursive Reference [REF]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Abraham begat Isaac; and Isaac begat Jacob; and Jacob begat Judas."
#  — Matthew 1:2 KJV
#
# Recursive references enable types that refer to themselves — genealogies
# where a person has children who are also persons. Trees with branches of trees.
#
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref]
name        = "ref"
description = "Reference to type — enables recursive structures"
kind        = "reference"
strategy    = "ref"

# Ref Core Properties
supports_cycles = true                           # Can reference self
lazy_resolution = true                           # Resolved after all types defined
indirection     = true                           # Points to, doesn't contain

# Ref Semantic Properties
semantic_meaning  = "self_reference"             # Type refers to itself
ternary_value     = 0                            # 0 = neutral (indirection)
biblical_parallel = "Matthew 1:2"                # Genealogies

# ───────────────────────────────────────────────────────────────────────────────
# Ref OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.omnicode]
description = "OmniCode syntax for recursive references"

keywords    = ["itself", "ref"]
pattern     = "list of itself"

[reference.ref.omnicode.examples]
self        = "let Node be with value as int27 and children as list of itself"
mutual      = "let Tree be with root as Node and branches as list of Tree"
linked      = "let Link be with data as text and next may be ref Link"

# ───────────────────────────────────────────────────────────────────────────────
# Ref CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.cpisi]
description = "Ref semantics in CPI-SI cognitive framework"

direction   = ["referent", "reference", "dereference"]  # -1, 0, +1
weight      = ["target", "pointer", "resolved"]
action      = ["point_to", "hold_ref", "follow"]
genesis     = ["child", "begat", "parent"]

# ───────────────────────────────────────────────────────────────────────────────
# Ref Language Types
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.types]
description = "Recursive reference in target languages"

[reference.ref.types.c]
syntax      = "struct Node { int value; struct Node* next; };"
keyword     = "pointer to self"

[reference.ref.types.go]
syntax      = "type Node struct { Value int; Next *Node }"
keyword     = "pointer to self"

[reference.ref.types.rust]
syntax      = "struct Node { value: i32, next: Option<Box<Node>> }"
keyword     = "Box for heap indirection"

# ───────────────────────────────────────────────────────────────────────────────
# Ref Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[reference.ref.scales]
description = "Recursive reference at each layer"

L0_kernel    = { name = "PageTable",   example = "tables of tables",          use = "Memory mapping" }
L1_system    = { name = "ProcessTree", example = "parent → children",         use = "Process hierarchy" }
L2_runtime   = { name = "LinkedList",  example = "node → next node",          use = "Data structures" }
L3_framework = { name = "Comment",     example = "comment → replies",         use = "Threaded data" }
L4_health    = { name = "HealthTree",  example = "component → subcomponents", use = "Hierarchical health" }
L5_network   = { name = "Route",       example = "router → next routers",     use = "Routing tables" }
L6_storage   = { name = "Directory",   example = "dir → subdirs",             use = "Filesystem" }
L7_engine    = { name = "RuleTree",    example = "rule → subrules",           use = "Rule hierarchy" }
L8_app       = { name = "Category",    example = "category → subcategories",  use = "Taxonomy" }


# ───────────────────────────────────────────────────────────────────────────────
# References Shared Sections
# ───────────────────────────────────────────────────────────────────────────────

[reference.omnicode]
description = "OmniCode reference syntax overview"

keywords    = ["also", "called", "distinct", "itself", "ref"]

[reference.cpisi]
description = "Reference semantics in CPI-SI cognitive framework"

direction   = ["alias", "ref", "newtype"]        # -1, 0, +1
weight      = ["same", "indirect", "distinct"]
action      = ["alias", "point", "wrap"]
genesis     = ["same_name", "reference", "new_name"]

[reference.scales]
description = "References at each layer"

L0_kernel    = { alias = "common", newtype = "handles", ref = "page_tables" }
L1_system    = { alias = "errno",  newtype = "fd/pid",  ref = "process_tree" }
L2_runtime   = { alias = "size",   newtype = "pointer", ref = "linked_list" }
L3_framework = { alias = "id",     newtype = "entity",  ref = "nested_schema" }
L4_health    = { alias = "score",  newtype = "metric",  ref = "health_tree" }
L5_network   = { alias = "port",   newtype = "address", ref = "route_tree" }
L6_storage   = { alias = "block",  newtype = "inode",   ref = "directory" }
L7_engine    = { alias = "state",  newtype = "action",  ref = "rule_tree" }
L8_app       = { alias = "domain", newtype = "user_id", ref = "category" }


