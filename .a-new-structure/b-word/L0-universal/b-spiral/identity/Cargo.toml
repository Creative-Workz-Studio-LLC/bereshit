# #!omni code --toml --cargo

# ===================================================================
# Cargo.toml -- 3-Block (METADATA + CONTENT + CLOSING)
# ===================================================================
#
# Structure: 3-block (METADATA + CONTENT + CLOSING)
#
# TOML constraint: [package] must come before [package.metadata.*]
# sub-tables. So the physical order is:
#
#   [package]                        <- Cc.1 identity (CONTENT)
#   [package.metadata.omni.*]        <- I/C metadata (METADATA)
#   [package.metadata.omni._closing] <- X closing (CLOSING)
#   [dependencies] etc.              <- Co sections (CONTENT continued)
#
# Logical structure is still: METADATA -> CONTENT -> CLOSING
# Physical ordering respects TOML's sub-table rule.

# -------------------------------------------------------------------
# [package] -- MUST come first (TOML sub-table ordering rule)
# -------------------------------------------------------------------
#
# Cc.1 PACKAGE -- Crate Identity [REQUIRED]
#
# The identity registry has zero external dependencies. Standard
# library only: HashMap, BTreeSet, RwLock, fmt. This is intentional --
# the identity layer is foundational and must not depend on anything
# above it in the stack.
[package]
name = "bereshit-l0-identity"
version = "0.2.0"
description = "OmniCode package identity registry -- runtime self-awareness for CPI-SI"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

# ===================================================================
# METADATA BLOCK [METADATA]
# ===================================================================
#
# OmniCode metadata lives in [package.metadata.omni] -- Cargo's
# sanctioned extension point. Cargo ignores everything under
# package.metadata.

# -------------------------------------------------------------------
# I -- Identity: What IS This File
# -------------------------------------------------------------------

[package.metadata.omni.I1_core]
key = "B-L0-identity-registry-cargo"
format = "@omni code --toml --cargo"
from = "b-word/seed/code/L0/toml/cargo/Cargo.toml"
at = "b-02.00"

[package.metadata.omni.I2_family]
type = "code"
subtype = "crate-manifest"
role = "derived"
structure = "3-block"

[package.metadata.omni.I3_instance]
file = "Cargo.toml"
title = "Identity Registry Crate Manifest"
component = "Build manifest for the OmniCode package identity registry"
path = "L0-universal/b-spiral/identity/Cargo.toml"
provides = ["IDENTITY_CRATE_MANIFEST"]
brief = "Zero-dependency crate manifest. Workspace inheritance for shared settings. BTreeSet indexes, RwLock concurrency."

[package.metadata.omni.I4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

# -------------------------------------------------------------------
# C -- Context: What Do I Need to KNOW
# -------------------------------------------------------------------

[package.metadata.omni.C1_state]
version = "b-02.00"
