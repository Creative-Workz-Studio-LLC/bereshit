domain = "L0-universal/identity"

[package.metadata.omni._contract]
required_identity = ["I1_core", "I2_family", "I3_instance"]
required_context = ["C1_state", "C2_attribution", "C3_grounding", "C4_dependencies"]
extension_identity = ["I4_architecture"]
extension_context = ["C5_intent", "C6_roadmap", "C7_classification"]
required_closing = ["X1_policy", "X5_note"]
defined_closing = ["X2_extension", "X3_troubleshooting", "X4_reference"]
valid_patterns = ["I{N}_{name}", "C{N}_{name}", "X{N}_{name}", "_{name}"]
rule = "Metadata in package.metadata.omni. Standard Cargo sections for content."

# ===================================================================
# END METADATA [END]
# ===================================================================


# ===================================================================
# CONTENT BLOCK [CONTENT] (continued)
# ===================================================================
#
# [package] is above (TOML ordering constraint). Remaining
# content sections follow here.
#
# Zones:
#   Cc -- Configurations  Crate identity [package] and targets [lib]/[[bin]]
#   Co -- Operations      Dependencies, features, lints
#   Cv -- Validation      Build verification (comments only)
#
# Ordering: cargo_convention (package -> targets -> deps -> features -> lints)

# -------------------------------------------------------------------
# Cc.2 TARGETS -- Library Configuration [DEFAULT]
# -------------------------------------------------------------------
#
# Library crate -- default target. No [lib] section needed because
# Cargo infers lib from src/lib.rs. No [[bin]] because this is a
# library, not an executable.

# -------------------------------------------------------------------
# Co -- Content Operations
# -------------------------------------------------------------------

# Co.1 DEPENDENCIES -- Crate Dependencies [NONE]
#
# Zero external dependencies. The identity registry uses only std:
#   - std::collections::{HashMap, BTreeSet}
#   - std::sync::RwLock
#   - std::fmt
#
# This is a design decision, not an omission. Foundation cannot
# depend on anything above it in the stack.
[dependencies]

[dev-dependencies]

# Co.2 FEATURES -- Optional Capabilities [DEFINED]
#
# Future: serde feature gate for JSON/TOML serialization of registry
# contents. Currently empty because zero-dependency is the design.
[features]
default = []

# Co.3 LINTS -- Code Quality Rules [WORKSPACE]
#
# Workspace-level lints keep all crates consistent.
[lints]
workspace = true

# -------------------------------------------------------------------
# Cv -- Content Validation (comments only)
# -------------------------------------------------------------------
#
#   cargo check -p bereshit-l0-identity    -- Type-check
#   cargo build -p bereshit-l0-identity    -- Full build
#   cargo test  -p bereshit-l0-identity    -- Run tests
#   cargo clippy -p bereshit-l0-identity   -- Lint check
#   cargo fmt --check                      -- Format check

# ===================================================================
# END CONTENT [END]
# ===================================================================


# ===================================================================
# CLOSING BLOCK [CLOSING]
# ===================================================================

