# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

[_content]
format = "TOML — native tables, UTF-8, LF line endings"
key_convention = "UPPER_SNAKE for layer names, lower_snake for properties"
constraint = "9 layers exactly. Center at index 4 (HEALTH). Balanced ternary mapping -4 to +4."
Cc = "Content Configurations — 9 layers (KERNEL through APP), balanced ternary mapping (-4 to +4)"
Co = "Content Operations — layer groups, scale factors, bounds"
Cv = "Content Validation — schema requirements, health scoring"

# ─────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────

[identity]
name = "OmniCode Layer Types"
version = "a-01.00"
domain = "types"
scope = "9-layer architecture from kernel to application — 4+1+4 pattern with HEALTH at center"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ─────────────────────────────────────────────────────────────

[layer]
description = "9-layer architecture from kernel to application"
count = 9
center = 4
pattern = "4+1+4"

# Layer definitions
[layer.values]
KERNEL    = { index = 0, balanced = -4, description = "Kernel — lowest level, hardware interface" }
SYSTEM    = { index = 1, balanced = -3, description = "System — OS services, system calls" }
RUNTIME   = { index = 2, balanced = -2, description = "Runtime — language runtime, memory management" }
FRAMEWORK = { index = 3, balanced = -1, description = "Framework — application framework, libraries" }
HEALTH    = { index = 4, balanced =  0, description = "Health — CENTER, all traffic passes through" }
NETWORK   = { index = 5, balanced = +1, description = "Network — communication, messaging" }
STORAGE   = { index = 6, balanced = +2, description = "Storage — persistence, filesystem" }
ENGINE    = { index = 7, balanced = +3, description = "Engine — game/app engine, high-level logic" }
APP       = { index = 8, balanced = +4, description = "App — application layer, user interface" }

# ─────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ─────────────────────────────────────────────────────────────

# Layer groups
[layer.groups]
below_center = ["KERNEL", "SYSTEM", "RUNTIME", "FRAMEWORK"]
center = ["HEALTH"]
above_center = ["NETWORK", "STORAGE", "ENGINE", "APP"]

# Scale factors (3^n)
[layer.scale]
description = "Capacity scales by powers of 3"
values = [1, 3, 9, 27, 81, 243, 729, 2187, 6561]

# Bounds
[layer.bounds]
min = 0
max = 8
half = 4

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["cws-struct lint toml layer.toml"]

[_validation.schema]
required = ["identity", "layer", "layer.values", "layer.groups", "layer.scale", "layer.bounds"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
valid_values = 30
layer_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════

[_closing.X1_policy]
scripture = "Proverbs 22:28 (KJV) — Remove not the ancient landmark, which thy fathers have set."
never = [
    "Remove layer definitions (breaks all subsystems)",
    "Change layer indices (breaks routing)",
    "Remove HEALTH center (breaks architecture)",
]
careful = [
    "Adding new layers (changes count and balance)",
    "Changing scale factors",
    "Modifying group membership",
]
safe = [
    "Updating descriptions",
    "Adding metadata",
    "Adding new properties to existing layers",
]

[_closing.X2_extension]
planned = [
    "Layer-aware routing",
    "Layer affinity for process scheduling",
]

[_closing.X3_troubleshooting]
layer_not_found = "Verify index is 0-8. Check layer.values table."
center_mismatch = "HEALTH must be at index 4 with balanced = 0."

[_closing.X4_reference]
related_files = [
    "math/core/definitions.toml — Ternary math (balanced values)",
    "primitives/primitives-catalog.toml — Base types",
    "errors/foundation.toml — Error system using layers",
]

[_closing.X5_note]
note = "Jacob's Ladder — 9 layers from KERNEL to APP. HEALTH at center. Everything below serves infrastructure, everything above serves users."
scripture = "Isaiah 28:10 — For precept must be upon precept, precept upon precept; line upon line, line upon line."
anchor = "In the beginning God created — Genesis 1:1. Structure before content. Layers define the structure of the system."

