]

[_closing.X5_note]
note = "Generation bridges spec and code — mathematical truths become generated header files."
scripture = "In the beginning God created the heaven and the earth. — Genesis 1:1"
anchor = "TOML is the source of truth. Generated code is derived. The word becomes implementation."

