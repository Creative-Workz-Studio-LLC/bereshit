at = "data"

[_metadata.I2_family]
type = "data"
subtype = "constants"
role = "rung"
structure = "3-block"

[_metadata.I3_instance]
file = "generation.toml"
title = "Code Generation Configuration"
component = "Code generation control — targets (C, Go, Rust), templates, output sections, validation rules"
path = "generation/generation.toml"
provides = ["GENERATION_TARGETS", "GENERATION_TEMPLATES", "GENERATION_SECTIONS", "GENERATION_VALIDATION"]
brief = "TOML becomes code. Targets (C priority 1, Go priority 2, Rust reserved), type mappings, header/constant/array templates, validation suite."

[_metadata.I4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

# ─────────────────────────────────────────────────────────────
# C — Context: What Do I Need to KNOW
# ─────────────────────────────────────────────────────────────

[_metadata.C1_state]
version = "b-01.00"
status = "Active"
