# ─────────────────────────────────────────────────────────────
# SPLIT FILE OVERVIEW
# ─────────────────────────────────────────────────────────────
#
# Primitive type definitions for the OmniCode type system.
# Structure: Cc (Type Definitions) → Co (Operations) → Cv (Cognition) → Cx (Generation)
#
# STANDARDIZED Cc ORGANIZATION (4-Section):
#   Cc.1 IDENTITY   — What primitives ARE (type catalog, distinctions, purpose)
#   Cc.2 SETTINGS   — Primary configuration (defaults, sizes, parameters)
#   Cc.3 RESOURCES  — WHERE + HOW MUCH (storage, packing, layer assignments)
#   Cc.4 BEHAVIOR   — HOW types operate (OmniCode syntax, CPI-SI mappings, bindings)
#
# Co/Cv/Cx ORGANIZATION:
#   Co.1 CONVERSION — Type-to-type transformation rules
#   Co.2 VALIDATION — Type constraint verification
#   Co.3 COERCION   — Implicit type promotion rules
#   Cv.1 TYPE_SYSTEM  — Ternary principles embodied in types
#   Cv.2 COMPOSITION  — How primitives compose into complex types
#   Cx.1 GENERATE   — Generation control metadata
#   Cx.2 TARGETS    — Language-specific generation
#   Cx.3 TEMPLATES  — Code generation templates
#   Cx.4 VALIDATION — Generation validation
#
# ─────────────────────────────────────────────────────────────

[index]
type = "split_index"
total_files = 7
total_sections = 11
original_lines = 4083

[index.key_constants]
total_types = 23
type_families = 10
ternary_foundation = "trit, trit5"
power_sizes = "9, 27, 81, 243 trits (3^2, 3^3, 3^4, 3^5)"

[index.files]
catalog = { file = "primitives-catalog.toml", sections = "Cc.1" }
settings = { file = "primitives-settings.toml", sections = "Cc.2" }
resources = { file = "primitives-resources.toml", sections = "Cc.3" }
behavior = { file = "primitives-behavior.toml", sections = "Cc.4" }
operations = { file = "primitives-operations.toml", sections = "Co.1-3" }
paradigm = { file = "primitives-paradigm.toml", sections = "Cv.1-2" }
generation = { file = "primitives-generation.toml", sections = "Cx.1-4" }

# ─────────────────────────────────────────────────────────────
# THE 23 PRIMITIVE TYPES
# ─────────────────────────────────────────────────────────────
#
# TERNARY FOUNDATION (2 types):
#   trit    — Single balanced ternary digit: {-1, 0, +1}
#   trit5   — 5 trits packed in 1 byte (byte bridge)
#
# INTEGERS (8 types):
#   int9, uint9     — 9-trit  (L2 scale)
#   int27, uint27   — 27-trit (L3 scale, the Word)
#   int81, uint81   — 81-trit (L4 scale, extended)
#   int243, uint243 — 243-trit (L5 scale, block)
#
# FLOATING POINT (1 type):
#   float27 — 27-trit IEEE-style float
#
# TEXT (2 types):
#   text — UTF-8 string (variable length)
#   char — Single Unicode codepoint
#
# BOOLEAN (1 type):
#   bool3 — Three-valued: false(-1), unknown(0), true(+1)
#
# COLLECTIONS (3 types):
#   list — Ordered, indexed, homogeneous
#   map  — Key-value pairs
#   set  — Unique, unordered
#
# SPECIAL (2 types):
#   void — Absence of value (nothing returns)
#   any  — Universal supertype (anything accepted)
#
# EXTENDED (2 types):
#   decimal27 — Fixed-point decimal (uses int27 storage)
#   timestamp — Ternary time (uses int81 storage)
#
# TEMPORAL (1 type):
#   duration — Time span (uses int81 storage)
#
# WHY 23: 23 types across 10 families. Not arbitrary — each justified by
# ternary math, CPI-SI paradigm, or practical necessity. No more, no fewer.
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for index file"

