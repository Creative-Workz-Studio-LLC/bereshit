# Cc.4 BEHAVIOR — HOW Types Operate [BEHAVIOR]
# ═════════════════════════════════════════════════════════════
#
# "Be ye doers of the word, and not hearers only" — James 1:22 KJV
#
# PRIMITIVE TYPE BEHAVIOR: SYNTAX, SEMANTICS, BINDINGS
#
# Behavior defines HOW types operate in code — the OmniCode syntax for declaring
# and using them, the CPI-SI cognitive mappings for understanding them, and the
# language bindings for implementing them.
#
# WHAT BELONGS IN BEHAVIOR:
#
#   - OmniCode syntax (declare, literal, cast, operators)
#   - CPI-SI cognitive mappings (direction, weight, action, genesis)
#   - Language type bindings (c_repr, go_repr, rust_repr)
#   - Type-specific operations (for collections, etc.)
#
# BEHAVIOR VS SETTINGS VS RESOURCES:
#
#   SETTINGS:  "What are the configuration values?"
#   RESOURCES: "How much space/capacity does it need?"
#   BEHAVIOR:  "How does it operate in code?"
#
# Implementation: Used by code generators and the OmniCode compiler
# Reference:      OmniCode syntax specification
#
# ═════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.1 OMNICODE SYNTAX — Storage Operations [OMNICODE_STORAGE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Write the vision, and make it plain" — Habakkuk 2:2 KJV
#
# OmniCode syntax for storage operations.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.omnicode.storage]
description = "OmniCode syntax for storage operations"

keywords    = ["store", "load", "pack", "unpack", "encode", "decode"]
operators   = ["→", "←", "⇄"]                            # store, load, bidirectional
modifiers   = ["packed", "unpacked", "aligned", "raw"]
sigils      = ["$:", "!:", "@:"]                         # packed, unpacked, aligned

[cc.behavior.omnicode.storage.examples]
pack        = "store packed $:value → $:buffer"
unpack      = "load packed $:buffer → $:value"
convert     = "encode unpacked !:text ⇄ packed $:bytes"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.2 CPISI MAPPINGS — Cognitive Framework [CPISI]
# ───────────────────────────────────────────────────────────────────────────────
#
# "For as he thinketh in his heart, so is he" — Proverbs 23:7 KJV
#
# How types map to the CPI-SI cognitive framework.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.cpisi]
description = "Type semantics in CPI-SI cognitive framework"

# Directional meaning (from building block method)
[cc.behavior.cpisi.direction]
negative    = "persist_down"                             # -1: toward material/earth
neutral     = "bridge"                                   # 0: firmament itself
positive    = "retrieve_up"                              # +1: toward conceptual/heaven

# Cognitive weight
[cc.behavior.cpisi.weight]
negative    = "heavy"                                    # Persistence is commitment
neutral     = "grounded"                                 # Bridge is stable
positive    = "light"                                    # Retrieval is access

# Action semantics
[cc.behavior.cpisi.action]
negative    = "commit"                                   # Write to permanent storage
neutral     = "hold"                                     # Buffer in bridge layer
positive    = "access"                                   # Read from storage

# Genesis 1:6 mapping
[cc.behavior.cpisi.genesis]
negative    = "waters_below"                             # Physical storage
neutral     = "firmament"                                # This bridge layer
positive    = "waters_above"                             # Conceptual types

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.3 LANGUAGE BINDINGS — Target Language Types [BINDINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "To every nation, and kindred, and tongue" — Revelation 14:6 KJV
#
# How primitive types map to target language types.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.bindings]
description = "Type representations in target languages"

# Packed storage types
[cc.behavior.bindings.packed5]
c_repr      = "uint8_t"
go_repr     = "uint8"
rust_repr   = "u8"
trit_count  = 5

[cc.behavior.bindings.packed9]
c_repr      = "uint16_t"
go_repr     = "uint16"
rust_repr   = "u16"
trit_count  = 9

[cc.behavior.bindings.packed27]
c_repr      = "uint64_t"                                 # 6 bytes, padded to 8
go_repr     = "uint64"
rust_repr   = "u64"
trit_count  = 27

[cc.behavior.bindings.packed81]
c_repr      = "__int128"                                 # or custom struct
go_repr     = "big.Int"
rust_repr   = "i128"
trit_count  = 81

[cc.behavior.bindings.packed243]
c_repr      = "trit243_t"                                # Custom 49-byte struct
go_repr     = "big.Int"
rust_repr   = "[i8; 49]"
trit_count  = 243

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.4 TRIT CHARACTERS — Visual Representations [TRIT_CHARS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Write the vision, and make it plain" — Habakkuk 2:2 KJV
#
# Character representations for trit display and parsing.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.trit_chars]
description = "Visual representations for trit display and parsing"
standard    = ["-", "0", "+"]                            # Mathematical notation
ascii_safe  = ["N", "Z", "P"]                            # ASCII-safe
arrow       = ["↓", "●", "↑"]                            # Direction indicators
block       = ["▼", "■", "▲"]                            # Block-style visual
wave        = ["∿", "―", "∼"]                            # Wave-style (signals)

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.5 TRIT OMNICODE — Trit Syntax [TRIT_OMNICODE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Let your speech be alway with grace" — Colossians 4:6 KJV
#
# OmniCode syntax for trit operations.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.trit_omnicode]
description = "OmniCode syntax for trit operations"
keywords    = ["break_down", "anchor", "build_up"]       # CPI-SI building block method
operators   = ["←", "◆", "→"]                            # Directional operators
modifiers   = ["toward", "at", "from"]                   # Positional modifiers
sigils      = ["-:", "0:", "+:"]                         # Trit-prefixed sigils

[cc.behavior.trit_omnicode.syntax]
declare     = "let trit be balanced from -1 to +1"
literal     = "-1 | 0 | +1"
cast        = "as trit"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.6 TRIT CPISI — Cognitive Mappings [TRIT_CPISI]
# ───────────────────────────────────────────────────────────────────────────────
#
# "For as he thinketh in his heart, so is he" — Proverbs 23:7 KJV
#
# Trit values as cognitive operations in CPI-SI.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.trit_cpisi]
description = "Trit values as cognitive operations in CPI-SI"

# Directional meaning (building block method)
[cc.behavior.trit_cpisi.direction]
negative    = "toward_anchor"                            # -1: break down, trace to foundation
neutral     = "at_anchor"                                # 0: halt, the foundation itself
positive    = "from_anchor"                              # +1: build up, construct from foundation

# Cognitive weight
[cc.behavior.trit_cpisi.weight]
negative    = "heavy"                                    # -1: gravity, commitment, earthly
neutral     = "balanced"                                 # 0: stable, grounded
positive    = "light"                                    # +1: expansion, growth, heavenly

# Action semantics
[cc.behavior.trit_cpisi.action]
negative    = "retreat"                                  # -1: move toward foundation
neutral     = "hold"                                     # 0: maintain position
positive    = "advance"                                  # +1: move from foundation

# Genesis 1:6 mapping
[cc.behavior.trit_cpisi.genesis]
negative    = "waters_below"                             # -1: earth, material, concrete
neutral     = "firmament"                                # 0: bridge, separator, anchor
positive    = "waters_above"                             # +1: heaven, conceptual, abstract

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.7 TRIT BINDINGS — Language Types [TRIT_BINDINGS]
# ───────────────────────────────────────────────────────────────────────────────
#
# "To every nation, and kindred, and tongue" — Revelation 14:6 KJV
#
# Trit type representations in target languages.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.trit_bindings]
description  = "Trit type in target languages"
c_repr       = "int8_t"
go_repr      = "int8"
rust_repr    = "i8"
bit_width    = 2                                         # Minimum bits needed (binary)
byte_aligned = 1                                         # Bytes when aligned
typedef      = "trit_t"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.8 TRIT5 OMNICODE — Byte Bridge Syntax [TRIT5_OMNICODE]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Five smooth stones" — 1 Samuel 17:40 KJV
#
# OmniCode syntax for trit5 operations.
#
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.trit5_omnicode]
description = "OmniCode syntax for trit5"
declare     = "let trit5 be packed from -121 to +121"
literal     = "5t'value'"                                # 5-trit literal prefix
cast        = "as trit5"
pack        = "pack trits[5] → trit5"
unpack      = "unpack trit5 → trits[5]"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.9 TRIT5 CPISI — Byte Bridge Cognitive Mapping [TRIT5_CPISI]
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.trit5_cpisi]
description = "trit5 as cognitive unit in CPI-SI"
role        = "byte_bridge"                              # Bridges ternary to binary
semantic    = "minimal_packed"                           # Smallest packed unit
weight      = "light"                                    # Easy to manipulate
action      = "transfer"                                 # Primary action is data transfer

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.10 TRIT5 BINDINGS — Byte Bridge Language Types [TRIT5_BINDINGS]
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.trit5_bindings]
description  = "trit5 type in target languages"
c_repr       = "uint8_t"
go_repr      = "uint8"
rust_repr    = "u8"
bit_width    = 8
byte_aligned = 1
typedef      = "trit5_t"


