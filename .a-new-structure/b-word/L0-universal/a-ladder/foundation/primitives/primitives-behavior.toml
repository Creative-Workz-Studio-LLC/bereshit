[cc.behavior.boolean_omnicode]
description = "OmniCode syntax for boolean"

[cc.behavior.boolean_omnicode.bool3]
declare         = "let bool3 be truth"
literal_true    = "true"
literal_false   = "false"
literal_unknown = "unknown"
cast            = "as bool3"

[cc.behavior.boolean_cpisi]
description = "Boolean in CPI-SI cognitive framework"

[cc.behavior.boolean_cpisi.bool3]
role     = "truth"
semantic = "honest_logic"
weight   = "decisive"

[cc.behavior.boolean_cpisi.bool3.building_block]
false_maps   = { operation = "break_down", meaning = "stop, reject, retreat" }
unknown_maps = { operation = "anchor",     meaning = "hold, wait, uncertain" }
true_maps    = { operation = "build_up",   meaning = "proceed, accept, advance" }

[cc.behavior.boolean_bindings]
description = "Boolean types in target languages"

[cc.behavior.boolean_bindings.bool3]
c_repr   = "int8_t"
go_repr  = "int8"
rust_repr = "i8"
