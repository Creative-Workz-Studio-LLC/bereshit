# ───────────────────────────────────────────────────────────────────────────────
# COLLECTIONS BEHAVIOR
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.collections_omnicode]
description = "OmniCode syntax for collections"

[cc.behavior.collections_omnicode.list]
declare = "let names be list of text"
literal = "[a, b, c]"
empty   = "[]"
access  = "names[0]"
append  = "names.append(x)"
length  = "names.length"

[cc.behavior.collections_omnicode.map]
declare  = "let census be map from text to int27"
literal  = "{\"key\": value}"
empty    = "{}"
access   = "census[\"key\"]"
insert   = "census[\"key\"] = value"
contains = "\"key\" in census"
length   = "census.length"

[cc.behavior.collections_omnicode.set]
declare  = "let tribe be set of Person"
literal  = "{a, b, c}"
empty    = "{}"
add      = "tribe.add(x)"
remove   = "tribe.remove(x)"
contains = "x in tribe"
length   = "tribe.length"

[cc.behavior.collections_cpisi]
description = "Collections in CPI-SI cognitive framework"

[cc.behavior.collections_cpisi.list]
role     = "sequence"
semantic = "ordered_collection"
weight   = "variable"
pattern  = "generations"

[cc.behavior.collections_cpisi.map]
role     = "lookup"
semantic = "association"
weight   = "variable"
pattern  = "census"

[cc.behavior.collections_cpisi.set]
role     = "membership"
semantic = "unique_collection"
weight   = "variable"
pattern  = "tribe"

[cc.behavior.collections_bindings]
description = "Collection types in target languages"

[cc.behavior.collections_bindings.list]
c_repr    = "struct { size_t len; T* data; }"
go_repr   = "[]T"
rust_repr = "Vec<T>"
typedef   = "tlist_t"

[cc.behavior.collections_bindings.map]
c_repr    = "struct { size_t len; struct {K key; V val;}* data; }"
go_repr   = "map[K]V"
rust_repr = "HashMap<K, V>"
typedef   = "tmap_t"

[cc.behavior.collections_bindings.set]
c_repr    = "struct { size_t len; T* data; }"
go_repr   = "map[T]struct{}"
rust_repr = "HashSet<T>"
typedef   = "tset_t"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.7 SPECIAL — Void and Any Behavior [SPECIAL_BEHAVIOR]
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.special_omnicode]
description = "OmniCode syntax for special types"

[cc.behavior.special_omnicode.void]
declare = "let cleanup be function returning void"
return  = "return"
call    = "cleanup()"
type    = "void"

[cc.behavior.special_omnicode.any]
declare = "let value be any"
check   = "value is int27"
cast    = "value as int27"
typeof  = "type of value"

[cc.behavior.special_cpisi]
description = "CPI-SI cognitive framework for special types"

[cc.behavior.special_cpisi.void]
role     = "absence"
semantic = "no_return"
weight   = "none"
pattern  = "tohu"

[cc.behavior.special_cpisi.void.building_block]
maps_to = "anchor"
meaning = "Work is complete, nothing to pass on"
analogy = "Recursion termination — halt condition"

[cc.behavior.special_cpisi.any]
role     = "dynamic"
semantic = "unknown_type"
weight   = "variable"
pattern  = "naming"

[cc.behavior.special_cpisi.any.building_block]
maps_to = "unknown"
meaning = "Type is indeterminate until runtime"
analogy = "The question 'what type?' has no compile-time answer"

[cc.behavior.special_bindings]
description = "Language bindings for special types"

[cc.behavior.special_bindings.void]
c_repr    = "void"
go_repr   = "()"
rust_repr = "()"
typedef   = "void"

[cc.behavior.special_bindings.any]
c_repr    = "void*"
go_repr   = "interface{}"
rust_repr = "Box<dyn Any>"
typedef   = "tany_t"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.8 DECIMAL — Fixed-Point Behavior [DECIMAL_BEHAVIOR]
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.decimal_omnicode]
description   = "OmniCode syntax for decimal27"
declare       = "let price be decimal27 with scale 2"
literal       = "123.45d"
cast          = "as decimal27"
scale_declare = "let precise be decimal27 with scale 9"

[cc.behavior.decimal_cpisi]
description = "decimal27 in CPI-SI cognitive framework"
role        = "exact_value"
semantic    = "just_weight"
weight      = "grounded"

[cc.behavior.decimal_bindings]
description = "Language bindings for decimal27"
c_repr      = "struct { int64_t value; int8_t scale; }"
go_repr     = "Decimal27"
rust_repr   = "Decimal27"
typedef     = "tdecimal27_t"

# ───────────────────────────────────────────────────────────────────────────────
# Cc.4.9 TEMPORAL — Time Behavior [TEMPORAL_BEHAVIOR]
# ───────────────────────────────────────────────────────────────────────────────

[cc.behavior.temporal_omnicode]
description = "OmniCode syntax for temporal types"

[cc.behavior.temporal_omnicode.timestamp]
declare = "let created be timestamp"
now     = "timestamp.now()"
parse   = "timestamp.parse(\"2026-02-01T23:00:00Z\")"
format  = "created.format(\"RFC3339\")"
cast    = "as timestamp"

[cc.behavior.temporal_omnicode.duration]
declare     = "let timeout be duration"
literal_ns  = "1000ns"
literal_ms  = "100ms"
literal_s   = "30s"
literal_m   = "5m"
arithmetic  = "end - start"
cast        = "as duration"

[cc.behavior.temporal_cpisi]
description = "CPI-SI cognitive framework for temporal types"

[cc.behavior.temporal_cpisi.timestamp]
role     = "moment"
semantic = "when"
weight   = "substantial"
pattern  = "season"

[cc.behavior.temporal_cpisi.duration]
role     = "span"
semantic = "how_long"
weight   = "substantial"
pattern  = "season_length"

[cc.behavior.temporal_bindings]
description = "Language bindings for temporal types"

[cc.behavior.temporal_bindings.timestamp]
c_repr    = "trit81_t"
go_repr   = "Timestamp"
rust_repr = "Timestamp"
typedef   = "ttimestamp_t"

[cc.behavior.temporal_bindings.duration]
c_repr    = "trit81_t"
go_repr   = "Duration"
rust_repr = "Duration"
typedef   = "tduration_t"

