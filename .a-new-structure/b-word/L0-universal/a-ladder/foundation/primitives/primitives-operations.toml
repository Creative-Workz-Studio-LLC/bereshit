# ─────────────────────────────────────────────────────────────
# Co — Content Operations
# ─────────────────────────────────────────────────────────────

# Co TYPE OPERATIONS [OPERATIONS]
# ═════════════════════════════════════════════════════════════
#
# "A just weight and balance are the LORD's: all the weights of the bag are
#  his work." — Proverbs 16:11 KJV
#
# TYPE OPERATIONS: HOW PRIMITIVES INTERACT AND TRANSFORM
#
# Types don't exist in isolation. They convert, validate, coerce. Operations
# define how primitives relate to each other — what transformations are safe,
# what validations catch errors, what coercions happen implicitly.
#
# JUST WEIGHTS:
#   Proverbs speaks of honest measurement. Type operations ARE the weights and
#   measures of data. Conversion must preserve meaning. Validation must catch
#   real errors. Coercion must be explicit about what's lost.
#
# OPERATION CATEGORIES:
#   CONVERSION: Explicit transformation between compatible types
#   VALIDATION: Checking that values meet type constraints
#   COERCION:   Implicit transformation (automatic, requires care)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Register-width conversions, bit validation
#   L1 (System):    Syscall argument conversion, bounds checking
#   L2 (Runtime):   Object type conversion, null validation
#   L3 (Framework): Wire format conversion, schema validation
#   L4 (Health):    Metric normalization, threshold validation
#   L5 (Network):   Protocol conversion, packet validation
#   L6 (Storage):   Serialization, data integrity validation
#   L7 (Engine):    Rule conversion, constraint validation
#   L8 (App):       User input conversion, form validation
#
# ═════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
# Co.1 CONVERSION — Type Conversion Rules [CONVERSION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Divers weights are an abomination unto the LORD; and a false balance is
#  not good." — Proverbs 20:23 KJV
#
# CONVERSION: EXPLICIT, HONEST TRANSFORMATION
#
# Conversion changes a value from one type to another. Unlike coercion, conversion
# is EXPLICIT — the programmer states their intent. Honest conversion preserves
# meaning; it never silently truncates or corrupts.
#
# CONVERSION PRINCIPLES:
#   1. Widening is always safe (int9 → int27)
#   2. Narrowing requires validation (int27 → int9 may overflow)
#   3. Between families requires explicit rules (int → float)
#   4. Conversion failures are errors, not silent corruption
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Co.1a WIDENING — Safe Upward Conversion [WIDENING]
# ───────────────────────────────────────────────────────────────────────────────

[conversion.widening]
description  = "Safe conversion to larger types — no data loss possible"
principle    = "Widening is always safe"
explicit     = false                                          # Can be implicit

# Trit widening paths
[conversion.widening.trit]
description  = "Trit to larger types"
trit_to_int9   = { safe = true,  method = "direct",    note = "trit fits in int9" }
trit_to_int27  = { safe = true,  method = "direct",    note = "trit fits in int27" }
trit_to_bool3  = { safe = true,  method = "interpret", note = "-1=false, 0=unknown, 1=true" }
trit_to_float27 = { safe = true, method = "direct",    note = "integer to float" }

# Integer widening paths
[conversion.widening.integer]
description  = "Integer to larger integers"
int9_to_int27  = { safe = true,  method = "sign_extend", note = "9 trits → 27 trits" }
uint9_to_uint27 = { safe = true, method = "zero_extend", note = "9 trits → 27 trits" }
uint9_to_int27 = { safe = true,  method = "zero_extend", note = "unsigned fits in signed" }
int9_to_float27 = { safe = true, method = "direct",      note = "integer to float" }
int27_to_float27 = { safe = true, method = "direct",     note = "integer to float" }

# Trit5 widening paths
[conversion.widening.trit5]
description  = "Trit5 (packed) to larger types"
trit5_to_int9  = { safe = true,  method = "direct",    note = "243 states fit in int9" }
trit5_to_int27 = { safe = true,  method = "direct",    note = "243 states fit in int27" }
trit5_to_uint9 = { safe = true,  method = "direct",    note = "0-242 fits in uint9" }

# Widening at each layer
[conversion.widening.scales]
description  = "Widening usage at each architectural layer"
L0_kernel    = { use = "register promotion",               example = "trit → word register" }
L1_system    = { use = "syscall argument expansion",       example = "int9 arg → int27" }
L2_runtime   = { use = "array index promotion",            example = "uint9 → uint27 for large array" }
L3_framework = { use = "config value normalization",       example = "small int → standard size" }
L4_health    = { use = "metric aggregation",               example = "component score → total" }
L5_network   = { use = "sequence number expansion",        example = "short seq → long seq" }
L6_storage   = { use = "offset expansion",                 example = "small offset → large file" }
L7_engine    = { use = "priority promotion",               example = "local priority → global" }
L8_app       = { use = "quantity expansion",               example = "item count → total count" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.1b NARROWING — Checked Downward Conversion [NARROWING]
# ───────────────────────────────────────────────────────────────────────────────

[conversion.narrowing]
description  = "Conversion to smaller types — requires validation"
principle    = "Narrowing may lose data; must check"
explicit     = true                                           # MUST be explicit

# Integer narrowing paths
[conversion.narrowing.integer]
description  = "Integer to smaller integers"
int27_to_int9  = { safe = false, method = "checked",   overflow = "error", note = "may overflow" }
int27_to_uint9 = { safe = false, method = "checked",   overflow = "error", note = "may overflow or be negative" }
uint27_to_uint9 = { safe = false, method = "checked",  overflow = "error", note = "may overflow" }
int9_to_trit   = { safe = false, method = "checked",   overflow = "error", note = "only -1, 0, +1 valid" }

# Float narrowing paths
[conversion.narrowing.float]
description  = "Float to integer types"
float27_to_int27 = { safe = false, method = "truncate", note = "loses fractional part" }
float27_to_int9  = { safe = false, method = "checked",  note = "may overflow + truncate" }

# Trit5 narrowing paths
[conversion.narrowing.trit5]
description  = "Larger types to trit5"
int9_to_trit5  = { safe = false, method = "checked",   note = "only 0-242 valid" }
int27_to_trit5 = { safe = false, method = "checked",   note = "only 0-242 valid" }

# Narrowing behaviors
[conversion.narrowing.behaviors]
description  = "What happens when narrowing fails"
error        = { action = "return error",              when = "checked narrowing fails" }
saturate     = { action = "clamp to min/max",          when = "saturating mode enabled" }
truncate     = { action = "keep low bits/trits",       when = "truncating mode enabled" }
wrap         = { action = "modulo arithmetic",         when = "wrapping mode enabled" }

# Narrowing at each layer
[conversion.narrowing.scales]
description  = "Narrowing usage at each architectural layer"
L0_kernel    = { use = "register demotion",                example = "word → trit for flag" }
L1_system    = { use = "return code compression",          example = "int27 result → int9" }
L2_runtime   = { use = "index bounds check",               example = "computed index → array bound" }
L3_framework = { use = "config validation",                example = "user value → constrained range" }
L4_health    = { use = "score normalization",              example = "raw score → 0-100 range" }
L5_network   = { use = "header compression",               example = "long value → wire format" }
L6_storage   = { use = "compact storage",                  example = "large offset → extent" }
L7_engine    = { use = "priority compression",             example = "computed priority → byte" }
L8_app       = { use = "display formatting",               example = "precise value → rounded" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.1c CROSS_FAMILY — Between Type Families [CROSS_FAMILY]
# ───────────────────────────────────────────────────────────────────────────────

[conversion.cross_family]
description  = "Conversion between different type families"
principle    = "Different families require explicit semantics"
explicit     = true                                           # ALWAYS explicit

# Integer ↔ Float
[conversion.cross_family.integer_float]
description  = "Integer to/from floating point"
int_to_float = { method = "direct",   note = "exact for small integers" }
float_to_int = { method = "truncate", note = "loses fractional part" }

# Integer ↔ Boolean
[conversion.cross_family.integer_bool]
description  = "Integer to/from boolean"
int_to_bool  = { method = "zero_test", note = "0→unknown, positive→true, negative→false" }
bool_to_int  = { method = "direct",    note = "-1, 0, +1 directly" }

# Text ↔ Integer
[conversion.cross_family.text_integer]
description  = "Text to/from integer"
int_to_text  = { method = "format",    note = "produces decimal string" }
text_to_int  = { method = "parse",     note = "may fail if not numeric" }

# Any ↔ Specific
[conversion.cross_family.any_specific]
description  = "Any to/from specific types"
specific_to_any = { method = "box",     note = "wrap value with type tag" }
any_to_specific = { method = "unbox",   note = "extract and check type tag" }

# Cross-family at each layer
[conversion.cross_family.scales]
description  = "Cross-family usage at each architectural layer"
L0_kernel    = { use = "flag interpretation",              example = "int → bool for condition" }
L1_system    = { use = "error code to string",             example = "errno → message" }
L2_runtime   = { use = "string parsing",                   example = "\"42\" → int" }
L3_framework = { use = "JSON conversion",                  example = "any → specific type" }
L4_health    = { use = "metric formatting",                example = "float → display string" }
L5_network   = { use = "protocol encoding",                example = "struct → bytes" }
L6_storage   = { use = "serialization",                    example = "object → bytes → object" }
L7_engine    = { use = "rule evaluation",                  example = "expression → bool" }
L8_app       = { use = "form processing",                  example = "text input → typed value" }


# ═══════════════════════════════════════════════════════════════════════════════
# Co.2 VALIDATION — Type Validation Rules [VALIDATION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Prove all things; hold fast that which is good." — 1 Thessalonians 5:21 KJV
#
# VALIDATION: PROVING VALUES ARE CORRECT
#
# Validation checks that a value meets type constraints BEFORE use. It's the
# guard at the gate — bad values don't get in, good values proceed confidently.
#
# VALIDATION PRINCIPLES:
#   1. Validate at boundaries (input, API, storage)
#   2. Trust validated values internally (no redundant checks)
#   3. Fail fast and clear (errors describe the problem)
#   4. Validation is NOT conversion (it checks, doesn't transform)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Co.2a RANGE — Numeric Range Validation [RANGE]
# ───────────────────────────────────────────────────────────────────────────────

[validation.range]
description  = "Checking numeric values are within type bounds"
principle    = "Values must fit their declared type"

# Trit validation
[validation.range.trit]
description  = "Trit must be exactly -1, 0, or +1"
valid_values = [-1, 0, 1]
check        = "value in [-1, 0, 1]"
error        = "trit value must be -1, 0, or +1; got %d"

# Trit5 validation
[validation.range.trit5]
description  = "Trit5 must be 0-242 (packed) or -121 to +121 (balanced)"
packed_min   = 0
packed_max   = 242
balanced_min = -121
balanced_max = 121
check        = "(packed: 0 ≤ v ≤ 242) or (balanced: -121 ≤ v ≤ 121)"
error        = "trit5 value out of range; got %d"

# Integer validation
[validation.range.int9]
description  = "int9 range check"
min          = -9841
max          = 9841
check        = "-9841 ≤ v ≤ 9841"
error        = "int9 overflow; got %d, valid range [-9841, 9841]"

[validation.range.uint9]
description  = "uint9 range check"
min          = 0
max          = 19682
check        = "0 ≤ v ≤ 19682"
error        = "uint9 overflow; got %d, valid range [0, 19682]"

[validation.range.int27]
description  = "int27 (Word) range check"
min          = -3812798742493
max          = 3812798742493
check        = "-3812798742493 ≤ v ≤ 3812798742493"
error        = "int27 overflow; got %d, valid range [±3.8T]"

[validation.range.uint27]
description  = "uint27 range check"
min          = 0
max          = 7625597484986
check        = "0 ≤ v ≤ 7625597484986"
error        = "uint27 overflow; got %d, valid range [0, 7.6T]"

# Range validation at each layer
[validation.range.scales]
description  = "Range validation at each architectural layer"
L0_kernel    = { use = "register bounds",                  example = "ALU input validation" }
L1_system    = { use = "syscall args",                     example = "file descriptor range" }
L2_runtime   = { use = "array bounds",                     example = "index < length" }
L3_framework = { use = "config limits",                    example = "port 0-65535" }
L4_health    = { use = "score bounds",                     example = "0.0 ≤ health ≤ 1.0" }
L5_network   = { use = "protocol fields",                  example = "TTL 0-255" }
L6_storage   = { use = "offset bounds",                    example = "offset < file_size" }
L7_engine    = { use = "parameter limits",                 example = "priority 0-100" }
L8_app       = { use = "user input",                       example = "quantity > 0" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.2b NULL — Null/Empty Validation [NULL]
# ───────────────────────────────────────────────────────────────────────────────

[validation.null]
description  = "Checking for null/empty/void values"
principle    = "Know what emptiness means for each type"

# Nullable types
[validation.null.nullable]
description  = "Types that can be null"
nullable_types = ["text", "list", "map", "set", "any"]
non_nullable  = ["trit", "trit5", "int9", "uint9", "int27", "uint27", "bool3", "void"]

# Empty states
[validation.null.empty_states]
description  = "Empty value for each collection type"
text_empty   = { value = "\"\"",   check = "text.length == 0" }
list_empty   = { value = "[]",     check = "list.length == 0" }
map_empty    = { value = "{}",     check = "map.length == 0" }
set_empty    = { value = "{}",     check = "set.length == 0" }
any_null     = { value = "null",   check = "any == null" }

# Void handling
[validation.null.void_handling]
description  = "Void is not null — void means 'no value to check'"
void_meaning = "absence of return, not null pointer"
void_check   = "no check needed — void has no value"

# Null validation at each layer
[validation.null.scales]
description  = "Null validation at each architectural layer"
L0_kernel    = { use = "null pointer check",               example = "ptr != NULL" }
L1_system    = { use = "invalid handle",                   example = "fd != -1" }
L2_runtime   = { use = "nil check",                        example = "object != nil" }
L3_framework = { use = "missing config",                   example = "config.get(key) != null" }
L4_health    = { use = "missing metric",                   example = "metric.has_value()" }
L5_network   = { use = "disconnected",                     example = "conn != null" }
L6_storage   = { use = "missing record",                   example = "record.exists()" }
L7_engine    = { use = "undefined state",                  example = "state.is_defined()" }
L8_app       = { use = "empty input",                      example = "input.trim() != \"\"" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.2c FORMAT — Format Validation [FORMAT]
# ───────────────────────────────────────────────────────────────────────────────

[validation.format]
description  = "Validating text/data format patterns"
principle    = "Structure must match expected pattern"

# Text format patterns
[validation.format.text]
description  = "Common text validation patterns"
not_empty    = { pattern = ".+",                           note = "at least one character" }
alphanumeric = { pattern = "[a-zA-Z0-9]+",                 note = "letters and digits only" }
identifier   = { pattern = "[a-zA-Z_][a-zA-Z0-9_]*",       note = "valid identifier" }
integer_str  = { pattern = "-?[0-9]+",                     note = "numeric string" }
float_str    = { pattern = "-?[0-9]+\\.?[0-9]*",           note = "decimal string" }

# Trit string formats
[validation.format.trit_string]
description  = "Ternary literal format validation"
single_trit  = { pattern = "[T10N+-]",                     note = "single trit: T/+/1, 0, N/-" }
trit_array   = { pattern = "[T10N+-]+",                    note = "trit sequence" }
balanced     = { pattern = "-?[0-9]+t",                    note = "balanced ternary literal" }

# Collection format
[validation.format.collection]
description  = "Collection structure validation"
list_format  = { check = "ordered, allows duplicates",     note = "sequence semantics" }
map_format   = { check = "keys unique, values associated", note = "lookup semantics" }
set_format   = { check = "no duplicates, membership",      note = "membership semantics" }

# Format validation at each layer
[validation.format.scales]
description  = "Format validation at each architectural layer"
L0_kernel    = { use = "opcode format",                    example = "instruction encoding" }
L1_system    = { use = "path format",                      example = "valid filesystem path" }
L2_runtime   = { use = "string format",                    example = "valid UTF-8" }
L3_framework = { use = "config syntax",                    example = "valid TOML/JSON" }
L4_health    = { use = "metric name",                      example = "prometheus format" }
L5_network   = { use = "address format",                   example = "valid IP address" }
L6_storage   = { use = "record structure",                 example = "schema compliance" }
L7_engine    = { use = "rule syntax",                      example = "valid expression" }
L8_app       = { use = "user input",                       example = "email format" }


# ═══════════════════════════════════════════════════════════════════════════════
# Co.3 COERCION — Implicit Type Transformation [COERCION]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "Be not deceived; God is not mocked: for whatsoever a man soweth, that shall
#  he also reap." — Galatians 6:7 KJV
#
# COERCION: IMPLICIT TRANSFORMATION WITH CARE
#
# Coercion is automatic type conversion — the compiler/runtime does it without
# explicit instruction. This is powerful but dangerous. Implicit coercion can
# hide bugs, lose precision, or silently change meaning.
#
# COERCION PRINCIPLES:
#   1. Only coerce when meaning is preserved
#   2. Never coerce when precision is lost
#   3. Make dangerous coercions explicit
#   4. Document all coercion rules clearly
#
# YOU REAP WHAT YOU SOW:
#   Coercion that loses information is deceptive. If int27 coerces to int9 and
#   overflows silently, you've sown deception and will reap corruption. Honest
#   systems make lossy operations explicit.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# Co.3a SAFE_COERCION — Automatic Safe Transformations [SAFE_COERCION]
# ───────────────────────────────────────────────────────────────────────────────

[coercion.safe]
description  = "Coercions that are always safe — no information loss"
principle    = "Automatic coercion only when meaning is fully preserved"

# Trit coercions
[coercion.safe.trit]
description  = "Safe automatic trit conversions"
trit_to_int9   = { automatic = true,  note = "trit always fits in int9" }
trit_to_int27  = { automatic = true,  note = "trit always fits in int27" }
trit_to_bool3  = { automatic = true,  note = "same value space" }

# Integer widening coercions
[coercion.safe.integer]
description  = "Safe automatic integer widening"
int9_to_int27  = { automatic = true,  note = "int9 always fits in int27" }
uint9_to_uint27 = { automatic = true, note = "uint9 always fits in uint27" }
uint9_to_int27 = { automatic = true,  note = "unsigned fits in larger signed" }

# Trit5 coercions
[coercion.safe.trit5]
description  = "Safe automatic trit5 conversions"
trit5_to_int9  = { automatic = true,  note = "243 states fit in int9" }
trit5_to_int27 = { automatic = true,  note = "243 states fit in int27" }

# Safe coercion at each layer
[coercion.safe.scales]
description  = "Safe coercion at each architectural layer"
L0_kernel    = { use = "register promotion",               example = "trit → word in expression" }
L1_system    = { use = "argument promotion",               example = "small arg in large call" }
L2_runtime   = { use = "expression evaluation",            example = "int9 + int27 → int27" }
L3_framework = { use = "type unification",                 example = "common type in collection" }
L4_health    = { use = "metric combination",               example = "combine different precisions" }
L5_network   = { use = "protocol assembly",                example = "field widening" }
L6_storage   = { use = "index computation",                example = "offset calculation" }
L7_engine    = { use = "rule evaluation",                  example = "operand promotion" }
L8_app       = { use = "display preparation",              example = "value formatting" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.3b UNSAFE_COERCION — Requires Explicit Cast [UNSAFE_COERCION]
# ───────────────────────────────────────────────────────────────────────────────

[coercion.unsafe]
description  = "Coercions that require explicit cast — information may be lost"
principle    = "Never automatically lose information"

# Narrowing (NEVER automatic)
[coercion.unsafe.narrowing]
description  = "Narrowing is NEVER automatic"
int27_to_int9  = { automatic = false, reason = "may overflow" }
int27_to_trit  = { automatic = false, reason = "may overflow" }
float27_to_int = { automatic = false, reason = "loses fractional part" }
uint27_to_uint9 = { automatic = false, reason = "may overflow" }

# Signed/unsigned mixing (NEVER automatic)
[coercion.unsafe.signedness]
description  = "Sign conversion is NEVER automatic"
int9_to_uint9  = { automatic = false, reason = "negative values undefined" }
int27_to_uint27 = { automatic = false, reason = "negative values undefined" }
uint9_to_int9  = { automatic = false, reason = "large values overflow" }

# Any type (NEVER automatic TO specific)
[coercion.unsafe.any]
description  = "Any → specific is NEVER automatic"
any_to_int    = { automatic = false, reason = "runtime type check required" }
any_to_text   = { automatic = false, reason = "runtime type check required" }
any_to_list   = { automatic = false, reason = "runtime type check required" }

# Unsafe at each layer
[coercion.unsafe.scales]
description  = "Explicit cast usage at each architectural layer"
L0_kernel    = { use = "register demotion",                example = "cast<trit>(word)" }
L1_system    = { use = "error code extraction",            example = "cast<int9>(result)" }
L2_runtime   = { use = "index narrowing",                  example = "cast<uint9>(offset)" }
L3_framework = { use = "config extraction",                example = "value as int27" }
L4_health    = { use = "score rounding",                   example = "cast<int9>(score * 100)" }
L5_network   = { use = "header compression",               example = "cast<trit5>(length)" }
L6_storage   = { use = "compact encoding",                 example = "cast<uint9>(id)" }
L7_engine    = { use = "result extraction",                example = "cast<bool3>(eval)" }
L8_app       = { use = "form parsing",                     example = "value as int27" }

# ───────────────────────────────────────────────────────────────────────────────
# Co.3c ARITHMETIC_COERCION — In Expressions [ARITHMETIC_COERCION]
# ───────────────────────────────────────────────────────────────────────────────

[coercion.arithmetic]
description  = "How types coerce in arithmetic expressions"
principle    = "Promote to common type that preserves both operands"

# Binary operator promotion
[coercion.arithmetic.binary_ops]
description  = "Type promotion for binary operators (+, -, *, /, %)"
rule         = "Both operands promoted to larger type before operation"
trit_int9    = { result = "int9",   note = "trit promotes to int9" }
trit_int27   = { result = "int27",  note = "trit promotes to int27" }
int9_int27   = { result = "int27",  note = "int9 promotes to int27" }
int_float    = { result = "float27", note = "integer promotes to float" }

# Comparison promotion
[coercion.arithmetic.comparison]
description  = "Type promotion for comparisons (<, >, ==, !=)"
rule         = "Same as binary operators — promote to common type"
result       = "bool3"                                        # All comparisons return bool3

# Ternary expression
[coercion.arithmetic.ternary]
description  = "Type in ternary conditional (cond ? a : b)"
rule         = "a and b must have common type; result is that type"
example      = "flag ? int9_val : int27_val → int27"

# Arithmetic at each layer
[coercion.arithmetic.scales]
description  = "Arithmetic coercion at each architectural layer"
L0_kernel    = { use = "ALU operations",                   example = "reg1 + reg2" }
L1_system    = { use = "resource calculations",            example = "size + offset" }
L2_runtime   = { use = "expression evaluation",            example = "a * b + c" }
L3_framework = { use = "config computation",               example = "timeout * multiplier" }
L4_health    = { use = "score calculation",                example = "weight * value" }
L5_network   = { use = "checksum computation",             example = "sum of bytes" }
L6_storage   = { use = "offset calculation",               example = "base + index * stride" }
L7_engine    = { use = "rule evaluation",                  example = "priority comparison" }
L8_app       = { use = "business logic",                   example = "price * quantity" }

# ─────────────────────────────────────────────────────────────
# Extensions (reserved)
# ─────────────────────────────────────────────────────────────

[extensions]
note = "Reserved — no extensions for type operations"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["cws-struct lint toml primitives/primitives-operations.toml"]

[_validation.schema]
required = ["identity", "conversion", "validation", "coercion"]
optional = ["conversion.paths", "coercion.arithmetic", "extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_fields_present = 30
cross_references_valid = 30

