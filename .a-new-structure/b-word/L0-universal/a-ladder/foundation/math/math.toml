# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Mathematical constants are exact values. Lookup tables are complete truth tables. No approximations."
Cc = "Content Configurations — split file index, key constants, domain mapping"
Co = "Content Operations — (index file: references split content, no operations defined here)"
Cv = "Content Validation — schema requirements, health scoring"

# ─────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────

[identity]
name = "Balanced Ternary Mathematical Foundation"
version = "b-01.00"
domain = "math"
scope = "Pure math — definitions and operations. Cognition and generation are separate domains."

# ─────────────────────────────────────────────────────────────
# Split File Index
# ─────────────────────────────────────────────────────────────
#
# DOMAIN STRUCTURE
#
# math/ holds PURE mathematics — what trits are and how they compute.
# Cognition (how trits think) and generation (how trits become code)
# are separate top-level domains because they aren't pure math:
#
#   math/
#     math.toml                      ← This index
#     core/definitions.toml          ← What a trit IS
#     arithmetic/operations.toml     ← How trits compute
#
#   cognition/
#     cognition.toml                 ← CPI-SI paradigm bridge
#
#   generation/
#     generation.toml                ← Code generation tooling
#
# ORIGINAL SPLIT:
# The original ternary.toml (2414 lines) split 4 ways. Two stayed in math/,
# two were promoted to their own domains because they serve different purposes.

[index]
type = "split_index"
total_files = 2
total_subdomains = 2
original_lines = 2414

[index.key_constants]
balanced_equation = "-1 + 0 + 1 = 0"
byte_bridge = "243 = 3^5 < 256 = 2^8"
trit_values = "3 = 3^1"
power_base = "3^n for positional conversion"

[index.subdomains]
core = { path = "math/core/", description = "What a trit IS — identity, settings, resources, behavior" }
arithmetic = { path = "math/arithmetic/", description = "How trits compute — operations, adders, algorithms" }

[index.files]
definitions = { file = "core/definitions.toml", sections = "Cc.1-4", description = "Trit identity, settings, packing resources, runtime behavior" }
operations = { file = "arithmetic/operations.toml", sections = "Co.1-6", description = "Arithmetic truth tables, half/full adders, subtraction, division, algorithms" }

[index.sibling_domains]
cognition = { path = "cognition/cognition.toml", description = "CPI-SI paradigm bridge — building block, Genesis 1:1, dimensions, temporal" }
generation = { path = "generation/generation.toml", description = "Code generation — targets (C/Go/Rust), templates, validation" }

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "cws-struct lint toml math/math.toml",
    "cws-struct lint toml math/core/definitions.toml",
    "cws-struct lint toml math/arithmetic/operations.toml",
]

[_validation.schema]
required = ["identity", "index"]
optional = ["index.key_constants", "index.files", "index.subdomains", "index.sibling_domains"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_content_files_valid = 30
index_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


