# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Cc.1 IDENTITY — What Is a Trit?
# ─────────────────────────────────────────────────────────────
#
# "A threefold cord is not quickly broken." — Ecclesiastes 4:12
#
# THE ATOM OF BALANCED TERNARY
#
# A trit is the smallest unit of balanced ternary—a single digit with three
# possible values: -1 (negative), 0 (neutral), and +1 (positive). Unlike
# standard ternary (0, 1, 2), balanced ternary centers on zero.
#
# WHY BALANCED TERNARY MATTERS:
#
# The sum -1 + 0 + 1 = 0 expresses perfect mathematical balance. This isn't
# merely elegant—it has practical consequences:
#
#   • Sign is inherent: Negative values are first-class citizens, not encoded
#     with a separate sign bit. The value -5 in binary needs a sign bit plus
#     magnitude; in balanced ternary, it's simply represented directly.
#
#   • Rounding is natural: The nearest integer is found by truncating toward
#     zero, and rounding follows naturally from the representation.
#
#   • Direction is native: Movement toward/away from center maps directly to
#     +1/-1. This makes balanced ternary ideal for representing direction,
#     tendency, and state transitions.
#
# RELATIONSHIP TO BINARY:
#
# Binary hardware stores trits in bytes. The fundamental bridge is 243 = 3^5,
# which fits within a byte (256 = 2^8). See Cc.3.1 PACKING for details.
#
# Implementation: L0-universal/libtrit/include/trit/trit.h
#                 L0-universal/libtrit/src/matter/trit.op.c
#
# ─────────────────────────────────────────────────────────────

# Core identity of a trit
[trit]
name        = "trit"
description = "Single balanced ternary digit"
type        = "mathematical foundation"

# The three fundamental values
[trit.values]
numeric     = [-1, 0, 1]
labels      = ["negative", "neutral", "positive"]
short       = ["N", "Z", "P"]

# Mathematical constants derived from the definition
[trit.constants]
states      = 3
base        = 3
sum         = 0
product     = 0


# ═══════════════════════════════════════════════════════════════
# Cc.2 SETTINGS — Primary Definitions
# ═══════════════════════════════════════════════════════════════
#
# "A false balance is abomination to the LORD: but a just weight is his
#  delight." — Proverbs 11:1
#
# CONFIGURABLE REPRESENTATIONS
#
# Trits need to be displayed, parsed, stored, and transmitted. This section
# defines the various ways to represent trit values depending on context:
#
#   • Characters: How trits appear in text (display, config files, logs)
#   • Types: How trits are represented in programming languages
#   • Composition: How trits combine into larger units (3^n pattern)
#   • Scales: Named units with their properties
#
# The key insight is that 5 trits (243 states) fit perfectly in 1 byte
# (256 states), making "packed5" the fundamental unit for binary storage.
#
# ═══════════════════════════════════════════════════════════════

# Character representations for different contexts
[settings.chars]
standard    = ["-", "0", "+"]
ascii       = ["N", "Z", "P"]
arrow       = ["↓", "●", "↑"]
block       = ["▼", "■", "▲"]
wave        = ["∿", "―", "∼"]

# Type bindings for programming languages
[settings.types]
rust        = "i8"
c           = "int8_t"
go          = "int8"
bits        = 2
bytes       = 1

# Composition scales following the 3^n pattern
[settings.composition]
tryte       = 3
packed      = 5
tribble     = 9
trord       = 27
extended    = 81
block       = 243

# Named scales with full metadata
[settings.scales]
trit        = { count = 1,   states = 3,             bytes = 1,  layer = "L0" }
triplet     = { count = 3,   states = 27,            bytes = 1,  layer = "L1" }
nonet       = { count = 9,   states = 19683,         bytes = 2,  layer = "L2" }
tryte       = { count = 27,  states = 7625597484987, bytes = 6,  layer = "L3" }
octant      = { count = 81,  states = "4.4e38",      bytes = 18, layer = "L4" }
block_243   = { count = 243, states = "5.6e115",     bytes = 49, layer = "L5" }


# ═══════════════════════════════════════════════════════════════
# Cc.3 RESOURCES — Storage Constraints
# ═══════════════════════════════════════════════════════════════
#
# "For which of you, intending to build a tower, sitteth not down first,
#  and counteth the cost, whether he have sufficient to finish it?"
#  — Luke 14:28
#
# THE PHYSICAL REALITY OF TERNARY ON BINARY HARDWARE
#
# Modern hardware is binary. Every storage medium, every bus, every register
# operates in powers of 2. Balanced ternary must be packed into this binary
# world. This section defines exactly how that packing works.
#
# The fundamental bridge is the number 243:
#
#   243 = 3^5 (five trits)
#   256 = 2^8 (one byte)
#   243 < 256 → Five trits fit in one byte with 13 states to spare
#
# ═══════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────
# Cc.3.1 PACKING — Binary Bridge
# ───────────────────────────────────────────────────────────────
#
# TRIT-TO-BYTE PACKING
#
# The core insight: 3^5 = 243, which fits in 2^8 = 256. This means exactly
# 5 trits can be packed into 1 byte, using 243 of the 256 possible values.
#
# THE PACKING ALGORITHM (Horner's Method):
#
# To pack trits into an integer (MST-first):
#   result = 0
#   for each trit from MST to LST:
#       result = result × 3 + (trit + 1)
#
# To unpack an integer into trits (LST-first):
#   for each position from LST to MST:
#       trit = (value % 3) - 1
#       value = value / 3
#
# EFFICIENCY AT DIFFERENT SCALES:
#   5 trits  → 1 byte:  243 / 256    = 94.9% efficient (excellent)
#   9 trits  → 2 bytes: 19683 / 65536 = 30.0% efficient (acceptable)
#   27 trits → 6 bytes: 7.6T / 281T   = 2.7% efficient  (sparse but correct)
#
# THE 13-STATE GAP:
#   256 - 243 = 13 spare states used for WEB (Write/Erase/Burn):
#   States 243-246: Write operations
#   States 247-250: Erase operations
#   States 251-254: Burn operations
#   State 255:      Reserved/escape
#
# Implementation: L0-universal/libtrit/src/matter/pack.op.c
#
# ───────────────────────────────────────────────────────────────

# Core packing constants
[resources.packing]
trits_per_byte = 5
trit_states    = 243
byte_capacity  = 256
gap            = 13

# Packing efficiency at different widths
[resources.efficiency]
trit5          = 94.9
trit9          = 30.0
trit27         = 2.7

# WEB translation states (Write/Erase/Burn for ternary memory)
[resources.web]
write          = 243
erase          = 247
burn           = 251
reserved       = 255

# Standard packing widths and their properties
[resources.widths]
trit5          = { trits = 5,   bytes = 1,  states = 243 }
trit9          = { trits = 9,   bytes = 2,  states = 19683 }
trit27         = { trits = 27,  bytes = 6,  states = 7625597484987 }
trit81         = { trits = 81,  bytes = 18, states = "4.4e38" }
trit243        = { trits = 243, bytes = 49, states = "5.6e115" }

# Architecture alignment for cache and memory efficiency
[resources.alignment]
cache_line     = 64
page_size      = 4096
trits_per_line = 320
trits_per_page = 20480
blocks_per_page = 84

# OmniCode scalar type names and sizes
[resources.omnicode_types]
trit1          = { name = "trit",     trits = 1,   bytes = 1 }
trit3          = { name = "tryte",    trits = 3,   bytes = 1 }
