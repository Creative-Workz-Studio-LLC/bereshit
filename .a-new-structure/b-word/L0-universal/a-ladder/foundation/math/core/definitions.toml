# ═══════════════════════════════════════════════════════════════
# Cc.4 BEHAVIOR — Runtime Modes & Toggles
# ═══════════════════════════════════════════════════════════════
#
# "Choose you this day whom ye will serve." — Joshua 24:15
#
# RUNTIME SEMANTICS FOR BALANCED TERNARY
#
# Balanced ternary isn't just a storage format—it's a way of thinking about
# choice, direction, and state. This section maps trit values to their
# semantic meanings in OmniCode and CPI-SI:
#
#   -1 (negative): Break down, retreat, toward anchor, heavy
#    0 (neutral):  Anchor, hold, at rest, balanced
#   +1 (positive): Build up, advance, from anchor, light
#
# ═══════════════════════════════════════════════════════════════

# OmniCode language bindings for ternary operations
[behavior.omnicode]
keywords   = ["break_down", "anchor", "build_up"]
operators  = ["←", "◆", "→"]
modifiers  = ["toward", "at", "from"]
sigils     = ["-:", "0:", "+:"]

# CPI-SI cognitive state mappings
[behavior.cpisi]
direction  = ["toward_anchor", "at_anchor", "from_anchor"]
weight     = ["heavy", "balanced", "light"]
action     = ["retreat", "hold", "advance"]
genesis    = ["waters_below", "firmament", "waters_above"]

