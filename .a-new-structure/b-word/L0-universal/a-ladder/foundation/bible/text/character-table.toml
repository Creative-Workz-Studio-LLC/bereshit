[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "UPPERCASE character names with trit5 integer values"
constraint = "Bible data file — character-to-trit5 mapping for the OmniCode type system"
Cc = "Content Configurations — ASCII character table (0-127), extended characters (128-242)"
Co = "Content Operations — (data file: lookup-based, no operations defined here)"
Cv = "Content Validation — schema requirements, health scoring"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────

# Cc.0 IDENTITY — What Is This Config? [REQUIRED]
[identity]
name = "scripture-character-table"
version = "a-01.00"
description = "Character-to-trit5 value mapping for Scripture text encoding"
type = "bible-data"

# Cc.1 CHARACTER TABLE — ASCII Character to Trit5 Value Mapping
[character_table]
description = "ASCII character to trit5 value mapping"
total_values = 243
ascii_range = [0, 127]
spare_range = [128, 242]
note = "Each character maps to unique trit5 value for reversible encoding"

# Control characters and basic punctuation (0-31)
[character_table.control]
description = "Control characters and whitespace"
NUL = 0    # Null terminator
SOH = 1    # Start of heading (unused)
STX = 2    # Start of text (unused)
ETX = 3    # End of text (unused)
EOT = 4    # End of transmission (unused)
ENQ = 5    # Enquiry (unused)
ACK = 6    # Acknowledge (unused)
BEL = 7    # Bell (unused)
BS = 8     # Backspace (unused)
TAB = 9    # Horizontal tab
LF = 10    # Line feed (newline)
VT = 11    # Vertical tab (unused)
FF = 12    # Form feed (unused)
CR = 13    # Carriage return
SO = 14    # Shift out (unused)
SI = 15    # Shift in (unused)
DLE = 16   # Data link escape (unused)
DC1 = 17   # Device control 1 (unused)
DC2 = 18   # Device control 2 (unused)
DC3 = 19   # Device control 3 (unused)
DC4 = 20   # Device control 4 (unused)
NAK = 21   # Negative acknowledge (unused)
SYN = 22   # Synchronous idle (unused)
ETB = 23   # End of transmission block (unused)
CAN = 24   # Cancel (unused)
EM = 25    # End of medium (unused)
SUB = 26   # Substitute (unused)
ESC = 27   # Escape (unused)
FS = 28    # File separator (unused)
GS = 29    # Group separator (unused)
RS = 30    # Record separator (unused)
US = 31    # Unit separator (unused)

# Printable ASCII (32-126)
[character_table.printable]
description = "Printable ASCII characters"
SPACE = 32        # ' '
EXCLAIM = 33      # '!'
DQUOTE = 34       # '"'
HASH = 35         # '#'
DOLLAR = 36       # '$'
