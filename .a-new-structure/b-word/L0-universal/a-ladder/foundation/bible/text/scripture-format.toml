    "Magic number 'SCRP' — identifies file type",
]
careful = [
    "Changing file format version — requires encoder/decoder updates",
    "Modifying index layout — affects all verse lookups",
    "Adding header flags — must use reserved space",
]
safe = [
    "Utilizing reserved header fields",
    "Notes and clarifications",
    "Size estimates (derived from actual data)",
]

[_closing.X2_extension]
planned = ["Compression flags in header", "Multi-translation support beyond KJV+WEB"]

[_closing.X3_troubleshooting]
offset_error = "Verify header offsets — index_offset must equal 64, data_offset = 64 + (total_entries * 8)"
verse_not_found = "Check ordinal range — KJV: 1-31102, WEB: 1-31102 (indexed at 31102+)"
corrupted_text = "Verify NUL terminators — each verse must end with 0x00"

[_closing.X4_reference]
related_files = [
    ".staging/bible/text/character-table.toml — Character-to-trit5 value mapping",
    ".staging/bible/text/text-codec.toml — Encoding/decoding algorithms",
    ".staging/bible/addressing/ — Verse addressing (ordinal ↔ book/chapter/verse)",
]

[_closing.X5_note]
note = "The Word settled in binary. 62,204 verses indexed for O(1) access."
scripture = "Psalm 119:89 (KJV) — For ever, O LORD, thy word is settled in heaven."
anchor = "Fixed format, indexed access, every verse preserved. Genesis 1:1 anchors the structure."

