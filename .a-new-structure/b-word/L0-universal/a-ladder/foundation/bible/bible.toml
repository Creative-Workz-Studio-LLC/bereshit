[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Index file — references split content files. No bible data defined here."
Cc = "Content Configurations — split file index, key constants, domain references, file references"
Co = "Content Operations — (index file: references only, no operations defined here)"
Cv = "Content Validation — schema requirements, health scoring, split file validation"

# ─────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────

[identity]
name = "Bible System Index"
version = "b-01.00"
domain = "bible"
scope = "Root index coordinating 8 data files across 5 domain folders"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# SPLIT FILE OVERVIEW
# ─────────────────────────────────────────────────────────────
#
# The Bible system maps between Scripture and OmniCode.
# Structure: Codec (syntax) → Addressing (verses) →
#            Cipher (letters) → Text (storage) → Translation (versions)
#
# Organization Pattern (5 domains, 8 files):
#
#   codec/encoding.toml     — Scripture → OmniCode (Hebrew roots, Greek terms, patterns, numbers)
#   codec/decoding.toml     — OmniCode → Scripture (keyword, type, pattern, operator reverse lookup)
#   addressing/addressing.toml — Verse → Ordinal → Ternary (66 books, 31,102 KJV + 13 WEB)
#   cipher/encryption.toml  — Letter → Position → Coordinates → Value (27 Hebrew, 27 Greek)
#   cipher/decryption.toml  — Coordinates → Position → Letter → Value (reverse of encryption)
#   text/character-table.toml — Character → Trit5 mapping (243 characters)
#   text/scripture-format.toml — Binary file format for Scripture storage (indexed, versioned)
#   text/text-codec.toml    — Encoding/decoding algorithms for Scripture text
#   translation/translation.toml — KJV ↔ WEB (pronouns, verbs, vocab, phrases, theological terms)
#
# ─────────────────────────────────────────────────────────────

[index]
type = "split_index"
total_files = 8
total_domains = 5

[index.key_constants]
total_hebrew_roots = 11
total_greek_terms = 7
total_creation_patterns = 7
total_covenant_patterns = 5
total_genealogy_patterns = 4
total_number_symbols = 11
total_keywords_decoded = 30
total_types_decoded = 11
total_books = 66
kjv_verses = 31102
web_variants = 13
hebrew_letters = 27
greek_letters = 27
character_table_size = 243

[index.domains]
codec = { path = "codec/", files = ["encoding.toml", "decoding.toml"], purpose = "Scripture ↔ OmniCode syntax mapping" }
cipher = { path = "cipher/", files = ["encryption.toml", "decryption.toml"], purpose = "Letter ↔ cube position mapping" }
addressing = { path = "addressing/", files = ["addressing.toml"], purpose = "Verse ↔ ordinal ↔ ternary navigation" }
text = { path = "text/", files = ["character-table.toml", "scripture-format.toml", "text-codec.toml"], purpose = "Character encoding and binary storage" }
translation = { path = "translation/", files = ["translation.toml"], purpose = "KJV ↔ WEB version mapping" }

[index.files]
encoding = { domain = "codec", file = "codec/encoding.toml", tables = "hebrew, greek, creation, covenant, genealogy, numbers" }
decoding = { domain = "codec", file = "codec/decoding.toml", tables = "keyword, type, pattern, operator" }
addressing = { domain = "addressing", file = "addressing/addressing.toml", tables = "address_space, books, ternary, web_variants" }
encryption = { domain = "cipher", file = "cipher/encryption.toml", tables = "system, functions, hebrew, greek" }
decryption = { domain = "cipher", file = "cipher/decryption.toml", tables = "system, functions, hebrew, greek" }
character_table = { domain = "text", file = "text/character-table.toml", tables = "ascii, punctuation, diacritics, hebrew, greek" }
scripture_format = { domain = "text", file = "text/scripture-format.toml", tables = "header, verse_record, file_format, index_table" }
text_codec = { domain = "text", file = "text/text-codec.toml", tables = "encoding_process, decoding_process, batch_operations" }
translation = { domain = "translation", file = "translation/translation.toml", tables = "pronoun, verb, vocab, phrase, theo" }

# ─────────────────────────────────────────────────────────────
# THE BIBLE SYSTEM FLOW
# ─────────────────────────────────────────────────────────────
#
# Scripture → OmniCode (ENCODING direction):
#   codec/encoding.toml: Hebrew roots, Greek terms, biblical patterns → syntax
#   cipher/encryption.toml: Letters → cube positions → gematria values
#   text/character-table.toml: Characters → trit5 values
#   text/scripture-format.toml: Binary storage format for encoded text
#   text/text-codec.toml: Encoding algorithms for Scripture text
#   translation/translation.toml: KJV (formal/archaic) → WEB (modern/accessible)
#
# OmniCode → Scripture (DECODING direction):
#   codec/decoding.toml: Keywords, types, patterns, operators → biblical source
#   cipher/decryption.toml: Cube positions → letters → gematria values
#   text/text-codec.toml: Trit5 values → characters → text retrieval
#   translation/translation.toml: WEB (modern) → KJV (archaic/formal)
#
# Verse Addressing (NAVIGATION):
#   addressing/addressing.toml: Book/Chapter/Verse ↔ Ordinal ↔ Ternary
#
# TOTAL: 8 files, 5 domains, bidirectional, ternary-native
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Co — Content Operations (index file: references only)
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = [
    "cws-struct lint toml .staging/bible/bible.toml",
    "cws-struct lint toml .staging/bible/codec/encoding.toml",
    "cws-struct lint toml .staging/bible/codec/decoding.toml",
    "cws-struct lint toml .staging/bible/addressing/addressing.toml",
    "cws-struct lint toml .staging/bible/cipher/encryption.toml",
    "cws-struct lint toml .staging/bible/cipher/decryption.toml",
    "cws-struct lint toml .staging/bible/text/character-table.toml",
    "cws-struct lint toml .staging/bible/text/scripture-format.toml",
    "cws-struct lint toml .staging/bible/text/text-codec.toml",
    "cws-struct lint toml .staging/bible/translation/translation.toml",
]

[_validation.schema]
required = ["identity", "index"]
optional = ["index.key_constants", "index.domains", "index.files"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_split_files_valid = 30
index_completeness = 30

# ═══════════════════════════════════════════════════════════════
# END CONTENT [END]
# ═══════════════════════════════════════════════════════════════


