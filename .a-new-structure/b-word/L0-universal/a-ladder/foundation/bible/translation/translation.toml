[_metadata.I3_instance]
file = "translation.toml"
title = "Bible Translation Map"
component = "KJV to WEB translation mapping — pronouns, verbs, vocabulary, phrases, theological terms between encoded (KJV) and decoded (WEB) forms"
path = ".staging/bible/translation/translation.toml"
provides = ["TRANSLATION_DATA"]
brief = "Same truth, different forms. Maps 5 pronouns, 10 verb forms, 12 vocabulary items, 6 key phrases, and 10 theological terms between KJV and WEB."

[_metadata.I4_architecture]
