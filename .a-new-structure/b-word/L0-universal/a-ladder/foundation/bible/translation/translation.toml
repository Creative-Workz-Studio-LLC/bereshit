[_validation]
commands = ["cws-struct lint toml translation.toml"]

[_validation.schema]
required = ["pronoun", "verb", "vocab", "phrase", "theo"]
optional = []

[_validation.health_scoring]
total = 100
correct_structure = 40
all_tables_valid = 30
data_completeness = 30

