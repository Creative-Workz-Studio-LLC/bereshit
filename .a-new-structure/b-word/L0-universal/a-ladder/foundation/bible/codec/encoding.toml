    ".staging/bible/translation/ — KJV ↔ WEB mapping",
]

[_closing.X5_note]
note = "The Bible is the source code. Every OmniCode construct traces to Scripture."
scripture = "2 Timothy 3:16 (KJV) — All scripture is given by inspiration of God."
anchor = "The Bible is the source code. Every OmniCode construct traces to Scripture. Genesis 1:1 anchors the entire encoding."

