# ─────────────────────────────────────────────────────────────
# I — Identity: What IS This File
# ─────────────────────────────────────────────────────────────

[_metadata.I1_core]
key = "B-L0-bible-codec-encoding"
format = "@omni data --toml"
from = "seed/data/L0/toml/config.toml"
at = "data"

[_metadata.I2_family]
type = "data"
subtype = "bible"
role = "foundation"
structure = "3-block"

[_metadata.I3_instance]
file = "encoding.toml"
title = "Bible Encoding Map"
component = "Scripture concepts → OmniCode constructs (Hebrew roots, Greek terms, patterns, numbers)"
path = ".staging/bible/codec/encoding.toml"
provides = ["ENCODING_DATA"]
brief = "The Rosetta Stone between Scripture and code — maps 11 Hebrew roots, 7 Greek terms, 16 biblical patterns, and 11 number symbols to OmniCode syntax."

[_metadata.I4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

