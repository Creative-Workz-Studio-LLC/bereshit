principle = "The Bible is the codex. This file is the Rosetta Stone between Scripture and code."
anchor = "Genesis 1:1 anchors the entire encoding. Every OmniCode construct traces to Scripture."

[_metadata.C4_dependencies]
requires = ["word/scripture/KJV/", "word/scripture/WEB/", "word/glossary/biblical/"]
