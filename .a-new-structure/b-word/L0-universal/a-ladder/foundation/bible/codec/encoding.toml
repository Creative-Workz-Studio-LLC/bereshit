[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Bible data file — concept-level encoding map for the OmniCode type system"
Cc = "Content Configurations — Hebrew roots (11), Greek terms (7), creation patterns (7), covenant patterns (5), genealogy patterns (4), number symbolism (11)"
Co = "Content Operations — (data file: mapping-based, no operations defined here)"
Cv = "Content Validation — schema requirements, health scoring"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations
# ─────────────────────────────────────────────────────────────

# Cc.0 IDENTITY [REQUIRED]
[identity]
name = "bible-encoding-map"
version = "a-01.00"
description = "Scripture concepts → OmniCode constructs encoding map"
type = "bible-data"

# Cc.1 HEBREW ROOTS — Scripture Concepts → OmniCode Constructs
[hebrew.bara]
root = "ברא"
transliteration = "bara"
meaning = "to create (ex nihilo)"
semantic_field = "creation"
scripture = "Genesis 1:1"
scripture_text = "In the beginning God created (bara) the heaven and the earth"
omnicode_mapping = "declaration"
maps_to = ["let", "there shall be"]
note = "Divine creation from nothing — foundational to all declarations"

[hebrew.hayah]
root = "היה"
transliteration = "hayah"
meaning = "to be, to become, to exist"
semantic_field = "existence"
scripture = "Exodus 3:14"
scripture_text = "I AM THAT I AM (ehyeh asher ehyeh)"
omnicode_mapping = "identity"
maps_to = ["be", "is"]
note = "The verb of being — core to type identity and assignment"

[hebrew.badal]
root = "בדל"
transliteration = "badal"
meaning = "to separate, to divide, to distinguish"
semantic_field = "separation"
scripture = "Genesis 1:4"
scripture_text = "And God divided (badal) the light from the darkness"
omnicode_mapping = "distinction"
maps_to = ["distinct", "or", "from"]
note = "Creation by separation — types are distinguished from each other"

[hebrew.qara]
root = "קרא"
transliteration = "qara"
meaning = "to call, to name, to proclaim"
semantic_field = "naming"
scripture = "Genesis 1:5"
scripture_text = "And God called (qara) the light Day"
omnicode_mapping = "naming"
maps_to = ["called", "as"]
note = "Naming establishes identity — type aliases and field names"

[hebrew.asah]
root = "עשה"
transliteration = "asah"
meaning = "to make, to do, to produce"
semantic_field = "production"
scripture = "Genesis 1:7"
scripture_text = "And God made (asah) the firmament"
omnicode_mapping = "construction"
maps_to = ["with", "struct creation"]
note = "Making from existing material — composing types from primitives"

[hebrew.yalad]
root = "ילד"
transliteration = "yalad"
meaning = "to beget, to bear, to bring forth"
semantic_field = "generation"
scripture = "Genesis 5:3"
scripture_text = "And Adam...begat (yalad) a son in his own likeness"
omnicode_mapping = "inheritance"
maps_to = ["begat", "from"]
note = "Genealogical begetting — type inheritance preserves likeness"

[hebrew.brit]
root = "ברית"
transliteration = "brit"
meaning = "covenant, treaty, agreement"
semantic_field = "covenant"
scripture = "Genesis 15:18"
scripture_text = "The LORD made a covenant (brit) with Abram"
omnicode_mapping = "interface"
maps_to = ["covenant", "promises", "enters covenant with"]
note = "Binding agreement — interface contracts define promises"

[hebrew.natan]
root = "נתן"
transliteration = "natan"
meaning = "to give, to put, to set"
semantic_field = "giving"
scripture = "Genesis 1:29"
scripture_text = "I have given (natan) you every herb bearing seed"
omnicode_mapping = "parameter"
maps_to = ["given"]
note = "Divine giving — parameters are what's given to functions"

[hebrew.shuv]
root = "שוב"
transliteration = "shuv"
meaning = "to return, to restore, to bring back"
semantic_field = "return"
scripture = "Genesis 8:11"
scripture_text = "And the dove came in (shuv) to him in the evening"
omnicode_mapping = "return value"
maps_to = ["returning"]
note = "Returning with something — functions return values"

[hebrew.tohu]
root = "תהו"
transliteration = "tohu"
meaning = "formless, void, chaos, emptiness"
semantic_field = "absence"
scripture = "Genesis 1:2"
scripture_text = "And the earth was without form (tohu) and void"
omnicode_mapping = "void/null"
maps_to = ["void", "can be void"]
note = "Pre-creation state — absence of value before assignment"

[hebrew.vav]
root = "ו"
transliteration = "vav"
meaning = "and (conjunction)"
semantic_field = "connection"
scripture = "Genesis 1:1-31"
scripture_text = "And...and...and (vav used 100+ times)"
omnicode_mapping = "conjunction"
maps_to = ["and", "with"]
note = "The connector — chains elements together in Genesis 1"


# Cc.2 GREEK TERMS — Key Terms → OmniCode Constructs
[greek.logos]
term = "λόγος"
transliteration = "logos"
meaning = "word, reason, logic, account"
scripture = "John 1:1"
scripture_text = "In the beginning was the Word (Logos)"
omnicode_mapping = "language itself"
maps_to = ["OmniCode syntax", "text type"]
note = "The Word through whom all was made — language creates reality"

[greek.aletheia]
term = "ἀλήθεια"
transliteration = "aletheia"
meaning = "truth, reality, unconcealment"
scripture = "John 14:6"
scripture_text = "I am the way, the truth (aletheia), and the life"
omnicode_mapping = "bool3.true"
maps_to = ["true", "truth"]
note = "Unconcealed reality — true is definite affirmation"

[greek.pseudos]
term = "ψεῦδος"
transliteration = "pseudos"
meaning = "lie, falsehood, deception"
scripture = "Romans 1:25"
scripture_text = "Who changed the truth of God into a lie (pseudos)"
omnicode_mapping = "bool3.false"
maps_to = ["false"]
note = "That which contradicts truth — false is definite negation"

[greek.diatheke]
term = "διαθήκη"
transliteration = "diatheke"
meaning = "covenant, testament, will"
scripture = "Hebrews 8:6"
scripture_text = "He is the mediator of a better covenant (diatheke)"
omnicode_mapping = "interface/contract"
maps_to = ["covenant", "interface"]
note = "New covenant concept — builds on Hebrew brit"

[greek.tupos]
term = "τύπος"
transliteration = "tupos"
meaning = "type, pattern, example, model"
scripture = "Romans 5:14"
scripture_text = "Adam...who is the figure (tupos) of him that was to come"
omnicode_mapping = "type system"
maps_to = ["type", "struct", "pattern"]
note = "Origin of word 'type' — pattern that other things follow"

[greek.genos]
term = "γένος"
transliteration = "genos"
meaning = "kind, race, offspring, family"
scripture = "1 Peter 2:9"
scripture_text = "Ye are a chosen generation (genos)"
omnicode_mapping = "generic"
maps_to = ["whatsoever", "generic types"]
note = "Origin of word 'generic' — a kind that encompasses many"

[greek.kleronomia]
term = "κληρονομία"
transliteration = "kleronomia"
meaning = "inheritance, heritage, portion"
scripture = "Ephesians 1:14"
scripture_text = "The earnest of our inheritance (kleronomia)"
omnicode_mapping = "inheritance"
maps_to = ["begat", "from", "inheritance"]
note = "What's passed down — child types inherit from parent"


# Cc.3 CREATION PATTERNS (Genesis 1) → Declaration Syntax
[creation.let_there_be]
biblical_pattern = "Let there be [thing]"
scripture = "Genesis 1:3"
scripture_text = "And God said, Let there be light: and there was light"
syntactic_role = "existence declaration"
omnicode_form = "there shall be [type]"
example = "there shall be trit"
note = "Declaring that something exists — primitive type declaration"

[creation.let_thing_be]
biblical_pattern = "Let [thing] be [property]"
scripture = "Genesis 1:6"
scripture_text = "Let there be a firmament in the midst of the waters"
syntactic_role = "value assignment"
omnicode_form = "let [name] be [value]"
example = "let health be 65"
note = "Assigning a value to something — variable initialization"

[creation.god_made]
biblical_pattern = "God made [thing] with [property]"
scripture = "Genesis 1:16"
scripture_text = "And God made two great lights"
syntactic_role = "struct creation"
omnicode_form = "let [Type] be with [fields]"
example = "let Light be with brightness as uint9"
note = "Creating something with properties — struct definition"

[creation.god_called]
biblical_pattern = "God called [thing] [name]"
scripture = "Genesis 1:5"
scripture_text = "And God called the light Day"
syntactic_role = "naming/aliasing"
omnicode_form = "[Type] also called [alias]"
example = "DayLight also called Light"
note = "Giving a name — type alias"

[creation.god_divided]
biblical_pattern = "God divided [thing] from [thing]"
scripture = "Genesis 1:4"
scripture_text = "And God divided the light from the darkness"
syntactic_role = "distinction/separation"
omnicode_form = "[Type] distinct from [other]"
example = "Day distinct from Night"
note = "Separating things — creating distinct types"

[creation.after_its_kind]
biblical_pattern = "[thing] after his/its kind"
scripture = "Genesis 1:21"
scripture_text = "Every living creature...after their kind"
syntactic_role = "type constraint"
omnicode_form = "list of [Type]"
example = "list of Creature"
note = "Things produce their own kind — type-safe collections"

[creation.and_it_was_so]
biblical_pattern = "And it was so"
scripture = "Genesis 1:7"
scripture_text = "And God made the firmament...and it was so"
syntactic_role = "declaration confirmation"
omnicode_form = "(declaration complete)"
example = "// compiler confirms declaration"
note = "What God speaks comes to be — declarations take effect"


# Cc.4 COVENANT PATTERNS (Exodus 19) → Interface Contracts
[covenant.if_ye_will]
biblical_pattern = "If ye will [condition]"
scripture = "Exodus 19:5"
scripture_text = "If ye will obey my voice indeed"
syntactic_role = "precondition"
omnicode_form = "when [condition] then"
example = "when path exists then"
note = "Covenant preconditions — method preconditions"

[covenant.i_will_be]
biblical_pattern = "I will be [role] to you"
scripture = "Exodus 6:7"
scripture_text = "I will take you to me for a people, and I will be to you a God"
syntactic_role = "provider declaration"
omnicode_form = "[Provider] promises to [capability]"
example = "HealthProvider promises to ReadHealth"
note = "Divine promise — interface method declaration"

[covenant.ye_shall_be]
biblical_pattern = "Ye shall be [role] unto me"
scripture = "Exodus 19:6"
scripture_text = "Ye shall be unto me a kingdom of priests"
syntactic_role = "implementer declaration"
omnicode_form = "[Impl] enters covenant with [Interface]"
example = "BhealthProvider enters covenant with HealthProvider"
note = "Covenant obligation — implementing an interface"

[covenant.i_have_given]
biblical_pattern = "I have given you [thing]"
scripture = "Genesis 1:29"
scripture_text = "I have given you every herb bearing seed"
syntactic_role = "parameter provision"
omnicode_form = "given [param]"
example = "given path as text"
note = "What's provided — function parameters"

[covenant.bring_back]
biblical_pattern = "[thing] returned/came back"
scripture = "Genesis 8:11"
scripture_text = "And the dove came in to him"
syntactic_role = "return declaration"
omnicode_form = "returning [type]"
example = "returning Health"
note = "What comes back — return type"


# Cc.5 GENEALOGY PATTERNS (Matthew 1) → Inheritance/Derivation
[genealogy.begat]
biblical_pattern = "[Parent] begat [Child]"
scripture = "Matthew 1:2"
scripture_text = "Abraham begat Isaac; and Isaac begat Jacob"
syntactic_role = "type derivation"
omnicode_form = "[Parent] begat [Child]"
example = "Person begat Employee"
note = "Parent produces child — type inheritance"

[genealogy.in_likeness]
biblical_pattern = "in his own likeness"
scripture = "Genesis 5:3"
scripture_text = "Adam...begat a son in his own likeness"
syntactic_role = "field inheritance"
omnicode_form = "(child has parent fields)"
example = "Employee has Person's name, age"
note = "Child resembles parent — inheriting fields"

[genealogy.generations_of]
biblical_pattern = "the generations of [ancestor]"
scripture = "Genesis 5:1"
scripture_text = "This is the book of the generations of Adam"
syntactic_role = "type hierarchy"
omnicode_form = "(inheritance chain)"
example = "Person → Employee → Manager"
note = "Line of descent — type hierarchy"

[genealogy.son_of]
biblical_pattern = "[Name], son of [Parent]"
scripture = "Matthew 1:1"
scripture_text = "Jesus Christ, the son of David, the son of Abraham"
syntactic_role = "lineage declaration"
omnicode_form = "[Child] from [Parent]"
example = "Employee from Person"
note = "Declares parentage — derived type declaration"


# Cc.6 NUMBER SYMBOLISM → Type System Properties
[numbers.one]
number = 1
biblical_meaning = "unity, primacy, God"
scripture = "Deuteronomy 6:4"
scripture_text = "Hear, O Israel: The LORD our God is one LORD"
omnicode_mapping = "trit (single unit)"
significance = "The indivisible unit — trit as atomic type"

[numbers.three]
number = 3
biblical_meaning = "divine completeness, the Trinity"
scripture = "1 John 5:7"
scripture_text = "There are three that bear record in heaven"
omnicode_mapping = "ternary system base"
significance = "Foundation of ternary computing — 3 states: -1, 0, +1"

[numbers.five]
number = 5
biblical_meaning = "grace, God's goodness, trit-byte"
scripture = "Matthew 14:17"
scripture_text = "We have here but five loaves"
omnicode_mapping = "trit5 (trit-byte)"
significance = "5 trits pack into one byte — grace of efficient encoding"

[numbers.seven]
number = 7
biblical_meaning = "completion, perfection, rest"
scripture = "Genesis 2:2"
scripture_text = "And on the seventh day God ended his work"
omnicode_mapping = "completion cycles"
significance = "Iterative completion — development cycles, health decay periods"

[numbers.nine]
number = 9
biblical_meaning = "finality, divine judgment, 3×3"
scripture = "Matthew 27:46"
scripture_text = "About the ninth hour Jesus cried"
omnicode_mapping = "int9, uint9"
significance = "3×3 trits — first compound integer size"

[numbers.twelve]
number = 12
biblical_meaning = "governmental perfection, the tribes, apostles"
scripture = "Revelation 21:12"
scripture_text = "And had twelve gates"
omnicode_mapping = "organizational structures"
significance = "Complete organizational units — 12 relates to governance"

[numbers.twenty_seven]
number = 27
biblical_meaning = "3×3×3, complete divine structure"
scripture = "(mathematical: 3³)"
scripture_text = "Foundation of ternary word size"
omnicode_mapping = "int27, uint27 (word size)"
significance = "The Word size — 27 trits is the fundamental unit"

[numbers.forty]
number = 40
biblical_meaning = "testing, trial, preparation"
scripture = "Matthew 4:2"
scripture_text = "When he had fasted forty days and forty nights"
omnicode_mapping = "testing periods"
significance = "Preparation before deployment — test cycles"

[numbers.two_fifty_five]
number = 255
biblical_meaning = "maximum 8-bit value (derived) — storage capacity"
scripture = "(mathematical: 2⁸-1)"
scripture_text = "Full storage capacity for health"
omnicode_mapping = "health.storage_max (uint8)"
significance = "Storage foundation — 255 maps to +100 (perfect) on ternary interpretation scale"
note = "Health uses layered design: uint8 storage (0-255) → ternary interpretation (-100 to +100)"

[numbers.one_hundred]
number = 100
biblical_meaning = "completeness, fullness, totality"
scripture = "Matthew 18:12"
scripture_text = "If a man have an hundred sheep, and one of them be gone astray"
omnicode_mapping = "health.interpretation_max"
significance = "Perfect health on ternary scale (+100) — integrity, wholeness"
note = "Health interpretation ranges: -100 (broken) ↔ 0 (even) ↔ +100 (perfect)"

[numbers.negative_one_hundred]
number = -100
biblical_meaning = "complete deficiency, total lack"
scripture = "Job 31:6"
scripture_text = "Let me be weighed in an even balance"
omnicode_mapping = "health.interpretation_min"
significance = "Minimum health on ternary scale — broken, in need of restoration"
note = "The ternary scale enables: wanting (-100 to -34), lacking (-33 to -1), even (0), sound (+1 to +33), whole (+34 to +66), perfect (+67 to +100)"

