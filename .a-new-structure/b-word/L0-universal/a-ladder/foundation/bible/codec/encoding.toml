    "1. Add new entries following existing table structure",
    "2. Ensure all required fields present",
    "3. Verify bidirectional consistency with decoding.toml",
    "4. Run TOML validation",
]

[_closing.X3_troubleshooting]
invalid_toml = "Missing quotes, duplicate keys, or bare keys with special characters"
missing_reference = "Check encoding_ref/scripture fields — all must point to valid sources"
