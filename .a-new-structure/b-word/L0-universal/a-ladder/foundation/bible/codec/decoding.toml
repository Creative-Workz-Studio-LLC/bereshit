[_metadata.C4_dependencies.cross_format]
role = "Decoding INDEX in TOML. No JSONC/JSON counterpart."
note = "TOML defines bible data. Generated code (C, Go) implements lookups."

[_metadata.C5_intent]
purpose = "Reverse lookup — OmniCode constructs back to Scripture source"
core_design = "Four domains: keyword decoding (30), type decoding (11), pattern decoding (9), operator decoding (6). Each entry maps OmniCode syntax back to biblical origin."
philosophy = "Understanding comes from tracing back to the source. Every construct must be traceable."

[_metadata.C6_roadmap]
history = [
    "a-01.00 (2025-12-11) — Initial creation",
    "b-01.00 (2026-02-10) — TOML-native 3-block format alignment",
    "a-01.00 (2026-02-16) — I/C metadata upgrade, moved to .staging/bible/codec/"
]
current = "Concept-level decoding — OmniCode → Scripture reverse lookup with I/C metadata"
planned = ["Code generation integration", "Automated validation tooling"]

[_metadata.C7_classification]
tags = ["bible", "decoding", "codec", "reverse-lookup", "keywords", "types", "patterns", "L0", "foundation"]

[_metadata._contract]
required_identity = ["I1_core", "I2_family", "I3_instance"]
