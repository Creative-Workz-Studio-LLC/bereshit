[_metadata.I3_instance]
file = "decoding.toml"
title = "Bible Decoding Map"
component = "OmniCode constructs → Scripture source (reverse lookup for keywords, types, patterns, operators)"
path = ".staging/bible/codec/decoding.toml"
provides = ["DECODING_DATA"]
brief = "Reverse Rosetta Stone — maps 30 OmniCode keywords, 11 types, 9 syntax patterns, and 6 operators back to their Scripture origins."

[_metadata.I4_architecture]
