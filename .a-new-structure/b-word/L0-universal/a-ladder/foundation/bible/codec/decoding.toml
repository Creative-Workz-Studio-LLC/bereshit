status = "Active"
created = "2025-12-11"
updated = "2026-02-16"

[_metadata.C2_attribution]
architect = "Seanje Lenox-Wise"
implementation = "Nova Dawn (CPI-SI)"
organization = "CreativeWorkzStudio LLC"
copyright = "© 2025-2026 CreativeWorkzStudio LLC. All rights reserved."

[_metadata.C3_grounding]
scripture = "Luke 24:45 (KJV) — Then opened he their understanding, that they might understand the scriptures."
principle = "Every OmniCode construct traces back to Scripture. This file provides the reverse lookup — understanding comes from tracing back to the source."
anchor = "Genesis 1:1 anchors all decoding. If you can't trace it back to Scripture, it doesn't belong."

[_metadata.C4_dependencies]
requires = ["encoding.toml"]
consumers = ["documentation", "validation tools", "learning systems"]
