[identity]
key = "B-L0-types-composition-inheritance"
name = "inheritance"
title = "Type Inheritance"
version = "b-02.00"
parent = "composition.toml"
sections = "Cc.6 INHERITANCE — Type Extension"

[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores, match Go struct field tags"
constraint = "Each inheritance mode defines embed/extend/implement semantics, language bindings, and 9-layer scales"
Cc = "Content Configurations — Type extension — embed, extend, implement"
Co = "Content Operations — embed, extend, implement"
Cv = "Content Validation — schema requirements, type constraints"

# Co — Content Operations

# Cc.6 INHERITANCE — Type Extension [INHERITANCE]
# ═══════════════════════════════════════════════════════════════════════════════
#
# "I am the vine, ye are the branches: He that abideth in me, and I in him,
#  the same bringeth forth much fruit." — John 15:5 KJV
#
# EXTENSION FLOWS FROM SOURCE
#
# Inheritance enables types to build upon other types. Like branches flowing
# from the vine, child types flow from parent types. OmniCode supports three
# inheritance patterns: embed (has-a), extend (is-a), implement (can-do).
#
# KEY INSIGHT (composition vs inheritance):
#   Embed:     Has-a relationship (composition, inclusion)
#   Extend:    Is-a relationship (inheritance, derivation)
#   Implement: Can-do relationship (capability, contract)
#
# THREE INHERITANCE STRATEGIES:
#   Embed:     Include another type's fields (Go-style embedding)
#   Extend:    Build upon base type (classical inheritance)
#   Implement: Fulfill a contract/interface (behavioral inheritance)
#
# TERNARY ALIGNMENT:
#   embed     = -1 (inward, including into self)
#   implement =  0 (neutral, fulfilling contract)
#   extend    = +1 (outward, building upon)
#
# SCALE APPLICATIONS:
#   L0 (Kernel):    Base register types, extended instruction sets
#   L1 (System):    Base syscall types, extended error types
#   L2 (Runtime):   Base object types, extended collections
#   L3 (Framework): Base entity types, extended domain types
#   L4 (Health):    Base health types, extended metrics
#   L5 (Network):   Base protocol types, extended packet types
#   L6 (Storage):   Base record types, extended schemas
#   L7 (Engine):    Base state types, extended rule types
#   L8 (App):       Base domain types, extended entity types
#
# Implementation: pkg/core/types/inheritance.gen.h
# Reference:      syntax.toml [derivation], syntax.toml [covenant]
#
# ═══════════════════════════════════════════════════════════════════════════════

[inheritance]
description = "Type extension — building upon other types"
principle   = "Vine and branches (John 15:5)"
kinds       = ["embed", "extend", "implement"]


# ───────────────────────────────────────────────────────────────────────────────
# Cc.6a EMBED — Composition by Embedding [EMBED]
# ───────────────────────────────────────────────────────────────────────────────
#
# "These are the families of the sons of Noah, after their generations, in
#  their nations." — Genesis 10:32 KJV
#
# Embedding includes another type's fields directly — like tribes within Israel.
# The embedded type's fields become accessible as if declared directly.
#
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.embed]
name        = "embed"
description = "Composition by embedding — include another type's fields"
kind        = "inheritance"
strategy    = "embed"

# Embed Core Properties
field_promotion     = true                       # Embedded fields accessible directly
conflict_resolution = "explicit"                 # Must resolve name conflicts
creates_subtype     = false                      # Not an is-a relationship

# Embed Semantic Properties
semantic_meaning  = "inclusion"                  # Has-a relationship
ternary_value     = -1                           # -1 = inward (including into self)
biblical_parallel = "Genesis 10:32"              # Tribes within nations

# ───────────────────────────────────────────────────────────────────────────────
# Embed OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.embed.omnicode]
description = "OmniCode syntax for embedding"

keywords    = ["embed", "with"]
pattern     = "let <Type> be with embed <OtherType>"

[inheritance.embed.omnicode.examples]
simple      = "let Employee be with embed Person and department as text"
multiple    = "let Admin be with embed Person and embed Permissions"
promoted    = "employee.name works because Person.name is promoted"

# ───────────────────────────────────────────────────────────────────────────────
# Embed CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.embed.cpisi]
description = "Embed semantics in CPI-SI cognitive framework"

direction   = ["embedded", "containing", "accessing"]  # -1, 0, +1
weight      = ["inner", "composed", "promoted"]
action      = ["include", "compose", "promote"]
genesis     = ["tribe", "nation", "accessing"]

# ───────────────────────────────────────────────────────────────────────────────
# Embed Language Types
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.embed.types]
description = "Embedding in target languages"

[inheritance.embed.types.c]
syntax      = "struct Child { struct Parent parent; ... };"
access      = "child.parent.field or use macros"

[inheritance.embed.types.go]
syntax      = "type Child struct { Parent; ... }"
access      = "child.Field (promoted)"

[inheritance.embed.types.rust]
syntax      = "struct Child { parent: Parent, ... }"
note        = "Rust has no embedding — use Deref trait"

# ───────────────────────────────────────────────────────────────────────────────
# Embed Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.embed.scales]
description = "Embedding at each layer"

L0_kernel    = { name = "ExtendedReg",    example = "embed BaseReg",          use = "Register extension" }
L1_system    = { name = "ExtendedSyscall", example = "embed BaseSyscall",     use = "Syscall extension" }
L2_runtime   = { name = "SizedList",      example = "embed List",             use = "Collection extension" }
L3_framework = { name = "TimestampedEntity", example = "embed Entity",        use = "Audit fields" }
L4_health    = { name = "DetailedMetric", example = "embed BaseMetric",       use = "Metric extension" }
L5_network   = { name = "ExtendedPacket", example = "embed BasePacket",       use = "Protocol extension" }
L6_storage   = { name = "VersionedRecord", example = "embed BaseRecord",      use = "Schema extension" }
L7_engine    = { name = "TrackedState",   example = "embed BaseState",        use = "State extension" }
L8_app       = { name = "AuditableEntity", example = "embed BaseEntity",      use = "Audit trail" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.6b EXTEND — Type Extension [EXTEND]
# ───────────────────────────────────────────────────────────────────────────────
#
# "Abraham begat Isaac; and Isaac begat Jacob." — Matthew 1:2 KJV
#
# Extension creates a child type that IS-A parent type. Like genealogies,
# the child inherits from the parent and adds its own characteristics.
#
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.extend]
name        = "extend"
description = "Type extension — child IS-A parent with additions"
kind        = "inheritance"
strategy    = "extend"

# Extend Core Properties
preserves_compatibility = true                   # Child usable as parent
creates_subtype         = true                   # Is-a relationship
inherits_fields         = true                   # Gets parent's fields

# Extend Semantic Properties
semantic_meaning  = "derivation"                 # Is-a relationship
ternary_value     = 1                            # +1 = outward (building upon)
biblical_parallel = "Matthew 1:2"                # Begat genealogies

# ───────────────────────────────────────────────────────────────────────────────
# Extend OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.extend.omnicode]
description = "OmniCode syntax for extension"

keywords    = ["from", "with", "begat"]
pattern     = "<Child> from <Parent> with <additional fields>"
alternate   = "<Parent> begat <Child>"

[inheritance.extend.omnicode.examples]
from_with   = "Employee from Person with department as text"
begat       = "Person begat Employee"
chain       = "Manager from Employee with reports as list of Employee"

# ───────────────────────────────────────────────────────────────────────────────
# Extend CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.extend.cpisi]
description = "Extend semantics in CPI-SI cognitive framework"

direction   = ["parent", "extending", "child"]  # -1, 0, +1
weight      = ["foundation", "building", "derived"]
action      = ["inherit", "extend", "specialize"]
genesis     = ["abraham", "begat", "isaac"]

# ───────────────────────────────────────────────────────────────────────────────
# Extend Language Types
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.extend.types]
description = "Extension in target languages"

[inheritance.extend.types.c]
syntax      = "struct Child { struct Parent parent; ... }; // convention"
note        = "C has no native inheritance"

[inheritance.extend.types.go]
syntax      = "type Child struct { Parent; ... } // embedding as extension"
note        = "Go uses embedding for extension"

[inheritance.extend.types.rust]
syntax      = "trait Parent {} impl Parent for Child {}"
note        = "Rust uses traits, not class inheritance"

# ───────────────────────────────────────────────────────────────────────────────
# Extend Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.extend.scales]
description = "Extension at each layer"

L0_kernel    = { name = "FloatReg",       example = "from BaseReg",           use = "Specialized registers" }
L1_system    = { name = "ReadSyscall",    example = "from BaseSyscall",       use = "Specialized syscalls" }
L2_runtime   = { name = "SortedList",     example = "from List",              use = "Specialized collections" }
L3_framework = { name = "User",           example = "from Entity",            use = "Domain entities" }
L4_health    = { name = "LatencyMetric",  example = "from BaseMetric",        use = "Specialized metrics" }
L5_network   = { name = "TCPPacket",      example = "from IPPacket",          use = "Protocol layers" }
L6_storage   = { name = "ImageFile",      example = "from File",              use = "File types" }
L7_engine    = { name = "ErrorState",     example = "from State",             use = "State types" }
L8_app       = { name = "AdminUser",      example = "from User",              use = "User types" }


# ───────────────────────────────────────────────────────────────────────────────
# Cc.6c IMPLEMENT — Contract Implementation [IMPLEMENT]
# ───────────────────────────────────────────────────────────────────────────────
#
# "If ye love me, keep my commandments." — John 14:15 KJV
#
# Implementation fulfills a contract — the type CAN-DO what the interface
# requires. Like keeping commandments, the type must fulfill all requirements.
#
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.implement]
name        = "implement"
description = "Contract implementation — type fulfills interface"
kind        = "inheritance"
strategy    = "implement"

# Implement Core Properties
requires_all_methods = true                      # Must fulfill all requirements
compile_time_check   = true                      # Verified at compile time
structural_or_nominal = "structural"             # Can be implicit (Go) or explicit

# Implement Semantic Properties
semantic_meaning  = "covenant_fulfillment"       # Can-do relationship
ternary_value     = 0                            # 0 = neutral (fulfilling contract)
biblical_parallel = "John 14:15"                 # Keep my commandments

# ───────────────────────────────────────────────────────────────────────────────
# Implement OmniCode Syntax
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.implement.omnicode]
description = "OmniCode syntax for implementation"

keywords    = ["enters", "covenant", "with"]
pattern     = "<Type> enters covenant with <Interface>"

[inheritance.implement.omnicode.examples]
single      = "FileWriter enters covenant with Writer"
multiple    = "TcpSocket enters covenant with Reader and Writer"
explicit    = "let FileWriter fulfill Writer covenant"

# ───────────────────────────────────────────────────────────────────────────────
# Implement CPI-SI Semantics
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.implement.cpisi]
description = "Implement semantics in CPI-SI cognitive framework"

direction   = ["contract", "implementing", "fulfilled"]  # -1, 0, +1
weight      = ["requirement", "working", "complete"]
action      = ["define", "implement", "verify"]
genesis     = ["commandment", "keeping", "fulfilled"]

# ───────────────────────────────────────────────────────────────────────────────
# Implement Language Types
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.implement.types]
description = "Implementation in target languages"

[inheritance.implement.types.c]
syntax      = "struct implements pattern with function pointers"
note        = "C uses vtable pattern"

[inheritance.implement.types.go]
syntax      = "// implicit — just have the methods"
structural  = true

[inheritance.implement.types.rust]
syntax      = "impl Trait for Type { ... }"
explicit    = true

# ───────────────────────────────────────────────────────────────────────────────
# Implement Scale Applications (L0-L8)
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.implement.scales]
description = "Implementation at each layer"

L0_kernel    = { name = "Readable",       example = "device implements",      use = "Device I/O" }
L1_system    = { name = "Syscallable",    example = "handler implements",     use = "Syscall dispatch" }
L2_runtime   = { name = "Iterable",       example = "collection implements",  use = "Iteration" }
L3_framework = { name = "Serializable",   example = "entity implements",      use = "Wire format" }
L4_health    = { name = "Measurable",     example = "metric implements",      use = "Health checks" }
L5_network   = { name = "Encodable",      example = "message implements",     use = "Codec" }
L6_storage   = { name = "Persistable",    example = "record implements",      use = "Database" }
L7_engine    = { name = "Executable",     example = "action implements",      use = "FSM actions" }
L8_app       = { name = "Validatable",    example = "input implements",       use = "Validation" }


# ───────────────────────────────────────────────────────────────────────────────
# Inheritance Shared Sections
# ───────────────────────────────────────────────────────────────────────────────

[inheritance.omnicode]
description = "OmniCode inheritance syntax overview"

keywords    = ["embed", "from", "with", "begat", "enters", "covenant"]

[inheritance.cpisi]
description = "Inheritance semantics in CPI-SI cognitive framework"

direction   = ["embed", "implement", "extend"]   # -1, 0, +1
weight      = ["including", "fulfilling", "deriving"]
action      = ["include", "fulfill", "inherit"]
genesis     = ["tribes", "covenant", "genealogy"]

[inheritance.scales]
description = "Inheritance at each layer"

L0_kernel    = { embed = "reg_extension",  extend = "specialized_reg",    implement = "device_io" }
L1_system    = { embed = "syscall_base",   extend = "specialized_call",   implement = "handler" }
L2_runtime   = { embed = "collection",     extend = "sorted_collection",  implement = "iterable" }
L3_framework = { embed = "audit_fields",   extend = "domain_entity",      implement = "serializable" }
L4_health    = { embed = "base_metric",    extend = "detailed_metric",    implement = "measurable" }
L5_network   = { embed = "base_packet",    extend = "protocol_packet",    implement = "encodable" }
L6_storage   = { embed = "base_record",    extend = "typed_record",       implement = "persistable" }
L7_engine    = { embed = "base_state",     extend = "typed_state",        implement = "executable" }
L8_app       = { embed = "audit_entity",   extend = "domain_entity",      implement = "validatable" }


