[effect_exception.omnicode]
keywords    = ["throws", "may_fail", "fallible", "error"]
pattern     = "throws func <name>(<params>) -> <return>"
modifiers   = ["recoverable", "fatal", "typed"]
examples    = [
    "throws func parse(json: String) -> Value",
