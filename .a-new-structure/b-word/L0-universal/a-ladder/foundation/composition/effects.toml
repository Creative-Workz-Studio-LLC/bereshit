[effect_state.scales]
L0_kernel    = { name = "RegisterState",     example = "register modify",               use = "Register updates" }
L1_system    = { name = "ProcessState",      example = "process state change",          use = "Process management" }
L2_runtime   = { name = "MemoryState",       example = "heap allocation",               use = "Memory management" }
L3_framework = { name = "SessionState",      example = "session update",                use = "Session management" }
L4_health    = { name = "RecordState",       example = "patient record update",         use = "Medical records" }
L5_network   = { name = "ConnectionState",   example = "connection state machine",      use = "Connection management" }
L6_storage   = { name = "TransactionState",  example = "transaction commit",            use = "Transaction management" }
L7_engine    = { name = "GameState",         example = "world state update",            use = "Game state" }
L8_app       = { name = "AppState",          example = "Redux state update",            use = "Application state" }


