[effect_state.types.haskell]
keyword     = "State"
syntax      = "func :: State s a"
example     = "increment :: State Int ()"

[effect_state.types.rust]
keyword     = "&mut"
syntax      = "fn name(&mut self, params) -> Return"
example     = "fn push(&mut self, item: T)"

[effect_state.types.go]
keyword     = "pointer receiver"
syntax      = "func (s *State) Name(params) Return"
