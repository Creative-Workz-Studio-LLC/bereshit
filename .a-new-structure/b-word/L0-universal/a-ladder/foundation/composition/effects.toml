testable                 = "requires state setup"

[effect_state.omnicode]
keywords    = ["state", "mut", "modify", "update"]
pattern     = "state func <name>(<params>) -> <return>"
modifiers   = ["read", "write", "readwrite"]
examples    = [
    "state func increment(counter: &mut Int) -> Void",
    "state func getAndSet(ref: &mut T, new: T) -> T",
]

[effect_state.cpisi]
direction   = ["modify", "hold", "read"]
