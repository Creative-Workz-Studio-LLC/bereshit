# ---------------------------------------------------------------
# Extensions (reserved)
# ---------------------------------------------------------------

[extensions]
note = "Reserved -- no extensions defined"

# ---------------------------------------------------------------
# Cv -- Content Validation
# ---------------------------------------------------------------

[_validation]
commands = ["cws-struct lint toml index.toml"]

[_validation.schema]
required = ["identity"]
optional = ["extensions", "systems"]

[_validation.health_scoring]
total = 100
correct_structure = 30
all_domains_registered = 30
dependency_graph_valid = 20
file_paths_resolvable = 20

# ===============================================================
# END CONTENT [END]
# ===============================================================


# ===============================================================
# CLOSING BLOCK [CLOSING]
# ===============================================================

[_closing.X1_policy]
scripture = "Remove not the ancient landmark, which thy fathers have set. -- Proverbs 22:28"
never = [
    "Remove a domain system without migrating its specs",
    "Break the dependency graph (circular deps, missing refs)",
    "Change generation output filenames without updating build system",
    "3-block structure (METADATA -> CONTENT -> CLOSING)",
]
careful = [
    "Adding new domain systems -- must define clear boundaries",
    "Changing dependency ordering -- affects build chain",
    "Renaming spec files -- all consumers must update",
]
safe = [
    "Adding new specs to existing domains",
    "Adding dependency edges (no cycles)",
    "Updating descriptions and documentation",
    "New metadata fields",
]

[_closing.X2_extension]
adding_domain = [
    "1. Create domain directory under foundation/",
    "2. Create domain index .toml as first file",
    "3. Add [[systems]] entry to this index with correct order",
    "4. Add [[systems.specs]] for each file",
    "5. Define depends_on edges (no cycles)",
    "6. Run cws-struct lint to verify all files",
]
adding_spec = [
    "1. Create spec file in the domain directory",
    "2. Use 3-block I/C template (seed/data/L0/toml/config.toml)",
    "3. Add [[systems.specs]] entry to this index",
    "4. Define depends_on relative to foundation/",
    "5. Run cws-struct lint on new file",
]
planned = [
    "Domain 9: networking -- distributed system primitives",
    "Domain 10: security -- trust model and access control",
    "Split single-file domains (cognition, generation) as they grow",
]

[_closing.X3_troubleshooting]
invalid_toml = "Missing quotes, duplicate keys, or bare keys with special characters"
missing_spec = "File referenced in index but not found on disk -- verify path"
circular_dep = "A depends on B depends on A -- break cycle by extracting shared spec"
lint_failure = "Run cws-struct lint toml <file> -- fix errors before committing"

[_closing.X4_reference]
domains = [
    "math/ -- Ternary mathematics (3 files)",
    "primitives/ -- 23 atomic types (8 files)",
    "composition/ -- Type composition rules (11 files)",
    "validation/ -- Type validation rules (9 files)",
    "errors/ -- Error handling system (4 files)",
    "bible/ -- Scripture integration (10 files)",
    "cognition/ -- Cognitive model (1 file)",
    "generation/ -- Code generation (1 file)",
    ". -- Cross-cutting infrastructure (4 flat files)",
]
total_specs = 51
total_domains = 9
validate = "cws-struct lint toml index.toml"
related_files = [
    "math/math.toml -- ternary mathematics domain index",
    "primitives/primitives.toml -- atomic types domain index",
    "composition/composition.toml -- type composition domain index",
    "validation/validation.toml -- type validation domain index",
    "errors/foundation.toml -- error system root",
    "bible/bible.toml -- scripture integration domain index",
    "cognition/cognition.toml -- cognitive model",
    "generation/generation.toml -- code generation",
]

[_closing.X5_note]
note = "Foundation specification index -- maps the bedrock of the Bereshit type system. 8 peer domains + 4 cross-cutting specs. All paths relative to foundation/."
scripture = "In the beginning God created the heaven and the earth. -- Genesis 1:1"
anchor = "Before language, before platform, before network -- establish the foundation. This index maps what exists at the very bottom. Everything else builds from here."

# ===============================================================
# END CLOSING [END]
# ===============================================================
