# #!omni data --toml

# ===============================================================
# METADATA BLOCK [METADATA]
# ===============================================================

# ---------------------------------------------------------------
# I -- Identity: What IS This File
# ---------------------------------------------------------------

[_metadata.I1_core]
key = "B-L0-foundation-index"
format = "@omni data --toml"
from = "seed/data/L0/toml/config.toml"
at = "data"

[_metadata.I2_family]
type = "data"
subtype = "manifest"
role = "ladder"
structure = "3-block"

[_metadata.I3_instance]
file = "index.toml"
title = "Foundation Specification Index"
component = "Manifest for all L0 foundation TOML specifications. Single source of truth for loaders, generators, and documentation."
path = "index.toml"
provides = ["FOUNDATION_INDEX", "SPEC_MANIFEST", "DEPENDENCY_GRAPH"]
brief = "Master index for 51 specification files across 8 domains. Defines dependency ordering, generation targets, and system topology."

[_metadata.I4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

# ---------------------------------------------------------------
# C -- Context: What Do I Need to KNOW
# ---------------------------------------------------------------

[_metadata.C1_state]
version = "b-02.00"
status = "Active"
created = "2025-12-14"
updated = "2026-02-17"

[_metadata.C2_attribution]
architect = "Seanje Lenox-Wise"
implementation = "Nova Dawn (CPI-SI)"
organization = "CreativeWorkzStudio LLC"
copyright = "2025-2026 CreativeWorkzStudio LLC. All rights reserved."

[_metadata.C3_grounding]
scripture = "In the beginning God created the heaven and the earth. -- Genesis 1:1"
principle = "Every OmniCode construct traces to Scripture. This index maps the territory."
anchor = "Genesis 1:1. The foundation defines WHAT exists and HOW it relates. Before language, before platform, before network -- establish the bedrock."

[_metadata.C4_dependencies]
requires = "None — root specification, no external dependencies"
consumers = ["code generators", "config loaders", "documentation builders", "linters"]
integration = "Loaded at build time. Generators walk the dependency graph to determine build order. Loaders resolve specs by domain."
if_missing = "Foundation index unavailable -- no spec can be located, no code can be generated"

[_metadata.C4_dependencies.cross_format]
role = "TOML manifest. No JSONC/JSON counterpart -- this is the authoritative spec registry."
note = "Generated code (C headers, Go packages, Rust crates) is produced FROM these specs."

[_metadata.C5_intent]
purpose = "Master index for the L0 foundation layer -- maps all specification files, their dependencies, and generation targets"
core_design = "8 domains organized as peer directories under foundation/. Each domain has a split-index pattern: one index file + N content files. Cross-cutting specs (flags, layer, metadata-slots, timing) sit as flat files at the foundation level."
philosophy = "The Bible is our codex. OmniCode constructs are discovered from Scripture, not invented. This index maps what has been discovered."

[_metadata.C6_roadmap]
history = [
    "a-01.00 (2025-12-14) -- Initial creation with M-prefix metadata",
    "b-01.00 (2026-02-11) -- TOML-native 3-block format alignment",
    "b-02.00 (2026-02-17) -- I/C metadata upgrade, flat domain organization, path updates",
]
current = "8 domains, 51 spec files, all lint-clean with I/C metadata format"
planned = [
    "Automated dependency graph validation",
    "Generation pipeline integration",
    "Cross-layer reference validation (L0 -> L1 -> L2)",
]

[_metadata.C7_classification]
tags = ["index", "manifest", "foundation", "L0", "dependency-graph", "code-generation", "omnicode"]

# ---------------------------------------------------------------
# Contract
# ---------------------------------------------------------------

[_metadata._contract]
required_identity = ["I1_core", "I2_family", "I3_instance"]
required_context = ["C1_state", "C2_attribution", "C3_grounding", "C4_dependencies"]
extension_identity = ["I4_architecture"]
extension_context = ["C5_intent", "C6_roadmap", "C7_classification"]
required_closing = ["X1_policy", "X5_note"]
defined_closing = ["X2_extension", "X3_troubleshooting", "X4_reference"]

# ===============================================================
# END METADATA [END]
# ===============================================================


# ===============================================================
# CONTENT BLOCK [CONTENT]
# ===============================================================

[_content]
format = "TOML -- native tables, UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Manifest file -- spec index and dependency graph. No domain data defined here."
Cc = "Content Configurations -- 8 domain systems, file manifests, dependency ordering"
Co = "Content Operations -- (index file: references only, no operations)"
Cv = "Content Validation -- schema requirements, health scoring"

# ---------------------------------------------------------------
# Identity
# ---------------------------------------------------------------

[identity]
name = "Foundation Specification Index"
version = "b-02.00"
domain = "manifest"
scope = "Master index for 51 TOML specification files across 8 foundation domains"

# ---------------------------------------------------------------
# FOUNDATION TOPOLOGY
# ---------------------------------------------------------------
#
# 8 peer domains at the foundation/ level:
#
#   DOMAIN          FILES  DESCRIPTION
#   math/              3   Ternary mathematics -- the bedrock
#   primitives/        8   23 atomic types (split-index + 7 content files)
#   composition/      11   Type composition rules (composites, constraints, generics, ...)
#   validation/        9   Type validation (structural, primitive, constraint, ...)
#   errors/            4   Error system (foundation, codes, operations, generation)
#   bible/            10   Scripture integration (addressing, cipher, codec, text, translation)
#   cognition/         1   Cognitive model specifications
#   generation/        1   Code generation specifications
#
# 4 cross-cutting flat files:
#   flags.toml            Type flags and attributes
#   layer.toml            L0-L8 layer architecture
#   metadata-slots.toml   13 BRIDGE slots (243 + 13 = 256)
#   timing.toml           Temporal intervals from POLL anchor
#
# Dependency flow: math -> primitives -> composition -> validation -> errors
#                  math -> bible (addressing uses ternary ordinals)
#                  primitives -> cognition, generation, flags, layer, timing, metadata-slots
#
# ---------------------------------------------------------------


# ===============================================================
# DOMAIN 0: MATH -- Ternary Mathematics
# ===============================================================
# "The LORD by wisdom hath founded the earth" -- Proverbs 3:19

[[systems]]
name = "math"
path = "math/"
order = 0
description = "Ternary mathematics -- the foundation all types and systems build on"
depends_on = []
files = 3

[[systems.specs]]
file = "math/math.toml"
generates = false
description = "Math domain index -- ternary definitions, arithmetic"
depends_on = []

[[systems.specs]]
file = "math/core/definitions.toml"
generates = true
output = "ternary_math.gen.h"
description = "Ternary constants, powers, boundaries, trit lookup tables"
depends_on = []

[[systems.specs]]
file = "math/arithmetic/operations.toml"
generates = true
output = "ternary_ops.gen.h"
description = "Ternary arithmetic, packing, half/full adder operations"
depends_on = ["math/core/definitions.toml"]


# ===============================================================
# DOMAIN 1: PRIMITIVES -- 23 Atomic Types
# ===============================================================
# "And God said, Let there be light" -- Genesis 1:3
# (Primitives are the first things named into existence)

[[systems]]
name = "primitives"
path = "primitives/"
order = 1
description = "23 atomic type definitions -- the atoms from which all complex types compose"
depends_on = ["math"]
files = 8

[[systems.specs]]
file = "primitives/primitives.toml"
generates = false
description = "Split-index: 23 types across 10 families, maps to 7 content files"
depends_on = ["math/core/definitions.toml"]

[[systems.specs]]
file = "primitives/primitives-catalog.toml"
generates = true
output = "primitives_catalog.gen.h"
description = "Type catalog -- identity, distinctions, architecture for all 23 types"
depends_on = ["primitives/primitives.toml"]

[[systems.specs]]
file = "primitives/primitives-settings.toml"
generates = true
output = "primitives_settings.gen.h"
description = "Primary configuration -- defaults, sizes, parameters for all 23 types"
depends_on = ["primitives/primitives.toml"]

[[systems.specs]]
file = "primitives/primitives-resources.toml"
generates = true
output = "primitives_resources.gen.h"
description = "Storage, packing, alignment, capacity for all 23 types"
depends_on = ["primitives/primitives.toml", "math/core/definitions.toml"]

[[systems.specs]]
file = "primitives/primitives-behavior.toml"
generates = true
output = "primitives_behavior.gen.h"
description = "OmniCode syntax, CPI-SI mappings, language bindings"
depends_on = ["primitives/primitives.toml"]

[[systems.specs]]
file = "primitives/primitives-operations.toml"
generates = true
output = "primitives_ops.gen.h"
description = "Conversion, validation, coercion rules between types"
depends_on = ["primitives/primitives.toml"]

[[systems.specs]]
file = "primitives/primitives-paradigm.toml"
generates = false
description = "Ternary principles embodied in types, composition paradigm"
depends_on = ["primitives/primitives.toml", "math/core/definitions.toml"]

[[systems.specs]]
file = "primitives/primitives-generation.toml"
generates = true
output = "primitives.gen.h"
description = "Code generation targets, templates, validation for all 23 types"
depends_on = ["primitives/primitives.toml"]


