universal   = "Position 0 of every tier is reserved for 'no error of this type'"

[position.success.omnicode]
marker      = "{layer}.{tier}.SUCCESS"
example     = "CPISI_OK"

[position.success.cpisi]
ternary     = 0
meaning     = "No error — operation completed successfully"

[position.null]
index       = 1
name        = "NULL"
brief       = "Null pointer or missing"
description = "Required pointer was NULL or required item is missing"
macro       = "CPISI_POS_NULL"
examples    = ["NULL argument", "missing config", "object not found"]

[position.null.omnicode]
marker      = "{layer}.{tier}.NULL"
example     = "KERNEL.CORE.NULL"

[position.null.cpisi]
ternary     = -1
meaning     = "Missing — something required was not provided"

[position.invalid]
index       = 2
name        = "INVALID"
brief       = "Invalid parameter or malformed"
description = "Parameter is syntactically invalid or data is malformed"
macro       = "CPISI_POS_INVALID"
examples    = ["invalid enum", "malformed string", "corrupt data"]

[position.invalid.omnicode]
marker      = "{layer}.{tier}.INVALID"
example     = "SYSTEM.CORE.INVALID"

[position.invalid.cpisi]
ternary     = -1
meaning     = "Bad input — data provided but incorrect"

[position.bounds]
index       = 3
name        = "BOUNDS"
brief       = "Out of bounds or range"
description = "Value exceeds valid range or index is out of bounds"
macro       = "CPISI_POS_BOUNDS"
examples    = ["array overflow", "health > 1.0", "layer > 8"]

[position.bounds.omnicode]
marker      = "{layer}.{tier}.BOUNDS"
example     = "HEALTH.CORE.BOUNDS"

[position.bounds.cpisi]
ternary     = -1
meaning     = "Out of range — value exceeded limits"

[position.type]
index       = 4
name        = "TYPE"
brief       = "Type mismatch or format"
description = "Wrong type or incompatible format"
macro       = "CPISI_POS_TYPE"
examples    = ["expected int got string", "wrong encoding", "version mismatch"]

[position.type.omnicode]
marker      = "{layer}.{tier}.TYPE"
example     = "RUNTIME.CORE.TYPE"

[position.type.cpisi]
ternary     = -1
meaning     = "Wrong type — incompatible data format"

[position.state]
index       = 5
name        = "STATE"
brief       = "Invalid state or condition"
description = "Object is in wrong state for requested operation"
macro       = "CPISI_POS_STATE"
examples    = ["read before open", "already initialized", "connection closed"]

[position.state.omnicode]
marker      = "{layer}.{tier}.STATE"
example     = "NETWORK.CORE.STATE"

[position.state.cpisi]
ternary     = 0
meaning     = "Wrong state — operation not valid in current state"

[position.init]
index       = 6
name        = "INIT"
brief       = "Initialization or setup failure"
description = "Failed to initialize or set up a resource"
macro       = "CPISI_POS_INIT"
examples    = ["alloc failed", "config load failed", "subsystem init failed"]

[position.init.omnicode]
marker      = "{layer}.{tier}.INIT"
example     = "STORAGE.CORE.INIT"

[position.init.cpisi]
ternary     = +1
meaning     = "Init failed — could not start or set up"

[position.cleanup]
index       = 7
name        = "CLEANUP"
brief       = "Cleanup or teardown failure"
description = "Failed to clean up or tear down a resource"
macro       = "CPISI_POS_CLEANUP"
examples    = ["close failed", "free failed", "shutdown incomplete"]

[position.cleanup.omnicode]
marker      = "{layer}.{tier}.CLEANUP"
example     = "ENGINE.SYS.CLEANUP"

[position.cleanup.cpisi]
ternary     = +1
meaning     = "Cleanup failed — could not stop or tear down"

[position.unknown]
index       = 8
name        = "UNKNOWN"
brief       = "Unknown or uncategorized"
description = "Error doesn't fit other categories — should be rare"
macro       = "CPISI_POS_UNKNOWN"
warning     = "Prefer specific positions. UNKNOWN is a last resort."

[position.unknown.omnicode]
marker      = "{layer}.{tier}.UNKNOWN"
example     = "APP.EXT.UNKNOWN"

[position.unknown.cpisi]
ternary     = 0
meaning     = "Uncategorized — catch-all for unexpected errors"

# ─────────────────────────────────────────────────────────────────────────
# Cc.5 FORMULAS — Error Code Construction
# ─────────────────────────────────────────────────────────────────────────

[formula]
description = "Error codes are derived, not arbitrary"

[formula.make_error]
name        = "CPISI_MAKE_ERROR"
formula     = "(layer × CUBE) + (tier × FACE) + position"
expanded    = "(layer × 27) + (tier × 9) + position"
description = "Construct error code from layer, tier, and position"

[formula.make_error.omnicode]
marker      = "@formula MAKE_ERROR"
example     = "CPISI_MAKE_ERROR(KERNEL, CORE, NULL)"

[formula.make_error.examples]
cpisi_ok               = { formula = "(0 × 27) + (0 × 9) + 0", result = 0 }
cpisi_err_kernel_null  = { formula = "(0 × 27) + (0 × 9) + 1", result = 1 }
cpisi_err_health_bounds = { formula = "(4 × 27) + (0 × 9) + 3", result = 111 }

[formula.extract_layer]
name        = "Layer extraction"
formula     = "layer = code ÷ 27"
description = "Get layer index from error code"
c_macro     = "#define CPISI_ERR_LAYER(e) ((e) / 27)"
go_func     = "func ErrLayer(e CpisiError) int { return int(e) / 27 }"

[formula.extract_offset]
name        = "Offset extraction"
formula     = "offset = code % 27"
description = "Get position within layer"
c_macro     = "#define CPISI_ERR_OFFSET(e) ((e) % 27)"
go_func     = "func ErrOffset(e CpisiError) int { return int(e) % 27 }"

[formula.extract_tier]
name        = "Tier extraction"
formula     = "tier = (code % 27) ÷ 9"
description = "Get tier index within layer"
c_macro     = "#define CPISI_ERR_TIER(e) (((e) % 27) / 9)"
go_func     = "func ErrTier(e CpisiError) int { return (int(e) % 27) / 9 }"

[formula.extract_position]
name        = "Position extraction"
formula     = "position = (code % 27) % 9"
description = "Get position within tier"
c_macro     = "#define CPISI_ERR_POSITION(e) (((e) % 27) % 9)"
go_func     = "func ErrPosition(e CpisiError) int { return (int(e) % 27) % 9 }"

