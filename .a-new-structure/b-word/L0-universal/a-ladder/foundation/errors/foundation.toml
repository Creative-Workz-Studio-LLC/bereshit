# ─────────────────────────────────────────────────────────────────────────
# Cc.1 ARCHITECTURE — The Bridge Equation
# ─────────────────────────────────────────────────────────────────────────

[architecture]
name        = "CPI-SI Error System"
description = "9-layer error architecture mapping to mental construct"

[architecture.bridge_equation]
description      = "THE BRIDGE: Ternary meets binary"
ternary_codes    = 243   # PENTERACT = 3^5, also 9 layers × 27 codes
metadata_codes   = 13    # BRIDGE = center of CUBE
binary_fit       = 256   # Fits exactly in uint8_t
formula          = "243 + 13 = 256"
significance     = "Perfect fit — ternary architecture slots into binary byte"

[architecture.structure]
layers             = 9     # 4 below + 1 center + 4 above
codes_per_layer    = 27    # CUBE = 3^3
tiers_per_layer    = 3     # CORE, EXT, SYS
positions_per_tier = 9     # FACE = 3^2

[architecture.omnicode]
marker      = "@error"
syntax      = "@error {layer}.{tier}.{position}"
example     = "@error KERNEL.CORE.NULL"

[architecture.cpisi]
mental_construct = "Error codes map to mental construct positions"
layers_are       = "WHERE (which subsystem)"
tiers_are        = "HOW DEEP (severity level)"
positions_are    = "WHAT KIND (error category)"

[architecture.types]
c           = "typedef uint16_t CpisiError"
go          = "type CpisiError uint16"
rust        = "type CpisiError = u16"

[architecture.scales]
L0_kernel    = { use = "Core type definition", example = "CpisiError base type" }
L1_system    = { use = "Error type in syscalls", example = "Return value semantics" }
L2_runtime   = { use = "Runtime error handling", example = "Exception translation" }
L3_framework = { use = "Framework error types", example = "CPI-SI error structs" }
L4_health    = { use = "Health error tracking", example = "Health state errors" }
L5_network   = { use = "Network error codes", example = "Protocol error mapping" }
L6_storage   = { use = "Storage error codes", example = "IO error categories" }
L7_engine    = { use = "Engine error handling", example = "Render/orchestration errors" }
L8_app       = { use = "Application errors", example = "User-facing error display" }

