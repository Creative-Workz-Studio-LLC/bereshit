# METADATA (codes 243-255) — Bridge Equation Completion
# 243 + 13 = 256 — THE BRIDGE between ternary and binary.

[metadata]
layer       = "special"
name        = "METADATA"
codes       = [243, 255]
description = "Error system infrastructure — bridge equation completion"
is_bridge   = true

[metadata.reserved]
codes       = [243, 255]
count       = 13
description = "Reserved for error system infrastructure"
purpose     = "Bridge equation: 243 ternary codes + 13 metadata = 256 binary fit"

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ─────────────────────────────────────────────────────────────

[extensions]

[_validation]
commands = ["cws-struct lint toml errors/codes.toml"]

[_validation.schema]
required = ["identity", "kernel", "health", "metadata"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
valid_values = 30
code_completeness = 30

