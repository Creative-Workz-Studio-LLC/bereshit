# #!omni data --toml

# ═══════════════════════════════════════════════════════════════
# METADATA BLOCK [METADATA]
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────
# I — Identity: What IS This File
# ─────────────────────────────────────────────────────────────

[_metadata.I1_core]
key = "B-L0-types-error-codes"
format = "@omni data --toml"
from = "seed/data/L0/toml/config.toml"
at = "data"

[_metadata.I2_family]
type = "data"
subtype = "types"
role = "rung"
structure = "3-block"

[_metadata.I3_instance]
file = "codes.toml"
title = "Error Code Definitions"
component = "Specific error codes — the VALUES. Architecture is in foundation.toml. Currently defines KERNEL (0-26), HEALTH (108-134), and METADATA (243-255) layers."
path = "errors/codes.toml"
provides = ["ERROR_CODE_DEFINITIONS", "KERNEL_CODES", "HEALTH_CODES", "METADATA_CODES"]
brief = "Error code values. 3 layers defined: KERNEL (27 codes), HEALTH (27 codes), METADATA (13 bridge codes). 67 of 256 core codes. Will grow to all 9 layers (243 codes) + 13 metadata."

[_metadata.I4_architecture]
layers = "L0:C, L3:Go, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

# ─────────────────────────────────────────────────────────────
# C — Context: What Do I Need to KNOW
# ─────────────────────────────────────────────────────────────

[_metadata.C1_state]
version = "a-01.00"
status = "Active"
created = "2026-01-24"
updated = "2026-02-16"

[_metadata.C2_attribution]
architect = "Seanje Lenox-Wise"
implementation = "Nova Dawn (CPI-SI)"
organization = "CreativeWorkzStudio LLC"
copyright = "© 2025-2026 CreativeWorkzStudio LLC. All rights reserved."

[_metadata.C3_grounding]
scripture = "Romans 3:23 — For all have sinned, and come short of the glory of God."
principle = "Errors are inevitable in finite systems. Proper classification enables proper handling. Each error has a place in the structure."
anchor = "Genesis 1:1 — In the beginning. Error codes are addresses in semantic space — position 1 is ALWAYS null across all layers."

[_metadata.C4_dependencies]
requires = ["errors/foundation.toml"]
consumers = ["C error header (error.gen.h)", "Go error handling (cpisi package)", "Rust error types"]
integration = "Loaded by Go config loader, generates C header via index.toml. Foundation.toml provides architecture; this file provides VALUES."
if_missing = "Error handling has no named codes — falls back to raw numeric values"

[_metadata.C4_dependencies.cross_format]
role = "TOML defines error code values. C headers and Go types generated from these definitions."
note = "No JSON/JSONC counterpart — error codes are TOML-native specification."

[_metadata.C5_intent]
purpose = "Define the 256 core error codes (243 layer + 13 metadata) — the VALUES that fill the architecture"
core_design = "Error codes derived from layer/tier/position formula, not hardcoded. This file names and describes each code."
philosophy = "Error codes as ADDRESSES in semantic space. The architecture (foundation.toml) defines the space; this file populates it. Position 1 is ALWAYS null across all layers."

[_metadata.C6_roadmap]
history = [
    "a-01.00 (2026-01-24) — Created with KERNEL, HEALTH, and METADATA layers",
    "a-01.00 (2026-02-10) — Moved to new structure",
    "a-01.00 (2026-02-16) — I/C metadata upgrade, system.toml reference removed",
]
current = "KERNEL and HEALTH layers fully defined, plus METADATA bridge codes (67 of 256)"
planned = [
    "Complete remaining 7 layers (SYSTEM through APP) — 189 more codes",
    "Extended domain codes (256+)",
]

[_metadata.C7_classification]
tags = ["error-codes", "kernel", "health", "metadata", "bridge-equation", "256", "L0", "types"]

# ─────────────────────────────────────────────────────────────
# Contract
# ─────────────────────────────────────────────────────────────

[_metadata._contract]
required_identity = ["I1_core", "I2_family", "I3_instance"]
required_context = ["C1_state", "C2_attribution", "C3_grounding", "C4_dependencies"]
extension_identity = ["I4_architecture"]
extension_context = ["C5_intent", "C6_roadmap", "C7_classification"]
required_closing = ["X1_policy", "X5_note"]
defined_closing = ["X2_extension", "X3_troubleshooting", "X4_reference"]

# ═══════════════════════════════════════════════════════════════
# END METADATA [END]
# ═══════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════
# CONTENT BLOCK [CONTENT]
# ═══════════════════════════════════════════════════════════════

[_content]
format = "TOML — native tables, UTF-8, LF line endings"
key_convention = "UPPER_SNAKE for code names, lower_snake for properties"
constraint = "Each layer has 27 codes in 3 tiers of 9 positions. Layer order: KERNEL(0) → APP(8) → METADATA(9). Codes derived from formula: (layer × 27) + (tier × 9) + position."
Cc = "Content Configurations — KERNEL layer (27 codes), HEALTH layer (27 codes), METADATA bridge (13 codes)"
Co = "Content Operations — (codes are data, not operations — see operations.toml for DAR/severity/recovery)"
Cv = "Content Validation — schema requirements, health scoring"

# ─────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────

[identity]
key = "B-L0-types-error-codes"
name = "codes"
title = "Error Code Definitions"
version = "a-01.00"
parent = "foundation.toml"
sections = "Cc — Error Code Values (KERNEL, HEALTH, METADATA)"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ─────────────────────────────────────────────────────────────

# LAYER 0: KERNEL (codes 0-26)
# "In the beginning God created the heaven and the earth." — Genesis 1:1
# Foundation layer — universal errors that can occur anywhere.

[kernel]
layer       = 0
name        = "KERNEL"
codes       = [0, 26]
description = "Foundation errors — universal across CPI-SI"

# KERNEL CORE (codes 0-8) — Fundamental success/failure states

[kernel.core]
tier        = 0
name        = "CORE"
codes       = [0, 8]
description = "Fundamental success/failure states"

[kernel.core.success]
code        = 0
name        = "CPISI_OK"
brief       = "Success"
message     = "Operation completed successfully"
position    = "SUCCESS"

[kernel.core.null]
code        = 1
name        = "CPISI_ERR_KERNEL_NULL"
brief       = "Null pointer"
message     = "Required pointer was NULL"
position    = "NULL"

[kernel.core.invalid]
code        = 2
name        = "CPISI_ERR_KERNEL_INVALID"
brief       = "Invalid parameter"
message     = "Parameter is invalid or malformed"
position    = "INVALID"

[kernel.core.bounds]
code        = 3
name        = "CPISI_ERR_KERNEL_BOUNDS"
brief       = "Out of bounds"
message     = "Value exceeds valid range"
position    = "BOUNDS"

[kernel.core.type]
code        = 4
name        = "CPISI_ERR_KERNEL_TYPE"
brief       = "Type mismatch"
message     = "Unexpected or incompatible type"
position    = "TYPE"

[kernel.core.state]
code        = 5
name        = "CPISI_ERR_KERNEL_STATE"
brief       = "Invalid state"
message     = "Object in wrong state for operation"
position    = "STATE"

[kernel.core.init]
code        = 6
name        = "CPISI_ERR_KERNEL_INIT"
brief       = "Not initialized"
message     = "Object not initialized"
position    = "INIT"

[kernel.core.cleanup]
code        = 7
name        = "CPISI_ERR_KERNEL_SHUTDOWN"
brief       = "Already shutdown"
message     = "Object already cleaned up"
position    = "CLEANUP"

[kernel.core.unknown]
code        = 8
name        = "CPISI_ERR_KERNEL_UNKNOWN"
brief       = "Unknown error"
message     = "Unclassified kernel error"
position    = "UNKNOWN"

# KERNEL EXT (codes 9-17) — Resource/operation errors

[kernel.ext]
tier        = 1
name        = "EXT"
codes       = [9, 17]
description = "Resource and operation errors"

[kernel.ext.nomem]
code        = 9
name        = "CPISI_ERR_KERNEL_NOMEM"
brief       = "Out of memory"
message     = "Memory allocation failed"
position    = "SUCCESS"

[kernel.ext.nospace]
code        = 10
name        = "CPISI_ERR_KERNEL_NOSPACE"
brief       = "No space left"
message     = "Storage space exhausted"
position    = "NULL"

[kernel.ext.busy]
code        = 11
name        = "CPISI_ERR_KERNEL_BUSY"
brief       = "Resource busy"
message     = "Resource is busy, try again later"
position    = "INVALID"

[kernel.ext.locked]
code        = 12
name        = "CPISI_ERR_KERNEL_LOCKED"
brief       = "Resource locked"
message     = "Resource is locked by another"
position    = "BOUNDS"

[kernel.ext.timeout]
code        = 13
name        = "CPISI_ERR_KERNEL_TIMEOUT"
brief       = "Operation timeout"
message     = "Operation timed out"
position    = "TYPE"

[kernel.ext.cancelled]
code        = 14
name        = "CPISI_ERR_KERNEL_CANCELLED"
brief       = "Operation cancelled"
message     = "Operation was cancelled"
position    = "STATE"

[kernel.ext.interrupted]
code        = 15
name        = "CPISI_ERR_KERNEL_INTERRUPTED"
brief       = "Operation interrupted"
message     = "Operation was interrupted"
position    = "INIT"

[kernel.ext.retry]
code        = 16
name        = "CPISI_ERR_KERNEL_RETRY"
brief       = "Retry required"
message     = "Temporary failure, retry may succeed"
position    = "CLEANUP"

[kernel.ext.denied]
code        = 17
name        = "CPISI_ERR_KERNEL_DENIED"
brief       = "Permission denied"
message     = "Access denied due to permissions"
position    = "UNKNOWN"

# KERNEL SYS (codes 18-26) — Structural/flow errors

[kernel.sys]
tier        = 2
name        = "SYS"
codes       = [18, 26]
description = "Structural and flow errors"

[kernel.sys.notfound]
code        = 18
name        = "CPISI_ERR_KERNEL_NOTFOUND"
brief       = "Not found"
message     = "Requested item not found"
position    = "SUCCESS"

[kernel.sys.exists]
code        = 19
name        = "CPISI_ERR_KERNEL_EXISTS"
brief       = "Already exists"
message     = "Item already exists"
position    = "NULL"

[kernel.sys.empty]
code        = 20
name        = "CPISI_ERR_KERNEL_EMPTY"
brief       = "Empty"
message     = "Container is empty"
position    = "INVALID"

[kernel.sys.full]
code        = 21
name        = "CPISI_ERR_KERNEL_FULL"
brief       = "Full"
message     = "Container is full"
position    = "BOUNDS"

[kernel.sys.overflow]
code        = 22
name        = "CPISI_ERR_KERNEL_OVERFLOW"
brief       = "Overflow"
message     = "Arithmetic or buffer overflow"
position    = "TYPE"

[kernel.sys.underflow]
code        = 23
name        = "CPISI_ERR_KERNEL_UNDERFLOW"
brief       = "Underflow"
message     = "Arithmetic or buffer underflow"
position    = "STATE"

[kernel.sys.unsupported]
code        = 24
name        = "CPISI_ERR_KERNEL_UNSUPPORTED"
brief       = "Not supported"
message     = "Operation not supported"
position    = "INIT"

[kernel.sys.unimplemented]
code        = 25
name        = "CPISI_ERR_KERNEL_UNIMPLEMENTED"
brief       = "Not implemented"
message     = "Operation not yet implemented"
position    = "CLEANUP"

[kernel.sys.deprecated]
code        = 26
name        = "CPISI_ERR_KERNEL_DEPRECATED"
brief       = "Deprecated"
message     = "Operation is deprecated"
position    = "UNKNOWN"

# ─────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ─────────────────────────────────────────────────────────────

# LAYER 4: HEALTH (codes 108-134) — THE CENTER
# "Beloved, I wish above all things that thou mayest prosper and be in health"
