# CLOSING BLOCK [CLOSING]
# ═══════════════════════════════════════════════════════════════

[_closing.X1_policy]
scripture = "Proverbs 22:28 (KJV) — Remove not the ancient landmark, which thy fathers have set."
never = [
    "Change error code values (breaks binary protocol)",
    "Remove CPISI_OK (code 0 must be success)",
    "Modify position meanings within tiers",
]
careful = [
    "Adding new error codes within existing layers",
    "Redefining error messages",
    "Adding new layers (follow foundation.toml architecture exactly)",
]
safe = [
    "Updating descriptions",
    "Adding metadata",
    "Adding examples",
    "Completing remaining layers",
]

[_closing.X2_extension]
planned = [
    "Complete SYSTEM through APP layers (codes 27-242)",
    "Extended domain codes (256+)",
]

[_closing.X3_troubleshooting]
code_collision = "Each code must be unique. Verify: code = (layer × 27) + (tier × 9) + position."
missing_position = "All 9 positions must be defined per tier. Check SUCCESS through UNKNOWN."
tier_gap = "Each layer needs CORE, EXT, SYS tiers. 27 codes total per layer."

[_closing.X4_reference]
related_files = [
    "errors/foundation.toml — Error architecture (layers, tiers, positions, formulas)",
    "errors/operations.toml — DAR phases, severity, recovery modes",
    "errors/generation.toml — Code generation templates",
    "math/core/definitions.toml — Ternary constants",
]

[_closing.X5_note]
note = "Currently defines KERNEL and HEALTH layers plus METADATA bridge codes (67 of 256). Other layers (SYSTEM, RUNTIME, FRAMEWORK, NETWORK, STORAGE, ENGINE, APP) follow the same pattern — 27 codes each in 3 tiers of 9 positions."
scripture = "In the beginning God created the heaven and the earth. — Genesis 1:1"
anchor = "Error codes are addresses in semantic space. The architecture (foundation.toml) defines the space. This file populates it with meaning."

