[_content]
format = "TOML — native tables, UTF-8, LF line endings"
key_convention = "lower_snake for properties, language-idiomatic for patterns"
constraint = "Generated code must match foundation.toml architecture exactly. Templates are language-specific but architecturally identical."
Cc = "Content Configurations — generation targets (C, Go, Rust), output files, type definitions"
Co = "Content Operations — generation process, templates, code patterns"
Cv = "Content Validation — syntax checks, test commands, schema"

# ─────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────

[identity]
key = "B-L0-types-error-generation"
name = "generation"
title = "Error System Code Generation"
version = "a-01.00"
parent = "foundation.toml"
sections = "Cx — Code Generation (C, Go, Rust targets)"

# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ─────────────────────────────────────────────────────────────

[generate]
description = "Code generation configuration for error system"

# ─────────────────────────────────────────────────────────────
# Cc.1 TARGETS — Language targets
# ─────────────────────────────────────────────────────────────

[generate.targets]
description = "Languages to generate error handling code for"

[generate.targets.c]
enabled = true
output = "error.gen.h"
type_def = "typedef uint16_t CpisiError"
patterns = ["#define macros", "enum error codes", "static inline functions"]

[generate.targets.go]
enabled = true
output = "error_gen.go"
package = "cpisi"
type_def = "type CpisiError uint16"
patterns = ["const blocks", "type definitions", "methods"]

[generate.targets.rust]
enabled = true
output = "error_gen.rs"
type_def = "type CpisiError = u16"
patterns = ["const definitions", "enum variants", "impl blocks"]

# ─────────────────────────────────────────────────────────────
# Co — Content Operations [OPS]
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Co.1 PROCESS — Generation steps
# ─────────────────────────────────────────────────────────────

[generate.process]
description = "Steps to generate error handling code"
steps = [
    "1. Parse foundation.toml architecture",
    "2. Generate layer base constants",
    "3. Generate tier offset constants",
    "4. Generate position constants",
    "5. Generate MAKE_ERROR macro/function",
    "6. Generate extraction macros/functions",
    "7. Generate severity mapping (from operations.toml)",
    "8. Generate DAR phase handlers (from operations.toml)",
]

# ─────────────────────────────────────────────────────────────
# Co.2 TEMPLATES — Language-specific boilerplate
# ─────────────────────────────────────────────────────────────

[generate.template.c_header]
description = "C header guard and includes"
content = """
#ifndef CPISI_ERROR_GEN_H
#define CPISI_ERROR_GEN_H

#include <stdint.h>

/* Generated from foundation.toml - DO NOT EDIT */

typedef uint16_t CpisiError;

{content}

#endif /* CPISI_ERROR_GEN_H */
"""

[generate.template.go_package]
description = "Go package declaration"
content = """
// Package cpisi provides error handling types and functions.
// Generated from foundation.toml - DO NOT EDIT
package cpisi

{content}
"""

[generate.template.rust_module]
description = "Rust module declaration"
content = """
//! CPI-SI Error types and handling.
//! Generated from foundation.toml - DO NOT EDIT

{content}
"""

# ─────────────────────────────────────────────────────────────
# Co.3 PATTERNS — Per-entity generation patterns
# ─────────────────────────────────────────────────────────────

[generate.layer.c_pattern]
description = "C layer constant pattern"
pattern = "#define CPISI_ERR_BASE_{NAME} ({index} * 27)"
example = "#define CPISI_ERR_BASE_KERNEL (0 * 27)  /* = 0 */"

[generate.layer.go_pattern]
description = "Go layer constant pattern"
pattern = "const ErrBase{Name} CpisiError = {index} * 27"
example = "const ErrBaseKernel CpisiError = 0 * 27  // = 0"

[generate.layer.rust_pattern]
description = "Rust layer constant pattern"
pattern = "pub const ERR_BASE_{NAME}: CpisiError = {index} * 27;"
example = "pub const ERR_BASE_KERNEL: CpisiError = 0 * 27;  // = 0"

[generate.formula.make_error_c]
description = "C MAKE_ERROR macro"
pattern = "#define CPISI_MAKE_ERROR(layer, tier, pos) (((layer) * 27) + ((tier) * 9) + (pos))"

[generate.formula.make_error_go]
description = "Go MakeError function"
pattern = """
func MakeError(layer, tier, pos int) CpisiError {
    return CpisiError(layer*27 + tier*9 + pos)
}
"""

[generate.formula.extract_c]
description = "C extraction macros"
pattern = """
#define CPISI_ERR_LAYER(e)    ((e) / 27)
#define CPISI_ERR_TIER(e)     (((e) % 27) / 9)
#define CPISI_ERR_POSITION(e) (((e) % 27) % 9)
"""

# ─────────────────────────────────────────────────────────────
# Cv — Content Validation [VALIDATE]
# ─────────────────────────────────────────────────────────────

[generate.validation]
description = "How to validate generated code"

[generate.validation.syntax]
c_compile = "gcc -fsyntax-only -Wall -Werror -pedantic {file}"
go_build = "go build -v {package}"
rust_check = "cargo check --lib"

[generate.validation.tests]
c_test = "Test MAKE_ERROR produces expected values"
go_test = "Test extraction functions round-trip"
rust_test = "Test const values match specification"

[_validation]
commands = ["cws-struct lint toml errors/generation.toml"]

[_validation.schema]
required = ["identity", "generate"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
valid_values = 30
template_completeness = 30

