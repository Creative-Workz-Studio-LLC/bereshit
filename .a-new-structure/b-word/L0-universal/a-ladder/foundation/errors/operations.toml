# ─────────────────────────────────────────────────────────────
# Cc — Content Configurations [CONFIG]
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Cc.1 DAR — Detect/Assess/Recover Phases
# ─────────────────────────────────────────────────────────────

[dar]
description = "Detect → Assess → Recover: The three phases of error handling"
phases = ["detect", "assess", "recover"]

[dar.detect]
phase = 1
name = "DETECT"
brief = "Notice the error"
description = "First awareness that something went wrong"
questions = ["What happened?", "Where did it happen?", "What was the context?"]

[dar.detect.omnicode]
marker = "@dar.detect"
example = "@dar.detect KERNEL.CORE.NULL"

[dar.detect.cpisi]
mental_pos = "(-1, 0, 0)"
k_factor = -1
role = "Awareness — breaking down to identify problem"

[dar.assess]
phase = 2
name = "ASSESS"
brief = "Understand severity and impact"
description = "Evaluate how serious the error is"
questions = ["How bad is it?", "Can we recover?", "What resources do we need?"]

[dar.assess.omnicode]
marker = "@dar.assess"
example = "@dar.assess severity=critical"

[dar.assess.cpisi]
mental_pos = "(0, 0, 0)"
k_factor = 0
role = "Evaluation — balanced assessment"

[dar.recover]
phase = 3
name = "RECOVER"
brief = "Take corrective action"
description = "Fix the problem or fail gracefully"
questions = ["What's the fix?", "How do we clean up?", "What do we report?"]

[dar.recover.omnicode]
marker = "@dar.recover"
example = "@dar.recover action=retry"

[dar.recover.cpisi]
mental_pos = "(+1, 0, 0)"
k_factor = +1
role = "Action — building up toward solution"

# ─────────────────────────────────────────────────────────────
# Cc.2 SEVERITY — Error Severity Levels
# ─────────────────────────────────────────────────────────────

[severity]
description = "Error severity determines required response"
levels = ["fatal", "critical", "warning", "info", "debug"]

[severity.fatal]
level = 0
name = "FATAL"
ternary = -1
brief = "Cannot continue"
description = "System must terminate immediately"
action = "Log and exit"
tier_map = "CORE tier, positions 1-4"

[severity.critical]
level = 1
name = "CRITICAL"
ternary = -1
brief = "Major problem"
description = "Operation failed, requires attention"
action = "Log, notify, attempt recovery"
tier_map = "CORE tier, positions 5-8"

[severity.warning]
level = 2
name = "WARNING"
ternary = 0
brief = "Minor problem"
description = "Something unexpected but recoverable"
action = "Log, continue with fallback"
tier_map = "EXT tier"

[severity.info]
level = 3
name = "INFO"
ternary = 0
brief = "Informational"
description = "Noteworthy condition"
action = "Log for diagnostics"
tier_map = "SYS tier, positions 0-4"

[severity.debug]
level = 4
name = "DEBUG"
ternary = +1
brief = "Debug only"
description = "Developer information"
action = "Log in debug builds only"
tier_map = "SYS tier, positions 5-8"

# ─────────────────────────────────────────────────────────────
# Cc.3 RECOVERY — Recovery Modes
# ─────────────────────────────────────────────────────────────

[recovery]
description = "Recovery strategies for different error types"

[recovery.retry]
name = "RETRY"
description = "Try the operation again"
when = ["Transient failures", "Network timeouts", "Resource busy"]
max_attempts = 3
backoff = "exponential"

[recovery.fallback]
name = "FALLBACK"
description = "Use alternative approach"
when = ["Primary path unavailable", "Resource exhausted"]
example = "Use cached value if network fails"

[recovery.propagate]
name = "PROPAGATE"
description = "Let caller handle it"
when = ["Caller has more context", "Error affects caller's operation"]
transform = "May wrap error with additional context"

[recovery.ignore]
name = "IGNORE"
description = "Continue without handling"
when = ["DEBUG level errors", "Non-critical metrics"]
warning = "Use sparingly — most errors should be handled"

[recovery.terminate]
name = "TERMINATE"
description = "Stop operation or process"
when = ["FATAL errors", "Unrecoverable state"]
cleanup = "Always clean up resources before terminating"

