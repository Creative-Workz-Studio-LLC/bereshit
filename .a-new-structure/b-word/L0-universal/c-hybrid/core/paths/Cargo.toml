# -------------------------------------------------------------------
# Cc.2 TARGETS -- Library Configuration [DEFAULT]
# -------------------------------------------------------------------
#
# Library crate -- default target. No [lib] section needed because
# Cargo infers lib from src/lib.rs. No [[bin]] because this is a
# library, not an executable.

# -------------------------------------------------------------------
# Co -- Content Operations
# -------------------------------------------------------------------

# Co.1 DEPENDENCIES -- Crate Dependencies [MINIMAL]
#
# Pure std + identity only. No external dependencies.
# The identity crate enables register_identity() for the global
# component registry. Path resolution uses only std::{env, fs, io,
# path, sync::OnceLock}.
[dependencies]
bereshit-l0-identity = { workspace = true }

[dev-dependencies]

# Co.2 FEATURES -- Optional Capabilities [DEFINED]
#
# Future: XDG compliance, path validation, Windows support.
# Currently empty because hardcoded resolution covers all
# current workstation configurations.
[features]
default = []

# Co.3 LINTS -- Code Quality Rules [WORKSPACE]
#
# Workspace-level lints keep all crates consistent.
[lints]
workspace = true

