# ===================================================================
# CONTENT BLOCK [CONTENT] (continued)
# ===================================================================
#
# [package] is above (TOML ordering constraint). Remaining
# content sections follow here.
#
# Zones:
#   Cc -- Configurations  Crate identity [package] and targets [lib]/[[bin]]
#   Co -- Operations      Dependencies, features, lints
#   Cv -- Validation      Build verification (comments only)
#
# Ordering: cargo_convention (package -> targets -> deps -> features -> lints)

# -------------------------------------------------------------------
# Cc.2 TARGETS -- Library Configuration [DEFAULT]
# -------------------------------------------------------------------
#
# Library crate -- default target. No [lib] section needed because
# Cargo infers lib from src/lib.rs. No [[bin]] because this is a
# library, not an executable.

# -------------------------------------------------------------------
# Co -- Content Operations
# -------------------------------------------------------------------

# Co.1 DEPENDENCIES -- Crate Dependencies [MINIMAL]
#
# Serde-only. No heavy dependencies (rusqlite, networking, etc.).
# The DB loader that reads a-ladder specs lives separately in
# bereshit-l2-database (spec tier). Foundation stays lightweight.
#
# Design decision: serde + serde_json enable JSON serialization for
# OpResult, Session, SessionContext, and Workflow types. This is the
# minimum needed for cross-layer type sharing.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]

# Co.2 FEATURES -- Optional Capabilities [DEFINED]
#
# Future: format-specific feature gates (toml, yaml) for
# additional serialization targets beyond JSON. Currently empty
# because serde + serde_json covers all current use cases.
[features]
default = []

# Co.3 LINTS -- Code Quality Rules [WORKSPACE]
#
# Workspace-level lints keep all crates consistent.
[lints]
workspace = true

# -------------------------------------------------------------------
# Cv -- Content Validation (comments only)
# -------------------------------------------------------------------
#
#   cargo check -p bereshit-l0-foundation    -- Type-check
#   cargo build -p bereshit-l0-foundation    -- Full build
#   cargo test  -p bereshit-l0-foundation    -- Run tests
#   cargo clippy -p bereshit-l0-foundation   -- Lint check
#   cargo fmt --check                        -- Format check

# ===================================================================
# END CONTENT [END]
# ===================================================================


