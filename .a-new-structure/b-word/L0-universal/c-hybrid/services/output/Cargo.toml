# #!omni code --toml --cargo

# ===================================================================
# Cargo.toml -- 3-Block (METADATA + CONTENT + CLOSING)
# ===================================================================
#
# Structure: 3-block (METADATA + CONTENT + CLOSING)
#
# TOML constraint: [package] must come before [package.metadata.*]
# sub-tables. So the physical order is:
#
#   [package]                        <- Cc.1 identity (CONTENT)
#   [package.metadata.omni.*]        <- I/C metadata (METADATA)
#   [package.metadata.omni._closing] <- X closing (CLOSING)
#   [dependencies] etc.              <- Co sections (CONTENT continued)
#
# Logical structure is still: METADATA -> CONTENT -> CLOSING
# Physical ordering respects TOML's sub-table rule.

# -------------------------------------------------------------------
# [package] -- MUST come first (TOML sub-table ordering rule)
# -------------------------------------------------------------------
#
# Cc.1 PACKAGE -- Crate Identity [REQUIRED]
#
# Terminal output formatting for CPI-SI tools — headers, sections,
# key-value pairs, tables, status indicators, and JSON helpers.
# Writer-based testability pattern. Pure std + identity only.
[package]
name = "bereshit-l0-output"
version = "0.3.0"
description = "Terminal output formatting — headers, tables, status, JSON, writer-based testability"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

# ===================================================================
# METADATA BLOCK [METADATA]
# ===================================================================
#
# OmniCode metadata lives in [package.metadata.omni] -- Cargo's
# sanctioned extension point. Cargo ignores everything under
# package.metadata.

