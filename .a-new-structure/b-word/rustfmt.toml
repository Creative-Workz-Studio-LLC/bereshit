# #!omni code --toml --config
#
# rustfmt.toml -- Rust Formatter Configuration
# ===================================================================
#
# Workspace-level formatting rules for all Bereshit Rust crates.
#
# Column-aligned PRAGMA/METADATA statics use #[rustfmt::skip] per-item
# because rustfmt's stable channel doesn't support alignment options.
# This file enforces the baseline formatting rules.
#
# Reference: https://rust-lang.github.io/rustfmt/
# ===================================================================

# Edition governs syntax parsing (e.g., 2024 unsafe rules)
edition = "2024"

# Maximum line width before wrapping
max_width = 100

# Use Unix-style line endings (LF only)
newline_style = "Unix"

# Use block indent style (standard Rust convention)
indent_style = "Block"

# 4-space indentation (Rust default)
tab_spaces = 4

# Use spaces, not tabs
hard_tabs = false
