jsonc = "None"
json = "None"
relationship = "TOML defines network data. Generated code implements lookups."

[_metadata.M6_location]
path = "b-word/L4-faithnet/network/timestamp.toml"
derives_from = "b-word/seed/data/toml/config.toml"

[_metadata.M7_classification]
