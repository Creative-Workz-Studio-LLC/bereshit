philosophy = "Time is more than timestamp. Compound states capture: - past-future: Using memories to anticipate (bypassing present) - future-past: Using anticipation to reinterpret history The hyphen shows which temporal lens interprets which dimension."

[_metadata.M9_roadmap]
history = [
    "a-01.00 (2025-12-12) — Initial creation",
    "b-01.00 (2026-02-11) — TOML-native 3-block format alignment",
]
