[_metadata.M4_grounding]
scripture = "To every thing there is a season, and a time to every purpose under the heaven.\" — Ecclesiastes 3:1 KJV"
principle = "Time is not merely measurement — it is dimension of thought. God exists outside time, yet created within it. We navigate time not just by WHEN, but by HOW we think through it."
anchor = "Genesis 1:1 — In the beginning God created the heaven and the earth"

[_metadata.M5_dependencies]
requires = ["b-word/core/types/primitives.toml", "b-word/core/types/composition.toml"]
