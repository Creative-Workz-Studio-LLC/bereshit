[_validation.schema]
required = ["pragma", "control", "direction", "binding", "structure", "scope", "nesting", "containment", "reference", "punctuation", "emphasis", "access", "comparison", "arithmetic", "type_op", "composition", "ternary", "comment", "keywords", "phrasal", "disambiguation", "philosophy", "token_types", "precedence"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 30
all_tables_valid = 25
token_type_coverage = 25
data_completeness = 20

