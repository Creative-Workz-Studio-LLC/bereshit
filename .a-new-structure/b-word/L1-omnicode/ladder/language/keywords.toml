# Cc — Content Configurations
[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Ladder data file — omnicode keyword lexicon for the OmniCode system"
Cc = "Content Configurations — Keyword definitions for OmniCode"
Co = "Content Operations — keywords data"
Cv = "Content Validation — schema requirements, type constraints"

[declaration.let]
keyword = "let"
category = "declaration"
role = "introduces type or value declaration"
scripture = "Genesis 1:3"
scripture_text = "And God said, Let there be light"
example = "let Person be with name as text"
reserved = true

[declaration.be]
keyword = "be"
category = "declaration"
role = "establishes identity or assignment"
scripture = "Exodus 3:14"
scripture_text = "I AM THAT I AM"
example = "let health be 65"
reserved = true

[declaration.there]
keyword = "there"
category = "declaration"
role = "existential declaration (with shall)"
scripture = "Genesis 1:3"
scripture_text = "Let there be light"
example = "there shall be trit"
reserved = true

[declaration.shall]
keyword = "shall"
category = "declaration"
role = "prophetic/future declaration"
scripture = "Genesis 1:14"
scripture_text = "Let there be lights in the firmament"
example = "there shall be truth"
reserved = true


