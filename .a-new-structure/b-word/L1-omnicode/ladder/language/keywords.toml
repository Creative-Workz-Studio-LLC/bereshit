order = 2  # After types (1), before bible (3)
guard = "KEYWORDS_GEN_H"
description = "Keyword constants — permission states, temporal states, message modes"
sections = [
    "permission.granted",
    "permission.deferred",
    "permission.denied",
    "temporal.past",
    "temporal.present",
    "temporal.future",
    "message.thought",
    "message.process",
    "message.speech",
    "message.private",
    "message.shared",
    "message.public",
    "resolution.yet",
    "resolution.dawn",
    "resolution.silence"
]

