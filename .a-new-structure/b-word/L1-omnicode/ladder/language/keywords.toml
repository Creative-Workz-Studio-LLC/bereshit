# Cv — Content Validation
# ─────────────────────────────────────────────────────────────

[_validation]
commands = ["python3 -c \"import tomllib; tomllib.load(open('keywords.toml','rb'))\""]

[_validation.schema]
required = ["composition", "conditional", "covenant", "declaration", "derivation", "generate", "generic", "message", "nullability", "permission", "relation", "resolution", "temporal"]
optional = ["extensions"]

[_validation.health_scoring]
total = 100
correct_structure = 40
all_tables_valid = 30
data_completeness = 30

