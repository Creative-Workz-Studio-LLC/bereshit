# Base states (3)
[temporal.past]
keyword = "past"
category = "temporal"
role = "temporal state: what was (-1)"
scripture = "Isaiah 46:9"
scripture_text = "Remember the former things of old"
example = "remember health from past"
reserved = true
value = -1
# Crystallized truth — it happened, cannot change

[temporal.present]
