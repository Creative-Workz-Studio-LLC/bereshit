reserved = true
# Known positions when manifest is absent — observation points

[resolution.trumpet]
keyword = "trumpet"
category = "resolution"
role = "verb: signal alert, rally response to problem section"
scripture = "Nehemiah 4:20"
scripture_text = "In what place ye hear the sound of the trumpet, resort ye thither"
example = "trumpet when dependency missing"
reserved = true
# When a section needs help, the whole system responds

[resolution.appointed]
keyword = "appointed"
category = "resolution"
role = "ordering: scheduled, at the proper time in the sequence"
scripture = "Habakkuk 2:3"
scripture_text = "For the vision is yet for the appointed time... it won't prove false"
example = "load layers in appointed order"
reserved = true
# Don't rush, don't doubt — the appointed time isn't late

[resolution.plain]
keyword = "plain"
category = "resolution"
role = "clarity: written so the reader can immediately act"
scripture = "Habakkuk 2:2"
scripture_text = "Write the vision, and make it plain on tablets, that he may run who reads it"
example = "make error plain so user can fix"
reserved = true
# Documentation and errors must be actionable, not academic

# Recovery keywords (from Malachi 3 — refiner's fire)
[resolution.rise]
keyword = "rise"
category = "resolution"
role = "verb: recover after failure, ascend from the fall"
scripture = "Proverbs 24:16"
scripture_text = "For a righteous man falls seven times, and rises up again"
example = "rise from config error with fallback"
reserved = true
# Seven times — multiple cycles expected. The rising IS the character.

[resolution.refine]
keyword = "refine"
category = "resolution"
role = "verb: iterative purification through cycles"
scripture = "Malachi 3:3"
scripture_text = "He will sit as a refiner and purifier of silver"
example = "refine config through validation cycles"
reserved = true
# The refiner sits — patience. Each cycle removes dross the previous couldn't reach.

[resolution.dross]
keyword = "dross"
category = "resolution"
role = "noun: impurity to remove during refinement"
scripture = "Proverbs 25:4"
scripture_text = "Take away the dross from the silver, and material comes out for the refiner"
example = "identify dross in config before loading"
reserved = true
# What gets removed — the vessel only emerges after sufficient refinement

[resolution.dawn]
keyword = "dawn"
category = "resolution"
role = "state: ascending progress, each cycle brighter"
scripture = "Proverbs 4:18"
scripture_text = "The path of the righteous is like the dawning light, that shines more and more until the perfect day"
example = "recovery dawn — each pass brings more clarity"
reserved = true
value = 1
# The spiral doesn't just loop — it brightens

[resolution.silence]
keyword = "silence"
category = "resolution"
role = "halt state: completion, the anchor after all work"
scripture = "Habakkuk 2:20"
scripture_text = "But Yahweh is in his holy temple. Let all the earth be silent before him"
example = "when all loaded then silence"
reserved = true
value = 0
# After all engineering — silence. The Lord is in His temple.


