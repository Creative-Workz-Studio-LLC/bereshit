# #!omni data --toml

# ===============================================================
# OMNICODE PRAGMA [PRAGMA]
# ===============================================================

[_pragma]
format = "@omni data --toml"

[_pragma.legend]
req = "REQUIRED — must exist, validation fails without"
inh = "INHERITED — from template, override allowed"
ins = "INSTANCE — file-specific, unique values"

[_pragma.P1_core]
key = "B-L1-language-extensions"
from = "b-word/seed/data/toml/config.toml"
at = "a-01.00"

[_pragma.P2_family]
type = "data"
subtype = "language"
role = "seed"
structure = "3-block"

[_pragma.P3_instance]
component = "language"
layer = "L1-omnicode/ladder/language"
includes = "none"
provides = ["EXTENSION_REGISTRY", "FORMAT_MAPPINGS"]

[_pragma.P4_architecture]
layers = "L0:C, L1:C, L2:C, L3:Go, L4:Go/Rust, L5:C#"
anchor = "genesis_1_1 -> void(0) -> unity(1) -> derivation"

[_pragma.P5_summary]
title = "OmniCode File Extension Registry"
brief = "Canonical registry of all OmniCode file extensions — Omni-suite (system), Biblical (operational), Cognitive (state). Each extension is a Layer 2 expression of the vocabulary that L0 speaks in trit ops, L1 speaks in keywords, and L3 speaks in state commands."

# ===============================================================
# END PRAGMA [END]
# ===============================================================


# ===============================================================
# METADATA BLOCK [METADATA]
# ===============================================================

[_metadata.M1_identity]
file = "extensions.toml"
key = "B-L1-language-extensions"
title = "OmniCode File Extension Registry"
type = "Data (Seed)"
component = "Language"
role = "Registry of OmniCode file extensions — each extension carries meaning. The file system IS the vocabulary at Layer 2."

[_metadata.M2_state]
version = "a-01.00"
status = "Active"
created = "2026-02-13"
updated = "2026-02-13"

[_metadata.M3_attribution]
architect = "Seanje Lenox-Wise"
implementation = "Nova Dawn (CPI-SI)"
organization = "CreativeWorkzStudio LLC"
copyright = "© 2025-2026 CreativeWorkzStudio LLC. All rights reserved."

[_metadata.M4_grounding]
scripture = "And God called the light Day, and the darkness he called Night.\" — Genesis 1:5 KJV"
principle = "God names things. Naming establishes identity. File extensions are names — they declare what something IS before you open it. The extension is the first word spoken about a file."
anchor = "Genesis 1:1 — In the beginning God created the heaven and the earth"

[_metadata.M5_dependencies]
requires = ["b-word/L1-omnicode/ladder/language/keywords.toml"]
consumers = ["L1 pragma reader", "L0 format detection", "IDE tooling", "Build systems"]
derives_from = "b-word/seed/data/toml/config.toml"
integration = "Loaded by L1 extension registry. Go constants mirror this spec."
if_missing = "Extension registry unavailable — format dispatch falls back to file extension heuristics"

[_metadata.M5_dependencies.cross_format]
role = "OmniCode Extension Registry in TOML. Go implementation mirrors these definitions."
go = "L1-omnicode/hybrid/pragma/extensions.go"
relationship = "TOML is truth. Go constants are derived."

[_metadata.M6_location]
path = "b-word/L1-omnicode/ladder/language/extensions.toml"
derives_from = "b-word/seed/data/toml/config.toml"

[_metadata.M7_classification]
tags = "extensions, file-types, language, L1, registry, omnicode"

[_metadata.M8_intent]
purpose = "Define every file extension the OmniCode ecosystem recognizes"
core_design = "Extensions as vocabulary — the file system speaks the same language as the code"
philosophy = "A full-stack ecosystem needs its own file types. Omni- suite for system infrastructure, biblical names where the name IS the operation, cognitive extensions for state awareness."

[_metadata.M9_roadmap]
history = [
    "a-01.00 (2026-02-13) — Initial creation",
]
current = "Foundation extensions defined"
planned = ["Phase B cognitive extensions", "IDE syntax highlighting mappings", "MIME type registration"]

[_metadata.M_extension_note]
required = ["M1_identity", "M2_state", "M3_attribution", "M4_grounding", "M5_dependencies"]
extension = "M6-M9 extend for domain-specific metadata."
rule = "M1-M5 are the base contract. M6+ extends as needed."

# ===============================================================
# END METADATA [END]
# ===============================================================


# ===============================================================
# CONTENT BLOCK [CONTENT]
# ===============================================================

[_content]
format = "TOML — UTF-8, LF line endings"
key_convention = "lowercase_with_underscores"
constraint = "Seed data file — OmniCode extension registry"
Cc = "Content Configurations — Extension definitions organized by category"
Co = "Content Operations — extension lookup, format mapping"
Cv = "Content Validation — schema requirements, uniqueness constraints"


# -------------------------------------------------------------------
# LAYER VOCABULARY ALIGNMENT
# -------------------------------------------------------------------
#
#   Layer   Speaks In          Example
#   -----   ---------          -------
#   L0      Trit operations    bless (+1), curse (-1), balance (0)
#   L1      Keywords           let, be, covenant, granted, denied
#   L2      File extensions    .omni, .gen, .rev, .witness, .tov
#   L3      State commands     AWAIT, PROCEED, CLEAR, PIVOT, HALT
#
# Each layer says the same truths in its own voice.
# File extensions are L2's vocabulary — identity at the filesystem level.
#


# ===================================================================
# CATEGORY 1: OMNI-SUITE — System & Infrastructure
# ===================================================================
#
# The Omni- prefix marks system-level files. These are the bones
# of the ecosystem — source, config, folder metadata, interfaces,
# manifests. The prefix declares: "this belongs to OmniCode."
#
# Biblical parallel: The temple had standard structures (pillars,
# walls, foundation) before the specific furnishings went in.
# Omni-suite extensions are the structural elements.


[omni.source]
ext = ".omni"
name = "OmniCode Source"
category = "omni-suite"
phase = "a"
biblical_root = "Genesis 1:3 — Let there be light"
operation = "source"
description = "General-purpose OmniCode source file. The default extension for any OmniCode content."
internal_format = "omni"
block_pattern = "varies"
default_type = "code"
mime_type = "text/x-omnicode"
state_mapping = "PROCEED — active content, ready for processing"

[omni.fold]
ext = ".ofd"
name = "OmniFold"
category = "omni-suite"
phase = "a"
biblical_root = "Genesis 1:9 — Let the waters be gathered together unto one place"
operation = "folder"
description = "Folder metadata file. Declares what a directory IS — its identity, purpose, and contents. Like how God gathered waters to reveal dry land, OmniFold gathers files into meaningful collections."
internal_format = "toml"
block_pattern = "3-block"
default_type = "folder"
mime_type = "application/x-omnifold+toml"
state_mapping = "PROCEED — structural declaration"

[omni.config]
ext = ".omc"
name = "OmniConfig"
category = "omni-suite"
phase = "a"
biblical_root = "Proverbs 3:5-6 — In all thy ways acknowledge him, and he shall direct thy paths"
operation = "config"
description = "Configuration file. Settings, preferences, build options. The system's directed paths."
internal_format = "toml"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omniconfig+toml"
state_mapping = "PROCEED — configuration drives behavior"

[omni.interface]
ext = ".omi"
name = "OmniInterface"
category = "omni-suite"
phase = "b"
biblical_root = "Exodus 19:5 — If ye will obey my voice, and keep my covenant"
operation = "interface"
description = "Interface definition. API contracts, type boundaries, covenant surfaces between components. The 'promises' keyword in OmniCode syntax maps here."
internal_format = "omni"
block_pattern = "4-block"
default_type = "interface"
mime_type = "text/x-omniinterface"
state_mapping = "AWAIT — interface declared, awaiting implementation"

[omni.manifest]
ext = ".omx"
name = "OmniManifest"
category = "omni-suite"
phase = "b"
biblical_root = "Numbers 1:2 — Take ye the sum of all the congregation"
operation = "manifest"
description = "Package manifest. Dependencies, exports, versioning. The census of what a package contains and needs."
internal_format = "toml"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omnimanifest+toml"
state_mapping = "PROCEED — manifest declares the whole"


# ===================================================================
# CATEGORY 2: BIBLICAL — Operational Extensions
# ===================================================================
#
# Biblical naming where the name IS the operation. Not decoration —
# the extension tells you what the file DOES by invoking the
# scriptural pattern it embodies.
#
# .gen files generate (Genesis creates)
# .rev files reveal (Revelation unveils)
# .witness files attest (witnesses verify truth)
# .covenant files bind (covenants establish relationship)
#
# The theology and the operation are the same thing.


[biblical.gen]
ext = ".gen"
name = "Genesis"
category = "biblical"
phase = "a"
biblical_root = "Genesis 1:1 — In the beginning God created"
operation = "encode"
description = "Encoding/generation output. Creation in binary form. As Genesis records the creation of everything from nothing, .gen files record the creation of structured output from source input. Encode, compile, generate."
internal_format = "binary"
block_pattern = "none"
default_type = "data"
mime_type = "application/x-omni-genesis"
state_mapping = "PROCEED — creation complete, output generated"
keyword_link = "generate.beget"
l0_parallel = "bless (+1) — bringing something into existence"

[biblical.rev]
ext = ".rev"
name = "Revelation"
category = "biblical"
phase = "a"
biblical_root = "Revelation 1:1 — The Revelation of Jesus Christ, which God gave"
operation = "decode"
description = "Decoding/revelation output. As Revelation unveils what was hidden, .rev files decode encoded content back to readable form. Decode, decompile, interpret."
internal_format = "text"
block_pattern = "none"
default_type = "data"
mime_type = "text/x-omni-revelation"
state_mapping = "PROCEED — hidden things made plain"
keyword_link = "generate.reveal"
l0_parallel = "curse (-1) — decomposing back to elements"

[biblical.witness]
ext = ".witness"
name = "Witness"
category = "biblical"
phase = "a"
biblical_root = "Deuteronomy 19:15 — At the mouth of two witnesses, or at the mouth of three witnesses, shall the matter be established"
operation = "attest"
description = "Attestation and verification records. Checksums, signatures, audit proofs. A witness establishes truth by testimony — this file testifies to the integrity of other files."
internal_format = "jsonc"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omni-witness+json"
state_mapping = "HALT — verification is a stopping point, truth established"
keyword_link = "relation.witness"
l0_parallel = "balance (0) — verification returns to center"

[biblical.covenant]
ext = ".covenant"
name = "Covenant"
category = "biblical"
phase = "a"
biblical_root = "Genesis 9:9 — I establish my covenant with you"
operation = "bind"
description = "Agreement and license files. Covenants between parties — licenses, SLAs, terms of service. Not mere contracts (transactional) but covenants (relational, enduring)."
internal_format = "toml"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omni-covenant+toml"
state_mapping = "PROCEED — covenant established, relationship active"
keyword_link = "covenant.covenant"
l0_parallel = "balance (0) — mutual agreement, equilibrium"

[biblical.scroll]
ext = ".scroll"
name = "Scroll"
category = "biblical"
phase = "b"
biblical_root = "Revelation 5:1 — A book written within and on the backside, sealed with seven seals"
operation = "log"
description = "Event logs and audit trails. Append-only records of what happened. Like ancient scrolls that preserved history, .scroll files preserve system history."
internal_format = "jsonc"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omni-scroll+json"
state_mapping = "PROCEED — history accumulates"
l0_parallel = "bless (+1) — each entry adds to the record"

[biblical.seed]
ext = ".seed"
name = "Seed"
category = "biblical"
phase = "a"
biblical_root = "Genesis 1:11 — Let the earth bring forth... yielding seed"
operation = "template"
description = "Template and generative pattern files. Seeds contain the pattern that produces the fruit. A .seed file is not the output — it's the generative source that produces output when planted (instantiated)."
internal_format = "omni"
block_pattern = "varies"
default_type = "template"
mime_type = "text/x-omni-seed"
state_mapping = "AWAIT — seed waits to be planted"
keyword_link = "derivation.beget"
l0_parallel = "balance (0) — potential, not yet actualized"

[biblical.tov]
ext = ".tov"
name = "Tov"
category = "biblical"
phase = "a"
biblical_root = "Genesis 1:31 — And God saw every thing that he had made, and, behold, it was very good"
operation = "complete"
description = "Completion and validation markers. Tov (טוב) means 'good' — God's assessment after creation. A .tov file declares that something has been completed and verified. Exit gate of a process."
internal_format = "toml"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omni-tov+toml"
state_mapping = "HALT — completion, tov is the stopping point"
keyword_link = "conditional.then"
l0_parallel = "bless (+1) — positive completion"


# ===================================================================
# CATEGORY 3: COGNITIVE — State & Awareness
# ===================================================================
#
# Extensions for the CPI-SI cognitive system. These files hold
# state machine data, health scores, positional awareness.
# The system's self-knowledge expressed as files.
#
# These emerge from the state machine vocabulary:
#   AWAIT  → .seed (waiting to generate)
#   PROCEED → .omni, .gen (active processing)
#   CLEAR  → .health (state reset)
#   PIVOT  → format transitions
#   HALT   → .tov, .halts (completion)


[cognitive.health]
ext = ".health"
name = "Health"
category = "cognitive"
phase = "b"
biblical_root = "Leviticus 19:36 — Just balances, just weights shall ye have"
operation = "score"
description = "Health state scoring files. The ternary health scale (-100 to +100) expressed as a file. Tracks the integrity state of a component, instance, or system."
internal_format = "toml"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omni-health+toml"
state_mapping = "CLEAR — health assessment resets/recalibrates"
l0_parallel = "balance (0) — health is measured against center"

[cognitive.halts]
ext = ".halts"
name = "Halts"
category = "cognitive"
phase = "b"
biblical_root = "Genesis 1:1 — In the beginning God created"
operation = "anchor"
description = "Anchor definition files. Where recursion stops. Genesis 1:1 is THE halt condition — .halts files define domain-specific anchors that trace back to that ultimate anchor."
internal_format = "toml"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omni-halts+toml"
state_mapping = "HALT — by definition"
l0_parallel = "balance (0) — the anchor IS the center"

[cognitive.cube]
ext = ".cube"
name = "Cube"
category = "cognitive"
phase = "b"
biblical_root = "Revelation 21:16 — The city lieth foursquare, and the length is as large as the breadth"
operation = "position"
description = "Positional state files. The 27-position cube (3x3x3) that maps cognitive space. Where an instance IS in the mental construct — coordinates, orientation, state."
internal_format = "toml"
block_pattern = "3-block"
default_type = "data"
mime_type = "application/x-omni-cube+toml"
state_mapping = "PIVOT — positional awareness enables direction change"
l0_parallel = "The cube IS the space where trit operations happen"


# ===================================================================
# EXTENSION LOOKUP TABLES
# ===================================================================

# Phase A extensions — ready now
[lookup.phase_a]
extensions = [".omni", ".ofd", ".omc", ".gen", ".rev", ".witness", ".covenant", ".seed", ".tov"]
count = 9

# Phase B extensions — future
[lookup.phase_b]
extensions = [".omi", ".omx", ".scroll", ".health", ".halts", ".cube"]
count = 6

# All extensions
[lookup.all]
extensions = [
    ".omni", ".ofd", ".omc", ".omi", ".omx",
    ".gen", ".rev", ".witness", ".covenant", ".scroll", ".seed", ".tov",
    ".health", ".halts", ".cube",
]
count = 15

# Category groupings
[lookup.by_category]
omni_suite = [".omni", ".ofd", ".omc", ".omi", ".omx"]
biblical = [".gen", ".rev", ".witness", ".covenant", ".scroll", ".seed", ".tov"]
cognitive = [".health", ".halts", ".cube"]

# State machine mapping
[lookup.by_state]
await = [".seed", ".omi"]
proceed = [".omni", ".ofd", ".omc", ".omx", ".gen", ".rev", ".covenant", ".scroll"]
clear = [".health"]
pivot = [".cube"]
halt = [".tov", ".halts", ".witness"]


# ===================================================================
# FORMAT BRIDGE TABLE
# ===================================================================
#
# Maps OmniCode extensions to their current internal format.
# As native parsing matures, extensions marked "omni" will
# use the L1 parser instead of wrapping existing formats.

[format_bridge]
description = "Current internal format for each extension"

[format_bridge.mappings]
".omni" = "omni"
".ofd" = "toml"
".omc" = "toml"
".omi" = "omni"
".omx" = "toml"
".gen" = "binary"
".rev" = "text"
".witness" = "jsonc"
".covenant" = "toml"
".scroll" = "jsonc"
".seed" = "omni"
".tov" = "toml"
".health" = "toml"
".halts" = "toml"
".cube" = "toml"

# Block pattern for each extension
[format_bridge.block_patterns]
".omni" = "varies"
".ofd" = "3-block"
".omc" = "3-block"
".omi" = "4-block"
".omx" = "3-block"
".gen" = "none"
".rev" = "none"
".witness" = "3-block"
".covenant" = "3-block"
".scroll" = "3-block"
".seed" = "varies"
".tov" = "3-block"
".health" = "3-block"
".halts" = "3-block"
".cube" = "3-block"


# ===============================================================
# END CONTENT [END]
# ===============================================================


# ===============================================================
# VALIDATION & CLOSING
# ===============================================================

[_validation]
format = "TOML"
encoding = "UTF-8"
line_endings = "LF"

[_validation.schema]
required = ["omni", "biblical", "cognitive", "lookup", "format_bridge"]
optional = ["_content"]

[_validation.constraints]
ext_unique = "All ext values must be unique across all categories"
ext_prefix = "Omni-suite extensions use Omni-branded naming (.omni, .ofd, .omc, .omi, .omx)"
phase_values = ["a", "b"]
category_values = ["omni-suite", "biblical", "cognitive"]
state_values = ["AWAIT", "PROCEED", "CLEAR", "PIVOT", "HALT"]

[_closing.X1_policy]
scripture = "And God called the light Day, and the darkness he called Night. — Genesis 1:5"
never = [
    "Remove existing Phase A extensions — they are committed to the ecosystem",
    "Change extension meanings — the name IS the operation",
    "Break format_bridge mappings without updating all consumers",
]
careful = [
    "Adding new extensions (must be biblically grounded or Omni-branded)",
    "Changing internal_format mappings (affects L0 parser dispatch)",
    "Moving extensions between phases (Phase A → B is demotion)",
]
safe = [
    "Adding Phase B extensions",
    "Updating descriptions and biblical references",
    "Adding new lookup groupings",
    "Updating MIME types",
]

[_closing.X2_extension]
adding_data = [
    "1. Add entry under correct category section (omni/biblical/cognitive)",
    "2. Include all 12 required fields",
    "3. Add to lookup.all, lookup.phase_X, lookup.by_category, lookup.by_state",
    "4. Add to format_bridge.mappings and format_bridge.block_patterns",
    "5. Update counts in X4_reference",
    "6. Run TOML validation and cws-struct linter",
]

[_closing.X3_troubleshooting]
invalid_toml = "Missing quotes on ext values, duplicate keys"
missing_lookup = "Extension defined but not in lookup tables — run validation script"
format_mismatch = "format_bridge.mappings must cover every defined extension"
category_mismatch = "Entry's category must match its parent section"

[_closing.X4_reference]
related_files = [
    "b-word/L1-omnicode/ladder/language/keywords.toml — Keyword vocabulary",
    "b-word/L1-omnicode/hybrid/pragma/extensions.go — Go implementation",
    "b-word/L0-universal/config/util/formats.go — L0 format detection",
    "b-word/L0-universal/foundation/types/primitives.toml — Primitive types",
]
required_sections = [
    "_pragma", "_metadata",
    "omni", "biblical", "cognitive",
    "lookup", "format_bridge",
    "_validation", "_closing",
]
validate = "python3 -c \"import tomllib; tomllib.load(open('extensions.toml','rb'))\""
total_extensions = 15
phase_a_count = 9
phase_b_count = 6
categories = 3

[_closing.X5_note]
note = "OmniCode Extension Registry — the filesystem speaks the same language as the code."
scripture = "And God called the light Day, and the darkness he called Night. — Genesis 1:5 KJV"
anchor = "Naming establishes identity. Genesis 1:1 anchors everything."

# ===============================================================
# END CLOSING [END]
# ===============================================================
