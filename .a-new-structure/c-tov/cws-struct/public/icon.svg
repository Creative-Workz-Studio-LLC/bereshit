<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0d1117"/>
  <!-- Border accent -->
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="#58a6ff" stroke-width="4"/>
  <!-- CWS text -->
  <text x="256" y="200" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="120" fill="#58a6ff">CWS</text>
  <!-- Studio text -->
  <text x="256" y="300" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="80" fill="#e6edf3">Studio</text>
  <!-- Health bar decoration -->
  <rect x="100" y="340" width="312" height="8" rx="4" fill="#21262d"/>
  <rect x="100" y="340" width="280" height="8" rx="4" fill="#3fb950"/>
  <!-- Three block indicators -->
  <rect x="130" y="380" width="70" height="40" rx="6" fill="#1f6feb" opacity="0.8"/>
  <text x="165" y="406" text-anchor="middle" font-family="monospace" font-size="16" fill="#e6edf3">CREATE</text>
  <rect x="220" y="380" width="70" height="40" rx="6" fill="#238636" opacity="0.8"/>
  <text x="255" y="406" text-anchor="middle" font-family="monospace" font-size="16" fill="#e6edf3">LINT</text>
  <rect x="310" y="380" width="70" height="40" rx="6" fill="#8b949e" opacity="0.6"/>
  <text x="345" y="406" text-anchor="middle" font-family="monospace" font-size="16" fill="#e6edf3">FMTS</text>
</svg>
