# ============================================================================
# METADATA - Universal Display Constants
# ============================================================================
# Key: B-sdk-data-universal-display
# Purpose: System defaults for terminal formatting and colors
# Scripture: Proverbs 25:11 - "A word fitly spoken is like apples of gold"
# ============================================================================

[ansi]
reset = "\u001b[0m"

[styles]
bold = "\u001b[1m"
dim = "\u001b[2m"
italic = "\u001b[3m"
underline = "\u001b[4m"

[colors.standard]
black = "\u001b[30m"
red = "\u001b[31m"
green = "\u001b[32m"
yellow = "\u001b[33m"
blue = "\u001b[34m"
magenta = "\u001b[35m"
cyan = "\u001b[36m"
white = "\u001b[37m"
gray = "\u001b[90m"

[colors.bright]
black = "\u001b[90m"
red = "\u001b[91m"
green = "\u001b[92m"
yellow = "\u001b[93m"
blue = "\u001b[94m"
magenta = "\u001b[95m"
cyan = "\u001b[96m"
white = "\u001b[97m"

[backgrounds]
black = "\u001b[40m"
red = "\u001b[41m"
green = "\u001b[42m"
yellow = "\u001b[43m"
blue = "\u001b[44m"
magenta = "\u001b[45m"
cyan = "\u001b[46m"
white = "\u001b[47m"
