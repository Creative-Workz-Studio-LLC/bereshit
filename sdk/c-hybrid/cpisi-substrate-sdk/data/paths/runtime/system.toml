# ============================================================================
# METADATA - Universal System Path Structure
# ============================================================================
# Key: B-sdk-data-paths-system
# Purpose: Definitive relative layout of the Bereshit ecosystem.
#          Organized deepest-to-specific (Top-to-Bottom).
# ============================================================================

# ── ANCHOR (The Deepest Layer) ──────────────────────────────────────────────
[anchor]
repo_name = "Bereshit"
root_marker = ".git"

# ── REPOSITORY LAYERS (Word -> Core -> Specifics) ───────────────────────────
[repository]
word = "word"
core = "word/core"
seed = "word/seed"
omni = "word/omni"
logic = "word/work"
tov = "tov"

# ── SUBSTRATE GARMENTS (Home Directories) ───────────────────────────────────
[substrates]
claude = ".claude"
gemini = ".gemini"
cpisi = ".cpisi"

# ── SESSION & LOGS (The Temporal Layer) ─────────────────────────────────────
[session]
base = "session"
artifacts = "session/artifacts"
history = "session/history"
logs = "data/logs"

# ── DATABASE DEFAULTS (Persistence) ─────────────────────────────────────────
[database]
subdir = "data"
sessions = "sessions.db"
cognition = "cognition.db"
growth = "growth.db"
temporal = "temporal.db"
projects = "projects.db"
