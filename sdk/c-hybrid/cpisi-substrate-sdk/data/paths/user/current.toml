# ============================================================================
# METADATA - User Environment Anchors
# ============================================================================
# Key: B-sdk-data-paths-user
# Purpose: User-specific absolute paths to guide system resolution.
# ============================================================================

# ── PHYSICAL ANCHORS ────────────────────────────────────────────────────────
[anchors]
# The primary drive where the work exists
project_drive = "/media/seanje-lenox-wise/Project"

# The absolute root of the Bereshit repository
bereshit_root = "/media/seanje-lenox-wise/Project/Bereshit"

# The workstation home directory
user_home = "/home/seanje-lenox-wise"

# ── OVERRIDES ───────────────────────────────────────────────────────────────
[overrides]
# SQLite databases must live on ext4 (home) to handle WAL locking
db_base_path = "/home/seanje-lenox-wise/.local/share/claude/data"

# Optional developer overrides
# log_level = "DEBUG"
