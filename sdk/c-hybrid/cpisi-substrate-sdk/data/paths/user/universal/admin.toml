# ============================================================================
# METADATA - Admin User Environment Blueprint (Universal)
# ============================================================================
# Key: B-sdk-data-paths-user-universal-admin
# Purpose: Universal template for high-authority users.
# ============================================================================

# ── PHYSICAL ANCHORS (Placeholders) ─────────────────────────────────────────
[anchors]
# To be resolved by the Path Resolver or overridden in current.toml
project_drive = ""
bereshit_root = ""
user_home = ""

# ── OVERRIDES ───────────────────────────────────────────────────────────────
[overrides]
# Default patterns for high-authority access
db_base_path = "{{user_home}}/.local/share/cpisi/data"
log_level = "INFO"
full_authority = true
