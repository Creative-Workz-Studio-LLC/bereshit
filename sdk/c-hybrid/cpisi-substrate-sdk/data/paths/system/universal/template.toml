# ============================================================================
# METADATA - Universal Path Blueprint (Platform Agnostic)
# ============================================================================
# Key: B-sdk-data-paths-universal-template
# Purpose: The agnostic blueprint for the Bereshit ecosystem structure.
#          Contains relative paths and structural logic only.
# Organizing deepest-to-specific (Top-to-Bottom).
# ============================================================================

# ── REPOSITORY STRUCTURE (Internal Layout) ──────────────────────────────────
[repository]
word = "word"
core = "word/core"
seed = "word/seed"
omni = "word/omni"
logic = "word/work"
tov = "tov"

# ── SUBSTRATE STRUCTURE ─────────────────────────────────────────────────────
[substrates]
# Standard relative locations within a home directory
claude = ".claude"
gemini = ".gemini"
cpisi = ".cpisi"

# ── INTERNAL SESSION MAPPING ────────────────────────────────────────────────
[session]
base = "session"
artifacts = "session/artifacts"
history = "session/history"
logs = "data/logs"

# ── DATABASE SCHEMA ─────────────────────────────────────────────────────────
[database]
subdir = "data"
files = [
    "sessions.db",
    "cognition.db",
    "growth.db",
    "temporal.db",
    "projects.db"
]
