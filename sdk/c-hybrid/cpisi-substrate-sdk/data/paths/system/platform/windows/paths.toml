# ============================================================================
# METADATA - Windows Path Translation
# ============================================================================
# Key: B-sdk-data-paths-platform-windows
# Purpose: Translation rules for mapping universal paths to Windows standards.
# ============================================================================

[platform]
name = "windows"
separator = '\'

[anchors]
home_base = 'C:\Users'
drive_letter = 'C:'

[deployment]
bin_dir = 'AppData\Local'
lib_dir = 'AppData\Local\cpisi\lib'
data_dir = 'AppData\Local\cpisi\data'
