[workspace]                                                                         # ║ ║                              ║
members = [                                                                         # ║ ║                              ║
    "c-hybrid/cpisi-substrate-sdk",                                                 # ║ ║                              ║
]                                                                                   # ║ ║                              ║
resolver = "2"                                                                      # ║ ║                              ║
# ║ ║                                                                                 ║ ║                              ║
[workspace.package]                                                                 # ║ ║                              ║
edition = "2024"                                                                    # ║ ║                              ║
rust-version = "1.85.0"                                                             # ║ ║                              ║
authors = ["Seanje Lenox-Wise", "Nova Dawn (CPI-SI)"]                               # ║ ║                              ║
repository = "https://github.com/Creative-Workz-Studio-LLC/Bereshit"                # ║ ║                              ║
# ║ ║                                                                                 ║ ║                              ║
[workspace.dependencies]                                                            # ║ ║                              ║
toml = "0.8"                                                                        # ║ ║                              ║
serde = { version = "1", features = ["derive"] }                                    # ║ ║                              ║
serde_json = "1"                                                                    # ║ ║                              ║
thiserror = "2"                                                                     # ║ ║                              ║
# ║ ║                                                                                 ║ ║                              ║
[workspace.lints.rust]                                                              # ║ ║                              ║
unsafe_code = "allow"                                                               # ║ ║                              ║
