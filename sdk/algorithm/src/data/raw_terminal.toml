# [OMNI:DATA] Raw Terminal Character Mapping & Shell Truth
# Use this for debugging ASCII collisions and substrate rendering.

[metadata]
substrate = "linux-deno"
encoding = "UTF-8"

[raw_samples]
# The // prefix/suffix
frame_start = "// "
frame_end = " //"

# Vertical Spine with escaping check
spine_heavy = "\u2551" # ║
spine_light = "\u2502" # │

# Joints
cross_heavy = "\u256c" # ╬
t_up_heavy = "\u2569" # ╩

[escape_test]
