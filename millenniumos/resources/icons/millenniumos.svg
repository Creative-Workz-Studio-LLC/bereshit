<?xml version="1.0" encoding="UTF-8"?>
<!--
MillenniumOS Icon
"In the beginning God created the heaven and the earth" — Genesis 1:1

Design: Stylized "M" with light rays representing "Let there be light"
Blue background (like the boot selector), golden "M" with radiating light
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle - Kingdom blue -->
  <circle cx="64" cy="64" r="60" fill="#1a237e"/>

  <!-- Light rays emanating from center (Genesis 1:3) -->
  <g fill="#ffd54f" opacity="0.6">
    <polygon points="64,20 68,45 60,45"/>
    <polygon points="64,108 60,83 68,83"/>
    <polygon points="20,64 45,60 45,68"/>
    <polygon points="108,64 83,68 83,60"/>
    <polygon points="32,32 50,48 44,54"/>
    <polygon points="96,96 78,80 84,74"/>
    <polygon points="96,32 80,50 74,44"/>
    <polygon points="32,96 48,78 54,84"/>
  </g>

  <!-- Inner glow circle -->
  <circle cx="64" cy="64" r="35" fill="#283593" stroke="#3949ab" stroke-width="2"/>

  <!-- Stylized "M" for MillenniumOS - golden -->
  <path d="M 40 85 L 40 50 L 52 70 L 64 50 L 76 70 L 88 50 L 88 85 L 80 85 L 80 65 L 70 80 L 64 70 L 58 80 L 48 65 L 48 85 Z"
        fill="#ffd54f" stroke="#ffb300" stroke-width="1"/>

  <!-- Small cross at top (Kingdom Technology) -->
  <rect x="62" y="28" width="4" height="12" fill="#ffd54f"/>
  <rect x="58" y="32" width="12" height="4" fill="#ffd54f"/>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#3949ab" stroke-width="3"/>
</svg>
