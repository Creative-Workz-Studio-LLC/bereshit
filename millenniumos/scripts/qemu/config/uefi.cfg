# =============================================================================
# METADATA
# =============================================================================
#
# Key:         millenniumos-qemu-uefi-config
# Title:       MillenniumOS QEMU UEFI Configuration
# Type:        Configuration
# Component:   Build Infrastructure
# Role:        QEMU machine configuration for UEFI boot mode
#
# Status:      Active
# Version:     2.0.0
# Created:     2025-01-30
# Updated:     2025-01-31
#
# Authors:     Seanje Lenox-Wise (Architect), Nova Dawn (Author)
# Organization: CreativeWorkzStudio LLC
#
# Grounding:   Genesis 1:1 — "In the beginning God created the heaven and
#              the earth." Configuration brings order to the system.
#
# Usage:       Source this file or use values directly in QEMU scripts
#              source "${CONFIG_DIR}/uefi.cfg"
#
# =============================================================================
# END METADATA
# =============================================================================

# =============================================================================
# MACHINE CONFIGURATION
# =============================================================================

# Machine type - Q35 is modern chipset with native AHCI, IOMMU
QEMU_MACHINE="q35"
QEMU_MACHINE_OPTS="smm=off"

# Acceleration - prefer KVM, fallback to TCG
QEMU_ACCEL="kvm:tcg"

# CPU configuration
QEMU_CPU="qemu64"
QEMU_SMP="2"

# Memory
QEMU_MEMORY="512M"

# =============================================================================
# FIRMWARE CONFIGURATION (OVMF/EDK2)
# =============================================================================

# System OVMF paths (Ubuntu/Debian)
SYS_OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
SYS_OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"

# EDK2 built OVMF paths (if available)
EDK2_OVMF_CODE="${ROOT_DIR:-..}/tools/edk2/Build/OvmfX64/DEBUG_GCC5/FV/OVMF_CODE.fd"
EDK2_OVMF_VARS="${ROOT_DIR:-..}/tools/edk2/Build/OvmfX64/DEBUG_GCC5/FV/OVMF_VARS.fd"

# Local writable copy of OVMF_VARS
OVMF_VARS_LOCAL="${BUILD_DIR:-build}/OVMF_VARS.fd"

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================

# ESP (EFI System Partition) settings
ESP_SIZE_MB="64"
ESP_PARTITION_START="2048"
ESP_PARTITION_SIZE="60M"
ESP_LABEL="ESP"
ESP_FS_TYPE="FAT32"

# Disk controller - AHCI for modern SATA
STORAGE_CONTROLLER="ahci"
STORAGE_BUS="ahci.0"

# =============================================================================
# DISPLAY CONFIGURATION
# =============================================================================

# VGA type - std for GOP compatibility
QEMU_VGA="std"

# Display backend
QEMU_DISPLAY="gtk"
QEMU_DISPLAY_OPTS="show-cursor=on"

# GOP framebuffer defaults (set by OVMF)
GOP_DEFAULT_WIDTH="1024"
GOP_DEFAULT_HEIGHT="768"
GOP_DEFAULT_BPP="32"

# =============================================================================
# SERIAL PORT CONFIGURATION
# =============================================================================

# COM1 (0x3F8) - OVMF firmware output
SERIAL_COM1_PORT="0x3F8"
SERIAL_COM1_IRQ="4"
SERIAL_COM1_OUTPUT="ovmf.log"
SERIAL_COM1_PURPOSE="OVMF firmware messages"

# COM2 (0x2F8) - MillenniumOS bootloader/kernel output
SERIAL_COM2_PORT="0x2F8"
SERIAL_COM2_IRQ="3"
SERIAL_COM2_OUTPUT="debug.log"
SERIAL_COM2_PURPOSE="MillenniumOS debug output"

# =============================================================================
# DEBUG CONFIGURATION
# =============================================================================

# GDB server
GDB_PORT="1234"
GDB_WAIT="true"

# QEMU debug flags
DEBUG_INT="int"
DEBUG_CPU="cpu_reset"
DEBUG_GUEST_ERRORS="guest_errors"

# No auto-reboot on crash (for debugging)
NO_REBOOT="true"
NO_SHUTDOWN="false"

# =============================================================================
# NETWORK CONFIGURATION (Future)
# =============================================================================

# Network disabled by default for security
NETWORK_ENABLED="false"

# When enabled, use user-mode networking
NETWORK_TYPE="user"
NETWORK_MODEL="virtio-net-pci"

# =============================================================================
# AUDIO CONFIGURATION (Future)
# =============================================================================

# Audio disabled by default
AUDIO_ENABLED="false"

# When enabled, use Intel HDA
AUDIO_DEVICE="intel-hda"
AUDIO_CODEC="hda-duplex"

# =============================================================================
# USB CONFIGURATION (Future)
# =============================================================================

# USB controller
USB_ENABLED="true"
USB_CONTROLLER="qemu-xhci"

# =============================================================================
# BOOT CONFIGURATION
# =============================================================================

# Boot order - first try disk
BOOT_ORDER="c"

# UEFI shell startup script
STARTUP_NSH_CONTENT='@echo -off
echo MillenniumOS UEFI Boot
echo.
fs0:
\EFI\BOOT\BOOTX64.EFI'

# =============================================================================
# PATH TEMPLATES
# =============================================================================

# These use variables that should be set by the calling script
# ESP_DIR, BUILD_DIR, ROOT_DIR

ESP_BOOTLOADER_PATH='${ESP_DIR}/EFI/BOOT/BOOTX64.EFI'
ESP_KERNEL_PATH='${ESP_DIR}/kernel.bin'
ESP_IMAGE_PATH='${BUILD_DIR}/esp.img'
DEBUG_LOG_PATH='${BUILD_DIR}/debug.log'
OVMF_LOG_PATH='${BUILD_DIR}/ovmf.log'

# =============================================================================
# QEMU COMMAND TEMPLATES
# =============================================================================

# Base QEMU command (assembled by scripts)
# qemu-system-x86_64 \
#     -machine ${QEMU_MACHINE},${QEMU_MACHINE_OPTS} \
#     -cpu ${QEMU_CPU} \
#     -smp ${QEMU_SMP} \
#     -m ${QEMU_MEMORY} \
#     -drive if=pflash,format=raw,unit=0,readonly=on,file=${OVMF_CODE} \
#     -drive if=pflash,format=raw,unit=1,file=${OVMF_VARS_LOCAL} \
#     -drive file=${ESP_IMAGE},format=raw,if=none,id=disk0 \
#     -device ${STORAGE_CONTROLLER},id=ahci \
#     -device ide-hd,drive=disk0,bus=${STORAGE_BUS} \
#     -vga ${QEMU_VGA} \
#     -display ${QEMU_DISPLAY},${QEMU_DISPLAY_OPTS} \
#     -serial file:${OVMF_LOG} \
#     -serial file:${DEBUG_LOG} \
#     -monitor stdio \
#     -no-reboot

# =============================================================================
# VISUAL DEBUG COLORS (Used by bootloader)
# =============================================================================

# Color codes for framebuffer debugging
COLOR_YELLOW="0xFFFF00"      # In progress
COLOR_GREEN="0x00FF00"       # Success
COLOR_RED="0xFF0000"         # Failure
COLOR_ORANGE="0xFFA500"      # Fallback path
COLOR_CYAN="0x00FFFF"        # Informational
COLOR_MAGENTA="0xFF00FF"     # Step marker
COLOR_WHITE="0xFFFFFF"       # Text
COLOR_BLACK="0x000000"       # Background

# =============================================================================
# KINGDOM TECHNOLOGY BRANDING
# =============================================================================

OS_NAME="MillenniumOS"
OS_FULL_NAME="MillenniumOS — Kingdom Technology Operating System"
OS_VERSION="a-01.00"
OS_COPYRIGHT="© 2025-2026 CreativeWorkzStudio LLC"
OS_TAGLINE="Redeeming Technology for the Kingdom"
OS_SCRIPTURE="In the beginning God created the heaven and the earth. — Genesis 1:1"

# =============================================================================
# END CONFIGURATION
# =============================================================================
